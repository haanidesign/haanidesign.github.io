name: Notion sync

# Notion のデータベースを読んで lab/tools/task-calendar/data/notion.json に書き出す。
# Notion 側から通知を飛ばす方式（Webhook）は使わない。
# 受け口が常時起きているサーバーである必要があり、GitHub Pages にはそれが無いため。

on:
  schedule:
    # 毎朝1回。cron は UTC なので 21:00 UTC = 翌 6:00 JST。
    # （日本は夏時間が無いので年中ずれない）
    # 時刻を変えたいときはこの数字だけ直す。JST から9を引いた値が UTC。
    # 例: 7:00 JST → "0 22 * * *" / 8:00 JST → "0 23 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: # 手動でも回せる

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # 失敗したときに理由が一目で分かるよう、先に登録状況だけ出す。
      # 値そのものは出さない（長さと先頭だけ）。
      - name: Check secrets
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          ok=yes
          if [ -z "$NOTION_TOKEN" ]; then
            echo "✗ NOTION_TOKEN が未登録です（Settings → Secrets and variables → Actions）"
            ok=no
          else
            echo "✓ NOTION_TOKEN あり: ${#NOTION_TOKEN} 文字 / 先頭 $(echo "$NOTION_TOKEN" | cut -c1-4)"
          fi
          if [ -z "$NOTION_DATABASE_ID" ]; then
            echo "✗ NOTION_DATABASE_ID が未登録です"
            ok=no
          else
            echo "✓ NOTION_DATABASE_ID あり: ${#NOTION_DATABASE_ID} 文字"
          fi
          if [ "$ok" = "no" ]; then
            echo ""
            echo "名前は半角で、前後に空白が入っていないか確認してください。"
            exit 1
          fi

      - name: Fetch from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node .github/scripts/fetch-notion.mjs

      - name: Commit if changed
        run: |
          # 画像の置き場は、画像つきの予定が1件も無いと作られない。
          # 無いまま git add に渡すと pathspec で落ちるので、先に作っておく。
          mkdir -p images/schedule

          TARGETS="lab/tools/task-calendar/data data images/schedule"
          if [ -z "$(git status --porcelain $TARGETS)" ]; then
            echo "変更なし"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A $TARGETS
          git commit -m "Sync tasks from Notion"

          # 同期の最中に main が進んでいることがある。
          # そのままだと push が弾かれるので、取り込んでから やり直す。
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push が弾かれました。取り込んでから やり直します（$i 回目）"
            git pull --rebase origin main || exit 1
          done
          echo "3回やって push できませんでした"
          exit 1
