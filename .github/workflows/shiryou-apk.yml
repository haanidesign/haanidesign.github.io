name: shiryou apk

on:
  push:
    paths:
      - "android/shiryou-ita/**"
      - "lab/tools/shiryou-ita/**"
      - ".github/workflows/shiryou-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
        working-directory: android/shiryou-ita
      - uses: actions/upload-artifact@v4
        with:
          name: shiryou-ita-apk
          path: android/shiryou-ita/app/build/outputs/apk/debug/app-debug.apk
