<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ギャラリー — はぁにデザイン工房</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=17">
<style>
/* ===== 一覧 ===== */
.bs-wrap{max-width:1240px;margin:1rem auto;border:var(--bd);border-radius:18px;
  background:var(--paper);box-shadow:0 6px 0 var(--ink);overflow:hidden;}
.bs-bar{display:flex;align-items:center;gap:.7rem;
  padding:.7rem 1rem;background:var(--main);border-bottom:var(--bd);}
.bs-bar h1{font-size:1rem;}
.bs-bar .sp{margin-left:auto;}

.bs-grid{display:grid;gap:4px;padding:4px;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));}
.bs-cell{display:block;position:relative;aspect-ratio:1/1;
  background:var(--main-soft);cursor:zoom-in;overflow:hidden;}
.bs-cell img,.bs-cell video{width:100%;height:100%;object-fit:cover;
  transition:transform .25s ease, opacity .25s ease;}
.bs-cell video{pointer-events:none;}
.bs-cell:hover img,.bs-cell:hover video{transform:scale(1.04);opacity:.88;}

.bs-msg{padding:2.5rem 1rem;text-align:center;font-size:.85rem;color:var(--gray);}
.bs-more{display:flex;justify-content:center;padding:1.1rem 0 1.3rem;}

/* ===== 拡大 ===== */
.bs-box{position:fixed;inset:0;z-index:99;display:none;
  align-items:center;justify-content:center;padding:1.5rem;
  background:rgba(30,28,20,.85);}
.bs-box.on{display:flex;}
.bs-box img,.bs-box video{max-width:100%;max-height:84vh;
  border:var(--bd);border-radius:var(--r);background:var(--paper);}
.bs-box [hidden]{display:none;}
.bs-x{position:absolute;right:1rem;top:1rem;}
.bs-arrow{position:absolute;top:50%;transform:translateY(-50%);}
.bs-prev{left:1rem;} .bs-next{right:1rem;}
.bs-cap{position:absolute;left:0;right:0;bottom:.4rem;
  text-align:center;color:var(--main);font-size:.75rem;}
.bs-cap a{color:var(--main);text-decoration:underline;margin-left:.6rem;}

@media(max-width:700px){
  .bs-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:3px;padding:3px;}
  .bs-wrap{margin:.5rem;border-radius:14px;}
}
</style>
</head>
<body>

<div class="bs-wrap">
  <div class="bs-bar">
    <h1>ギャラリー</h1>
    <span class="sp"></span>
    <a href="index.html" class="btn btn-sm">もどる</a>
  </div>

  <div id="bs-grid" class="bs-grid"></div>
  <div id="bs-msg" class="bs-msg">読み込み中…</div>
  <div class="bs-more"><button id="bs-more" class="btn" hidden>もっと見る</button></div>
</div>

<div id="bs-box" class="bs-box">
  <button class="btn btn-sm bs-x" data-act="close">✕</button>
  <button class="btn btn-sm bs-arrow bs-prev" data-act="prev">‹</button>
  <button class="btn btn-sm bs-arrow bs-next" data-act="next">›</button>
  <img id="bs-box-img" alt="">
  <video id="bs-box-vid" controls loop playsinline hidden></video>
  <div id="bs-cap" class="bs-cap dot"></div>
</div>

<script>
(function(){
  'use strict';

  var HANDLE = 'haanidesign.bsky.social';
  var API    = 'https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed';
  var PAGE   = 40;
  var HLSJS  = 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js';

  var grid = document.getElementById('bs-grid');
  var msg  = document.getElementById('bs-msg');
  var more = document.getElementById('bs-more');
  var box  = document.getElementById('bs-box');
  var boxImg = document.getElementById('bs-box-img');
  var boxVid = document.getElementById('bs-box-vid');
  var cap  = document.getElementById('bs-cap');

  var cursor = null;
  var done = false, busy = false, again = false;
  var shots = [];
  var at = 0;
  var boxHls = null;
  var hlsReady = null;

  /* ---------- hls.js（要るときだけ 読む） ---------- */
  function loadHls(){
    if(hlsReady) return hlsReady;
    hlsReady = new Promise(function(ok, ng){
      var s = document.createElement('script');
      s.src = HLSJS;
      s.onload = ok;
      s.onerror = function(){ ng(new Error('hls.js を 読めません')); };
      document.head.appendChild(s);
    });
    return hlsReady;
  }
  // Android の Chrome は canPlayType に 「流せる」と 答えて おきながら
  // じつは 流せない。hls.js が 使えるなら そちらを 先に 使う。
  function nativeHls(v){
    return !!v.canPlayType('application/vnd.apple.mpegurl');
  }
  // video に 動画を つなぐ。片づけ用の 手を 返す
  function attach(v, playlist, onFail){
    var h = null, dead = false;
    loadHls().then(function(){
      if(dead) return;
      if(window.Hls && window.Hls.isSupported()){
        h = new window.Hls({ enableWorker:true, maxBufferLength:10 });
        h.on(window.Hls.Events.ERROR, function(_e, d){
          if(d && d.fatal && onFail) onFail(d.details || d.type);
        });
        h.loadSource(playlist);
        h.attachMedia(v);
      }else if(nativeHls(v)){
        v.src = playlist;
      }else{
        throw new Error('この ブラウザは 対応外');
      }
      v.play().catch(function(){});
    }).catch(function(err){
      if(dead) return;
      if(nativeHls(v)){ v.src = playlist; v.play().catch(function(){}); return; }
      console.error('[bsky] video', err, playlist);
      if(onFail) onFail(String(err.message || err));
    });

    return function(){
      dead = true;
      if(h){ h.destroy(); h = null; }
      v.pause();
      v.removeAttribute('src');
      v.load();
    };
  }

  /* ---------- 投稿から 中身を とり出す ---------- */
  function mediaOf(post){ return fromEmbed(post && post.embed); }
  function fromEmbed(e){
    if(!e) return [];
    var t = e.$type;
    if(t === 'app.bsky.embed.images#view'){
      return (e.images || []).map(function(im){
        return { kind:'image', thumb: im.thumb || im.fullsize,
                 full: im.fullsize || im.thumb, alt: im.alt || '' };
      });
    }
    if(t === 'app.bsky.embed.video#view'){
      return [{ kind:'video', thumb: e.thumbnail || '',
                playlist: e.playlist || '', alt: e.alt || '' }];
    }
    if(t === 'app.bsky.embed.recordWithMedia#view') return fromEmbed(e.media);
    return [];
  }

  function linkOf(post){
    var rkey = String(post.uri || '').split('/').pop();
    var who  = (post.author && post.author.handle) || HANDLE;
    return rkey ? 'https://bsky.app/profile/' + who + '/post/' + rkey : '';
  }

  /* ---------- 画面に 入った 動画だけ 動かす ----------
     上から 順に 入って くるので、新しい ものから 動く。 */
  var watcher = ('IntersectionObserver' in window)
    ? new IntersectionObserver(function(list){
        list.forEach(function(en){
          var v = en.target;
          if(en.isIntersecting){
            if(!v._off){
              v._off = attach(v, v.getAttribute('data-playlist'), function(){
                if(v._off){ v._off(); v._off = null; }   // だめなら 絵のまま
              });
            }
          }else if(v._off){
            v._off(); v._off = null;
          }
        });
      }, { rootMargin: '200px 0px' })
    : null;

  function cell(m){
    var i = shots.length;
    shots.push(m);

    var a = document.createElement('a');
    a.className = 'bs-cell';
    a.href = m.kind === 'video' ? (m.post || '#') : m.full;
    a.addEventListener('click', function(ev){ ev.preventDefault(); open(i); });

    if(m.kind === 'video' && m.playlist){
      var v = document.createElement('video');
      v.muted = true;                       // 音つきだと 勝手に 動かせない
      v.loop = true;
      v.playsInline = true;
      v.setAttribute('muted','');
      v.setAttribute('playsinline','');
      v.preload = 'none';
      v.poster = m.thumb || '';
      v.setAttribute('data-playlist', m.playlist);
      a.appendChild(v);
      if(watcher) watcher.observe(v);
      else v._off = attach(v, m.playlist, function(){});
    }else{
      var img = document.createElement('img');
      img.src = m.thumb;
      img.alt = m.alt || '';
      img.loading = 'lazy';
      img.decoding = 'async';
      a.appendChild(img);
    }
    return a;
  }

  /* ---------- 読み込み ---------- */
  function load(){
    if(busy || done) return;
    busy = true; again = false;
    more.disabled = true;

    var url = API + '?actor=' + encodeURIComponent(HANDLE)
            + '&limit=' + PAGE
            + '&filter=posts_with_media'
            + (cursor ? '&cursor=' + encodeURIComponent(cursor) : '');

    fetch(url)
      .then(function(r){
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(data){
        var feed = data.feed || [];
        cursor = data.cursor || null;
        if(!cursor) done = true;

        var added = 0;
        feed.forEach(function(item){
          if(item.reason) return;
          var post = item.post;
          if(!post) return;
          if(item.reply){
            var p = item.reply.parent;
            var pd = p && p.author && p.author.did;
            if(!pd || pd !== (post.author && post.author.did)) return;
          }
          var link = linkOf(post);
          mediaOf(post).forEach(function(m){
            if(!m.thumb && !m.playlist) return;
            m.post = link;
            grid.appendChild(cell(m));
            added++;
          });
        });

        if(!grid.children.length && done){
          msg.textContent = '画像つきの 投稿が まだ ありません。';
        }else if(grid.children.length){
          msg.hidden = true;
        }
        more.hidden = done;
        again = (!added && !done);
      })
      .catch(function(err){
        msg.hidden = false;
        msg.textContent = '読み込めませんでした（' + err.message + '）';
        more.hidden = true;
      })
      .then(function(){
        busy = false;
        more.disabled = false;
        if(again){ again = false; load(); }
      });
  }

  /* ---------- 拡大 ---------- */
  function caption(text, m){
    cap.textContent = (at + 1) + ' / ' + shots.length;
    if(text) cap.appendChild(document.createTextNode('　' + text));
    if(m && m.kind === 'video' && m.post){
      var a = document.createElement('a');
      a.href = m.post; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = 'Bluesky で 見る';
      cap.appendChild(a);
    }
  }

  function stopBox(){ if(boxHls){ boxHls(); boxHls = null; } }

  function open(i){ at = i; show(); box.classList.add('on');
    document.body.style.overflow = 'hidden'; }
  function close(){ stopBox(); box.classList.remove('on');
    boxImg.removeAttribute('src'); document.body.style.overflow = ''; }

  function show(){
    if(!shots.length) return;
    stopBox();
    at = (at + shots.length) % shots.length;
    var m = shots[at];
    caption('', m);

    if(m.kind === 'video' && m.playlist){
      boxImg.hidden = true;
      boxVid.hidden = false;
      boxVid.poster = m.thumb || '';
      boxVid.muted = false;
      boxHls = attach(boxVid, m.playlist, function(why){
        caption('動画を 流せません（' + why + '）', m);
      });
    }else{
      boxVid.hidden = true;
      boxImg.hidden = false;
      boxImg.src = m.full || m.thumb;
      boxImg.alt = m.alt || '';
    }
  }

  box.addEventListener('click', function(ev){
    var act = ev.target.getAttribute && ev.target.getAttribute('data-act');
    if(act === 'prev'){ at--; show(); return; }
    if(act === 'next'){ at++; show(); return; }
    if(act === 'close' || ev.target === box) close();
  });
  document.addEventListener('keydown', function(ev){
    if(!box.classList.contains('on')) return;
    if(ev.key === 'Escape') close();
    if(ev.key === 'ArrowLeft'){ at--; show(); }
    if(ev.key === 'ArrowRight'){ at++; show(); }
  });

  more.addEventListener('click', load);
  load();
})();
</script>

</body>
</html>
