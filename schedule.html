<style>
/* ============ スケジュール専用（見た目は style.css に合わせる） ============ */
.sch-head{
  display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; margin-bottom:1rem;
}
/* 月は数字で大きく。色は変えず、黄色にベタ影 */
.sch-en{
  display:inline-flex; align-items:baseline; gap:.1rem;
  font-size:3rem; line-height:1; font-weight:800; letter-spacing:-.02em;
  color:var(--main); text-shadow:0 3px 0 var(--ink);
  margin-right:.15rem;
}
.sch-en i{font-style:normal; font-size:1.2rem;}
.sch-year{font-size:.56rem; letter-spacing:.24em; color:var(--gray); line-height:1.4;}
.sch-year b{display:block; font-family:'DotGothic16',monospace; font-weight:400;
  font-size:1.15rem; letter-spacing:.06em; color:var(--ink);}
.sch-month{
  font-size:.72rem; font-weight:800; letter-spacing:.02em;
  background:var(--main-soft); border:2px solid var(--ink); border-radius:999px;
  box-shadow:0 2.5px 0 var(--ink); padding:.1rem .75rem;
}
.btn-circ{
  width:2.4rem; height:2.4rem; padding:0; border-radius:50%;
  font-size:1rem; line-height:1;
}
/* 今月の中身を数えたピル */
.sch-count{
  display:flex; gap:.4rem; flex-wrap:wrap; align-items:center;
  width:100%; margin:-.4rem 0 .9rem;
}
.cpill{
  display:inline-flex; align-items:center; gap:.35rem;
  font-size:.66rem; font-weight:700;
  background:var(--paper); border:2px solid var(--ink); border-radius:999px;
  box-shadow:0 2.5px 0 var(--ink); padding:.1rem .7rem;
}
.cpill b{font-family:'DotGothic16',monospace; font-weight:400; font-size:.86rem;}
.cpill .sw{width:11px; height:11px; border-radius:4px; border:2px solid var(--ink);}
.cpill.off{background:var(--cream); color:var(--gray);}
.sch-legend{
  display:flex; gap:.8rem; flex-wrap:wrap; align-items:center;
  margin-left:auto; font-size:.7rem; color:var(--gray);
}
.sch-legend b{display:inline-flex; align-items:center; gap:.3rem; font-weight:700; color:var(--ink);}
.lg-swatch{width:12px; height:12px; border-radius:4px; border:2px solid var(--ink); display:inline-block;}
.lg-off{
  width:12px; height:12px; border-radius:4px;
  border:2px solid var(--ink); display:inline-block;
  background:#EFEBD2;
  background-image:repeating-linear-gradient(-45deg,
    rgba(30,28,20,.16) 0 2px, transparent 2px 6px);
}

/* --- カレンダー --- */
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:.4rem;}
.cal .dow{
  text-align:center; font-size:.68rem; color:var(--gray);
  letter-spacing:.1em; padding-bottom:.25rem;
}
.cal .dow.sat,.cal .dow.sun{
  color:var(--ink); background:#EFEBD2;
  border:2px solid var(--ink); border-radius:999px;
}
.day{
  min-height:132px; border:2px solid var(--ink); border-radius:13px;
  background:var(--paper); padding:.3rem .35rem;
  display:flex; flex-direction:column; gap:.2rem; overflow:hidden;
}
/* 予定のある日は、ちょっと浮かせる */
.day.filled{box-shadow:0 3px 0 var(--ink);}
.day .top{display:flex; align-items:center; gap:.25rem;}
.day .cnt{
  margin-left:auto; font-family:'DotGothic16',monospace; font-weight:400;
  font-size:.5rem; color:var(--gray); letter-spacing:.04em;
}
.day .tdy{
  font-size:.5rem; font-weight:700; line-height:1.6;
  background:var(--ink); color:var(--main); border-radius:999px; padding:0 .45rem;
}
.day.out{opacity:.28; border-style:dashed; box-shadow:none;}
.day.past{background:#f4f2e6;}
/* 土日祝はお休み。背景を変えて、ひと目で分かるようにする */
/* お休み：平日（ほぼ白）より一段 沈めた 生成りに、斜線を 重ねる。
   地の色で ひと目 分かり、斜線で「閉まっている」ことを 足す。 */
.day.off{
  background:#EFEBD2;
  background-image:repeating-linear-gradient(-45deg,
    rgba(30,28,20,.10) 0 3px, transparent 3px 10px);
}
.day.off.past{
  background:#E6E2C9;
  background-image:repeating-linear-gradient(-45deg,
    rgba(30,28,20,.10) 0 3px, transparent 3px 10px);
}
.hol{
  font-size:.56rem; font-weight:700; color:var(--gray);
  line-height:1.4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.off-mark{
  margin-top:auto; align-self:flex-start;
  font-size:.52rem; font-weight:700; line-height:1.6; color:var(--gray);
  background:var(--paper); border:2px solid var(--ink); border-radius:999px;
  padding:0 .45rem;
}
.day.today{border:var(--bd); box-shadow:0 4px 0 var(--ink); background:var(--main-soft);}
.day.today .dnum{color:var(--ink);}
.day .dnum{font-family:'DotGothic16',monospace; font-weight:400; font-size:.94rem; flex:none; line-height:1.2;}
.day.sun .dnum,.day.sat .dnum{color:var(--ink);}
.day .dnum.is-today{
  display:inline-flex; align-items:center; justify-content:center;
  width:21px; height:21px; border-radius:50%; background:var(--ink); color:var(--main);
}
.ev{
  font-size:.62rem; font-weight:700; line-height:1.6;
  border:2px solid var(--ink); border-radius:999px;
  box-shadow:0 2px 0 var(--ink);
  padding:.02rem .45rem;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.more{font-size:.58rem; color:var(--gray);}

/* --- 画像つきの予定（Notion に画像があるときだけ） --- */
.card{
  border:2px solid var(--ink); border-radius:10px; overflow:hidden;
  background:var(--paper); box-shadow:0 2.5px 0 var(--ink);
}
.card-top{display:flex; align-items:center; gap:.2rem; padding:.05rem .25rem 0;}
.card .cat-badge{
  font-size:.52rem; font-weight:700; line-height:1.6;
  border:2px solid var(--ink); border-radius:999px; padding:0 .4rem;
  max-width:5.5em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.card .at{
  font-family:'DotGothic16',monospace; font-weight:400;
  font-size:.56rem; color:var(--gray); margin-left:auto;
}
.card img{
  width:100%; aspect-ratio:4/3; object-fit:cover; display:block;
  border-top:2px solid var(--ink); border-bottom:2px solid var(--ink);
  margin-top:.08rem; background:var(--main-soft);
}
.card.bsky{cursor:pointer;}
.card.bsky:hover{background:var(--main-soft);}
.card .n{
  font-size:.5rem; color:var(--gray); border:2px solid var(--ink);
  border-radius:999px; padding:0 .3rem; background:var(--cream);
}
.card .cap{
  display:block; font-size:.56rem; font-weight:700; line-height:1.5;
  padding:.05rem .25rem .1rem;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

/* --- 直近の予定リスト --- */
.up{list-style:none; margin:.4rem 0 0; padding:0;}
.up li{
  display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;
  background:var(--paper); border:var(--bd); border-radius:var(--r);
  box-shadow:0 3px 0 var(--ink);
  padding:.5rem .8rem; margin-bottom:.5rem;
}
.up .when{
  font-size:.78rem; font-weight:800; min-width:5.2em;
  background:var(--main-soft); border:2px solid var(--ink); border-radius:8px;
  padding:.05rem .5rem; text-align:center;
}
.up .what{flex:1 1 12rem; min-width:0; font-size:.86rem;}
.up .upthumb{
  width:76px; aspect-ratio:16/9; object-fit:cover; flex:none;
  border:2px solid var(--ink); border-radius:8px; background:var(--main-soft);
}
.up .uptime{font-size:.7rem; color:var(--gray);}
.up .cat{
  font-size:.66rem; border:2px solid var(--ink); border-radius:999px;
  padding:.02rem .6rem;
}
.holbar{
  margin-top:.8rem; font-size:.72rem; font-weight:700; color:var(--gray);
  display:flex; gap:.5rem; flex-wrap:wrap; align-items:center;
}
.holbar:empty{display:none;}
.holbar .hb-item{
  background:var(--cream); border:2px solid var(--ink); border-radius:999px; color:var(--ink);
  padding:.02rem .6rem;
}
.note{font-size:.76rem; color:var(--gray); font-weight:500; line-height:1.9;}
.sch-empty{text-align:center; color:var(--gray); font-size:.82rem; padding:2rem 0;}
.updated{font-size:.66rem; color:var(--gray); font-weight:500;}

@media (max-width:640px){
  .cal{gap:.22rem;}
  .day{min-height:72px; padding:.22rem .24rem; gap:.14rem; border-radius:9px;}
  .day .cnt,.day .tdy{display:none;}
  .sch-en{font-size:1.7rem;}
  .cpill{font-size:.6rem;}
  /* 幅が40px台しかなく、文字を出しても読めないので色帯だけにする。
     予定の中身は下の「これからの予定」で読んでもらう。 */
  .ev{
    font-size:0; line-height:0; height:7px; padding:0;
    border-width:1.5px; border-radius:4px;
  }
  .more{font-size:0; line-height:0; height:7px;}
  /* 幅が足りないので、画像だけ見せて文字は下のリストで読んでもらう */
  .card{box-shadow:none;}
  .card-top,.card .cap{display:none;}
  .card img{border-top:0; border-bottom:0; margin-top:0;}
  .hol{display:none;}
  .off-mark{font-size:.54rem;}
  .sch-legend{margin-left:0; width:100%; font-size:.66rem;}
  .up .when{min-width:4.6em; font-size:.74rem;}
}
</style>

<script>
/* =========================================================================
   閲覧専用のカレンダー。
   このページからは書き込めない（保存先を一切持たない）。
   中身は data/schedule.json だけを読む。
   そのファイルは GitHub Actions が Notion から作っている。
   ========================================================================= */
const FEED = "data/schedule.json";

/* Bluesky に その日 出した 画像も 枡に 並べる。
   ギャラリー（bsky.html）と同じ 公開APIで、誰でも 読める ぶんだけ。
   取ってくるのは 画像つきの 投稿だけで、他人への 返信と ひろい上げは のぞく。 */
const BSKY_HANDLE = "haanidesign.bsky.social";
const BSKY_API = "https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed";
const BSKY_PAGES = 6;          // 1回に さかのぼる 上限（1ページ100件）
let bskyPosts = [];            // 画面に出す形にしたもの
let bskyOldest = null;         // どこまで さかのぼったか
let bskyCursor = null, bskyDone = false, bskyBusy = false;

/* カテゴリーの色。決め打ちせず、名前から安定して選ぶ。
   Notion 側でカテゴリーを増やしても、勝手に色が付く。 */
/* メインの黄色を軸に、濃さと温度だけ変えて並べる。
   差し色のピンクは1つだけ混ぜる（青系・紫系は使わない）。 */
const PALETTE = ["#E1DD60","#B8B43F","#F2F0BE","#F2A0B8","#CFC97E","#EFE9BE","#C9B85A"];
function colorOf(name){
  if(!name) return "#EDEBDD";
  let h = 0;
  for(const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 100000;
  return PALETTE[h % PALETTE.length];
}

const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
/* =========================================================================
   日本の祝日。毎年書き換えなくていいよう計算で出す。
   振替休日（日曜と重なったら次の平日）と、
   祝日に挟まれた平日の国民の休日（シルバーウィーク）まで見ている。
   ※ 法改正や五輪のような一度きりの移動は反映されない。
      その年だけずれるときは Notion に予定として書いて上書きしてください。
   ========================================================================= */
function nthMonday(y, m, n){
  const first = new Date(y, m-1, 1).getDay();   // 0=日
  return 1 + ((8 - first) % 7) + (n-1)*7;
}
function equinox(y, spring){
  // 1900〜2099 で使える近似式
  const base = spring ? 20.8431 : 23.2488;
  return Math.floor(base + 0.242194*(y-1980) - Math.floor((y-1980)/4));
}
const holidayCache = {};
function holidaysOf(y){
  if(holidayCache[y]) return holidayCache[y];
  const h = {};
  const k = (m,d) => y+"-"+pad(m)+"-"+pad(d);
  const put = (m,d,name) => { h[k(m,d)] = name; };

  put(1, 1, "元日");
  put(1, nthMonday(y,1,2), "成人の日");
  put(2, 11, "建国記念の日");
  put(2, 23, "天皇誕生日");
  put(3, equinox(y,true), "春分の日");
  put(4, 29, "昭和の日");
  put(5, 3, "憲法記念日");
  put(5, 4, "みどりの日");
  put(5, 5, "こどもの日");
  put(7, nthMonday(y,7,3), "海の日");
  put(8, 11, "山の日");
  put(9, nthMonday(y,9,3), "敬老の日");
  put(9, equinox(y,false), "秋分の日");
  put(10, nthMonday(y,10,2), "スポーツの日");
  put(11, 3, "文化の日");
  put(11, 23, "勤労感謝の日");

  // 振替休日
  for(const key of Object.keys(h)){
    const [yy,mm,dd] = key.split("-").map(Number);
    if(new Date(yy,mm-1,dd).getDay() !== 0) continue;
    const n = new Date(yy,mm-1,dd);
    do { n.setDate(n.getDate()+1); }
    while(h[ymd(n)]);
    h[ymd(n)] = "振替休日";
  }

  // 国民の休日（祝日に挟まれた平日）
  for(const key of Object.keys({...h})){
    const [yy,mm,dd] = key.split("-").map(Number);
    const mid  = new Date(yy,mm-1,dd+1);
    const next = new Date(yy,mm-1,dd+2);
    if(h[ymd(next)] && !h[ymd(mid)] && mid.getDay()!==0 && mid.getDay()!==6){
      h[ymd(mid)] = "国民の休日";
    }
  }

  holidayCache[y] = h;
  return h;
}
const holidayName = d => holidaysOf(d.getFullYear())[ymd(d)] || null;

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WDAY = ["日","月","火","水","木","金","土"];

let tasks = [];
let syncedAt = null;
let anchor = new Date();

const $ = s => document.querySelector(s);

/* 今日（時刻を落として比較用に） */
function today0(){
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}

/* 画面に出す一覧。Notion の予定＋Bluesky に出した絵。
   同じ日に両方あれば、予定を先に、絵をあとに並べる。 */
function allTasks(){
  return tasks.concat(bskyPosts);
}

function onDay(key){
  return allTasks().filter(t => t.date === key);
}

function render(){
  const y = anchor.getFullYear(), m = anchor.getMonth();
  $("#month").textContent = `${y}年 ${m+1}月`;
  $("#monthEn").textContent = m + 1;
  $("#yearNum").textContent = y;

  const first = new Date(y, m, 1);
  const start = new Date(first);
  start.setDate(1 - first.getDay());          // 日曜はじまり（サイトの読者向け）

  const cells = [];
  for(let i=0;i<42;i++){
    const d = new Date(start);
    d.setDate(start.getDate()+i);
    if(i>=35 && d.getMonth()!==m) break;
    cells.push(d);
  }

  const t0 = today0();
  const todayKey = ymd(t0);

  const dow = WDAY.map((w,i)=>
    `<div class="dow${i===0?" sun":i===6?" sat":""}">${w}</div>`).join("");

  const body = cells.map(d => {
    const key = ymd(d);
    const out = d.getMonth() !== m;
    const past = d < t0;
    const list = onDay(key);
    // 画像つきは背が高いので、その日に画像があるときは2件までにする
    const shown = list.slice(0, list.some(t => t.image) ? 2 : 3);
    const wd = d.getDay();

    // 土日と祝日はお休み
    const hol = holidayName(d);
    const off = wd === 0 || wd === 6 || !!hol;

    return `<div class="day${out?" out":""}${list.length&&!out?" filled":""}${past?" past":""}${off?" off":""}${key===todayKey?" today":""}${wd===0?" sun":wd===6?" sat":""}" ${hol?`title="${esc(hol)}"`:""}>
      <div class="top">
        <span class="dnum${key===todayKey?" is-today":""}">${d.getDate()}</span>
        ${key===todayKey ? '<span class="tdy">TODAY</span>' : ""}
        ${list.length && !out ? `<span class="cnt">${list.length} ITEM</span>` : ""}
      </div>
      ${hol ? `<div class="hol">${esc(hol)}</div>` : ""}
      ${shown.map(t => t.image
        ? `<${t.url && t.bsky ? "a" : "div"} class="card${t.bsky ? " bsky" : ""}"${t.url && t.bsky ? ` href="${esc(t.url)}" target="_blank" rel="noopener"` : ""} title="${esc(t.title)}">
             <div class="card-top">
               ${t.category ? `<span class="cat-badge" style="background:${colorOf(t.category)}">${esc(t.category)}</span>` : ""}
               ${t.count > 1 ? `<span class="n dot">${t.count}枚</span>` : ""}
               ${t.time ? `<span class="at">${esc(t.time)}</span>` : ""}
             </div>
             <img src="${esc(t.image)}" alt="" loading="lazy">
             <span class="cap">${esc(t.title)}</span>
           </${t.url && t.bsky ? "a" : "div"}>`
        : `<div class="ev" style="background:${colorOf(t.category)}" title="${esc(t.title)}">${esc(t.title)}</div>`
      ).join("")}
      ${list.length>shown.length ? `<div class="more">ほか${list.length-shown.length}件</div>` : ""}
      ${off && !out ? '<span class="off-mark">休</span>' : ""}
    </div>`;
  }).join("");

  $("#cal").innerHTML = dow + body;

  // 凡例（この月に出ているカテゴリーだけ）
  const cats = [...new Set(
    allTasks().filter(t=>{
      if(!t.date) return false;
      const d = new Date(t.date.slice(0,4), Number(t.date.slice(5,7))-1, t.date.slice(8,10));
      return d.getFullYear()===y && d.getMonth()===m;
    }).map(t=>t.category).filter(Boolean)
  )];
  $("#legend").innerHTML =
    cats.map(c=>`<b><span class="lg-swatch" style="background:${colorOf(c)}"></span>${esc(c)}</b>`).join("") +
    '<b><span class="lg-off"></span>お休み（土日祝）</b>';

  // 今月の中身を数えて、上に並べる
  const ofMonth = allTasks().filter(t => {
    const d = new Date(t.date.slice(0,4), Number(t.date.slice(5,7))-1, t.date.slice(8,10));
    return d.getFullYear()===y && d.getMonth()===m;
  });
  const byCat = new Map();
  for(const t of ofMonth){
    const k = t.category || "その他";
    byCat.set(k, (byCat.get(k)||0) + 1);
  }
  const days = new Set(ofMonth.map(t => t.date)).size;
  const offDays = cells.filter(d => d.getMonth()===m &&
    (d.getDay()===0 || d.getDay()===6 || holidayName(d))).length;
  $("#count").innerHTML =
    [...byCat.entries()].map(([k,n]) =>
      `<span class="cpill"><span class="sw" style="background:${colorOf(k)}"></span>${esc(k)} <b>${n}</b> 件</span>`).join("") +
    (ofMonth.length ? `<span class="cpill">予定のある日 <b>${days}</b> 日</span>` : "") +
    `<span class="cpill off">お休み <b>${offDays}</b> 日</span>`;

  // 狭い画面ではセルに祝日名が入らないので、下にも並べておく
  const hs = holidaysOf(y);
  const items = Object.keys(hs)
    .filter(k => Number(k.slice(5,7)) === m+1)
    .sort()
    .map(k => `<span class="hb-item">${Number(k.slice(5,7))}/${Number(k.slice(8,10))} ${esc(hs[k])}</span>`);
  $("#holbar").innerHTML = items.length ? "今月の祝日　" + items.join("") : "";
}

function renderUpcoming(){
  const t0 = today0();
  const list = tasks
    .filter(t => t.date && new Date(t.date.slice(0,4), Number(t.date.slice(5,7))-1, t.date.slice(8,10)) >= t0)
    .sort((a,b)=>a.date.localeCompare(b.date))
    .slice(0,8);

  if(list.length === 0){
    $("#upcoming").innerHTML = '<li style="justify-content:center; color:var(--gray)">これからの予定はまだありません</li>';
    return;
  }

  $("#upcoming").innerHTML = list.map(t => {
    const d = new Date(t.date.slice(0,4), Number(t.date.slice(5,7))-1, t.date.slice(8,10));
    return `<li>
      <span class="when">${d.getMonth()+1}/${d.getDate()}(${WDAY[d.getDay()]})</span>
      ${t.image ? `<img class="upthumb" src="${esc(t.image)}" alt="" loading="lazy">` : ""}
      <span class="what">${esc(t.title)}${t.time ? ` <span class="uptime dot">${esc(t.time)}</span>` : ""}</span>
      ${t.category ? `<span class="cat" style="background:${colorOf(t.category)}">${esc(t.category)}</span>` : ""}
    </li>`;
  }).join("");
}

/* 埋め込みの 形が 何通りか あるので ならす（bsky.html と同じ） */
function bskyImages(post){
  const e = post && post.embed;
  if(!e) return [];
  if(e.$type === "app.bsky.embed.images#view") return e.images || [];
  if(e.$type === "app.bsky.embed.recordWithMedia#view"){
    const m = e.media;
    if(m && m.$type === "app.bsky.embed.images#view") return m.images || [];
  }
  return [];
}

/* 日本時間の 日付と 時こくに 直す（投稿の 時刻は UTC で来る） */
function jst(iso){
  const d = new Date(iso);
  const j = new Date(d.getTime() + 9*3600*1000);
  return {
    date: j.toISOString().slice(0,10),
    time: j.toISOString().slice(11,16),
  };
}

async function loadBsky(){
  if(bskyBusy || bskyDone) return;
  bskyBusy = true;
  try{
    for(let i=0; i<BSKY_PAGES && !bskyDone; i++){
      const url = BSKY_API + "?actor=" + encodeURIComponent(BSKY_HANDLE)
                + "&limit=100&filter=posts_with_media"
                + (bskyCursor ? "&cursor=" + encodeURIComponent(bskyCursor) : "");
      const res = await fetch(url);
      if(!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      bskyCursor = data.cursor || null;
      if(!bskyCursor) bskyDone = true;

      for(const item of (data.feed || [])){
        if(item.reason) continue;                       // 他の人の 投稿の ひろい上げ
        const post = item.post;
        if(!post) continue;
        if(item.reply){                                 // 他の人への 返信は のぞく
          const pd = item.reply.parent?.author?.did;
          if(!pd || pd !== post.author?.did) continue;
        }
        const imgs = bskyImages(post);
        if(!imgs.length) continue;
        const when = jst(post.record?.createdAt || post.indexedAt);
        if(!bskyOldest || when.date < bskyOldest) bskyOldest = when.date;
        const text = (post.record?.text || "").split("\n")[0].trim();
        const rkey = String(post.uri || "").split("/").pop();
        bskyPosts.push({
          id: "bsky:" + post.cid,
          date: when.date,
          time: when.time,
          title: text || "Bluesky に出した絵",
          category: "投稿",
          image: imgs[0].thumb || imgs[0].fullsize,
          count: imgs.length,
          url: `https://bsky.app/profile/${post.author?.handle || BSKY_HANDLE}/post/${rkey}`,
          bsky: true,
        });
      }
    }
  }catch(e){
    // 読めなくても カレンダーは 出す
    console.error("Bluesky を 読めませんでした: " + e.message);
  }
  bskyBusy = false;
}

async function load(){
  try{
    const res = await fetch(FEED + "?t=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error(String(res.status));
    const feed = await res.json();
    tasks = (feed.tasks || []).filter(t => t.date);   // 日付のないものは載せない
    syncedAt = feed.syncedAt || null;
  }catch(e){
    tasks = [];
  }

  render();
  renderUpcoming();

  // 絵は あとから 足す（Bluesky が 重くても カレンダーは 先に 出す）
  await loadBsky();
  render();

  $("#note").innerHTML =
    '色の付いた帯はその日の予定です。画像のある予定はそのまま絵で出ます。灰色は過ぎた日。' +
    '<br><b>斜線の日は土日祝のお休み</b>です。祝日は名前を添えています。' +
    (syncedAt ? `<br><span class="updated">最終更新: ${new Date(syncedAt).toLocaleString("ja-JP",{year:"numeric",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}</span>` : "");
}

$("#prev").addEventListener("click", () => {
  anchor = new Date(anchor.getFullYear(), anchor.getMonth()-1, 1); render();
});
$("#next").addEventListener("click", () => {
  anchor = new Date(anchor.getFullYear(), anchor.getMonth()+1, 1); render();
});
$("#thisMonth").addEventListener("click", () => { anchor = new Date(); render(); });

load();

/* ページ上部へ戻る（他ページと同じ挙動） */
const toTop = document.getElementById('toTop');
const onScroll = () => toTop.classList.toggle('show', window.scrollY > 400);
window.addEventListener('scroll', onScroll, {passive:true});
onScroll();
toTop.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
</script>
