<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAANI LAB｜はぁにデザイン工房</title>
<meta name="description" content="AIと一緒に作った制作ツールと遊びものを、全部ここに並べています。どれもブラウザだけで動きます。">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* はぁにデザイン工房と同じ世界観（黄色・太枠・ハードシャドウ・ドット地） */
:root{
  --main:#E1DD60;
  --main-deep:#B8B43F;
  --main-soft:#F2F0BE;
  --cream:#FBFAEC;
  --paper:#FFFEF7;
  --ink:#1E1C14;
  --gray:#8A8470;
  --bd:2.5px solid var(--ink);
  --r:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; color:var(--ink);
  font-family:'M PLUS Rounded 1c','Noto Sans JP',sans-serif; font-weight:700;
  background-color:var(--cream);
  background-image:radial-gradient(circle, rgba(30,28,20,.13) 1.5px, transparent 1.6px);
  background-size:16px 16px;
  line-height:1.8; -webkit-font-smoothing:antialiased;
}
img{display:block; max-width:100%}
a{color:inherit}

/* ---------------- ボタン ---------------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
  background:var(--paper); color:var(--ink);
  border:var(--bd); border-radius:var(--r);
  padding:.6rem 1.1rem; font:inherit; font-weight:700; font-size:.82rem;
  box-shadow:0 3px 0 var(--ink); cursor:pointer; text-decoration:none;
  transition:transform .08s, box-shadow .08s, background .15s;
}
.btn:hover{transform:translateY(-2px); box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(3px); box-shadow:0 0 0 var(--ink)}
.btn-y{background:var(--main)}
.btn-g{background:var(--ink); color:var(--main)}
.btn-sm{padding:.38rem .8rem; font-size:.72rem; box-shadow:0 2px 0 var(--ink)}

/* ---------------- アプリ窓 ---------------- */
.app{
  max-width:1240px; margin:1rem auto;
  border:var(--bd); border-radius:18px; background:var(--paper);
  box-shadow:0 6px 0 var(--ink); overflow:hidden;
}
.titlebar{
  background:var(--main); border-bottom:var(--bd);
  padding:.7rem .9rem; display:flex; align-items:center; gap:.7rem; flex-wrap:wrap;
}
.tb-title{font-size:1rem; font-weight:800; letter-spacing:.06em}
.tb-spec{
  font-size:.62rem; color:var(--ink); background:var(--paper);
  border:2px solid var(--ink); border-radius:999px; padding:.1rem .6rem;
}
.tb-actions{margin-left:auto; display:flex; gap:.5rem; flex-wrap:wrap}
.app-body{padding:1.1rem}

/* ---------------- リード＋メーター ---------------- */
.lead{margin:.2rem 0 1rem; font-size:.86rem; line-height:1.9}
.meters{display:flex; gap:.6rem; flex-wrap:wrap; margin-bottom:1.1rem}
.meter{
  background:var(--main-soft); border:var(--bd); border-radius:var(--r);
  box-shadow:0 3px 0 var(--ink); padding:.5rem .9rem; min-width:104px;
}
.meter b{display:block; font-size:1.5rem; line-height:1.2; letter-spacing:.02em}
.meter span{font-size:.6rem; color:var(--gray); letter-spacing:.12em}
.meter.ok b{color:#2f7d3f; font-size:1.1rem; padding-top:.32rem}

/* ---------------- 検索・タブ ---------------- */
.ctl{display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; margin-bottom:1.1rem}
#q{
  flex:1 1 220px; min-width:0;
  background:var(--paper); border:var(--bd); border-radius:var(--r);
  box-shadow:0 3px 0 var(--ink);
  padding:.6rem .9rem; font:inherit; font-weight:700; font-size:.82rem; color:var(--ink);
}
#q:focus{outline:none; background:#fff}
#q::placeholder{color:var(--gray); font-weight:700}
.tabs{display:flex; gap:.5rem; flex-wrap:wrap}
.tab{
  background:var(--paper); border:var(--bd); border-radius:999px;
  box-shadow:0 3px 0 var(--ink);
  padding:.42rem .95rem; font:inherit; font-weight:700; font-size:.75rem; cursor:pointer;
  transition:transform .08s, box-shadow .08s, background .15s;
}
.tab:hover{transform:translateY(-2px); box-shadow:0 5px 0 var(--ink)}
.tab.on{background:var(--main)}
.tab i{font-style:normal; font-size:.62rem; color:var(--gray); margin-left:.35rem}
.tab.on i{color:var(--ink)}

/* ---------------- カード ---------------- */
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; align-items:start}
.card{
  display:block; text-decoration:none; color:inherit;
  background:var(--paper); border:var(--bd); border-radius:16px;
  box-shadow:0 5px 0 var(--ink); overflow:hidden;
  transition:transform .1s, box-shadow .1s;
}
.card:hover{transform:translateY(-3px); box-shadow:0 8px 0 var(--ink)}
.card .shot{
  width:100%; aspect-ratio:3/2; object-fit:cover;
  background:var(--main-soft); border-bottom:var(--bd);
}
.card .body{padding:.75rem .9rem 1rem}
.no{
  display:flex; align-items:center; gap:.45rem;
  font-size:.66rem; color:var(--gray); letter-spacing:.1em;
}
.dot{width:8px; height:8px; border-radius:50%; border:2px solid var(--ink); background:#3aa757}
.dot.wip{background:#e0b93c}
.dot.broken{background:#d9534f}
.card h2{font-size:.95rem; font-weight:800; margin:.25rem 0 .35rem; line-height:1.55}
.card p{margin:0; font-size:.74rem; font-weight:500; color:#5c5847; line-height:1.75}
.tags{display:flex; flex-wrap:wrap; gap:.3rem; margin-top:.6rem}
.tags span{
  font-size:.62rem; background:var(--main-soft);
  border:2px solid var(--ink); border-radius:999px; padding:.08rem .55rem;
}
.empty{grid-column:1/-1; text-align:center; padding:3rem 0; color:var(--gray); font-size:.82rem}

/* ---------------- フッター ---------------- */
.foot{
  max-width:1240px; margin:0 auto 2.4rem; padding:1rem;
  display:flex; gap:.8rem; align-items:center; justify-content:center; flex-wrap:wrap;
  font-size:.68rem; color:var(--gray);
}

@media (max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:600px){
  .app{margin:.6rem; border-radius:14px}
  .app-body{padding:.9rem}
  .grid{grid-template-columns:1fr}
  #q{flex:1 1 100%}
  .tabs{width:100%}
  .tb-actions{width:100%; margin-left:0}
}
</style>
</head>
<body>

<div class="app">
  <div class="titlebar">
    <div class="tb-title">HAANI LAB</div>
    <span class="tb-spec">つくった道具と遊びもの</span>
    <div class="tb-actions">
      <a href="../" class="btn btn-sm">← 工房トップ</a>
      <a href="https://x.com/haanidesign" target="_blank" rel="noopener" class="btn btn-sm btn-g">X @haanidesign</a>
    </div>
  </div>

  <div class="app-body">
    <p class="lead">AIと一緒に作った制作ツールと遊びものを、全部ここに並べています。<br>どれもブラウザだけで動きます。</p>

    <div class="meters">
      <div class="meter"><b id="sTools">—</b><span>TOOLS</span></div>
      <div class="meter"><b id="sCats">—</b><span>CATEGORIES</span></div>
      <div class="meter" id="mStatus"><b id="sStatus">—</b><span>STATUS</span></div>
    </div>

    <div class="ctl">
      <input id="q" type="search" placeholder="タイトル・タグで検索" autocomplete="off">
      <div class="tabs" id="tabs"></div>
    </div>

    <div class="grid" id="grid"></div>
  </div>
</div>

<footer class="foot">
  <span>© 2026 はぁにデザイン工房</span>
  <a href="../" class="btn btn-sm">工房トップ</a>
  <a href="../price.html" class="btn btn-sm">料金表</a>
</footer>

<script src="data.js"></script>
<script>
const $ = s => document.querySelector(s);
let cat = "all", q = "";

/* ---- メーター ---- */
(function stats(){
  $("#sTools").textContent = String(TOOLS.length).padStart(2,"0");
  $("#sCats").textContent  = String(new Set(TOOLS.map(t=>t.cat)).size).padStart(2,"0");
  const el = $("#sStatus");
  if(TOOLS.every(t=>t.status==="live")){ el.textContent="ALL LIVE"; $("#mStatus").classList.add("ok"); }
  else { el.textContent = TOOLS.filter(t=>t.status==="live").length + "/" + TOOLS.length; }
})();

/* ---- タブ ---- */
function countOf(key){ return key==="all" ? TOOLS.length : TOOLS.filter(t=>t.cat===key).length; }
$("#tabs").innerHTML = CATEGORIES
  .filter(c => countOf(c.key) > 0)
  .map(c => `<button class="tab${c.key==="all"?" on":""}" data-k="${c.key}">${c.label}<i>${countOf(c.key)}</i></button>`)
  .join("");
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if(!b) return;
  cat = b.dataset.k;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t === b));
  render();
});

/* ---- 検索 ---- */
$("#q").addEventListener("input", e => { q = e.target.value.trim().toLowerCase(); render(); });

/* ---- 描画 ---- */
function match(t){
  if(cat !== "all" && t.cat !== cat) return false;
  if(!q) return true;
  return (t.title + " " + t.desc + " " + t.tags.join(" ")).toLowerCase().includes(q);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const list = TOOLS.filter(match);
  $("#grid").innerHTML = list.length ? list.map(t => `
    <a class="card" href="${esc(t.url)}" target="_blank" rel="noopener">
      <img class="shot" src="${esc(t.thumb)}" alt="" loading="lazy">
      <div class="body">
        <div class="no">No.${String(t.no).padStart(3,"0")}<span class="dot ${esc(t.status)}"></span></div>
        <h2>${esc(t.title)}</h2>
        <p>${esc(t.desc)}</p>
        <div class="tags">${t.tags.map(g=>`<span>${esc(g)}</span>`).join("")}</div>
      </div>
    </a>`).join("") : `<div class="empty">該当するツールがありません</div>`;
}
render();
</script>
</body>
</html>
