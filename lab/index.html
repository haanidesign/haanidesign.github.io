<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAANI LAB — 制作ツール置き場</title>
<meta name="description" content="AIと一緒に作った制作ツールを、全部ここに並べています。">
<style>
:root{
  --bg:#f5f5f0;
  --card:#ffffff;
  --ink:#1c1c1a;
  --dim:#767469;
  --line:#e3e2da;
  --acc:#c8503c;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,sans-serif;
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;
}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* ---------- header ---------- */
header{border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:22px 0;flex-wrap:wrap}
.logo{font-family:var(--mono);font-size:19px;letter-spacing:.22em;font-weight:700;margin:0}
.logo b{color:var(--acc)}
.hd a.x{font-family:var(--mono);font-size:12px;color:var(--dim);text-decoration:none;letter-spacing:.06em}
.hd a.x:hover{color:var(--acc)}

/* ---------- lead + stats ---------- */
.lead{padding:40px 0 4px;font-size:16px;color:#3c3a35;max-width:34em}
.stats{display:flex;gap:40px;padding:26px 0 34px;flex-wrap:wrap}
.stat .n{font-family:var(--mono);font-size:30px;line-height:1.1;letter-spacing:-.02em}
.stat .n.ok{color:#2f8a4d;font-size:22px;letter-spacing:.08em}
.stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;margin-top:4px}

/* ---------- controls ---------- */
.ctl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-bottom:20px}
#q{
  flex:1 1 240px;min-width:0;background:#fff;border:1px solid var(--line);border-radius:3px;
  padding:10px 13px;font-size:14px;font-family:inherit;color:var(--ink);
}
#q:focus{outline:none;border-color:var(--acc)}
#q::placeholder{color:#a9a79c}
.tabs{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.tab{
  background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;
  font-size:13px;font-family:inherit;color:var(--dim);cursor:pointer;white-space:nowrap;
}
.tab:hover{border-color:#c9c7bb;color:var(--ink)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab i{font-style:normal;font-family:var(--mono);font-size:11px;opacity:.65;margin-left:6px}

/* ---------- grid ---------- */
.grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:22px;
  padding-bottom:64px;
}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);gap:18px}}
@media(max-width:600px){
  .grid{grid-template-columns:1fr;gap:16px}
  .wrap{padding:0 16px}
  .stats{gap:26px}
  .lead{padding-top:28px;font-size:15px}
  .ctl{gap:12px}
  #q{flex:1 1 100%}
  .tabs{width:100%}
  .tab{padding:6px 12px;font-size:12.5px}
}
.card{
  display:block;background:var(--card);border:1px solid var(--line);border-radius:5px;
  overflow:hidden;text-decoration:none;color:inherit;
  box-shadow:0 1px 2px rgba(28,28,26,.05);
  transition:transform .16s ease,box-shadow .16s ease;
}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(28,28,26,.10)}
.card .shot{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;background:#eceae1;border-bottom:1px solid var(--line)}
.card .body{padding:14px 16px 16px}
.no{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.1em}
.dot{width:7px;height:7px;border-radius:50%;background:#2f8a4d;flex:none}
.dot.wip{background:#d8a017}
.dot.broken{background:#c23b3b}
.card h2{font-size:15.5px;margin:6px 0 5px;line-height:1.45}
.card p{margin:0;font-size:13px;color:var(--dim);line-height:1.65}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.tags span{font-size:11px;color:#5f5d54;background:#f2f1e9;border:1px solid var(--line);border-radius:3px;padding:2px 7px}
.empty{grid-column:1/-1;padding:56px 0;text-align:center;color:var(--dim);font-size:14px}

footer{border-top:1px solid var(--line);padding:22px 0 40px;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.08em}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <h1 class="logo">HAANI<b>LAB</b></h1>
    <a class="x" href="https://x.com/haanidesign" target="_blank" rel="noopener">X / @haanidesign</a>
  </div>
</header>

<main class="wrap">
  <p class="lead">AIと一緒に作った制作ツールを、全部ここに並べています。<br>どれもブラウザだけで動きます。</p>

  <div class="stats">
    <div class="stat"><div class="n" id="sTools">—</div><div class="k">Tools</div></div>
    <div class="stat"><div class="n" id="sCats">—</div><div class="k">Categories</div></div>
    <div class="stat"><div class="n" id="sStatus">—</div><div class="k">Status</div></div>
  </div>

  <div class="ctl">
    <input id="q" type="search" placeholder="タイトル・タグで検索" autocomplete="off">
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="grid" id="grid"></div>
</main>

<footer class="wrap">© HAANI DESIGN</footer>

<script src="data.js"></script>
<script>
const $ = s => document.querySelector(s);
let cat = "all", q = "";

/* ---- stats ---- */
(function stats(){
  $("#sTools").textContent = String(TOOLS.length).padStart(2,"0");
  $("#sCats").textContent  = String(new Set(TOOLS.map(t=>t.cat)).size).padStart(2,"0");
  const el = $("#sStatus");
  if(TOOLS.every(t=>t.status==="live")){ el.textContent="ALL LIVE"; el.classList.add("ok"); }
  else { el.textContent = TOOLS.filter(t=>t.status==="live").length + "/" + TOOLS.length; }
})();

/* ---- tabs ---- */
function countOf(key){ return key==="all" ? TOOLS.length : TOOLS.filter(t=>t.cat===key).length; }
$("#tabs").innerHTML = CATEGORIES
  .filter(c => countOf(c.key) > 0)
  .map(c => `<button class="tab${c.key==="all"?" on":""}" data-k="${c.key}">${c.label}<i>${countOf(c.key)}</i></button>`)
  .join("");
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if(!b) return;
  cat = b.dataset.k;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t === b));
  render();
});

/* ---- search ---- */
$("#q").addEventListener("input", e => { q = e.target.value.trim().toLowerCase(); render(); });

/* ---- render ---- */
function match(t){
  if(cat !== "all" && t.cat !== cat) return false;
  if(!q) return true;
  return (t.title + " " + t.desc + " " + t.tags.join(" ")).toLowerCase().includes(q);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const list = TOOLS.filter(match);
  $("#grid").innerHTML = list.length ? list.map(t => `
    <a class="card" href="${esc(t.url)}" target="_blank" rel="noopener">
      <img class="shot" src="${esc(t.thumb)}" alt="" loading="lazy">
      <div class="body">
        <div class="no">No.${String(t.no).padStart(3,"0")}<span class="dot ${esc(t.status)}"></span></div>
        <h2>${esc(t.title)}</h2>
        <p>${esc(t.desc)}</p>
        <div class="tags">${t.tags.map(g=>`<span>${esc(g)}</span>`).join("")}</div>
      </div>
    </a>`).join("") : `<div class="empty">該当するツールがありません</div>`;
}
render();
</script>
</body>
</html>
