  </defs>

  <rect width="600" height="400" fill="#FBFAEC"/>
  <rect width="600" height="400" fill="url(#dots)"/>

  <!-- 重なった紙 -->
  <g stroke="#1E1C14" stroke-width="2.5" fill="#FFFEF7">
