<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="アニメ工房">
  <defs>
    <pattern id="ak-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.5" fill="rgba(30,28,20,.13)"/>
    </pattern>
    <pattern id="ak-dots-s" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="5.5" cy="5.5" r="1.2" fill="rgba(30,28,20,.13)"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#FBFAEC"/>
  <rect width="600" height="400" fill="url(#ak-dots)"/>

  <g font-family="'M PLUS Rounded 1c',sans-serif" font-weight="700" fill="#1E1C14">

    <!-- ===== スマホ本体 ===== -->
    <rect x="196" y="22" width="208" height="356" rx="22" fill="#FFFEF7" stroke="#1E1C14" stroke-width="3.5"/>

    <!-- 上のバー -->
    <path d="M196 44a22 22 0 0 1 22-22h164a22 22 0 0 1 22 22v22H196z" fill="#E1DD60"/>
    <line x1="196" y1="66" x2="404" y2="66" stroke="#1E1C14" stroke-width="3"/>
    <text x="212" y="52" font-size="13" font-weight="800">アニメ工房</text>
    <rect x="292" y="38" width="70" height="17" rx="8.5" fill="#1E1C14"/>
    <text x="327" y="51" font-size="9" fill="#E1DD60" text-anchor="middle" font-family="monospace">1080×1920</text>
    <circle cx="378" cy="46" r="9" fill="#FFFEF7" stroke="#1E1C14" stroke-width="2"/>
    <text x="378" y="50" font-size="10" text-anchor="middle">↶</text>

    <!-- ステージ -->
    <rect x="196" y="66" width="208" height="176" fill="#FBFAEC"/>
    <rect x="196" y="66" width="208" height="176" fill="url(#ak-dots-s)"/>
    <!-- アートボード（たて9:16） -->
    <rect x="256" y="76" width="88" height="156" fill="#FFFEF7" stroke="#1E1C14" stroke-width="2.5"/>

    <!-- キャラ（かんたんな立ち絵） -->
    <ellipse cx="300" cy="120" rx="23" ry="25" fill="#F2F0BE" stroke="#1E1C14" stroke-width="2.5"/>
    <path d="M277 116c2-16 12-24 23-24s21 8 23 24c-6-6-14-9-23-9s-17 3-23 9z" fill="#1E1C14"/>
    <circle cx="292" cy="122" r="2.6" fill="#1E1C14"/>
    <circle cx="308" cy="122" r="2.6" fill="#1E1C14"/>
    <path d="M296 131q4 4 8 0" stroke="#1E1C14" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M300 145v46" stroke="#1E1C14" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M300 156l-17 13M300 156l17 13" stroke="#1E1C14" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M300 191l-13 26M300 191l13 26" stroke="#1E1C14" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- 選択わく＋ハンドル -->
    <rect x="270" y="90" width="60" height="62" fill="none" stroke="#FFFEF7" stroke-width="4"/>
    <rect x="270" y="90" width="60" height="62" fill="none" stroke="#1E1C14" stroke-width="2"/>
    <line x1="300" y1="90" x2="300" y2="76" stroke="#1E1C14" stroke-width="2"/>
    <circle cx="300" cy="74" r="6" fill="#F2A0B8" stroke="#1E1C14" stroke-width="2"/>
    <circle cx="330" cy="152" r="6" fill="#E1DD60" stroke="#1E1C14" stroke-width="2"/>
    <!-- 回転じく -->
    <circle cx="300" cy="121" r="6" fill="#E1DD60" stroke="#1E1C14" stroke-width="2"/>
    <path d="M292 121h16M300 113v16" stroke="#1E1C14" stroke-width="2"/>

    <line x1="196" y1="242" x2="404" y2="242" stroke="#1E1C14" stroke-width="3"/>

    <!-- レイヤー一覧 -->
    <rect x="196" y="242" width="208" height="88" fill="#FFFEF7"/>
    <g stroke="#1E1C14" stroke-width="2">
      <rect x="204" y="249" width="192" height="24" rx="8" fill="#E1DD60"/>
      <rect x="204" y="277" width="192" height="24" rx="8" fill="#FFFEF7"/>
      <rect x="204" y="305" width="192" height="20" rx="8" fill="#FFFEF7"/>
      <rect x="228" y="252" width="18" height="18" rx="4" fill="#F2F0BE"/>
      <rect x="228" y="280" width="18" height="18" rx="4" fill="#F2F0BE"/>
      <rect x="228" y="307" width="18" height="15" rx="4" fill="#F2F0BE"/>
    </g>
    <g font-size="9.5">
      <text x="212" y="266" fill="#8A8470">⠿</text>
      <text x="252" y="266">まえがみ</text>
      <text x="212" y="294" fill="#8A8470">⠿</text>
      <text x="252" y="294">かお</text>
      <text x="212" y="320" fill="#8A8470">⠿</text>
      <text x="252" y="320">からだ</text>
    </g>
    <g font-size="10">
      <text x="384" y="266" text-anchor="middle">👁</text>
      <text x="384" y="294" text-anchor="middle">👁</text>
      <text x="384" y="320" text-anchor="middle">👁</text>
    </g>
    <line x1="196" y1="330" x2="404" y2="330" stroke="#1E1C14" stroke-width="3"/>

    <!-- 下のツールバー -->
    <path d="M196 330h208v26a22 22 0 0 1-22 22H218a22 22 0 0 1-22-22z" fill="#FBFAEC"/>
    <g stroke="#1E1C14" stroke-width="2">
      <rect x="203" y="337" width="36" height="34" rx="10" fill="#E1DD60"/>
      <rect x="242" y="337" width="36" height="34" rx="10" fill="#FFFEF7"/>
      <rect x="281" y="337" width="36" height="34" rx="10" fill="#FFFEF7"/>
      <rect x="320" y="337" width="36" height="34" rx="10" fill="#FFFEF7"/>
      <rect x="359" y="337" width="36" height="34" rx="10" fill="#FFFEF7"/>
    </g>
    <g font-size="13" text-anchor="middle">
      <text x="221" y="356">＋</text><text x="260" y="356">◎</text>
      <text x="299" y="356">🔗</text><text x="338" y="356">✂</text><text x="377" y="356">⚙</text>
    </g>
    <g font-size="6.5" fill="#8A8470" text-anchor="middle">
      <text x="221" y="366">ついか</text><text x="260" y="366">じく</text>
      <text x="299" y="366">おやこ</text><text x="338" y="366">クリップ</text><text x="377" y="366">せってい</text>
    </g>

    <!-- ===== 左の説明 ===== -->
    <text x="26" y="86" font-size="26" font-weight="800">アニメ工房</text>
    <rect x="26" y="98" width="128" height="20" rx="10" fill="#1E1C14"/>
    <text x="90" y="112" font-size="10" fill="#E1DD60" text-anchor="middle" font-family="monospace">PSD / PNG / JPEG</text>
    <g font-size="12" fill="#5c5843" font-weight="700">
      <text x="26" y="146">スマホで つくる</text>
      <text x="26" y="166">アニメーション</text>
    </g>
    <g stroke="#1E1C14" stroke-width="2">
      <rect x="26" y="186" width="146" height="26" rx="9" fill="#FFFEF7"/>
      <rect x="26" y="218" width="146" height="26" rx="9" fill="#FFFEF7"/>
      <rect x="26" y="250" width="146" height="26" rx="9" fill="#FFFEF7"/>
    </g>
    <g font-size="10.5">
      <text x="38" y="203">◆ ピンで うごかす</text>
      <text x="38" y="235">◎ 回転じくで まげる</text>
      <text x="38" y="267">▶ MP4 で かきだす</text>
    </g>

    <!-- ===== 右のサイズ ===== -->
    <g stroke="#1E1C14" stroke-width="2.5">
      <rect x="432" y="150" width="26" height="46" rx="3" fill="#E1DD60"/>
      <rect x="466" y="158" width="30" height="30" rx="3" fill="#F2F0BE"/>
      <rect x="504" y="162" width="46" height="26" rx="3" fill="#F2F0BE"/>
    </g>
    <g font-size="9" text-anchor="middle" fill="#5c5843">
      <text x="445" y="210">たて</text>
      <text x="481" y="210">ましかく</text>
      <text x="527" y="210">よこ</text>
    </g>
  </g>
</svg>
