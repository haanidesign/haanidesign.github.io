    <rect x="28" y="34" width="544" height="334" rx="18" fill="#1E1C14"/>
    <rect x="20" y="26" width="544" height="334" rx="18" fill="#FFFEF7"/>

    <!-- 上バー -->
    <path d="M20 44 a18 18 0 0 1 18 -18 h508 a18 18 0 0 1 18 18 v28 H20 Z" fill="#E1DD60"/>
    <rect x="470" y="34" width="78" height="30" rx="9" fill="#1E1C14"/>

    <!-- ひだりの 道具 -->
    <g fill="#FFFEF7">
      <rect x="32" y="84" width="58" height="34" rx="9"/>
      <rect x="32" y="126" width="58" height="34" rx="9"/>
      <rect x="32" y="210" width="58" height="34" rx="9"/>
      <rect x="32" y="252" width="58" height="34" rx="9"/>
    </g>
    <rect x="32" y="168" width="58" height="34" rx="9" fill="#E1DD60"/>

    <!-- まん中の 絵 -->
    <rect x="104" y="84" width="304" height="176" rx="12" fill="#FFFEF7"/>
    <rect x="104" y="84" width="304" height="176" rx="12" fill="#E1DD60" opacity=".3"/>
    <circle cx="176" cy="136" r="26" fill="#F2A0B8"/>
    <path d="M104 226 q56 -50 110 -14 q48 32 98 -22 q40 -40 96 -4 v62 q0 12 -12 12 H116 q-12 0 -12 -12 Z" fill="#B8B43F"/>
    <rect x="176" y="196" width="160" height="40" rx="10" fill="#E1DD60"/>

    <!-- みぎの せってい -->
    <rect x="422" y="84" width="126" height="176" rx="12" fill="#FBFAEC"/>
    <g fill="none" stroke-linecap="round">
      <line x1="438" y1="116" x2="532" y2="116"/>
      <line x1="438" y1="150" x2="532" y2="150"/>
      <line x1="438" y1="184" x2="532" y2="184"/>
      <line x1="438" y1="218" x2="532" y2="218"/>
    </g>
    <g fill="#E1DD60">
      <circle cx="472" cy="116" r="10"/><circle cx="510" cy="150" r="10"/>
      <circle cx="454" cy="184" r="10"/><circle cx="496" cy="218" r="10"/>
    </g>

    <!-- 下の タイムライン -->
    <rect x="32" y="274" width="516" height="72" rx="12" fill="#FBFAEC"/>
    <rect x="44" y="284" width="118" height="24" rx="7" fill="#fbe2ea"/>
    <rect x="170" y="284" width="150" height="24" rx="7" fill="#E1DD60"/>
    <rect x="328" y="284" width="120" height="24" rx="7" fill="#FFFEF7"/>
    <rect x="44" y="314" width="196" height="24" rx="7" fill="#eceabf"/>
    <rect x="248" y="314" width="150" height="24" rx="7" fill="#FFFEF7"/>
  </g>
  <g stroke="rgba(30,28,20,.55)" stroke-width="3">
    <line x1="60" y1="320" x2="60" y2="332"/><line x1="76" y1="317" x2="76" y2="335"/>
    <line x1="92" y1="321" x2="92" y2="331"/><line x1="108" y1="315" x2="108" y2="337"/>
    <line x1="124" y1="320" x2="124" y2="332"/><line x1="140" y1="317" x2="140" y2="335"/>
    <line x1="156" y1="322" x2="156" y2="330"/><line x1="172" y1="316" x2="172" y2="336"/>
    <line x1="188" y1="320" x2="188" y2="332"/><line x1="204" y1="318" x2="204" y2="334"/>
    <line x1="220" y1="322" x2="220" y2="330"/>
  </g>
  <!-- 再生位置 -->
  <g>
    <line x1="258" y1="274" x2="258" y2="346" stroke="#F2A0B8" stroke-width="6"/>
    <path d="M244 274 h28 v14 l-14 11 l-14 -11 Z" fill="#F2A0B8" stroke="#1E1C14" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <!-- 指 -->
  <g stroke="#1E1C14" stroke-width="5" stroke-linejoin="round" fill="#FFFEF7">
