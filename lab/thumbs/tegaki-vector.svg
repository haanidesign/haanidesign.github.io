    <rect x="334" y="58" width="232" height="286" rx="14" fill="#FFFEF7" stroke="#1E1C14" stroke-width="4"/>
    <g fill="none" stroke="#1E1C14" stroke-width="4.5" stroke-linecap="round">
      <path d="M375 304 C372 214 407 152 449 158 C493 164 521 214 523 302"/>
      <path d="M486 116 C486 137 470 155 450 155 C429 154 413 136 414 116 C415 96 431 80 451 81 C471 82 487 97 486 118"/>
      <path d="M411 231 C440 227 462 234 490 229"/>
    </g>
  </g>

  <g font-family="'M PLUS Rounded 1c','Noto Sans JP',sans-serif" font-weight="800" text-anchor="middle">
    <text x="150" y="378" font-size="22" fill="#8A8470">きっちり</text>
    <text x="450" y="378" font-size="22" fill="#1E1C14">手書き風</text>
  </g>
