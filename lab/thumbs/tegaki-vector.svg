    <g fill="#B8B43F">
      <circle cx="78" cy="300" r="6"/><circle cx="222" cy="300" r="6"/>
      <circle cx="150" cy="156" r="6"/><circle cx="150" cy="82" r="6"/>
    </g>
  </g>

  <!-- 矢印 -->
  <g transform="translate(300,200)">
    <circle r="30" fill="#E1DD60" stroke="#1E1C14" stroke-width="4"/>
    <path d="M-12 0 H10 M2 -9 L12 0 L2 9" fill="none" stroke="#1E1C14" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
