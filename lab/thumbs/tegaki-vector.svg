    <rect x="34" y="58" width="232" height="286" rx="14" fill="#FFFEF7" stroke="#1E1C14" stroke-width="4"/>
    <g fill="none" stroke="#1E1C14" stroke-width="4" stroke-linecap="round">
      <path d="M78 300 C78 210 108 156 150 156 C192 156 222 210 222 300"/>
      <circle cx="150" cy="118" r="36"/>
      <path d="M112 232 H188"/>
