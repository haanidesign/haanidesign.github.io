<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <pattern id="d" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.5" fill="rgba(30,28,20,.13)"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="#FBFAEC"/>
  <rect width="600" height="400" fill="url(#d)"/>

  <!-- 左：きっちりしたベクター線 -->
