<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.5" fill="rgba(30,28,20,.13)"/>
    </pattern>
    <clipPath id="ball"><circle cx="300" cy="196" r="118"/></clipPath>
  </defs>

  <rect width="600" height="400" fill="#FBFAEC"/>
  <rect width="600" height="400" fill="url(#dots)"/>

  <!-- 球 -->
  <g clip-path="url(#ball)">
    <circle cx="300" cy="196" r="118" fill="#FFFEF7"/>
    <!-- 経線 -->
    <g stroke="#B8B43F" stroke-width="3" fill="none">
      <path d="M300 78 v236"/>
      <ellipse cx="300" cy="196" rx="40" ry="118"/>
      <ellipse cx="300" cy="196" rx="80" ry="118"/>
    </g>
    <!-- 緯線 -->
    <g stroke="#B8B43F" stroke-width="3" fill="none">
      <path d="M182 196 h236"/>
      <path d="M196 138 q104 -26 208 0"/>
      <path d="M196 254 q104 26 208 0"/>
    </g>
    <!-- 切り出している 範囲 -->
    <path d="M258 150 q42 -12 84 0 v92 q-42 12 -84 0 z" fill="#E1DD60" fill-opacity=".75"/>
  </g>
  <circle cx="300" cy="196" r="118" fill="none" stroke="#1E1C14" stroke-width="6"/>

  <!-- 切り出した 四角 -->
  <g transform="translate(430,120)">
    <rect x="0" y="0" width="120" height="120" rx="10" fill="#E1DD60" stroke="#1E1C14" stroke-width="6"/>
    <path d="M22 60 h76 M60 22 v76" stroke="#1E1C14" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- 矢印（球 → 四角、四角 → 球） -->
  <g stroke="#1E1C14" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M398 152 h20"/>
    <path d="M410 144 l10 8 -10 8"/>
    <path d="M418 236 h-20"/>
    <path d="M406 228 l-10 8 10 8"/>
  </g>

  <!-- 見出し -->
  <rect x="40" y="36" width="196" height="44" rx="22" fill="#1E1C14"/>
  <text x="138" y="66" text-anchor="middle" font-family="'M PLUS Rounded 1c',sans-serif"
        font-weight="700" font-size="24" fill="#E1DD60">ぐるり 360°</text>
  <text x="40" y="352" font-family="'M PLUS Rounded 1c',sans-serif" font-weight="700"
        font-size="20" fill="#1E1C14">まうえも ましたも、ゆがまずに 描ける</text>
</svg>
