  <rect x="208" y="52" width="184" height="196" fill="none" stroke="#1E1C14" stroke-width="2"/>
  <circle cx="254" cy="290" r="10" fill="#FFAC03" stroke="#1E1C14" stroke-width="2.5"/>
  <text x="272" y="297" font-family="DotGothic16, monospace" font-size="20" fill="#1E1C14">#FFAC03</text>

