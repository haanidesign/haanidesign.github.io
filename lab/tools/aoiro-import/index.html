<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>レシート仕訳 | HAANI LAB</title>
<link rel="icon" type="image/png" href="../../../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=DotGothic16&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.2.0/encoding.min.js"></script>
<style>
:root{
  --main:#E1DD60; --main-deep:#B8B43F; --main-soft:#F2F0BE;
  --cream:#FBFAEC; --paper:#FFFEF7; --ink:#1E1C14; --gray:#8A8470; --pink:#F2A0B8;
  --bd:2.5px solid var(--ink); --r:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'M PLUS Rounded 1c',sans-serif;font-weight:700;color:var(--ink);
  background-color:var(--cream);
  background-image:radial-gradient(circle, rgba(30,28,20,.13) 1.5px, transparent 1.6px);
  background-size:16px 16px;line-height:1.7;-webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.dot{font-family:'DotGothic16',monospace;font-weight:400;}
svg.i{width:1.15em;height:1.15em;flex:none;fill:none;}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* タイトルバー */
.bar{
  position:sticky;top:0;z-index:5;
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
  background:var(--main);border-bottom:var(--bd);padding:.55rem 16px;
}
.bar h1{font-size:1rem;font-weight:800;display:flex;align-items:center;gap:.4rem;}
.bar .sp{flex:1;}
.back{font-size:.7rem;color:var(--ink);text-decoration:none;
  background:var(--paper);border:2px solid var(--ink);border-radius:100px;padding:.05rem .6rem;}

main{max-width:1180px;margin:0 auto;padding:1rem 16px 4rem;display:grid;gap:1rem;}
main>*{min-width:0;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  background:var(--paper);color:var(--ink);border:var(--bd);border-radius:var(--r);
  padding:.55rem 1rem;font:inherit;font-size:.82rem;box-shadow:0 3px 0 var(--ink);
  cursor:pointer;transition:transform .08s,box-shadow .08s,background .15s;white-space:nowrap;
}
.btn:hover{background:var(--main);}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 3px 0 var(--ink);}
.btn-y{background:var(--main);}
.btn-g{background:var(--ink);color:var(--main);}
.btn-g:hover{background:var(--ink);color:#fff;}
.btn-sm{padding:.3rem .65rem;font-size:.72rem;box-shadow:0 2.5px 0 var(--ink);}
.btn-ic{padding:.3rem;border-radius:9px;box-shadow:0 2.5px 0 var(--ink);}

.panel{background:var(--paper);border:var(--bd);border-radius:var(--r);box-shadow:0 3px 0 var(--ink);padding:.9rem;}
.title{display:inline-block;background:var(--ink);color:var(--main);border-radius:100px;padding:.1rem .8rem;font-size:.68rem;margin-bottom:.6rem;}
.hint{background:var(--main-soft);border:2px dashed var(--ink);border-radius:10px;padding:.5rem .7rem;font-size:.72rem;font-weight:400;color:#5c5843;}
.hint b{font-weight:700;color:var(--ink);}
.warnbox{background:#FBE3EA;border:2px solid var(--ink);border-radius:10px;padding:.5rem .7rem;font-size:.74rem;display:flex;gap:.5rem;align-items:flex-start;}

/* 設定 */
details.panel>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:.4rem;font-size:.85rem;}
details.panel>summary::-webkit-details-marker{display:none;}
details.panel>summary .chev{margin-left:auto;font-size:.7rem;color:var(--gray);}
details[open].panel>summary{margin-bottom:.7rem;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.7rem;}
label.f{display:grid;gap:.2rem;font-size:.7rem;}
label.f small{font-weight:400;color:var(--gray);font-size:.64rem;line-height:1.4;}
input,select{
  font:inherit;font-size:.8rem;font-weight:700;color:var(--ink);
  background:var(--paper);border:2px solid var(--ink);border-radius:9px;padding:.35rem .5rem;width:100%;min-width:0;
}
input:focus,select:focus{outline:none;background:#fff;box-shadow:0 0 0 3px var(--main);}

/* ドロップ */
.drop{
  border:3px dashed var(--ink);border-radius:16px;background:var(--paper);
  padding:1.6rem 1rem;text-align:center;display:grid;gap:.6rem;justify-items:center;
  transition:background .15s;
}
.drop.over{background:var(--main-soft);}
.drop .big{font-size:1rem;font-weight:800;display:flex;align-items:center;gap:.4rem;}
.drop .row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;}
.drop small{font-size:.68rem;font-weight:400;color:var(--gray);}

/* ファイル */
.files{display:flex;gap:.5rem;flex-wrap:wrap;}
.fchip{display:flex;align-items:center;gap:.35rem;font-size:.7rem;
  background:var(--cream);border:2px solid var(--ink);border-radius:100px;padding:.1rem .6rem .1rem .3rem;max-width:100%;}
.fchip img,.fchip .ph{width:26px;height:26px;border-radius:6px;border:2px solid var(--ink);object-fit:cover;background:var(--main-soft);display:grid;place-items:center;font-size:.5rem;}
.fchip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:14rem;}
.fchip.run{background:var(--main-soft);}
.fchip.done{background:var(--main);}
.fchip.err{background:var(--pink);}

/* 表 */
.tools{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.6rem;}
.tools .sum{margin-left:auto;font-size:.74rem;}
.tools .sum b{font-family:'DotGothic16',monospace;font-weight:400;font-size:1rem;}
.tblwrap{overflow-x:auto;border:2px solid var(--ink);border-radius:10px;background:var(--cream);}
table{border-collapse:collapse;width:100%;min-width:1040px;font-size:.74rem;}
th{background:var(--ink);color:var(--main);font-size:.66rem;text-align:left;padding:.35rem .4rem;white-space:nowrap;}
td{border-top:2px solid var(--ink);padding:.3rem .3rem;vertical-align:middle;background:var(--paper);}
tr.flag td{background:#FDF0F3;}
td input,td select{font-size:.74rem;padding:.25rem .35rem;border-radius:7px;}
td select{min-width:4.6rem;}
td.num input{text-align:right;font-family:'DotGothic16',monospace;font-weight:400;font-size:.86rem;}
td.thumb img{width:38px;height:38px;object-fit:cover;border:2px solid var(--ink);border-radius:7px;cursor:zoom-in;display:block;}
td.thumb .ph{width:38px;height:38px;border:2px solid var(--ink);border-radius:7px;display:grid;place-items:center;font-size:.55rem;background:var(--main-soft);}
.kind{font-size:.62rem;border:2px solid var(--ink);border-radius:100px;padding:0 .45rem;white-space:nowrap;}
.kind.sales{background:var(--main);}
.kind.exp{background:var(--cream);}
.note{font-size:.62rem;font-weight:400;color:#8a3550;margin-top:.15rem;line-height:1.35;}
.empty{padding:1.4rem;text-align:center;font-size:.78rem;color:var(--gray);background:var(--paper);}

/* プレビュー */
.pv{position:fixed;inset:0;background:rgba(30,28,20,.55);display:none;place-items:center;z-index:20;padding:16px;}
.pv.on{display:grid;}
.pv img{max-width:100%;max-height:90vh;border:var(--bd);border-radius:var(--r);background:#fff;}

.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--main);
  border-radius:100px;padding:.4rem 1rem;font-size:.78rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:calc(100% - 32px);}
.toast.on{opacity:1;}

@media (max-width:640px){
  .bar h1{font-size:.9rem;}
  .tools .sum{margin-left:0;width:100%;}
}
</style>
</head>
<body>

<header class="bar">
  <a class="back" href="../../index.html">LAB</a>
  <h1><span id="ic-doc"></span>レシート仕訳</h1>
  <span class="sp"></span>
  <button class="btn btn-g btn-sm" id="exportBtn" disabled><span data-ic="dl"></span>弥生用CSV</button>
</header>

<main>

  <details class="panel" id="setBox">
    <summary><span data-ic="gear"></span>設定<span class="chev" id="setState"></span></summary>
    <div class="grid">
      <label class="f">Claude APIキー
        <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off">
        <small>このブラウザの中にだけ保存。画像は Anthropic の API にだけ送られる。</small>
      </label>
      <label class="f">モデル
        <select id="model">
          <option value="claude-opus-5">Claude Opus 5（精度重視）</option>
          <option value="claude-sonnet-5">Claude Sonnet 5（安め）</option>
        </select>
      </label>
      <label class="f">自分の名前・屋号
        <input id="myName" placeholder="例: はぁにデザイン">
        <small>請求書が「出したもの（売上）」か「もらったもの（経費）」かの見分けに使う。</small>
      </label>
      <label class="f">消費税
        <select id="taxMode">
          <option value="exempt">免税事業者（税区分は空欄）</option>
          <option value="taxable">課税事業者（税込経理）</option>
        </select>
      </label>
      <label class="f">現金で払ったとき（貸方）
        <input id="acCash" list="acList">
      </label>
      <label class="f">カードで払ったとき（貸方）
        <input id="acCard" list="acList">
      </label>
      <label class="f">口座から払ったとき（貸方）
        <input id="acBank" list="acList">
      </label>
      <label class="f">請求書で後払い（貸方）
        <input id="acBill" list="acList">
      </label>
    </div>
  </details>

  <section class="drop" id="drop">
    <div class="big"><span data-ic="up"></span>レシート・領収書・請求書をここへ</div>
    <div class="row">
      <button class="btn btn-y" id="pickBtn"><span data-ic="add"></span>ファイルを選ぶ</button>
      <button class="btn" id="camBtn"><span data-ic="cam"></span>カメラで撮る</button>
    </div>
    <small>写真（JPG・PNG）と PDF。何枚でも まとめて 入れられる。</small>
    <input type="file" id="pick" accept="image/*,application/pdf" multiple hidden>
    <input type="file" id="cam" accept="image/*" capture="environment" hidden>
  </section>

  <div class="files" id="files"></div>

  <section class="panel">
    <span class="title">仕訳</span>
    <div class="tools">
      <button class="btn btn-sm" id="addBtn"><span data-ic="add"></span>行を足す</button>
      <button class="btn btn-sm" id="clearBtn"><span data-ic="del"></span>ぜんぶ消す</button>
      <div class="sum">経費 <b id="sumExp">0</b> 円 ／ 売上 <b id="sumSales">0</b> 円 ／ <b id="cnt">0</b> 件</div>
    </div>
    <div class="tblwrap">
      <table>
        <thead><tr>
          <th></th><th>種類</th><th>日付</th><th>取引先</th><th>内容（摘要）</th>
          <th>借方</th><th>貸方</th><th>金額（税込）</th><th>税率</th><th>税区分</th><th>源泉</th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <div class="hint">
    <b>弥生への入れ方</b>：「弥生用CSV」で保存 → やよいの青色申告 オンライン → 「設定」の中の「弥生データのインポート」→ 保存したファイルを選ぶ。<br>
    はじめは 1〜2 件だけで 試して、取り込まれ方（科目・税区分）を 確かめてから まとめて入れると 安心。<br>
    読み取りは まちがうことが ある。ピンクの行は とくに 金額と日付を 見なおす。
  </div>

</main>

<datalist id="acList"></datalist>
<datalist id="taxList"></datalist>

<div class="pv" id="pv"><img alt=""></div>
<div class="toast" id="toast"></div>

<script type="module">
import Anthropic from "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.128.0/+esm";

/* ============ 定数 ============ */
const ACCOUNTS=[
  "旅費交通費","通信費","消耗品費","接待交際費","会議費","新聞図書費","支払手数料","広告宣伝費",
  "水道光熱費","地代家賃","外注工賃","荷造運賃","租税公課","修繕費","福利厚生費","諸会費",
  "車両費","研修費","減価償却費","工具器具備品","雑費",
  "売上高","雑収入","売掛金","未払金","現金","普通預金","事業主借","事業主貸"
];
const TAX_LABELS=[
  "課対仕入内10%","課対仕入内軽減8%","課対仕入内10%区分80%","課対仕入内軽減8%区分80%",
  "課対仕入内10%区分50%","課対仕入内軽減8%区分50%","非課仕入","対象外",
  "課税売上内10%","課税売上内軽減8%","非課税売上"
];
const RATES={"10":"10%","8":"8%","exempt":"非課税","none":"対象外"};
const LS="aoiroImport.v1";

/* ============ 状態 ============ */
const load=()=>{try{return JSON.parse(localStorage.getItem(LS))||{};}catch{return {};}};
const saved=load();
const S={
  apiKey:saved.apiKey||"", model:saved.model||"claude-opus-5", myName:saved.myName||"",
  taxMode:saved.taxMode||"exempt",
  acCash:saved.acCash||"事業主借", acCard:saved.acCard||"未払金",
  acBank:saved.acBank||"普通預金", acBill:saved.acBill||"未払金",
  memory:saved.memory||{}   // 取引先 → 借方科目
};
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S));}catch{}};
let rows=[];   // 仕訳の行
let files=[];  // 入れたファイル
let seq=0;

/* ============ 見た目の小物 ============ */
const $=s=>document.querySelector(s);
const ic=(k,cls="")=>`<svg class="i ${cls}" viewBox="0 0 24 24">${window.ICON[k]||""}</svg>`;
document.querySelectorAll("[data-ic]").forEach(e=>e.outerHTML=ic(e.dataset.ic));
$("#ic-doc").outerHTML=ic("doc");
$("#acList").innerHTML=ACCOUNTS.map(a=>`<option value="${a}">`).join("");
$("#taxList").innerHTML=TAX_LABELS.map(a=>`<option value="${a}">`).join("");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tt;
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2600);};
const yen=n=>(Math.round(n)||0).toLocaleString("ja-JP");

/* ============ 設定 ============ */
for(const k of ["apiKey","model","myName","taxMode","acCash","acCard","acBank","acBill"]){
  const el=$("#"+k); el.value=S[k];
  el.addEventListener("change",()=>{S[k]=el.value.trim();save();setState();if(k==="taxMode"){rows.forEach(r=>{if(!r.taxEdited)r.tax=autoTax(r);});render();}});
}
const setState=()=>{$("#setState").textContent=S.apiKey?"APIキー あり":"APIキーを 入れてください";};
setState();
if(!S.apiKey) $("#setBox").open=true;

/* ============ 税区分 ============ */
function autoTax(r,side="main"){
  if(S.taxMode==="exempt") return "";
  if(r.kind==="sales"){
    return {"10":"課税売上内10%","8":"課税売上内軽減8%","exempt":"非課税売上","none":"対象外"}[r.rate]||"対象外";
  }
  if(r.rate==="exempt") return "非課仕入";
  if(r.rate==="none") return "対象外";
  const base=r.rate==="8"?"課対仕入内軽減8%":"課対仕入内10%";
  if(/^T\d{13}$/.test((r.regno||"").replace(/[-\s]/g,""))) return base;
  // 登録番号なし: 経過措置（2026/9/30 まで 80%、2026/10/1 から 50%）
  return base+(r.date>="2026-10-01"?"区分50%":"区分80%");
}

/* ============ ファイル入力 ============ */
$("#pickBtn").onclick=()=>$("#pick").click();
$("#camBtn").onclick=()=>$("#cam").click();
$("#pick").onchange=e=>{addFiles(e.target.files);e.target.value="";};
$("#cam").onchange=e=>{addFiles(e.target.files);e.target.value="";};
const drop=$("#drop");
["dragenter","dragover"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over");}));
["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("over");}));
drop.addEventListener("drop",e=>addFiles(e.dataTransfer.files));

function addFiles(list){
  if(!S.apiKey){ $("#setBox").open=true; $("#apiKey").focus(); toast("さきに APIキーを 入れてください"); return; }
  for(const f of list){
    if(!(f.type.startsWith("image/")||f.type==="application/pdf")) continue;
    const it={id:++seq,file:f,name:f.name,state:"wait",thumb:f.type.startsWith("image/")?URL.createObjectURL(f):""};
    files.push(it);
  }
  renderFiles(); pump();
}

function renderFiles(){
  $("#files").innerHTML=files.map(f=>{
    const st={wait:"",run:"run",done:"done",err:"err"}[f.state];
    const mark=f.state==="run"?ic("load","spin"):f.state==="done"?ic("ok"):f.state==="err"?ic("warn"):"";
    const th=f.thumb?`<img src="${f.thumb}" alt="">`:`<span class="ph">PDF</span>`;
    return `<span class="fchip ${st}" title="${esc(f.err||f.name)}">${th}<span class="nm">${esc(f.name)}</span>${mark}</span>`;
  }).join("");
}

/* 2 枚ずつ 読む */
let running=0;
function pump(){
  while(running<2){
    const f=files.find(x=>x.state==="wait"); if(!f) break;
    running++; f.state="run"; renderFiles();
    readOne(f).then(()=>{f.state="done";}).catch(err=>{
      f.state="err"; f.err=String(err?.message||err); toast(`${f.name}: ${f.err}`); console.error(err);
    }).finally(()=>{running--;renderFiles();pump();});
  }
}

/* 画像は 長辺 1600px の JPEG に 縮める */
async function toBlock(file){
  if(file.type==="application/pdf"){
    return {type:"document",source:{type:"base64",media_type:"application/pdf",data:await b64(file)}};
  }
  let bmp;
  try{ bmp=await createImageBitmap(file); }
  catch{ throw new Error("この画像は 開けません（HEIC なら JPG にしてください）"); }
  const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
  const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(bmp,0,0,c.width,c.height);
  const url=c.toDataURL("image/jpeg",.88);
  return {type:"image",source:{type:"base64",media_type:"image/jpeg",data:url.split(",")[1]}};
}
function b64(file){
  return new Promise((ok,ng)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=ng;r.readAsDataURL(file);});
}

/* ============ Claude で 読む ============ */
const SCHEMA={
  type:"object",additionalProperties:false,required:["documents"],
  properties:{documents:{type:"array",items:{
    type:"object",additionalProperties:false,
    required:["kind","date","partner","registration_number","summary","account","payment","lines","withholding_tax","unsure"],
    properties:{
      kind:{type:"string",enum:["receipt","bill","sales_invoice"],description:"receipt=支払い済みのレシート/領収書, bill=受け取った請求書(後払い), sales_invoice=自分が出した請求書"},
      date:{type:"string",description:"取引日 YYYY-MM-DD。和暦は西暦に直す。読めなければ空文字"},
      partner:{type:"string",description:"相手の店名・会社名（sales_invoice なら請求先）"},
      registration_number:{type:"string",description:"適格請求書発行事業者の登録番号 T+13桁。無ければ空文字"},
      summary:{type:"string",description:"何を買った/何の仕事か。全角15文字くらいまで"},
      account:{type:"string",description:"借方の勘定科目（経費なら経費科目、sales_invoice なら 売上高）"},
      payment:{type:"string",enum:["cash","card","bank","unknown"]},
      lines:{type:"array",description:"税率ごとの税込金額。1つの税率なら1行",items:{
        type:"object",additionalProperties:false,required:["rate","amount"],
        properties:{rate:{type:"string",enum:["10","8","exempt","none"]},amount:{type:"integer",description:"その税率の税込合計（円）"}}
      }},
      withholding_tax:{type:"integer",description:"源泉徴収税額。無ければ 0"},
      unsure:{type:"string",description:"読み取りに自信がない所があれば日本語で短く。なければ空文字"}
    }
  }}}
};

function systemPrompt(){
  return `あなたは日本の個人事業主（青色申告）の記帳を手伝う。渡された画像/PDFのレシート・領収書・請求書を読み取り、仕訳の元データにする。
- 1枚に複数の書類が写っていたら、書類ごとに documents に分ける。書類でなければ documents は空配列。
- 事業主の名前・屋号: 「${S.myName||"（未設定）"}」。この名前が発行元の請求書は sales_invoice、宛先側なら bill。
- 勘定科目は次から選ぶ: ${ACCOUNTS.filter(a=>!["売掛金","未払金","現金","普通預金","事業主借","事業主貸"].includes(a)).join("、")}
- 10万円以上の備品は 工具器具備品。飲食は相手がいそうなら 接待交際費、打ち合わせなら 会議費。電車・タクシー・駐車場は 旅費交通費。切手は 通信費で rate=exempt、収入印紙は 租税公課で rate=none。
- 軽減税率（※や★の印、8%）の品があれば 8 と 10 を分けて lines に入れる。合計が総額と一致するようにする。
- 金額は税込の整数。ポイント値引きや割引後の実際の支払額を使う。
- 読めない・あやしい所は推測で埋めたうえで unsure に書く。`;
}

async function callClaude(block){
  const client=new Anthropic({apiKey:S.apiKey,dangerouslyAllowBrowser:true});
  const base={
    model:S.model,max_tokens:16000,
    system:systemPrompt(),
    output_config:{format:{type:"json_schema",schema:SCHEMA}},
    messages:[{role:"user",content:[block,{type:"text",text:"この書類を読み取ってください。"}]}]
  };
  let res;
  try{
    // 拒否されたときは 別モデルで やり直してもらう
    res=await client.beta.messages.create({...base,betas:["server-side-fallback-2026-07-01"],fallbacks:"default"});
  }catch(e){
    if(e instanceof Anthropic.BadRequestError && /fallback/i.test(e.message)) res=await client.messages.create(base);
    else throw e;
  }
  if(res.stop_reason==="refusal") throw new Error("読み取りを 断られました");
  if(res.stop_reason==="max_tokens") throw new Error("出力が 長すぎました");
  const txt=res.content.filter(b=>b.type==="text").map(b=>b.text).join("");
  return JSON.parse(txt);
}

async function readOne(f){
  const block=await toBlock(f.file);
  let out;
  try{ out=await callClaude(block); }
  catch(e){
    if(e instanceof Anthropic.AuthenticationError) throw new Error("APIキーが ちがいます");
    if(e instanceof Anthropic.RateLimitError) throw new Error("混んでいます。少し待って 入れなおしてください");
    if(e instanceof Anthropic.APIConnectionError) throw new Error("つながりません");
    throw e;
  }
  const docs=out.documents||[];
  if(!docs.length) throw new Error("書類が 見つかりませんでした");
  for(const d of docs) for(const r of toRows(d,f)) rows.push(r);
  render();
}

function creditFor(d){
  if(d.kind==="bill") return S.acBill;
  return {card:S.acCard,bank:S.acBank}[d.payment]||S.acCash;
}

function toRows(d,f){
  const lines=(d.lines||[]).filter(l=>l.amount);
  if(!lines.length) lines.push({rate:"10",amount:0});
  const sales=d.kind==="sales_invoice";
  const remembered=S.memory[d.partner];
  return lines.map((l,i)=>{
    const r={
      id:++seq,fileId:f.id,thumb:f.thumb,
      kind:sales?"sales":"exp",
      date:d.date||"",partner:d.partner||"",regno:d.registration_number||"",
      memo:d.summary||"",
      dr:sales?"売掛金":(remembered||d.account||"雑費"),
      cr:sales?"売上高":creditFor(d),
      amount:l.amount,rate:l.rate,
      wh:sales&&i===0?(d.withholding_tax||0):0,
      unsure:d.unsure||"",taxEdited:false
    };
    r.tax=autoTax(r);
    return r;
  });
}

/* ============ 表 ============ */
function render(){
  const tb=$("#rows");
  if(!rows.length){
    tb.innerHTML=`<tr><td colspan="12" class="empty">まだ ありません。上に レシートを 入れてください。</td></tr>`;
  }else{
    tb.innerHTML=rows.map(r=>{
      const flag=!r.date||!r.amount||r.unsure;
      const th=r.thumb?`<img src="${r.thumb}" alt="" data-pv="${r.thumb}">`:`<span class="ph">${r.fileId?"PDF":"手"}</span>`;
      const note=[r.unsure,!r.date&&"日付が 空",!r.amount&&"金額が 0"].filter(Boolean).join(" ／ ");
      return `<tr data-id="${r.id}" class="${flag?"flag":""}">
        <td class="thumb">${th}</td>
        <td><select data-k="kind"><option value="exp"${r.kind==="exp"?" selected":""}>経費</option><option value="sales"${r.kind==="sales"?" selected":""}>売上</option></select></td>
        <td><input type="date" data-k="date" value="${esc(r.date)}"></td>
        <td><input data-k="partner" value="${esc(r.partner)}" style="min-width:8rem">${note?`<div class="note">${esc(note)}</div>`:""}</td>
        <td><input data-k="memo" value="${esc(r.memo)}" style="min-width:8rem"></td>
        <td><input data-k="dr" list="acList" value="${esc(r.dr)}" style="min-width:6.5rem"></td>
        <td><input data-k="cr" list="acList" value="${esc(r.cr)}" style="min-width:6rem"></td>
        <td class="num"><input data-k="amount" inputmode="numeric" value="${r.amount}" style="width:6.5rem"></td>
        <td><select data-k="rate">${Object.entries(RATES).map(([v,t])=>`<option value="${v}"${r.rate===v?" selected":""}>${t}</option>`).join("")}</select></td>
        <td><input data-k="tax" list="taxList" value="${esc(r.tax)}" placeholder="${S.taxMode==="exempt"?"空欄":""}" style="min-width:9rem"></td>
        <td class="num"><input data-k="wh" inputmode="numeric" value="${r.wh||""}" placeholder="—" style="width:5rem"${r.kind==="sales"?"":" disabled"}></td>
        <td><button class="btn btn-ic" data-del title="消す">${ic("del")}</button></td>
      </tr>`;
    }).join("");
  }
  const exp=rows.filter(r=>r.kind==="exp").reduce((a,r)=>a+(+r.amount||0),0);
  const sal=rows.filter(r=>r.kind==="sales").reduce((a,r)=>a+(+r.amount||0),0);
  $("#sumExp").textContent=yen(exp); $("#sumSales").textContent=yen(sal); $("#cnt").textContent=rows.length;
  $("#exportBtn").disabled=!rows.length;
}

$("#rows").addEventListener("change",e=>{
  const tr=e.target.closest("tr[data-id]"); if(!tr) return;
  const r=rows.find(x=>x.id==tr.dataset.id); const k=e.target.dataset.k; if(!r||!k) return;
  let v=e.target.value;
  if(k==="amount"||k==="wh") v=parseInt(String(v).replace(/[^\d]/g,""),10)||0;
  r[k]=v;
  if(k==="tax") r.taxEdited=true;
  if(k==="kind"){
    if(v==="sales"){r.dr="売掛金";r.cr="売上高";}
    else{r.dr="雑費";r.cr=S.acCash;r.wh=0;}
  }
  if(["kind","rate","date"].includes(k)&&!r.taxEdited) r.tax=autoTax(r);
  render();
});
$("#rows").addEventListener("click",e=>{
  if(e.target.closest("[data-del]")){
    const id=e.target.closest("tr").dataset.id; rows=rows.filter(r=>r.id!=id); render(); return;
  }
  const img=e.target.closest("[data-pv]");
  if(img){ $("#pv img").src=img.dataset.pv; $("#pv").classList.add("on"); }
});
$("#pv").onclick=()=>$("#pv").classList.remove("on");
$("#addBtn").onclick=()=>{
  const r={id:++seq,fileId:0,thumb:"",kind:"exp",date:new Date().toISOString().slice(0,10),partner:"",regno:"",memo:"",
    dr:"雑費",cr:S.acCash,amount:0,rate:"10",wh:0,unsure:"",taxEdited:false};
  r.tax=autoTax(r); rows.push(r); render();
};
$("#clearBtn").onclick=()=>{
  if(!rows.length&&!files.length) return;
  if(!confirm("表と 入れたファイルを ぜんぶ 消します。")) return;
  rows=[]; files.forEach(f=>f.thumb&&URL.revokeObjectURL(f.thumb)); files=[]; renderFiles(); render();
};

/* ============ 弥生インポート形式（25項目） ============ */
const sjisLen=s=>Encoding.convert(Encoding.stringToCode(s),{to:"SJIS",from:"UNICODE"}).length;
function cut(s,max){ s=String(s||"").replace(/[\r\n,"]/g," ").trim(); while(s&&sjisLen(s)>max) s=s.slice(0,-1); return s; }
const ymd=d=>String(d||"").replace(/-/g,"/");

function line(flag,r,o){
  // 1識別 2伝票No 3決算 4日付 5借方科目 6補助 7部門 8税区分 9金額 10税額
  // 11貸方科目 12補助 13部門 14税区分 15金額 16税額 17摘要 18番号 19期日 20タイプ 21生成元 22メモ 23付箋1 24付箋2 25調整
  return [flag,"","",ymd(r.date),
    o.dr,"","",o.drTax,o.drAmt,"",
    o.cr,"","",o.crTax,o.crAmt,"",
    cut(o.memo,64),"","",0,"",cut(r.regno,60),0,0,"no"];
}
function toCsvRows(){
  const out=[]; const other=S.taxMode==="exempt"?"":"対象外";
  for(const r of rows){
    const amt=+r.amount||0; if(!amt) continue;
    const memo=[r.partner,r.memo].filter(Boolean).join(" ");
    if(r.kind==="sales"){
      const wh=+r.wh||0;
      out.push(line(2000,r,{dr:r.dr,drTax:other,drAmt:amt,cr:r.cr,crTax:r.tax,crAmt:amt,memo}));
      // 源泉は 売掛金から 事業主貸へ
      if(wh>0) out.push(line(2000,r,{dr:"事業主貸",drTax:other,drAmt:wh,cr:r.dr,crTax:other,crAmt:wh,memo:memo+" 源泉所得税"}));
    }else{
      out.push(line(2000,r,{dr:r.dr,drTax:r.tax,drAmt:amt,cr:r.cr,crTax:other,crAmt:amt,memo}));
    }
  }
  return out;
}
function check(){
  const bad=rows.filter(r=>!r.date||!(+r.amount)||!r.dr||!r.cr);
  if(bad.length) return `日付・金額・科目が 空の行が ${bad.length} 件 あります`;
  const wh=rows.find(r=>r.kind==="sales"&&+r.wh>=+r.amount);
  if(wh) return "源泉が 金額より 大きい行が あります";
  return "";
}

$("#exportBtn").onclick=()=>{
  const msg=check(); if(msg){ toast(msg); return; }
  const text=toCsvRows().map(c=>c.join(",")).join("\r\n")+"\r\n";
  const sjis=Encoding.convert(Encoding.stringToCode(text),{to:"SJIS",from:"UNICODE"});
  const blob=new Blob([new Uint8Array(sjis)],{type:"text/csv"});
  const a=document.createElement("a");
  const d=new Date(); const p=n=>String(n).padStart(2,"0");
  a.href=URL.createObjectURL(blob);
  a.download=`yayoi_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.csv`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  // 取引先 → 科目 を 覚える
  for(const r of rows) if(r.kind==="exp"&&r.partner&&r.dr) S.memory[r.partner]=r.dr;
  save();
  toast(`${rows.length} 件を 書き出しました`);
};

window.addEventListener("beforeunload",e=>{ if(rows.length){ e.preventDefault(); e.returnValue=""; } });

render();
</script>
