<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ミニSpine - 2Dボーンリグ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- タイトルバー -->
  <div id="titlebar">
    <div class="tb-title">🦴 ミニSpine</div>
    <div class="tb-spec dot">ボーン / メッシュ / ウェイト / 揺れ物理</div>
    <div class="tb-actions">
      <button id="btnSpring" class="btn btn-sm" title="バネ物理のON/OFF">〰 揺れ物理</button>
      <button id="btnSave" class="btn btn-sm">💾 保存</button>
      <button id="btnLoad" class="btn btn-sm">📂 開く</button>
      <button id="btnRec" class="btn btn-sm">⏺ 録画</button>
      <button id="btnLive" class="btn btn-sm btn-g" title="UIを消して透過表示。OBS用">📡 配信モード</button>
      <button id="btnHelp" class="btn btn-sm btn-y">? つかいかた</button>
    </div>
    <input type="file" id="fileImg" accept="image/*" multiple hidden>
    <input type="file" id="fileProj" accept=".json,application/json" hidden>
  </div>

  <!-- 左：ツールレール -->
  <div id="rail">
    <div class="rail-label">TOOL</div>
    <button class="tool" data-tool="select"><i>👆</i>選択<b>1</b></button>
    <button class="tool" data-tool="bone"><i>🦴</i>ボーン<b>2</b></button>
    <button class="tool" data-tool="weight"><i>🎨</i>ウェイト<b>3</b></button>
    <button class="tool" data-tool="mesh"><i>🕸</i>メッシュ<b>4</b></button>
    <div class="rail-label">MODE</div>
    <button class="tool" id="btnMode"><i>🔁</i><span id="modeLabel">セットアップ</span><b>Tab</b></button>
    <button class="tool" id="btnPlay"><i>▶</i><span id="playLabel">再生</span><b>Spc</b></button>
    <div class="rail-label">FILE</div>
    <button class="tool" id="btnAddImg"><i>🖼</i>画像追加</button>
  </div>

  <!-- 左2：レイヤー -->
  <div id="left">
    <div class="pgroup">
      <div class="pgroup-ttl">ボーン <span id="boneCount"></span></div>
      <div class="tree" id="boneTree"></div>
    </div>
    <div class="pgroup">
      <div class="pgroup-ttl">パーツ（下が手前）</div>
      <div class="tree" id="slotTree"></div>
    </div>
  </div>

  <!-- 中央：キャンバス -->
  <div id="view">
    <canvas id="cv"></canvas>
    <div id="status"></div>
    <div id="drop"><span>PNGをドロップしてパーツ追加</span></div>
  </div>

  <!-- 右：プロパティ -->
  <div id="right"></div>

  <!-- 下：タイムライン -->
  <div id="timeline">
    <div id="tlbar">
      <span class="tl-label">アニメ</span>
      <select id="animSel" class="fld"></select>
      <button id="btnAnimNew" class="btn btn-sm">＋</button>
      <button id="btnAnimDel" class="btn btn-sm">－</button>
      <span class="tl-label">長さ</span><input type="number" id="animDur" class="fld w70" step="0.1" min="0.1">
      <label class="tl-chk"><input type="checkbox" id="animLoop" checked> ループ</label>
      <span class="tl-label">時間</span><input type="number" id="curTime" class="fld w70" step="0.01" min="0">
      <button id="btnKey" class="btn btn-sm btn-y" title="選択ボーンにキーを打つ (K)">◆ キー打ち</button>
      <button id="btnKeyDel" class="btn btn-sm">◇ 削除</button>
      <select id="curveSel" class="fld"><option value="smooth">スムーズ</option><option value="linear">リニア</option><option value="stepped">ステップ</option></select>
      <button id="btnPreset" class="btn btn-sm">✨ よくある動き</button>
    </div>
    <div id="dope"><canvas id="dopecv"></canvas></div>
  </div>

</div>

<div id="liveout"><button id="btnLiveExit" class="btn btn-sm btn-g">配信モード終了 (Esc)</button></div>

<script src="core.js"></script>
<script src="editor.js"></script>
</body>
</html>
