<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>資料いた</title>
<meta name="theme-color" content="#3a3a3e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="board"></div>
    <div id="hint" class="empty">＋ で 画像を 足す<br>はりつけ・ドラッグ でも 入る</div>
  </div>

  <div id="bar" class="glass">
    <button data-a="menu" title="メニュー">≡</button>
    <button data-a="lock" title="ロック（ロック中は 2本指で 回る）">🔓</button>
    <button data-a="fit" title="ぜんぶ 見る">🖼</button>
    <button data-a="flip" title="左右 はんてん">⇆</button>
    <button data-a="mini" title="ちいさく">➖</button>
    <button data-a="pip" title="うかせる（前に 出しっぱなし）">⛶</button>
    <span class="sp"></span>
    <button data-a="desel" title="えらぶのを やめる">✕</button>
  </div>

  <button id="ghostBtn" class="glass round" data-a="ghost" title="ゴースト">🫥</button>

  <div id="foot">
    <button class="glass round" data-a="add" title="画像を 足す">＋</button>
    <div class="glass pill">
      <button data-a="undo" title="もどす">↶</button>
      <button data-a="redo" title="やり直す">↷</button>
      <button data-a="rot0" title="回転を もどす">🔄</button>
    </div>
  </div>

  <div id="sel" class="glass pill">
    <button data-a="crop" title="きりとり">✂</button>
    <button data-a="front" title="いちばん 前へ">▲</button>
    <button data-a="back" title="いちばん 後ろへ">▼</button>
    <button data-a="uncrop" title="きりとりを もどす">↩</button>
    <button data-a="del" title="消す">🗑</button>
  </div>

  <div id="sheet" class="glass">
    <h3>資料いた</h3>
    <button class="row" data-a="add">＋ 画像を 足す</button>
    <button class="row" data-a="paste">📋 はりつけ</button>
    <button class="row" data-a="png">🖼 いたごと 画像で 保存</button>
    <button class="row" data-a="save">💾 いたを ファイルに 保存</button>
    <button class="row" data-a="open">📂 いたを 開く</button>
    <h4>ゴーストの こさ</h4>
    <input type="range" id="ghostA" min="5" max="80" value="25">
    <h4>うしろの 色</h4>
    <div id="bgs"></div>
    <h4>見え方</h4>
    <input type="range" id="glassA" min="0" max="100" value="55">
    <p class="empty">ガラスの すけ具合</p>
    <button class="row warn" data-a="clear">🗑 ぜんぶ 消す</button>
    <p class="empty">1本指: うごかす ／ 2本指: 拡大・回転<br>2本指タップ: もどす ／ 3本指タップ: やり直す</p>
  </div>

  <div id="miniBub" class="glass round" data-a="unmini">🫥</div>
  <div id="toast"></div>
  <input type="file" id="fImg" accept="image/*" multiple hidden>
  <input type="file" id="fJson" accept=".json,application/json" hidden>
</div>
<script type="module" src="../skin/icons.js?v=8"></script>
<script type="module" src="app.js?v=1"></script>
</body>
</html>
