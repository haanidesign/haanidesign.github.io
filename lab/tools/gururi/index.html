<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#E1DD60">
<meta name="mobile-web-app-capable" content="yes">
<title>ぐるり — 360°の えを 描く</title>
<style>
:root{
  --main:#E1DD60; --main-deep:#B8B43F; --main-soft:#F2F0BE;
  --cream:#FBFAEC; --paper:#FFFEF7; --ink:#1E1C14; --gray:#8A8470; --pink:#F2A0B8;
  --green:#7FBF6A;
  --bd:2.5px solid var(--ink); --r:12px; --tap:46px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic UI',sans-serif;
  font-weight:700; display:flex; flex-direction:column; overflow:hidden;
  touch-action:none; user-select:none;
}
.bar{
  display:flex; align-items:center; gap:.35rem; flex:none;
  background:var(--main); border-bottom:var(--bd); padding:.35rem .55rem;
  padding-top:calc(.35rem + env(safe-area-inset-top));
}
.bar h1{margin:0; font-size:.86rem; white-space:nowrap;}
.bar .grow{flex:1;}
.chip{
  font-size:.56rem; background:var(--cream); border:2px solid var(--ink);
  border-radius:100px; padding:.08rem .45rem; white-space:nowrap;
}
.chip.ok{background:var(--green);} .chip.ng{background:var(--pink);}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.25rem;
  min-height:var(--tap); background:var(--paper); color:var(--ink);
  border:var(--bd); border-radius:var(--r); padding:.35rem .6rem;
  font:inherit; font-size:.74rem; box-shadow:0 3px 0 var(--ink); cursor:pointer;
  white-space:nowrap; transition:transform .08s, box-shadow .08s, background .15s;
}
.btn:active{transform:translateY(3px); box-shadow:0 0 0 var(--ink);}
.btn-y{background:var(--main);}
.btn-g{background:var(--ink); color:var(--main);}
.btn-sm{min-height:34px; padding:.25rem .5rem; font-size:.64rem; box-shadow:0 2.5px 0 var(--ink);}
.btn:disabled{opacity:.4;}

#stage{flex:1; position:relative; background:#2a2a26; min-height:0; touch-action:none; overflow:hidden;}
#stage canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;}
#view{z-index:1;} #guide{z-index:2; pointer-events:none;} #ink{z-index:3;}
#empty{
  position:absolute; inset:0; z-index:4; display:flex; align-items:center; justify-content:center;
  background:var(--cream); text-align:center; padding:1rem;
  background-image:radial-gradient(circle,rgba(30,28,20,.13) 1.5px,transparent 1.6px);
  background-size:16px 16px;
}
#empty div{
  background:var(--paper); border:var(--bd); border-radius:var(--r);
  box-shadow:0 3px 0 var(--ink); padding:1rem 1.1rem; max-width:23rem;
  font-size:.75rem; font-weight:400; line-height:1.95;
}
#empty b{font-weight:700;}
#hud{position:absolute; left:.45rem; top:.45rem; z-index:5; display:flex; gap:.25rem; pointer-events:none;}
#hud span{
  background:rgba(251,250,236,.92); border:2px solid var(--ink); border-radius:9px;
  padding:.05rem .35rem; font-family:'DotGothic16',monospace; font-size:.6rem;
}

.dock{
  flex:none; background:var(--cream); border-top:var(--bd);
  padding:.4rem .5rem; padding-bottom:calc(.4rem + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:.35rem;
}
.rowb{display:flex; gap:.3rem; align-items:center;}
.rowb .btn{flex:1;}
.seg{display:flex; gap:.28rem; flex:1;}
.seg button{
  flex:1; min-height:36px; background:var(--paper); border:2px solid var(--ink);
  border-radius:9px; font:inherit; font-size:.66rem; box-shadow:0 2.5px 0 var(--ink); cursor:pointer;
}
.seg button.on{background:var(--main); box-shadow:0 0 0 var(--ink); transform:translateY(2.5px);}
label.f{font-size:.62rem; font-weight:400; display:flex; align-items:center; gap:.3rem; flex:1;}
label.f input[type=range]{flex:1; accent-color:var(--main-deep); height:36px;}
select{
  background:var(--paper); border:2px solid var(--ink); border-radius:9px;
  padding:.2rem .3rem; font:inherit; font-size:.64rem; font-weight:400; min-height:34px;
}
.sw{display:flex; gap:.26rem; flex:1;}
.sw button{
  flex:1; min-height:36px; border:2px solid var(--ink); border-radius:9px;
  box-shadow:0 2.5px 0 var(--ink); cursor:pointer; font:inherit; font-size:.6rem;
}
.sw button.on{transform:translateY(2.5px); box-shadow:0 0 0 var(--ink); outline:3px solid var(--ink); outline-offset:-6px;}

/* レイヤーの たな */
#layers{display:flex; gap:.28rem; overflow-x:auto; padding-bottom:.15rem;}
.lay{
  flex:none; display:flex; align-items:center; gap:.3rem;
  background:var(--paper); border:2px solid var(--ink); border-radius:9px;
  box-shadow:0 2.5px 0 var(--ink); padding:.25rem .4rem; font-size:.64rem; cursor:pointer;
  min-height:36px;
}
.lay.on{background:var(--main); box-shadow:0 0 0 var(--ink); transform:translateY(2.5px);}
.lay .eye{font-size:.72rem; opacity:1;}
.lay.off .eye{opacity:.25;}
.hint{
  background:var(--main-soft); border:2px dashed var(--ink); border-radius:10px;
  padding:.3rem .4rem; font-size:.58rem; font-weight:400; color:#5c5843; line-height:1.65;
}
/* レイヤーの ふやす・へらす は 幅を 決めておく（flex:1 だと 横に のびる） */
#bLayAdd, #bLayDel, #bLayUp, #bLayDown{flex:none; width:42px; padding:0;}
#bUndo, #bRedo{width:42px; padding:0; font-size:1rem;}
#bGuide{flex:none; width:96px;}
#layPanel{
  position:absolute; right:.5rem; top:2.6rem; z-index:6; width:210px;
  background:var(--paper); border:var(--bd); border-radius:var(--r);
  box-shadow:0 3px 0 var(--ink); padding:.4rem; font-size:.66rem;
  max-height:calc(100% - 3.4rem); overflow:auto;
}
#layPanel.hide{display:none;}
.lp-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:.3rem;}
.lp-head .btn{width:38px; padding:0;}
.lp-foot{display:flex; gap:.25rem; margin-top:.3rem;}
.lp-foot .btn{flex:1; padding:0;}
.lrow{
  border:2px solid var(--ink); border-radius:9px; padding:.25rem .3rem; margin-bottom:.25rem;
  background:var(--cream);
}
.lrow.on{background:var(--main);}
.lrow .t{display:flex; align-items:center; gap:.3rem; cursor:pointer;}
.lrow .eye{font-size:.8rem;}
.lrow.off .eye{opacity:.25;}
.lrow input[type=range]{width:100%; accent-color:var(--main-deep); height:24px;}
.lrow .op{display:flex; justify-content:space-between; font-size:.56rem; color:#5c5843; font-weight:400;}
#bLayToggle{position:absolute; right:.5rem; top:.5rem; z-index:7;}
#wheel{flex:none; border:2px solid var(--ink); border-radius:12px; background:var(--paper); touch-action:none;}
#curColor{flex:none; width:44px; height:36px; border:2px solid var(--ink); border-radius:9px; background:#1E1C14;}
.recent{display:grid; grid-template-columns:repeat(8,1fr); gap:.22rem;}
.recent button{height:26px; border:2px solid var(--ink); border-radius:7px; cursor:pointer; padding:0;}
.hide{display:none !important;}
#toast{
  position:fixed; left:50%; bottom:6.5rem; transform:translate(-50%,240%);
  background:var(--ink); color:var(--main); border-radius:100px;
  padding:.45rem 1rem; font-size:.7rem; max-width:88vw; text-align:center;
  transition:transform .18s; pointer-events:none; z-index:9;
}
#toast.show{transform:translate(-50%,0);}
#toast.bad{background:#7a2338; color:#fff;}
input[type=file]{display:none;}
</style>
</head>
<body>

<header class="bar">
  <h1>ぐるり</h1>
  <span id="info" class="chip">まだ ひらいて いません</span>
  <span class="grow"></span>
  <button class="btn btn-sm" id="bUndo" title="もどす">↶</button>
  <button class="btn btn-sm" id="bRedo" title="やり直す">↷</button>
  <button class="btn btn-sm" id="bNew">しんき</button>
  <button class="btn btn-sm" id="bOpen">ひらく</button>
  <button class="btn btn-sm" id="bLoad">つづき</button>
  <button class="btn btn-sm btn-g" id="bSave">保存</button>
</header>

<div id="stage">
  <canvas id="view"></canvas>
  <canvas id="guide"></canvas>
  <canvas id="ink"></canvas>
  <div id="layPanel">
    <div class="lp-head"><b>レイヤー</b><button class="btn btn-sm" id="bLayAdd">＋</button></div>
    <div id="layList"></div>
    <div class="lp-foot">
      <button class="btn btn-sm" id="bLayUp">↑</button>
      <button class="btn btn-sm" id="bLayDown">↓</button>
      <button class="btn btn-sm" id="bLayDel">さくじょ</button>
    </div>
  </div>
  <button class="btn btn-sm" id="bLayToggle">レイヤー</button>
  <div id="hud"><span id="hYaw">よこ 0</span><span id="hPitch">たて 0</span><span id="hFov">がかく 90</span></div>
  <div id="empty"><div>
    <b>360°の えを 描く ための 台です。</b><br><br>
    ① <b>しんき</b> で 白紙を つくる<br>
    ② 下の <b>ペン</b> で、パース線を たよりに 描く<br>
    ③ ゆびを はなすと そのまま 球に のります<br><br>
    こまかく 描きたい ときは <b>切り出す</b> で 保存して、<br>
    いつもの お絵かきアプリで 描いてから <b>もどす</b>。
  </div></div>
</div>

<div class="dock">
  <!-- どうぐ -->
  <div class="rowb">
    <div class="seg" id="tool">
      <button data-tool="turn" class="on">まわす</button>
      <button data-tool="pen">ペン</button>
      <button data-tool="erase">けし</button>
      <button data-tool="fill">ぬり</button>
      <button data-tool="pick">スポイト</button>
      <button data-tool="person">ひと</button>
    </div>
    <button class="btn btn-sm" id="bGuide">パース線</button>
  </div>


  <!-- ペンの 設定 -->
  <div id="panPen" class="hide">
    <div class="rowb" style="margin-bottom:.35rem; align-items:flex-start">
      <canvas id="wheel" width="170" height="170"></canvas>
      <div style="flex:1; display:flex; flex-direction:column; gap:.3rem">
        <div class="rowb">
          <div id="curColor" title="いまの色"></div>
          <label class="f">ふとさ <b id="vSize" class="dot">6</b><input type="range" id="size" min="1" max="80" step="1" value="6"></label>
        </div>
        <div class="sw" id="colors"></div>
        <div id="recent" class="recent"></div>
      </div>
    </div>

  </div>

  <!-- ひと -->
  <div id="panPerson" class="hide">
    <div class="rowb" style="margin-bottom:.35rem">
      <select id="poseSel"></select>
      <label class="f">せ <b id="vPH" class="dot">1.7</b>m<input type="range" id="pHeight" min="60" max="220" step="5" value="170"></label>
      <button class="btn btn-sm" id="pTurnL">◀ むき</button>
      <button class="btn btn-sm" id="pTurnR">むき ▶</button>
    </div>
    <div class="rowb">
      <button class="btn btn-sm" id="pDel">この ひとを 消す</button>
      <button class="btn btn-sm" id="pClear">ぜんぶ 消す</button>
      <button class="btn btn-sm btn-y" id="pBake">ひとを 絵に する</button>
    </div>
  </div>

  <!-- まわす -->
  <div id="panTurn">
    <div class="rowb" style="margin-bottom:.35rem">
      <div class="seg" id="look">
        <button data-look="0,0">しょうめん</button>
        <button data-look="0,88">まうえ</button>
        <button data-look="0,-88">ました</button>
        <button data-look="180,0">うしろ</button>
      </div>
    </div>
    <div class="rowb" style="margin-bottom:.35rem">
      <label class="f">目線 <b id="vEye" class="dot">1.5</b>m<input type="range" id="eye" min="0.3" max="5" step="0.1" value="1.5"></label>
      <label class="f">天井 <b id="vCeil" class="dot">2.5</b>m<input type="range" id="ceil" min="1.6" max="12" step="0.1" value="2.5"></label>
    </div>
    <div class="rowb">
      <label class="f">がかく<input type="range" id="fov" min="20" max="120" step="1" value="90"></label>
      <select id="cutSize"><option value="1024">1024</option><option value="1536" selected>1536</option><option value="2048">2048</option></select>
      <button class="btn btn-sm btn-y" id="bCut">切り出す</button>
      <button class="btn btn-sm btn-y" id="bBack">もどす</button>
    </div>
  </div>

  <div class="hint" id="tip">
    <b>まわす</b>：ゆびで なぞると 回る／2本ゆびで つまむと 寄る。<br>
    描いている ときも 2本ゆびで 寄れます。赤いのが 地平線です。
  </div>
</div>

<div id="toast"></div>
<input type="file" id="fEqui" accept="image/*">
<input type="file" id="fFlat" accept="image/*">
<input type="file" id="fProj" accept="image/*">

<script>
/* ぐるり（ラボ版）— サーバーなしで動く 360°ペイント。

   正距円筒（よこ：たて＝2：1）を そのまま描くと、真上と真下が 横に伸びきって 描けない。
   なので 球として 見ながら 描き、ゆびを はなした ところで 球に 投影して 焼き込む。
   こまかい ところは 四角に 切り出して、いつもの お絵かきアプリで 描いてから もどす。

   レイヤーは 1枚ずつ 正距円筒の テクスチャ。表示は 下から 順に 重ねて 描くだけ。 */

const $ = (id) => document.getElementById(id);
const D2R = Math.PI/180;

let view = { yaw:0, pitch:0, fov:90 };
let lastCut = null;
let equiW = 0, equiH = 0;
let gl, pView, pMerge, pCopy, texFlat, fbo, texScratch, ready = false;
let tool = 'turn';
let guideMode = 2;                 // 0:なし 1:ゆか 2:ゆか＋天井
let pen = { color:'#1E1C14', size:6 };
let layers = [];                   // {tex, visible, name}
let active = 0;
let inkDirty = false;
let people = [];                   // {x, z, rot, h, pose}
let selPerson = -1;
let EYE = 1.5;                     // 目線の 高さ(m)。ゆかは y = -EYE
let CEIL = 2.5;                    // 天井の 高さ(m)。天井は y = CEIL-EYE
let gridM = 1.0;                   // マスの 間かく(m)
let undoStack = [], redoStack = []; // 焼く前の レイヤーの 控え {i, canvas}

/* ---------------------------------------------------------------- シェーダ */

const VS = `attribute vec2 pos; varying vec2 vUv;
void main(){ vUv = pos*0.5+0.5; gl_Position = vec4(pos,0.0,1.0); }`;

const FS_VIEW = `precision highp float;
varying vec2 vUv; uniform sampler2D tex;
uniform float yaw, pitch, fov, aspect, opacity;
const float PI = 3.14159265359;
void main(){
  float t = tan(fov*0.5);
  vec2 s = vUv*2.0-1.0;
  vec3 f = vec3(cos(pitch)*sin(yaw), sin(pitch), cos(pitch)*cos(yaw));
  vec3 r = vec3(cos(yaw), 0.0, -sin(yaw));
  vec3 u = cross(f, r);
  vec3 d = normalize(f + s.x*t*aspect*r + s.y*t*u);
  float lon = atan(d.x, d.z), lat = asin(clamp(d.y,-1.0,1.0));
  vec4 c = texture2D(tex, vec2(fract(lon/(2.0*PI)+0.5), 0.5-lat/PI));
  gl_FragColor = vec4(c.rgb, c.a*opacity);
}`;

/* 球の各点を 四角い絵に 射影して、入っていれば 上から重ねる。
   WebGL は 下が 原点、画像は 上が 原点。書き出しで ひっくり返らないよう iuv に 直す。
   ここを 忘れると 貼るたび 上下が 入れかわる。 */
const FS_MERGE = `precision highp float;
varying vec2 vUv; uniform sampler2D base; uniform sampler2D flat_;
uniform float yaw, pitch, fov, aspect, feather, erase;
const float PI = 3.14159265359;
void main(){
  /* FBO に 直接 描くので 上下の 入れかえは いらない。
     v=0 が 画像の 上、で そろえて ある。 */
  vec2 iuv = vUv;
  vec4 b = texture2D(base, iuv);
  float lon = (iuv.x-0.5)*2.0*PI;
  float lat = (0.5-iuv.y)*PI;
  vec3 d = vec3(cos(lat)*sin(lon), sin(lat), cos(lat)*cos(lon));
  vec3 f = vec3(cos(pitch)*sin(yaw), sin(pitch), cos(pitch)*cos(yaw));
  vec3 r = vec3(cos(yaw), 0.0, -sin(yaw));
  vec3 u = cross(f, r);
  float Z = dot(d,f);
  if (Z <= 0.0001) { gl_FragColor = b; return; }
  float t = tan(fov*0.5);
  float sx = dot(d,r)/(Z*t*aspect), sy = dot(d,u)/(Z*t);
  if (abs(sx) > 1.0 || abs(sy) > 1.0) { gl_FragColor = b; return; }
  vec4 c = texture2D(flat_, vec2(sx*0.5+0.5, 0.5-sy*0.5));
  float e = 1.0;
  if (feather > 0.0) e = smoothstep(1.0, 1.0-feather, abs(sx)) * smoothstep(1.0, 1.0-feather, abs(sy));
  float a = c.a*e;
  /* 消しゴムは 中途はんぱな こさを 残さない。残すと 焼きなおす たびに
     灰色の よごれに なって いく。 */
  if (erase > 0.5) {
    float ea = smoothstep(0.30, 0.55, a);
    gl_FragColor = vec4(b.rgb, b.a*(1.0-ea));
    return;
  }
  gl_FragColor = vec4(mix(b.rgb, c.rgb, a), max(b.a, a));
}`;

const FS_COPY = `precision highp float;
varying vec2 vUv; uniform sampler2D tex; uniform float opacity;
void main(){ vec4 c = texture2D(tex, vUv); gl_FragColor = vec4(c.rgb, c.a*opacity); }`;

function sh(t, src){
  const s = gl.createShader(t);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function prog(fs){
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
function mkTex(src){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  if(src) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  return t;
}
/* 中身の ない テクスチャ。FBO の 書きこみ先に つかう。 */
function allocTex(w, h){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  return t;
}

/* テクスチャに 直接 描く。2Dキャンバスを 経由しないので
   半とうめいの 画素が 劣化しない（消しゴムの よごれの 原因は これ だった）。 */
function renderToTex(tex, w, h, draw){
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.viewport(0, 0, w, h);
  draw(w, h);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

/* しまってある テクスチャを 画像に する。保存の ときだけ つかう。 */
function texToCanvas(tex, w, h){
  const px = new Uint8Array(w*h*4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const img = c.getContext('2d').createImageData(w, h);
  img.data.set(px);
  c.getContext('2d').putImageData(img, 0, 0);
  return c;
}

function bindQuad(p){
  const l = gl.getAttribLocation(p, 'pos');
  gl.enableVertexAttribArray(l);
  gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0);
}
function initGL(){
  const c = $('view');
  /* alpha:true が いる。false だと 描画面に 透明度が 残らず、
     レイヤーを 書き戻した とき まっ黒な 板に なる（実際に なった）。
     premultipliedAlpha:false は 色が 濁らない ようにする ため。 */
  const opt = { preserveDrawingBuffer:true, alpha:true, premultipliedAlpha:false };
  gl = c.getContext('webgl', opt) || c.getContext('experimental-webgl', opt);
  if(!gl){ toast('WebGL が つかえません', true); return false; }
  pView = prog(FS_VIEW); pMerge = prog(FS_MERGE); pCopy = prog(FS_COPY);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  texFlat = mkTex(null);
  fbo = gl.createFramebuffer();
  return true;
}

/* ---------------------------------------------------------------- 向き */

function basis(){
  const y = view.yaw*D2R, p = view.pitch*D2R;
  const f = [Math.cos(p)*Math.sin(y), Math.sin(p), Math.cos(p)*Math.cos(y)];
  const r = [Math.cos(y), 0, -Math.sin(y)];
  const u = [f[1]*r[2]-f[2]*r[1], f[2]*r[0]-f[0]*r[2], f[0]*r[1]-f[1]*r[0]];
  return {f, r, u};
}
function project(d, W, H, B){
  const {f, r, u} = B || basis();
  const Z = d[0]*f[0]+d[1]*f[1]+d[2]*f[2];
  if(Z <= 1e-4) return null;
  const t = Math.tan(view.fov*D2R*0.5), aspect = W/H;
  const X = d[0]*r[0]+d[1]*r[1]+d[2]*r[2];
  const Y = d[0]*u[0]+d[1]*u[1]+d[2]*u[2];
  return [ (X/(Z*t*aspect)*0.5+0.5)*W, (0.5 - Y/(Z*t)*0.5)*H ];
}
function dirOf(lonDeg, latDeg){
  const lo = lonDeg*D2R, la = latDeg*D2R;
  return [Math.cos(la)*Math.sin(lo), Math.sin(la), Math.cos(la)*Math.cos(lo)];
}

/* ---------------------------------------------------------------- 色えらび */

let hsv = { h:0, s:0, v:0.12 };
let recent = [];

function hsv2rgb(h, sa, v){
  const i = Math.floor(h*6), f = h*6-i, p = v*(1-sa), q = v*(1-f*sa), t = v*(1-(1-f)*sa);
  const r = [v,q,p,p,t,v][i%6], g = [t,v,v,q,p,p][i%6], b = [p,p,t,v,v,q][i%6];
  return [Math.round(r*255), Math.round(g*255), Math.round(b*255)];
}
function rgb2hsv(r, g, b){
  r/=255; g/=255; b/=255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx-mn;
  let h = 0;
  if(d){
    if(mx === r) h = ((g-b)/d + (g<b?6:0))/6;
    else if(mx === g) h = ((b-r)/d + 2)/6;
    else h = ((r-g)/d + 4)/6;
  }
  return { h, s: mx ? d/mx : 0, v: mx };
}
const toHex = (rgb) => '#' + rgb.map(v => v.toString(16).padStart(2,'0')).join('');
const fromHex = (x) => [parseInt(x.slice(1,3),16), parseInt(x.slice(3,5),16), parseInt(x.slice(5,7),16)];

const WH = { R:83, RIN:63 };      // 色わの 外がわ・内がわ

/* 色わ（外）と、明るさ・あざやかさの 四角（内）を 描く */
function drawWheel(){
  const c = $('wheel');
  if(!c) return;
  const g = c.getContext('2d'), W = c.width, H = c.height, cx = W/2, cy = H/2;
  g.clearRect(0,0,W,H);

  /* 色の わ。細かい おうぎ形を ならべて 作る */
  for(let a = 0; a < 360; a += 1){
    const s0 = (a-1)*Math.PI/180, s1 = (a+1.2)*Math.PI/180;
    g.beginPath();
    g.arc(cx, cy, WH.R, s0, s1);
    g.arc(cx, cy, WH.RIN, s1, s0, true);
    g.closePath();
    g.fillStyle = toHex(hsv2rgb(a/360, 1, 1));
    g.fill();
  }
  g.strokeStyle = '#1E1C14'; g.lineWidth = 2.5;
  g.beginPath(); g.arc(cx, cy, WH.R, 0, 7); g.stroke();
  g.beginPath(); g.arc(cx, cy, WH.RIN, 0, 7); g.stroke();

  /* 内がわの 四角。よこが あざやかさ、たてが 明るさ */
  const side = Math.floor(WH.RIN*Math.SQRT2) - 6;
  const x0 = cx - side/2, y0 = cy - side/2;
  const img = g.createImageData(side, side);
  for(let y = 0; y < side; y++){
    for(let x = 0; x < side; x++){
      const [r, gg, b] = hsv2rgb(hsv.h, x/(side-1), 1 - y/(side-1));
      const i = (y*side+x)*4;
      img.data[i] = r; img.data[i+1] = gg; img.data[i+2] = b; img.data[i+3] = 255;
    }
  }
  g.putImageData(img, x0, y0);
  g.strokeStyle = '#1E1C14'; g.lineWidth = 2;
  g.strokeRect(x0-1, y0-1, side+2, side+2);

  /* いまの 場所の しるし */
  const ha = hsv.h*Math.PI*2;
  const hr = (WH.R+WH.RIN)/2;
  g.beginPath(); g.arc(cx+Math.cos(ha)*hr, cy+Math.sin(ha)*hr, 7, 0, 7);
  g.strokeStyle = '#fff'; g.lineWidth = 3; g.stroke();
  g.strokeStyle = '#1E1C14'; g.lineWidth = 1.5; g.stroke();

  const px = x0 + hsv.s*(side-1), py = y0 + (1-hsv.v)*(side-1);
  g.beginPath(); g.arc(px, py, 7, 0, 7);
  g.strokeStyle = '#fff'; g.lineWidth = 3; g.stroke();
  g.strokeStyle = '#1E1C14'; g.lineWidth = 1.5; g.stroke();
}

function setColor(hex, addRecent){
  pen.color = hex;
  const cc = $('curColor');
  if(cc) cc.style.background = hex;
  hsv = rgb2hsv(...fromHex(hex));
  drawWheel();
  if(addRecent){
    recent = [hex, ...recent.filter(c => c !== hex)].slice(0, 16);
    try { localStorage.setItem('gururi_recent', JSON.stringify(recent)); } catch(e){}
    drawRecent();
  }
}

function drawRecent(){
  const box = $('recent');
  if(!box) return;
  box.innerHTML = '';
  for(const c of recent.slice(0, 16)){
    const b = document.createElement('button');
    b.style.background = c;
    b.onclick = () => { setColor(c, false); if(tool !== 'pen') setTool('pen'); };
    box.appendChild(b);
  }
}

function bindWheel(){
  const c = $('wheel');
  let mode = 0;
  const at = (e) => {
    const r = c.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return [ (t.clientX-r.left) * c.width/r.width, (t.clientY-r.top) * c.height/r.height ];
  };
  const pick = (x, y, first) => {
    const cx = c.width/2, cy = c.height/2, dx = x-cx, dy = y-cy;
    const d = Math.hypot(dx, dy);
    if(first) mode = (d > WH.RIN-2 && d < WH.R+8) ? 1 : 2;
    if(mode === 1){
      hsv.h = (Math.atan2(dy, dx)/(Math.PI*2) + 1) % 1;
    } else {
      const side = Math.floor(WH.RIN*Math.SQRT2) - 6;
      const x0 = cx - side/2, y0 = cy - side/2;
      hsv.s = Math.max(0, Math.min(1, (x-x0)/(side-1)));
      hsv.v = Math.max(0, Math.min(1, 1 - (y-y0)/(side-1)));
    }
    const hex = toHex(hsv2rgb(hsv.h, hsv.s, hsv.v));
    pen.color = hex;
    const cc = $('curColor'); if(cc) cc.style.background = hex;
    drawWheel();
  };
  let down = false;
  const start = (e) => { down = true; const [x,y] = at(e); pick(x, y, true); e.preventDefault(); };
  const move = (e) => { if(!down) return; const [x,y] = at(e); pick(x, y, false); e.preventDefault(); };
  const end = () => { if(down){ down = false; setColor(pen.color, true); } };
  c.addEventListener('touchstart', start, {passive:false});
  c.addEventListener('touchmove', move, {passive:false});
  c.addEventListener('touchend', end, {passive:true});
  c.addEventListener('mousedown', start);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
}

/* ---------------------------------------------------------------- 糸人間 */

/* 足もとを (0,0,0)、上を +y、正面を +z と した ときの 骨。
   数字は 身長を 1 と した ときの 比。ここを 足せば ポーズが 増える。 */
const POSES = {
  "立つ": {
    j: { head:[0,.94,0], neck:[0,.83,0], hip:[0,.52,0],
         sL:[-.10,.81,0], sR:[.10,.81,0], eL:[-.14,.64,.02], eR:[.14,.64,.02],
         hL:[-.16,.47,.04], hR:[.16,.47,.04],
         kL:[-.07,.27,0], kR:[.07,.27,0], fL:[-.07,0,.02], fR:[.07,0,.02] } },
  "歩く": {
    j: { head:[0,.94,0], neck:[0,.83,0], hip:[0,.52,0],
         sL:[-.10,.81,0], sR:[.10,.81,0], eL:[-.13,.65,-.10], eR:[.13,.65,.12],
         hL:[-.14,.50,-.18], hR:[.14,.50,.20],
         kL:[-.07,.27,.14], kR:[.07,.28,-.10], fL:[-.07,.02,.26], fR:[.07,0,-.20] } },
  "すわる": {
    j: { head:[0,.72,-.02], neck:[0,.61,-.02], hip:[0,.32,-.06],
         sL:[-.10,.59,-.02], sR:[.10,.59,-.02], eL:[-.14,.44,.04], eR:[.14,.44,.04],
         hL:[-.14,.32,.12], hR:[.14,.32,.12],
         kL:[-.08,.30,.22], kR:[.08,.30,.22], fL:[-.08,0,.22], fR:[.08,0,.22] } },
  "バンザイ": {
    j: { head:[0,.94,0], neck:[0,.83,0], hip:[0,.52,0],
         sL:[-.10,.81,0], sR:[.10,.81,0], eL:[-.17,.95,0], eR:[.17,.95,0],
         hL:[-.20,1.08,0], hR:[.20,1.08,0],
         kL:[-.07,.27,0], kR:[.07,.27,0], fL:[-.07,0,.02], fR:[.07,0,.02] } },
  "しゃがむ": {
    j: { head:[0,.62,.02], neck:[0,.52,.02], hip:[0,.28,-.02],
         sL:[-.10,.50,.02], sR:[.10,.50,.02], eL:[-.13,.36,.08], eR:[.13,.36,.08],
         hL:[-.13,.24,.16], hR:[.13,.24,.16],
         kL:[-.09,.26,.20], kR:[.09,.26,.20], fL:[-.08,0,.10], fR:[.08,0,.10] } }
};
const BONES = [["neck","hip"],["neck","sL"],["neck","sR"],["sL","eL"],["eL","hL"],
               ["sR","eR"],["eR","hR"],["hip","kL"],["kL","fL"],["hip","kR"],["kR","fR"]];

/* ゆか（y=-EYE）の どこを 見ているか。画面の 点 → 3Dの 向き → ゆかとの 交点 */
function floorHit(px, py, W, H){
  const {f, r, u} = basis();
  const t = Math.tan(view.fov*D2R*0.5), aspect = W/H;
  const sx = (px/W*2-1)*t*aspect, sy = (1-py/H*2)*t;
  const d = [f[0]+sx*r[0]+sy*u[0], f[1]+sx*r[1]+sy*u[1], f[2]+sx*r[2]+sy*u[2]];
  if(d[1] >= -1e-4) return null;                 // 上を 向いて いる＝ゆかに 当たらない
  const k = -EYE / d[1];
  return { x: d[0]*k, z: d[2]*k };
}

/* ひとりぶんの 骨を、画面の 座標に して 返す */
function personPoints(P, W, H, B){
  const pose = POSES[P.pose] || POSES["立つ"];
  const c = Math.cos(P.rot*D2R), sn = Math.sin(P.rot*D2R);
  const out = {};
  for(const k in pose.j){
    const [lx, ly, lz] = pose.j[k];
    const wx = P.x + (lx*c + lz*sn) * P.h;
    const wz = P.z + (-lx*sn + lz*c) * P.h;
    const wy = -EYE + ly * P.h;
    out[k] = project([wx, wy, wz], W, H, B);
  }
  return out;
}

function drawPeople(c, W, H, B){
  for(let i = 0; i < people.length; i++){
    const P = people[i];
    const j = personPoints(P, W, H, B);
    const on = i === selPerson;
    c.strokeStyle = on ? 'rgba(226,60,60,.95)' : 'rgba(30,28,20,.62)';
    c.fillStyle = c.strokeStyle;
    c.lineWidth = on ? 3 : 2.4;
    c.lineCap = 'round';
    for(const [a,b] of BONES){
      if(!j[a] || !j[b]) continue;
      c.beginPath(); c.moveTo(j[a][0], j[a][1]); c.lineTo(j[b][0], j[b][1]); c.stroke();
    }
    /* あたま。首との 間かくから 大きさを 決める（遠いほど 小さく なる） */
    if(j.head && j.neck){
      const r = Math.max(3, Math.hypot(j.head[0]-j.neck[0], j.head[1]-j.neck[1]) * 0.62);
      c.beginPath(); c.arc(j.head[0], j.head[1], r, 0, 7); c.stroke();
    }
    /* 足もとの わ。ゆかの どこに 立って いるか 分かる ように */
    if(j.fL && j.fR && on){
      c.beginPath();
      c.ellipse((j.fL[0]+j.fR[0])/2, (j.fL[1]+j.fR[1])/2,
                Math.max(6, Math.abs(j.fR[0]-j.fL[0])*1.6), Math.max(3, Math.abs(j.fR[0]-j.fL[0])*0.6),
                0, 0, 7);
      c.stroke();
    }
  }
}

function savePeople(){
  try { localStorage.setItem('gururi_people', JSON.stringify(people)); } catch(e){}
}
function loadPeople(){
  try {
    const v = JSON.parse(localStorage.getItem('gururi_people') || '[]');
    if(Array.isArray(v)) people = v;
  } catch(e){}
}

/* ---------------------------------------------------------------- パース線 */

function drawGuide(){
  const g = $('guide'), W = g.clientWidth, H = g.clientHeight;
  if(g.width !== W || g.height !== H){ g.width = W; g.height = H; }
  const c = g.getContext('2d');
  c.clearRect(0,0,W,H);
  if(!ready || guideMode === 0) return;
  const B = basis();

  /* うしろ側や 大きく はみ出た点で 線を 切る（切らないと 反対側まで 走る） */
  const poly = (pts, color, width) => {
    c.strokeStyle = color; c.lineWidth = width;
    c.beginPath();
    let on = false;
    for(const d of pts){
      const p = project(d, W, H, B);
      if(!p || p[0] < -W*2 || p[0] > W*3 || p[1] < -H*2 || p[1] > H*3){ on = false; continue; }
      if(on) c.lineTo(p[0], p[1]); else c.moveTo(p[0], p[1]);
      on = true;
    }
    c.stroke();
  };

  /* ゆかと 天井の マス目。どちらも 地平線に 向かって 集まる。
     高さは メートルで もつ（目線 1.5m なら ゆかは 1.5m 下、天井は その ぶん 上）。 */
  const plane = (y, color) => {
    const N = 16, S = gridM;
    const gp = (x, z) => [x, y, z];
    for(let i = -N; i <= N; i++){
      const a = [], b = [];
      for(let j = -N*4; j <= N*4; j++){
        a.push(gp(i*S, j*S/4));
        b.push(gp(j*S/4, i*S));
      }
      poly(a, color, 1);
      poly(b, color, 1);
    }
  };
  if(guideMode >= 1) plane(-EYE, 'rgba(120,150,210,.55)');            // ゆか
  if(guideMode >= 2) plane(CEIL - EYE, 'rgba(120,150,210,.42)');      // 天井
  const hz = [];
  for(let lon = 0; lon <= 360; lon += 2) hz.push(dirOf(lon, 0));
  poly(hz, 'rgba(226,60,60,.75)', 3);

  c.fillStyle = 'rgba(226,60,60,.9)';
  for(const lon of [0, 90, 180, 270]){
    const p = project(dirOf(lon, 0), W, H, B);
    if(p && p[0] > -40 && p[0] < W+40 && p[1] > -40 && p[1] < H+40){
      c.beginPath(); c.arc(p[0], p[1], 6, 0, 7); c.fill();
    }
  }
}

/* パース線が 消えて いても ひとは 出す（下絵として つかう ため） */
function drawOverlay(){
  drawGuide();
  const g = $('guide'), W = g.clientWidth, H = g.clientHeight;
  if(g.width !== W || g.height !== H){ g.width = W; g.height = H; }
  if(!ready || !people.length) return;
  drawPeople(g.getContext('2d'), W, H, basis());
}

/* ---------------------------------------------------------------- 表示 */

function fitCanvas(el){
  const w = el.clientWidth, h = el.clientHeight;
  if(el.width !== w || el.height !== h){ el.width = w; el.height = h; return true; }
  return false;
}

/* 下から 順に 重ねて 描く。これが レイヤーの 見え方 そのもの。 */
function paintLayers(W, H, aspect, uniformsFor){
  gl.clearColor(1,1,1,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);
  for(const L of layers){
    if(!L.visible) continue;
    uniformsFor(L, aspect);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  gl.disable(gl.BLEND);
}

function drawView(){
  if(!ready) return;
  const c = $('view');
  fitCanvas(c);
  gl.viewport(0,0,c.width,c.height);
  try {
  gl.useProgram(pView); bindQuad(pView);
  const aspect = c.width/c.height;
  paintLayers(c.width, c.height, aspect, (L) => {
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, L.tex);
    gl.uniform1i(gl.getUniformLocation(pView,'tex'), 0);
    gl.uniform1f(gl.getUniformLocation(pView,'yaw'), view.yaw*D2R);
    gl.uniform1f(gl.getUniformLocation(pView,'pitch'), view.pitch*D2R);
    gl.uniform1f(gl.getUniformLocation(pView,'fov'), view.fov*D2R);
    gl.uniform1f(gl.getUniformLocation(pView,'aspect'), aspect);
    gl.uniform1f(gl.getUniformLocation(pView,'opacity'), L.op === undefined ? 1 : L.op);
  });
  } catch(e) { /* 絵が 出せなくても パース線と ひとは 出す */ }
  $('hYaw').textContent = 'よこ ' + Math.round(view.yaw);
  $('hPitch').textContent = 'たて ' + Math.round(view.pitch);
  $('hFov').textContent = 'がかく ' + Math.round(view.fov);
  drawOverlay();
}

/* 見えている ぜんぶを 平らに 合わせた 1枚 */
function flatten(){
  const out = allocTex(equiW, equiH);
  renderToTex(out, equiW, equiH, () => {
    gl.useProgram(pCopy); bindQuad(pCopy);
    paintLayers(equiW, equiH, 1, (L) => {
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, L.tex);
      gl.uniform1i(gl.getUniformLocation(pCopy,'tex'), 0);
      gl.uniform1f(gl.getUniformLocation(pCopy,'opacity'), L.op === undefined ? 1 : L.op);
    });
  });
  const c = texToCanvas(out, equiW, equiH);
  gl.deleteTexture(out);
  return c;
}
/* レイヤー1枚を そのまま 画像に する（作業データ用） */
function layerToCanvas(L){
  return texToCanvas(L.tex, equiW, equiH);
}
/* 控えは GPU の 上に 置く。画像に 直すと 遅いし、色も にごる。 */
function copyLayerTex(L){
  const t = allocTex(equiW, equiH);
  renderToTex(t, equiW, equiH, () => {
    gl.disable(gl.BLEND);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(pCopy); bindQuad(pCopy);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, L.tex);
    gl.uniform1i(gl.getUniformLocation(pCopy,'tex'), 0);
    gl.uniform1f(gl.getUniformLocation(pCopy,'opacity'), 1);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  });
  return t;
}

/* 四角い絵を いま選んでいる レイヤーに 焼き込む */
function mergeInto(src, yaw, pitch, fov, aspect, feather, erase){
  const L = layers[active];
  if(!L) return;
  gl.bindTexture(gl.TEXTURE_2D, texFlat);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);

  /* 読みながら 同じ ところに 書けないので、いったん 別の 板に 描いて 入れかえる */
  if(!texScratch) texScratch = allocTex(equiW, equiH);
  renderToTex(texScratch, equiW, equiH, () => {
    gl.disable(gl.BLEND);
    gl.useProgram(pMerge); bindQuad(pMerge);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, L.tex);
    gl.uniform1i(gl.getUniformLocation(pMerge,'base'), 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texFlat);
    gl.uniform1i(gl.getUniformLocation(pMerge,'flat_'), 1);
    gl.uniform1f(gl.getUniformLocation(pMerge,'yaw'), yaw*D2R);
    gl.uniform1f(gl.getUniformLocation(pMerge,'pitch'), pitch*D2R);
    gl.uniform1f(gl.getUniformLocation(pMerge,'fov'), fov*D2R);
    gl.uniform1f(gl.getUniformLocation(pMerge,'aspect'), aspect);
    gl.uniform1f(gl.getUniformLocation(pMerge,'feather'), feather);
    gl.uniform1f(gl.getUniformLocation(pMerge,'erase'), erase ? 1 : 0);
    gl.activeTexture(gl.TEXTURE0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  });
  const t = L.tex; L.tex = texScratch; texScratch = t;
  drawView();
}

/* ---------------------------------------------------------------- レイヤー */

function blankCanvas(w, h, fill){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  if(fill){ const g = c.getContext('2d'); g.fillStyle = fill; g.fillRect(0,0,w,h); }
  return c;
}

function addLayer(src, name, at){
  const L = { tex: mkTex(src || blankCanvas(equiW, equiH)), visible:true, op:1, name: name || ('レイヤー' + (layers.length+1)) };
  if(at === undefined) layers.push(L); else layers.splice(at, 0, L);
  active = layers.indexOf(L);
  drawLayerBar();
  return L;
}

function drawLayerBar(){
  const box = $('layList');
  if(!box) return;
  box.innerHTML = '';
  /* 上に あるものを 上に 出す（見た目の 重なりと 同じ 順） */
  for(let i = layers.length - 1; i >= 0; i--){
    const L = layers[i];
    if(L.op === undefined) L.op = 1;
    const row = document.createElement('div');
    row.className = 'lrow' + (i === active ? ' on' : '') + (L.visible ? '' : ' off');

    const top = document.createElement('div');
    top.className = 't';
    top.innerHTML = '<span class="eye">' + (L.visible ? '◉' : '◌') + '</span><span>' + L.name + '</span>';
    top.onclick = (e) => {
      if(e.target.classList.contains('eye')){ L.visible = !L.visible; drawLayerBar(); drawView(); return; }
      stampInk(true);
      active = i; drawLayerBar();
    };

    const op = document.createElement('div');
    op.className = 'op';
    op.innerHTML = '<span>こさ</span><span>' + Math.round(L.op*100) + '%</span>';

    const sl = document.createElement('input');
    sl.type = 'range'; sl.min = 0; sl.max = 100; sl.step = 5;
    sl.value = Math.round(L.op*100);
    sl.oninput = () => {
      L.op = (+sl.value)/100;
      op.lastChild.textContent = sl.value + '%';
      drawView();
    };

    row.append(top, op, sl);
    box.appendChild(row);
  }
  $('bLayDel').disabled = layers.length <= 1;
}

/* ---------------------------------------------------------------- ペン */

function clearInk(){
  const k = $('ink');
  fitCanvas(k);
  k.getContext('2d').clearRect(0,0,k.width,k.height);
  inkDirty = false;
}

function pushUndo(){
  const L = layers[active];
  if(!L) return;
  undoStack.push({ i: active, tex: copyLayerTex(L) });
  const keep = equiW >= 8192 ? 3 : 10;
  while(undoStack.length > keep){ const o = undoStack.shift(); gl.deleteTexture(o.tex); }
  for(const o of redoStack) gl.deleteTexture(o.tex);
  redoStack = [];
}
function applySnap(snap, other){
  const L = layers[snap.i];
  if(!L) return false;
  other.push({ i: snap.i, tex: copyLayerTex(L) });
  gl.deleteTexture(L.tex);
  L.tex = snap.tex;
  drawView();
  return true;
}

/* 手前の 紙に 描いた ものを、いまの 向きで レイヤーに 焼く */
function stampInk(quiet){
  if(!inkDirty || !ready) return;
  pushUndo();
  const k = $('ink');
  mergeInto(k, view.yaw, view.pitch, view.fov, k.width/k.height, 0.0, tool === 'erase');
  clearInk();
  if(!quiet) toast('のせました');
}

function bindPen(){
  const k = $('ink');
  let drawing = false, last = null;
  const pos = (e) => {
    const r = k.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return [t.clientX - r.left, t.clientY - r.top];
  };
  const begin = (e) => {
    if(!ready) return;
    if(e.touches && e.touches.length > 1) return;
    const p = pos(e);
    if(tool === 'person'){ personDown(p[0], p[1]); e.preventDefault(); return; }
    if(tool === 'pick'){ pickColor(p[0], p[1]); e.preventDefault(); return; }
    if(tool === 'fill'){ pushUndo(); bucket(p[0], p[1]); e.preventDefault(); return; }
    if(tool !== 'pen' && tool !== 'erase') return;
    fitCanvas(k);
    drawing = true; last = p;
    e.preventDefault();
  };
  const move = (e) => {
    if(tool === 'person'){ if(dragPerson){ const p = pos(e); personMove(p[0], p[1]); e.preventDefault(); } return; }
    if(!drawing) return;
    const p = pos(e), c = k.getContext('2d');
    c.globalCompositeOperation = 'source-over';
    c.strokeStyle = tool === 'erase' ? '#000' : pen.color;
    c.lineWidth = pen.size; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(last[0], last[1]); c.lineTo(p[0], p[1]); c.stroke();
    last = p; inkDirty = true;
    e.preventDefault();
  };
  /* ゆびを はなしたら すぐ 球に のせる。元ツールと 同じ 描きごこちに するため。 */
  const end = () => {
    if(dragPerson){ dragPerson = false; savePeople(); }
    if(drawing){ drawing = false; stampInk(true); }
  };

  k.addEventListener('touchstart', begin, {passive:false});
  k.addEventListener('touchmove', move, {passive:false});
  k.addEventListener('touchend', end, {passive:true});
  k.addEventListener('mousedown', begin);
  k.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
}

let dragPerson = false;

/* さわった ところに いる ひとを さがす。いなければ そこに 新しく 立たせる。 */
function personDown(px, py){
  const g = $('guide'), W = g.clientWidth, H = g.clientHeight, B = basis();
  let hit = -1, best = 70;
  for(let i = 0; i < people.length; i++){
    const j = personPoints(people[i], W, H, B);
    for(const k of ['hip','head','fL','fR']){
      if(!j[k]) continue;
      const d = Math.hypot(j[k][0]-px, j[k][1]-py);
      if(d < best){ best = d; hit = i; }
    }
  }
  if(hit >= 0){
    selPerson = hit; dragPerson = true;
    syncPersonPanel();
    drawOverlay();
    return;
  }
  const f = floorHit(px, py, W, H);
  if(!f){ toast('ゆかの ある ところを さわって ください', true); return; }
  if(people.length >= 12){ toast('ひとは 12にんまでに して います', true); return; }
  people.push({ x:f.x, z:f.z, rot: view.yaw + 180, h: (+$('pHeight').value)/100, pose: $('poseSel').value || '立つ' });
  selPerson = people.length - 1;
  dragPerson = true;
  savePeople(); syncPersonPanel(); drawOverlay();
}

function personMove(px, py){
  const P = people[selPerson];
  if(!P) return;
  const g = $('guide');
  const f = floorHit(px, py, g.clientWidth, g.clientHeight);
  if(!f) return;
  P.x = f.x; P.z = f.z;
  drawOverlay();
}

function syncPersonPanel(){
  const P = people[selPerson];
  if(!P) return;
  $('pHeight').value = Math.round(P.h*100);
  $('vPH').textContent = P.h.toFixed(2);
  $('poseSel').value = P.pose;
}

/* 糸人間を いまの 見え方の まま 絵に 焼く（下絵を 線として 残したい とき） */
function bakePeople(){
  if(!ready || !people.length) return toast('ひとが いません', true);
  const k = $('ink');
  fitCanvas(k);
  const c = k.getContext('2d');
  c.clearRect(0,0,k.width,k.height);
  const keep = selPerson; selPerson = -1;
  drawPeople(c, k.width, k.height, basis());
  selPerson = keep;
  inkDirty = true;
  stampInk(true);
  toast('ひとを 絵に しました');
}

function viewPixels(){
  const c = $('view'), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
  const px = new Uint8Array(w*h*4);
  gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,px);
  return {px, w, h};
}
function pickColor(x, y){
  const {px, w, h} = viewPixels();
  const sx = Math.round(x / $('view').clientWidth * w);
  const sy = Math.round((1 - y / $('view').clientHeight) * h);   /* WebGL は 下が 原点 */
  const i = (sy*w + sx)*4;
  if(i < 0 || i >= px.length) return;
  const hex = '#' + [px[i],px[i+1],px[i+2]].map(v => v.toString(16).padStart(2,'0')).join('');
  setColor(hex, true);
  toast('色を とりました ' + hex);
  setTool('pen');
}

/* 見えている 絵の うえで 塗りつぶす。境目は 画面の 見た目で 判定する。 */
function bucket(x, y){
  const {px, w, h} = viewPixels();
  const sx = Math.round(x / $('view').clientWidth * w);
  const sy = Math.round((1 - y / $('view').clientHeight) * h);
  const at = (i) => [px[i],px[i+1],px[i+2]];
  const start = (sy*w + sx)*4;
  if(start < 0 || start >= px.length) return;
  const c0 = at(start), TOL = 40*40*3;
  const near = (i) => {
    const dr = px[i]-c0[0], dg = px[i+1]-c0[1], db = px[i+2]-c0[2];
    return dr*dr+dg*dg+db*db <= TOL;
  };
  const seen = new Uint8Array(w*h);
  const st = [sy*w+sx];
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const od = out.getContext('2d').createImageData(w, h);
  const col = pen.color, R = parseInt(col.slice(1,3),16), G = parseInt(col.slice(3,5),16), B = parseInt(col.slice(5,7),16);
  let n = 0;
  while(st.length){
    const p = st.pop();
    if(p < 0 || p >= w*h || seen[p]) continue;
    if(!near(p*4)) continue;
    seen[p] = 1; n++;
    const j = p*4;
    od.data[j] = R; od.data[j+1] = G; od.data[j+2] = B; od.data[j+3] = 255;
    const px_ = p % w;
    st.push(p+w, p-w);
    if(px_ > 0) st.push(p-1);
    if(px_ < w-1) st.push(p+1);
    if(n > w*h) break;
  }
  out.getContext('2d').putImageData(od, 0, 0);
  /* readPixels は 上下が 逆なので 戻して から 焼く */
  const fixed = document.createElement('canvas');
  fixed.width = w; fixed.height = h;
  const fc = fixed.getContext('2d');
  fc.translate(0, h); fc.scale(1, -1); fc.drawImage(out, 0, 0);
  mergeInto(fixed, view.yaw, view.pitch, view.fov, w/h, 0.0, false);
  toast('ぬりました');
}

/* ---------------------------------------------------------------- ゆび（まわす） */

function bindTurn(){
  const k = $('ink');
  let m = 0, lx = 0, ly = 0, ld = 0, lfov = 90;
  const dist = (t) => Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  const turn = (x, y) => {
    const s = view.fov/90*0.22;
    view.yaw = (view.yaw + (x-lx)*s + 540) % 360 - 180;
    view.pitch = Math.max(-89, Math.min(89, view.pitch + (y-ly)*s));
    lx = x; ly = y; drawView();
  };
  k.addEventListener('touchstart', (e) => {
    if(e.touches.length === 2){ stampInk(true); m = 2; ld = dist(e.touches); lfov = view.fov; e.preventDefault(); return; }
    if(tool !== 'turn') return;
    m = 1; lx = e.touches[0].clientX; ly = e.touches[0].clientY; e.preventDefault();
  }, {passive:false});
  k.addEventListener('touchmove', (e) => {
    if(m === 2 && e.touches.length === 2){
      const d = dist(e.touches);
      view.fov = Math.max(20, Math.min(120, lfov * (ld/Math.max(d,1))));
      $('fov').value = Math.round(view.fov);
      drawView(); e.preventDefault(); return;
    }
    if(m === 1 && tool === 'turn'){ turn(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
  }, {passive:false});
  k.addEventListener('touchend', () => { m = 0; }, {passive:true});

  let down = false;
  k.addEventListener('mousedown', (e) => { if(tool==='turn'){ down = true; lx = e.clientX; ly = e.clientY; } });
  window.addEventListener('mouseup', () => { down = false; });
  window.addEventListener('mousemove', (e) => { if(down && tool==='turn') turn(e.clientX, e.clientY); });
  k.addEventListener('wheel', (e) => {
    e.preventDefault();
    view.fov = Math.max(20, Math.min(120, view.fov + (e.deltaY>0?4:-4)));
    $('fov').value = Math.round(view.fov);
    drawView();
  }, {passive:false});
}

/* ---------------------------------------------------------------- 出し入れ */

function startWith(img, w, h){
  equiW = w; equiH = h;
  layers = []; undoStack = []; redoStack = [];
  addLayer(img || blankCanvas(w, h, '#ffffff'), '下じき');
  ready = true;
  $('empty').style.display = 'none';
  const two = Math.abs(equiW - equiH*2) <= 2;
  $('info').textContent = equiW + '×' + equiH;
  $('info').className = 'chip ' + (two ? 'ok' : 'ng');
  if(!two) toast('よこ：たて が 2：1 では ありません。360°としては ゆがみます', true);
  const max = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  if(equiW > max) toast('この端末で あつかえる 大きさ（' + max + '）を こえています', true);
  clearInk();
  drawLayerBar();
  drawView();
}

function loadFile(file){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}
function download(canvas, name){
  canvas.toBlob((blob) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
}
function cutName(){
  const s = (n) => (n<0?'-':'+') + String(Math.abs(Math.round(n))).padStart(3,'0');
  return 'gururi_y' + s(view.yaw) + '_p' + s(view.pitch) + '_f' + String(Math.round(view.fov)).padStart(3,'0') + '.png';
}
function parseName(n){
  const m = /_y([+-]\d+)_p([+-]\d+)_f(\d+)/.exec(n || '');
  return m ? { yaw:+m[1], pitch:+m[2], fov:+m[3] } : null;
}

function doCut(){
  if(!ready) return toast('さきに 白紙を つくって ください', true);
  stampInk(true);
  const n = +$('cutSize').value;
  const out = allocTex(n, n);
  renderToTex(out, n, n, () => {
    gl.useProgram(pView); bindQuad(pView);
    paintLayers(n, n, 1, (L) => {
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, L.tex);
      gl.uniform1i(gl.getUniformLocation(pView,'tex'), 0);
      gl.uniform1f(gl.getUniformLocation(pView,'yaw'), view.yaw*D2R);
      gl.uniform1f(gl.getUniformLocation(pView,'pitch'), view.pitch*D2R);
      gl.uniform1f(gl.getUniformLocation(pView,'fov'), view.fov*D2R);
      gl.uniform1f(gl.getUniformLocation(pView,'aspect'), 1.0);
      gl.uniform1f(gl.getUniformLocation(pView,'opacity'), L.op === undefined ? 1 : L.op);
    });
  });
  /* FBO は 下が 原点。画像に する ときだけ 上下を もどす。 */
  const raw = texToCanvas(out, n, n);
  gl.deleteTexture(out);
  const c = document.createElement('canvas');
  c.width = n; c.height = n;
  const cc = c.getContext('2d');
  cc.translate(0, n); cc.scale(1, -1); cc.drawImage(raw, 0, 0);
  lastCut = { yaw:view.yaw, pitch:view.pitch, fov:view.fov };
  download(c, cutName());
  drawView();
  toast('保存しました。お絵かきアプリで ひらいて ください');
}

async function doBack(file){
  if(!ready) return toast('さきに 白紙を つくって ください', true);
  const img = await loadFile(file);
  const a = parseName(file.name) || lastCut || view;
  if(!parseName(file.name) && !lastCut) toast('向きが わからないので いまの 向きで はります', true);
  pushUndo();
  mergeInto(img, a.yaw, a.pitch, a.fov, 1.0, 0.04, false);
  toast('もどしました（よこ ' + Math.round(a.yaw) + ' / たて ' + Math.round(a.pitch) + '）');
}

function doSave(){
  if(!ready) return toast('さきに 白紙を つくって ください', true);
  stampInk(true);
  download(flatten(), 'panorama_' + equiW + 'x' + equiH + '.png');
  drawView();
  toast('1枚に して 保存しました');
}

/* 作業データ＝レイヤーを たてに 並べた 1枚の PNG。名前に 枚数を 入れておく。 */
function saveProject(){
  if(!ready) return toast('さきに 白紙を つくって ください', true);
  stampInk(true);
  const n = layers.length;
  const c = blankCanvas(equiW, equiH*n);
  const g = c.getContext('2d');
  for(let i = 0; i < n; i++) g.drawImage(layerToCanvas(layers[i]), 0, equiH*i);
  download(c, 'gururi_proj_' + equiW + 'x' + equiH + '_n' + n + '.png');
  drawView();
  toast('つづきの ため に 保存しました（レイヤー ' + n + ' まい）');
}
async function loadProject(file){
  const m = /_(\d+)x(\d+)_n(\d+)/.exec(file.name || '');
  const img = await loadFile(file);
  if(!m){ toast('この ファイルは つづき用では ないようです', true); return; }
  const w = +m[1], h = +m[2], n = +m[3];
  if(img.width !== w || img.height !== h*n){ toast('中身と 名前が 合いません', true); return; }
  equiW = w; equiH = h;
  layers = []; undoStack = []; redoStack = [];
  for(let i = 0; i < n; i++){
    const c = blankCanvas(w, h);
    c.getContext('2d').drawImage(img, 0, h*i, w, h, 0, 0, w, h);
    addLayer(c, i === 0 ? '下じき' : ('レイヤー' + i));
  }
  active = layers.length - 1;
  ready = true;
  $('empty').style.display = 'none';
  $('info').textContent = w + '×' + h;
  $('info').className = 'chip ok';
  clearInk(); drawLayerBar(); drawView();
  toast('つづきを ひらきました（レイヤー ' + n + ' まい）');
}

/* ---------------------------------------------------------------- しあげ */

let toastTimer;
function toast(msg, bad){
  const el = $('toast');
  el.textContent = msg;
  el.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, bad ? 5200 : 2400);
}

function setTool(t){
  stampInk(true);
  tool = t;
  [...$('tool').children].forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  $('panPen').classList.toggle('hide', !(t === 'pen' || t === 'erase' || t === 'fill'));
  $('panTurn').classList.toggle('hide', t !== 'turn');
  $('panPerson').classList.toggle('hide', t !== 'person');
  $('tip').innerHTML =
    t === 'turn'  ? '<b>まわす</b>：ゆびで なぞると 回る／2本ゆびで つまむと 寄る。<br>こまかく 描くときは <b>切り出す</b> → お絵かきアプリ → <b>もどす</b>。'
  : t === 'person'? '<b>ひと</b>：ゆかを さわると そこに 立ちます。ひとを なぞると ゆかの 上を 動きます。<br>下絵なので 絵には なりません。線に したい ときは <b>ひとを 絵に する</b>。'
  : '描いて ゆびを はなすと、そのまま 球に のります。<br>2本ゆびで つまめば 描きながらでも 寄れます。';
}

const PALETTE = ['#1E1C14','#FFFFFF','#E1DD60','#F2A0B8','#7FBF6A','#5B8FD9','#C86A3A'];

(function main(){
  if(!initGL()) return;
  bindPen(); bindTurn();
  window.addEventListener('resize', drawView);

  const cbox = $('colors');
  PALETTE.forEach((col) => {
    const b = document.createElement('button');
    b.style.background = col;
    b.onclick = () => { setColor(col, true); if(tool !== 'pen') setTool('pen'); };
    cbox.appendChild(b);
  });
  try { recent = JSON.parse(localStorage.getItem('gururi_recent') || '[]'); } catch(e){ recent = []; }
  drawRecent();
  bindWheel();
  setColor('#1E1C14', false);
  $('size').oninput = (e) => { pen.size = +e.target.value; $('vSize').textContent = e.target.value; };

  $('tool').onclick = (e) => {
    const b = e.target.closest('button[data-tool]');
    if(b) setTool(b.dataset.tool);
  };

  const swap = (a, b) => {
    if(a < 0 || b < 0 || a >= layers.length || b >= layers.length) return;
    stampInk(true);
    const t = layers[a]; layers[a] = layers[b]; layers[b] = t;
    active = b; drawLayerBar(); drawView();
  };
  $('bLayToggle').onclick = () => $('layPanel').classList.toggle('hide');
  $('bLayUp').onclick = () => swap(active, active + 1);     // 上に 出す
  $('bLayDown').onclick = () => swap(active, active - 1);

  $('bLayAdd').onclick = () => {
    if(!ready) return toast('さきに 白紙を つくって ください', true);
    if(layers.length >= 6) return toast('レイヤーは 6まいまでに して います', true);
    stampInk(true);
    addLayer(null, 'レイヤー' + layers.length);
    drawView();
    toast('レイヤーを ふやしました');
  };
  $('bLayDel').onclick = () => {
    if(layers.length <= 1) return;
    if(!confirm('この レイヤーを 消します。よろしいですか？')) return;
    layers.splice(active, 1);
    active = Math.min(active, layers.length-1);
    drawLayerBar(); drawView();
  };

  $('bGuide').onclick = () => {
    guideMode = (guideMode + 1) % 3;
    $('bGuide').classList.toggle('btn-y', guideMode !== 0);
    drawOverlay();
    toast(['パース線 なし','ゆか','ゆか＋天井'][guideMode]);
  };
  $('bGuide').classList.add('btn-y');

  $('bNew').onclick = () => {
    const n = prompt('よこの 大きさ（2048 / 4096 / 8192）', '4096');
    if(!n) return;
    const w = Math.max(512, parseInt(n,10) || 4096);
    startWith(null, w, Math.round(w/2));
    setTool('pen');
    toast('白紙を つくりました。そのまま 描けます');
  };
  $('bOpen').onclick = () => $('fEqui').click();
  $('fEqui').onchange = async (e) => {
    if(e.target.files[0]){
      const img = await loadFile(e.target.files[0]);
      startWith(img, img.width, img.height);
    }
    e.target.value = '';
  };
  $('bLoad').onclick = () => $('fProj').click();
  $('fProj').onchange = async (e) => {
    if(e.target.files[0]) await loadProject(e.target.files[0]);
    e.target.value = '';
  };
  $('bSave').onclick = () => {
    if(confirm('1枚に して 保存しますか？\nキャンセルを えらぶと、あとで つづきを 描くための ファイルに します。')) doSave();
    else saveProject();
  };

  document.querySelectorAll('[data-look]').forEach(b => {
    b.onclick = () => {
      stampInk(true);
      const [y,p] = b.dataset.look.split(',').map(Number);
      view.yaw = y; view.pitch = p;
      document.querySelectorAll('[data-look]').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      drawView();
    };
  });

  $('fov').oninput = (e) => { view.fov = +e.target.value; drawView(); };
  $('eye').oninput = (e) => {
    EYE = +e.target.value; $('vEye').textContent = EYE.toFixed(1);
    if(CEIL < EYE + 0.1){ CEIL = EYE + 0.1; $('ceil').value = CEIL; $('vCeil').textContent = CEIL.toFixed(1); }
    drawOverlay();
  };
  $('ceil').oninput = (e) => {
    CEIL = +e.target.value; $('vCeil').textContent = CEIL.toFixed(1);
    drawOverlay();
  };

  $('bUndo').onclick = () => {
    clearInk();
    const snap = undoStack.pop();
    if(!snap) return toast('もどせる ものが ありません');
    applySnap(snap, redoStack);
  };
  $('bRedo').onclick = () => {
    const snap = redoStack.pop();
    if(!snap) return toast('やり直せる ものが ありません');
    applySnap(snap, undoStack);
  };

  /* ひとの パネル */
  const ps = $('poseSel');
  for(const name in POSES) ps.add(new Option(name, name));
  ps.onchange = () => {
    const P = people[selPerson];
    if(P){ P.pose = ps.value; savePeople(); drawOverlay(); }
  };
  $('pHeight').oninput = (e) => {
    $('vPH').textContent = ((+e.target.value)/100).toFixed(2);
    const P = people[selPerson];
    if(P){ P.h = (+e.target.value)/100; drawOverlay(); }
  };
  $('pHeight').onchange = savePeople;
  const turnP = (d) => {
    const P = people[selPerson];
    if(!P) return toast('ひとを えらんで ください', true);
    P.rot = (P.rot + d + 360) % 360;
    savePeople(); drawOverlay();
  };
  $('pTurnL').onclick = () => turnP(-15);
  $('pTurnR').onclick = () => turnP(15);
  $('pDel').onclick = () => {
    if(selPerson < 0 || !people[selPerson]) return toast('ひとを えらんで ください', true);
    people.splice(selPerson, 1);
    selPerson = Math.min(selPerson, people.length-1);
    savePeople(); drawOverlay();
  };
  $('pClear').onclick = () => {
    if(!people.length) return;
    if(!confirm('ひとを ぜんぶ 消します。よろしいですか？')) return;
    people = []; selPerson = -1;
    savePeople(); drawOverlay();
  };
  $('pBake').onclick = bakePeople;

  loadPeople();

  $('bCut').onclick = doCut;
  $('bBack').onclick = () => $('fFlat').click();
  $('fFlat').onchange = async (e) => {
    if(e.target.files[0]) await doBack(e.target.files[0]);
    e.target.value = '';
  };
})();
</script>
</body>
</html>
