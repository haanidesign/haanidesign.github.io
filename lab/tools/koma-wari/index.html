<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#E1DD60">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>コマ割り表</title>
<link rel="manifest" href="manifest.webmanifest?v=5">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=5">
<link rel="stylesheet" href="css/layout.css?v=5">
<link rel="stylesheet" href="css/parts.css?v=5">
<!-- 共通の 見た目で つかう 字 -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<!-- はぁにラボ 共通の 見た目（さいごに 読む） -->
<link rel="stylesheet" href="../skin/soft.css?v=11">
<link rel="stylesheet" href="css/soft.css?v=5">
<script type="module" src="../skin/icons.js?v=8"></script>
</head>
<body>

<div id="app">

  <div id="top">
    <button class="name" id="home" title="コマ割り表">コマ割り表</button>
    <button class="size dot" id="docName" title="さくひんの 名前">むだい</button>
    <button class="ver dot" id="ver" title="この版の ばんごう。おすと さいしんに します">v5</button>
    <button class="size dot" id="docSize" title="ページ数">—</button>
    <span class="spacer"></span>
    <button id="undo" class="btn-sm" title="もどす（2本指で たたいても もどせます）" aria-label="もどす" disabled>↶</button>
    <button id="redo" class="btn-sm" title="やりなおし（3本指で たたく）" aria-label="やりなおし" disabled>↷</button>
    <button id="help" class="btn-sm" title="つかいかた" aria-label="つかいかた">？</button>
    <button id="fit" class="btn-sm" title="画面に あわせる" aria-label="画面に あわせる">⤢</button>
    <button id="full" class="btn-sm" title="全画面に する" aria-label="全画面">⛶</button>
    <button id="export" class="btn-sm btn-g" title="ページごとの PNG を ZIP で 書き出す">⬇ 書き出す</button>
  </div>

  <div id="stage">
    <div id="view"></div>
  </div>

  <div id="list">
    <div id="listGrip" title="上下に なぞって 高さを 変える"></div>
    <div id="playbar">
      <button id="nextS" class="btn-sm" title="つぎの ページ（マンガは 左へ すすむ）" aria-label="つぎの ページ">◀</button>
      <span class="tnum dot" id="pageLbl">—</span>
      <button id="prevS" class="btn-sm" title="まえの ページ" aria-label="まえの ページ">▶</button>
      <span class="spacer"></span>
      <button id="reroll" class="btn-sm btn-y" title="この ページの コマ割りを 作りなおす">🔄 割りなおす</button>
      <button id="fold" class="btn-sm" title="下の 帯を たたむ" aria-label="たたむ">▾</button>
    </div>
    <div id="strip"></div>
  </div>

  <div id="tools">
    <button class="tool" data-k="script"><i>📝</i>台本</button>
    <button class="tool" data-k="cast"><i>😊</i>キャラ</button>
    <button class="tool" data-k="panel"><i>⬛</i>コマ</button>
    <button class="tool" data-k="page"><i>📄</i>ページ</button>
    <button class="tool" data-k="ai"><i>🪄</i>AI</button>
    <button class="tool" data-k="view"><i>👁</i>表示</button>
    <button class="tool" data-k="file"><i>📂</i>さくひん</button>
  </div>

  <div id="props">
    <div id="propHead"><span class="title" id="propTtl">せってい</span><span class="spacer" style="flex:1"></span></div>
    <div id="propBody"></div>
  </div>
</div>

<div id="sheetBack"></div>
<div id="sheet" role="dialog" aria-label="せってい"></div>

<div id="busy"><div class="card">
  <b id="busyMsg">書き出して います</b>
  <div class="bar"><span id="busyFill"></span></div>
  <span id="busyPct" class="dot"></span>
  <button id="busyCancel" class="btn-sm" type="button" hidden>やめる</button>
</div></div>

<!-- うまく 立ち上がらなかった ときの 知らせ -->
<div id="deadman"><div>
  <b>うまく 読みこめませんでした</b>
  <p id="deadwhy"></p>
  <button id="deadfix" type="button">🔄 読みこみ直す</button>
  <button id="deadhide" type="button">とじる</button>
</div></div>
<script>
(function () {
  var ok = false, shown = false;
  window.__ready = function () {
    ok = true;
    var d = document.getElementById('deadman');
    if (d) d.style.display = 'none';
  };
  function show(why) {
    if (ok || shown) return;
    shown = true;
    var t = String(why || '').trim();
    if (!t || t === 'Script error.') t = '中の ファイルが 前の ままに なって いる ようです。下の ボタンで 取り直すと 直ります。';
    var d = document.getElementById('deadman'), w = document.getElementById('deadwhy');
    if (w) w.textContent = t.slice(0, 300);
    if (d) d.style.display = 'flex';
  }
  window.addEventListener('error', function (e) {
    var m = e && e.message;
    if (!m && e && e.target && e.target.tagName === 'SCRIPT') m = '中の ファイルが 読めませんでした（' + String(e.target.src || '').split('/').pop() + '）';
    show(m);
  }, true);
  window.addEventListener('unhandledrejection', function (e) { show(e && e.reason && (e.reason.message || e.reason)); });
  setTimeout(function () { show('じかんが かかりすぎました'); }, 8000);
  document.addEventListener('DOMContentLoaded', function () {
    var fix = document.getElementById('deadfix'), hide = document.getElementById('deadhide');
    if (hide) hide.onclick = function () { document.getElementById('deadman').style.display = 'none'; };
    if (fix) fix.onclick = function () {
      fix.textContent = 'かたづけ中…';
      var jobs = [];
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
      if (window.caches && caches.keys)
        jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
      Promise.all(jobs).catch(function () {}).then(function () { location.replace(location.pathname + '?r=' + Date.now()); });
    };
  });
})();
</script>
<div id="toast" role="status" aria-live="polite"></div>
<!-- Android の ファイル選びは accept の 拡張子を 見ない ことが ある ので しぼりこまない -->
<input type="file" id="fileIn" hidden>
<script type="module" src="js/main.js?v=5"></script>
</body>
</html>
