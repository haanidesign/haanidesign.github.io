<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PSD アバタースタジオ</title>
<script src="lib/ag-psd.js"></script>
<style>
  :root{
    --bg:#14161b; --panel:#1b1e26; --panel2:#232733; --text:#d7dae2; --dim:#8b90a0;
    --accent:#6ea8ff; --chip:#262b38; --chip-on:#31406b; --hot:#ff8a4a;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{background:var(--bg); color:var(--text); font:13px/1.5 "Segoe UI","Hiragino Sans",sans-serif; display:flex; overflow:hidden}
  #stage{flex:1; display:flex; align-items:center; justify-content:center; min-width:0; position:relative}
  #stage.transparent{background-image:conic-gradient(#22252c 0 25%,#191c22 0 50%,#22252c 0 75%,#191c22 0);background-size:24px 24px}
  #stage.gb{background:#00b140}
  #stage.dark{background:#101216}
  #holder{position:relative; line-height:0}
  canvas{max-width:100%; max-height:100vh; image-rendering:auto}
  #ov{position:absolute; left:0; top:0; background:none}
  #ov.edit{cursor:crosshair}
  #drop{position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(30,50,90,.5); font-size:20px; pointer-events:none}
  #edbar{position:absolute; left:0; right:0; top:0; background:rgba(255,138,74,.94); color:#241000;
    padding:7px 12px; display:none; gap:10px; align-items:center; font-size:12px; z-index:6; flex-wrap:wrap}
  #edbar.on{display:flex}
  #edbar b{flex-shrink:0}
  #edbar .edhint{color:#5a2c00; flex:1; min-width:140px}
  #edbar .btn{background:rgba(255,255,255,.85); border-color:rgba(0,0,0,.2); color:#241000; padding:3px 10px}
  #edbar .btn.go{background:#241000; border-color:#241000; color:#ffd9c2}
  #recbar{position:absolute; left:0; right:0; top:0; background:rgba(255,138,74,.94); color:#241000; font-weight:600;
    padding:7px 12px; display:none; gap:10px; align-items:center; font-size:12px; z-index:5}
  #recbar.on{display:flex}
  #panel{width:330px; overflow-y:auto; background:var(--panel); padding:14px 16px 40px; flex-shrink:0}
  #panel::-webkit-scrollbar{width:8px}
  #panel::-webkit-scrollbar-thumb{background:#333a4a; border-radius:4px}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px}
  .chip{padding:4px 12px; border-radius:14px; background:var(--chip); border:1px solid #333a4a; cursor:pointer; user-select:none; font-size:12px; color:var(--dim)}
  .chip.on{background:var(--chip-on); border-color:var(--accent); color:#dfe9ff}
  h3{font-size:11px; color:var(--dim); font-weight:600; margin:16px 0 8px; letter-spacing:.05em}
  .btns{display:flex; flex-wrap:wrap; gap:6px}
  .btn{padding:5px 13px; border-radius:6px; background:var(--panel2); border:1px solid #333a4a; color:var(--text); cursor:pointer; font-size:12px}
  .btn:hover{border-color:var(--accent)}
  .btn.on{background:var(--chip-on); border-color:var(--accent)}
  .btn.go{background:var(--accent); border-color:var(--accent); color:#0b1020; font-weight:700}
  .btn.go:hover{background:#8bb9ff}
  .btn:disabled{opacity:.4; cursor:default}
  .row{display:flex; align-items:center; gap:8px; margin:5px 0}
  .row label{width:88px; flex-shrink:0; color:var(--text); font-size:12px}
  .row input[type=range]{flex:1; accent-color:var(--accent); height:4px}
  .row .val{width:36px; text-align:right; color:var(--dim); font-size:11px}
  select{background:var(--panel2); color:var(--text); border:1px solid #333a4a; border-radius:4px; font-size:11px; padding:1px 4px}
  input[type=number]{background:var(--panel2); color:var(--text); border:1px solid #333a4a; border-radius:4px; font:inherit; font-size:12px; padding:3px 5px; width:62px}
  #layerlist .row label{width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  #layerlist .lrow{border-bottom:1px solid #262b38; padding:4px 0 6px}
  #layerlist .lrow.off{opacity:.45}
  #layerlist .row{margin:2px 0}
  #layerlist .row input[type=checkbox]{accent-color:var(--accent); width:14px; height:14px; flex-shrink:0}
  #layerlist .sub{padding-left:20px}
  #layerlist .sub label{width:auto; color:var(--dim); font-size:11px}
  #layerlist .rootchk{display:flex; align-items:center; gap:4px; white-space:nowrap; cursor:pointer}
  #layerlist .rootchk:hover{color:var(--text)}
  #layerlist .lrow.isroot .rootchk{color:var(--accent)}
  #layerlist .sub select{flex:1; min-width:0}
  #layerlist .sub .val{width:32px}
  #layerlist .lrow.editing{outline:1px solid var(--hot); outline-offset:2px; border-radius:4px}
  #layerlist .bonebar{gap:5px; flex-wrap:wrap}
  #layerlist .btn.tiny{padding:2px 8px; font-size:11px}
  #layerlist .bulkbar{gap:6px; margin:0 0 8px; flex-wrap:wrap}
  #layerlist .bulkbar .btn{flex:1; min-width:0}
  #layerlist .reftag{font-size:10.5px; color:var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #layerlist .gbrow{background:var(--panel2); border-radius:6px; padding:8px 10px; margin-bottom:8px; border-bottom:none}
  #layerlist .gbrow > .row:first-child label{color:var(--text); font-size:12px; font-weight:600}
  #layerlist .gbrow .hint{margin-top:4px}
  #note{color:var(--dim); font-size:11px; margin-top:6px}
  #fileInput{display:none}
  #psdBox{border:1px dashed #4a5268; border-radius:8px; padding:12px; text-align:center;
    color:var(--dim); cursor:pointer; margin-bottom:12px; font-size:12px; user-select:none}
  #psdBox:hover, #psdBox.dragging{border-color:var(--accent); color:#dfe9ff; background:rgba(110,168,255,.06)}
  #psdInfo{margin-top:4px; font-size:11px; color:var(--accent); word-break:break-all}
  .hint{color:var(--dim); font-size:11px; line-height:1.6; margin-top:6px}
</style>
</head>
<body>
<div id="stage" class="transparent">
  <div id="holder"><canvas id="cv"></canvas><canvas id="ov"></canvas></div>
  <div id="drop">PSD / PNG をドロップ</div>
  <div id="recbar"><span>書き出し中</span><span id="recinfo"></span></div>
  <div id="edbar">
    <b>ボーン編集中</b><span id="edinfo"></span>
    <span class="edhint">根元 → 先端 の順に画像の上をクリック（2〜6点）</span>
    <button class="btn" id="edUndo">1つ戻す</button>
    <button class="btn" id="edClear">全消し</button>
    <button class="btn go" id="edDone">完了</button>
  </div>
</div>
<div id="panel">
  <h3 style="margin-top:0">読み込み</h3>
  <div id="psdBox">
    <div>クリック、または PSD / PNG複数枚 をドロップ</div>
    <div id="psdInfo">未読込</div>
  </div>
  <div class="chips" id="chips"></div>
  <div id="controls"></div>

  <h3>ループ書き出し</h3>
  <div class="row" style="gap:6px">
    <label style="width:auto">秒</label><input type="number" id="dur" value="3" min="1" max="15" step="0.5">
    <label style="width:auto">fps</label><input type="number" id="fps" value="30" min="10" max="60" step="1">
  </div>
  <div class="row" style="gap:6px">
    <label style="width:auto">まばたき間隔</label><input type="number" id="bi" value="2.5" min="0.5" step="0.1">
  </div>
  <div class="row" style="gap:6px">
    <label style="width:auto">形式</label>
    <select id="fmt">
      <option value="webm">WebM</option>
      <option value="mp4">MP4</option>
      <option value="gif">GIF</option>
    </select>
    <label style="width:auto" id="gifWLab">幅</label>
    <select id="gifW">
      <option value="320">320px</option>
      <option value="480" selected>480px</option>
      <option value="640">640px</option>
      <option value="0">原寸</option>
    </select>
  </div>
  <div class="btns">
    <button class="btn" id="loopBtn">ループ確認</button>
    <button class="btn go" id="recBtn">書き出す</button>
  </div>
  <div class="hint">書き出し中はマウス追従・マイク・ランダム動作が自動でオフになり、揺れが落ち着いてから録画されるので、先頭と末尾が繋がります。<span id="fmtHint"></span></div>

  <h3>設定</h3>
  <div class="btns">
    <button class="btn" id="saveJson">設定を保存</button>
    <button class="btn" id="loadJson">設定を読む</button>
    <button class="btn" id="resetBtn">初期に戻す</button>
  </div>

  <h3>背景</h3>
  <div class="btns" id="bgBtns">
    <button class="btn on" data-bg="transparent">透過</button>
    <button class="btn" data-bg="gb">GB</button>
    <button class="btn" data-bg="dark">ダーク</button>
  </div>

  <h3>レイヤー(役割の割り当て)</h3>
  <div id="layerlist"></div>
  <div id="note"></div>
  <input type="file" id="fileInput" accept=".psd,.png" multiple>
</div>

<script>
"use strict";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);

/* ---------------- パラメータ定義 ---------------- */
const PARAM_DEFS = [
  {sec:"頭の向き"},
  {id:"headX",  label:"角度X",     min:-1,  max:1,  def:0},
  {id:"headY",  label:"角度Y",     min:-1,  max:1,  def:0},
  {id:"headZ",  label:"角度Z",     min:-1,  max:1,  def:0},
  {sec:"目(左右独立)"},
  {id:"eyeL",   label:"左目の開き", min:0,   max:1.2,def:1},
  {id:"eyeR",   label:"右目の開き", min:0,   max:1.2,def:1},
  {id:"gazeX",  label:"視線X",     min:-1,  max:1,  def:0},
  {id:"gazeY",  label:"視線Y",     min:-1,  max:1,  def:0},
  {id:"irisScale",label:"瞳スケール",min:.6, max:1.4,def:1},
  {id:"browY",  label:"眉(上下)",  min:-1,  max:1,  def:0},
  {sec:"口"},
  {id:"mouthOpen", label:"開き",     min:0,  max:1, def:0},
  {id:"mouthSmile",label:"形(笑い)", min:-1, max:1, def:0},
  {sec:"体・物理"},
  {id:"bodyTilt",   label:"体の傾き",  min:-1, max:1,  def:0},
  {id:"chestHeight",label:"胸の高さ",  min:-1, max:1,  def:0},
  {id:"chestBounce",label:"胸の揺れ",  min:0,  max:10, def:4},
  {id:"swayGain",   label:"揺れの強さ",min:0,  max:1,  def:0.3},
  {id:"hairSway",   label:"髪の揺れ",  min:0,  max:3,  def:1},
  {id:"breathDepth",label:"呼吸の深さ",min:0,  max:3,  def:1},
  {id:"softness",   label:"柔らかさ",  min:0,  max:4,  def:2},
];
const TOGGLES = [
  {id:"idle",       label:"アイドル",     def:true},
  {id:"autoBlink",  label:"自動まばたき", def:true},
  {id:"randomMotion",label:"ランダム動作",def:false, live:true},
  {id:"randomLip",  label:"ランダムリップ",def:false, live:true},
  {id:"mouseTrack", label:"マウス追従",   def:false, live:true},
  {id:"micLip",     label:"マイクリップ", def:false, live:true},
  {id:"hairPhys",   label:"髪の物理",     def:true},
];
const PRESETS = {
  "通常":  {eyeL:1, eyeR:1, mouthOpen:0,  mouthSmile:0,  browY:0},
  "笑顔":  {eyeL:.12,eyeR:.12,mouthOpen:.25,mouthSmile:1, browY:.3},
  "驚き":  {eyeL:1.2,eyeR:1.2,mouthOpen:.75,mouthSmile:0, browY:1},
  "ジト目":{eyeL:.45,eyeR:.45,mouthOpen:0,  mouthSmile:-.3,browY:-.6},
  "ウインク左":{eyeL:0, eyeR:1, mouthSmile:.5},
  "ウインク右":{eyeL:1, eyeR:0, mouthSmile:.5},
};
const ROLES = ["auto","body","head","frontHair","backHair","chest","arm",
               "eyeWhite","iris","eyelash","eyeClose","brow",
               "mouth","mouthClose","mouthOpen","hide"];
const ROLE_LABELS = {auto:"自動", body:"体", head:"頭", frontHair:"前髪", backHair:"後髪", chest:"胸", arm:"腕",
  eyeWhite:"白目", iris:"瞳", eyelash:"まつ毛", eyeClose:"閉じ目", brow:"眉",
  mouth:"口(1枚)", mouthClose:"閉じ口", mouthOpen:"開き口", hide:"非表示"};
/* 差し替えのしきい値 */
const EYE_SWAP = 0.35;    // 目の開きがこれ未満なら閉じ目に差し替える
const MOUTH_SWAP = 0.15;  // 口の開きがこれ以上なら開き口に差し替える

const P = {};      // 現在値(スライダー)
const target = {}; // プリセットのイージング先
PARAM_DEFS.filter(d=>d.id).forEach(d=>{ P[d.id]=d.def; target[d.id]=null; });
const T = {};
TOGGLES.forEach(t=> T[t.id]=t.def);

/* ---------------- UI構築 ---------------- */
const chipEls = {};
const chipsEl = $("chips");
TOGGLES.forEach(t=>{
  const el = document.createElement("div");
  el.className = "chip" + (t.def ? " on" : "");
  el.textContent = t.label;
  el.onclick = ()=>{ T[t.id] = !T[t.id]; el.classList.toggle("on", T[t.id]);
    if(t.id==="micLip" && T.micLip) startMic(); };
  chipsEl.appendChild(el);
  chipEls[t.id] = el;
});
function syncChips(){ TOGGLES.forEach(t=> chipEls[t.id].classList.toggle("on", T[t.id])); }

const controlsEl = $("controls");
{
  const h = document.createElement("h3"); h.textContent = "表情プリセット";
  controlsEl.appendChild(h);
  const bd = document.createElement("div"); bd.className = "btns";
  Object.keys(PRESETS).forEach(name=>{
    const b = document.createElement("button"); b.className = "btn"; b.textContent = name;
    b.onclick = ()=>{ Object.entries(PRESETS[name]).forEach(([k,v])=> target[k]=v); };
    bd.appendChild(b);
  });
  controlsEl.appendChild(bd);
}
const sliderEls = {};
PARAM_DEFS.forEach(d=>{
  if(d.sec){ const h = document.createElement("h3"); h.textContent = d.sec; controlsEl.appendChild(h); return; }
  const row = document.createElement("div"); row.className = "row";
  const lab = document.createElement("label"); lab.textContent = d.label;
  const inp = document.createElement("input");
  inp.type = "range"; inp.min = d.min; inp.max = d.max; inp.step = 0.01; inp.value = d.def;
  const val = document.createElement("span"); val.className = "val"; val.textContent = (+d.def).toFixed(1);
  inp.oninput = ()=>{ P[d.id] = +inp.value; target[d.id] = null; val.textContent = (+inp.value).toFixed(1); };
  row.append(lab, inp, val);
  controlsEl.appendChild(row);
  sliderEls[d.id] = {inp, val};
});
function syncSlider(id){
  const s = sliderEls[id]; if(!s) return;
  s.inp.value = P[id]; s.val.textContent = P[id].toFixed(1);
}
function syncAllSliders(){ Object.keys(sliderEls).forEach(syncSlider); }

$("bgBtns").addEventListener("click", e=>{
  const b = e.target.closest("[data-bg]"); if(!b) return;
  document.querySelectorAll("#bgBtns .btn").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  $("stage").className = b.dataset.bg;
});

/* ---------------- 素材読み込み ---------------- */
let layers = [];       // {name, canvas, left, top, width, height, role}
let psdW = 768, psdH = 768, psdName = "output_layers.psd";
let facePivot = {x:384, y:400};

function guessRole(name){
  const n = name.toLowerCase();
  // 差分絵。開き/閉じで差し替えて使う
  if(/eye.*close|close.*eye|目.*閉|閉じ目/.test(n)) return "eyeClose";
  if(/mouth.*open|open.*mouth|口.*開|開き口/.test(n)) return "mouthOpen";
  if(/mouth.*close|close.*mouth|口.*閉|閉じ口/.test(n)) return "mouthClose";
  if(/front.*hair|前髪/.test(n)) return "frontHair";
  if(/back.*hair|後ろ?髪/.test(n)) return "backHair";
  if(/chest|breast|bust|胸|oppai/.test(n)) return "chest";
  if(/\barms?\b|sleeve|glove|handwear|腕|袖|手/.test(n)) return "arm";
  if(/eyewhite|sclera|白目/.test(n)) return "eyeWhite";
  if(/iris|irides|pupil|瞳/.test(n)) return "iris";
  if(/eyelash|lash|まつ|睫|目/.test(n)) return "eyelash";
  if(/brow|眉/.test(n)) return "brow";
  if(/mouth|口/.test(n)) return "mouth";
  if(/face|nose|\bear|顔|鼻|耳/.test(n)) return "head";   // ears / earwear も頭に追従させる
  if(/hair|髪/.test(n)) return "frontHair";
  return "body";
}
const HEAD_ROLES = new Set(["head","frontHair","backHair","eyeWhite","iris","eyelash","eyeClose","brow",
                            "mouth","mouthClose","mouthOpen"]);
const DEPTH = {body:0, chest:0.05, arm:0.05, backHair:0.35, head:0.7,
               mouth:0.8, mouthClose:0.8, mouthOpen:0.8,
               eyeWhite:0.85, iris:0.85, eyelash:0.85, eyeClose:0.85, brow:0.92, frontHair:1};
const EYE_ROLES = new Set(["eyeWhite","iris","eyelash","eyeClose"]);

function roleOverrides(){ try{ return JSON.parse(localStorage.getItem("psdRoles:"+psdName)||"{}"); }catch(e){ return {}; } }
/* リグ(親子付け・オンオフ)はレイヤー名をキーに保存する */
function rigOverrides(){ try{ return JSON.parse(localStorage.getItem("psdRig:"+psdName)||"{}"); }catch(e){ return {}; } }
function rigOf(l){
  return {parent: l.parent || null, on: l.on !== false,
          bone: (l.bone||[]).map(p=>({x:Math.round(p.x), y:Math.round(p.y)})),
          boneRef: l.boneRef || null,
          rows: l.rows, cols: l.cols, bprm: {...l.bprm}};
}
function saveRig(){
  const o = {};
  layers.forEach(l=>{
    if(l.parent || l.on === false || (l.bone && l.bone.length) || l.boneRef) o[l.name] = rigOf(l);
  });
  if(globalBone.bone.length) o.__global = {bone: globalBone.bone.map(p=>({x:Math.round(p.x), y:Math.round(p.y)})),
                                           bprm: {...globalBone.bprm}};
  localStorage.setItem("psdRig:"+psdName, JSON.stringify(o));
}
function applyRig(){
  const rg = rigOverrides();
  const gb = rg.__global;
  globalBone.bone = (gb && Array.isArray(gb.bone)) ? gb.bone.map(p=>({x:+p.x, y:+p.y})) : [];
  globalBone.bprm = Object.assign({amp:6, speed:1, phase:0, lag:0.25}, (gb && gb.bprm) || {});
  layers.forEach(l=>{
    const r = rg[l.name];
    l.parent = (r && r.parent) || null;
    l.on = r ? r.on !== false : true;
    l.bone = (r && Array.isArray(r.bone)) ? r.bone.map(p=>({x:+p.x, y:+p.y})) : [];
    l.boneRef = (r && r.boneRef) || null;
    l.rows = (r && r.rows) || 12;
    l.cols = (r && r.cols) || Math.max(4, Math.round(((r && r.rows) || 12) * l.width / Math.max(l.height,1)));
    l.bprm = Object.assign({amp:8, speed:1, phase:0, lag:0.2}, (r && r.bprm) || {});
  });
  // 存在しない親・自己参照・循環を落とす
  layers.forEach(l=>{ if(l.parent && !layers.some(x=>x.name===l.parent)) l.parent = null; });
  layers.forEach(l=>{ if(l.parent === l.name) l.parent = null; });
  layers.forEach(l=>{ if(hasCycle(l)) l.parent = null; });
  // 借り先が消えている / 自分自身 / 借り先も借りている、は無効にする
  layers.forEach(l=>{
    if(!l.boneRef) return;
    const o = layers.find(x=>x.name === l.boneRef);
    if(!o || o === l || o.boneRef || !(o.bone && o.bone.length >= 2)) l.boneRef = null;
  });
}
function parentOf(l){ return l.parent ? layers.find(x=>x.name===l.parent) : null; }
function childrenOf(name){ return layers.filter(x=>x.parent === name); }
/* 「親レイヤー」= 自分は親を持たず、2枚以上を従えているレイヤー。
   別に状態を持たず、その時の親子関係から判定する。 */
function isRoot(l){ return !l.parent && childrenOf(l.name).length >= 2; }
/* ワンクリックで、ぶら下がり先のないレイヤーを全部このレイヤーの子にする */
function toggleRoot(l){
  if(isRoot(l)){
    childrenOf(l.name).forEach(x=> x.parent = null);
  } else {
    const prev = layers.find(isRoot);
    l.parent = null;
    layers.forEach(x=>{
      if(x === l) return;
      if(x.parent == null || (prev && x.parent === prev.name)) x.parent = l.name;
    });
  }
  layers.forEach(x=>{ if(hasCycle(x)) x.parent = null; });
  saveRig();
  buildLayerList();
  $("note").textContent = isRoot(l)
    ? `${l.name} を親レイヤーにしました（${childrenOf(l.name).length}枚がついていきます）`
    : "親レイヤーを解除しました";
}
function hasCycle(start){
  const seen = new Set();
  let cur = start;
  while(cur){
    if(seen.has(cur.name)) return true;
    seen.add(cur.name);
    cur = parentOf(cur);
    if(seen.size > 64) return true;
  }
  return false;
}

function flatten(node, arr){
  (node.children||[]).forEach(ch=>{
    if(ch.children) flatten(ch, arr);
    else if(ch.canvas) arr.push(ch);
  });
}

/* 最後に読んだPSDをIndexedDBへ保存し、次回自動復元する */
function idb(){
  return new Promise((res, rej)=>{
    const q = indexedDB.open("avatarViewer", 1);
    q.onupgradeneeded = ()=> q.result.createObjectStore("files");
    q.onsuccess = ()=> res(q.result);
    q.onerror = ()=> rej(q.error);
  });
}
async function idbPut(key, val){
  const db = await idb();
  return new Promise((res, rej)=>{
    const tx = db.transaction("files", "readwrite");
    tx.objectStore("files").put(val, key);
    tx.oncomplete = res; tx.onerror = ()=> rej(tx.error);
  });
}
async function idbGet(key){
  const db = await idb();
  return new Promise((res, rej)=>{
    const rq = db.transaction("files").objectStore("files").get(key);
    rq.onsuccess = ()=> res(rq.result); rq.onerror = ()=> rej(rq.error);
  });
}

async function loadPsdFile(file){
  psdName = file.name;
  const buf = await file.arrayBuffer();
  applyPsd(buf);
  try{ await idbPut("lastPsd", {name: file.name, buf}); }catch(e){ /* 保存失敗は無視 */ }
}

function finishLoad(){
  if(boneEdit){ boneEdit = null; $("edbar").classList.remove("on"); ov.classList.remove("edit"); }
  applyRig();
  // 前髪が後髪より先(下)に来ていたら配列は上→下順とみなして反転
  const fi = layers.findIndex(l=>l.role==="frontHair");
  const bi = layers.findIndex(l=>l.role==="backHair");
  if(fi >= 0 && bi >= 0 && fi < bi) layers.reverse();
  // 頭の回転ピボット: faceレイヤーの顎あたり
  const face = layers.find(l=>/face|顔/.test(l.name.toLowerCase()));
  facePivot = face
    ? {x: face.left + face.width/2, y: face.top + face.height*0.95}
    : {x: psdW/2, y: psdH*0.5};
  cv.width = psdW; cv.height = psdH;
  buildLayerList();
  $("psdInfo").textContent = `${psdName} — ${layers.length}レイヤー (${psdW}×${psdH})`;
  const hasChest = layers.some(l=>l.role==="chest");
  $("note").textContent = hasChest
    ? "胸レイヤー検出: 物理演算が有効です"
    : "胸レイヤー未検出 — レイヤー名に chest / 胸 を含めるか、下のリストで役割を「胸」にすると揺れ物理が有効になります";
}

/* PSDが持つレイヤー矩形は、絵の実寸とは限らない。Live2D用テンプレートなどでは
   全レイヤーが (0,0) 始まりの大きな矩形で保存されていることがあり、そのまま使うと
   「レイヤーの中心」「レイヤーの上端」が絵とかけ離れて、支点が全部ずれる。
   実際に不透明な部分だけに切り詰めてから使う。 */
function trimToContent(l){
  const box = contentBox(l.canvas);
  if(!box) return null;                       // 完全に透明なレイヤーは捨てる
  const [x0,y0,x1,y1] = box, w = x1-x0+1, h = y1-y0+1;
  if(x0 === 0 && y0 === 0 && w === l.canvas.width && h === l.canvas.height) return l;  // 既にぴったり
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(l.canvas, x0, y0, w, h, 0, 0, w, h);
  l.canvas = c;
  l.left += x0; l.top += y0; l.width = w; l.height = h;
  return l;
}

function applyPsd(buf){
  const psd = agPsd.readPsd(buf, {skipCompositeImageData:true, skipThumbnail:true});
  psdW = psd.width; psdH = psd.height;
  const flat = [];
  flatten(psd, flat);
  const ov = roleOverrides();
  const trimmed = [];
  flat.forEach(l=>{
    const o = {
      name: l.name || "?",
      canvas: l.canvas,
      left: l.left||0, top: l.top||0,
      width: (l.right||0)-(l.left||0), height: (l.bottom||0)-(l.top||0),
      role: ov[l.name] || guessRole(l.name||""),
    };
    if(trimToContent(o)) trimmed.push(o);
  });
  layers = trimmed;
  finishLoad();
}

/* PNG複数枚: ファイル名をレイヤー名として扱う。不透明部分の外接矩形を取り、
   PSDレイヤーと同じ left/top/width/height を持たせる(ピボット計算のため)。 */
function contentBox(c){
  const d = c.getContext("2d").getImageData(0,0,c.width,c.height).data;
  let x0=c.width, y0=c.height, x1=-1, y1=-1;
  for(let y=0; y<c.height; y++) for(let x=0; x<c.width; x++){
    if(d[(y*c.width+x)*4+3] > 8){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  }
  return x1 < 0 ? null : [x0,y0,x1,y1];
}
async function applyPngs(files){
  const arr = [...files].sort((a,b)=> a.name.localeCompare(b.name, "ja"));
  const ov = roleOverrides();
  const out = [];
  psdW = 0; psdH = 0;
  for(const f of arr){
    const img = await new Promise(r=>{ const i = new Image(); i.onload = ()=>r(i); i.src = URL.createObjectURL(f); });
    psdW = Math.max(psdW, img.width); psdH = Math.max(psdH, img.height);
    const full = document.createElement("canvas");
    full.width = img.width; full.height = img.height;
    full.getContext("2d", {willReadFrequently:true}).drawImage(img, 0, 0);
    const box = contentBox(full) || [0, 0, img.width-1, img.height-1];
    const [x0,y0,x1,y1] = box, w = x1-x0+1, h = y1-y0+1;
    const crop = document.createElement("canvas");
    crop.width = w; crop.height = h;
    crop.getContext("2d").drawImage(full, x0, y0, w, h, 0, 0, w, h);
    const name = f.name.replace(/\.png$/i, "");
    out.push({ name, canvas: crop, left:x0, top:y0, width:w, height:h,
               role: ov[name] || guessRole(name) });
  }
  layers = out;
  psdName = "png:" + arr.length + "枚";
  finishLoad();
}

/* ---------------- 物理(バネ・ダンパー) ---------------- */
class Spring{
  constructor(){ this.x = 0; this.v = 0; }
  step(dt, k, c, input){
    this.v += (-k*this.x - c*this.v + input) * dt;
    this.x += this.v * dt;
    if(!isFinite(this.x)){ this.x = 0; this.v = 0; }
  }
}
const springs = { frontHair: new Spring(), backHair: new Spring(), chestY: new Spring(), chestX: new Spring(), arm: new Spring() };
function resetSprings(){ Object.values(springs).forEach(s=>{ s.x = 0; s.v = 0; }); }

/* ---------------- 入力 ---------------- */
let mouse = {x:0, y:0};
addEventListener("pointermove", e=>{
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = (e.clientY / innerHeight) * 2 - 1;
});
let micLevel = 0, micStarted = false;
async function startMic(){
  if(micStarted) return; micStarted = true;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const ac = new AudioContext();
    const src = ac.createMediaStreamSource(stream);
    const an = ac.createAnalyser(); an.fftSize = 512;
    src.connect(an);
    const buf = new Float32Array(an.fftSize);
    (function poll(){
      an.getFloatTimeDomainData(buf);
      let s = 0; for(let i=0;i<buf.length;i++) s += buf[i]*buf[i];
      micLevel = Math.min(1, Math.sqrt(s/buf.length) * 12);
      requestAnimationFrame(poll);
    })();
  }catch(e){ micStarted = false; T.micLip = false; syncChips(); }
}

/* ---------------- アニメーション ---------------- */
let blink = 0, blinkTimer = 2.5;   // 0=開 1=閉
let prevHead = {x:0, y:0};
let lipPhase = 0;

function smooth(cur, tgt, dt, speed){ return cur + (tgt - cur) * Math.min(1, dt*speed); }

// ループモード用: 角速度を「尺の整数分の1周」に丸め、先頭と末尾を必ず一致させる
const durVal = ()=> Math.max(1, +$("dur").value || 3);
function W(w, loop){
  if(!loop) return w;
  const D = durVal();
  const n = Math.max(1, Math.round(w * D / (2*Math.PI)));
  return 2*Math.PI*n / D;
}
// 山型のまばたきカーブ (q:0→1 で 開→閉→開)
function blinkShape(q){ return q < 0.4 ? q/0.4 : 1-(q-0.4)/0.6; }

/**
 * 1フレーム進める。loop=true なら時刻 t だけで決まる決定論的な動きになり、
 * 乱数・マウス・マイクは一切混ざらない(= 何度回しても同じ絵になる)。
 */
function step(t, dt, loop){
  // プリセットへのイージング
  for(const k in target){
    if(target[k] === null) continue;
    P[k] = smooth(P[k], target[k], dt, 10);
    if(Math.abs(P[k]-target[k]) < .005){ P[k] = target[k]; target[k] = null; }
    if(!loop) syncSlider(k);
  }

  let headX = P.headX, headY = P.headY, headZ = P.headZ, bodyTilt = P.bodyTilt;
  let gazeX = P.gazeX, gazeY = P.gazeY;
  if(T.idle){
    headX += Math.sin(t*W(0.55,loop))*0.045 + Math.sin(t*W(1.31,loop))*0.02;
    headY += Math.sin(t*W(0.42,loop)+1)*0.035;
    headZ += Math.sin(t*W(0.35,loop)+2)*0.03;
    bodyTilt += Math.sin(t*W(0.3,loop))*0.02;
  }
  if(T.randomMotion && !loop){
    headX += Math.sin(t*0.9)*0.25 + Math.sin(t*0.23+4)*0.2;
    headY += Math.sin(t*0.7+2)*0.18;
    headZ += Math.sin(t*0.5+1)*0.12;
  }
  if(T.mouseTrack && !loop){
    headX += mouse.x*0.6; headY += mouse.y*0.4;
    gazeX += mouse.x*0.8; gazeY += mouse.y*0.8;
  }
  const breath = T.idle ? Math.sin(t*W(1.9,loop))*0.5+0.5 : 0;

  // まばたき: ループ時は等間隔、通常時はランダム間隔
  if(T.autoBlink){
    if(loop){
      const D = durVal();
      const per = D / Math.max(1, Math.round(D / Math.max(0.5, +$("bi").value || 2.5)));
      const tp = t % per;
      blink = tp < 0.28 ? blinkShape(tp/0.28) : 0;
    } else {
      blinkTimer -= dt;
      if(blinkTimer <= 0){ blinkTimer = 1.8 + Math.random()*3.5; }
      blink = (blinkTimer > 0 && blinkTimer < 0.28) ? blinkShape(1 - blinkTimer/0.28) : 0;
    }
  } else blink = 0;

  // リップ
  let mouthOpen = P.mouthOpen;
  if(T.randomLip && !loop){
    lipPhase += dt * (4 + Math.sin(t*0.8)*2);
    mouthOpen = Math.max(mouthOpen, (Math.sin(lipPhase)*0.5+0.5) * (Math.sin(t*0.47)*0.5+0.5) * 0.9);
  }
  if(T.micLip && !loop) mouthOpen = Math.max(mouthOpen, micLevel);

  // 物理入力: 頭の移動速度を揺れ物へ伝える
  const hx = headX*30, hy = headY*20;
  const velX = (hx - prevHead.x)/Math.max(dt,1e-4), velY = (hy - prevHead.y)/Math.max(dt,1e-4);
  prevHead = {x:hx, y:hy};
  const soft = P.softness;
  const gain = P.swayGain;
  const hk = 90/(1 + soft*0.9), hc = 2*Math.sqrt(hk)*0.4;
  const wind = T.idle ? (Math.sin(t*W(1.4,loop)) + Math.sin(t*W(2.3,loop)+1)*0.5) : 0;
  if(T.hairPhys){
    /* 速度だけで駆動すると、マウスを止めた瞬間に髪も止まってしまう。
       首の向きそのものに引きずられる項(drag)を足すと、向けた側と逆に流れて残る。 */
    const hg = P.hairSway;
    const drag   = -headX * 300 * hg;
    const kick   = -velX * 2.2 * hg;
    const breeze = wind * 120 * hg;
    springs.frontHair.step(dt, hk,      hc,     drag + kick + breeze);
    springs.backHair.step( dt, hk*0.85, hc*0.9, drag*1.25 + kick*1.3 + breeze*1.35);
  } else { springs.frontHair.x = springs.frontHair.v = 0; springs.backHair.x = springs.backHair.v = 0; }
  const cb = P.chestBounce;
  const chestGain = 0.25 + gain;
  const ck = 70 / (1 + soft*0.8);
  const cc = 2*Math.sqrt(ck)*0.32;
  const idleBob = T.idle ? (Math.sin(t*W(2.3,loop)) + Math.sin(t*W(3.7,loop)+1)*0.4) : 0;
  // 胸も呼吸に合わせて持ち上がると、息をしている感じが強く出る
  const breathLift = (breath - 0.5) * 34 * P.breathDepth;
  springs.chestY.step(dt, ck, cc, (idleBob*42 - velY*12) * cb * chestGain - breathLift);
  springs.chestX.step(dt, ck, cc, (Math.sin(t*W(1.7,loop))*9 - velX*10) * cb * chestGain);
  // 腕: 肩を支点にした振り子。体の傾きと頭の動きに遅れてついてくる。
  const ak = 55/(1 + soft*0.8), ac = 2*Math.sqrt(ak)*0.5;
  const armDrive = T.idle ? Math.sin(t*W(1.15,loop)+0.6)*7 : 0;
  springs.arm.step(dt, ak, ac, (armDrive - velX*5 + bodyTilt*60) * (0.3 + gain));

  // ボーンの位相。尺で正規化した 0..1 なので、整数周期なら必ずループする。
  const u = ((t / durVal()) % 1 + 1) % 1;

  return {headX, headY, headZ, bodyTilt, gazeX, gazeY, mouthOpen, breath, blink, u};
}

/* ---------------- ボーン ---------------- */
const BONE_PRESETS = {
  wobble:{amp:5,  speed:4, phase:0, lag:.12, label:"プルプル"},
  wave:  {amp:14, speed:1, phase:0, lag:.3,  label:"くねくね"},
  sway:  {amp:7,  speed:1, phase:0, lag:.18, label:"ゆらゆら"},
};
/* 全体ボーン: どのレイヤーにも属さない1本。腰から頭まで引いておくと、
   キャラ全部がこの骨の曲がりに乗る。パーツ自体は歪ませず(顔が崩れるため)、
   各レイヤーを「その位置での骨の変形」で剛体的に動かす。 */
const globalBone = {name:"__global", bone:[], bprm:{amp:6, speed:1, phase:0, lag:0.25}, on:true};
const globalBoneActive = ()=> globalBone.bone.length >= 2;

/* ボーンは他のレイヤーのものを借りられる。借りた側は自分のメッシュを、
   貸した側の骨で変形するので、複数枚が1本の骨でまとまって動く。 */
function boneOwner(l){
  if(!l.boneRef) return l;
  const o = layers.find(x => x.name === l.boneRef);
  return (o && o !== l && o.bone && o.bone.length >= 2) ? o : l;
}
const boneActive = l => {
  if(l.on === false) return false;
  const o = boneOwner(l);
  return !!(o.bone && o.bone.length >= 2);
};

/* 静止状態の各骨の長さ・角度・根元からの累積距離 */
function restInfo(pts){
  const b = []; let total = 0;
  for(let i=0; i<pts.length-1; i++){
    const dx = pts[i+1].x-pts[i].x, dy = pts[i+1].y-pts[i].y;
    const len = Math.hypot(dx,dy) || 1e-6;
    b.push({o:pts[i], len, ang:Math.atan2(dy,dx), cum:total});
    total += len;
  }
  return {b, total};
}
/* u(0..1) の位相で骨を順に曲げる。lag で先端ほど遅れて追従する。 */
function poseBones(l, u){
  const pts = l.bone;
  if(!pts || pts.length < 2) return null;
  const {b, total} = restInfo(pts);
  const p = l.bprm, cyc = Math.max(1, Math.round(p.speed)), TAU = Math.PI*2;
  const out = []; let cur = {x:pts[0].x, y:pts[0].y}, acc = 0;
  for(let i=0; i<b.length; i++){
    acc += Math.sin((u*cyc + p.phase - i*p.lag) * TAU) * p.amp * Math.PI/180;
    const na = b[i].ang + acc;
    out.push({o:{x:cur.x, y:cur.y}, ang:na, len:b[i].len});
    cur = {x: cur.x + Math.cos(na)*b[i].len, y: cur.y + Math.sin(na)*b[i].len};
  }
  return {b, out, total};
}
/* 頂点を、最も近い骨に沿った距離で重み付けして動かす(リニアブレンドスキニング) */
function skin(vx, vy, pose){
  const {b, out, total} = pose;
  let bestD = 1e18, s = 0;
  for(let i=0; i<b.length; i++){
    const c = Math.cos(b[i].ang), si = Math.sin(b[i].ang);
    const rx = vx-b[i].o.x, ry = vy-b[i].o.y;
    const tt = Math.max(0, Math.min(b[i].len, rx*c + ry*si));
    const px = b[i].o.x + c*tt, py = b[i].o.y + si*tt;
    const d = (vx-px)**2 + (vy-py)**2;
    if(d < bestD){ bestD = d; s = b[i].cum + tt; }
  }
  const avg = total/b.length;
  let sx = 0, sy = 0, sw = 0;
  for(let i=0; i<b.length; i++){
    const c = b[i].cum + b[i].len/2;
    let w = 1 - Math.abs(s-c)/avg;
    if(w <= 0) continue;
    w = w*w*(3-2*w);
    const rc = Math.cos(b[i].ang), rs = Math.sin(b[i].ang);
    const rx = vx-b[i].o.x, ry = vy-b[i].o.y;
    const alo = rx*rc + ry*rs, per = -rx*rs + ry*rc;
    const nc = Math.cos(out[i].ang), ns = Math.sin(out[i].ang);
    sx += (out[i].o.x + alo*nc - per*ns) * w;
    sy += (out[i].o.y + alo*ns + per*nc) * w;
    sw += w;
  }
  if(sw < 1e-6){
    const i = b.length-1, rc = Math.cos(b[i].ang), rs = Math.sin(b[i].ang);
    const rx = vx-b[i].o.x, ry = vy-b[i].o.y;
    const alo = rx*rc + ry*rs, per = -rx*rs + ry*rc;
    const nc = Math.cos(out[i].ang), ns = Math.sin(out[i].ang);
    return [out[i].o.x + alo*nc - per*ns, out[i].o.y + alo*ns + per*nc];
  }
  return [sx/sw, sy/sw];
}
/* 三角形1枚ぶんテクスチャを貼る。e は継ぎ目を隠すための膨張量。 */
function tri(g, img, s, d, e){
  const [x0,y0,x1,y1,x2,y2] = s, [u0,v0,u1,v1,u2,v2] = d;
  const cx = (u0+u1+u2)/3, cy = (v0+v1+v2)/3;
  if(!(e > 0)) e = 0.6;
  const ex = (x,y)=>{ const dx=x-cx, dy=y-cy, l=Math.hypot(dx,dy)||1; return [x+dx/l*e, y+dy/l*e]; };
  const [a0,b0] = ex(u0,v0), [a1,b1] = ex(u1,v1), [a2,b2] = ex(u2,v2);
  g.save();
  g.beginPath(); g.moveTo(a0,b0); g.lineTo(a1,b1); g.lineTo(a2,b2); g.closePath(); g.clip();
  const dx1 = x1-x0, dy1 = y1-y0, dx2 = x2-x0, dy2 = y2-y0;
  const det = dx1*dy2 - dx2*dy1;
  if(Math.abs(det) > 1e-8){
    const m11 = (u1-u0)*dy2/det - (u2-u0)*dy1/det;
    const m12 = (v1-v0)*dy2/det - (v2-v0)*dy1/det;
    const m21 = (u2-u0)*dx1/det - (u1-u0)*dx2/det;
    const m22 = (v2-v0)*dx1/det - (v1-v0)*dx2/det;
    g.transform(m11, m12, m21, m22, u0-m11*x0-m21*y0, v0-m12*x0-m22*y0);
    g.drawImage(img, 0, 0);
  }
  g.restore();
}

/* ---------------- 行列 ---------------- */
/* canvas の setTransform 順 [a,b,c,d,e,f]。mul(m,n) は「n を適用してから m」 */
const IDENT = [1,0,0,1,0,0];
function mul(m, n){
  return [ m[0]*n[0]+m[2]*n[1], m[1]*n[0]+m[3]*n[1],
           m[0]*n[2]+m[2]*n[3], m[1]*n[2]+m[3]*n[3],
           m[0]*n[4]+m[2]*n[5]+m[4], m[1]*n[4]+m[3]*n[5]+m[5] ];
}
const mTranslate = (x,y)=> [1,0,0,1,x,y];
const mScale = (sx,sy)=> [sx,0,0,sy,0,0];
const mRotate = a => { const c=Math.cos(a), s=Math.sin(a); return [c,s,-s,c,0,0]; };
const mShearX = k => [1,0,k,1,0,0];
const mAround = (m,cx,cy)=> mul(mTranslate(cx,cy), mul(m, mTranslate(-cx,-cy)));
const mChain = (...ms)=> ms.reduce(mul, IDENT);

/* ---------------- 描画 ---------------- */
function draw(S){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,psdW,psdH);
  if(!layers.length) return;

  const px = facePivot.x, py = facePivot.y;      // 首ピボット
  const bx = psdW/2, by = psdH;                  // 体ピボット(下端)
  const eyeOpen = {L: P.eyeL*(1-S.blink), R: P.eyeR*(1-S.blink)};

  /* 閉じ目・開き口の差分絵があるときは、変形ではなく差し替えで表現する。
     無ければ従来どおり(まぶたを縦に潰す / 口を縦に伸ばす)。 */
  const hasEyeClose = layers.some(l => l.role === "eyeClose" && l.on !== false);
  const closedSide = {L: hasEyeClose && eyeOpen.L < EYE_SWAP,
                      R: hasEyeClose && eyeOpen.R < EYE_SWAP};
  const mouthIsOpen = S.mouthOpen >= MOUTH_SWAP;

  /* 全体(体の傾き + 呼吸)。親を持たないレイヤーの根元になる。
     呼吸は3つを重ねる: 腰を支点に縦へ伸び、わずかに横へ膨らみ、体ごと浮く。
     縦だけだと引き伸ばしに、上下だけだと平行移動に見えるので、両方いる。 */
  const br = S.breath, bd = P.breathDepth;
  const bSy = 1 + br * 0.011 * bd;    // 胸が持ち上がる
  const bSx = 1 + br * 0.004 * bd;    // 息を吸って横に膨らむ
  const bBob = -br * 3.4 * bd;        // 体ごとわずかに浮く(px)
  const G = mul(mTranslate(0, bBob),
                mAround(mul(mRotate(S.bodyTilt*0.09), mScale(bSx, bSy)), bx, by));

  // グループ追従: 頭系は首ピボットで回転+視差、それ以外はわずかに追従
  function groupMat(l){
    const role = l.role, depth = DEPTH[role] ?? 0;
    if(HEAD_ROLES.has(role)){
      return mul(
        mAround(mRotate(S.headZ*0.13 * (role==="backHair" ? 0.75 : 1)), px, py),
        mTranslate(S.headX*26*depth, S.headY*16*depth + S.headY*4)
      );
    }
    return mTranslate(S.headX*3, S.headY*1.5);
  }

  // そのレイヤー自身の変形(役割ごと)
  function roleMat(l){
    const role = l.role;
    const cx = l.left + l.width/2, cy = l.top + l.height/2;
    if(role === "frontHair" || role === "backHair"){
      const s = springs[role].x;
      return mAround(mul(mShearX(s*0.02), mRotate(s*0.006)), cx, l.top);
    }
    if(role === "chest"){
      const sy = springs.chestY.x, sx = springs.chestX.x;
      return mAround(mChain(mTranslate(sx*1.5, P.chestHeight*-8 + sy*1.0),
                            mScale(1 - sy*0.015, 1 + sy*0.03),
                            mRotate(sx*0.004)), cx, l.top);
    }
    if(role === "arm"){
      // 肩(上端)を支点に振る
      return mAround(mRotate(springs.arm.x*0.0016), cx, l.top);
    }
    if(role === "brow") return mTranslate(0, P.browY*-7);
    if(role === "mouth"){
      return mAround(mScale(1 + P.mouthSmile*0.35 - S.mouthOpen*0.1, 1 + S.mouthOpen*1.4), cx, cy);
    }
    // 差分絵は形が既に描かれているので、笑いの横幅だけ効かせる
    if(role === "mouthClose") return mAround(mScale(1 + P.mouthSmile*0.35, 1), cx, cy);
    if(role === "mouthOpen"){
      // 開き具合で縦だけ連続的に変える(パクパクの強弱)
      const k = 0.45 + 0.55*Math.min(1, S.mouthOpen);
      return mAround(mScale(1 + P.mouthSmile*0.35, k), cx, cy);
    }
    if(role === "iris") return mTranslate(S.gazeX*7, S.gazeY*4);
    return IDENT;
  }

  const anchorOf = l => (l.bone && l.bone.length) ? {x:l.bone[0].x, y:l.bone[0].y}
                                                  : {x:l.left + l.width/2, y:l.top + l.height/2};

  /* そのレイヤー自身の変形を、点 pt の近傍でアフィン行列に均したもの。
     ボーンはメッシュ変形で行列にならないので、pt のまわりを数値微分して
     一次近似する。子はこの行列を受け取って親の動きについていく。 */
  /* メッシュ変形を、点 pt のまわりで数値微分して一次近似したアフィン行列 */
  function linearizeAt(pose, pt){
    const d = 2;
    const [x0,y0] = skin(pt.x, pt.y, pose);
    const [xa,ya] = skin(pt.x+d, pt.y, pose);
    const [xb,yb] = skin(pt.x, pt.y+d, pose);
    const a = (xa-x0)/d, b = (ya-y0)/d, c = (xb-x0)/d, e = (yb-y0)/d;
    return [a, b, c, e, x0-(a*pt.x + c*pt.y), y0-(b*pt.x + e*pt.y)];
  }
  const gPose = globalBoneActive() ? poseBones(globalBone, S.u) : null;
  /* 全体ボーンぶん。各レイヤーの位置で評価するので、パーツは歪まず位置と角度だけ動く */
  function globalMat(l){ return gPose ? linearizeAt(gPose, anchorOf(l)) : IDENT; }

  function ownAffineAt(l, pt){
    if(l.on === false) return IDENT;
    if(boneActive(l)){
      const pose = poseBones(boneOwner(l), S.u);
      if(!pose) return IDENT;
      return linearizeAt(pose, pt);
    }
    return roleMat(l);
  }

  /* 祖先ぶんだけの行列(自分自身の変形は含まない)。
     親を明示したレイヤーは、自動のグループ追従を親の変形に置き換える。 */
  const baseCache = new Map();
  function baseOf(l, depth){
    if(baseCache.has(l.name)) return baseCache.get(l.name);
    const pa = (depth||0) < 16 ? parentOf(l) : null;
    let m;
    if(!pa) m = mul(globalMat(l), G);   // 全体ボーンは一番外側
    else {
      const paLocal = mul(pa.parent ? IDENT : groupMat(pa), ownAffineAt(pa, anchorOf(l)));
      m = mul(baseOf(pa, (depth||0)+1), paLocal);
    }
    baseCache.set(l.name, m);
    return m;
  }

  for(const l of layers){
    const role = l.role;
    if(role === "hide") continue;
    if(role === "mouthOpen"  && !mouthIsOpen) continue;
    if(role === "mouthClose" &&  mouthIsOpen) continue;
    const cx = l.left + l.width/2, cy = l.top + l.height/2;
    const B = mul(baseOf(l, 0), l.parent ? IDENT : groupMat(l));

    // --- ボーン: 役割の変形を差し替えてメッシュで描く ---
    if(boneActive(l)){
      const pose = poseBones(boneOwner(l), S.u);
      ctx.setTransform(B[0],B[1],B[2],B[3],B[4],B[5]);
      const cols = l.cols, rows = l.rows;
      const sxs = [], sys = [], gx = [], gy = [];
      for(let r=0; r<=rows; r++) for(let c=0; c<=cols; c++){
        const px2 = l.left + l.width*c/cols, py2 = l.top + l.height*r/rows;
        const [nx,ny] = skin(px2, py2, pose);
        sxs.push(px2); sys.push(py2); gx.push(nx); gy.push(ny);
      }
      const idx = (r,c)=> r*(cols+1) + c;
      // セルの大きさに比例して膨らませないと、大きい絵で三角形の継ぎ目が線になる
      const EX = Math.max(0.8, (l.width/cols + l.height/rows) * 0.5 * 0.09);
      for(let r=0; r<rows; r++) for(let c=0; c<cols; c++){
        const a = idx(r,c), b = idx(r,c+1), dd = idx(r+1,c), e = idx(r+1,c+1);
        tri(ctx, l.canvas, [sxs[a]-l.left, sys[a]-l.top, sxs[b]-l.left, sys[b]-l.top, sxs[dd]-l.left, sys[dd]-l.top],
                           [gx[a],gy[a], gx[b],gy[b], gx[dd],gy[dd]], EX);
        tri(ctx, l.canvas, [sxs[b]-l.left, sys[b]-l.top, sxs[e]-l.left, sys[e]-l.top, sxs[dd]-l.left, sys[dd]-l.top],
                           [gx[b],gy[b], gx[e],gy[e], gx[dd],gy[dd]], EX);
      }
      continue;
    }

    const M = mul(B, l.on === false ? IDENT : roleMat(l));
    ctx.setTransform(M[0],M[1],M[2],M[3],M[4],M[5]);

    if(EYE_ROLES.has(role) && l.on !== false){
      const face = layers.find(x=>x.role==="head" && /face|顔/.test(x.name.toLowerCase()));
      const faceW = face ? face.width : psdW*0.25;
      const faceCx = face ? face.left + face.width/2 : psdW/2;
      const singleEye = l.width < faceW*0.45;
      const midX = cx;
      const sides = singleEye ? [cx < faceCx ? "L" : "R"] : ["L","R"];
      for(const side of sides){
        // 閉じ目の差分絵があるなら、その側は開き絵と閉じ絵のどちらか一方だけ描く
        if(role === "eyeClose"){ if(!closedSide[side]) continue; }
        else if(closedSide[side]) continue;
        ctx.save();
        ctx.beginPath();
        if(singleEye)         ctx.rect(l.left-20, l.top-30, l.width+40, l.height+60);
        else if(side === "L") ctx.rect(l.left-20, l.top-30, midX-(l.left-20), l.height+60);
        else                  ctx.rect(midX, l.top-30, l.left+l.width+20-midX, l.height+60);
        ctx.clip();
        // 閉じ絵はそのままの形で出す。開き絵だけ開き具合で潰す。
        const open = (role === "eyeClose") ? 1 : Math.max(0.02, eyeOpen[side]);
        const ecy = cy + (role==="eyelash" ? l.height*0.15 : l.height*0.3);
        ctx.translate(0, ecy); ctx.scale(1, Math.min(open,1)); ctx.translate(0, -ecy);
        if(role === "iris" && P.irisScale !== 1){
          const icx = singleEye ? cx : (side==="L" ? (l.left+midX)/2 : (midX+l.left+l.width)/2);
          ctx.translate(icx, cy); ctx.scale(P.irisScale, P.irisScale); ctx.translate(-icx, -cy);
        }
        if(open > 1){ ctx.translate(0, -(open-1)*6); }
        ctx.drawImage(l.canvas, l.left, l.top);
        ctx.restore();
      }
    } else {
      ctx.drawImage(l.canvas, l.left, l.top);
    }
  }
  ctx.setTransform(1,0,0,1,0,0);
}

/* ---------------- ボーン編集 ---------------- */

/* 表示は max-width/max-height で縮むので、実際の描画倍率から PSD 座標へ戻す */
function viewScale(){ return cv.clientWidth ? cv.clientWidth / psdW : 1; }
function syncOverlay(){
  if(ov.width !== psdW || ov.height !== psdH){ ov.width = psdW; ov.height = psdH; }
  ov.style.width = cv.clientWidth + "px";
  ov.style.height = cv.clientHeight + "px";
}
ov.addEventListener("pointerdown", e=>{
  if(!boneEdit) return;
  const r = ov.getBoundingClientRect(), k = viewScale() || 1;
  if(boneEdit.bone.length >= 6) return;
  boneEdit.bone.push({x:(e.clientX - r.left)/k, y:(e.clientY - r.top)/k});
});
function drawBoneOverlay(){
  syncOverlay();
  octx.setTransform(1,0,0,1,0,0);
  octx.clearRect(0,0,ov.width,ov.height);
  if(!boneEdit) return;
  const k = viewScale() || 1;
  const pts = boneEdit.bone;
  octx.strokeStyle = "#ff7a45"; octx.lineWidth = 3/k;
  octx.beginPath();
  pts.forEach((p,i)=> i ? octx.lineTo(p.x,p.y) : octx.moveTo(p.x,p.y));
  octx.stroke();
  pts.forEach((p,i)=>{
    octx.fillStyle = i ? "#fff" : "#6ea8ff";
    octx.beginPath(); octx.arc(p.x, p.y, 7/k, 0, 7); octx.fill();
    octx.strokeStyle = "#ff7a45"; octx.lineWidth = 2/k; octx.stroke();
  });
  $("edinfo").textContent = `${boneEdit === globalBone ? "全体ボーン" : boneEdit.name} / ${pts.length}点`;
}

/* ---------------- GIF エンコーダ ----------------
   ブラウザに GIF 書き出しは無いので自前。中央値分割で共通パレットを作り、
   LZW で GIF89a を組み立てる。透過は1bit(GIFの仕様上、半透明は持てない)。 */

// --- 中央値分割 ---
function medianCut(px, n){
  const range = b => { let mn=[255,255,255], mx=[0,0,0];
    for(const p of b) for(let i=0;i<3;i++){ if(p[i]<mn[i])mn[i]=p[i]; if(p[i]>mx[i])mx[i]=p[i]; }
    return Math.max(mx[0]-mn[0], mx[1]-mn[1], mx[2]-mn[2]); };
  const widest = b => { let mn=[255,255,255], mx=[0,0,0];
    for(const p of b) for(let i=0;i<3;i++){ if(p[i]<mn[i])mn[i]=p[i]; if(p[i]>mx[i])mx[i]=p[i]; }
    const d=[mx[0]-mn[0], (mx[1]-mn[1])*1.2, mx[2]-mn[2]];
    return d[0]>=d[1]&&d[0]>=d[2] ? 0 : (d[1]>=d[2] ? 1 : 2); };
  let boxes = [px];
  while(boxes.length < n){
    boxes.sort((a,b)=> range(b)-range(a));
    const b = boxes.shift();
    if(!b || b.length < 2){ if(b) boxes.push(b); break; }
    const ch = widest(b);
    b.sort((x,y)=> x[ch]-y[ch]);
    const m = b.length >> 1;
    boxes.push(b.slice(0,m), b.slice(m));
  }
  return boxes.filter(b=>b && b.length).map(b=>{
    let r=0,g=0,bl=0; for(const p of b){ r+=p[0]; g+=p[1]; bl+=p[2]; }
    return [Math.round(r/b.length), Math.round(g/b.length), Math.round(bl/b.length)];
  });
}

// --- LZW (GIF仕様) ---
function lzwEncode(indices, minCodeSize){
  const out = [];
  let cur = 0, curBits = 0;
  const chunk = [];
  const flushChunk = ()=>{ if(!chunk.length) return; out.push(chunk.length, ...chunk); chunk.length = 0; };
  const push = (code, len)=>{
    cur |= code << curBits; curBits += len;
    while(curBits >= 8){
      chunk.push(cur & 255); cur >>= 8; curBits -= 8;
      if(chunk.length === 255) flushChunk();
    }
  };
  const clear = 1 << minCodeSize, eoi = clear + 1;
  let dict, next, codeSize;
  const reset = ()=>{ dict = new Map(); next = eoi + 1; codeSize = minCodeSize + 1; };
  reset(); push(clear, codeSize);
  let prefix = indices[0];
  for(let i=1;i<indices.length;i++){
    const k = indices[i], key = prefix * 4096 + k;
    if(dict.has(key)){ prefix = dict.get(key); continue; }
    push(prefix, codeSize);
    dict.set(key, next++);
    if(next - 1 === (1 << codeSize) && codeSize < 12) codeSize++;
    if(next > 4095){ push(clear, codeSize); reset(); }
    prefix = k;
  }
  push(prefix, codeSize);
  push(eoi, codeSize);
  if(curBits > 0){ chunk.push(cur & 255); if(chunk.length === 255) flushChunk(); }
  flushChunk();
  out.push(0);   // ブロック終端
  return out;
}

/* frames: [{index:Uint8Array}] / palette: [[r,g,b],...] / transparent: index or -1 */
function gifBuild(frames, w, h, delayCs, palette, transparent){
  const bytes = [];
  const u8 = v => bytes.push(v & 255);
  const u16 = v => { bytes.push(v & 255, (v >> 8) & 255); };
  const str = s => { for(const c of s) bytes.push(c.charCodeAt(0)); };

  let bits = 1; while((1 << bits) < palette.length) bits++;   // 色表サイズ(2^bits)
  const tableLen = 1 << bits;

  str("GIF89a");
  u16(w); u16(h);
  u8(0x80 | ((bits-1) << 4) | (bits-1));   // 全体色表あり
  u8(0); u8(0);
  for(let i=0;i<tableLen;i++){
    const c = palette[i] || [0,0,0];
    u8(c[0]); u8(c[1]); u8(c[2]);
  }
  // 無限ループ
  u8(0x21); u8(0xFF); u8(0x0B); str("NETSCAPE2.0"); u8(0x03); u8(0x01); u16(0); u8(0);

  for(const f of frames){
    u8(0x21); u8(0xF9); u8(0x04);
    // 透過ありなら「背景に戻す」で消してから次を描かないと絵が残る
    u8(((transparent >= 0 ? 2 : 1) << 2) | (transparent >= 0 ? 1 : 0));
    u16(delayCs);
    u8(transparent >= 0 ? transparent : 0);
    u8(0);
    u8(0x2C); u16(0); u16(0); u16(w); u16(h); u8(0);
    const min = Math.max(2, bits);
    u8(min);
    for(const b of lzwEncode(f, min)) bytes.push(b);
  }
  u8(0x3B);
  return new Uint8Array(bytes);
}

/* ---------------- 書き出し ---------------- */
const sleep = ms => new Promise(r=> setTimeout(r, ms));
const MIMES = {
  webm: ["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"],
  mp4:  ["video/mp4;codecs=avc1.42E01E","video/mp4;codecs=avc1","video/mp4"],
};
function pickMime(fmt){
  for(const m of (MIMES[fmt] || MIMES.webm))
    if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return null;
}
const BG_COLORS = {transparent:null, gb:"#00b140", dark:"#101216"};
function currentBg(){ const k = $("stage").className; return (k in BG_COLORS) ? BG_COLORS[k] : null; }
const save = (blob, name)=>{
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
};

/* GIF: 各フレームを縮小して読み取り、共通パレットに落としてから組み立てる */
async function exportGif(D, fps, N, dt){
  const targetW = +$("gifW").value || psdW;
  const w = Math.max(16, Math.round(targetW)), h = Math.max(16, Math.round(psdH * w / psdW));
  const bg = currentBg();
  const tmp = document.createElement("canvas");
  tmp.width = w; tmp.height = h;
  const g = tmp.getContext("2d", {willReadFrequently:true});

  // 1) 全フレームを描いて画素を集める
  const raw = [];
  const sample = [];
  for(let i=0;i<N;i++){
    draw(step(i*dt, dt, true));
    g.clearRect(0,0,w,h);
    if(bg){ g.fillStyle = bg; g.fillRect(0,0,w,h); }
    g.drawImage(cv, 0, 0, w, h);
    const d = g.getImageData(0,0,w,h).data;
    raw.push(d);
    for(let p=0;p<d.length;p+=4*Math.max(1, Math.round(N/6))*3){
      if(d[p+3] >= 128) sample.push([d[p], d[p+1], d[p+2]]);
    }
    $("recinfo").textContent = `描画 ${i+1} / ${N}`;
    if(i % 8 === 0) await sleep(0);
  }

  // 2) パレット。透過を使うなら1色ぶん空けておく
  const useAlpha = !bg;
  $("recinfo").textContent = "色を決めています…";
  await sleep(0);
  const palette = sample.length ? medianCut(sample, useAlpha ? 255 : 256) : [[0,0,0],[255,255,255]];
  const transparent = useAlpha ? palette.length : -1;
  if(useAlpha) palette.push([0,0,0]);

  // 3) 最近色をキャッシュしながら索引化
  const cache = new Int16Array(32768).fill(-1);
  const nearest = (r,gg,b)=>{
    const key = ((r>>3)<<10) | ((gg>>3)<<5) | (b>>3);
    let v = cache[key];
    if(v >= 0) return v;
    let bi = 0, bd = 1e9;
    for(let i=0;i<palette.length;i++){
      if(i === transparent) continue;
      const p = palette[i], dr = r-p[0], dg = gg-p[1], db = b-p[2];
      const dd = dr*dr*0.9 + dg*dg*1.2 + db*db*0.7;
      if(dd < bd){ bd = dd; bi = i; }
    }
    cache[key] = bi;
    return bi;
  };
  const frames = [];
  for(let i=0;i<N;i++){
    const d = raw[i], idx = new Uint8Array(w*h);
    for(let p=0, q=0; q<idx.length; p+=4, q++){
      idx[q] = (useAlpha && d[p+3] < 128) ? transparent : nearest(d[p], d[p+1], d[p+2]);
    }
    frames.push(idx);
    raw[i] = null;
    $("recinfo").textContent = `減色 ${i+1} / ${N}`;
    if(i % 8 === 0) await sleep(0);
  }

  // 4) 組み立て
  $("recinfo").textContent = "GIFを組み立てています…";
  await sleep(0);
  const delayCs = Math.max(2, Math.round(100/fps));
  const bytes = gifBuild(frames, w, h, delayCs, palette, transparent);
  save(new Blob([bytes], {type:"image/gif"}), "avatar_loop.gif");
  const mb = (bytes.length/1048576).toFixed(1);
  $("note").textContent = `avatar_loop.gif を書き出しました（${w}×${h} / ${N}フレーム / ${mb}MB）。`
    + (useAlpha ? "GIFの透過は1bitなので、輪郭がギザつく場合は背景をGBかダークにしてください。"
                : "背景を塗り込んでいます。透過が要るなら背景を「透過」にしてください。");
  return delayCs;
}

$("recBtn").onclick = async ()=>{
  if(!layers.length){ $("note").textContent = "先に PSD か PNG を読み込んでください。"; return; }
  const fmt = $("fmt").value;
  const mime = fmt === "gif" ? null : pickMime(fmt);
  if(fmt !== "gif" && !mime){
    $("note").textContent = fmt === "mp4"
      ? "このブラウザは MP4 の録画に対応していません。WebM か GIF を選んでください。"
      : "このブラウザは WebM 書き出しに対応していません。";
    return;
  }

  const D = durVal(), fps = Math.max(10, +$("fps").value || 30);
  const N = Math.round(D * fps), dt = 1/fps;

  // ライブ入力系は録画中だけ退避してオフに(毎回結果が変わるため)
  const savedT = {...T};
  TOGGLES.filter(t=>t.live).forEach(t=> T[t.id] = false);
  syncChips();

  exporting = true;
  $("recBtn").disabled = true;
  $("recbar").classList.add("on");

  try{
    // 揺れ物を定常状態にするための空回し(3周)。これで先頭と末尾が繋がる。
    resetSprings();
    $("recinfo").textContent = "揺れを安定させています…";
    await sleep(0);
    for(let i = 0; i < N*3; i++) step((i % N) * dt, dt, true);

    if(fmt === "gif"){
      await exportGif(D, fps, N, dt);
    } else {
      const stream = cv.captureStream(0);
      const track = stream.getVideoTracks()[0];
      const rec = new MediaRecorder(stream, {mimeType: mime, videoBitsPerSecond: 8e6});
      const chunks = [];
      rec.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
      const stopped = new Promise(r=> rec.onstop = r);
      rec.start();

      for(let i = 0; i < N; i++){
        draw(step(i * dt, dt, true));
        if(track.requestFrame) track.requestFrame();
        $("recinfo").textContent = `${i+1} / ${N} フレーム`;
        await sleep(1000/fps);
      }
      rec.stop();
      await stopped;

      const ext = fmt === "mp4" ? "mp4" : "webm";
      save(new Blob(chunks, {type: mime}), "avatar_loop." + ext);
      $("note").textContent = `avatar_loop.${ext} を書き出しました（${D}秒 / ${fps}fps / ${N}フレーム）。`
        + (fmt === "mp4"
            ? "MP4に透過はありません。背景を GB にすると後で抜けます。"
            : "WebMの透過はブラウザ依存なので、必要なら背景を GB にして書き出してください。");
    }
  } finally {
    exporting = false;
    $("recBtn").disabled = false;
    $("recbar").classList.remove("on");
    Object.assign(T, savedT);
    syncChips();
    resetSprings();
    last = performance.now();
    loopT0 = performance.now();
  }
};

        const ov = roleOverrides();
