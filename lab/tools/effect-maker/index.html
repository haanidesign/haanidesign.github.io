<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>エフェクトメーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=DotGothic16&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --main:#E1DD60;--main-deep:#B8B43F;--main-soft:#F2F0BE;
  --cream:#FBFAEC;--paper:#FFFEF7;--ink:#1E1C14;--ink-2:#4F4A3B;--gray:#6E6857;
  --pink:#F2A0B8;--rule:rgba(30,28,20,.22);
  --bd:2.5px solid var(--ink);--r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{
  background:var(--cream);
  background-image:radial-gradient(circle,rgba(30,28,20,.13) 1.5px,transparent 1.6px);
  background-size:16px 16px;
  color:var(--ink);font-family:'M PLUS Rounded 1c',sans-serif;font-weight:500;font-size:1rem;line-height:1.6;
  min-height:100vh;display:flex;flex-direction:column;
}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
::selection{background:var(--main);color:var(--ink)}
button,select,input{font:inherit;color:inherit}

/* 上のバー */
.bar{
  position:sticky;top:0;z-index:10;background:var(--main);border-bottom:var(--bd);
  display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;flex-wrap:wrap;
}
.bar h1{font-size:1.3rem;font-weight:800;margin-right:auto;white-space:nowrap}
.bar h1 a{color:inherit;text-decoration:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.35rem;
  background:var(--paper);border:var(--bd);border-radius:var(--r);
  padding:.45rem .95rem;font-weight:700;font-size:.95rem;cursor:pointer;
  transition:background-color .15s;white-space:nowrap;text-decoration:none;color:var(--ink);
}
.btn:hover{background:var(--main)}
.btn:disabled{opacity:.55;cursor:default}
.btn:disabled:hover{background:var(--paper)}
.btn-y{background:var(--main)}
.btn-y:hover{background:var(--main-deep)}
.btn-g{background:var(--ink);color:var(--main)}
.btn-g:hover{color:var(--paper);background:var(--ink)}
.bar .btn{background:var(--paper)}
.bar .btn:hover{background:var(--main-soft)}
.ico{width:2.4rem;padding:.45rem 0}

/* 3つの区画 */
.main{
  flex:1;display:grid;grid-template-columns:330px minmax(0,1fr) 330px;gap:1rem;padding:1rem;
  align-items:start;
}
@media(max-width:1180px){.main{grid-template-columns:300px minmax(0,1fr)}.props{grid-column:1 / -1}}
@media(max-width:760px){.main{grid-template-columns:minmax(0,1fr);padding:.75rem}.stagecol{order:-1}}

/* 左: エフェクト一覧 */
.lib{background:var(--paper);border:var(--bd);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 6rem);position:sticky;top:4.6rem}
@media(max-width:760px){.lib{position:static;max-height:none}}
.lib-head{padding:.8rem .9rem .6rem;border-bottom:var(--bd)}
.lib-head h2{font-size:1.15rem;font-weight:800;line-height:1.3}
.lib-head p{font-size:.85rem;color:var(--gray)}
.cats{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.55rem}
.cat{border:2px solid var(--ink);border-radius:100px;background:var(--paper);padding:.05rem .7rem;font-weight:700;font-size:.85rem;cursor:pointer}
.cat:hover{background:var(--main-soft)}
.cat.on{background:var(--ink);color:var(--main)}
.fxgrid{overflow-y:auto;padding:.7rem;display:grid;grid-auto-rows:max-content;align-content:start;flex:1 1 auto;min-height:0;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
@media(max-width:760px){.fxgrid{grid-template-columns:repeat(4,minmax(0,1fr));max-height:340px}}
@media(max-width:420px){.fxgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fx{border:2px solid var(--ink);border-radius:10px;background:var(--paper);cursor:pointer;padding:0;overflow:hidden;text-align:center;display:flex;flex-direction:column}
.fx:hover{background:var(--main-soft)}
.fx.on{background:var(--main);border-width:2.5px}
.fx img{width:100%;aspect-ratio:1;height:auto;flex:none;display:block;border-bottom:2px solid var(--ink)}
.fx span{font-size:.8rem;font-weight:700;line-height:1.25;padding:.3rem .2rem;display:block}
.fxgrid::-webkit-scrollbar{width:12px}
.fxgrid::-webkit-scrollbar-thumb{background:var(--main);border:2px solid var(--ink);border-radius:8px}

/* まん中: プレビュー */
.stagecol{display:flex;flex-direction:column;gap:.75rem;min-width:0}
.stagehead{display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap}
.stagehead h2{font-size:clamp(1.6rem,2.6vw,2.1rem);font-weight:800;line-height:1.2}
.stagehead p{color:var(--ink-2);font-size:.95rem}
.stage{
  position:relative;border:var(--bd);border-radius:var(--r);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  height:min(62vh,620px);min-height:260px;touch-action:none;
}
@media(max-width:760px){.stage{height:auto;aspect-ratio:1}}
.stage.bg-checker{background:repeating-conic-gradient(#d9d6c6 0 25%,#f2f0e4 0 50%) 0 0/24px 24px}
.stage.bg-dark{background:#24221a}
.stage.bg-white{background:#ffffff}
.stage.bg-green{background:#00b140}
.stage.bg-img{background-color:#24221a;background-size:cover;background-position:center}
.stage canvas{display:block;max-width:100%;max-height:100%;cursor:grab}
.stage canvas.full{cursor:crosshair}
.stage .frame{position:absolute;inset:auto;pointer-events:none;outline:2px dashed rgba(255,255,255,.55)}
.stagebar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:var(--bd);border-radius:var(--r);overflow:hidden;background:var(--paper)}
.seg button{border:0;border-right:2px solid var(--ink);background:transparent;padding:.35rem .75rem;font-weight:700;font-size:.9rem;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--main-soft)}
.seg button.on{background:var(--main)}
.hint{font-size:.85rem;color:var(--gray)}

/* タイムライン */
.tl{background:var(--paper);border:var(--bd);border-radius:var(--r);padding:.6rem .75rem;display:flex;align-items:center;gap:.75rem}
.tl .btn{flex:none}
.cells{flex:1;display:flex;gap:3px;min-width:0;height:34px}
.cell{flex:1;min-width:3px;border:2px solid var(--ink);border-radius:4px;background:var(--paper);cursor:pointer;padding:0}
.cell:hover{background:var(--main-soft)}
.cell.now{background:var(--main)}
.cell.blank{background:repeating-linear-gradient(45deg,transparent 0 3px,var(--rule) 3px 5px)}
.fcount{font-family:'DotGothic16',monospace;font-variant-numeric:tabular-nums;font-size:1.05rem;white-space:nowrap;min-width:4.5em;text-align:right}

/* 右: 設定 */
.props{display:flex;flex-direction:column;gap:1rem}
.box{background:var(--paper);border:var(--bd);border-radius:var(--r);padding:.85rem .95rem}
.box h3{font-size:1.1rem;font-weight:800;margin-bottom:.45rem;display:flex;align-items:center;gap:.5rem}
.box h3 small{font-size:.8rem;font-weight:700;color:var(--gray)}
.pals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.35rem}
.pal{border:2px solid var(--ink);border-radius:100px;background:var(--paper);display:flex;align-items:center;gap:.3rem;padding:.15rem .45rem .15rem .3rem;cursor:pointer;font-size:.82rem;font-weight:700;min-width:0}
.pal:hover{background:var(--main-soft)}
.pal.on{background:var(--main)}
.pal i{display:flex;flex:none}
.pal i b{width:.8rem;height:.8rem;border-radius:50%;border:1.5px solid var(--ink);margin-right:-.25rem}
.pal em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:.25rem}
.colrow{display:flex;gap:.6rem;margin-top:.7rem;flex-wrap:wrap}
.colrow label{display:flex;flex-direction:column;align-items:center;font-size:.8rem;font-weight:700;gap:.15rem}
input[type=color]{width:46px;height:34px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);padding:2px;cursor:pointer}
.param{padding:.35rem 0;border-bottom:2.5px dotted var(--rule)}
.param:last-child{border-bottom:0}
.param .lab{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem}
.param .lab output{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.param.hide{display:none}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.6rem}
select,input[type=text]{width:100%;border:2px solid var(--ink);border-radius:10px;background:var(--paper);padding:.35rem .5rem;font-weight:700}
input[type=text]:focus,select:focus{background:var(--main-soft)}
.exbtns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.5rem;margin-top:.6rem}
.exbtns .wide{grid-column:1 / -1}
#status{min-height:1.5em;font-weight:700;font-size:.9rem;margin-top:.5rem}
.note{font-size:.85rem;color:var(--gray);line-height:1.6;margin-top:.4rem}

/* つまみ（触っただけでは動かない） */
.rs{position:relative;height:28px;touch-action:none;cursor:ew-resize}
.rs-track{position:absolute;left:9px;right:9px;top:9px;height:10px;border:2px solid var(--ink);border-radius:6px;background:var(--cream);overflow:hidden}
.rs-fill{height:100%;background:var(--main)}
.rs-knob{position:absolute;top:4px;width:20px;height:20px;margin-left:-10px;border:2.5px solid var(--ink);border-radius:50%;background:var(--paper)}
.rs:hover .rs-knob,.rs.drag .rs-knob{background:var(--main)}
</style>
</head>
<body>
<header class="bar">
  <h1><a href="../../index.html" title="HAANI LAB へ">エフェクトメーカー</a></h1>
  <button class="btn ico" id="undo" title="元に戻す (Ctrl+Z)">↶</button>
  <button class="btn ico" id="redo" title="やり直す (Ctrl+Shift+Z)">↷</button>
  <button class="btn" id="reseed" title="同じ設定のまま形のゆらぎを変える">形をかえる</button>
  <button class="btn" id="resetfx">おすすめに戻す</button>
</header>

<div class="main">
  <section class="lib">
    <div class="lib-head">
      <h2>エフェクト</h2>
      <p id="libcount"></p>
      <div class="cats" id="cats"></div>
    </div>
    <div class="fxgrid" id="fxgrid"></div>
  </section>

  <section class="stagecol">
    <div class="stagehead"><h2 id="fxname"></h2><p id="fxdesc"></p></div>
    <div class="stage bg-checker" id="stage"><canvas id="cv"></canvas></div>
    <div class="stagebar">
      <div class="seg" id="bgseg">
        <button data-bg="checker" class="on">透過</button>
        <button data-bg="dark">黒</button>
        <button data-bg="white">白</button>
        <button data-bg="green">緑</button>
        <button data-bg="img">画像…</button>
      </div>
      <input type="file" id="bgfile" accept="image/*" hidden>
      <span class="hint" id="poshint">ドラッグで置き場所を動かせる</span>
      <button class="btn" id="center" style="margin-left:auto">まん中へ</button>
    </div>
    <div class="tl">
      <button class="btn btn-y ico" id="play" title="再生／停止 (Space)">❚❚</button>
      <div class="cells" id="cells"></div>
      <span class="fcount" id="fcount">1/10</span>
    </div>
  </section>

  <aside class="props">
    <div class="box">
      <h3>色</h3>
      <div class="pals" id="pals"></div>
      <div class="colrow">
        <label>芯<input type="color" data-k="c0"></label>
        <label>なか<input type="color" data-k="c1"></label>
        <label>ふち<input type="color" data-k="c2"></label>
        <label>線<input type="color" data-k="line"></label>
      </div>
    </div>

    <div class="box">
      <h3>形 <small>エフェクトごとに使うものだけ出る</small></h3>
      <div class="param" data-use="text"><div class="lab"><span>文字</span></div><input type="text" data-k="text" maxlength="8"></div>
      <div class="param" data-use="size"><div class="lab"><span>大きさ</span><output></output></div><input type="range" data-k="size" min="10" max="160" step="1"></div>
      <div class="param" data-use="amount"><div class="lab"><span>量</span><output></output></div><input type="range" data-k="amount" min="5" max="150" step="1"></div>
      <div class="param" data-use="width"><div class="lab"><span>太さ</span><output></output></div><input type="range" data-k="width" min="10" max="150" step="1"></div>
      <div class="param" data-use="rot"><div class="lab"><span>向き</span><output></output></div><input type="range" data-k="rot" min="-180" max="180" step="1"></div>
      <div class="param" data-use="squash"><div class="lab"><span>たてのつぶし</span><output></output></div><input type="range" data-k="squash" min="15" max="100" step="1"></div>
    </div>

    <div class="box">
      <h3>手描き感</h3>
      <div class="row2" style="margin-bottom:.4rem">
        <label><span style="font-weight:700;font-size:.95rem">コマ打ち</span>
          <select data-k="fps"><option value="8">8コマ/秒（3コマ打ち）</option><option value="12">12コマ/秒（2コマ打ち）</option><option value="24">24コマ/秒（1コマ打ち）</option><option value="30">30コマ/秒</option></select></label>
        <label><span style="font-weight:700;font-size:.95rem">尺</span>
          <select data-k="dur"></select></label>
      </div>
      <div class="param"><div class="lab"><span>線のゆれ（ボイル）</span><output></output></div><input type="range" data-k="boil" min="0" max="12" step="1"></div>
      <div class="param"><div class="lab"><span>縁取り</span><output></output></div><input type="range" data-k="outline" min="0" max="20" step="1"></div>
      <div class="param"><div class="lab"><span>光らせる</span><output></output></div><input type="range" data-k="glow" min="0" max="40" step="1"></div>
    </div>

    <div class="box">
      <h3>書き出し</h3>
      <label><span style="font-weight:700;font-size:.95rem">画面の大きさ</span>
        <select data-k="exSize">
          <option value="1080x1080">正方形 1080×1080</option>
          <option value="2048x2048">正方形 2048×2048</option>
          <option value="1920x1080">横長 1920×1080</option>
          <option value="1080x1920">縦長 1080×1920</option>
          <option value="512x512">小さめ 512×512</option>
        </select></label>
      <div class="exbtns">
        <button class="btn btn-y wide" id="exZip">連番PNG（透過・ZIP）</button>
        <button class="btn" id="exWebm">WebM 動画</button>
        <button class="btn" id="exSheet">スプライト</button>
        <button class="btn wide" id="exStill">いまのコマを PNG で</button>
      </div>
      <div id="status"></div>
      <p class="note">連番は選んだコマ打ちの枚数で出る。AE では「コマ打ちと同じフレームレート」で読み込めば、24fps のコンポでもタイミングがずれない。WebM の透過は Chrome で使える。</p>
    </div>
  </aside>
</div>

<script type="module">
import { watchRanges } from '../oekaki-kobo/js/rslider.js';

import { PALS, PAL, CATS, FX, FXI, BASE, fxDefaults, totalFrames, renderTo, hex, cl } from './fx.js';
const TAU = Math.PI*2;
/* ================= 状態 ================= */
const DURS = [.3,.4,.45,.5,.6,.7,.75,.8,.9,1,1.2,1.4,1.6,2,2.5,3,4,5];
let S = loadState() || fxDefaults('juji', {seed:1, bg:'checker', exSize:'1080x1080'});

function loadState(){
  try { const s = JSON.parse(localStorage.getItem('effect-maker') || 'null'); if (s && FXI[s.fx]) return s; } catch(e) {}
  return null;
}
function saveState(){ try { localStorage.setItem('effect-maker', JSON.stringify(S)); } catch(e) {} }

/* 元に戻す */
let hist = [JSON.stringify(S)], hi = 0;
function commit(){
  const j = JSON.stringify(S); if (j === hist[hi]) return;
  hist = hist.slice(0, hi+1); hist.push(j); if (hist.length > 200) hist.shift(); hi = hist.length-1;
  saveState(); updHistBtns();
}
function restore(j){ const fxBefore = S.fx; S = JSON.parse(j); syncUI(fxBefore !== S.fx); saveState(); dirty = true; updHistBtns(); }
function undo(){ if (hi > 0) restore(hist[--hi]); }
function redo(){ if (hi < hist.length-1) restore(hist[++hi]); }
function updHistBtns(){ $('#undo').disabled = hi <= 0; $('#redo').disabled = hi >= hist.length-1; }

/* ================= 画面 ================= */
const $ = s => document.querySelector(s);
const cv = $('#cv'), stage = $('#stage');
let curCat = 'すべて', playing = true, frame = 0, dirty = true, t0 = performance.now();

function exDims(){ const [w,h] = S.exSize.split('x').map(Number); return [w,h]; }
function sizePreview(){
  const [w,h] = exDims(), k = 720/Math.max(w,h);
  const W = Math.round(w*k), H = Math.round(h*k);
  if (cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; }
  const sw = stage.clientWidth-4, sh = stage.clientHeight-4, f = Math.min(sw/W, sh/H);
  cv.style.width = (W*f)+'px'; cv.style.height = (H*f)+'px';
}

function buildCats(){
  const el = $('#cats'); el.innerHTML = '';
  for (const c of ['すべて', ...CATS]){
    const b = document.createElement('button'); b.className = 'cat'+(c===curCat?' on':''); b.textContent = c;
    b.onclick = () => { curCat = c; buildCats(); buildGrid(); }; el.appendChild(b);
  }
}
const thumbs = {};
function thumbOf(fx){
  if (thumbs[fx.id]) return thumbs[fx.id];
  const d = fxDefaults(fx.id, {seed:3}), c = document.createElement('canvas'); c.width = c.height = 132;
  const tc = c.getContext('2d'), lum = hex(d.c2).reduce((a,v,i)=>a+v*[.3,.59,.11][i],0)/255;
  const total = totalFrames(d), fi = Math.min(total-1, Math.round(fx.peak*(fx.loop?total:total-1)));
  const tmp = document.createElement('canvas'); tmp.width = tmp.height = 132;
  renderTo(tmp, fi, {...d, glow:d.glow*.7});
  tc.fillStyle = lum < .35 || fx.id==='beta' || fx.id==='iris' ? '#FBFAEC' : '#2b2920'; tc.fillRect(0,0,132,132);
  tc.drawImage(tmp,0,0);
  return thumbs[fx.id] = c.toDataURL();
}
function buildGrid(){
  const el = $('#fxgrid'); el.innerHTML = '';
  const list = FX.filter(f => curCat==='すべて' || f.cat===curCat);
  $('#libcount').textContent = `${FX.length} 種類。押すとおすすめの設定で切りかわる`;
  for (const fx of list){
    const b = document.createElement('button'); b.className = 'fx'+(fx.id===S.fx?' on':''); b.dataset.id = fx.id; b.title = fx.desc;
    const im = new Image(); im.src = thumbOf(fx); im.alt = '';
    const sp = document.createElement('span'); sp.textContent = fx.name;
    b.append(im, sp);
    b.onclick = () => { if (fx.id === S.fx) return; S = fxDefaults(fx.id, {seed:S.seed, bg:S.bg, exSize:S.exSize, text:''}); syncUI(true); commit(); };
    el.appendChild(b);
  }
}
function buildPals(){
  const el = $('#pals'); el.innerHTML = '';
  for (const [id,name,a,b,c] of PALS){
    const btn = document.createElement('button'); btn.className = 'pal'; btn.dataset.pal = id;
    btn.innerHTML = `<i><b style="background:${a}"></b><b style="background:${b}"></b><b style="background:${c}"></b></i><em>${name}</em>`;
    btn.onclick = () => { S.pal = id; S.c0 = a; S.c1 = b; S.c2 = c; syncUI(); commit(); };
    el.appendChild(btn);
  }
}
function fmt(k, v){
  if (k==='rot') return v+'°';
  if (k==='outline'||k==='glow'||k==='boil') return v==0 ? 'なし' : v;
  return v+'%';
}
function syncUI(fxChanged = false){
  const fx = FXI[S.fx];
  $('#fxname').textContent = fx.name; $('#fxdesc').textContent = fx.desc;
  for (const el of document.querySelectorAll('[data-k]')){
    const k = el.dataset.k; if (S[k] === undefined) continue;
    if (el.value !== String(S[k])) el.value = S[k];
    const o = el.closest('.param')?.querySelector('output'); if (o) o.textContent = fmt(k, S[k]);
  }
  for (const p of document.querySelectorAll('.param[data-use]')) p.classList.toggle('hide', !fx.uses.includes(p.dataset.use));
  for (const p of document.querySelectorAll('.pal')) p.classList.toggle('on', p.dataset.pal===S.pal && PAL[S.pal][2]===S.c0 && PAL[S.pal][3]===S.c1 && PAL[S.pal][4]===S.c2);
  for (const b of document.querySelectorAll('#bgseg button')) b.classList.toggle('on', b.dataset.bg===S.bg);
  stage.className = 'stage bg-'+(S.bg==='img' && !bgUrl ? 'dark' : S.bg);
  if (fxChanged){ for (const b of document.querySelectorAll('.fx')) b.classList.toggle('on', b.dataset.id===S.fx); frame = 0; t0 = performance.now(); }
  cv.classList.toggle('full', !!fx.full);
  $('#poshint').textContent = fx.full ? (['shuchu','beta','iris','hana','ryusen','shine'].includes(fx.id) ? 'ドラッグで中心を動かせる' : '画面全体にかかるエフェクト') : 'ドラッグで置き場所を動かせる';
  sizePreview(); buildCells(); dirty = true;
}

/* 尺の選択肢 */
$('[data-k=dur]').innerHTML = DURS.map(d => `<option value="${d}">${d} 秒</option>`).join('');

/* 入力 */
for (const el of document.querySelectorAll('[data-k]')){
  const k = el.dataset.k, num = el.type==='range' || el.tagName==='SELECT' && k!=='exSize';
  el.addEventListener('input', () => {
    S[k] = num ? parseFloat(el.value) : el.value;
    if (k==='c0'||k==='c1'||k==='c2') { /* 自分で色を変えたらプリセットの選択はずす */ }
    syncUI(); if (el.type==='text' || el.type==='color') commitSoon();
  });
  el.addEventListener('change', () => commit());
}
let ct = 0; function commitSoon(){ clearTimeout(ct); ct = setTimeout(commit, 500); }

/* 背景 */
let bgUrl = null;
for (const b of document.querySelectorAll('#bgseg button')) b.onclick = () => {
  if (b.dataset.bg === 'img'){ $('#bgfile').click(); return; }
  S.bg = b.dataset.bg; syncUI(); saveState();
};
$('#bgfile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  if (bgUrl) URL.revokeObjectURL(bgUrl); bgUrl = URL.createObjectURL(f);
  stage.style.backgroundImage = `url(${bgUrl})`; S.bg = 'img'; syncUI(); saveState();
};

/* 置き場所をドラッグ */
let drag = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  const r = cv.getBoundingClientRect();
  drag = { x:e.clientX, y:e.clientY, px:S.px, py:S.py, w:r.width, h:r.height, moved:false };
  cv.style.cursor = 'grabbing';
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
  if (!drag.moved && Math.hypot(dx,dy) < 4) return;
  drag.moved = true;
  S.px = Math.round(cl(drag.px+dx/drag.w)*1000)/1000; S.py = Math.round(cl(drag.py+dy/drag.h)*1000)/1000; dirty = true;
});
const endDrag = () => { if (!drag) return; const m = drag.moved; drag = null; cv.style.cursor = ''; if (m) commit(); };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
$('#center').onclick = () => { S.px = .5; S.py = .5; dirty = true; commit(); };

/* 上のボタン */
$('#undo').onclick = undo; $('#redo').onclick = redo;
$('#reseed').onclick = () => { S.seed = (S.seed % 9973) + 1 + Math.floor(Math.random()*50); dirty = true; commit(); };
$('#resetfx').onclick = () => { S = fxDefaults(S.fx, {seed:S.seed, bg:S.bg, exSize:S.exSize, text:''}); syncUI(); commit(); };
addEventListener('keydown', e => {
  if (e.target.matches('input[type=text],select')) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); }
  else if (e.key===' ' && !mod){ e.preventDefault(); togglePlay(); }
  else if (e.key==='ArrowRight'){ playing && togglePlay(); frame = (frame+1) % cycleLen(); dirty = true; }
  else if (e.key==='ArrowLeft'){ playing && togglePlay(); frame = (frame-1+cycleLen()) % cycleLen(); dirty = true; }
});

/* タイムライン */
function cycleLen(){ const fx = FXI[S.fx], n = totalFrames(S); return fx.loop ? n : n + Math.round(S.fps*.4); }
function buildCells(){
  const el = $('#cells'), n = cycleLen(), tot = totalFrames(S);
  if (el.childElementCount !== n){
    el.innerHTML = '';
    for (let i=0;i<n;i++){ const c = document.createElement('button'); c.className = 'cell'+(i>=tot?' blank':''); c.title = i<tot ? `${i+1} コマ目` : '間（書き出されない）';
      c.onclick = () => { if (playing) togglePlay(); frame = i; dirty = true; }; el.appendChild(c); }
  } else [...el.children].forEach((c,i) => c.classList.toggle('blank', i>=tot));
}
function togglePlay(){ playing = !playing; $('#play').textContent = playing ? '❚❚' : '▶'; if (playing) t0 = performance.now() - frame*1000/S.fps; }
$('#play').onclick = togglePlay;

let lastShown = -1;
function tick(now){
  const n = cycleLen(), tot = totalFrames(S);
  if (playing) frame = Math.floor((now-t0)/1000*S.fps) % n;
  if (frame >= n) frame = 0;
  if (dirty || frame !== lastShown){
    if (frame < tot) renderTo(cv, frame, S); else cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
    const cells = $('#cells').children;
    if (cells[lastShown]) cells[lastShown].classList.remove('now');
    if (cells[frame]) cells[frame].classList.add('now');
    $('#fcount').textContent = frame < tot ? `${frame+1}/${tot}` : `間/${tot}`;
    lastShown = frame; dirty = false;
  }
  requestAnimationFrame(tick);
}

/* ================= 書き出し ================= */
const status = $('#status');
const fname = () => `${S.fx}_${S.fps}fps`;
function exCanvas(){ const [w,h] = exDims(); const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function download(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
const toBlob = c => new Promise(r => c.toBlob(r, 'image/png'));
function busy(on){ for (const id of ['#exZip','#exWebm','#exSheet','#exStill']) $(id).disabled = on; }

$('#exStill').onclick = async () => {
  const c = exCanvas(), tot = totalFrames(S); renderTo(c, Math.min(frame, tot-1), S);
  download(await toBlob(c), `${fname()}_${String(Math.min(frame,tot-1)).padStart(4,'0')}.png`); dirty = true;
};
$('#exZip').onclick = async () => {
  busy(true);
  try {
    const c = exCanvas(), tot = totalFrames(S), zip = new JSZip(), dir = zip.folder(fname());
    for (let f=0; f<tot; f++){
      status.textContent = `書き出し中 ${f+1} / ${tot}`;
      renderTo(c, f, S); dir.file(`${fname()}_${String(f).padStart(4,'0')}.png`, await toBlob(c));
      await new Promise(r => setTimeout(r, 0));
    }
    status.textContent = 'ZIP にまとめています';
    download(await zip.generateAsync({type:'blob'}), `${fname()}.zip`);
    status.textContent = `${tot} 枚を書き出しました`;
  } catch(e){ status.textContent = '書き出せませんでした: '+e.message; }
  busy(false); dirty = true;
};
$('#exSheet').onclick = async () => {
  busy(true);
  const [w,h] = exDims(), tot = totalFrames(S), cols = Math.ceil(Math.sqrt(tot)), rows = Math.ceil(tot/cols);
  const k = Math.min(1, 4096/(cols*w), 4096/(rows*h)), cw = Math.floor(w*k), ch = Math.floor(h*k);
  const sheet = document.createElement('canvas'); sheet.width = cw*cols; sheet.height = ch*rows;
  const sc2 = sheet.getContext('2d'), c = document.createElement('canvas'); c.width = cw; c.height = ch;
  for (let f=0; f<tot; f++){ renderTo(c, f, S); sc2.drawImage(c, (f%cols)*cw, Math.floor(f/cols)*ch); }
  download(await toBlob(sheet), `${fname()}_sheet_${cols}x${rows}_${cw}x${ch}.png`);
  status.textContent = `${cols}×${rows} マス（1マス ${cw}×${ch}）`; busy(false); dirty = true;
};
$('#exWebm').onclick = async () => {
  if (!window.MediaRecorder){ status.textContent = 'このブラウザは動画の書き出しに対応していません'; return; }
  busy(true);
  const c = exCanvas(), tot = totalFrames(S), fx = FXI[S.fx], reps = fx.loop ? 3 : 1;
  const mime = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  const stream = c.captureStream(0), track = stream.getVideoTracks()[0];
  const rec = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:12e6}), chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  rec.start();
  const step = 1000/S.fps, start = performance.now();
  for (let i=0; i<tot*reps; i++){
    status.textContent = `録画中 ${i+1} / ${tot*reps}`;
    renderTo(c, i%tot, S); track.requestFrame?.();
    const wait = start + (i+1)*step - performance.now(); await new Promise(r => setTimeout(r, Math.max(0, wait)));
  }
  rec.stop(); await done;
  download(new Blob(chunks, {type:'video/webm'}), `${fname()}.webm`);
  status.textContent = fx.loop ? 'ループを3回分 録りました' : '書き出しました'; busy(false); dirty = true;
};

/* ================= はじめ ================= */
watchRanges();
buildCats(); buildPals();
syncUI(true); updHistBtns();
document.fonts.load("800 40px 'M PLUS Rounded 1c'").then(() => { for (const k of ['bikkuri','moji']) delete thumbs[k]; buildGrid(); dirty = true; });
buildGrid();
new ResizeObserver(sizePreview).observe(stage);
requestAnimationFrame(tick);
</script>
</body>
</html>
