<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>アニメデザイン工房</title>
<script src="lib/ag-psd.js"></script>
<style>
:root{
  --bar:#3f6f7d;            /* トップバー(元ネタのオレンジ→青緑に変更) */
  --bar2:#35606c;
  --bg:#eceadf;
  --panel:#f6f4ec;
  --line:#20242a;
  --btn:#ffffff;
  --btn-on:#ffd24a;
  --accent:#e2703a;
  --text:#20242a;
  --dim:#79808b;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); overflow:hidden;
  font:13px/1.45 "Segoe UI","Yu Gothic UI","Hiragino Sans",sans-serif;
  display:flex; flex-direction:column;
}
button{font:inherit; color:inherit; cursor:pointer}

/* ---------- トップバー ---------- */
#top{
  background:linear-gradient(180deg,var(--bar),var(--bar2));
  color:#fff; display:flex; align-items:center; gap:10px; padding:7px 12px; flex-shrink:0;
}
#top .ttl{font-weight:700; font-size:15px; letter-spacing:.02em}
#top input.name{
  background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.35); color:#fff;
  border-radius:8px; padding:4px 10px; width:230px; font:inherit;
}
#top .info{
  margin:0 auto; background:rgba(255,255,255,.14); border-radius:999px;
  padding:4px 16px; font-size:12px; white-space:nowrap;
}
.tbtn{
  background:var(--btn); color:var(--text);      /* #top の白文字を継がない */
  border:2px solid var(--line); border-radius:10px;
  padding:6px 13px; font-weight:700; font-size:12.5px; box-shadow:0 2px 0 var(--line);
}
.tbtn:active{transform:translateY(2px); box-shadow:none}
.tbtn.primary{background:#57c98a; color:#fff}
.tbtn.ghost{background:#e8e5da}

/* ---------- レイアウト ---------- */
#main{flex:1; display:flex; min-height:0}
#rail{
  width:78px; flex-shrink:0; background:var(--panel); border-right:2px solid var(--line);
  padding:8px 6px; display:flex; flex-direction:column; gap:6px; overflow-y:auto;
}
.tool{
  background:var(--btn); border:2px solid var(--line); border-radius:var(--radius);
  height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; font-size:10.5px; font-weight:700; box-shadow:0 2px 0 var(--line);
}
.tool .ic{font-size:19px; line-height:1}
.tool.on{background:var(--btn-on)}
#center{flex:1; display:flex; flex-direction:column; min-width:0}
#stagewrap{
  flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center;
  /* 斜めストライプ → 水玉(ドット)の方眼 */
  background-color:#eceadf;
  background-image:radial-gradient(#d5d1c2 1.6px, transparent 1.7px);
  background-size:12px 12px;
  overflow:auto; padding:14px;
}
#stage{position:relative; box-shadow:0 0 0 2px var(--line), 0 6px 18px rgba(0,0,0,.18)}
#stage canvas{position:absolute; left:0; top:0; image-rendering:pixelated; display:block}
#view{position:relative; z-index:3}
/* ボーンのギズモは CSS 解像度で描いて線を細く保つ(ドット拡大に引きずられない) */
#giz{z-index:4; image-rendering:auto !important; pointer-events:none}
#giz.active{pointer-events:auto; cursor:crosshair}
#zoombar{
  position:absolute; left:14px; bottom:10px; background:rgba(255,255,255,.92);
  border:2px solid var(--line); border-radius:999px; padding:3px 12px; font-size:11.5px; font-weight:700;
}
#zoombtns{position:absolute; right:14px; top:10px; display:flex; gap:6px; z-index:5}
#zoombtns .tbtn{padding:4px 10px}
#previewBox{
  position:absolute; right:14px; bottom:10px; border:2px solid var(--line); border-radius:10px;
  overflow:hidden; background:#fff; z-index:5;
}
#previewBox .cap{background:#57c98a; color:#fff; font-size:10px; font-weight:700; padding:1px 6px}
#previewBox canvas{display:block; image-rendering:pixelated}
#dropmsg{
  position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:9;
  background:rgba(63,111,125,.55); color:#fff; font-size:22px; font-weight:700;
}

/* ---------- タイムライン ---------- */
#timeline{
  flex-shrink:0; background:var(--panel); border-top:2px solid var(--line); padding:8px 10px;
  display:flex; flex-direction:column; gap:7px;
}
#tlrow1{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
#frames{
  display:flex; gap:6px; overflow-x:auto; padding:4px; background:#20242a; border-radius:8px; min-height:64px;
}
.fr{
  position:relative; border:2px solid #4a5158; border-radius:6px; background:#fff; flex-shrink:0; cursor:pointer;
}
.fr.on{border-color:var(--btn-on); box-shadow:0 0 0 2px var(--btn-on)}
.fr canvas{display:block; image-rendering:pixelated; border-radius:3px}
.fr b{position:absolute; left:2px; top:1px; font-size:9px; color:#fff; text-shadow:0 0 3px #000}
#addfr{
  flex-shrink:0; width:64px; border:2px dashed #7e8790; border-radius:6px; background:transparent;
  color:#c9ced4; font-size:20px; font-weight:700;
}
select,input[type=number]{
  background:#fff; border:2px solid var(--line); border-radius:8px; padding:3px 6px; font:inherit;
}

/* ---------- 右パネル ---------- */
#side{
  width:300px; flex-shrink:0; background:var(--panel); border-left:2px solid var(--line);
  display:flex; flex-direction:column; min-height:0;
}
#tabs{display:flex; gap:6px; padding:8px 8px 0}
.tab{
  flex:1; background:#e2ded1; border:2px solid var(--line); border-bottom:none;
  border-radius:10px 10px 0 0; padding:6px 0; font-weight:700; font-size:12.5px;
}
.tab.on{background:var(--btn-on)}
#sidebody{flex:1; overflow-y:auto; padding:10px 12px 40px; border-top:2px solid var(--line)}
#sidebody::-webkit-scrollbar{width:9px}
#sidebody::-webkit-scrollbar-thumb{background:#c3bfb1; border-radius:5px}
h4{font-size:11.5px; color:var(--dim); margin:14px 0 6px; letter-spacing:.04em}
h4:first-child{margin-top:0}
.grid{display:flex; flex-wrap:wrap; gap:5px}
.sq{
  width:38px; height:38px; border:2px solid var(--line); border-radius:9px; background:var(--btn);
  display:flex; align-items:center; justify-content:center; box-shadow:0 2px 0 var(--line);
}
.sq.on{background:var(--btn-on)}
.sq .dot{background:#20242a; border-radius:50%}
.sw{width:30px; height:26px; border:2px solid var(--line); border-radius:7px; cursor:pointer}
.sw.on{outline:3px solid var(--accent); outline-offset:1px}
.mini{
  background:var(--btn); border:2px solid var(--line); border-radius:9px; padding:4px 9px;
  font-size:11.5px; font-weight:700; box-shadow:0 2px 0 var(--line);
}
.mini.on{background:var(--btn-on)}
.row{display:flex; align-items:center; gap:7px; margin:4px 0}
.row label{width:82px; flex-shrink:0; font-size:11.5px}
.row input[type=range]{flex:1; accent-color:var(--accent)}
.row .val{width:32px; text-align:right; font-size:10.5px; color:var(--dim)}
.lay{
  display:flex; align-items:center; gap:6px; border:2px solid var(--line); border-radius:10px;
  padding:4px 6px; margin-bottom:5px; background:#fff;
}
.lay.on{outline:3px solid var(--accent); outline-offset:1px}
.lay .eye{cursor:pointer; width:18px; text-align:center}
.lay .nm{flex:1; font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer}
.lay input[type=range]{width:74px; accent-color:var(--accent)}
.sw-toggle{width:44px; height:22px; border-radius:999px; background:#c9c5b8; border:2px solid var(--line); position:relative; cursor:pointer}
.sw-toggle::after{content:""; position:absolute; left:2px; top:2px; width:14px; height:14px; border-radius:50%; background:#fff; transition:.14s}
.sw-toggle.on{background:#57c98a}
.sw-toggle.on::after{left:22px}
#psdBox{
  border:2px dashed #9aa1ac; border-radius:12px; padding:12px; text-align:center; color:var(--dim);
  font-size:12px; cursor:pointer; user-select:none; background:#fff;
}
#psdBox:hover,#psdBox.dragging{border-color:var(--accent); color:var(--accent)}
#psdInfo{margin-top:4px; font-size:11px; color:var(--accent); word-break:break-all}
#note{font-size:11px; color:var(--dim); margin-top:6px}
#layerlist select{font-size:10.5px; padding:1px 3px; border-width:1px; border-radius:5px}
#layerlist .row label{width:106px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.hidden{display:none !important}
</style>
</head>
<body>

<div id="top">
  <button class="tbtn ghost" id="btnUndoTop">↶</button>
  <button class="tbtn ghost" id="btnRedoTop">↷</button>
  <input class="name" id="docName" value="新規メモ">
  <div class="info" id="infoBar">—</div>
  <button class="tbtn primary" id="btnSave">💾 保存 (Ctrl+S)</button>
  <button class="tbtn" id="btnLoad">📂 よみこみ</button>
  <button class="tbtn" id="btnExportSeq">⬇ 連番PNG</button>
  <button class="tbtn" id="btnExportPng">🖼 画像で保存</button>
  <button class="tbtn" id="btnRec">🎬 webm</button>
</div>

<div id="main">
  <div id="rail" data-tools>
    <button class="tool on" data-tool="pen"><span class="ic">✏️</span>ペン</button>
    <button class="tool" data-tool="brush"><span class="ic">🖌️</span>ブラシ</button>
    <button class="tool" data-tool="eraser"><span class="ic">🧽</span>消しゴム</button>
    <button class="tool" data-tool="fill"><span class="ic">🪣</span>塗り</button>
    <button class="tool" data-tool="shape"><span class="ic">⬛</span>図形</button>
    <button class="tool" data-tool="text"><span class="ic">A</span>文字</button>
    <button class="tool" data-tool="pick"><span class="ic">💧</span>スポイト</button>
    <button class="tool" data-tool="move"><span class="ic">✥</span>移動</button>
    <button class="tool" data-tool="hand"><span class="ic">✋</span>手のひら</button>
  </div>

  <div id="center">
    <div id="stagewrap">
      <div id="stage">
        <canvas id="bgc"></canvas>
        <canvas id="avc"></canvas>
        <canvas id="view"></canvas>
        <canvas id="giz"></canvas>
      </div>
      <div id="zoombtns">
        <button class="tbtn" id="zIn">＋</button>
        <button class="tbtn" id="zOut">−</button>
        <button class="tbtn" id="zFit">⤢</button>
      </div>
      <div id="zoombar">🔍 —</div>
      <div id="previewBox"><div class="cap">▶ プレビュー</div><canvas id="prev"></canvas></div>
      <div id="dropmsg">PSD をドロップ</div>
    </div>

    <div id="timeline">
      <div id="tlrow1">
        <button class="tbtn" id="pFirst">⏮</button>
        <button class="tbtn" id="pPrev">◀</button>
        <button class="tbtn primary" id="pPlay">▶</button>
        <button class="tbtn" id="pNext">▶|</button>
        <button class="tbtn" id="pLast">⏭</button>
        <button class="tbtn" id="pLoop">🔁</button>
        <b style="margin-left:6px">タイムライン</b>
        <span style="margin-left:10px">速さ</span>
        <select id="fps">
          <option>2</option><option>3</option><option selected>4</option><option>6</option>
          <option>8</option><option>12</option><option>15</option><option>24</option>
        </select>
        <span style="font-size:11px;color:var(--dim)">fps</span>
        <span style="flex:1"></span>
        <button class="tbtn" id="fAdd">＋ ついか</button>
        <button class="tbtn" id="fDup">⧉ 複製</button>
        <button class="tbtn" id="fWobble">〜 ゆらゆら</button>
        <button class="tbtn" id="fCopy">コピー</button>
        <button class="tbtn" id="fPaste">はりつけ</button>
        <button class="tbtn" id="fDel" style="background:#f4746a;color:#fff">さくじょ</button>
      </div>
      <div id="frames"></div>
    </div>
  </div>

  <div id="side">
    <div id="tabs">
      <button class="tab on" data-tab="draw">お絵かき</button>
      <button class="tab" data-tab="avatar">パーツ＆ボーン</button>
    </div>
    <div id="sidebody">

      <!-- ===== お絵かきタブ ===== -->
      <div id="tabDraw">
        <h4>ペンの太さ</h4>
        <div class="grid" id="sizes"></div>

        <h4>ペンの種類</h4>
        <div class="grid" id="patterns"></div>

        <h4>図形</h4>
        <div class="grid" id="shapes"></div>

        <h4>カラー（パレット）</h4>
        <div class="grid" id="palette"></div>

        <h4>フルカラー</h4>
        <div class="row">
          <div class="sw-toggle on" id="fullColor"></div>
          <input type="color" id="colorPick" value="#20242a" style="width:64px;height:30px;border:2px solid var(--line);border-radius:8px;background:#fff">
          <span class="val" id="curColor">#20242a</span>
        </div>

        <h4>紙の色</h4>
        <div class="grid" id="papers"></div>

        <h4>レイヤー</h4>
        <div class="grid" style="margin-bottom:7px">
          <button class="mini" id="lAdd">＋ 追加</button>
          <button class="mini" id="lDup">⧉ 複製</button>
          <button class="mini" id="lDel">🗑 削除</button>
          <button class="mini" id="lMerge">⇊ 統合</button>
          <button class="mini" id="lUp">▲</button>
          <button class="mini" id="lDown">▼</button>
        </div>
        <div id="layers"></div>
        <div style="font-size:11px;color:var(--dim);margin:8px 0 4px">選んだレイヤーを他のコマへ</div>
        <div class="grid">
          <button class="mini" id="lPrevMove">◀ 前コマへ移動</button>
          <button class="mini" id="lNextMove">次コマへ移動 ▶</button>
          <button class="mini" id="lPrevCopy">◀ 前コマへコピー</button>
          <button class="mini" id="lNextCopy">次コマへコピー ▶</button>
          <button class="mini" id="lAllCopy">全コマへコピー</button>
        </div>

        <h4>透かす（オニオンスキン）</h4>
        <div class="grid" id="onion"></div>

        <h4>描き味</h4>
        <div class="row"><label>手ブレ補正</label><div class="sw-toggle on" id="stabilize"></div></div>
        <div class="row"><label>グリッド</label><div class="sw-toggle" id="gridSw"></div></div>

        <h4>しあげ加工（ドット化）</h4>
        <div class="row">
          <label>ドットの粗さ</label>
          <input type="range" id="fxPixel" min="1" max="16" step="1" value="4"><span class="val">4</span>
        </div>
        <div class="row">
          <label>減色</label>
          <select id="fxQuant">
            <option value="0">しない</option>
            <option value="2">2色</option>
            <option value="4">4色</option>
            <option value="8">8色</option>
            <option value="16" selected>16色</option>
            <option value="32">32色</option>
            <option value="pal">パレットに寄せる</option>
            <option value="mono">白黒1bit</option>
          </select>
        </div>
        <div class="row"><label>ディザ（網）</label><div class="sw-toggle" id="fxDither"></div></div>
        <div class="row"><label>フチ取り</label><div class="sw-toggle" id="fxOutline"></div></div>
        <div class="grid">
          <button class="mini" id="fxApply">このコマに適用</button>
          <button class="mini" id="fxApplyAll">全コマに適用</button>
        </div>
        <div style="font-size:11px;color:var(--dim);margin-top:5px">Ctrl+Z で戻せます</div>

        <h4>キャンバス</h4>
        <div class="grid">
          <button class="mini" id="cs320">320×240</button>
          <button class="mini" id="cs256">256×192</button>
          <button class="mini" id="cs512">512×512</button>
          <button class="mini" id="csClear">このコマを消す</button>
        </div>
      </div>

      <!-- ===== パーツ＆ボーンタブ ===== -->
      <div id="tabAvatar" class="hidden">
        <h4>パーツを置く</h4>
        <div id="psdBox">
          <div>クリック / ここに PSD・PNG をドロップ</div>
          <div id="psdInfo">パーツ 0 個</div>
        </div>
        <input type="file" id="psdFile" accept=".psd,.png,.jpg,.jpeg,.webp" multiple class="hidden">

        <h4>操作モード</h4>
        <div class="grid" id="rigModes">
          <button class="mini on" data-rm="pose">ポーズ</button>
          <button class="mini" data-rm="part">パーツ配置</button>
          <button class="mini" data-rm="bone">ボーン作成</button>
          <button class="mini" data-rm="off">切（お絵かき）</button>
        </div>
        <div style="font-size:11px;color:var(--dim);margin-top:5px" id="rigHint"></div>

        <h4>表示</h4>
        <div class="row"><label>パーツを表示</label><div class="sw-toggle on" id="avShow"></div></div>
        <div class="row"><label>不透明度</label><input type="range" id="avAlpha" min="0" max="1" step="0.01" value="0.85"><span class="val">85</span></div>
        <div class="row"><label>ボーンを表示</label><div class="sw-toggle on" id="boneShow"></div></div>

        <h4>パーツ一覧</h4>
        <div id="partList"></div>
        <div id="partEdit" class="hidden">
          <div class="row"><label>大きさ</label><input type="range" id="pScale" min="0.05" max="3" step="0.01" value="1"><span class="val">1.0</span></div>
          <div class="row"><label>回転</label><input type="range" id="pRot" min="-180" max="180" step="1" value="0"><span class="val">0</span></div>
          <div class="row"><label>つなぐ骨</label><select id="pBone"></select></div>
          <div class="grid">
            <button class="mini" id="pUp">前へ</button>
            <button class="mini" id="pDown">後ろへ</button>
            <button class="mini" id="pDel">削除</button>
          </div>
        </div>

        <h4>ボーン一覧</h4>
        <div id="boneList"></div>
        <div id="boneEdit" class="hidden">
          <div class="row"><label>角度</label><input type="range" id="bAng" min="-180" max="180" step="1" value="0"><span class="val">0</span></div>
          <div class="row"><label>長さ</label><input type="range" id="bLen" min="4" max="300" step="1" value="40"><span class="val">40</span></div>
          <div class="row"><label>親</label><select id="bParent"></select></div>
          <div class="row"><label>ゆれる骨</label><div class="sw-toggle" id="bWobble"></div></div>
          <div class="grid">
            <button class="mini" id="bDel">削除</button>
            <button class="mini" id="bRename">名前</button>
          </div>
        </div>
        <div class="grid" style="margin-top:6px">
          <button class="mini" id="boneReset">ポーズをリセット</button>
          <button class="mini" id="ikSw">IK: 切</button>
        </div>

        <h4>アニメ（コマにポーズを記録）</h4>
        <div class="grid">
          <button class="mini" id="keySet">このコマに記録</button>
          <button class="mini" id="keyDel">記録を消す</button>
          <button class="mini" id="keyClear">全部消す</button>
        </div>
        <div class="row"><label>間を補間</label><div class="sw-toggle on" id="tween"></div></div>
        <div id="keyInfo" style="font-size:11px;color:var(--dim);margin-top:4px"></div>

        <h4>コマに焼き付け</h4>
        <div class="row">
          <label>変換</label>
          <select id="bakeMode">
            <option value="raw">そのまま（フルカラー）</option>
            <option value="mono" selected>1bit（白黒）</option>
            <option value="dither">網かけ（ディザ）</option>
          </select>
        </div>
        <div class="row"><label>しきい値</label><input type="range" id="bakeTh" min="0" max="255" step="1" value="150"><span class="val">150</span></div>
        <div class="grid">
          <button class="mini" id="bakeOne">このコマに焼く</button>
          <button class="mini" id="bakeSeq">連番でコマ化</button>
          <input type="number" id="bakeCount" value="8" min="2" max="60" style="width:64px">
          <span style="font-size:11px;color:var(--dim);align-self:center">コマ</span>
        </div>
        <div id="note" style="font-size:11px;color:var(--dim);margin-top:6px"></div>
      </div>

    </div>
  </div>
</div>

<input type="file" id="openFile" accept=".ugomemo,.json" class="hidden">

<script>
"use strict";

/* =========================================================
   0. 基本状態
   ========================================================= */
let W = 320, H = 240;          // ドット解像度
let zoom = 2;
let paper = "#ffd83d";
let frames = [];               // [{layers:[{name,visible,alpha,cv}]}]
let cur = 0, curLayer = 0;
let clipFrame = null;
let onionN = 0, showGrid = false, stabilizeOn = true;

const view = document.getElementById("view");
const vctx = view.getContext("2d");
const bgc  = document.getElementById("bgc");
const bctx = bgc.getContext("2d");
const avc  = document.getElementById("avc");
const actx = avc.getContext("2d");
const stage = document.getElementById("stage");
const prev = document.getElementById("prev");
const pctx = prev.getContext("2d");
const giz  = document.getElementById("giz");
const gctx = giz.getContext("2d");

const PALETTE = [
  "#20242a","#ffffff","#ee3b30","#ffd83d","#127a3a","#2ba7e0","#f08b2c","#f490b8",

/* =========================================================
   1. フレーム / レイヤー
   ========================================================= */
function newLayerCanvas(){
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  return c;
}
function newLayer(name){
  return {name, visible:true, alpha:1, cv:newLayerCanvas()};
}
function newFrame(){
  return {layers:[newLayer("レイヤー1")]};
}
function F(){ return frames[cur]; }
function L(){ return F().layers[curLayer]; }

function initDoc(w,h){
  W = w; H = h;
  frames = [newFrame()];
  cur = 0; curLayer = 0;
  fitZoom();
  buildLayers(); buildFrames(); redraw();
}

/* ---- 表示サイズ ---- */
function applySize(){
  [view,bgc,avc].forEach(c=>{ c.width = W; c.height = H;
    c.style.width = (W*zoom)+"px"; c.style.height = (H*zoom)+"px"; });
  giz.width = W*zoom; giz.height = H*zoom;
  giz.style.width = (W*zoom)+"px"; giz.style.height = (H*zoom)+"px";
  stage.style.width = (W*zoom)+"px";
  stage.style.height = (H*zoom)+"px";
  vctx.imageSmoothingEnabled = false;
  actx.imageSmoothingEnabled = false;
  bctx.imageSmoothingEnabled = false;
  prev.width = W; prev.height = H;
  const pw = 190;
  prev.style.width = pw+"px"; prev.style.height = Math.round(pw*H/W)+"px";
  pctx.imageSmoothingEnabled = false;
  document.getElementById("zoombar").textContent = `🔍 ${W}×${H} を ${zoom.toFixed(zoom<1?2:1)}倍表示`;
  document.getElementById("infoBar").textContent =
    `${W}×${H} ドット等倍 / レイヤー無制限 / パレット＋フルカラー`;
  // canvas.width への代入は中身を消すので、必ず描き直す（拡大縮小で真っ白になるのを防ぐ）
  if(frames.length){
    redraw();
    if(parts.length){ drawRig(); actx.clearRect(0,0,W,H); if(avShow) blitRig(actx, avAlpha); }
    drawGizmo();
  }
}
function fitZoom(){
  const wrap = document.getElementById("stagewrap");
  const z = Math.max(1, Math.min(
    Math.floor((wrap.clientWidth-60)/W), Math.floor((wrap.clientHeight-60)/H)));
  zoom = z || 1;
  applySize();
}

/* =========================================================
   2. 描画（ピクセル + パターンマスク）
   ========================================================= */
function maskOK(x,y){
  if(pattern === "solid") return true;
  if(pattern === "net50") return ((x + y) & 1) === 0;
  return ((x*2 + y) % 4) === 0;         // net25 斜め
}
function isErase(){ return tool === "eraser"; }

function stamp(ctx, cx, cy, size, erase){
  const r = size/2;
  const x0 = Math.floor(cx - r + .5), y0 = Math.floor(cy - r + .5);
  for(let y=0; y<size; y++){
    for(let x=0; x<size; x++){
      if(size > 2){
        const dx = x - (size-1)/2, dy = y - (size-1)/2;
        if(dx*dx + dy*dy > r*r) continue;
      }
      const px = x0+x, py = y0+y;
      if(px<0||py<0||px>=W||py>=H) continue;
      if(!erase && !maskOK(px,py)) continue;
      if(erase) ctx.clearRect(px,py,1,1);
      else { ctx.fillStyle = color; ctx.fillRect(px,py,1,1); }
    }
  }
}
function lineStamp(ctx, x0,y0,x1,y1, size, erase){
  x0=Math.round(x0); y0=Math.round(y0); x1=Math.round(x1); y1=Math.round(y1);
  const dx = Math.abs(x1-x0), dy = -Math.abs(y1-y0);
  const sx = x0<x1?1:-1, sy = y0<y1?1:-1;
  let err = dx+dy;
  for(;;){
    stamp(ctx, x0, y0, size, erase);
    if(x0===x1 && y0===y1) break;
    const e2 = 2*err;
    if(e2 >= dy){ err += dy; x0 += sx; }
    if(e2 <= dx){ err += dx; y0 += sy; }
  }
}
function ellipseOutline(ctx,x0,y0,x1,y1,size,erase){
  const cx=(x0+x1)/2, cy=(y0+y1)/2, rx=Math.abs(x1-x0)/2, ry=Math.abs(y1-y0)/2;
  const n = Math.max(24, Math.round((rx+ry)*4));
  let px=null,py=null;
  for(let i=0;i<=n;i++){
    const a = i/n*Math.PI*2;
    const x = cx + Math.cos(a)*rx, y = cy + Math.sin(a)*ry;
    if(px!==null) lineStamp(ctx,px,py,x,y,size,erase);
    px=x; py=y;
  }
}
function fillRegion(ctx,x0,y0,x1,y1,kind){
  const L2=Math.min(x0,x1), R2=Math.max(x0,x1), T2=Math.min(y0,y1), B2=Math.max(y0,y1);
  const cx=(L2+R2)/2, cy=(T2+B2)/2, rx=(R2-L2)/2, ry=(B2-T2)/2;
  for(let y=Math.floor(T2); y<=B2; y++){
    for(let x=Math.floor(L2); x<=R2; x++){
      if(x<0||y<0||x>=W||y>=H) continue;
      if(kind==="ellf"){
        const nx=(x-cx)/(rx||1), ny=(y-cy)/(ry||1);
        if(nx*nx+ny*ny > 1) continue;
      }
      if(!maskOK(x,y)) continue;
      ctx.fillStyle = color; ctx.fillRect(x,y,1,1);
    }
  }
}
function hexToRgba(h){
  if(h.length===9) return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),parseInt(h.slice(7,9),16)];
  return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),255];
}
function floodFill(cv, sx, sy){
  sx=Math.floor(sx); sy=Math.floor(sy);
  if(sx<0||sy<0||sx>=W||sy>=H) return;
  const ctx = cv.getContext("2d");
  const img = ctx.getImageData(0,0,W,H);
  const d = img.data, i0 = (sy*W+sx)*4;
  const t = [d[i0],d[i0+1],d[i0+2],d[i0+3]];
  const f = hexToRgba(color);
  if(t[0]===f[0]&&t[1]===f[1]&&t[2]===f[2]&&t[3]===f[3]) return;
  const same = i => Math.abs(d[i]-t[0])<10 && Math.abs(d[i+1]-t[1])<10 &&
                    Math.abs(d[i+2]-t[2])<10 && Math.abs(d[i+3]-t[3])<10;
  // 訪問管理は別バッファで持つ(マスクで塗らない画素も探索は続けるため)
  const seen = new Uint8Array(W*H);
  const st = [sx,sy];
  while(st.length){
    const y = st.pop(), x = st.pop();
    if(x<0||y<0||x>=W||y>=H) continue;
    const p = y*W+x;
    if(seen[p]) continue;
    const i = p*4;
    if(!same(i)) continue;
    seen[p] = 1;
    if(maskOK(x,y)){ d[i]=f[0]; d[i+1]=f[1]; d[i+2]=f[2]; d[i+3]=f[3]; }
    st.push(x+1,y, x-1,y, x,y+1, x,y-1);
  }
  ctx.putImageData(img,0,0);
}

/* =========================================================
   3. Undo
   ========================================================= */
const undoStack = [], redoStack = [];
function grabLayers(f){
  return f.layers.map(l=>({name:l.name, visible:l.visible, alpha:l.alpha,
    data: l.cv.getContext("2d").getImageData(0,0,W,H)}));
}
function putLayers(rec){
  return rec.map(l=>{
    const cv = newLayerCanvas();
    cv.getContext("2d").putImageData(l.data,0,0);
    return {name:l.name, visible:l.visible, alpha:l.alpha, cv};
  });
}
function snapshot(){ return {type:"frame", cur, layers: grabLayers(F())}; }
function snapshotDoc(){ return {type:"doc", cur, frames: frames.map(grabLayers)}; }
function restore(s){
  if(s.type === "doc"){
    frames = s.frames.map(rec=>({layers: putLayers(rec)}));
    cur = Math.min(s.cur, frames.length-1);
  } else {
    cur = Math.min(s.cur, frames.length-1);
    F().layers = putLayers(s.layers);
  }
  curLayer = Math.min(curLayer, F().layers.length-1);
  buildLayers(); buildFrames(); redraw();
}
function pushUndo(all){
  undoStack.push(all ? snapshotDoc() : snapshot());
  if(undoStack.length > 40) undoStack.shift();
  redoStack.length = 0;
}
/* 戻す先が全コマ記録なら、今の状態も全コマで控えておく */
function undo(){
  if(!undoStack.length) return;
  const s = undoStack.pop();
  redoStack.push(s.type === "doc" ? snapshotDoc() : snapshot());
  restore(s);
}
function redo(){
  if(!redoStack.length) return;
  const s = redoStack.pop();
  undoStack.push(s.type === "doc" ? snapshotDoc() : snapshot());
  restore(s);
}

/* =========================================================
   4. 合成・再描画
   ========================================================= */
function compose(ctx, frame, withPaper){
  ctx.clearRect(0,0,W,H);
  if(withPaper && paper !== "transparent"){ ctx.fillStyle = paper; ctx.fillRect(0,0,W,H); }
  for(const l of frame.layers){
    if(!l.visible) continue;
    ctx.globalAlpha = l.alpha;
    ctx.drawImage(l.cv,0,0);
  }
  ctx.globalAlpha = 1;
}
let tmp = null;                       // 図形プレビュー用
function redraw(){
  // 背景（紙 + オニオン）
  bctx.clearRect(0,0,W,H);
  if(paper !== "transparent"){ bctx.fillStyle = paper; bctx.fillRect(0,0,W,H); }
  for(let i=1;i<=onionN;i++){
    const f = frames[cur-i]; if(!f) break;
    bctx.globalAlpha = 0.34/i;
    for(const l of f.layers){ if(l.visible) bctx.drawImage(l.cv,0,0); }
  }
  bctx.globalAlpha = 1;
  // 本体
  vctx.clearRect(0,0,W,H);
  for(const l of F().layers){
    if(!l.visible) continue;
    vctx.globalAlpha = l.alpha;
    vctx.drawImage(l.cv,0,0);
  }
  vctx.globalAlpha = 1;
  if(tmp) vctx.drawImage(tmp,0,0);
  if(showGrid){
    vctx.globalAlpha = .18; vctx.fillStyle = "#20242a";
    for(let x=0;x<W;x+=8) vctx.fillRect(x,0,1,H);
    for(let y=0;y<H;y+=8) vctx.fillRect(0,y,W,1);
    vctx.globalAlpha = 1;
  }
  updateFrameThumb(cur);
}

/* =========================================================
   5. 入力
   ========================================================= */
let drawing = false, lastP = null, startP = null, smoothP = null, moveOrigin = null;
function toPix(e){
  const r = view.getBoundingClientRect();
  return {x:(e.clientX-r.left)/zoom, y:(e.clientY-r.top)/zoom};
}
view.addEventListener("pointerdown", e=>{
  if(e.button !== 0) return;
  view.setPointerCapture(e.pointerId);
  const p = toPix(e);
  if(tool === "pick"){ pickColor(p); return; }
  if(tool === "hand") return;
  pushUndo();
  drawing = true; startP = p; lastP = p; smoothP = {...p};
  const ctx = L().cv.getContext("2d");
  if(tool === "pen" || tool === "brush" || tool === "eraser"){
    stamp(ctx, p.x, p.y, tool==="brush"? penSize*2 : penSize, isErase());
  } else if(tool === "fill"){
    floodFill(L().cv, p.x, p.y); drawing = false;
  } else if(tool === "text"){
    drawing = false; placeText(p);
  } else if(tool === "shape"){
    tmp = newLayerCanvas();
  } else if(tool === "move"){
    moveOrigin = {snap: ctx.getImageData(0,0,W,H)};
  }
  redraw();
});
view.addEventListener("pointermove", e=>{
  if(!drawing) return;
  const p = toPix(e);
  const ctx = L().cv.getContext("2d");
  if(tool === "pen" || tool === "brush" || tool === "eraser"){
    let q = p;
    if(stabilizeOn){
      smoothP.x += (p.x - smoothP.x) * 0.42;
      smoothP.y += (p.y - smoothP.y) * 0.42;
      q = {x:smoothP.x, y:smoothP.y};
    }
    lineStamp(ctx, lastP.x, lastP.y, q.x, q.y, tool==="brush"? penSize*2 : penSize, isErase());
    lastP = q;
  } else if(tool === "shape"){
    const t = tmp.getContext("2d");
    t.clearRect(0,0,W,H);
    drawShapeInto(t, startP, p);
  } else if(tool === "move"){
    const dx = Math.round(p.x - startP.x), dy = Math.round(p.y - startP.y);
    ctx.clearRect(0,0,W,H);
    const off = newLayerCanvas();
    off.getContext("2d").putImageData(moveOrigin.snap,0,0);
    ctx.drawImage(off, dx, dy);
  }
  redraw();
});
addEventListener("pointerup", ()=>{
  if(!drawing) return;
  drawing = false;
  if(tool === "shape" && tmp){
    L().cv.getContext("2d").drawImage(tmp,0,0);
    tmp = null;
  }
  moveOrigin = null;
  redraw(); buildFrames();
});
function drawShapeInto(t, a, b){
  const prevFill = color;
  if(shape === "line") lineStamp(t, a.x,a.y,b.x,b.y, penSize, false);
  else if(shape === "rect"){
    lineStamp(t,a.x,a.y,b.x,a.y,penSize,false); lineStamp(t,b.x,a.y,b.x,b.y,penSize,false);
    lineStamp(t,b.x,b.y,a.x,b.y,penSize,false); lineStamp(t,a.x,b.y,a.x,a.y,penSize,false);
  }
  else if(shape === "rectf") fillRegion(t,a.x,a.y,b.x,b.y,"rectf");
  else if(shape === "ell")   ellipseOutline(t,a.x,a.y,b.x,b.y,penSize,false);
  else if(shape === "ellf")  fillRegion(t,a.x,a.y,b.x,b.y,"ellf");
  color = prevFill;
}
function pickColor(p){
  const off = newLayerCanvas();
  compose(off.getContext("2d"), F(), true);
  const d = off.getContext("2d").getImageData(Math.floor(p.x),Math.floor(p.y),1,1).data;
  setColor("#" + [d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,"0")).join(""));
}
function placeText(p){
  const s = prompt("文字を入力");
  if(!s) return;
  const size = Math.max(8, penSize*5);
  const off = newLayerCanvas();
  const o = off.getContext("2d");
  o.font = `bold ${size}px "Yu Gothic UI","Hiragino Sans",sans-serif`;
  o.textBaseline = "top";
  o.fillStyle = "#000";
  o.fillText(s, Math.round(p.x), Math.round(p.y));
  // アンチエイリアスを落として1bit化 → 現在色で描く
  const img = o.getImageData(0,0,W,H), d = img.data;
  const c = hexToRgba(color);
  for(let i=0;i<d.length;i+=4){
    if(d[i+3] > 110 && maskOK((i/4)%W, Math.floor(i/4/W))){
      d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2]; d[i+3]=255;
    } else d[i+3]=0;
  }
  o.putImageData(img,0,0);
  L().cv.getContext("2d").drawImage(off,0,0);
  redraw(); buildFrames();
}

/* ---- レイヤーUI ---- */
function buildLayers(){
  const el = document.getElementById("layers");
  el.innerHTML = "";
  F().layers.slice().reverse().forEach((l, ri)=>{
    const i = F().layers.length-1-ri;
    const d = document.createElement("div");
    d.className = "lay" + (i===curLayer?" on":"");
    const eye = document.createElement("span");
    eye.className = "eye"; eye.textContent = l.visible ? "👁" : "🚫";
    eye.onclick = e=>{ e.stopPropagation(); l.visible = !l.visible; buildLayers(); redraw(); buildFrames(); };
    const nm = document.createElement("span");
    nm.className = "nm"; nm.textContent = l.name; nm.title = "ダブルクリックで名前変更";
    nm.ondblclick = ()=>{ const n = prompt("レイヤー名", l.name); if(n){ l.name = n; buildLayers(); } };
    const rg = document.createElement("input");
    rg.type = "range"; rg.min = 0; rg.max = 1; rg.step = .01; rg.value = l.alpha;
    rg.oninput = ()=>{ l.alpha = +rg.value; redraw(); buildFrames(); };
    d.append(eye, nm, rg);
    d.onclick = ()=>{ curLayer = i; buildLayers(); };
    el.appendChild(d);
  });
}
document.getElementById("lAdd").onclick = ()=>{
  pushUndo();
  F().layers.push(newLayer("レイヤー"+(F().layers.length+1)));
  curLayer = F().layers.length-1; buildLayers(); redraw();
};
document.getElementById("lDup").onclick = ()=>{
  pushUndo();
  const src = L(), c = newLayerCanvas();
  c.getContext("2d").drawImage(src.cv,0,0);
  F().layers.splice(curLayer+1,0,{name:src.name+" コピー", visible:true, alpha:src.alpha, cv:c});
  curLayer++; buildLayers(); redraw();
};
document.getElementById("lDel").onclick = ()=>{
  if(F().layers.length <= 1) return;

/* ---- しあげ加工（ドット化フィルタ） ---- */
const BAYER8 = (()=>{               // 8x8 ベイヤー行列 0..63
  const m = [[0]];
  for(let s=1;s<8;s*=2){
    const n = m.length, o = [];
    for(let y=0;y<n*2;y++) o.push(new Array(n*2));
    for(let y=0;y<n;y++) for(let x=0;x<n;x++){
      const v = m[y][x]*4;
      o[y][x]=v; o[y][x+n]=v+2; o[y+n][x]=v+3; o[y+n][x+n]=v+1;
    }
    m.length = 0; o.forEach(r=>m.push(r));
  }
  return m;
})();
const PAL_RGB = PALETTE.filter(c=>c!=="#00000000").map(hexToRgba);

function fxOpts(){
  return {
    pixel: +document.getElementById("fxPixel").value,
    quant: document.getElementById("fxQuant").value,
    dither: document.getElementById("fxDither").classList.contains("on"),
    outline: document.getElementById("fxOutline").classList.contains("on"),
  };
}
function applyFx(cv, o){
  const ctx = cv.getContext("2d");
  // 1) モザイク（ドット化）: 縮小→等倍拡大
  if(o.pixel > 1){
    const sw = Math.max(1, Math.ceil(W/o.pixel)), sh = Math.max(1, Math.ceil(H/o.pixel));
    const small = document.createElement("canvas");
    small.width = sw; small.height = sh;
    const sx = small.getContext("2d");
    sx.imageSmoothingEnabled = true;          // 縮小時だけ平均化して色を拾う
    sx.drawImage(cv, 0,0, sw, sh);
    ctx.clearRect(0,0,W,H);
    ctx.imageSmoothingEnabled = false;        // 拡大は補間なし＝カクカクのドット
    ctx.drawImage(small, 0,0, sw*o.pixel, sh*o.pixel);
  }
  // 2) 減色 / 1bit / パレット寄せ（+ディザ）
  if(o.quant !== "0" || o.dither){
    const img = ctx.getImageData(0,0,W,H), d = img.data;
    const k = /^\d+$/.test(o.quant) ? +o.quant : 0;
    const step = k > 1 ? 255/(k-1) : 0;
    for(let y=0;y<H;y++){
      for(let x=0;x<W;x++){
        const i = (y*W+x)*4;
        if(d[i+3] < 24){ d[i+3] = 0; continue; }
        d[i+3] = 255;
        // ディザのゆらぎ量（-0.5..0.5 相当）
        const bias = o.dither ? (BAYER8[y&7][x&7]/64 - 0.5) : 0;
        if(o.quant === "mono"){
          const lum = .299*d[i] + .587*d[i+1] + .114*d[i+2] + bias*90;
          const v = lum < 140 ? 0 : 255;
          d[i]=d[i+1]=d[i+2]=v;
        } else if(o.quant === "pal"){
          let best = 0, bd = 1e9;
          const r = d[i]+bias*40, g = d[i+1]+bias*40, b = d[i+2]+bias*40;
          for(let p=0;p<PAL_RGB.length;p++){
            const c = PAL_RGB[p];
            const dd = (c[0]-r)**2 + (c[1]-g)**2 + (c[2]-b)**2;
            if(dd < bd){ bd = dd; best = p; }
          }
          const c = PAL_RGB[best];
          d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2];
        } else if(k > 1){
          for(let ch=0; ch<3; ch++){
            const v = d[i+ch] + bias*step;
            d[i+ch] = Math.max(0, Math.min(255, Math.round(v/step)*step));
          }
        }
      }
    }
    ctx.putImageData(img,0,0);
  }
  // 3) フチ取り: 不透明部分の外周1pxを線色で囲む
  if(o.outline){
    const img = ctx.getImageData(0,0,W,H), d = img.data;
    const a = new Uint8Array(W*H);
    for(let p=0;p<W*H;p++) a[p] = d[p*4+3] > 0 ? 1 : 0;
    const oc = hexToRgba("#20242a");
    for(let y=0;y<H;y++){
      for(let x=0;x<W;x++){
        const p = y*W+x;
        if(a[p]) continue;
        const near = (x>0&&a[p-1]) || (x<W-1&&a[p+1]) || (y>0&&a[p-W]) || (y<H-1&&a[p+W]);
        if(!near) continue;
        const i = p*4;
        d[i]=oc[0]; d[i+1]=oc[1]; d[i+2]=oc[2]; d[i+3]=255;
      }
    }
    ctx.putImageData(img,0,0);
  }
}
/* 加工は「見えているレイヤーを1枚に統合してから」かける。
   ドット化は合成後の絵にかけないと、レイヤー境界でドットの目がズレるため。 */
function fxFrame(f, o){
  const flat = newLayerCanvas();
  const fc = flat.getContext("2d");
  for(const l of f.layers){
    if(!l.visible) continue;
    fc.globalAlpha = l.alpha; fc.drawImage(l.cv,0,0);
  }
  fc.globalAlpha = 1;
  applyFx(flat, o);
  const hidden = f.layers.filter(l=>!l.visible);
  f.layers = [{name:"しあげ", visible:true, alpha:1, cv:flat}, ...hidden];
}

function cloneLayer(l, name){
  const cv = newLayerCanvas();
  cv.getContext("2d").drawImage(l.cv,0,0);
  return {name: name || l.name, visible:l.visible, alpha:l.alpha, cv};
}
function sendLayer(dir, copy){
  const src = L();
  if(!src) return;
  let dst = cur + dir;
  if(dst < 0){                        // 前が無ければ先頭に空コマを作る
    frames.unshift({layers:[]});
    cur++; dst = 0;
  } else if(dst >= frames.length){    // 後ろが無ければ末尾に空コマを作る
    frames.push({layers:[]});
    dst = frames.length-1;
  }
  pushUndo(true);
  frames[dst].layers.push(cloneLayer(src));
  if(!copy){
    F().layers.splice(curLayer,1);
    if(!F().layers.length) F().layers.push(newLayer("レイヤー1"));   // 空コマにしない
    curLayer = Math.max(0, Math.min(curLayer, F().layers.length-1));
  }
  // 移動先のコマへ付いていく（コピーは元コマに留まる）
  if(!copy){ cur = dst; curLayer = F().layers.length-1; }
  frames.forEach(f=>{ if(!f.layers.length) f.layers.push(newLayer("レイヤー1")); });
  buildLayers(); buildFrames(); redraw();
}

/* =========================================================
   7. パーツ＆ボーン（PSD/PNGのパーツをボーンで動かす）
   ========================================================= */
/* データ:
   parts: {id,name,img,x,y,scale,rot,bone,visible}   x,y はパーツ中心のキャンバス座標
   bones: {id,name,parent,x,y,len,ang,rest,wobble}   親なし骨は x,y が根元。ang は親からの相対角(rad)
   バインド時にパーツのローカル座標を骨基準で保存し、以後は骨の世界変換で追従する。 */
let parts = [], bones = [], partSeq = 0, boneSeq = 0;
let selPart = null, selBone = null;
let rigMode = "pose", ikOn = false, showBones = true;
let avShow = true, avAlpha = .85;
let poseKeys = {};           // {frameIndex: {boneId: ang}}
let tweenOn = true;

const rig = document.createElement("canvas");   // パーツ合成先（キャンバス解像度）
const rctx = rig.getContext("2d");

function byId(arr,id){ return arr.find(o=>o.id===id) || null; }

/* ---- 世界変換（親→子で合成） ---- */
function boneWorld(b, cache){
  cache = cache || {};
  if(cache[b.id]) return cache[b.id];
  let ox = b.x, oy = b.y, a = b.ang;
  const p = b.parent != null ? byId(bones, b.parent) : null;
  if(p){
    const pw = boneWorld(p, cache);
    // 親の先端に根元を置く
    ox = pw.tx; oy = pw.ty; a = pw.ang + b.ang;
  }
  const w = {x:ox, y:oy, ang:a, tx:ox + Math.cos(a)*b.len, ty:oy + Math.sin(a)*b.len};
  cache[b.id] = w;
  return w;
}
function worldAll(){
  const cache = {};
  bones.forEach(b=> boneWorld(b, cache));
  return cache;
}

/* ---- パーツを骨にバインド（今の見た目を保ったまま結び付ける） ---- */
function bindPart(pt, boneId){
  if(boneId == null){
    if(pt.bone != null){                       // 解除: 現在の世界位置を焼き込む
      const w = boneWorld(byId(bones, pt.bone));
      const c = Math.cos(w.ang), s = Math.sin(w.ang);
      pt.x = w.x + pt.lx*c - pt.ly*s;
      pt.y = w.y + pt.lx*s + pt.ly*c;
      pt.rot = pt.rot + w.ang;
    }
    pt.bone = null; delete pt.lx; delete pt.ly;
    return;
  }
  const b = byId(bones, boneId); if(!b) return;
  const w = boneWorld(b);
  const dx = pt.x - w.x, dy = pt.y - w.y;
  const c = Math.cos(-w.ang), s = Math.sin(-w.ang);
  pt.lx = dx*c - dy*s;
  pt.ly = dx*s + dy*c;
  pt.rot = pt.rot - w.ang;                     // 骨からの相対回転
  pt.bone = boneId;
}
function partTransform(pt, cache){
  if(pt.bone == null) return {x:pt.x, y:pt.y, rot:pt.rot};
  const b = byId(bones, pt.bone);
  if(!b) return {x:pt.x, y:pt.y, rot:pt.rot};
  const w = cache ? cache[b.id] : boneWorld(b);
  const c = Math.cos(w.ang), s = Math.sin(w.ang);
  return {x: w.x + pt.lx*c - pt.ly*s, y: w.y + pt.lx*s + pt.ly*c, rot: pt.rot + w.ang};
}

/* ---- 描画 ---- */
function drawRig(){
  rig.width = W; rig.height = H;
  rctx.setTransform(1,0,0,1,0,0);
  rctx.clearRect(0,0,W,H);
  rctx.imageSmoothingEnabled = false;
  const cache = worldAll();
  for(const pt of parts){
    if(!pt.visible) continue;
    const t = partTransform(pt, cache);
    rctx.save();
    rctx.translate(t.x, t.y);
    rctx.rotate(t.rot);
    rctx.scale(pt.scale, pt.scale);
    rctx.drawImage(pt.img, -pt.img.width/2, -pt.img.height/2);
    rctx.restore();
  }
}
function blitRig(ctx, alpha){
  if(!parts.length) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(rig, 0, 0);
  ctx.restore();
}
/* ボーンのギズモ（CSS解像度・zoom倍のキャンバスへ） */
function drawGizmo(){
  gctx.setTransform(1,0,0,1,0,0);
  gctx.clearRect(0,0,giz.width,giz.height);
  if(!giz.classList.contains("active") || !showBones) return;
  const z = zoom, cache = worldAll();
  if(rigMode === "part"){
    for(const pt of parts){
      const t = partTransform(pt, cache);
      const w = pt.img.width*pt.scale, h = pt.img.height*pt.scale;
      gctx.save();
      gctx.translate(t.x*z, t.y*z); gctx.rotate(t.rot);
      gctx.strokeStyle = pt === selPart ? "#e2703a" : "rgba(32,36,42,.45)";
      gctx.lineWidth = pt === selPart ? 2 : 1;
      gctx.setLineDash(pt === selPart ? [] : [4,3]);
      gctx.strokeRect(-w/2*z, -h/2*z, w*z, h*z);
      gctx.restore();
    }
    gctx.setLineDash([]);
  }
  for(const b of bones){
    const w = cache[b.id];
    const sel = b === selBone;
    gctx.strokeStyle = sel ? "#e2703a" : "#2ba7e0";
    gctx.lineWidth = sel ? 4 : 3;
    gctx.lineCap = "round";
    gctx.beginPath();
    gctx.moveTo(w.x*z, w.y*z); gctx.lineTo(w.tx*z, w.ty*z);
    gctx.stroke();
    gctx.strokeStyle = "rgba(255,255,255,.85)"; gctx.lineWidth = 1;
    gctx.stroke();
    // 根元(丸)と先端(掴むハンドル)
    gctx.fillStyle = "#fff"; gctx.strokeStyle = "#20242a"; gctx.lineWidth = 2;
    gctx.beginPath(); gctx.arc(w.x*z, w.y*z, 4, 0, 7); gctx.fill(); gctx.stroke();
    gctx.fillStyle = sel ? "#ffd24a" : "#2ba7e0";
    gctx.beginPath(); gctx.arc(w.tx*z, w.ty*z, 6, 0, 7); gctx.fill(); gctx.stroke();
    if(b.wobble){
      gctx.fillStyle = "#e2703a";
      gctx.beginPath(); gctx.arc(w.tx*z+9, w.ty*z-9, 3, 0, 7); gctx.fill();
    }
  }
}

/* ---- パーツ読み込み（PSD = レイヤーごとにパーツ化 / 画像 = 1パーツ） ---- */
function addPart(name, canvas){
  // キャンバスに収まるように初期スケールを決める
  const fit = Math.min(1, (W*0.9)/canvas.width, (H*0.9)/canvas.height);
  parts.push({
    id: ++partSeq, name, img: canvas, visible: true,
    x: W/2, y: H/2, scale: fit, rot: 0, bone: null,
  });
}
function flattenPsd(node, arr){
  (node.children||[]).forEach(ch=>{
    if(ch.children) flattenPsd(ch, arr);
    else if(ch.canvas) arr.push(ch);
  });
}
async function loadPartFile(file){
  if(/\.psd$/i.test(file.name)){
    const psd = agPsd.readPsd(await file.arrayBuffer(), {skipCompositeImageData:true, skipThumbnail:true});
    const flat = []; flattenPsd(psd, flat);
    // PSD内の相対位置を保ったまま並べる
    const fit = Math.min(1, (W*0.9)/psd.width, (H*0.9)/psd.height);
    flat.forEach(l=>{
      const lw = (l.right||0)-(l.left||0), lh = (l.bottom||0)-(l.top||0);
      if(lw<=0 || lh<=0) return;
      parts.push({
        id: ++partSeq, name: l.name||"パーツ", img: l.canvas, visible: true,
        x: W/2 + ((l.left||0) + lw/2 - psd.width/2)*fit,
        y: H/2 + ((l.top||0)  + lh/2 - psd.height/2)*fit,
        scale: fit, rot: 0, bone: null,
      });
    });
    try{ await idbPut("lastPsd", {name:file.name, buf:await file.arrayBuffer()}); }catch(e){}
  } else {
    const img = await new Promise((res,rej)=>{
      const im = new Image();
      im.onload = ()=> res(im); im.onerror = rej;
      im.src = URL.createObjectURL(file);
    });
    const c = document.createElement("canvas");
    c.width = img.width; c.height = img.height;
    c.getContext("2d").drawImage(img,0,0);
    addPart(file.name.replace(/\.\w+$/,""), c);
  }
  selPart = parts[parts.length-1] || null;
  buildRigUI(); drawRig();
}
function idb(){
  return new Promise((res,rej)=>{
    const q = indexedDB.open("ugomemoStudio",1);
    q.onupgradeneeded = ()=> q.result.createObjectStore("files");
    q.onsuccess = ()=> res(q.result);
    q.onerror = ()=> rej(q.error);
  });
}
async function idbPut(k,v){
  const db = await idb();
  return new Promise((res,rej)=>{
    const tx = db.transaction("files","readwrite");
    tx.objectStore("files").put(v,k);
    tx.oncomplete = res; tx.onerror = ()=> rej(tx.error);
  });
}

/* ---- キャンバス上の操作（ギズモ層でヒットテスト） ---- */
function gizPix(e){
  const r = giz.getBoundingClientRect();
  return {x:(e.clientX-r.left)/zoom, y:(e.clientY-r.top)/zoom};
}
let dragKind = null, dragOff = null;
giz.addEventListener("pointerdown", e=>{
  if(rigMode === "off") return;
  giz.setPointerCapture(e.pointerId);
  const p = gizPix(e);
  const cache = worldAll();
  const hitR = 9/zoom;

  if(rigMode === "bone"){
    // 選択中の骨があればその子として、無ければ根として作る
    const parent = selBone;
    const pw = parent ? cache[parent.id] : null;
    const b = {
      id: ++boneSeq, name: "ボーン"+(bones.length+1),
      parent: parent ? parent.id : null,
      x: parent ? 0 : p.x, y: parent ? 0 : p.y,
      len: 1, ang: 0, rest: 0, wobble: false,
    };
    if(parent) b.ang = Math.atan2(p.y-pw.ty, p.x-pw.tx) - pw.ang;
    bones.push(b);
    selBone = b; dragKind = "newbone"; dragOff = p;
    buildRigUI(); drawGizmo();
    return;
  }
  // 骨の先端ハンドル優先（ポーズ操作）
  for(let i=bones.length-1; i>=0; i--){
    const b = bones[i], w = cache[b.id];
    if(Math.hypot(p.x-w.tx, p.y-w.ty) < hitR){
      selBone = b; dragKind = "tip"; buildRigUI(); drawGizmo();
      return;
    }
  }
  if(rigMode === "part"){
    for(let i=parts.length-1; i>=0; i--){
      const pt = parts[i];
      if(!pt.visible) continue;
      const t = partTransform(pt, cache);
      const hw = pt.img.width*pt.scale/2, hh = pt.img.height*pt.scale/2;
      const c = Math.cos(-t.rot), s = Math.sin(-t.rot);
      const dx = p.x-t.x, dy = p.y-t.y;
      const lx = dx*c - dy*s, ly = dx*s + dy*c;
      if(Math.abs(lx) <= hw && Math.abs(ly) <= hh){
        selPart = pt; dragKind = "part"; dragOff = {x:lx, y:ly};
        buildRigUI(); drawGizmo();
        return;
      }
    }
    selPart = null; buildRigUI(); drawGizmo();
  }
});
giz.addEventListener("pointermove", e=>{
  if(!dragKind) return;
  const p = gizPix(e);
  if(dragKind === "part" && selPart){
    if(selPart.bone != null){
      // 骨に付いている場合はローカル座標を動かす
      const w = boneWorld(byId(bones, selPart.bone));
      const c = Math.cos(-w.ang), s = Math.sin(-w.ang);
      const dx = p.x - w.x, dy = p.y - w.y;
      const lx = dx*c - dy*s, ly = dx*s + dy*c;
      const rc = Math.cos(-selPart.rot), rs = Math.sin(-selPart.rot);
      selPart.lx = lx - (dragOff.x*Math.cos(selPart.rot) - dragOff.y*Math.sin(selPart.rot));
      selPart.ly = ly - (dragOff.x*Math.sin(selPart.rot) + dragOff.y*Math.cos(selPart.rot));
    } else {
      selPart.x = p.x - (dragOff.x*Math.cos(selPart.rot) - dragOff.y*Math.sin(selPart.rot));
      selPart.y = p.y - (dragOff.x*Math.sin(selPart.rot) + dragOff.y*Math.cos(selPart.rot));
    }
    drawRig(); drawGizmo();
    return;
  }
  if((dragKind === "tip" || dragKind === "newbone") && selBone){
    const b = selBone;
    const pw = b.parent != null ? boneWorld(byId(bones,b.parent)) : null;
    const ox = pw ? pw.tx : b.x, oy = pw ? pw.ty : b.y;
    const base = pw ? pw.ang : 0;
    const ang = Math.atan2(p.y-oy, p.x-ox) - base;
    if(dragKind === "newbone"){
      b.ang = ang; b.len = Math.max(4, Math.hypot(p.x-ox, p.y-oy)); b.rest = b.ang;
    } else if(ikOn && b.parent != null){
      solveIK(byId(bones,b.parent), b, p);
    } else {
      b.ang = ang;
    }
    setRange("bAng", Math.round(b.ang*180/Math.PI), 0);
    setRange("bLen", Math.round(b.len), 0);
    drawRig(); drawGizmo();
  }
});
addEventListener("pointerup", ()=>{

  dragKind = null;
});
/* 2本チェーンのIK: 上腕(a)+前腕(b)の先端を target に寄せる */
function solveIK(a, b, target){
  const aw = a.parent != null ? boneWorld(byId(bones,a.parent)) : null;
  const ox = aw ? aw.tx : a.x, oy = aw ? aw.ty : a.y;
  const base = aw ? aw.ang : 0;
  const dx = target.x-ox, dy = target.y-oy;
  const l1 = a.len, l2 = b.len;
  let d = Math.hypot(dx,dy);
  d = Math.max(Math.abs(l1-l2)+.001, Math.min(l1+l2-.001, d));
  const at = Math.atan2(dy,dx);
  const cosA = (l1*l1 + d*d - l2*l2)/(2*l1*d);
  const A = Math.acos(Math.max(-1, Math.min(1, cosA)));
  const cosB = (l1*l1 + l2*l2 - d*d)/(2*l1*l2);
  const B = Math.acos(Math.max(-1, Math.min(1, cosB)));
  a.ang = (at - A) - base;
  b.ang = Math.PI - B;
}

/* ---- ゆれる骨（バネ） ---- */
class Spring{
  constructor(){ this.x=0; this.v=0; }
  step(dt,k,c,input){
    this.v += (-k*this.x - c*this.v + input)*dt;
    this.x += this.v*dt;
    if(!isFinite(this.x)){ this.x=0; this.v=0; }
  }
}
const wobbleSprings = {};
function stepRig(now, dt){
  const t = now/1000;
  let moved = false;
  for(const b of bones){
    if(!b.wobble) continue;
    const s = wobbleSprings[b.id] || (wobbleSprings[b.id] = new Spring());
    const wind = Math.sin(t*1.4 + b.id) + Math.sin(t*2.3 + b.id*2)*.5;
    s.step(dt, 26, 2.2, wind*26);
    b.ang = b.rest + s.x*0.02;
    moved = true;
  }
  if(moved){ drawRig(); }
}

/* ---- ポーズのキーフレーム ---- */
function capturePose(){
  const o = {};
  bones.forEach(b=> o[b.id] = b.ang);
  return o;
}
function applyPose(o){
  bones.forEach(b=>{ if(o[b.id] !== undefined) b.ang = o[b.id]; });
  drawRig(); drawGizmo();
}
function poseForFrame(i){
  const keys = Object.keys(poseKeys).map(Number).sort((a,b)=>a-b);
  if(!keys.length) return null;
  if(poseKeys[i]) return poseKeys[i];
  if(!tweenOn){
    let last = keys[0];
    for(const k of keys) if(k <= i) last = k;
    return poseKeys[last];
  }
  let lo = null, hi = null;
  for(const k of keys){ if(k < i) lo = k; if(k > i && hi === null) hi = k; }
  if(lo === null) return poseKeys[hi];
  if(hi === null) return poseKeys[lo];
  const u = (i-lo)/(hi-lo), A = poseKeys[lo], B = poseKeys[hi], o = {};
  bones.forEach(b=>{
    const a = A[b.id] ?? b.ang, c = B[b.id] ?? b.ang;
    let d = c - a;
    while(d > Math.PI) d -= Math.PI*2;      // 近い方向に回す
    while(d < -Math.PI) d += Math.PI*2;
    o[b.id] = a + d*u;
  });
  return o;
}
function syncPoseToFrame(){
  const p = poseForFrame(cur);
  if(p) applyPose(p);
}
document.getElementById("keySet").onclick = ()=>{

document.getElementById("keyDel").onclick = ()=>{

/* ---- 焼き付け ---- */
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function bakeInto(layerCv){
  const off = newLayerCanvas();
  const o = off.getContext("2d");
  o.imageSmoothingEnabled = false;
  blitRig(o, 1);
  const mode = document.getElementById("bakeMode").value;
  const th = +document.getElementById("bakeTh").value;
  if(mode !== "raw"){
    const img = o.getImageData(0,0,W,H), d = img.data;
    for(let y=0;y<H;y++){
      for(let x=0;x<W;x++){
        const i = (y*W+x)*4;
        if(d[i+3] < 40){ d[i+3]=0; continue; }
        const lum = .299*d[i] + .587*d[i+1] + .114*d[i+2];
        const t = mode === "dither" ? (BAYER[y&3][x&3]/16*160 + th - 80) : th;
        if(lum < t){ d[i]=32; d[i+1]=36; d[i+2]=42; d[i+3]=255; }
        else { d[i+3]=0; }
      }
    }
    o.putImageData(img,0,0);
  }
  layerCv.getContext("2d").drawImage(off,0,0);
}
document.getElementById("bakeOne").onclick = ()=>{
  if(!parts.length){ alert("先にパーツを読み込んでください"); return; }
  pushUndo();
  drawRig();

  redraw(); buildFrames();
};
document.getElementById("bakeSeq").onclick = ()=>{
  if(!parts.length){ alert("先にパーツを読み込んでください"); return; }
  const n = Math.max(2, Math.min(60, +document.getElementById("bakeCount").value||8));
  const keys = Object.keys(poseKeys).map(Number);
  const saved = capturePose();
  const dt = 1/fps();
  let t = performance.now();
  for(let i=0;i<n;i++){
    if(keys.length){
      // 記録したポーズを n コマに割り付けて補間
      const span = Math.max(...keys) - Math.min(...keys);
      const at = Math.min(...keys) + (span ? span*i/(n-1) : 0);
      const lo = Math.floor(at), hi = Math.ceil(at);
      const A = poseForFrame(lo), B = poseForFrame(hi);
      if(A && B){
        const u = at-lo, o = {};
        bones.forEach(b=>{
          const a = A[b.id] ?? b.ang, c = B[b.id] ?? b.ang;
          let d2 = c-a;
          while(d2 > Math.PI) d2 -= Math.PI*2;
          while(d2 < -Math.PI) d2 += Math.PI*2;
          o[b.id] = a + d2*u;
        });
        applyPose(o);
      }
    } else {
      t += dt*1000;
      stepRig(t, dt);       // ゆれる骨だけで動かす
    }
    drawRig();
    const f = newFrame();
    bakeInto(f.layers[0].cv);
    f.layers[0].name = "リグ";
    frames.splice(cur + 1 + i, 0, f);
  }
  applyPose(saved);
  cur = cur + n; curLayer = 0;
  buildLayers(); buildFrames(); redraw();
};

  })));
  cur = 0; curLayer = 0;
  // リグ（パーツ・ボーン・ポーズ記録）も復元する
  parts = []; bones = []; poseKeys = {}; selPart = selBone = null;
  if(d.rig){
    bones = (d.rig.bones||[]).map(b=>({...b}));
    boneSeq = bones.reduce((m,b)=>Math.max(m,b.id), 0);
    parts = await Promise.all((d.rig.parts||[]).map(async p=>{
      const img = document.createElement("canvas");
      await new Promise(res=>{
        const im = new Image();
        im.onload = ()=>{ img.width = im.width; img.height = im.height;
          img.getContext("2d").drawImage(im,0,0); res(); };
        im.onerror = res; im.src = p.png;
      });
      return {id: ++partSeq, name:p.name, img, visible:p.visible, x:p.x, y:p.y,
        lx:p.lx, ly:p.ly, scale:p.scale, rot:p.rot, bone:p.bone};
    }));
    poseKeys = d.rig.keys || {};
  }
  buildRigUI(); drawRig(); drawGizmo();
  fitZoom(); buildLayers(); buildFrames(); redraw();
  e.target.value = "";
};
function frameBlob(i){
  const off = newLayerCanvas();
  compose(off.getContext("2d"), frames[i], true);
  return new Promise(res=> off.toBlob(res, "image/png"));
}
document.getElementById("btnExportPng").onclick = async ()=>{
  dl(await frameBlob(cur), `${docNameVal()}_${String(cur+1).padStart(3,"0")}.png`);
};
document.getElementById("btnExportSeq").onclick = async ()=>{
  for(let i=0;i<frames.length;i++){
    dl(await frameBlob(i), `${docNameVal()}_${String(i+1).padStart(3,"0")}.png`);
    await new Promise(r=> setTimeout(r, 220));   // 連続ダウンロードのブロック回避
  }
};
/* webm: 再生しながら captureStream を録る */
let recorder = null;
document.getElementById("btnRec").onclick = ()=>{
  const btn = document.getElementById("btnRec");
  if(recorder){ recorder.stop(); return; }
  const off = newLayerCanvas();
  const octx = off.getContext("2d"); octx.imageSmoothingEnabled = false;
  const stream = off.captureStream(fps());
  const chunks = [];
  recorder = new MediaRecorder(stream, {mimeType:"video/webm"});
  recorder.ondataavailable = e=> e.data.size && chunks.push(e.data);
  recorder.onstop = ()=>{
    clearInterval(iv);
    dl(new Blob(chunks,{type:"video/webm"}), docNameVal()+".webm");
    recorder = null; btn.textContent = "🎬 webm"; btn.classList.remove("primary");
  };
  let i = 0;
  const iv = setInterval(()=>{
    compose(octx, frames[i % frames.length], true);
    i++;
    if(i >= frames.length*3) recorder.stop();     // 3ループ分録る
  }, 1000/fps());
  recorder.start();
  btn.textContent = "⏹ 停止"; btn.classList.add("primary");
};

/* =========================================================
   9. ショートカット・メインループ
   ========================================================= */
addEventListener("keydown", e=>{
  if(e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const c = e.ctrlKey || e.metaKey;
  if(c && e.key.toLowerCase() === "z"){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if(c && e.key.toLowerCase() === "y"){ e.preventDefault(); redo(); }
  else if(c && e.key.toLowerCase() === "s"){ e.preventDefault(); document.getElementById("btnSave").click(); }
  else if(e.key === "ArrowLeft") gotoFrame(cur-1);
  else if(e.key === "ArrowRight") gotoFrame(cur+1);
  else if(e.key === " "){ e.preventDefault(); document.getElementById("pPlay").click(); }
  else {
    const map = {p:"pen",b:"brush",e:"eraser",g:"fill",u:"shape",t:"text",i:"pick",v:"move",h:"hand"};
    const t2 = map[e.key.toLowerCase()];
    if(t2) document.querySelector(`[data-tool="${t2}"]`).click();
  }
});
document.getElementById("btnUndoTop").onclick = undo;
document.getElementById("btnRedoTop").onclick = redo;
document.getElementById("zIn").onclick = ()=>{ zoom = Math.min(16, zoom+1); applySize(); };
document.getElementById("zOut").onclick = ()=>{ zoom = Math.max(1, zoom-1); applySize(); };
document.getElementById("zFit").onclick = ()=> fitZoom();
addEventListener("resize", ()=> applySize());

let last = performance.now();
function loopFn(now){
  const dt = Math.min(1/30, (now-last)/1000); last = now;
  // リグ（パーツ＋ボーン）
  if(parts.length){
    stepRig(now, dt);
    actx.clearRect(0,0,W,H);
    if(avShow) blitRig(actx, avAlpha);
  }
  // 再生
  if(playing && frames.length > 1){
    playT += dt;
    if(playT >= 1/fps()){
      playT = 0;
      playI++;
      if(playI >= frames.length){
        if(loop) playI = 0;
        else { playI = frames.length-1; playing = false; document.getElementById("pPlay").textContent = "▶"; }
      }
      gotoFrame(playI);
    }
  }
  // プレビュー(常時ループ再生)
  prevT += dt;
  if(prevT >= 1/fps()){
    prevT = 0;
    prevI = (prevI+1) % frames.length;
    compose(pctx, frames[prevI], true);
    if(parts.length && avShow) blitRig(pctx, avAlpha);
  }
  requestAnimationFrame(loopFn);
}
let prevT = 0, prevI = 0;

/* 起動 */
initDoc(320,240);
document.getElementById("docName").value =
  "新規デザイン " + new Date().toISOString().slice(0,16).replace(/[-T:]/g,"").replace(/(\d{8})(\d{4})/,"$1-$2");
setColor("#20242a");
requestAnimationFrame(loopFn);
</script>
