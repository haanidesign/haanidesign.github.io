<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>画像まとめ｜HAANI LAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --main:#E1DD60; --main-soft:#F2F0BE; --cream:#FBFAEC; --paper:#FFFEF7; --ink:#1E1C14;
  --bd:2.5px solid var(--ink); --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:700;color:var(--ink);background:var(--cream);
  background-image:radial-gradient(circle, rgba(30,28,20,.13) 1.5px, transparent 1.6px);background-size:16px 16px}
header{position:sticky;top:0;z-index:30;background:var(--main);border-bottom:var(--bd);
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.5rem .8rem}
header h1{font-size:1rem;margin:0}
.btn{display:inline-flex;align-items:center;gap:.4rem;background:var(--paper);color:var(--ink);border:var(--bd);border-radius:var(--r);
  padding:.45rem .9rem;font:inherit;font-size:.78rem;box-shadow:0 3px 0 var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--main)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn-g{background:var(--ink);color:var(--main)}
.btn-sm{padding:.3rem .7rem;font-size:.7rem;box-shadow:0 2.5px 0 var(--ink);border-width:2px}
.bar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding:.5rem .8rem;border-bottom:var(--bd);background:var(--cream)}
.grp{display:flex;align-items:center;gap:.35rem;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:.25rem .5rem}
.grp label{font-size:.66rem}
.grp output{font-size:.66rem;min-width:2em;text-align:center}
input[type=range]{width:80px}
select,input[type=number]{font:inherit;font-size:.7rem;border:2px solid var(--ink);border-radius:8px;background:var(--paper);padding:.15rem .3rem}
input[type=number]{width:5.2em}
main{padding:1rem;display:flex;justify-content:center}
#stage{position:relative;max-width:100%}
#cv{display:block;max-width:100%;max-height:calc(100vh - 170px);border:var(--bd);background:#fff;box-shadow:0 4px 0 var(--ink);touch-action:none}
#drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.85rem;
  line-height:1.8;pointer-events:none;color:#5c5843}
body.over #cv{outline:4px dashed var(--ink);outline-offset:4px}
[hidden]{display:none!important}
#info{font-size:.66rem;font-weight:400}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../skin/soft.css?v=11">
<script type="module" src="../skin/icons.js?v=7"></script>
</head>
<body>
<header>
  <h1>画像まとめ</h1>
  <span style="flex:1"></span>
  <button class="btn btn-sm" id="bAdd">🖼 画像を足す</button>
  <button class="btn btn-sm" id="bShuffle">🔄 並びを変える</button>
  <button class="btn btn-sm" id="bClear">🗑 ぜんぶ消す</button>
  <button class="btn btn-sm btn-g" id="bPng">⬇ PNG</button>
  <button class="btn btn-sm btn-g" id="bJpg">⬇ JPG</button>
  <input type="file" id="fIn" accept="image/*" multiple hidden>
</header>
<div class="bar">
  <div class="grp"><label>大きさ</label>
    <select id="size">
      <option value="2480x3508">A4 縦</option>
      <option value="3508x2480">A4 横</option>
      <option value="1748x2480">A5 縦</option>
      <option value="2894x4093">B5 縦</option>
      <option value="2048x2048" selected>正方形</option>
      <option value="1920x1080">16:9 横</option>
      <option value="1080x1920">9:16 縦</option>
      <option value="1080x1350">4:5 縦</option>
      <option value="1500x500">X ヘッダー</option>
      <option value="custom">自分で決める</option>
    </select>
  </div>
  <div class="grp" id="gCustom" hidden><input type="number" id="cw" value="2000" min="100" max="10000"> × <input type="number" id="ch" value="1500" min="100" max="10000"> px</div>
  <div class="grp"><label>すき間</label><input type="range" id="gap" min="0" max="60" value="8"><output id="oGap">8</output></div>
  <div class="grp"><label>ふち</label><input type="range" id="pad" min="0" max="120" value="0"><output id="oPad">0</output></div>
  <div class="grp"><label>地の色</label><input type="color" id="bg" value="#ffffff"></div>
  <div class="grp"><label>並び</label>
    <select id="order"><option value="best">おまかせ（切れが少ない順）</option><option value="keep">入れた順</option></select>
  </div>
  <span id="info"></span>
</div>
<main>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="drop">ここに画像を落とすか<br>「画像を足す」から選ぶ<br>（貼り付けでも入る）</div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let imgs = [];      // {img, a(横/縦)}
let order = [];     // imgs の並び
let layout = [];    // {i,x,y,w,h}
let dragFrom = -1;

function getSize(){
  const v = $('size').value;
  if (v === 'custom') return [Math.max(100, +$('cw').value||100), Math.max(100, +$('ch').value||100)];
  return v.split('x').map(Number);
}

// 並びを 段に 分ける。段の 高さ が 横幅に ぴったり 合う ように し、
// 段数は 全体の 高さが 枠に 一番 近く なる ものを えらぶ。
function partition(as, k){
  // as を 順番のまま k 段に 分けて、各段の 横長さの 和を そろえる（線形分割）
  const n = as.length, pre=[0];
  for (const a of as) pre.push(pre[pre.length-1]+a);
  const INF=1e18, dp=[...Array(k+1)].map(()=>new Array(n+1).fill(INF)), cut=[...Array(k+1)].map(()=>new Array(n+1).fill(0));
  dp[0][0]=0;
  for (let j=1;j<=k;j++) for (let i=j;i<=n;i++) for (let p=j-1;p<i;p++){
    const s=pre[i]-pre[p], c=dp[j-1][p]+s*s;
    if (c<dp[j][i]){dp[j][i]=c;cut[j][i]=p;}
  }
  const rows=[]; let i=n;
  for (let j=k;j>0;j--){const p=cut[j][i]; rows.unshift([p,i]); i=p;}
  return rows;
}

function plan(seq, W, H, gap){
  // seq: imgs の 番号の 並び。返り値: {rows, score}
  const as = seq.map(i=>imgs[i].a), n=as.length;
  let best=null;
  for (let k=1;k<=n;k++){
    const rows = partition(as,k);
    // 各段の 自然な 高さ
    const hs = rows.map(([s,e])=>{
      let sum=0; for(let t=s;t<e;t++) sum+=as[t];
      return (W - gap*(e-s-1))/sum;
    });
    const total = hs.reduce((a,b)=>a+b,0), avail = H - gap*(k-1);
    if (avail<=0) break;
    const stretch = avail/total;            // 1 に 近いほど 切れない
    const score = Math.abs(Math.log(stretch));
    if (!best || score<best.score) best={rows,hs,stretch,score};
    if (total > avail*3) break;
  }
  return best;
}

function build(){
  const [W,H] = getSize();
  const gap = +$('gap').value, pad = +$('pad').value;
  cv.width=W; cv.height=H;
  layout=[];
  if (imgs.length){
    const iw=W-pad*2, ih=H-pad*2;
    const p = plan(order, iw, ih, gap);
    let y=pad;
    p.rows.forEach(([s,e],r)=>{
      const h = p.hs[r]*p.stretch;
      // 段の 中の 横幅は 比率どおり、最後の 1枚で 端を そろえる
      let x=pad;
      for (let t=s;t<e;t++){
        const i=order[t];
        let w = t===e-1 ? (pad+iw - x) : imgs[i].a*p.hs[r];
        layout.push({i,t,x:Math.round(x),y:Math.round(y),w:Math.round(x+w)-Math.round(x),h:Math.round(y+h)-Math.round(y)});
        x+=w+gap;
      }
      y+=h+gap;
    });
    const cut = Math.round(Math.abs(1-p.stretch)*100);
    $('info').textContent = `${imgs.length}枚 / ${p.rows.length}段 / ${W}×${H}px / はみ出して切れる分 約${cut}%`;
  } else $('info').textContent = `${W}×${H}px`;
  draw();
}

function draw(){
  ctx.fillStyle=$('bg').value; ctx.fillRect(0,0,cv.width,cv.height);
  for (const L of layout){
    const im=imgs[L.i].img, a=imgs[L.i].a, ba=L.w/L.h;
    // はみ出す 分は まんなかで 切る
    let sw=im.naturalWidth, sh=im.naturalHeight, sx=0, sy=0;
    if (a>ba){ sw=sh*ba; sx=(im.naturalWidth-sw)/2; } else { sh=sw/ba; sy=(im.naturalHeight-sh)/2; }
    ctx.drawImage(im,sx,sy,sw,sh,L.x,L.y,L.w,L.h);
  }
  $('drop').style.display = imgs.length?'none':'flex';
}

function arrange(){
  const n=imgs.length;
  order=[...Array(n).keys()];
  if ($('order').value==='best' && n>2){
    const [W,H]=getSize(), gap=+$('gap').value, pad=+$('pad').value;
    let best=plan(order,W-pad*2,H-pad*2,gap).score, bestO=order.slice();
    const tries = n>60?40:n>25?120:300;
    for (let k=0;k<tries;k++){
      const o=bestO.slice();
      if (k%3===0) o.sort(()=>Math.random()-.5);
      else { const a=Math.random()*n|0,b=Math.random()*n|0; [o[a],o[b]]=[o[b],o[a]]; }
      const s=plan(o,W-pad*2,H-pad*2,gap).score;
      if (s<best){best=s;bestO=o;}
    }
    order=bestO;
  }
  build();
}

function addFiles(files){
  const list=[...files].filter(f=>f.type.startsWith('image/'));
  if (!list.length) return;
  let left=list.length;
  list.forEach(f=>{
    const img=new Image();
    img.onload=()=>{ imgs.push({img,a:img.naturalWidth/img.naturalHeight}); if(--left===0) arrange(); };
    img.onerror=()=>{ if(--left===0) arrange(); };
    img.src=URL.createObjectURL(f);
  });
}

// 並びかえ: 絵を つかんで 別の 絵に 落とすと 入れかわる
function hit(e){
  const r=cv.getBoundingClientRect(), x=(e.clientX-r.left)*cv.width/r.width, y=(e.clientY-r.top)*cv.height/r.height;
  return layout.find(L=>x>=L.x&&x<L.x+L.w&&y>=L.y&&y<L.y+L.h);
}
cv.addEventListener('pointerdown',e=>{const L=hit(e); dragFrom=L?L.t:-1;});
cv.addEventListener('pointerup',e=>{
  const L=hit(e);
  if (dragFrom>=0 && L && L.t!==dragFrom){ [order[dragFrom],order[L.t]]=[order[L.t],order[dragFrom]]; build(); }
  dragFrom=-1;
});
cv.addEventListener('dblclick',e=>{
  const L=hit(e); if(!L) return;
  if (!confirm('この画像を外す？')) return;
  const i=L.i; imgs.splice(i,1); order=order.filter(v=>v!==i).map(v=>v>i?v-1:v); build();
});

$('bAdd').onclick=()=>$('fIn').click();
$('fIn').onchange=e=>{addFiles(e.target.files); e.target.value='';};
$('bShuffle').onclick=()=>{ if($('order').value==='keep'){order.sort(()=>Math.random()-.5);build();} else arrange(); };
$('bClear').onclick=()=>{ if(imgs.length&&confirm('ぜんぶ消す？')){imgs=[];order=[];build();} };
$('size').onchange=()=>{ $('gCustom').hidden=$('size').value!=='custom'; arrange(); };
$('cw').onchange=$('ch').onchange=arrange;
$('order').onchange=arrange;
$('gap').oninput=()=>{$('oGap').textContent=$('gap').value; build();};
$('pad').oninput=()=>{$('oPad').textContent=$('pad').value; build();};
$('bg').oninput=draw;
function save(type,ext){
  cv.toBlob(b=>{const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='matome.'+ext; a.click();},type,.92);
}
$('bPng').onclick=()=>save('image/png','png');
$('bJpg').onclick=()=>save('image/jpeg','jpg');
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('over');});
addEventListener('dragleave',()=>document.body.classList.remove('over'));
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('over');addFiles(e.dataTransfer.files);});
addEventListener('paste',e=>addFiles([...e.clipboardData.items].map(i=>i.getAsFile()).filter(Boolean)));
build();
</script>
</body>
</html>
