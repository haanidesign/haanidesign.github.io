<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PSD パーツアニメ</title>
<style>
  :root { color-scheme: light dark; --bg:#12141a; --fg:#e8ebf2; --panel:#1b1f28; --line:#2c323f; --accent:#6ea8ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.5 "Segoe UI","Yu Gothic UI",sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0 12px 0 0; font-weight:600; }
  main { display:flex; gap:16px; padding:16px; align-items:flex-start; flex-wrap:wrap; }
  #stage { background:linear-gradient(160deg,#2a3350,#432f4a); border:1px solid var(--line); border-radius:8px; }
  #side { flex:1; min-width:420px; }
  table { width:100%; border-collapse:collapse; }
  th,td { padding:4px 6px; border-bottom:1px solid var(--line); text-align:left; font-size:12px; }
  th { color:#9aa4b8; font-weight:600; }
  select,input[type=number] { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:2px 4px; font:inherit; }
  input[type=number] { width:72px; }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#0b1020; border-color:var(--accent); font-weight:600; }
  #log { white-space:pre-wrap; font:11px ui-monospace,monospace; color:#9aa4b8; padding:8px 16px; max-height:150px; overflow:auto; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  label { color:#9aa4b8; }
  .drop { border:2px dashed var(--line); border-radius:8px; padding:14px; text-align:center; color:#9aa4b8; margin-bottom:12px; }
  .drop.on { border-color:var(--accent); color:var(--fg); }
</style>
</head>
<body>
<header>
  <h1>PSD パーツアニメ</h1>
  <button id="play" class="primary">再生 / 停止</button>
  <label>秒 <input type="number" id="dur" value="3" min="1" max="10" step="0.5"></label>
  <label>fps <input type="number" id="fps" value="30" min="10" max="60" step="1"></label>
  <button id="loadJson">割り当てJSONを読む</button>
  <button id="saveJson">割り当てJSONを保存</button>
  <button id="rec">WebMを書き出す</button>
</header>

<main>
  <canvas id="stage" width="512" height="768"></canvas>
  <div id="side">
    <div class="drop" id="drop">
      PSD か、レイヤー名を付けた PNG 複数枚を、ここにドロップ<br>
      <small>PNG のファイル名がそのままレイヤー名になります（例 <code>40_目_開.png</code>）</small>
    </div>
    <div class="row">
      <label>親レイヤー(root)</label><select id="root"></select>
    </div>
    <div class="row">
      <label>まばたき間隔</label><input type="number" id="bi" value="1.5" step="0.1" min="0.3">
      <label>閉じ時間</label><input type="number" id="bc" value="0.1" step="0.02" min="0.02">
      <label><input type="checkbox" id="mo"> 口パク</label>
    </div>
    <table id="tbl"><thead><tr><th>レイヤー</th><th>ロール</th><th>振幅</th><th>周期</th><th>位相</th></tr></thead><tbody></tbody></table>
  </div>
</main>
<div id="log"></div>

<script>
const ROLES = ["root","breath","hair_sway","chest_sway","follow","blink_open","blink_close","mouth_open","mouth_close","static","ignore"];
const GUESS = [["後髪","hair_sway"],["前髪","hair_sway"],["横髪","hair_sway"],["胸","chest_sway"],["体","root"],
               ["目_開","blink_open"],["目_閉","blink_close"],["口_閉","mouth_close"],["口_開","mouth_open"],
               ["顔","follow"],["眉","follow"]];
const DEFAULTS = { breath:{amp:0.014,cycles:2,phase:0}, chest_sway:{amp:0.02,cycles:2,phase:0.25},
                   hair_sway:{amp:10,cycles:1,phase:0} };

const log = m => { const el=document.getElementById("log"); el.textContent += m+"\n"; el.scrollTop=el.scrollHeight; };

let layers = [];      // {name, canvas, box}
let spec = {};        // name -> {role, params}
let canvasSize = [1024,1536];
let playing = true, t0 = performance.now();

// ---------------------------------------------------------------- PSD reading
// Handles the flat 8-bit RGBA PSDs this pipeline writes: RAW or RLE channels,
// one level of groups, Unicode ('luni') layer names.
function readPSD(buf) {
  const dv = new DataView(buf); let p = 0;
  const u8=()=>dv.getUint8(p++), u16=()=>{const v=dv.getUint16(p);p+=2;return v;},
        u32=()=>{const v=dv.getUint32(p);p+=4;return v;}, i16=()=>{const v=dv.getInt16(p);p+=2;return v;},
        i32=()=>{const v=dv.getInt32(p);p+=4;return v;};
  if (String.fromCharCode(u8(),u8(),u8(),u8()) !== "8BPS") throw new Error("PSD ではありません");
  const version = u16(); p += 6;
  const channels = u16(), height = u32(), width = u32(), depth = u16(), mode = u16();
  if (depth !== 8) throw new Error("8bit/channel の PSD のみ対応しています");
  // Read every length into a variable before using it. Both `p += u32()` and
  // `p + u32()` read p before u32() advances it, so the reader silently lands
  // 4 bytes short of where it should.
  const cmLen = u32(); p += cmLen;               // color mode data
  const irLen = u32(); p += irLen;               // image resources
  const lmLen = u32(); const lmEnd = p + lmLen;  // layer and mask info
  let liLen = version === 2 ? (()=>{const hi=u32();return hi*4294967296+u32();})() : u32();
  const liEnd = p + liLen;
  let count = i16(); if (count < 0) count = -count;

  const recs = [];
  for (let i = 0; i < count; i++) {
    const top=i32(), left=i32(), bottom=i32(), right=i32();
    const nch = u16(), chans = [];
    for (let c = 0; c < nch; c++) {
      const id = i16();
      const len = version === 2 ? (()=>{const hi=u32();return hi*4294967296+u32();})() : u32();
      chans.push({id, len});
    }
    p += 4;                                  // blend signature
    const blend = String.fromCharCode(u8(),u8(),u8(),u8());
    const opacity = u8(); u8(); const flags = u8(); u8();
    const extraLen = u32(); const extraEnd = p + extraLen;
    const maskLen = u32(); p += maskLen;
    const blendRangeLen = u32(); p += blendRangeLen;
    const nameLen = u8(); let name = "";
    for (let k = 0; k < nameLen; k++) name += String.fromCharCode(u8());
    p += (4 - ((nameLen + 1) % 4)) % 4;
    while (p + 12 <= extraEnd) {             // tagged blocks: pick up 'luni'
      const sig = String.fromCharCode(u8(),u8(),u8(),u8());
      const key = String.fromCharCode(u8(),u8(),u8(),u8());
      if (sig !== "8BIM" && sig !== "8B64") { p = extraEnd; break; }
      const len = u32(), next = p + len + (len % 2);
      if (key === "luni") {
        const n = u32(); let s = "";
        for (let k = 0; k < n; k++) s += String.fromCharCode(u16());
        name = s;
      }
      p = next;
    }
    p = extraEnd;
    recs.push({top,left,bottom,right,chans,name,opacity,hidden:!!(flags & 2)});
  }

  for (const r of recs) {
    const w = r.right - r.left, h = r.bottom - r.top;
    const planes = {};
    for (const c of r.chans) {
      const end = p + c.len;
      if (w <= 0 || h <= 0) { p = end; continue; }
      const comp = u16();
      let out = new Uint8Array(w * h);
      if (comp === 0) { for (let k = 0; k < w*h; k++) out[k] = u8(); }
      else if (comp === 1) {
        const counts = []; for (let y = 0; y < h; y++) counts.push(version === 2 ? u32() : u16());
        let o = 0;
        for (let y = 0; y < h; y++) {
          const lineEnd = p + counts[y];
          while (p < lineEnd) {
            const n = dv.getInt8(p++);
            if (n >= 0) { for (let k = 0; k <= n; k++) out[o++] = u8(); }
            else if (n > -128) { const v = u8(); for (let k = 0; k < 1-n; k++) out[o++] = v; }
          }
          p = lineEnd;
        }
      } else { p = end; continue; }
      planes[c.id] = out;
      p = end;
    }
    r.w = w; r.h = h; r.planes = planes;
  }
  p = lmEnd;

  const out = [];
  for (const r of recs) {
    if (!r.w || !r.h) continue;
    if (r.name === "</Layer group>" || r.name === "</Layer set>") continue;
    const cv = document.createElement("canvas");
    cv.width = width; cv.height = height;
    const ctx = cv.getContext("2d");
    const img = ctx.createImageData(r.w, r.h);
    const R = r.planes[0], G = r.planes[1], B = r.planes[2], A = r.planes[-1];
    if (!R) continue;
    for (let k = 0; k < r.w * r.h; k++) {
      img.data[k*4]   = R[k];
      img.data[k*4+1] = G ? G[k] : R[k];
      img.data[k*4+2] = B ? B[k] : R[k];
      img.data[k*4+3] = A ? A[k] : 255;
    }
    const tmp = document.createElement("canvas");
    tmp.width = r.w; tmp.height = r.h;
    tmp.getContext("2d").putImageData(img, 0, 0);
    ctx.drawImage(tmp, r.left, r.top);
    out.push({ name: r.name, canvas: cv });
  }
  return { layers: out, size: [width, height] };
}

// ------------------------------------------------------------------ geometry
function contentBox(cv) {
  const d = cv.getContext("2d").getImageData(0,0,cv.width,cv.height).data;
  let x0=cv.width, y0=cv.height, x1=-1, y1=-1;
  for (let y = 0; y < cv.height; y++) for (let x = 0; x < cv.width; x++) {
    if (d[(y*cv.width+x)*4+3] > 8) { if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  }
  return x1 < 0 ? null : [x0,y0,x1,y1];
}

// Matrices are [a,b,c,d,e,f] in canvas setTransform order.
const I = [1,0,0,1,0,0];
function mul(m, n) {  // apply n, then m
  return [ m[0]*n[0]+m[2]*n[1], m[1]*n[0]+m[3]*n[1],
           m[0]*n[2]+m[2]*n[3], m[1]*n[2]+m[3]*n[3],
           m[0]*n[4]+m[2]*n[5]+m[4], m[1]*n[4]+m[3]*n[5]+m[5] ];
}
const translate = (x,y) => [1,0,0,1,x,y];
const scaleAt = (sx,sy,cx,cy) => mul(translate(cx,cy), mul([sx,0,0,sy,0,0], translate(-cx,-cy)));
const shearAt = (k,cy) => mul(translate(0,cy), mul([1,0,k,1,0,0], translate(0,-cy)));

function layerMatrix(role, prm, t, dur, box) {
  if (!box || role === "follow" || role === "static") return I;
  const [x0,y0,x1,y1] = box, cx = (x0+x1)/2;
  if (role === "breath" || role === "chest_sway") {
    const n = Math.max(1, Math.round(prm.cycles ?? 2));
    const s = 1 + (prm.amp ?? 0.014) * Math.sin(2*Math.PI*(n*t/dur + (prm.phase ?? 0)));
    return scaleAt(1, s, cx, y1);   // hinge at the bottom edge
  }
  if (role === "hair_sway") {
    const n = Math.max(1, Math.round(prm.cycles ?? 1));
    const k = ((prm.amp ?? 10) / Math.max(y1-y0,1)) * Math.sin(2*Math.PI*(n*t/dur + (prm.phase ?? 0)));
    return shearAt(k, y0);          // hinge at the roots
  }
  return I;
}

const blinkClosed = (t,dur,iv,cl) => { const n=Math.max(1,Math.round(dur/iv)); return (t % (dur/n)) < cl; };

// -------------------------------------------------------------------- render
const stage = document.getElementById("stage");
function draw(t) {
  const dur = +document.getElementById("dur").value;
  const ctx = stage.getContext("2d");
  const k = stage.width / canvasSize[0];
  ctx.clearRect(0,0,stage.width,stage.height);
  const closed = blinkClosed(t, dur, +document.getElementById("bi").value, +document.getElementById("bc").value);
  const mouthOn = document.getElementById("mo").checked && ((t % 0.3) < 0.15);
  const root = document.getElementById("root").value;
  const rootLayer = layers.find(l => l.name === root);
  const rootM = rootLayer ? layerMatrix("breath", (spec[root]||{}).params||DEFAULTS.breath, t, dur, rootLayer.box) : I;

  for (const L of layers) {
    const s = spec[L.name] || {role:"static", params:{}};
    if (s.role === "ignore") continue;
    if (s.role === "blink_open"  &&  closed) continue;
    if (s.role === "blink_close" && !closed) continue;
    if (s.role === "mouth_open"  && !mouthOn) continue;
    if (s.role === "mouth_close" &&  mouthOn) continue;
    const own = layerMatrix(L.name === root ? "breath" : s.role, s.params||{}, t, dur, L.box);
    const m = L.name === root ? own : mul(rootM, own);
    ctx.save();
    ctx.setTransform(k,0,0,k,0,0);
    ctx.transform(m[0],m[1],m[2],m[3],m[4],m[5]);
    ctx.drawImage(L.canvas, 0, 0);
    ctx.restore();
  }
}
function tick() {
  const dur = +document.getElementById("dur").value;
  if (playing) draw(((performance.now()-t0)/1000) % dur);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ----------------------------------------------------------------------- UI
function guessRole(name) {
  for (const [frag, r] of GUESS) if (name.includes(frag)) return r;
  return "static";
}
function rebuildTable() {
  const tb = document.querySelector("#tbl tbody"); tb.innerHTML = "";
  const rootSel = document.getElementById("root"); rootSel.innerHTML = "";
  let phase = 0;
  for (const L of layers) {
    if (!spec[L.name]) {
      const role = guessRole(L.name);
      const prm = Object.assign({}, DEFAULTS[role] || {});
      if (role === "hair_sway") { prm.phase = +phase.toFixed(2); phase += 0.18;
        prm.amp = L.name.includes("横髪") ? 16 : (L.name.includes("後髪") ? 12 : 7); }
      spec[L.name] = { role, params: prm };
    }
    const s = spec[L.name];
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${L.name}</td><td></td><td></td><td></td><td></td>`;
    const sel = document.createElement("select");
    for (const r of ROLES) { const o = document.createElement("option"); o.value=o.textContent=r; sel.appendChild(o); }
    sel.value = s.role;
    sel.onchange = () => { s.role = sel.value; if (!Object.keys(s.params).length) s.params = Object.assign({}, DEFAULTS[s.role]||{}); };
    tr.children[1].appendChild(sel);
    ["amp","cycles","phase"].forEach((key, i) => {
      const inp = document.createElement("input");
      inp.type = "number"; inp.step = key === "amp" ? 0.002 : (key === "phase" ? 0.05 : 1);
      inp.value = s.params[key] ?? "";
      inp.oninput = () => { s.params[key] = +inp.value; };
      tr.children[2+i].appendChild(inp);
    });
    tb.appendChild(tr);
    const o = document.createElement("option"); o.value = o.textContent = L.name; rootSel.appendChild(o);
  }
  const r = layers.find(l => (spec[l.name]||{}).role === "root");
  if (r) rootSel.value = r.name;
}

async function addFiles(files) {
  layers = []; spec = {};
  for (const f of files) {
    if (/\.psd$/i.test(f.name)) {
      try {
        const { layers: ls, size } = readPSD(await f.arrayBuffer());
        canvasSize = size;
        for (const l of ls) layers.push({ name: l.name, canvas: l.canvas });
        log(`PSD 読み込み: ${f.name} → ${ls.length} レイヤー ${size[0]}x${size[1]}`);
      } catch (e) {
        log(`PSD 読み込み失敗 (${f.name}): ${e.message}\n→ PNG 複数枚のドロップで代用できます`);
      }
    } else if (/\.png$/i.test(f.name)) {
      const img = new Image();
      await new Promise(res => { img.onload = res; img.src = URL.createObjectURL(f); });
      canvasSize = [img.width, img.height];
      const cv = document.createElement("canvas");
      cv.width = img.width; cv.height = img.height;
      cv.getContext("2d").drawImage(img, 0, 0);
      layers.push({ name: f.name.replace(/\.png$/i, ""), canvas: cv });
    }
  }
  layers.sort((a,b) => a.name.localeCompare(b.name, "ja"));
  for (const L of layers) L.box = contentBox(L.canvas);
  stage.width = 512; stage.height = Math.round(512 * canvasSize[1] / canvasSize[0]);
  rebuildTable();
  log(`合計 ${layers.length} レイヤー`);
}

const drop = document.getElementById("drop");
["dragenter","dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("on"); }));
["dragleave","drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("on"); }));
drop.addEventListener("drop", ev => addFiles([...ev.dataTransfer.files]));
drop.addEventListener("click", () => {
  const i = document.createElement("input");
  i.type = "file"; i.multiple = true; i.accept = ".psd,.png";
  i.onchange = () => addFiles([...i.files]);
  i.click();
});

document.getElementById("play").onclick = () => { playing = !playing; if (playing) t0 = performance.now(); };

document.getElementById("saveJson").onclick = () => {
  const data = {
    version: 1, canvas: canvasSize,
    fps: +document.getElementById("fps").value,
    duration: +document.getElementById("dur").value,
    root: document.getElementById("root").value,
    layers: spec,
    blink: { interval: +document.getElementById("bi").value, close: +document.getElementById("bc").value },
    mouth: { enabled: document.getElementById("mo").checked, interval: 0.3, open: 0.15 }
  };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type:"application/json"}));
  a.download = "assign_template.json"; a.click();
};

document.getElementById("loadJson").onclick = () => {
  const i = document.createElement("input");
  i.type = "file"; i.accept = ".json";
  i.onchange = async () => {
    const d = JSON.parse(await i.files[0].text());
    spec = d.layers || {};
    document.getElementById("dur").value = d.duration ?? 3;
    document.getElementById("fps").value = d.fps ?? 30;
    if (d.blink) { document.getElementById("bi").value = d.blink.interval; document.getElementById("bc").value = d.blink.close; }
    if (d.mouth) document.getElementById("mo").checked = !!d.mouth.enabled;
    rebuildTable();
    if (d.root) document.getElementById("root").value = d.root;
    const miss = layers.filter(l => !spec[l.name]).map(l => l.name);
    log(miss.length ? `JSON 適用（未定義: ${miss.join(", ")}）` : "JSON 適用（全レイヤー一致）");
  };
  i.click();
};

document.getElementById("rec").onclick = async () => {
  const dur = +document.getElementById("dur").value, fps = +document.getElementById("fps").value;
  const stream = stage.captureStream(fps);
  const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm";
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6e6 });
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(chunks, {type:"video/webm"}));
    a.download = "loop.webm"; a.click();
    log("WebM を書き出しました（透過が必要な場合は parts_anime.py の --out *.webm を使ってください）");
  };
  playing = false; t0 = performance.now(); rec.start();
  const started = performance.now();
  const step = () => {
    const e = (performance.now() - started) / 1000;
    if (e >= dur) { rec.stop(); playing = true; t0 = performance.now(); return; }
    draw(e % dur);                       // drive frames explicitly so the loop is exact
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
};

log("PSD か PNG をドロップしてください。");
</script>
</body>
</html>
