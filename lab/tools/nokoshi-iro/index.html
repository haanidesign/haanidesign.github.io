<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#E1DD60">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>のこし色 — えらんだ色だけ のこす</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --main:#E1DD60; --main-deep:#B8B43F; --main-soft:#F2F0BE;
  --cream:#FBFAEC; --paper:#FFFEF7; --ink:#1E1C14; --gray:#8A8470; --pink:#F2A0B8;
  --bd:2.5px solid var(--ink); --r:12px; --tap:44px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic UI',sans-serif;
  font-weight:700; overflow:hidden; user-select:none; -webkit-user-select:none;
}
.dotbg{
  background-color:var(--cream);
  background-image:radial-gradient(circle,rgba(30,28,20,.13) 1.5px,transparent 1.6px);
  background-size:16px 16px;
}
.ic{width:20px; height:20px; flex:none; display:block;}
.dot{font-family:'DotGothic16',monospace; font-weight:400;}
.screen{position:fixed; inset:0; display:flex; flex-direction:column;}
.screen.hide{display:none;}

.bar{
  display:flex; align-items:center; gap:.35rem; flex:none;
  background:var(--main); border-bottom:var(--bd); padding:.35rem .5rem;
  padding-top:calc(.35rem + env(safe-area-inset-top));
}
.bar h1{margin:0; font-size:.9rem; white-space:nowrap;}
.bar .grow{flex:1; min-width:0;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.3rem;
  min-height:var(--tap); background:var(--paper); color:var(--ink);
  border:var(--bd); border-radius:var(--r); padding:.35rem .65rem;
  font:inherit; font-size:.76rem; box-shadow:0 3px 0 var(--ink); cursor:pointer;
  white-space:nowrap; transition:transform .08s, box-shadow .08s, background .15s;
}
.btn:active{transform:translateY(3px); box-shadow:0 0 0 var(--ink);}
.btn-y{background:var(--main);}
.btn-g{background:var(--ink); color:var(--main);}
.btn-ic{width:var(--tap); padding:0;}
.btn:disabled{opacity:.4;}

/* 色の ふだ（上の まんなか） */
.swchip{
  display:flex; align-items:center; gap:.4rem; min-height:36px; max-width:100%;
  background:var(--paper); border:2px solid var(--ink); border-radius:100px;
  padding:.15rem .7rem .15rem .25rem; box-shadow:0 2.5px 0 var(--ink); cursor:pointer;
  font:inherit; color:var(--ink);
}
.swchip i{width:24px; height:24px; border-radius:50%; border:2px solid var(--ink); flex:none;
  background:repeating-linear-gradient(45deg,#ccc 0 4px,#fff 4px 8px);}
.swchip span{font-size:.8rem;}

/* ---------- はじめの 画面 ---------- */
#home{align-items:center; justify-content:center; padding:1rem;}
#home .card{
  width:min(100%,24rem); background:var(--paper); border:var(--bd); border-radius:18px;
  box-shadow:0 4px 0 var(--ink); padding:1.2rem 1.1rem 1.1rem; text-align:center;
}
#home .logo{
  width:96px; height:96px; margin:0 auto .7rem; border:var(--bd); border-radius:24px;
  box-shadow:0 3px 0 var(--ink); overflow:hidden;
}
#home h1{margin:0 0 .15rem; font-size:1.35rem;}
#home p{margin:0 0 1rem; font-size:.72rem; font-weight:400; color:#5c5843; line-height:1.8;}
#home .btn{width:100%; margin-top:.55rem; min-height:52px; font-size:.86rem;}
#home .back{position:absolute; left:.6rem; top:calc(.6rem + env(safe-area-inset-top));
  font-size:.66rem; color:var(--ink); text-decoration:none; background:var(--paper);
  border:2px solid var(--ink); border-radius:100px; padding:.2rem .7rem; box-shadow:0 2px 0 var(--ink);}
#drophint{font-size:.6rem; font-weight:400; color:var(--gray); margin-top:.7rem;}
body.drag #home .card{background:var(--main-soft);}

/* ---------- へんしゅう ---------- */
.stage{flex:1; position:relative; min-height:0; overflow:hidden; touch-action:none;}
#view{position:absolute; display:block; border:2px solid var(--ink); box-shadow:0 3px 0 var(--ink);
  background:#fff; image-rendering:auto;}
#ov{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
#loupe{
  position:absolute; width:92px; height:92px; border-radius:50%; border:3px solid var(--ink);
  box-shadow:0 3px 0 var(--ink); overflow:hidden; pointer-events:none; display:none; z-index:5;
  background:#fff;
}
#loupe canvas{width:100%; height:100%; display:block;}
#loupe::after{content:""; position:absolute; left:50%; top:50%; width:10px; height:10px;
  margin:-5px 0 0 -5px; border:2px solid #fff; outline:2px solid var(--ink); border-radius:50%;}
#loupe b{position:absolute; left:0; right:0; bottom:6px; text-align:center; font-size:.55rem;
  font-family:'DotGothic16',monospace; font-weight:400;}
#loupe b span{background:var(--paper); border:2px solid var(--ink); border-radius:100px; padding:0 .35rem;}
.tip{
  position:absolute; left:50%; top:.6rem; transform:translateX(-50%); z-index:4;
  background:rgba(30,28,20,.82); color:var(--paper); border-radius:12px;
  padding:.4rem .75rem; font-size:.62rem; font-weight:400; line-height:1.7; text-align:center;
  pointer-events:none; white-space:nowrap; transition:opacity .4s;
}
.tip.hide{opacity:0;}
#zoomtag{position:absolute; right:.5rem; bottom:.5rem; z-index:4; pointer-events:none;
  background:rgba(251,250,236,.92); border:2px solid var(--ink); border-radius:9px;
  padding:.02rem .35rem; font-size:.6rem;}

.dock{
  flex:none; background:var(--cream); border-top:var(--bd);
  padding:.45rem .55rem; padding-bottom:calc(.45rem + env(safe-area-inset-bottom));
}
.panel{background:var(--paper); border:2px solid var(--ink); border-radius:var(--r);
  box-shadow:0 2.5px 0 var(--ink); padding:.35rem .55rem .5rem; margin-bottom:.5rem;}
.phead{display:flex; align-items:center; gap:.35rem; font-size:.74rem; min-height:32px; cursor:pointer;}
.phead .grow{flex:1;}
.phead .chev{transition:transform .2s;}
.dock.fold .phead .chev{transform:rotate(180deg);}
.dock.fold .pbody{display:none;}
.pbody{display:flex; flex-direction:column; gap:.4rem; max-height:34vh; overflow-y:auto; padding-top:.15rem;}
.pbody.hide{display:none;}

.tabs{display:flex; gap:.4rem;}
.tabs button{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:.1rem;
  background:var(--paper); border:2px solid var(--ink); border-radius:var(--r);
  box-shadow:0 2.5px 0 var(--ink); font:inherit; font-size:.6rem; padding:.3rem 0 .25rem; cursor:pointer; color:var(--ink);
}
.tabs button.on{background:var(--main); box-shadow:0 0 0 var(--ink); transform:translateY(2.5px);}

.seg{display:flex; gap:.28rem;}
.seg button{
  flex:1; min-height:34px; background:var(--paper); border:2px solid var(--ink); color:var(--ink);
  border-radius:9px; font:inherit; font-size:.64rem; box-shadow:0 2.5px 0 var(--ink); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.05rem; padding:.15rem 0;
}
.seg button .ic{width:18px; height:18px;}
.seg button.on{background:var(--main); box-shadow:0 0 0 var(--ink); transform:translateY(2.5px);}
.seg.small button{min-height:30px; font-size:.6rem;}

.sl{display:flex; flex-direction:column; gap:0;}
.sl .lab{display:flex; justify-content:space-between; font-size:.6rem; font-weight:400; color:#5c5843;}
.sl .lab b{font-family:'DotGothic16',monospace; font-weight:400; color:var(--ink);}
input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:30px; background:transparent; margin:0;
}
input[type=range]::-webkit-slider-runnable-track{height:8px; background:var(--cream); border:2px solid var(--ink); border-radius:100px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:22px; height:22px; margin-top:-9px;
  background:var(--main); border:2.5px solid var(--ink); border-radius:50%; box-shadow:0 2px 0 var(--ink);}
input[type=range]::-moz-range-track{height:6px; background:var(--cream); border:2px solid var(--ink); border-radius:100px;}
input[type=range]::-moz-range-thumb{width:18px; height:18px; background:var(--main); border:2.5px solid var(--ink); border-radius:50%;}

.recent{display:flex; gap:.4rem; align-items:center; min-height:34px; overflow-x:auto; padding:.1rem 0 .2rem;}
.recent button{width:30px; height:30px; flex:none; border-radius:50%; border:2px solid var(--ink);
  box-shadow:0 2px 0 var(--ink); cursor:pointer; padding:0;}
.recent button.on{outline:3px solid var(--ink); outline-offset:2px;}
.recent .none{font-size:.6rem; font-weight:400; color:var(--gray);}
.rowb{display:flex; gap:.35rem; align-items:center;}
.rowb .btn{flex:1; min-height:36px; font-size:.64rem; box-shadow:0 2.5px 0 var(--ink); padding:.2rem .4rem;}
.hint{
  background:var(--main-soft); border:2px dashed var(--ink); border-radius:10px;
  padding:.3rem .45rem; font-size:.58rem; font-weight:400; color:#5c5843; line-height:1.65;
}

/* ---------- ライブ ---------- */
#live .stage{background:#1E1C14;}
#lv{position:absolute; display:block;}
#live .dock{display:flex; flex-direction:column; gap:.45rem;}
.shootrow{display:flex; align-items:center; justify-content:space-around;}
#bShoot{
  width:70px; height:70px; border-radius:50%; background:var(--paper); border:3px solid var(--ink);
  box-shadow:0 4px 0 var(--ink); cursor:pointer; position:relative;
}
#bShoot::after{content:""; position:absolute; inset:7px; border-radius:50%; background:var(--main); border:2.5px solid var(--ink);}
#bShoot:active{transform:translateY(4px); box-shadow:0 0 0 var(--ink);}
#flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .3s; z-index:6;}
#camerr{position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:1.2rem; z-index:7;}
#camerr div{background:var(--paper); border:var(--bd); border-radius:var(--r); padding:1rem; font-size:.72rem; font-weight:400; line-height:1.8; max-width:22rem;}

/* ---------- 書き出し ---------- */
#exp{z-index:10;}
#exp .pv{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:.8rem;}
#ec{max-width:100%; max-height:100%; display:block; border:2px solid var(--ink); box-shadow:0 3px 0 var(--ink);}
#exp .dock{max-height:52vh; overflow-y:auto; display:flex; flex-direction:column; gap:.5rem;}
.lbl{font-size:.64rem; display:flex; align-items:center; gap:.4rem;}
.lbl .grow{flex:1;}
.toggles{display:grid; grid-template-columns:repeat(4,1fr); gap:.35rem;}
.tg{
  display:flex; flex-direction:column; align-items:center; gap:.2rem; font:inherit; font-size:.58rem;
  background:none; border:0; padding:0; cursor:pointer; color:var(--ink);
}
.tg i{width:44px; height:24px; border-radius:100px; border:2px solid var(--ink); background:var(--cream); position:relative; transition:background .15s;}
.tg i::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
  background:var(--paper); border:2px solid var(--ink); transition:left .15s;}
.tg.on i{background:var(--main);}
.tg.on i::after{left:21px;}
.tg:disabled{opacity:.35;}
.ratios{display:grid; grid-template-columns:repeat(7,1fr); gap:.3rem;}
.ratios button{
  min-height:32px; background:var(--paper); border:2px solid var(--ink); border-radius:8px;
  box-shadow:0 2px 0 var(--ink); font-family:'DotGothic16',monospace; font-size:.62rem; cursor:pointer; color:var(--ink); padding:0;
}
.ratios button.on{background:var(--main); box-shadow:0 0 0 var(--ink); transform:translateY(2px);}
.q2 button{flex-direction:column; min-height:44px;}
.q2 small{font-size:.5rem; font-weight:400; color:#5c5843;}
.toast{
  position:fixed; left:50%; bottom:calc(1.2rem + env(safe-area-inset-bottom)); transform:translateX(-50%);
  background:var(--ink); color:var(--main); border-radius:100px; padding:.45rem 1rem; font-size:.72rem;
  z-index:50; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap;
}
.toast.show{opacity:1;}
@media (min-width:760px){
  .dock{padding-left:max(.55rem,calc(50vw - 300px)); padding-right:max(.55rem,calc(50vw - 300px));}
  .pbody{max-height:26vh;}
}
</style>
</head>

<!-- はじめ -->
<section id="home" class="screen dotbg">
  <a class="back" href="../../index.html">← ラボ</a>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 96 96" width="100%" height="100%">
        <rect width="96" height="96" fill="#2b2a24"/>
        <path d="M34 -4 L96 -4 L96 70 Z" fill="#e9e7df"/>
        <path d="M0 78 L96 60 L96 96 L0 96Z" fill="#8f8c82"/>

        <circle cx="56" cy="60" r="10" fill="#E03A2F" stroke="#1E1C14" stroke-width="2"/>
      </svg>
    </div>
    <h1>のこし色</h1>
    <p>えらんだ色だけ のこして、ほかを モノクロに する。</p>
    <button class="btn btn-y" id="bPick"><svg class="ic" viewBox="0 0 24 24" fill="none"><circle cx="7.5" cy="7.5" r="1.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/><path d="M2.5 12C2.5 7.52166 2.5 5.28249 3.89124 3.89124C5.28249 2.5 7.52166 2.5 12 2.5C16.4783 2.5 18.7175 2.5 20.1088 3.89124C21.5 5.28249 21.5 7.52166 21.5 12C21.5 16.4783 21.5 18.7175 20.1088 20.1088C18.7175 21.5 16.4783 21.5 12 21.5C7.52166 21.5 5.28249 21.5 3.89124 20.1088C2.5 18.7175 2.5 16.4783 2.5 12Z" stroke="currentColor" stroke-width="1.7"/><path d="M5 21C9.37246 15.775 14.2741 8.88406 21.4975 13.5424" stroke="currentColor" stroke-width="1.7"/></svg>写真を えらぶ</button>
    <button class="btn" id="bLive"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M12.6974 3.5H11.303C10.5884 3.5 10.2311 3.5 9.91067 3.612C9.71499 3.68039 9.53113 3.77879 9.36568 3.90367C9.09474 4.10816 8.89655 4.40544 8.50018 5L8.50017 5.00001C8.29717 5.30453 7.99794 5.75337 7.87867 5.87871C7.58314 6.18927 7.19563 6.39666 6.77329 6.47029C6.60284 6.5 6.41985 6.5 6.05387 6.5C5.07379 6.5 4.58376 6.5 4.18307 6.61342C3.18074 6.89716 2.39734 7.68055 2.1136 8.68289C2.00018 9.08357 2.00018 9.57361 2.00018 10.5537V14.5C2.00018 17.3284 2.00018 18.7426 2.87886 19.6213C3.75754 20.5 5.17176 20.5 8.00018 20.5H16.0002C18.8286 20.5 20.2428 20.5 21.1215 19.6213C22.0002 18.7426 22.0002 17.3284 22.0002 14.5V10.5537C22.0002 9.57361 22.0002 9.08357 21.8868 8.68289C21.603 7.68055 20.8196 6.89716 19.8173 6.61342C19.4166 6.5 18.9266 6.5 17.9465 6.5C17.5805 6.5 17.3975 6.5 17.2271 6.47029C16.8047 6.39666 16.4172 6.18927 16.1217 5.87871C16.0024 5.75336 15.7032 5.30451 15.5002 5C15.1038 4.40544 14.9056 4.10816 14.6347 3.90367C14.4692 3.77879 14.2854 3.68039 14.0897 3.612C13.7693 3.5 13.412 3.5 12.6974 3.5Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/><path d="M16.0002 13C16.0002 15.2091 14.2093 17 12.0002 17C9.79104 17 8.00018 15.2091 8.00018 13C8.00018 10.7909 9.79104 9 12.0002 9C14.2093 9 16.0002 10.7909 16.0002 13Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/><path d="M19.1252 9.5H19.0002M19.2502 9.5C19.2502 9.63807 19.1383 9.75 19.0002 9.75C18.8621 9.75 18.7502 9.63807 18.7502 9.5C18.7502 9.36193 18.8621 9.25 19.0002 9.25C19.1383 9.25 19.2502 9.36193 19.2502 9.5Z" stroke="currentColor" stroke-linecap="round" stroke-width="1.7"/></svg>カメラで 見ながら とる</button>
    <div id="drophint">画像を ここに ドロップしても ひらけます</div>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
</section>

<!-- へんしゅう -->
<section id="edit" class="screen hide">
  <div class="bar">
    <button class="btn btn-ic" id="bBack" aria-label="もどる"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/></svg></button>
    <div class="grow" style="display:flex;justify-content:center;">
      <button class="swchip" id="chip"><i id="chipDot"></i><span class="dot" id="chipHex">色を えらぶ</span></button>
    </div>
    <button class="btn btn-ic" id="bCmp" aria-label="押している間 元の写真"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M2 8C2 8 6.47715 3 12 3C17.5228 3 22 8 22 8" stroke="currentColor" stroke-linecap="round" stroke-width="1.7"/><path d="M21.544 13.045C21.848 13.4713 22 13.6845 22 14C22 14.3155 21.848 14.5287 21.544 14.955C20.1779 16.8706 16.6892 21 12 21C7.31078 21 3.8221 16.8706 2.45604 14.955C2.15201 14.5287 2 14.3155 2 14C2 13.6845 2.15201 13.4713 2.45604 13.045C3.8221 11.1294 7.31078 7 12 7C16.6892 7 20.1779 11.1294 21.544 13.045Z" stroke="currentColor" stroke-width="1.7"/><path d="M15 14C15 12.3431 13.6569 11 12 11C10.3431 11 9 12.3431 9 14C9 15.6569 10.3431 17 12 17C13.6569 17 15 15.6569 15 14Z" stroke="currentColor" stroke-width="1.7"/></svg></button>
    <button class="btn btn-ic btn-g" id="bExp" aria-label="書き出す"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M21 6.5C21 8.15685 19.6569 9.5 18 9.5C16.3431 9.5 15 8.15685 15 6.5C15 4.84315 16.3431 3.5 18 3.5C19.6569 3.5 21 4.84315 21 6.5Z" stroke="currentColor" stroke-width="1.7"/><path d="M9 12C9 13.6569 7.65685 15 6 15C4.34315 15 3 13.6569 3 12C3 10.3431 4.34315 9 6 9C7.65685 9 9 10.3431 9 12Z" stroke="currentColor" stroke-width="1.7"/><path d="M21 17.5C21 19.1569 19.6569 20.5 18 20.5C16.3431 20.5 15 19.1569 15 17.5C15 15.8431 16.3431 14.5 18 14.5C19.6569 14.5 21 15.8431 21 17.5Z" stroke="currentColor" stroke-width="1.7"/><path d="M8.72852 10.7495L15.2285 7.75M8.72852 13.25L15.2285 16.2495" stroke="currentColor" stroke-width="1.7"/></svg></button>
  </div>
  <div class="stage dotbg" id="stage">
    <canvas id="view"></canvas>
    <canvas id="ov"></canvas>
    <div id="loupe"><canvas id="lc" width="92" height="92"></canvas><b><span id="lhex">#000000</span></b></div>
    <div class="tip" id="tip">写真を タップ・なぞって 色を えらぶ<br>2本指で 拡大／目のボタンを 押している間は 元の写真</div>
    <div id="zoomtag" class="dot">100%</div>
  </div>
  <div class="dock" id="dock">
    <div class="panel">
      <div class="phead" id="phead"><span id="ptIcon"></span><span id="ptName">アクセント</span><span class="grow"></span><span class="chev"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/></svg></span></div>

      <div class="pbody" data-p="accent">
        <div class="recent" id="recent"></div>
        <div class="sl"><div class="lab">残す色の幅<b id="vRange">30</b></div><input type="range" id="sRange" min="0" max="100" value="30"></div>
        <div class="sl"><div class="lab">境界の ぼかし<b id="vSoft">40</b></div><input type="range" id="sSoft" min="0" max="100" value="40"></div>
      </div>

      <div class="pbody hide" data-p="range">
        <div class="seg" id="segArea"><button data-v="all" class="on">全体</button><button data-v="part">部分</button></div>
        <div id="partUI" style="display:none;flex-direction:column;gap:.4rem;">

<script>

const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hex = (c) => '#' + c.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('').toUpperCase();
const fromHex = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); }
function store(k, v){ try{ if(v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }

/* ============ 色の 計算（シェーダーと 同じ 式） ============ */
function lin(c){ c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function oklab(rgb){
  const r = lin(rgb[0]), g = lin(rgb[1]), b = lin(rgb[2]);
  const l = Math.cbrt(0.4122214708*r + 0.5363325363*g + 0.0514459929*b);
  const m = Math.cbrt(0.2119034982*r + 0.6806995451*g + 0.1073969566*b);
  const s = Math.cbrt(0.0883024619*r + 0.2817188376*g + 0.6299787005*b);
  return [0.2104542553*l + 0.7936177850*m - 0.0040720468*s,
          1.9779984951*l - 2.4285922050*m + 0.4505937099*s,
          0.0259040371*l + 0.7827717662*m - 0.8086757660*s];
}
const thrOf = (r) => 0.012 + Math.pow(r / 100, 1.25) * 0.24;
const softOf = (f) => 0.004 + (f / 100) * 0.12;

/* ============ WebGL で 描く ============ */
const VS = `attribute vec2 p; varying vec2 uv;
void main(){ uv = vec2(p.x*.5+.5, .5-p.y*.5); gl_Position = vec4(p,0.,1.); }`;
const FS = `precision highp float; varying vec2 uv;
uniform sampler2D img, msk;
uniform vec3 tgt; uniform float hasC, thr, soft, useM, orig;
uniform float gam, con, lift, tone;
vec3 toLin(vec3 c){ return mix(c/12.92, pow((c+.055)/1.055, vec3(2.4)), step(.04045, c)); }
vec3 ok(vec3 c){
  c = toLin(c);
  float l = pow(max(dot(c, vec3(.4122214708,.5363325363,.0514459929)),0.), 1./3.);
  float m = pow(max(dot(c, vec3(.2119034982,.6806995451,.1073969566)),0.), 1./3.);
  float s = pow(max(dot(c, vec3(.0883024619,.2817188376,.6299787005)),0.), 1./3.);
  return vec3(.2104542553*l+.7936177850*m-.0040720468*s, 1.9779984951*l-2.4285922050*m+.4505937099*s, .0259040371*l+.7827717662*m-.8086757660*s);
}
void main(){
  vec3 c = texture2D(img, uv).rgb;
  if(orig > .5){ gl_FragColor = vec4(c,1.); return; }
  vec3 d = ok(c) - tgt;
  float dist = length(vec3(d.x*.45, d.y, d.z));
  float keep = hasC * (1. - smoothstep(thr, thr+soft, dist));
  if(useM > .5) keep *= texture2D(msk, uv).r;
  float y = dot(c, vec3(.2126,.7152,.0722));
  y = pow(max(y,0.), gam);

const MONO = {

/* ============ じょうたい ============ */
const S = {
  color:null, range:30, soft:40,
  preset:'standard', tone:0, con:0,
  area:'all', tool:'circle', mode:'add', brush:40, feather:20,
  ops:[], active:null,
  view:{z:1, x:0, y:0},
  orig:false, tab:'accent',
};
let SRC = null;     // 元の 画像（ImageBitmap か canvas）
let SW = 0, SH = 0; // 元の 大きさ
let PV = null, pctx = null, PD = null; // 下書き用に 小さくした 画像と その 画素
let R = null;       // 画面の Renderer
const view = $('#view'), ov = $('#ov'), octx = ov.getContext('2d'), stage = $('#stage');

try{ R = new Renderer(view); }catch(e){ alert('この ブラウザでは 動きません（WebGL が 使えない）'); }

/* ============ 画像を ひらく ============ */
$('#bPick').onclick = () => $('#file').click();
$('#lPhoto').onclick = () => $('#file').click();
$('#file').onchange = (e) => { const f = e.target.files[0]; e.target.value = ''; if(f) openFile(f); };
addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('drag'); });
addEventListener('dragleave', () => document.body.classList.remove('drag'));
addEventListener('drop', (e) => { e.preventDefault(); document.body.classList.remove('drag');
  const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/')); if(f) openFile(f); });

async function openFile(f){
  let img;
  try{ img = await createImageBitmap(f, {imageOrientation:'from-image'}); }
  catch(e){
    img = await new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = URL.createObjectURL(f); })
      .catch(() => null);
  }
  if(!img){ toast('この 画像は ひらけません'); return; }
  setSource(img, img.width || img.naturalWidth, img.height || img.naturalHeight);
}
function setSource(img, w, h){
  stopLive();
  SRC = img; SW = w; SH = h;
  const L = Math.min(1600, R.max);
  const k = Math.min(1, L / Math.max(w, h));
  PV = document.createElement('canvas');
  PV.width = Math.max(1, Math.round(w * k)); PV.height = Math.max(1, Math.round(h * k));
  pctx = PV.getContext('2d', {willReadFrequently:true});
  pctx.drawImage(img, 0, 0, PV.width, PV.height);
  PD = pctx.getImageData(0, 0, PV.width, PV.height).data;
  R.size(PV.width, PV.height); R.image(PV);
  S.ops = []; S.active = null; S.view = {z:1, x:0, y:0};
  maskDirty = true;
  show('edit');
  $('#tip').classList.toggle('hide', !!S.color);
  layout(); dirty();
}
function show(id){ for(const s of ['home','edit','live','exp']) $('#' + s).classList.toggle('hide', s !== id); }

/* ============ 画面の 位置あわせ ============ */
// 画像の 単位 … 長いほうの 辺を 1 とする
const imgU = () => { const L = Math.max(SW, SH); return [SW / L, SH / L]; };
let k0 = 1, stW = 0, stH = 0;
function geom(){
  const [wu, hu] = imgU(), k = k0 * S.view.z;
  return {k, left:(stW - wu * k) / 2 + S.view.x, top:(stH - hu * k) / 2 + S.view.y, wu, hu};
}
function layout(){
  if(!SRC) return;
  const r = stage.getBoundingClientRect(); stW = r.width; stH = r.height;
  const dpr = Math.min(2, devicePixelRatio || 1);
  ov.width = Math.round(stW * dpr); ov.height = Math.round(stH * dpr);
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const [wu, hu] = imgU();
  k0 = Math.min((stW - 28) / wu, (stH - 28) / hu);
  place();
}
function place(){
  const g = geom();
  Object.assign(view.style, {left:g.left - 2 + 'px', top:g.top - 2 + 'px', width:g.wu * g.k + 4 + 'px', height:g.hu * g.k + 4 + 'px'});
  $('#zoomtag').textContent = Math.round(S.view.z * 100) + '%';
  drawOv();
}
addEventListener('resize', () => { layout(); if(!$('#live').classList.contains('hide')) liveLayout(); if(!$('#exp').classList.contains('hide')) expDraw(); });
const toImg = (sx, sy) => { const g = geom(); return [(sx - g.left) / g.k, (sy - g.top) / g.k]; };
const toScr = (u, v) => { const g = geom(); return [g.left + u * g.k, g.top + v * g.k]; };

/* ============ 描く ============ */
let rq = 0;
function dirty(){ if(!rq) rq = requestAnimationFrame(renderNow); }
function renderNow(){
  rq = 0; if(!SRC) return;
  if(S.area === 'part' && maskDirty) buildMask();
  R.draw({...S, useMask:S.area === 'part'});
}

/* ============ 範囲（マスク） ============ */
let maskDirty = true;
function rasterMask(w, h){

  x.fillStyle = '#000'; x.fillRect(0, 0, w, h);
  x.lineCap = x.lineJoin = 'round';
  for(const o of S.ops){
    x.globalCompositeOperation = o.sub ? 'destination-out' : 'source-over';
    x.fillStyle = x.strokeStyle = '#fff';
    x.beginPath();
    if(o.t === 'circle'){ x.ellipse(o.x * L, o.y * L, Math.max(.5, o.rx * L), Math.max(.5, o.ry * L), 0, 0, Math.PI * 2); x.fill(); }
    else if(o.t === 'rect'){ x.rect(o.x * L, o.y * L, o.w * L, o.h * L); x.fill(); }
    else if(o.t === 'lasso'){ o.pts.forEach((p, i) => i ? x.lineTo(p[0] * L, p[1] * L) : x.moveTo(p[0] * L, p[1] * L)); x.closePath(); x.fill(); }
    else if(o.t === 'brush'){

function blur(m, w, h, r){

function box(src, dst, w, h, r, horiz){

function buildMask(){
  const k = Math.min(1, 1024 / Math.max(PV.width, PV.height));

}
function maskChanged(){ maskDirty = true; dirty(); drawOv(); }

/* 画面の 上に 形の わくと つまみを 描く */
let lassoPts = null, brushAt = null;
function handles(o){
  if(o.t === 'circle') return [[o.x + o.rx, o.y, 'r'], [o.x - o.rx, o.y, 'l'], [o.x, o.y + o.ry, 'b'], [o.x, o.y - o.ry, 't']];
  return [[o.x, o.y, 'tl'], [o.x + o.w, o.y, 'tr'], [o.x, o.y + o.h, 'bl'], [o.x + o.w, o.y + o.h, 'br']];
}
function drawOv(){
  octx.clearRect(0, 0, stW, stH);
  if(!SRC || S.tab !== 'range' || S.area !== 'part') return;
  const g = geom();
  octx.lineWidth = 2;
  const o = S.active;
  if(o && S.ops.includes(o)){
    octx.save(); octx.setLineDash([6, 5]); octx.strokeStyle = o.sub ? '#F2A0B8' : '#FFFEF7';
    octx.shadowColor = 'rgba(30,28,20,.9)'; octx.shadowBlur = 0; octx.shadowOffsetY = 1.5;
    octx.beginPath();
    if(o.t === 'circle'){ const [cx, cy] = toScr(o.x, o.y); octx.ellipse(cx, cy, o.rx * g.k, o.ry * g.k, 0, 0, Math.PI * 2); }
    else { const [x, y] = toScr(o.x, o.y); octx.rect(x, y, o.w * g.k, o.h * g.k); }
    octx.stroke(); octx.restore();
    for(const [u, v] of handles(o)){
      const [x, y] = toScr(u, v);
      octx.beginPath(); octx.arc(x, y, 8, 0, Math.PI * 2);
      octx.fillStyle = '#FFFEF7'; octx.fill(); octx.strokeStyle = '#1E1C14'; octx.lineWidth = 2.5; octx.stroke();
    }
    const [cx, cy] = o.t === 'circle' ? toScr(o.x, o.y) : toScr(o.x + o.w / 2, o.y + o.h / 2);
    octx.beginPath(); octx.arc(cx, cy, 5, 0, Math.PI * 2); octx.fillStyle = '#E1DD60'; octx.fill(); octx.strokeStyle = '#1E1C14'; octx.stroke();
  }
  if(lassoPts && lassoPts.length > 1){
    octx.save(); octx.setLineDash([6, 5]); octx.strokeStyle = S.mode === 'sub' ? '#F2A0B8' : '#FFFEF7'; octx.lineWidth = 2.5;
    octx.shadowColor = 'rgba(30,28,20,.9)'; octx.shadowOffsetY = 1.5;
    octx.beginPath(); lassoPts.forEach((p, i) => { const [x, y] = toScr(p[0], p[1]); i ? octx.lineTo(x, y) : octx.moveTo(x, y); });

  }

    const [x, y] = toScr(brushAt[0], brushAt[1]);
    octx.beginPath(); octx.arc(x, y, brushSize() * g.k / 2, 0, Math.PI * 2);
    octx.strokeStyle = '#1E1C14'; octx.lineWidth = 2; octx.stroke();
    octx.beginPath(); octx.arc(x, y, brushSize() * g.k / 2 - 2, 0, Math.PI * 2);

const brushSize = () => (S.brush / 100) * 0.25 / S.view.z * 1.0;

/* ============ 指の あつかい ============ */
const ptrs = new Map();
let act = null;   // いまの 1本指の 動作
let pinch = null;
let lastTap = 0;
stage.addEventListener('pointerdown', (e) => {
  if(!SRC) return;
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, pos(e));
  if(ptrs.size === 2){ cancelAct(); startPinch(); return; }
  if(ptrs.size > 2) return;
  const now = performance.now();
  if(now - lastTap < 280 && S.tab !== 'range'){ S.view = {z:1, x:0, y:0}; place(); lastTap = 0; return; }
  lastTap = now;
  startAct(pos(e));
});
stage.addEventListener('pointermove', (e) => {
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, pos(e));
  if(pinch && ptrs.size >= 2) movePinch();
  else if(act) moveAct(pos(e));
});
const endPtr = (e) => {
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(pinch){ if(ptrs.size < 2) pinch = null; return; }
  if(act) endAct();
};
stage.addEventListener('pointerup', endPtr);
stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('wheel', (e) => {
  if(!SRC) return; e.preventDefault();
  const p = pos(e), [u, v] = toImg(p[0], p[1]);
  S.view.z = clamp(S.view.z * Math.exp(-e.deltaY * 0.0015), 0.5, 10);
  anchor(u, v, p); place();
}, {passive:false});
function pos(e){ const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function anchor(u, v, p){ // 画像の (u,v) が 画面の p に 来るように ずらす
  const [wu, hu] = imgU(), k = k0 * S.view.z;
  S.view.x = p[0] - u * k - (stW - wu * k) / 2;
  S.view.y = p[1] - v * k - (stH - hu * k) / 2;
}
function startPinch(){
  const [a, b] = [...ptrs.values()];
  const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  pinch = {d:Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, z:S.view.z, uv:toImg(mid[0], mid[1])};
}
function movePinch(){
  const [a, b] = [...ptrs.values()];
  const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  S.view.z = clamp(pinch.z * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d, 0.5, 10);
  anchor(pinch.uv[0], pinch.uv[1], mid); place();
}

function startAct(p){
  const uv = toImg(p[0], p[1]);

    const g = geom(), o = S.active;
    if(S.tool === 'circle' || S.tool === 'rect'){
      if(o && S.ops.includes(o)){
        for(const [u, v, h] of handles(o)){
          const [x, y] = toScr(u, v);
          if(Math.hypot(x - p[0], y - p[1]) < 24){ act = {k:'handle', h, o}; return; }
        }
        if(inside(o, uv)){ act = {k:'move', o, from:uv, st:{...o}}; return; }
      }
      act = {k:'new', from:uv, o:null}; return;
    }
    if(S.tool === 'lasso'){ lassoPts = [uv]; act = {k:'lasso'}; drawOv(); return; }
    if(S.tool === 'brush'){
      const op = {t:'brush', pts:[uv], size:brushSize(), sub:S.mode === 'sub'};

function moveAct(p){

    const [u0, v0] = act.from, dx = uv[0] - u0, dy = uv[1] - v0;
    if(!act.o){

      S.ops.push(act.o); S.active = act.o;
    }
    const o = act.o;
    if(o.t === 'circle'){ o.x = u0 + dx / 2; o.y = v0 + dy / 2; o.rx = Math.abs(dx) / 2; o.ry = Math.abs(dy) / 2; }
    else { o.x = Math.min(u0, uv[0]); o.y = Math.min(v0, uv[1]); o.w = Math.abs(dx); o.h = Math.abs(dy); }
    maskChanged(); return;
  }

    act.o.x = act.st.x + uv[0] - act.from[0]; act.o.y = act.st.y + uv[1] - act.from[1]; maskChanged(); return;
  }
  if(act.k === 'handle'){
    const o = act.o, h = act.h;
    if(o.t === 'circle'){

      else o.ry = Math.max(.005, Math.abs(uv[1] - o.y));
    } else {
      const x2 = o.x + o.w, y2 = o.y + o.h;
      const fx = h.includes('l') ? x2 : o.x, fy = h.includes('t') ? y2 : o.y;
      o.x = Math.min(fx, uv[0]); o.w = Math.max(.005, Math.abs(uv[0] - fx));
      o.y = Math.min(fy, uv[1]); o.h = Math.max(.005, Math.abs(uv[1] - fy));
    }
    maskChanged(); return;
  }

}
function endAct(){
  if(act.k === 'pick'){ $('#loupe').style.display = 'none'; if(S.color) addRecent(S.color); }
  if(act.k === 'lasso'){
    if(lassoPts.length > 2) S.ops.push({t:'lasso', pts:lassoPts, sub:S.mode === 'sub'});

  }
  if(act.k === 'brush'){ brushAt = null; drawOv(); }
  act = null;
}
function cancelAct(){
  if(!act) return;
  if(act.k === 'pick') $('#loupe').style.display = 'none';
  if(act.k === 'lasso'){ lassoPts = null; drawOv(); }
  if(act.k === 'brush'){ brushAt = null; drawOv(); }
  act = null;
}
function inside(o, [u, v]){

/* 色を ひろう */
function sampleAt(u, v){

  for(let y = cy - 2; y <= cy + 2; y++) for(let x = cx - 2; x <= cx + 2; x++){

    const i = (y * PV.width + x) * 4; r += PD[i]; g += PD[i + 1]; b += PD[i + 2]; n++;

  return n ? [r / n, g / n, b / n] : null;
}
function pickAt(p, uv){

  lp.style.borderColor = hex(c);
  const lc = $('#lc').getContext('2d'), L = Math.max(PV.width, PV.height), sz = 18;
  lc.imageSmoothingEnabled = false;
  lc.fillStyle = '#FFFEF7'; lc.fillRect(0, 0, 92, 92);

}

const vid = $('#vid'), lv = $('#lv');
let LR = null, stream = null, facing = 'environment', liveRaf = 0, liveOrig = false, lvScale = 1, lvLeft = 0, lvTop = 0;
const samp = document.createElement('canvas'); samp.width = samp.height = 7;
const sctx = samp.getContext('2d', {willReadFrequently:true});

async function startLive(){
  show('live'); $('#camerr').style.display = 'none';
  if(!LR){ try{ LR = new Renderer(lv); }catch(e){ camErr('WebGL が 使えません'); return; } }
  if(stream) stream.getTracks().forEach(t => t.stop());
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:facing, width:{ideal:1920}, height:{ideal:1080}}});
  }catch(e){
    camErr('カメラを ひらけませんでした。<br>ブラウザの 設定で カメラを 許可してから もう一度 ためしてください。');
    return;
  }
  vid.srcObject = stream; await vid.play().catch(() => {});
  cancelAnimationFrame(liveRaf); liveLoop();
}
function camErr(m){ $('#camerrMsg').innerHTML = m; $('#camerr').style.display = 'flex'; }
function stopLive(){
  cancelAnimationFrame(liveRaf); liveRaf = 0;
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
}
function liveLayout(){
  const r = $('#lstage').getBoundingClientRect(), vw = vid.videoWidth, vh = vid.videoHeight;
  if(!vw) return;
  lvScale = Math.min(r.width / vw, r.height / vh);
  lvLeft = (r.width - vw * lvScale) / 2; lvTop = (r.height - vh * lvScale) / 2;
  Object.assign(lv.style, {left:lvLeft + 'px', top:lvTop + 'px', width:vw * lvScale + 'px', height:vh * lvScale + 'px'});
}
function liveLoop(){
  liveRaf = requestAnimationFrame(liveLoop);
  if(vid.readyState < 2 || !vid.videoWidth) return;
  const vw = vid.videoWidth, vh = vid.videoHeight, k = Math.min(1, 1280 / Math.max(vw, vh));
  LR.size(Math.round(vw * k), Math.round(vh * k));
  liveLayout();
  LR.image(vid);
  LR.draw({...S, useMask:false, orig:liveOrig});
}
let livePicking = false;
$('#lstage').addEventListener('pointerdown', (e) => { livePicking = true; $('#lstage').setPointerCapture(e.pointerId); livePick(e); });
$('#lstage').addEventListener('pointermove', (e) => { if(livePicking) livePick(e); });
$('#lstage').addEventListener('pointerup', () => { if(livePicking && S.color) addRecent(S.color); livePicking = false; });
function livePick(e){
  if(!vid.videoWidth) return;
  const r = $('#lstage').getBoundingClientRect();
  const x = (e.clientX - r.left - lvLeft) / lvScale, y = (e.clientY - r.top - lvTop) / lvScale;
  if(x < 0 || y < 0 || x >= vid.videoWidth || y >= vid.videoHeight) return;
  sctx.drawImage(vid, x - 3, y - 3, 7, 7, 0, 0, 7, 7);
  const d = sctx.getImageData(1, 1, 5, 5).data; let c = [0, 0, 0];
  for(let i = 0; i < d.length; i += 4){ c[0] += d[i]; c[1] += d[i + 1]; c[2] += d[i + 2]; }
  setColor(c.map(v => Math.round(v / 25)));
}
$('#bShoot').onclick = () => {

  const f = $('#flash'); f.style.transition = 'none'; f.style.opacity = 1;
  requestAnimationFrame(() => { f.style.transition = ''; f.style.opacity = 0; });
  setTimeout(() => setSource(c, c.width, c.height), 120);
};

/* のこった 色の 中で 多い 色（色構成） */
function palette(){
  if(!S.color) return [];
  const T = oklab(S.color), thr = thrOf(S.range), soft = softOf(S.soft), cnt = new Map();
  const w = PV.width, h = PV.height, step = Math.max(1, Math.round(Math.sqrt(w * h / 60000)));
  for(let y = 0; y < h; y += step) for(let x = 0; x < w; x += step){
    const i = (y * w + x) * 4, c = [PD[i], PD[i + 1], PD[i + 2]];
    let k = keepOf(c, T, thr, soft);
    if(S.area === 'part' && S.maskData) k *= S.maskData[Math.min(S.maskH - 1, Math.floor(y / h * S.maskH)) * S.maskW + Math.min(S.maskW - 1, Math.floor(x / w * S.maskW))] / 255;
    if(k < .5) continue;
    const key = (c[0] >> 4) << 8 | (c[1] >> 4) << 4 | (c[2] >> 4);
    const e = cnt.get(key) || [0, 0, 0, 0]; e[0] += c[0]; e[1] += c[1]; e[2] += c[2]; e[3]++; cnt.set(key, e);
  }
  const list = [...cnt.values()].sort((a, b) => b[3] - a[3]).map(e => [e[0] / e[3], e[1] / e[3], e[2] / e[3]]);
  const out = [];
  for(const c of list){
    const L = oklab(c);
    if(out.every(o => { const M = oklab(o); return Math.hypot(L[0] - M[0], L[1] - M[1], L[2] - M[2]) > .06; })) out.push(c);
    if(out.length >= 5) break;
  }
  return out.length ? out : [S.color];
}
function keepOf(c, T, thr, soft){
  const L = oklab(c), d = Math.hypot((L[0] - T[0]) * .45, L[1] - T[1], L[2] - T[2]);
  const t = clamp((d - thr) / soft, 0, 1); return 1 - t * t * (3 - 2 * t);
}

/* 並べかた。W×H の 紙に 写真と ラベルを どう置くか */
function plan(W, H, pw, ph){
  const m = Math.min(W, H), labels = !!S.color && (E.swatch || E.code) || (E.palette && E.pal.length);
  if(!E.frame){
    const s = Math.max(W / pw, H / ph), cw = W / s, ch = H / s;
    return {dx:0, dy:0, dw:W, dh:H, sx:(pw - cw) / 2, sy:(ph - ch) / 2, sw:cw, sh:ch, labels, pill:true, unit:m * .032};
  }
  const mg = E.margin / 100 * .14 * m, band = labels ? m * .085 : 0;
  const bw = Math.max(1, W - mg * 2), bh = Math.max(1, H - mg * 2 - band);
  const s = Math.min(bw / pw, bh / ph), dw = pw * s, dh = ph * s;
  const dx = (W - dw) / 2, dy = mg + (bh - dh) / 2;
  return {dx, dy, dw, dh, sx:0, sy:0, sw:pw, sh:ph, labels, ly:dy + dh + band / 2 + mg * .15, unit:m * .03};
}
function sizeFor(long, pw, ph){
  const ar = E.ratio || pw / ph;
  return ar >= 1 ? [long, Math.round(long / ar)] : [Math.round(long * ar), long];
}
function bgColor(){
  return {white:'#FFFFFF', black:'#141414', accent:S.color ? hex(S.color) : '#FFFFFF', custom:E.custom}[E.bg];
}
function lum(h){ const c = fromHex(h); return (c[0] * .299 + c[1] * .587 + c[2] * .114) / 255; }
function compose(cv, W, H, photo, pw, ph){
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d'), P = plan(W, H, pw, ph);
  x.imageSmoothingQuality = 'high';
  x.fillStyle = E.frame ? bgColor() : '#000'; x.fillRect(0, 0, W, H);
  x.drawImage(photo, P.sx, P.sy, P.sw, P.sh, P.dx, P.dy, P.dw, P.dh);
  if(!P.labels) return;
  const u = P.unit, items = [];
  const font = `800 ${u}px "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif`;
  x.font = font;
  if(S.color && E.swatch) items.push({w:u * 1.1, draw:(px, cy) => { x.beginPath(); x.arc(px + u * .55, cy, u * .55, 0, Math.PI * 2); x.fillStyle = hex(S.color); x.fill(); x.lineWidth = u * .08; x.strokeStyle = ink; x.stroke(); }});
  if(S.color && E.code){ const t = hex(S.color), tw = x.measureText(t).width; items.push({w:tw, draw:(px, cy) => { x.fillStyle = ink; x.textBaseline = 'middle'; x.font = font; x.fillText(t, px, cy + u * .04); }}); }
  if(E.palette && E.pal.length){ const q = u * .8, g = u * .15;
    items.push({w:E.pal.length * q + (E.pal.length - 1) * g, draw:(px, cy) => E.pal.forEach((c, i) => {
      x.fillStyle = hex(c); x.fillRect(px + i * (q + g), cy - q / 2, q, q);
      x.lineWidth = u * .06; x.strokeStyle = ink; x.strokeRect(px + i * (q + g), cy - q / 2, q, q); })});
  }
  var ink;
  const gap = u * .5, tot = items.reduce((a, b) => a + b.w, 0) + gap * (items.length - 1);
  let px, cy;
  if(P.pill){
    const pad = u * .6, bx = u, by = H - u - u * 1.8, bw = tot + pad * 2, bh = u * 1.8;
    x.fillStyle = 'rgba(255,254,247,.92)';
    x.beginPath(); x.roundRect ? x.roundRect(bx, by, bw, bh, bh / 2) : x.rect(bx, by, bw, bh); x.fill();
    ink = '#1E1C14'; px = bx + pad; cy = by + bh / 2;
  } else {
    ink = lum(bgColor()) > .55 ? '#1E1C14' : '#F5F4EC';
    px = (W - tot) / 2; cy = P.ly;
  }
  for(const it of items){ it.draw(px, cy); px += it.w + gap; }
}
function expDraw(){
  if(!SRC || $('#exp').classList.contains('hide')) return;
  renderNow(); // いまの 仕上がりを view に 描いておく
  const box = $('#exp .pv').getBoundingClientRect();
  const long = Math.round(Math.min(1400, Math.max(box.width, box.height) * Math.min(2, devicePixelRatio || 1)));
  const [W, H] = sizeFor(long, view.width, view.height);
  compose(ec, W, H, view, view.width, view.height);
  const s = Math.min((box.width - 26) / W, (box.height - 26) / H);
  ec.style.width = W * s + 'px'; ec.style.height = H * s + 'px';
}

/* 本番の 大きさで 焼く */
let XR = null;
async function renderFull(){
  await document.fonts.ready;
  if(!XR) XR = new Renderer(document.createElement('canvas'));
  // まず 1000px で 並べて、写真が どれだけの 大きさで 描かれるか を 見る
  const [W0, H0] = sizeFor(1000, SW, SH), P0 = plan(W0, H0, SW, SH);
  let f;
  if(E.q === 'std') f = 2048 / 1000;
  else f = (P0.sw / P0.dw);           // 写真が 元の 画素 1:1 に なる 倍率
  f = Math.min(f, Math.sqrt(16e6 / (W0 * H0)), 8192 / 1000);
  const W = Math.round(W0 * f), H = Math.round(H0 * f);
  // 写真を 描く 大きさ（元より 大きくは しない）
  const pk = Math.min(1, (P0.dw * f) / P0.sw, XR.max / Math.max(SW, SH));
  const pw = Math.max(1, Math.round(SW * pk)), ph = Math.max(1, Math.round(SH * pk));
  const pc = document.createElement('canvas'); pc.width = pw; pc.height = ph;
  pc.getContext('2d').drawImage(SRC, 0, 0, pw, ph);
  XR.size(pw, ph); XR.image(pc);
  if(S.area === 'part'){
    const k = Math.min(1, 2048 / Math.max(pw, ph)), mw = Math.round(pw * k), mh = Math.round(ph * k);
    XR.mask(rasterMask(mw, mh), mw, mh);
  }
  XR.draw({...S, useMask:S.area === 'part', orig:false});
  const out = document.createElement('canvas');
  compose(out, W, H, XR.cv, pw, ph);
  pc.width = pc.height = 1;
  return new Promise(ok => out.toBlob(ok, 'image/jpeg', .94));
}
const fname = () => { const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return `nokoshi-iro-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`; };
async function busy(btn, fn){
  btn.disabled = true;
  try{ await fn(); }catch(e){ if(e && e.name !== 'AbortError') toast('うまく いきませんでした'); console.error(e); }
  btn.disabled = false;
}
$('#bSave').onclick = () => busy($('#bSave'), async () => {
  const blob = await renderFull(), name = fname();
  const file = new File([blob], name, {type:'image/jpeg'});
  // iPhone は 共有シートから「画像を保存」で 写真に 入る
  if(/iPhone|iPad|iPod/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[file]})){
    await navigator.share({files:[file]}); return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('保存しました');
});
$('#bShare').onclick = () => busy($('#bShare'), async () => {
  const blob = await renderFull(), file = new File([blob], fname(), {type:'image/jpeg'});
  if(navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file]});
  else toast('この ブラウザは 共有に 対応していません');
});
