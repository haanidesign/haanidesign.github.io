# おえかき工房 の 描画エンジン。Efude の エンジン部分を WebAssembly に して 使う。
# つくりかた: sh build.sh
[package]
name = "oekaki-engine"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
efude-core = { git = "https://github.com/852wa/Efude", rev = "ca3e3a414d603663723bed8c6ef8db6f89deab1f" }
efude-stroke = { git = "https://github.com/852wa/Efude", rev = "ca3e3a414d603663723bed8c6ef8db6f89deab1f" }
efude-brush = { git = "https://github.com/852wa/Efude", rev = "ca3e3a414d603663723bed8c6ef8db6f89deab1f" }
efude-canvas = { git = "https://github.com/852wa/Efude", rev = "ca3e3a414d603663723bed8c6ef8db6f89deab1f" }
efude-io-mem = { path = "efude-io-mem" }
glam = "0.30"
lz4_flex = "0.11"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
