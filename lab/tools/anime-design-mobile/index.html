<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3f6f7d">
<meta name="mobile-web-app-capable" content="yes">
<title>アニメデザイン工房 モバイル</title>
<style>
:root{
  --bar:#3f6f7d; --bar2:#35606c;
  --bg:#eceadf; --panel:#faf8f2; --line:#20242a;
  --btn:#fff; --btn-on:#ffd24a; --accent:#e2703a; --text:#20242a; --dim:#79808b;
  --tap:46px;
}
*{box-sizing:border-box;margin:0;padding:0; -webkit-tap-highlight-color:transparent}
html,body{height:100%; overscroll-behavior:none}
body{
  background:var(--bg); color:var(--text); overflow:hidden;
  font:14px/1.45 "Segoe UI","Yu Gothic UI","Hiragino Sans",sans-serif;
  display:flex; flex-direction:column; height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  touch-action:none; user-select:none;
}
button,select,input{font:inherit; color:inherit}
button{cursor:pointer}

#hdr{
  flex-shrink:0; height:48px; display:flex; align-items:center; gap:8px; padding:0 10px;
  background:linear-gradient(180deg,var(--bar),var(--bar2)); color:#fff;
}
#hdr .ttl{font-weight:700; font-size:14px; margin-right:auto; opacity:.95}
.hb{
  width:var(--tap); height:36px; background:#fff; color:var(--text);
  border:2px solid var(--line); border-radius:10px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.hb.g{background:#57c98a; color:#fff; width:auto; padding:0 14px}

#stagewrap{
  flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center;
  background-color:#eceadf;
  background-image:radial-gradient(#d5d1c2 1.6px, transparent 1.7px);
  background-size:12px 12px;
  overflow:hidden; touch-action:none;
}
#stage{position:relative; box-shadow:0 0 0 2px var(--line), 0 4px 14px rgba(0,0,0,.18)}
#stage canvas{position:absolute; left:0; top:0; image-rendering:pixelated; display:block; touch-action:none}
#view{position:relative; z-index:3}
#zoombar{
  position:absolute; left:8px; top:8px; background:rgba(255,255,255,.9); border:2px solid var(--line);
  border-radius:999px; padding:2px 10px; font-size:11px; font-weight:700; z-index:6;
}
#previewBox{
  position:absolute; right:8px; top:8px; border:2px solid var(--line); border-radius:10px;
  overflow:hidden; background:#fff; z-index:6; width:96px;
}
#previewBox .cap{background:#57c98a; color:#fff; font-size:9px; font-weight:700; padding:0 5px}
/* 本体JSがインラインで幅190pxを指定するので、モバイルでは上書きする */
#previewBox canvas{display:block; image-rendering:pixelated; width:100% !important; height:auto !important}
#previewBox.off{display:none}
#infoBar{display:none}

#frames{
  flex-shrink:0; display:flex; gap:6px; overflow-x:auto; padding:6px;
  background:#20242a; touch-action:pan-x;
}
.fr{position:relative; border:2px solid #4a5158; border-radius:6px; background:#fff; flex-shrink:0}
.fr.on{border-color:var(--btn-on); box-shadow:0 0 0 2px var(--btn-on)}
.fr canvas{display:block; image-rendering:pixelated; border-radius:3px}
.fr b{position:absolute; left:2px; top:0; font-size:9px; color:#fff; text-shadow:0 0 3px #000}
#addfr{flex-shrink:0; width:46px; border:2px dashed #7e8790; border-radius:6px; background:transparent; color:#c9ced4; font-size:20px}

#rail{
  flex-shrink:0; display:flex; gap:6px; overflow-x:auto; padding:7px 8px;
  background:var(--panel); border-top:2px solid var(--line);
}
.tool{
  flex:0 0 auto; width:52px; height:var(--tap); background:var(--btn);
  border:2px solid var(--line); border-radius:12px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:9px; font-weight:700; line-height:1.1;
}
.tool .ic{font-size:17px}
.tool.on{background:var(--btn-on)}

#secbar{
  flex-shrink:0; display:flex; gap:6px; overflow-x:auto; padding:0 8px 8px;
  background:var(--panel); border-bottom:2px solid var(--line);
}
.secbtn{
  flex:0 0 auto; height:38px; padding:0 14px; background:#e8e5da; color:var(--text);
  border:2px solid var(--line); border-radius:999px; font-weight:700; font-size:12.5px;
}
.secbtn.on{background:var(--btn-on)}

#sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--panel); border-top:2px solid var(--line); border-radius:16px 16px 0 0;
  max-height:64dvh; display:flex; flex-direction:column;
  transform:translateY(102%); will-change:transform;
  box-shadow:0 -6px 20px rgba(0,0,0,.2);
  padding-bottom:env(safe-area-inset-bottom);
}
#sheet.open{transform:translateY(0)}
#sheetHead{
  flex-shrink:0; display:flex; align-items:center; gap:10px; padding:8px 12px;
  border-bottom:2px solid var(--line);
  position:relative; touch-action:none; cursor:grab; user-select:none;
}
#sheetHead:active{cursor:grabbing}
#sheetGrab{
  position:absolute; left:50%; top:5px; width:38px; height:4px; margin-left:-19px;
  border-radius:99px; background:var(--line); opacity:.45; pointer-events:none;
}
#sheetHead b{flex:1; font-size:14px}
#sheetBody{overflow-y:auto; padding:10px 14px 20px; touch-action:pan-y}
#scrim{position:fixed; inset:0; background:#000; z-index:39; opacity:0; pointer-events:none}
#scrim.on{pointer-events:auto}
.sec{display:none}
.sec.on{display:block}

h4{font-size:12px; color:var(--dim); margin:14px 0 7px; letter-spacing:.03em}
h4:first-child{margin-top:0}
.grid{display:flex; flex-wrap:wrap; gap:7px}
.sq{
  width:var(--tap); height:var(--tap); border:2px solid var(--line); border-radius:12px; background:var(--btn);
  display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;
}
.sq.on{background:var(--btn-on)}
.sq .dot{background:#20242a; border-radius:50%}
.sw{width:var(--tap); height:38px; border:2px solid var(--line); border-radius:10px}
.sw.on{outline:3px solid var(--accent); outline-offset:1px}
.mini{
  min-height:40px; background:var(--btn); border:2px solid var(--line); border-radius:11px;
  padding:6px 13px; font-size:13px; font-weight:700;
}
.mini.on{background:var(--btn-on)}
.row{display:flex; align-items:center; gap:9px; margin:9px 0}
.row label{width:96px; flex-shrink:0; font-size:12.5px}
.row input[type=range]{flex:1; accent-color:var(--accent); height:28px}
.row .val{width:36px; text-align:right; font-size:11px; color:var(--dim)}
select,input[type=number],input[type=text]{
  background:#fff; border:2px solid var(--line); border-radius:10px; padding:7px 9px; min-height:40px;
}
.lay{
  display:flex; align-items:center; gap:8px; border:2px solid var(--line); border-radius:11px;
  padding:6px 8px; margin-bottom:6px; background:#fff; min-height:44px;
}
.lay.on{outline:3px solid var(--accent); outline-offset:1px}
.lay .eye{width:26px; text-align:center; font-size:16px}
.lay .nm{flex:1; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lay input[type=range]{width:84px; accent-color:var(--accent)}
.sw-toggle{
  width:54px; height:30px; border-radius:999px; background:#c9c5b8; border:2px solid var(--line);
  position:relative; flex-shrink:0;
}
.sw-toggle::after{content:""; position:absolute; left:2px; top:2px; width:22px; height:22px; border-radius:50%; background:#fff; transition:.14s}
.sw-toggle.on{background:#57c98a}
.sw-toggle.on::after{left:26px}
#colorPick{width:64px; height:40px; border:2px solid var(--line); border-radius:10px; background:#fff}
.hidden{display:none !important}
.note{font-size:11.5px; color:var(--dim); margin-top:6px}

/* 横向き・低い画面では詰めてキャンバスを広く取る */
@media (max-height:470px){
  :root{--tap:40px}
  #hdr{height:42px}
  #frames{padding:4px}
  .fr canvas{height:30px !important; width:auto !important}
  .tool{width:46px; height:40px; font-size:8.5px}
  .tool .ic{font-size:15px}
  .secbtn{height:34px; padding:0 11px; font-size:12px}
  #rail{padding:5px 6px}
  #secbar{padding:0 6px 6px}
  #sheet{max-height:78dvh}
}
</style>
</head>
<body>

<div id="hdr">
  <button class="hb" id="btnUndoTop">↶</button>
  <button class="hb" id="btnRedoTop">↷</button>
  <span class="ttl">アニメデザイン工房</span>
  <button class="hb" id="mPlay">▶</button>
  <button class="hb g" id="btnSave">保存</button>
</div>

<div id="stagewrap">
  <div id="stage">
    <canvas id="bgc"></canvas>
    <canvas id="view"></canvas>
  </div>
  <div id="zoombar">🔍 —</div>
  <div id="previewBox"><div class="cap">▶ プレビュー</div><canvas id="prev"></canvas></div>
  <div id="infoBar"></div>
</div>

<div id="frames"></div>

<div id="rail">
  <button class="tool on" data-tool="pen"><span class="ic">✏️</span>ペン</button>
  <button class="tool" data-tool="brush"><span class="ic">🖌️</span>ブラシ</button>
  <button class="tool" data-tool="eraser"><span class="ic">🧽</span>消し</button>
  <button class="tool" data-tool="fill"><span class="ic">🪣</span>塗り</button>
  <button class="tool" data-tool="shape"><span class="ic">⬛</span>図形</button>
  <button class="tool" data-tool="text"><span class="ic">A</span>文字</button>
  <button class="tool" data-tool="pick"><span class="ic">💧</span>スポイト</button>
  <button class="tool" data-tool="move"><span class="ic">✥</span>移動</button>
</div>

<div id="secbar">
  <button class="secbtn" data-sec="color">🎨 色</button>
  <button class="secbtn" data-sec="pen">✏️ ペン</button>
  <button class="secbtn" data-sec="layer">🗂 レイヤー</button>
  <button class="secbtn" data-sec="frame">🎞 コマ</button>
  <button class="secbtn" data-sec="fx">✨ しあげ</button>
  <button class="secbtn" data-sec="file">💾 ファイル</button>
</div>

<div id="scrim"></div>
<div id="sheet">
  <div id="sheetHead"><div id="sheetGrab"></div><b id="sheetTitle">色</b><button class="hb" id="sheetClose">✕</button></div>
  <div id="sheetBody">

    <div class="sec on" data-sec="color">
      <h4>カラー（パレット）</h4>
      <div class="grid" id="palette"></div>
      <h4>フルカラー</h4>
      <div class="row">
        <div class="sw-toggle on" id="fullColor"></div>
        <input type="color" id="colorPick" value="#20242a">
        <span class="val" id="curColor">#20242a</span>
      </div>
      <h4>紙の色</h4>
      <div class="grid" id="papers"></div>
    </div>

    <div class="sec" data-sec="pen">
      <h4>ペンの太さ</h4>
      <div class="grid" id="sizes"></div>
      <h4>ペンの種類</h4>
      <div class="grid" id="patterns"></div>
      <h4>図形</h4>
      <div class="grid" id="shapes"></div>
      <h4>描き味</h4>
      <div class="row"><label>手ブレ補正</label><div class="sw-toggle on" id="stabilize"></div></div>
      <div class="row"><label>グリッド</label><div class="sw-toggle" id="gridSw"></div></div>
    </div>

    <div class="sec" data-sec="layer">
      <div class="grid">
        <button class="mini" id="lAdd">＋ 追加</button>
        <button class="mini" id="lDup">⧉ 複製</button>
        <button class="mini" id="lDel">🗑 削除</button>
        <button class="mini" id="lMerge">⇊ 統合</button>
        <button class="mini" id="lUp">▲</button>
        <button class="mini" id="lDown">▼</button>
      </div>
      <h4>レイヤー</h4>
      <div id="layers"></div>
      <h4>選んだレイヤーを他のコマへ</h4>
      <div class="grid">
        <button class="mini" id="lPrevMove">◀ 前へ移動</button>
        <button class="mini" id="lNextMove">次へ移動 ▶</button>
        <button class="mini" id="lPrevCopy">◀ 前へコピー</button>
        <button class="mini" id="lNextCopy">次へコピー ▶</button>
        <button class="mini" id="lAllCopy">全コマへコピー</button>
      </div>
    </div>

    <div class="sec" data-sec="frame">
      <div class="grid">
        <button class="mini" id="fAdd">＋ ついか</button>
        <button class="mini" id="fDup">⧉ 複製</button>
        <button class="mini" id="fWobble">〜 ゆらゆら</button>
        <button class="mini" id="fCopy">コピー</button>
        <button class="mini" id="fPaste">はりつけ</button>
        <button class="mini" id="fDel" style="background:#f4746a;color:#fff">さくじょ</button>
      </div>
      <h4>再生</h4>
      <div class="grid">
        <button class="mini" id="pFirst">⏮</button>
        <button class="mini" id="pPrev">◀</button>
        <button class="mini" id="pPlay">▶</button>
        <button class="mini" id="pNext">▶|</button>
        <button class="mini" id="pLast">⏭</button>
        <button class="mini" id="pLoop">🔁</button>
      </div>
      <div class="row">
        <label>速さ</label>
        <select id="fps">
          <option>2</option><option>3</option><option selected>4</option><option>6</option>
          <option>8</option><option>12</option><option>15</option><option>24</option>
        </select>
        <span class="val">fps</span>
      </div>
      <h4>透かす（オニオンスキン）</h4>
      <div class="grid" id="onion"></div>
      <h4>プレビュー窓</h4>
      <div class="row"><label>右上に出す</label><div class="sw-toggle on" id="prevSw"></div></div>
    </div>

    <div class="sec" data-sec="fx">
      <h4>ドット化</h4>
      <div class="row"><label>ドットの粗さ</label><input type="range" id="fxPixel" min="1" max="16" step="1" value="4"><span class="val">4</span></div>
      <div class="row">
        <label>減色</label>
        <select id="fxQuant">
          <option value="0">しない</option>
          <option value="2">2色</option><option value="4">4色</option><option value="8">8色</option>
          <option value="16" selected>16色</option><option value="32">32色</option>
          <option value="pal">パレットに寄せる</option>
          <option value="mono">白黒1bit</option>
        </select>
      </div>
      <div class="row"><label>ディザ（網）</label><div class="sw-toggle" id="fxDither"></div></div>
      <div class="row"><label>フチ取り</label><div class="sw-toggle" id="fxOutline"></div></div>
      <div class="grid">
        <button class="mini" id="fxApply">このコマに適用</button>
        <button class="mini" id="fxApplyAll">全コマに適用</button>
      </div>
      <div class="note">↶ で戻せます</div>
    </div>

    <div class="sec" data-sec="file">
      <h4>名前</h4>
      <input type="text" id="docName" value="新規デザイン" style="width:100%">
      <h4>書き出し</h4>
      <div class="grid">
        <button class="mini" id="btnLoad">📂 よみこみ</button>
        <button class="mini" id="btnExportPng">🖼 画像で保存</button>
        <button class="mini" id="btnExportSeq">⬇ 連番PNG</button>
        <button class="mini" id="btnGif">🎞 GIFで保存</button>
        <button class="mini" id="btnRec">🎬 動画で保存</button>
      </div>
      <div class="note">GIFはコマをそのまま出力。動画はiPhoneならMP4、AndroidはMP4かWEBMになります。</div>
      <h4>キャンバス</h4>
      <div class="grid">
        <button class="mini" id="cs320">320×240</button>
        <button class="mini" id="cs256">256×192</button>
        <button class="mini" id="cs512">512×512</button>
        <button class="mini" id="csClear">このコマを消す</button>
      </div>
      <h4>表示</h4>
      <div class="grid">
        <button class="mini" id="zOut">− 縮小</button>
        <button class="mini" id="zIn">＋ 拡大</button>
        <button class="mini" id="zFit">⤢ 画面に合わせる</button>
      </div>
      <div class="note">キャンバスは2本指でつまむと拡大縮小、2本指ドラッグで移動できます。</div>
    </div>

  </div>
</div>

<input type="file" id="openFile" accept=".ugomemo,.json" class="hidden">

<script>
"use strict";

/* =========================================================
   0. 基本状態
   ========================================================= */
let W = 320, H = 240;          // ドット解像度
let zoom = 2;
let paper = "#ffd83d";
let frames = [];               // [{layers:[{name,visible,alpha,cv}]}]
let cur = 0, curLayer = 0;
let clipFrame = null;
let onionN = 0, showGrid = false, stabilizeOn = true;

const view = document.getElementById("view");
const vctx = view.getContext("2d");
const bgc  = document.getElementById("bgc");
const bctx = bgc.getContext("2d");
const stage = document.getElementById("stage");
const prev = document.getElementById("prev");
const pctx = prev.getContext("2d");

const PALETTE = [
  "#20242a","#ffffff","#ee3b30","#ffd83d","#127a3a","#2ba7e0","#f08b2c","#f490b8",
  "#8b6ef2","#8a5a34","#9aa1ac","#bfe6fb","#a9e5b8","#f6ecd2","#2f57c9","#1b3fa0",
  "#173087","#0e1f5c","#e8dfc4","#3fbfa0","#c9366d","#5d5d5d","#00000000"
];
const PAPERS = ["#ffffff","#20242a","#ee3b30","#ffd83d","#127a3a","#2ba7e0","#eceadf"];
const SIZES = [1,2,3,4,6,10];
const PATTERNS = [
  {id:"solid", label:"べた"},
  {id:"net50", label:"あみ50"},
  {id:"net25", label:"あみ25"},
];
const SHAPES = [
  {id:"line", label:"線"},
  {id:"rect", label:"□"},
  {id:"rectf",label:"■"},
  {id:"ell",  label:"○"},
  {id:"ellf", label:"●"},
];

let tool = "pen", penSize = 3, pattern = "solid", shape = "rect";
let color = "#20242a", fullColor = true;

/* =========================================================
   1. フレーム / レイヤー
   ========================================================= */
function newLayerCanvas(){
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  return c;
}
function newLayer(name){
  return {name, visible:true, alpha:1, cv:newLayerCanvas()};
}
function newFrame(){
  return {layers:[newLayer("レイヤー1")]};
}
function F(){ return frames[cur]; }
function L(){ return F().layers[curLayer]; }

function initDoc(w,h){
  W = w; H = h;
  frames = [newFrame()];
  cur = 0; curLayer = 0;
  fitZoom();
  buildLayers(); buildFrames(); redraw();
}

/* ---- 表示サイズ ---- */
function applySize(){
  [view,bgc].forEach(c=>{ c.width = W; c.height = H;
    c.style.width = (W*zoom)+"px"; c.style.height = (H*zoom)+"px"; });
  stage.style.width = (W*zoom)+"px";
  stage.style.height = (H*zoom)+"px";
  vctx.imageSmoothingEnabled = false;
  bctx.imageSmoothingEnabled = false;
  prev.width = W; prev.height = H;
  const pw = 190;
  prev.style.width = pw+"px"; prev.style.height = Math.round(pw*H/W)+"px";
  pctx.imageSmoothingEnabled = false;
  document.getElementById("zoombar").textContent = `🔍 ${W}×${H} を ${zoom.toFixed(zoom<1?2:1)}倍表示`;
  document.getElementById("infoBar").textContent =
    `${W}×${H} ドット等倍 / レイヤー無制限 / パレット＋フルカラー`;
  // canvas.width への代入は中身を消すので、必ず描き直す（拡大縮小で真っ白になるのを防ぐ）
  if(frames.length) redraw();
}
function fitZoom(){
  const wrap = document.getElementById("stagewrap");
  const z = Math.max(1, Math.min(
    Math.floor((wrap.clientWidth-60)/W), Math.floor((wrap.clientHeight-60)/H)));
  zoom = z || 1;
  applySize();
}

/* =========================================================
   2. 描画（ピクセル + パターンマスク）
   ========================================================= */
function maskOK(x,y){
  if(pattern === "solid") return true;
  if(pattern === "net50") return ((x + y) & 1) === 0;
  return ((x*2 + y) % 4) === 0;         // net25 斜め
}
function isErase(){ return tool === "eraser"; }

function stamp(ctx, cx, cy, size, erase){
  const r = size/2;
  const x0 = Math.floor(cx - r + .5), y0 = Math.floor(cy - r + .5);
  for(let y=0; y<size; y++){
    for(let x=0; x<size; x++){
      if(size > 2){
        const dx = x - (size-1)/2, dy = y - (size-1)/2;
        if(dx*dx + dy*dy > r*r) continue;
      }
      const px = x0+x, py = y0+y;
      if(px<0||py<0||px>=W||py>=H) continue;
      if(!erase && !maskOK(px,py)) continue;
      if(erase) ctx.clearRect(px,py,1,1);
      else { ctx.fillStyle = color; ctx.fillRect(px,py,1,1); }
    }
  }
}
function lineStamp(ctx, x0,y0,x1,y1, size, erase){
  x0=Math.round(x0); y0=Math.round(y0); x1=Math.round(x1); y1=Math.round(y1);
  const dx = Math.abs(x1-x0), dy = -Math.abs(y1-y0);
  const sx = x0<x1?1:-1, sy = y0<y1?1:-1;
  let err = dx+dy;
  for(;;){
    stamp(ctx, x0, y0, size, erase);
    if(x0===x1 && y0===y1) break;
    const e2 = 2*err;
    if(e2 >= dy){ err += dy; x0 += sx; }
    if(e2 <= dx){ err += dx; y0 += sy; }
  }
}
function ellipseOutline(ctx,x0,y0,x1,y1,size,erase){
  const cx=(x0+x1)/2, cy=(y0+y1)/2, rx=Math.abs(x1-x0)/2, ry=Math.abs(y1-y0)/2;
  const n = Math.max(24, Math.round((rx+ry)*4));
  let px=null,py=null;
  for(let i=0;i<=n;i++){
    const a = i/n*Math.PI*2;
    const x = cx + Math.cos(a)*rx, y = cy + Math.sin(a)*ry;
    if(px!==null) lineStamp(ctx,px,py,x,y,size,erase);
    px=x; py=y;
  }
}
function fillRegion(ctx,x0,y0,x1,y1,kind){
  const L2=Math.min(x0,x1), R2=Math.max(x0,x1), T2=Math.min(y0,y1), B2=Math.max(y0,y1);
  const cx=(L2+R2)/2, cy=(T2+B2)/2, rx=(R2-L2)/2, ry=(B2-T2)/2;
  for(let y=Math.floor(T2); y<=B2; y++){
    for(let x=Math.floor(L2); x<=R2; x++){
      if(x<0||y<0||x>=W||y>=H) continue;
      if(kind==="ellf"){
        const nx=(x-cx)/(rx||1), ny=(y-cy)/(ry||1);
        if(nx*nx+ny*ny > 1) continue;
      }
      if(!maskOK(x,y)) continue;
      ctx.fillStyle = color; ctx.fillRect(x,y,1,1);
    }
  }
}
function hexToRgba(h){
  if(h.length===9) return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),parseInt(h.slice(7,9),16)];
  return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),255];
}
function floodFill(cv, sx, sy){
  sx=Math.floor(sx); sy=Math.floor(sy);
  if(sx<0||sy<0||sx>=W||sy>=H) return;
  const ctx = cv.getContext("2d");
  const img = ctx.getImageData(0,0,W,H);
  const d = img.data, i0 = (sy*W+sx)*4;
  const t = [d[i0],d[i0+1],d[i0+2],d[i0+3]];
  const f = hexToRgba(color);
  if(t[0]===f[0]&&t[1]===f[1]&&t[2]===f[2]&&t[3]===f[3]) return;
  const same = i => Math.abs(d[i]-t[0])<10 && Math.abs(d[i+1]-t[1])<10 &&
                    Math.abs(d[i+2]-t[2])<10 && Math.abs(d[i+3]-t[3])<10;
  // 訪問管理は別バッファで持つ(マスクで塗らない画素も探索は続けるため)
  const seen = new Uint8Array(W*H);
  const st = [sx,sy];
  while(st.length){
    const y = st.pop(), x = st.pop();
    if(x<0||y<0||x>=W||y>=H) continue;
    const p = y*W+x;
    if(seen[p]) continue;
    const i = p*4;
    if(!same(i)) continue;
    seen[p] = 1;
    if(maskOK(x,y)){ d[i]=f[0]; d[i+1]=f[1]; d[i+2]=f[2]; d[i+3]=f[3]; }
    st.push(x+1,y, x-1,y, x,y+1, x,y-1);
  }
  ctx.putImageData(img,0,0);
}

/* =========================================================
   3. Undo
   ========================================================= */
const undoStack = [], redoStack = [];
function grabLayers(f){
  return f.layers.map(l=>({name:l.name, visible:l.visible, alpha:l.alpha,
    data: l.cv.getContext("2d").getImageData(0,0,W,H)}));
}
function putLayers(rec){
  return rec.map(l=>{
    const cv = newLayerCanvas();
    cv.getContext("2d").putImageData(l.data,0,0);
    return {name:l.name, visible:l.visible, alpha:l.alpha, cv};
  });
}
function snapshot(){ return {type:"frame", cur, layers: grabLayers(F())}; }
function snapshotDoc(){ return {type:"doc", cur, frames: frames.map(grabLayers)}; }
function restore(s){
  if(s.type === "doc"){
    frames = s.frames.map(rec=>({layers: putLayers(rec)}));
    cur = Math.min(s.cur, frames.length-1);
  } else {
    cur = Math.min(s.cur, frames.length-1);
    F().layers = putLayers(s.layers);
  }
  curLayer = Math.min(curLayer, F().layers.length-1);
  buildLayers(); buildFrames(); redraw();
}
function pushUndo(all){
  undoStack.push(all ? snapshotDoc() : snapshot());
  if(undoStack.length > 40) undoStack.shift();
  redoStack.length = 0;
}
/* 戻す先が全コマ記録なら、今の状態も全コマで控えておく */
function undo(){
  if(!undoStack.length) return;
  const s = undoStack.pop();
  redoStack.push(s.type === "doc" ? snapshotDoc() : snapshot());
  restore(s);
}
function redo(){
  if(!redoStack.length) return;
  const s = redoStack.pop();
  undoStack.push(s.type === "doc" ? snapshotDoc() : snapshot());
  restore(s);
}

/* =========================================================
   4. 合成・再描画
   ========================================================= */
function compose(ctx, frame, withPaper){
  ctx.clearRect(0,0,W,H);
  if(withPaper && paper !== "transparent"){ ctx.fillStyle = paper; ctx.fillRect(0,0,W,H); }
  for(const l of frame.layers){
    if(!l.visible) continue;
    ctx.globalAlpha = l.alpha;
    ctx.drawImage(l.cv,0,0);
  }
  ctx.globalAlpha = 1;
}
let tmp = null;                       // 図形プレビュー用
function redraw(){
  // 背景（紙 + オニオン）
  bctx.clearRect(0,0,W,H);
  if(paper !== "transparent"){ bctx.fillStyle = paper; bctx.fillRect(0,0,W,H); }
  for(let i=1;i<=onionN;i++){
    const f = frames[cur-i]; if(!f) break;
    bctx.globalAlpha = 0.34/i;
    for(const l of f.layers){ if(l.visible) bctx.drawImage(l.cv,0,0); }
  }
  bctx.globalAlpha = 1;
  // 本体
  vctx.clearRect(0,0,W,H);
  for(const l of F().layers){
    if(!l.visible) continue;
    vctx.globalAlpha = l.alpha;
    vctx.drawImage(l.cv,0,0);
  }
  vctx.globalAlpha = 1;
  if(tmp) vctx.drawImage(tmp,0,0);
  if(showGrid){
    vctx.globalAlpha = .18; vctx.fillStyle = "#20242a";
    for(let x=0;x<W;x+=8) vctx.fillRect(x,0,1,H);
    for(let y=0;y<H;y+=8) vctx.fillRect(0,y,W,1);
    vctx.globalAlpha = 1;
  }
  updateFrameThumb(cur);
}

   5. 入力
   ========================================================= */
let drawing = false, lastP = null, startP = null, smoothP = null, moveOrigin = null;
function toPix(e){
  const r = view.getBoundingClientRect();
  return {x:(e.clientX-r.left)/zoom, y:(e.clientY-r.top)/zoom};
}
view.addEventListener("pointerdown", e=>{
  if(e.button !== 0) return;
  view.setPointerCapture(e.pointerId);
  const p = toPix(e);
  if(tool === "pick"){ pickColor(p); return; }
  if(tool === "hand") return;
  pushUndo();
  drawing = true; startP = p; lastP = p; smoothP = {...p};
  const ctx = L().cv.getContext("2d");
  if(tool === "pen" || tool === "brush" || tool === "eraser"){
    stamp(ctx, p.x, p.y, tool==="brush"? penSize*2 : penSize, isErase());
  } else if(tool === "fill"){
    floodFill(L().cv, p.x, p.y); drawing = false;
  } else if(tool === "text"){
    drawing = false; placeText(p);
  } else if(tool === "shape"){
    tmp = newLayerCanvas();
  } else if(tool === "move"){
    moveOrigin = {snap: ctx.getImageData(0,0,W,H)};
  }
  redraw();
});
view.addEventListener("pointermove", e=>{
  if(!drawing) return;
  const p = toPix(e);
  const ctx = L().cv.getContext("2d");
  if(tool === "pen" || tool === "brush" || tool === "eraser"){
    let q = p;
    if(stabilizeOn){
      smoothP.x += (p.x - smoothP.x) * 0.42;
      smoothP.y += (p.y - smoothP.y) * 0.42;
      q = {x:smoothP.x, y:smoothP.y};
    }
    lineStamp(ctx, lastP.x, lastP.y, q.x, q.y, tool==="brush"? penSize*2 : penSize, isErase());
    lastP = q;
  } else if(tool === "shape"){
    const t = tmp.getContext("2d");
    t.clearRect(0,0,W,H);
    drawShapeInto(t, startP, p);
  } else if(tool === "move"){
    const dx = Math.round(p.x - startP.x), dy = Math.round(p.y - startP.y);
    ctx.clearRect(0,0,W,H);
    const off = newLayerCanvas();
    off.getContext("2d").putImageData(moveOrigin.snap,0,0);
    ctx.drawImage(off, dx, dy);
  }
  redraw();
});
addEventListener("pointerup", ()=>{
  if(!drawing) return;
  drawing = false;
  if(tool === "shape" && tmp){
    L().cv.getContext("2d").drawImage(tmp,0,0);
    tmp = null;
  }
  moveOrigin = null;
  redraw(); buildFrames();
});
function drawShapeInto(t, a, b){
  const prevFill = color;
  if(shape === "line") lineStamp(t, a.x,a.y,b.x,b.y, penSize, false);
  else if(shape === "rect"){
    lineStamp(t,a.x,a.y,b.x,a.y,penSize,false); lineStamp(t,b.x,a.y,b.x,b.y,penSize,false);
    lineStamp(t,b.x,b.y,a.x,b.y,penSize,false); lineStamp(t,a.x,b.y,a.x,a.y,penSize,false);
  }
  else if(shape === "rectf") fillRegion(t,a.x,a.y,b.x,b.y,"rectf");
  else if(shape === "ell")   ellipseOutline(t,a.x,a.y,b.x,b.y,penSize,false);
  else if(shape === "ellf")  fillRegion(t,a.x,a.y,b.x,b.y,"ellf");
  color = prevFill;
}
function pickColor(p){
  const off = newLayerCanvas();
  compose(off.getContext("2d"), F(), true);
  const d = off.getContext("2d").getImageData(Math.floor(p.x),Math.floor(p.y),1,1).data;
  setColor("#" + [d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,"0")).join(""));
}
function placeText(p){
  const s = prompt("文字を入力");
  if(!s) return;
  const size = Math.max(8, penSize*5);
  const off = newLayerCanvas();
  const o = off.getContext("2d");
  o.font = `bold ${size}px "Yu Gothic UI","Hiragino Sans",sans-serif`;
  o.textBaseline = "top";
  o.fillStyle = "#000";
  o.fillText(s, Math.round(p.x), Math.round(p.y));
  // アンチエイリアスを落として1bit化 → 現在色で描く
  const img = o.getImageData(0,0,W,H), d = img.data;
  const c = hexToRgba(color);
  for(let i=0;i<d.length;i+=4){
    if(d[i+3] > 110 && maskOK((i/4)%W, Math.floor(i/4/W))){
      d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2]; d[i+3]=255;
    } else d[i+3]=0;
  }
  o.putImageData(img,0,0);
  L().cv.getContext("2d").drawImage(off,0,0);
  redraw(); buildFrames();
}

/* ---- しあげ加工（ドット化フィルタ） ---- */
const BAYER8 = (()=>{               // 8x8 ベイヤー行列 0..63
  const m = [[0]];
  for(let s=1;s<8;s*=2){
    const n = m.length, o = [];
    for(let y=0;y<n*2;y++) o.push(new Array(n*2));
    for(let y=0;y<n;y++) for(let x=0;x<n;x++){
      const v = m[y][x]*4;
      o[y][x]=v; o[y][x+n]=v+2; o[y+n][x]=v+3; o[y+n][x+n]=v+1;
    }
    m.length = 0; o.forEach(r=>m.push(r));
  }
  return m;
})();
const PAL_RGB = PALETTE.filter(c=>c!=="#00000000").map(hexToRgba);

function fxOpts(){
  return {
    pixel: +document.getElementById("fxPixel").value,
    quant: document.getElementById("fxQuant").value,
    dither: document.getElementById("fxDither").classList.contains("on"),
    outline: document.getElementById("fxOutline").classList.contains("on"),
  };
}
function applyFx(cv, o){
  const ctx = cv.getContext("2d");
  // 1) モザイク（ドット化）: 縮小→等倍拡大
  if(o.pixel > 1){
    const sw = Math.max(1, Math.ceil(W/o.pixel)), sh = Math.max(1, Math.ceil(H/o.pixel));
    const small = document.createElement("canvas");
    small.width = sw; small.height = sh;
    const sx = small.getContext("2d");
    sx.imageSmoothingEnabled = true;          // 縮小時だけ平均化して色を拾う
    sx.drawImage(cv, 0,0, sw, sh);
    ctx.clearRect(0,0,W,H);
    ctx.imageSmoothingEnabled = false;        // 拡大は補間なし＝カクカクのドット
    ctx.drawImage(small, 0,0, sw*o.pixel, sh*o.pixel);
  }
  // 2) 減色 / 1bit / パレット寄せ（+ディザ）
  if(o.quant !== "0" || o.dither){
    const img = ctx.getImageData(0,0,W,H), d = img.data;
    const k = /^\d+$/.test(o.quant) ? +o.quant : 0;
    const step = k > 1 ? 255/(k-1) : 0;
    for(let y=0;y<H;y++){
      for(let x=0;x<W;x++){
        const i = (y*W+x)*4;
        if(d[i+3] < 24){ d[i+3] = 0; continue; }
        d[i+3] = 255;
        // ディザのゆらぎ量（-0.5..0.5 相当）
        const bias = o.dither ? (BAYER8[y&7][x&7]/64 - 0.5) : 0;
        if(o.quant === "mono"){
          const lum = .299*d[i] + .587*d[i+1] + .114*d[i+2] + bias*90;
          const v = lum < 140 ? 0 : 255;
          d[i]=d[i+1]=d[i+2]=v;
        } else if(o.quant === "pal"){
          let best = 0, bd = 1e9;
          const r = d[i]+bias*40, g = d[i+1]+bias*40, b = d[i+2]+bias*40;
          for(let p=0;p<PAL_RGB.length;p++){
            const c = PAL_RGB[p];
            const dd = (c[0]-r)**2 + (c[1]-g)**2 + (c[2]-b)**2;
            if(dd < bd){ bd = dd; best = p; }
          }
          const c = PAL_RGB[best];
          d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2];
        } else if(k > 1){
          for(let ch=0; ch<3; ch++){
            const v = d[i+ch] + bias*step;
            d[i+ch] = Math.max(0, Math.min(255, Math.round(v/step)*step));
          }
        }
      }
    }
    ctx.putImageData(img,0,0);
  }
  // 3) フチ取り: 不透明部分の外周1pxを線色で囲む
  if(o.outline){
    const img = ctx.getImageData(0,0,W,H), d = img.data;
    const a = new Uint8Array(W*H);
    for(let p=0;p<W*H;p++) a[p] = d[p*4+3] > 0 ? 1 : 0;
    const oc = hexToRgba("#20242a");
    for(let y=0;y<H;y++){
      for(let x=0;x<W;x++){
        const p = y*W+x;
        if(a[p]) continue;
        const near = (x>0&&a[p-1]) || (x<W-1&&a[p+1]) || (y>0&&a[p-W]) || (y<H-1&&a[p+W]);
        if(!near) continue;
        const i = p*4;
        d[i]=oc[0]; d[i+1]=oc[1]; d[i+2]=oc[2]; d[i+3]=255;
      }
    }
    ctx.putImageData(img,0,0);
  }
}
/* 加工は「見えているレイヤーを1枚に統合してから」かける。
   ドット化は合成後の絵にかけないと、レイヤー境界でドットの目がズレるため。 */
function fxFrame(f, o){
  const flat = newLayerCanvas();
  const fc = flat.getContext("2d");
  for(const l of f.layers){
    if(!l.visible) continue;
    fc.globalAlpha = l.alpha; fc.drawImage(l.cv,0,0);
  }
  fc.globalAlpha = 1;
  applyFx(flat, o);
  const hidden = f.layers.filter(l=>!l.visible);
  f.layers = [{name:"しあげ", visible:true, alpha:1, cv:flat}, ...hidden];
}

function cloneLayer(l, name){

function sendLayer(dir, copy){
  const src = L();
  if(!src) return;
  let dst = cur + dir;
  if(dst < 0){                        // 前が無ければ先頭に空コマを作る
    frames.unshift({layers:[]});
    cur++; dst = 0;
  } else if(dst >= frames.length){    // 後ろが無ければ末尾に空コマを作る
    frames.push({layers:[]});
    dst = frames.length-1;
  }
  pushUndo(true);
  frames[dst].layers.push(cloneLayer(src));
  if(!copy){
    F().layers.splice(curLayer,1);
    if(!F().layers.length) F().layers.push(newLayer("レイヤー1"));   // 空コマにしない
    curLayer = Math.max(0, Math.min(curLayer, F().layers.length-1));
  }
  // 移動先のコマへ付いていく（コピーは元コマに留まる）
  if(!copy){ cur = dst; curLayer = F().layers.length-1; }
  frames.forEach(f=>{ if(!f.layers.length) f.layers.push(newLayer("レイヤー1")); });
  buildLayers(); buildFrames(); redraw();
}

/* 全コマから最大256色のパレットを作る。
   ドット絵は色数が少ないので、256色以内ならそのまま使い、超えたら6×6×6の色キューブに寄せる */
function buildGifPalette(all){
  const set = new Map();
  for(const d of all){
    for(let i=0;i<d.length;i+=4){
      const key = (d[i]<<16)|(d[i+1]<<8)|d[i+2];
      if(!set.has(key)) set.set(key, set.size);
      if(set.size > 256) break;
    }
    if(set.size > 256) break;
  }
  if(set.size <= 256){
    const pal = [...set.keys()].map(k=>[(k>>16)&255,(k>>8)&255,k&255]);
    return {pal, exact:true, index:new Map([...set.keys()].map((k,n)=>[k,n]))};
  }
  const pal = [];
  const L = [0,51,102,153,204,255];
  for(const r of L) for(const g of L) for(const b of L) pal.push([r,g,b]);
  for(let i=0;i<40;i++){ const v = Math.round(i*255/39); pal.push([v,v,v]); }
  return {pal, exact:false};
}
function gifIndexer(P){
  if(P.exact){
    return d=>{
      const n = d.length/4, out = new Uint8Array(n);
      for(let i=0,p=0;i<d.length;i+=4,p++)
        out[p] = P.index.get((d[i]<<16)|(d[i+1]<<8)|d[i+2]) || 0;
      return out;
    };
  }
  const cache = new Map();
  return d=>{
    const n = d.length/4, out = new Uint8Array(n);
    for(let i=0,p=0;i<d.length;i+=4,p++){
      const key = (d[i]<<16)|(d[i+1]<<8)|d[i+2];
      let idx = cache.get(key);
      if(idx === undefined){
        let bd = 1e9;
        for(let c=0;c<P.pal.length;c++){
          const q = P.pal[c];
          const dd = (q[0]-d[i])**2 + (q[1]-d[i+1])**2 + (q[2]-d[i+2])**2;
          if(dd < bd){ bd = dd; idx = c; }
        }
        cache.set(key, idx);
      }
      out[p] = idx;
    }
    return out;
  };
}
/* GIFのLZW圧縮 */
function lzwEncode(minCode, pixels, out){
  const clear = 1 << minCode, eoi = clear + 1;
  let dict = new Map(), next = eoi + 1, size = minCode + 1;
  let cur = 0, curBits = 0;
  const block = [];
  const flush = ()=>{
    out.push(block.length);
    for(const b of block) out.push(b);
    block.length = 0;
  };
  const push = code=>{
    cur |= code << curBits; curBits += size;
    while(curBits >= 8){
      block.push(cur & 255); cur >>= 8; curBits -= 8;
      if(block.length === 255) flush();
    }
  };
  const reset = ()=>{ dict = new Map(); next = eoi + 1; size = minCode + 1; };
  push(clear); reset();
  let prev = pixels[0];
  for(let i=1;i<pixels.length;i++){
    const k = pixels[i], key = prev * 4096 + k;
    if(dict.has(key)){ prev = dict.get(key); continue; }
    push(prev);
    dict.set(key, next++);
    if(next > (1 << size)){
      if(size < 12) size++;
      else { push(clear); reset(); }
    }
    prev = k;
  }
  push(prev); push(eoi);
  if(curBits > 0){ block.push(cur & 255); if(block.length === 255) flush(); }
  if(block.length) flush();
  out.push(0);
}
function makeGif(delayCs){
  const all = frames.map((_,i)=> framePixels(i));
  const P = buildGifPalette(all);
  const toIdx = gifIndexer(P);
  let bits = 1;
  while((1 << bits) < P.pal.length) bits++;
  bits = Math.min(8, Math.max(1, bits));
  const size = 1 << bits;
  const out = [];
  const w16 = v=>{ out.push(v & 255, (v >> 8) & 255); };
  "GIF89a".split("").forEach(c=> out.push(c.charCodeAt(0)));
  w16(W); w16(H);
  out.push(0xF0 | (bits-1), 0, 0);
  for(let i=0;i<size;i++){
    const c = P.pal[i] || [0,0,0];
    out.push(c[0], c[1], c[2]);
  }
  out.push(0x21, 0xFF, 0x0B);
  "NETSCAPE2.0".split("").forEach(c=> out.push(c.charCodeAt(0)));
  out.push(3, 1, 0, 0, 0);                    // 無限ループ
  for(const d of all){
    out.push(0x21, 0xF9, 0x04, 0x04);         // 前のコマを残さない
    w16(delayCs); out.push(0, 0);
    out.push(0x2C); w16(0); w16(0); w16(W); w16(H); out.push(0);
    const minCode = Math.max(2, bits);
    out.push(minCode);
    lzwEncode(minCode, toIdx(d), out);
  }
  out.push(0x3B);
  return new Blob([new Uint8Array(out)], {type:"image/gif"});
}

    "video/webm;codecs=vp9",

}

addEventListener("keydown", e=>{
  if(e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;

  else {
    const map = {p:"pen",b:"brush",e:"eraser",g:"fill",u:"shape",t:"text",i:"pick",v:"move",h:"hand"};

  const dt = Math.min(1/30, (now-last)/1000); last = now;

  if(playing && frames.length > 1){
    playT += dt;
    if(playT >= 1/fps()){
      playT = 0;
      playI++;
      if(playI >= frames.length){
        if(loop) playI = 0;
        else { playI = frames.length-1; playing = false; document.getElementById("pPlay").textContent = "▶"; }
      }
      gotoFrame(playI);
    }
  }
  // プレビュー(常時ループ再生)
  prevT += dt;
  if(prevT >= 1/fps()){
    prevT = 0;
    prevI = (prevI+1) % frames.length;

  }
  requestAnimationFrame(loopFn);
}

<script src="../../haani-motion.js"></script>
<script>
/* =========================================================
   モバイル専用の上乗せ（本体JSのグローバルをそのまま使う）
   ========================================================= */
"use strict";

/* ---- ボトムシート ---- */
const sheet = document.getElementById("sheet");
const scrim = document.getElementById("scrim");
const secBtns = [...document.querySelectorAll(".secbtn")];
let openSec = null;

/* 位置は「開ききった状態からの下向きpx」。0=全開 / H=しまった状態。
   CSSのtransitionではなくバネで動かすので、途中で掴んで引き返せる。 */
const SCRIM_MAX = .25;
let sheetH = 1;
function measure(){ sheetH = Math.max(1, sheet.offsetHeight); }

const sy = HM.spring({
  from: 0,
  onUpdate(v){
    sheet.style.transform = `translateY(${v}px)`;
    scrim.style.opacity = String(SCRIM_MAX * Math.max(0, 1 - v / sheetH));
  },
  onRest(v){ if (v >= sheetH - .5) finishClose(); }
});

function finishClose(){
  scrim.classList.remove("on");
  secBtns.forEach(b=> b.classList.remove("on"));
  openSec = null;
}

function showSec(name){
  document.querySelectorAll(".sec").forEach(s=> s.classList.toggle("on", s.dataset.sec === name));
  document.getElementById("sheetTitle").textContent =
    secBtns.find(b=>b.dataset.sec === name).textContent.trim();
  secBtns.forEach(b=> b.classList.toggle("on", b.dataset.sec === name));
  scrim.classList.add("on");
  measure();
  if (openSec === null) sy.set(sheetH);   // 中身を入れ替えてから測って、下から出す
  openSec = name;
  sy.to(0, {damping:.85, response:.3});   // 引き出しは少しだけ跳ねる
}
function closeSheet(){
  measure();
  sy.to(sheetH, {damping:1, response:.3, velocity: sy.velocity});
}

/* ---- つまんで引き下げる ---- */
(function(){
  const head = document.getElementById("sheetHead");
  const track = HM.tracker();
  let grabbedAt = 0, dragging = false;

  head.addEventListener("pointerdown", e=>{
    if (e.target.closest("#sheetClose")) return;   // ✕は素直にボタンのまま
    head.setPointerCapture(e.pointerId);
    sy.stop();                                     // いま出ている値のまま止める
    grabbedAt = e.clientY - sy.value;              // 掴んだ位置のズレを保つ
    dragging = true;
    track.clear(); track.push(e.clientX, e.clientY);
  });

  head.addEventListener("pointermove", e=>{
    if (!dragging) return;
    track.push(e.clientX, e.clientY);
    let v = e.clientY - grabbedAt;
    if (v < 0) v = -HM.rubberband(-v, sheetH);     // 上へは引っぱるほど重くする
    sy.set(v);
  });

  function release(e){
    if (!dragging) return;
    dragging = false;
    const vy = track.vy();                          // 離した瞬間の速度 px/s
    const landing = sy.value + HM.project(vy);      // 勢いの行き先を予測して決める
    const close = landing > sheetH * .5;
    sy.to(close ? sheetH : 0, {
      velocity: vy,                                 // 速度をそのまま引き継ぐ
      damping: close ? 1 : .85, response: .3
    });
  }
  head.addEventListener("pointerup", release);
  head.addEventListener("pointercancel", release);
})();
secBtns.forEach(b=>{
  b.onclick = ()=> (openSec === b.dataset.sec) ? closeSheet() : showSec(b.dataset.sec);
});
document.getElementById("sheetClose").onclick = closeSheet;
scrim.onclick = closeSheet;

/* ---- ヘッダの再生ボタン ---- */
document.getElementById("mPlay").onclick = ()=>{
  document.getElementById("pPlay").click();
  document.getElementById("mPlay").textContent =
    document.getElementById("pPlay").textContent.trim() === "⏸" ? "⏸" : "▶";
};
/* ---- プレビュー窓の表示切替 ---- */
toggleSw("prevSw", true, v=> document.getElementById("previewBox").classList.toggle("off", !v));

/* ---- ピンチで拡大縮小 / 2本指ドラッグで移動 ---- */
const wrapM = document.getElementById("stagewrap");
const stageM = document.getElementById("stage");
let panX = 0, panY = 0;
function applyPan(){ stageM.style.transform = `translate(${panX}px,${panY}px)`; }
const pts = new Map();
let pinch = null;

wrapM.addEventListener("pointerdown", e=>{
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pts.size === 2){
    // 2本指になった時点で描画中のストロークは打ち切って取り消す
    if(drawing){ drawing = false; undo(); }
    const [a,b] = [...pts.values()];
    pinch = {d: Math.hypot(a.x-b.x, a.y-b.y), cx:(a.x+b.x)/2, cy:(a.y+b.y)/2,
             zoom0: zoom, panX0: panX, panY0: panY};
  }
}, {passive:false});
wrapM.addEventListener("pointermove", e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pts.size === 2 && pinch){
    const [a,b] = [...pts.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    const cx = (a.x+b.x)/2, cy = (a.y+b.y)/2;
    const k = Math.max(.35, Math.min(14, pinch.zoom0 * (d/Math.max(1,pinch.d))));
    if(Math.abs(k - zoom) > .01){ zoom = k; applySize(); }   // applySize が描き直す
    panX = pinch.panX0 + (cx - pinch.cx);
    panY = pinch.panY0 + (cy - pinch.cy);
    applyPan();
    e.preventDefault();
  }
}, {passive:false});
function onUp(e){
  pts.delete(e.pointerId);
  if(pts.size < 2) pinch = null;
}
addEventListener("pointerup", onUp);
addEventListener("pointercancel", onUp);

/* ダブルタップで画面に合わせる */
let lastTap = 0;
wrapM.addEventListener("pointerup", ()=>{
  const now = Date.now();
  if(now - lastTap < 300 && pts.size === 0){ panX = panY = 0; applyPan(); fitZoom(); }
  lastTap = now;
});
document.getElementById("zFit").addEventListener("click", ()=>{ panX = panY = 0; applyPan(); });

/* ---- フィット倍率をモバイル用に上書き ----
   PC版は整数倍のみだが、狭い画面だと1倍で余白だらけになるので端数も許す。
   端末のDPRが2〜3あるため、端数倍でもドットは十分くっきり出る。 */
fitZoom = function(){
  const r = wrapM.getBoundingClientRect();
  let z = Math.min((r.width-14)/W, (r.height-14)/H);
  z = z >= 2 ? Math.floor(z) : Math.max(.35, Math.round(z*20)/20);
  zoom = z;
  applySize();
};

/* ---- 画面サイズが変わったら合わせ直す ---- */
let fitTimer = null;
function refit(){
  clearTimeout(fitTimer);
  fitTimer = setTimeout(()=>{ panX = panY = 0; applyPan(); fitZoom(); }, 120);
}
addEventListener("orientationchange", refit);
addEventListener("resize", refit);
if(window.visualViewport) visualViewport.addEventListener("resize", refit);

fitZoom();
</script>
</body>
