<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#E1DD60">
<title>プロジェクト・ガーディアン</title>
<meta name="description" content="ドームを そだてて、夜だけ そとに 出て 灰を そうじして 発掘する、ほうっておいても すすむ ゲーム。">
<link rel="icon" type="image/png" href="../../../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --main:#E1DD60; --main-deep:#B8B43F; --main-soft:#F2F0BE;
  --cream:#FBFAEC; --paper:#FFFEF7; --ink:#1E1C14; --gray:#8A8470;
  --ok:#5BA85B; --warn:#E6A93C; --bad:#D8563F; --sky:#6FA8C7; --night:#2E3350;
  --bd:3px solid var(--ink); --r:16px;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0; color:var(--ink); background:#EDE9D6; font-size:15px; line-height:1.5;
  font-family:'M PLUS Rounded 1c','Noto Sans JP',sans-serif; font-weight:800;
  overscroll-behavior:none; -webkit-user-select:none; user-select:none}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer}
#app{position:relative; width:100%; max-width:430px; margin:0 auto; min-height:100dvh;
  background:var(--cream); display:flex; flex-direction:column; overflow:hidden; box-shadow:0 0 0 3px var(--ink)}
@media(min-width:460px){ body{padding:14px 0} #app{min-height:calc(100dvh - 28px); border-radius:22px} }
#app.night{background:#E6E4DE}

header{padding:calc(8px + var(--top)) 12px 7px; background:var(--main); border-bottom:var(--bd); flex:0 0 auto}
#app.night header{background:var(--night); color:#F4F2E4}
.hrow{display:flex; align-items:center; gap:8px}
.hrow .ttl{font-size:14px}
.hrow .ph{margin-left:auto; font-size:13px; background:var(--paper); color:var(--ink);
  border:2.5px solid var(--ink); border-radius:999px; padding:1px 11px}
.iconbtn{width:32px; height:32px; border:2.5px solid var(--ink); border-radius:50%; background:var(--paper);
  color:var(--ink); font-size:14px; display:grid; place-items:center; flex:0 0 auto}
.clock{height:8px; border:2.5px solid var(--ink); border-radius:999px; background:var(--paper);
  margin-top:6px; overflow:hidden}
.clock > i{display:block; height:100%; background:var(--main-deep); transition:width .3s linear}
#app.night .clock > i{background:#7C86C4}

.meters{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:7px 10px;
  background:var(--main-soft); border-bottom:var(--bd); flex:0 0 auto}
#app.night .meters{background:#D6D4CC}
.m{background:var(--paper); border:2.5px solid var(--ink); border-radius:12px; padding:3px 4px; text-align:center}
.m .e{font-size:16px; line-height:1.1}
.m .v{font-size:13px}
.m .bar{height:6px; border:2px solid var(--ink); border-radius:999px; background:#fff; overflow:hidden; margin-top:2px}
.m .bar > i{display:block; height:100%; background:var(--ok); transition:width .3s linear}
.m.mid .bar > i{background:var(--warn)} .m.low .bar > i{background:var(--bad)}

.tabs{display:flex; gap:5px; padding:7px 9px 0; flex:0 0 auto}
.tab{flex:1; border:2.5px solid var(--ink); border-bottom:0; border-radius:12px 12px 0 0;
  background:#E2DECB; padding:7px 2px; font-size:13px; text-align:center}
.tab.on{background:var(--paper); box-shadow:inset 0 -3px 0 var(--paper)}
.tab .dot{display:inline-block; width:9px; height:9px; background:var(--bad); border:2px solid var(--ink);
  border-radius:50%; margin-left:2px; vertical-align:1px}
main{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; border-top:var(--bd);
  background:var(--paper); padding:10px 10px 16px}
.sec{font-size:12px; color:var(--gray); margin:10px 0 6px}
.tip{font-size:12.5px; color:#4a4630; background:var(--main-soft); border:2.5px solid var(--ink);
  border-radius:12px; padding:8px 10px; margin-bottom:9px}

/* 施設カード */
.fac{border:2.5px solid var(--ink); border-radius:14px; background:var(--cream); padding:9px;
  margin-bottom:9px; box-shadow:3px 3px 0 var(--ink)}
.fac .r1{display:flex; align-items:center; gap:9px}
.fac .ico{width:44px; height:44px; border:2.5px solid var(--ink); border-radius:12px; background:var(--main-soft);
  display:grid; place-items:center; font-size:22px; flex:0 0 auto; position:relative}
.fac .ico .kid{position:absolute; right:-6px; bottom:-6px; font-size:15px}
.fac .nm{font-size:15px}
.fac .rate{font-size:12px; color:#4a4630}
.fac .who{font-size:11px; color:var(--gray)}
.fac .ico{cursor:pointer}
.fac .lv{margin-left:auto; font-size:12px; background:var(--paper); border:2.5px solid var(--ink);
  border-radius:999px; padding:1px 9px}
.fac .r2{display:flex; gap:6px; margin-top:8px}
.fac .r2 button{flex:1; border:2.5px solid var(--ink); border-radius:11px; background:var(--paper);
  padding:9px 4px; font-size:13px; box-shadow:0 3px 0 var(--ink)}
.fac .r2 button:active{transform:translateY(2px); box-shadow:0 1px 0 var(--ink)}
.fac .r2 .help{background:#8FD07A}
.fac .r2 button:disabled{opacity:.45; box-shadow:0 2px 0 var(--ink)}
.fac.buff{box-shadow:3px 3px 0 var(--ink), 0 0 0 3px #8FD07A inset}
.fac .sub{font-size:11px; display:block; font-weight:700}

/* エリア */
.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:7px}
.tile{position:relative; aspect-ratio:1; border:2.5px solid var(--ink); border-radius:12px; background:#B9B2A0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:2px 2px 0 var(--ink)}
.tile:active{transform:translate(2px,2px); box-shadow:0 0 0 var(--ink)}
.tile:disabled{opacity:.55; box-shadow:1px 1px 0 var(--ink)}
.tile .e{font-size:19px} .tile .p{font-size:12px}
.tile .n{position:absolute; left:3px; top:1px; font-size:10px; color:#fff; text-shadow:0 1px 0 #000}
.tile.mid{background:#A79D74} .tile.low{background:#8FA86B} .tile.pure{background:#7CC06A}

/* コレクション */
.rel{display:grid; grid-template-columns:repeat(3,1fr); gap:7px}
.relc{border:2.5px solid var(--ink); border-radius:12px; background:var(--cream); padding:8px 4px; text-align:center}
.relc.off{background:#E4E1D4; opacity:.65}
.relc .e{font-size:24px; display:block}
.relc .n{font-size:11px} .relc .s{font-size:10px; color:#4a4630}

footer{flex:0 0 auto; padding:9px 10px calc(9px + var(--bot)); background:var(--main); border-top:var(--bd); display:flex; gap:8px}
#app.night footer{background:var(--night)}
.big{flex:1; border:var(--bd); border-radius:14px; background:var(--paper); padding:13px 8px;
  font-size:16px; box-shadow:0 4px 0 var(--ink); text-align:center; color:var(--ink)}
.big:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
.big.go{background:#8FD07A} .big.night{background:#9AA3E0}
.big:disabled{opacity:.5; box-shadow:0 2px 0 var(--ink)}
.big .sub{display:block; font-size:11px; font-weight:700}

/* シート */
.sheet{position:absolute; inset:0; background:rgba(30,28,20,.55); display:flex; align-items:flex-end;
  justify-content:center; z-index:30}
.sheet.hide{display:none}
.sheet .box{width:100%; background:var(--paper); border-top:var(--bd); border-radius:20px 20px 0 0;
  padding:14px 12px calc(14px + var(--bot)); max-height:88%; overflow-y:auto; animation:up .18s ease-out}
@keyframes up{from{transform:translateY(26px)}}
.sheet h3{margin:0 0 4px; font-size:17px; text-align:center}
.sheet .lead{font-size:13px; color:#4a4630; text-align:center; margin:0 0 10px; font-weight:700}
.close{width:100%; margin-top:9px; border:2.5px solid var(--ink); border-radius:13px; background:var(--cream);
  padding:11px; font-size:15px; box-shadow:0 3px 0 var(--ink)}

/* ミニゲーム */
#mg{position:absolute; inset:0; z-index:38; background:#F4F1E0; display:flex; flex-direction:column}
#mg.hide{display:none}
#mg.dark{background:#232842; color:#F4F2E4}
#mg .bar{padding:calc(8px + var(--top)) 12px 8px; border-bottom:var(--bd); background:var(--main); flex:0 0 auto}
#mg.dark .bar{background:var(--night); color:#F4F2E4}
#mg .bar .t1{display:flex; align-items:center; gap:8px; font-size:14px}
#mg .bar .t2{font-size:12px; font-weight:700; margin-top:2px}
#mg .time{height:9px; border:2.5px solid var(--ink); border-radius:999px; background:var(--paper); margin-top:6px; overflow:hidden}
#mg .time > i{display:block; height:100%; background:var(--bad); width:100%}
#mg .field{flex:1 1 auto; position:relative; overflow:hidden; padding:10px}
#mg .foot{padding:9px 12px calc(9px + var(--bot)); border-top:var(--bd); background:var(--main); flex:0 0 auto}
#mg.dark .foot{background:var(--night)}

.target{position:absolute; width:62px; height:62px; border:2.5px solid var(--ink); border-radius:50%;
  background:var(--paper); display:grid; place-items:center; font-size:28px; box-shadow:2px 2px 0 var(--ink)}
.target.gone{opacity:0; transform:scale(.4); transition:.15s}
.cells{display:grid; gap:6px; height:100%}
.cell{border:2.5px solid var(--ink); border-radius:10px; background:#9E9683; display:grid; place-items:center;
  font-size:22px; box-shadow:2px 2px 0 var(--ink)}
.cell.done{background:#CFCBB4; box-shadow:none; font-size:15px}
.cell.dig{background:#8A7A5E}
.cell.dug{background:#D9D2BC; box-shadow:none}
.wires{display:flex; justify-content:space-between; height:100%; align-items:center; padding:0 6px}
.wcol{display:flex; flex-direction:column; gap:14px; width:78px}
.wire{height:50px; border:2.5px solid var(--ink); border-radius:10px; box-shadow:2px 2px 0 var(--ink)}
.wire.on{outline:4px solid var(--ink); outline-offset:2px}
.wire.done{opacity:.35; box-shadow:none}
.seq{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; height:100%}
.seq button{border:2.5px solid var(--ink); border-radius:12px; background:var(--paper); font-size:26px;
  box-shadow:2px 2px 0 var(--ink)}
.seq button.done{background:#8FD07A; opacity:.5}

/* ものがたり */
#story{position:absolute; inset:0; z-index:40; background:#2A2718; display:flex; flex-direction:column;
  justify-content:flex-end; padding:0 0 calc(18px + var(--bot))}
#story.hide{display:none}
#story .art{flex:1; display:grid; place-items:center; padding:16px}
#story .art svg{width:100%; max-width:290px; height:auto}
#story .bubble{margin:0 14px; border:var(--bd); border-radius:16px; background:var(--paper); color:var(--ink);
  padding:14px; font-size:15px; line-height:1.7; min-height:104px}
#story .who{font-size:12px; color:var(--gray); margin-bottom:3px}
#story .next{text-align:right; font-size:12px; color:#9a957f; margin:6px 20px 0}

#title{position:absolute; inset:0; z-index:45; background:var(--main); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:12px; padding:22px}
#title.hide{display:none}
#title svg{width:74%; max-width:240px; height:auto}
#title h1{font-size:24px; margin:0; text-align:center; line-height:1.3}
#title .sub{font-size:13px; font-weight:700; text-align:center; color:#4a4630; margin:-4px 0 0}
#title .big{max-width:250px; width:100%; flex:0 0 auto}
.hide{display:none}
.fin{text-align:center} .fin .em{font-size:46px}
.toast{position:absolute; left:50%; bottom:84px; transform:translateX(-50%); background:#1E1C14; color:#FFFEF7;
  padding:8px 16px; border-radius:999px; font-size:13px; z-index:36; white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <span class="ttl">プロジェクト・ガーディアン</span>
      <span class="ph" id="phase">☀️ ひる</span>
      <button class="iconbtn" id="btnMenu">☰</button>
    </div>
    <div class="clock"><i id="clockBar" style="width:0%"></i></div>
  </header>

  <div class="meters" id="meters"></div>

  <div class="tabs">
    <button class="tab on" data-tab="dome">🏠 ドーム</button>
    <button class="tab" data-tab="out">🌙 そと<span class="dot hide" id="dotOut"></span></button>
    <button class="tab" data-tab="rel">📦 おたから</button>
  </div>

  <main id="main"></main>

  <footer id="footer"></footer>

  <div class="sheet hide" id="sheet"><div class="box" id="sheetBox"></div></div>

  <div id="mg" class="hide">
    <div class="bar">
      <div class="t1"><span id="mgTitle"></span><span style="margin-left:auto" id="mgScore"></span></div>
      <div class="t2" id="mgHelp"></div>
      <div class="time"><i id="mgTime"></i></div>
    </div>
    <div class="field" id="mgField"></div>
    <div class="foot"><button class="big" id="mgQuit">やめる</button></div>
  </div>

  <div id="story" class="hide">
    <div class="art" id="storyArt"></div>
    <div class="bubble"><div class="who" id="storyWho"></div><div id="storyText"></div></div>
    <div class="next">タップで つぎへ ▶</div>
  </div>

  <div id="title">
    <svg viewBox="0 0 240 170" aria-hidden="true">
      <rect x="6" y="132" width="228" height="34" rx="8" fill="#8FA86B" stroke="#1E1C14" stroke-width="4"/>
      <path d="M44 138 A78 78 0 0 1 196 138 Z" fill="#FFFEF7" fill-opacity=".85" stroke="#1E1C14" stroke-width="5" stroke-linejoin="round"/>
      <path d="M120 58 V138 M76 76 A78 78 0 0 0 66 114 M164 76 A78 78 0 0 1 174 114" stroke="#1E1C14" stroke-width="3" fill="none" opacity=".4"/>
      <text x="100" y="128" font-size="20" text-anchor="middle">👦</text>
      <text x="142" y="128" font-size="20" text-anchor="middle">👧</text>
      <g fill="#5BA85B"><circle cx="28" cy="132" r="9"/><circle cx="214" cy="130" r="11"/></g>
      <g fill="#1E1C14" opacity=".22"><circle cx="30" cy="28" r="14"/><circle cx="46" cy="24" r="11"/><circle cx="202" cy="38" r="16"/></g>
    </svg>
    <h1>プロジェクト<br>ガーディアン</h1>
    <p class="sub">ひるは ドームの しごと、<br>よるは そとで 灰そうじと 発掘。</p>
    <button class="big go" id="btnStart">はじめる ▶</button>
    <button class="big" id="btnSkip" style="flex:0 0 auto; width:180px; font-size:13px">おはなしを とばす</button>
  </div>
</div>

<script>
/* ══════════════ データ ══════════════ */
const DAY_SEC = 100, NIGHT_SEC = 70;
const SAVE_KEY = "pg_idle_v1";
const AREAS = ["はいきょ通り","かれた池","さびた鉄橋","もりの入口","風の丘",
               "しずんだ駅","ガラスの谷","ふるい温室","ひかりの岸","そらの広場"];
const AREA_STORY = [
  "はいきょの すきまから、ちいさな 草が 顔を 出した。",
  "池に みずが もどって、かえるが ないた。",
  "鉄橋に つたが まきついて、みどりの はしに なった。",
  "もりの 入口に、しかの おやこが きた。",
  "丘の 風が、やっと つめたくなくなった。",
  "駅の ホームに、たんぽぽが ならんで さいた。",
  "ガラスの かけらの あいだに、花が さいた。",
  "ふるい 温室に、トマトが ひとつ みのった。",
  "岸べに ちょうちょが もどってきた。",
  "そらの 広場から、ひさしぶりに 青い そらが 見えた。"
];
const FACS = [
  {id:"farm",   e:"🌾", kid:"👦", n:"はたけ",       res:"food",   rate:0.55, game:"water", gn:"みずやり"},
  {id:"power",  e:"⚡", kid:"👩‍🔧", n:"はつでんき",   res:"power",  rate:0.60, game:"wire",  gn:"はいせん つなぎ"},
  {id:"garden", e:"🌿", kid:"👧", n:"しょくぶつえん", res:"oxygen", rate:0.55, game:"bug",   gn:"むしとり"},
  {id:"filter", e:"🌀", kid:"🧒", n:"ろかそうち",    res:"metal",  rate:0.30, game:"dust",  gn:"フィルター そうじ"}
];
const RES_E = {food:"🍞", power:"⚡", oxygen:"💨", metal:"🔩"};
const KIDS = [
  {id:"noa",  face:"🧑‍🚀", n:"ノア", spec:"night",  sn:"そとの しごとが とくい"},
  {id:"riku", face:"👦",   n:"リク", spec:"farm",   sn:"はたけが とくい"},
  {id:"mio",  face:"👧",   n:"ミオ", spec:"garden", sn:"しょくぶつが とくい"},
  {id:"sena", face:"👩‍🔧", n:"セナ", spec:"power",  sn:"きかいが とくい"},
  {id:"yui",  face:"👩‍🔬", n:"ユイ", spec:"filter", sn:"ろかそうちが とくい"}
];
const KID = id => KIDS.find(k=>k.id===id);
const RELICS = [
  {id:"radio",  e:"📻", n:"ふるいラジオ",   s:"みんなの やる気 +5%", t:"むかしの ラジオだ。ざーっと いう おとの あいだに、うたが きこえた。"},
  {id:"solar",  e:"🔆", n:"たいようでんち", s:"でんき +15%",         t:"ひびわれた たいようでんち。まだ ちゃんと はたらくみたい。"},
  {id:"seed",   e:"🥫", n:"たねの かんづめ", s:"たべもの +15%",       t:"かんの なかは たね。100年 ねむっていた たねが、まだ 生きていた。"},
  {id:"mask",   e:"😷", n:"ふるいマスク",   s:"よるの じかん +10びょう", t:"しっかりした マスク。これなら もっと ながく そとに いられる。"},
  {id:"broom",  e:"🧹", n:"てつのほうき",   s:"灰そうじ 1かいで 2ますぶん", t:"かたい てつの ほうき。灰を ざっと はらえる。"},
  {id:"shovel", e:"⛏", n:"おおきなスコップ", s:"はっくつが 2かい ふえる", t:"おおきな スコップ。もっと ふかく ほれそうだ。"},
  {id:"lamp",   e:"🏮", n:"てらすランプ",   s:"よるの みつけやすさ アップ", t:"あかりが つくと、灰の むこうが すこし 見えた。"},
  {id:"book",   e:"📗", n:"しょくぶつずかん", s:"さんそ +15%",        t:"やぶれた ずかん。むかしの 木の なまえが ならんでいる。"},
  {id:"gear",   e:"⚙️", n:"きかいの はぐるま", s:"ろかそうち +25%",     t:"きれいな はぐるま。ろかそうちが すこし しずかに なった。"},
  {id:"bike",   e:"🚲", n:"さびた じてんしゃ", s:"はっくつの おたから +",  t:"さびた じてんしゃ。なおせば、とおくまで ほりに いける。"},
  {id:"doll",   e:"🧸", n:"くまの ぬいぐるみ", s:"みんなの やる気 +10%",  t:"だれかの たからもの だったんだね、と ミオが そっと ほこりを はらった。"},
  {id:"photo",  e:"🖼", n:"いちまいの しゃしん", s:"ぜんぶの しごと +10%", t:"うつっているのは、みどりの まち。ここは、むかし こんな ばしょ だった。"}
];
const RELIC = id => RELICS.find(r=>r.id===id);

const ART = {
  dome:`<svg viewBox="0 0 240 160"><rect width="240" height="160" fill="#3A3520"/><rect x="0" y="118" width="240" height="42" fill="#5A5236"/>
    <path d="M50 122 A72 72 0 0 1 190 122 Z" fill="#F2F0BE" fill-opacity=".9" stroke="#1E1C14" stroke-width="5"/>
    <g fill="#1E1C14" opacity=".35"><circle cx="34" cy="34" r="16"/><circle cx="54" cy="30" r="12"/><circle cx="196" cy="42" r="18"/></g>
    <text x="100" y="114" font-size="18" text-anchor="middle">👦</text><text x="140" y="114" font-size="18" text-anchor="middle">👧</text></svg>`,
  night:`<svg viewBox="0 0 240 160"><rect width="240" height="160" fill="#232842"/>
    <circle cx="196" cy="34" r="16" fill="#F2F0BE"/><g fill="#F2F0BE"><circle cx="40" cy="30" r="2"/><circle cx="80" cy="50" r="2"/><circle cx="140" cy="26" r="2"/><circle cx="60" cy="78" r="2"/></g>
    <rect x="0" y="120" width="240" height="40" fill="#4A4430"/>
    <text x="70" y="136" font-size="22" text-anchor="middle">🧹</text><text x="150" y="136" font-size="22" text-anchor="middle">⛏</text>
    <path d="M0 120 H240" stroke="#F4F2E4" stroke-width="3" opacity=".5"/></svg>`,

function save(){

function load(){

/* ボーナス */
const hasR = id => S.relics.includes(id);
function mult(res){
  let m=1;
  if(hasR("photo")) m*=1.10;
  if(hasR("radio")) m*=1.05;
  if(hasR("doll"))  m*=1.10;
  if(res==="power"  && hasR("solar")) m*=1.15;
  if(res==="food"   && hasR("seed"))  m*=1.15;
  if(res==="oxygen" && hasR("book"))  m*=1.15;
  if(res==="metal"  && hasR("gear"))  m*=1.25;
  return m;
}
function kidBonus(facId){
  const k=KID(S.assign[facId]);
  if(!k) return 0.6;                 // だれも いなくても すこしは すすむ
  return k.spec===facId ? 1.7 : 1.15; // とくいな しごとなら もっと
}
function facRate(f){
  const st=S.fac[f.id];
  const buff = st.buff>now() ? 2 : 1;
  return f.rate * st.lv * mult(f.res) * buff * kidBonus(f.id);
}
function useRate(){ // 1びょうあたりの しょうひ
  return {oxygen:0.35, power:0.4, food:0.35};
}
function netRate(res){
  let g=0;
  FACS.forEach(f=>{ if(f.res===res) g+=facRate(f); });
  const u=useRate()[res]||0;
  return g-u;
}
function upCost(id){ return Math.round(18*Math.pow(1.55, S.fac[id].lv-1)); }
const phase = () => (S.clock % (DAY_SEC+NIGHT_SEC)) < DAY_SEC ? "day" : "night";
function phaseLeft(){
  const c=S.clock%(DAY_SEC+NIGHT_SEC);
  return phase()==="day" ? DAY_SEC-c : DAY_SEC+NIGHT_SEC-c;
}
function nightSec(){
  const k=KID(S.assign.night);
  return 18 + (hasR("mask")?10:0) + (k&&k.spec==="night"?6:0);
}
function broomPower(){
  const k=KID(S.assign.night);
  return (hasR("broom")?2:1) + (k&&k.spec==="night"?1:0);
}
function digCount(){
  const k=KID(S.assign.night);
  return 6 + (hasR("shovel")?2:0) + (k&&k.spec==="night"?2:0);
}
const greenCount = () => S.areas.filter(a=>a.green).length;

/* ══════════════ すすむ ══════════════ */
function advance(sec){
  if(sec<=0) return;
  const u=useRate();
  ["oxygen","power","food"].forEach(r=>{
    let g=0; FACS.forEach(f=>{ if(f.res===r) g+=facRate(f); });
    S.res[r] = clamp(S.res[r] + (g-u[r])*sec, 0, 100);
  });
  let m=0; FACS.forEach(f=>{ if(f.res==="metal") m+=facRate(f); });
  S.res.metal += m*sec;
  const before=phase();
  S.clock += sec;
  if(before!=="night" && phase()==="night"){ S.digLeft = digCount(); S.nightUsed=false; }
  if(S.tower>0 && S.tower<100) S.tower = clamp(S.tower + sec*2, 0, 100);
}

function tick(){
  const t=now(); const dt=Math.min((t-S.t)/1000, 2); S.t=t;
  const wasPhase=phase();
  advance(dt);
  updateLive();
  if(wasPhase!==phase()){ render(); flash(phase()==="night"?"🌙 よるに なった。そとに 出られるよ":"☀️ あさが きた"); }
  if(S.tower>=100 && !S.seenWin){ S.seenWin=true; win(); }
}

function render(){

}

function drawMeters(){

    const v=S.res[r];
    return `<div class="m" id="m-${r}"><div class="e">${RES_E[r]}</div><div class="v"><b id="v-${r}">0</b></div>
      <div class="bar"><i id="b-${r}" style="width:0%"></i></div></div>`;
  }).join("") + `<div class="m"><div class="e">🔩</div><div class="v"><b id="v-metal">0</b></div>
      <div class="bar" style="border-color:transparent; background:none"></div></div>`;
}

function updateLive(){
  ["oxygen","power","food"].forEach(r=>{
    const v=S.res[r], el=$("#v-"+r), b=$("#b-"+r), m=$("#m-"+r);
    if(!el) return;
    el.textContent=Math.floor(v);
    b.style.width=v+"%";
    m.className = "m " + (v<20?"low":v<45?"mid":"");
  });
  const mv=$("#v-metal"); if(mv) mv.textContent=Math.floor(S.res.metal);
  const cb=$("#clockBar");
  if(cb){
    const total=phase()==="day"?DAY_SEC:NIGHT_SEC;
    cb.style.width=(100*(1-phaseLeft()/total))+"%";
  }
  // 施設の 数字
  FACS.forEach(f=>{
    const e=$("#rate-"+f.id); if(!e) return;
    e.innerHTML = `${RES_E[f.res]} ${facRate(f).toFixed(1)} /びょう` + (S.fac[f.id].buff>now()?" 🔥×2":"");
    const c=$("#cool-"+f.id);
    if(c){
      const left=Math.ceil((S.fac[f.id].cool-now())/1000);
      c.disabled = left>0 || phase()!=="day";
      c.innerHTML = phase()!=="day" ? `🌙 よるは おやすみ` :
        left>0 ? `⏳ ${left}びょう` : `🎮 ${f.gn}<span class="sub">てつだうと ドンと ふえる</span>`;
    }
    const u=$("#up-"+f.id);
    if(u){ const c2=upCost(f.id); u.disabled = S.res.metal<c2;
      u.innerHTML = `⬆️ レベルアップ<span class="sub">🔩 ${c2}</span>`; }
    const card=$("#fac-"+f.id); if(card) card.classList.toggle("buff", S.fac[f.id].buff>now());
  });
  const dg=$("#digLeft"); if(dg) dg.textContent=S.digLeft;
}

  const c=upCost(id);

  S.res.metal-=c; S.fac[id].lv++;

}

  if(S.res.metal<200||S.relics.length<5) return;

  story([{art:"tower", who:"ユイ", t:"さいせいタワー、けんせつ かいし！\nあと すこしで せかいが かわるよ。"}], render);
}
function flash(t){

}
function openSheet(html){ $("#sheetBox").innerHTML=html; $("#sheet").classList.remove("hide"); }

/* ══════════════ ミニゲーム ══════════════ */
function openMG(o){
  MG={score:0, end:o.time, t0:now(), kind:o.kind, dark:!!o.dark, finish:o.finish};
  $("#mg").classList.remove("hide");
  $("#mg").classList.toggle("dark", !!o.dark);
  $("#mgTitle").textContent=o.title;
  $("#mgHelp").textContent=o.help;
  $("#mgField").innerHTML="";
  $("#mgScore").textContent="";
  o.build($("#mgField"));
  MG.timer=setInterval(()=>{
    const left=MG.end-(now()-MG.t0)/1000;
    $("#mgTime").style.width=clamp(left/MG.end*100,0,100)+"%";
    if(left<=0) endMG();
  },100);
}
function scoreMG(n){ MG.score+=n; $("#mgScore").textContent="⭐ "+MG.score; }
function endMG(){
  if(!MG) return;
  clearInterval(MG.timer);
  const m=MG; MG=null;
  $("#mg").classList.add("hide");
  $("#mgField").innerHTML="";
  m.finish(m.score);
  save();
}
$("#mgQuit").onclick=endMG;

/* まとあて（みずやり・むしとり・ほこり） */
function tapGame(cfg){
  openMG({
    title:cfg.title, help:cfg.help, time:cfg.time, dark:cfg.dark,
    build(field){
      let live=0;
      const spawn=()=>{
        if(!MG) return;
        const el=document.createElement("button");
        el.className="target"; el.textContent=cfg.emoji[rnd(cfg.emoji.length)];
        const w=field.clientWidth-72, h=field.clientHeight-72;
        el.style.left=(10+rnd(Math.max(1,w)))+"px";
        el.style.top =(10+rnd(Math.max(1,h)))+"px";
        el.onclick=()=>{ el.classList.add("gone"); setTimeout(()=>el.remove(),150); live--; scoreMG(1); setTimeout(spawn, 120+rnd(260)); };
        field.appendChild(el); live++;
        setTimeout(()=>{ if(el.isConnected){ el.remove(); live--; setTimeout(spawn,200); } }, 1500+rnd(900));
      };
      for(let i=0;i<cfg.n;i++) setTimeout(spawn, i*200);
    },
    finish:cfg.finish
  });
}

/* はいせん つなぎ */
function wireGame(finish){
  const cols=["#D8563F","#E6A93C","#5BA85B","#6FA8C7","#B07BC4"];
  openMG({
    title:"⚡ はいせん つなぎ", help:"おなじ 色を 左→右の じゅんに タップ", time:22, dark:false,
    build(field){
      const order=[0,1,2,3,4].sort(()=>Math.random()-.5);
      field.innerHTML=`<div class="wires"><div class="wcol" id="wl"></div><div class="wcol" id="wr"></div></div>`;
      const L=field.querySelector("#wl"), R=field.querySelector("#wr");
      let sel=null;
      cols.forEach((c,i)=>{
        const b=document.createElement("button"); b.className="wire"; b.style.background=c; b.dataset.c=i;
        b.onclick=()=>{ if(b.classList.contains("done")) return;
          L.querySelectorAll(".wire").forEach(x=>x.classList.remove("on")); b.classList.add("on"); sel=b; };
        L.appendChild(b);
      });
      order.forEach(i=>{
        const b=document.createElement("button"); b.className="wire"; b.style.background=cols[i]; b.dataset.c=i;
        b.onclick=()=>{
          if(!sel||b.classList.contains("done")) return;
          if(sel.dataset.c===b.dataset.c){
            sel.classList.add("done"); sel.classList.remove("on"); b.classList.add("done");
            sel=null; scoreMG(1);
            if(MG.score>=5) setTimeout(endMG,250);
          }else{ b.animate([{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"none"}],140); }
        };
        R.appendChild(b);
      });
    },
    finish
  });
}

/* 灰そうじ */
function startAsh(i){
  const a=S.areas[i]; if(a.green) return;
  ashGameFor(i, broomPower());
}
function ashGameFor(i, power){
  const a=S.areas[i];
  openMG({
    title:`🧹 ${a.n} の 灰そうじ`, help:"灰の ますを タップして はらう", time:nightSec(), dark:true,
    build(field){
      field.innerHTML=`<div class="cells" id="cs" style="grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(7,1fr)"></div>`;
      const cs=field.querySelector("#cs");
      for(let k=0;k<35;k++){
        const b=document.createElement("button"); b.className="cell"; b.textContent="🌫";
        b.onclick=()=>{ if(b.classList.contains("done")) return;
          b.classList.add("done"); b.textContent=["🪨","🌱","🕳","🍂"][rnd(4)]; scoreMG(1); };
        cs.appendChild(b);
      }
    },
    finish(sc){
      const cleaned=sc*power;
      const before=a.ash;
      a.ash=clamp(a.ash-cleaned,0,100);
      S.res.metal += Math.round(sc*0.6);
      let msg=`灰を ${cleaned}% はらった（🔩+${Math.round(sc*0.6)}）`;
      if(a.ash<=0 && !a.green){
        a.green=true;
        story([{art:"green", who:"", t:AREA_STORY[i]}], ()=>{ render(); });
        msg=`${a.n}が みどりに もどった！`;
      }
      render(); flash(msg);
    }
  });
}

/* はっくつ */
function startDig(){
  if(S.digLeft<=0){ flash("こんやは もう ほれない。つぎの よるに また ほろう"); return; }
  const digs=S.digLeft;
  openMG({
    title:"⛏ はっくつ", help:`ますを タップして ほる（のこり ${digs}かい）`, time:40, dark:true,
    build(field){
      field.innerHTML=`<div class="cells" id="cs" style="grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(4,1fr)"></div>`;
      const cs=field.querySelector("#cs");
      let left=digs;
      const missing=RELICS.filter(r=>!hasR(r.id));
      for(let k=0;k<12;k++){
        const b=document.createElement("button"); b.className="cell dig"; b.textContent="⬛";
        b.onclick=()=>{
          if(b.classList.contains("dug")||left<=0) return;
          b.classList.add("dug"); left--; S.digLeft--;
          const chance = 0.16 + (hasR("lamp")?0.08:0) + (hasR("bike")?0.06:0);
          if(missing.length && Math.random()<chance){
            const r=missing.splice(rnd(missing.length),1)[0];
            S.relics.push(r.id); b.textContent=r.e;
            scoreMG(0);
            setTimeout(()=>{ endMG(); story([{art:"relic", who:"", t:`${r.e} ${r.n} を 見つけた！\n\n${r.t}\n\n（${r.s}）`}], ()=>{ render(); }); },300);
            return;
          }
          const m=3+rnd(6)+(hasR("bike")?2:0);
          S.res.metal+=m; b.textContent="🔩"+m; scoreMG(m);
          $("#mgHelp").textContent=`ますを タップして ほる（のこり ${left}かい）`;
          if(left<=0) setTimeout(endMG,400);
        };
        cs.appendChild(b);
      }
    },
    finish(sc){ render(); if(sc) flash(`🔩 ${sc} 手に入れた`); }
  });
}

/* 施設ミニゲーム */
function startFacGame(id){
  if(phase()!=="day") return;
  const f=FACS.find(x=>x.id===id);
  if(S.fac[id].cool>now()) return;
  const done = sc => {
    S.fac[id].cool = now()+40000;
    S.fac[id].buff = now()+60000;
    if(f.res==="metal") S.res.metal += sc*2;
    else S.res[f.res] = clamp(S.res[f.res] + sc*2.2, 0, 100);
    render();
    flash(`よく できた！ ${RES_E[f.res]}+${Math.round(sc*2.2)}　60びょう 2ばい 🔥`);
  };
  if(id==="power") return wireGame(done);
  if(id==="farm")  return tapGame({title:"🌾 みずやり", help:"めが 出たら タップして みずを あげよう",
    time:16, n:3, emoji:["🌱","🌿","🌾"], finish:done});
  if(id==="garden")return tapGame({title:"🌿 むしとり", help:"はっぱの むしを タップ",
    time:16, n:3, emoji:["🐛","🦗","🐌"], finish:done});
  if(id==="filter")return tapGame({title:"🌀 フィルターそうじ", help:"ほこりを タップして とる",
    time:16, n:4, emoji:["💨","🌫","🕸"], finish:done});
}

/* ══════════════ ものがたり ══════════════ */
function story(pages, after){
  QUEUE=pages; QI=0; AFTER=after||null;
  $("#story").classList.remove("hide"); showPage();
}
function showPage(){
  const p=QUEUE[QI];
  $("#storyArt").innerHTML=ART[p.art]||"";
  $("#storyWho").textContent=p.who||"";
  $("#storyText").innerHTML=(p.t||"").replace(/\n/g,"<br>");
}
$("#story").onclick=()=>{
  QI++;
  if(QI>=QUEUE.length){ $("#story").classList.add("hide"); const f=AFTER; AFTER=null; if(f) f(); }
  else showPage();
};

function win(){
  story([
    {art:"tower", who:"", t:"さいせいタワーが 光りはじめた。"},
    {art:"green", who:"ノア", t:"見て！ そとの せかいが みどりに なっていくよ！"},
    {art:"green", who:"", t:"きみたちは、せかいを もとに もどした。\n\n── クリア！ ──"}
  ], ()=>{
    openSheet(`<div class="fin"><div class="em">🌳🎉🌳</div><h3>クリア！</h3>
      <p class="lead">おたから ${S.relics.length} / ${RELICS.length}こ<br>そのまま あそびつづけても いいよ。</p></div>
      <button class="close" id="btnCl" style="background:#8FD07A">つづける</button>`);
    $("#btnCl").onclick=closeSheet;
  });
}

/* ══════════════ メニュー ══════════════ */
$("#btnMenu").onclick=()=>openSheet(`
  <h3>あそびかた</h3>
  <div class="tip">☀️ <b>ひる（${DAY_SEC}びょう）</b><br>ドームの 4つの しごとが、ほうっておいても すすむ。
    🎮 ボタンで ミニゲームを すると ドンと ふえて、60びょう 2ばいに なる。<br>🔩で レベルアップ すると もっと はやい。</div>
  <div class="tip">🌙 <b>よる（${NIGHT_SEC}びょう）</b><br>そとに 出られる。エリアの 灰を そうじすると、灰が 0%で みどりに もどる。
    じめんを ほると 🔩 と むかしの ものが 出る。</div>
  <div class="tip">👦 <b>なかま（5人）</b><br>ひとりずつ とくいな しごとが ある。しせつの 顔アイコンを タップして、だれに まかせるか きめよう。とくいな しごとなら ×1.7。<br>よるは 「だれと いく？」で ひとり つれていく。</div>
  <div class="tip">🎯 <b>めざすこと</b><br>10エリアを ぜんぶ みどりに して、🔩200 と 📦5こで さいせいタワーを 立てる。</div>
  <div class="tip">💾 とちゅうで とじても、つづきから あそべる（じかんも すすんでいる）。</div>
  <button class="close" id="btnReset">はじめから やりなおす</button>
  <button class="close" id="btnCloseSheet">とじる</button>`);
$("#sheet").addEventListener("click", e=>{
  if(e.target.id==="btnCloseSheet") closeSheet();
  if(e.target.id==="btnReset"){
    closeSheet();
    try{ localStorage.removeItem(SAVE_KEY); }catch(err){}
    S=newState(); TAB="dome"; setTab();
    $("#title").classList.remove("hide");
  }
});

/* ══════════════ きどう ══════════════ */
function boot(){
  const saved=load();
  if(saved){
    S=saved;
    const away=clamp((now()-S.t)/1000, 0, 60*60*8);
    advance(away);
    S.t=now();
    $("#title").classList.add("hide");
    setTab();
    if(away>60){
      const h=Math.floor(away/3600), m=Math.floor(away%3600/60);
      setTimeout(()=>flash(`おかえり！ ${h?h+"じかん":""}${m}ふん ぶん すすんでいたよ`), 400);
    }
  }else{
    S=newState(); render();
  }
  clearInterval(LOOP);
  LOOP=setInterval(()=>{ tick(); }, 250);
  setInterval(save, 5000);
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden) save(); else { S.t=now(); } });
  window.addEventListener("pagehide", save);
}
$("#btnStart").onclick=()=>{ $("#title").classList.add("hide"); S.started=true; story(PROLOGUE, render); };
$("#btnSkip").onclick=()=>{ $("#title").classList.add("hide"); S.started=true; render(); };
boot();
</script>
