<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="文字も写真も好きな場所に置けるノート。手書き・月間予定表・公開ページつき。">
<title>ノート | HAANI LAB</title>
</head>
<body>
<title>ノート</title>

<style>
:root{
  /* 机まわり：iOS のシステムカラーに寄せた並び */
  --bg:#F2F2F7; --bg-2:#FFFFFF; --bg-3:#EFEFF4;
  --chrome:rgba(249,249,251,.78);
  --sep:rgba(60,60,67,.14); --sep-strong:rgba(60,60,67,.22);
  --label:#1C1C1E; --label-2:rgba(60,60,67,.62); --label-3:rgba(60,60,67,.36);
  --blue:#007AFF; --blue-soft:rgba(0,122,255,.12);
  --green:#34C759; --red:#FF3B30; --orange:#FF9500; --purple:#AF52DE; --teal:#30B0C7;
  --lift:0 1px 2px rgba(0,0,0,.05),0 12px 28px rgba(0,0,0,.09);
  --lift-2:0 1px 3px rgba(0,0,0,.08),0 20px 50px rgba(0,0,0,.14);

  /* 紙：テーマに関係なく白のまま */
  --paper:#FFFFFF; --rule:#E9E9EE; --ink:#1C1C1E; --ink-2:#3C3C43; --ink-3:#AEAEB2;

  --pw:800px; --k:1;
  --r-s:10px; --r-m:14px; --r-l:20px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Segoe UI",system-ui,sans-serif;
  --serif:"Hiragino Mincho ProN","Yu Mincho",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg-2:#1C1C1E; --bg-3:#2C2C2E;
    --chrome:rgba(30,30,32,.72);
    --sep:rgba(84,84,88,.5); --sep-strong:rgba(84,84,88,.75);
    --label:#F2F2F7; --label-2:rgba(235,235,245,.62); --label-3:rgba(235,235,245,.32);
    --blue:#0A84FF; --blue-soft:rgba(10,132,255,.2);
    --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --purple:#BF5AF2; --teal:#40C8E0;
    --lift:0 1px 2px rgba(0,0,0,.5),0 12px 28px rgba(0,0,0,.5);
    --lift-2:0 2px 6px rgba(0,0,0,.6),0 24px 60px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg-2:#1C1C1E; --bg-3:#2C2C2E;
  --chrome:rgba(30,30,32,.72);
  --sep:rgba(84,84,88,.5); --sep-strong:rgba(84,84,88,.75);
  --label:#F2F2F7; --label-2:rgba(235,235,245,.62); --label-3:rgba(235,235,245,.32);
  --blue:#0A84FF; --blue-soft:rgba(10,132,255,.2);
  --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --purple:#BF5AF2; --teal:#40C8E0;
  --lift:0 1px 2px rgba(0,0,0,.5),0 12px 28px rgba(0,0,0,.5);
  --lift-2:0 2px 6px rgba(0,0,0,.6),0 24px 60px rgba(0,0,0,.6);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--label);
  font-family:var(--font);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button,input{font:inherit;color:inherit}
button{transition:transform .1s ease-out,background .15s ease,color .15s ease}
button:active{transform:scale(.97)}   /* 手応えは離した時ではなく触れた時に返す */
button{background:none;border:0;cursor:pointer;padding:0}
input{-webkit-appearance:none}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px}
a{color:var(--blue)}

@media (prefers-reduced-transparency: reduce){
  .bar{background:var(--bg-2);backdrop-filter:none;-webkit-backdrop-filter:none}
  .ask{backdrop-filter:none;background:rgba(0,0,0,.5)}
}
@media (prefers-contrast: more){
  :root{--sep:rgba(60,60,67,.5);--label-2:#3C3C43;--label-3:#5B5B60}
  .bar,.group{border:1px solid var(--sep)}
}

/* ================= 骨組み ================= */
.app{display:grid;grid-template-columns:312px minmax(0,1fr);min-height:100dvh}

/* ---- 索引（左） ---- */
.side{
  background:var(--bg-3);border-right:.5px solid var(--sep);
  position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;
}
.side-head{padding:18px 18px 10px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.021em;line-height:1.1}
.who{
  font-size:11.5px;font-weight:600;letter-spacing:.01em;color:var(--label-2);
  background:var(--bg-2);border-radius:999px;padding:3px 10px;white-space:nowrap;
}
.search{
  display:flex;align-items:center;gap:7px;background:var(--bg-2);
  border-radius:var(--r-s);padding:8px 11px;color:var(--label-3);
}
.search svg{width:15px;height:15px;flex:none;fill:currentColor;opacity:.75}
.search input{
  border:0;background:none;outline:none;flex:1;min-width:0;font-size:16px;color:var(--label);
}
.search input::placeholder{color:var(--label-3)}
.search button{color:var(--label-3);font-size:15px;line-height:1;padding:2px 0 2px 4px}
.search button[hidden]{display:none}

.seg{
  display:flex;background:var(--bg-3);border:.5px solid var(--sep);border-radius:9px;padding:2px;gap:2px;
}
:root:not([data-theme="light"]) .seg{background:rgba(120,120,128,.16);border-color:transparent}
.seg button{
  flex:1;font-size:12.5px;font-weight:600;color:var(--label);padding:5px 4px;border-radius:7px;
  transition:background .15s ease;
}
.seg button[aria-pressed="true"]{background:var(--bg-2);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.list{flex:1;min-height:0;overflow:auto;padding:6px 12px 18px;-webkit-overflow-scrolling:touch}
.group{background:var(--bg-2);border-radius:var(--r-m);overflow:hidden}
.row{
  display:block;width:100%;text-align:left;padding:11px 14px;position:relative;
  border-bottom:.5px solid var(--sep);
}
.row:last-child{border-bottom:0}
.row:active{background:var(--bg-3)}
.row[aria-current="true"]{background:var(--blue-soft)}
.row .t{font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.row .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--label-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .kind{font-size:11px;color:var(--label-3);flex:none}
.chip{
  font-size:10.5px;font-weight:700;letter-spacing:.02em;color:#fff;background:var(--c,#8E8E93);
  border-radius:999px;padding:1px 7px;flex:none;
}
.none{color:var(--label-3);text-align:center;font-size:13.5px;padding:34px 0}
.side-foot{
  padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  border-top:.5px solid var(--sep);display:flex;gap:8px;
}
.btn{
  flex:1;background:var(--bg-2);border-radius:var(--r-s);padding:9px 8px;
  font-size:13.5px;font-weight:600;color:var(--blue);text-align:center;
}
.btn:active{opacity:.6}
.btn.warn{color:var(--red);flex:0 0 auto;padding:9px 12px}

/* ---- 机（右） ---- */
.desk{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 16px 40px;min-width:0}

.bar{
  position:sticky;top:12px;z-index:40;
  width:min(100%, calc(var(--pw) * var(--k)));
  display:flex;align-items:center;gap:4px;
  background:var(--chrome);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border:.5px solid var(--sep);border-radius:999px;padding:5px;box-shadow:var(--lift);
}
.tool{
  min-width:44px;height:34px;padding:0 12px;border-radius:999px;
  font-size:13.5px;font-weight:600;color:var(--label-2);
  display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;
  transition:background .15s ease,color .15s ease;
}
.tool:active{background:var(--blue-soft)}
.tool[aria-pressed="true"]{background:var(--blue);color:#fff}
.bar .sep-v{width:.5px;height:22px;background:var(--sep-strong);margin:0 4px;flex:none}
.pens{display:flex;gap:6px;align-items:center;padding:0 2px}
.sw{width:22px;height:22px;border-radius:999px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw[aria-pressed="true"]{border-color:var(--label-3);transform:scale(1.08)}
.sizes{display:flex;gap:2px}
.sz{width:28px;height:28px;border-radius:999px;display:grid;place-items:center}
.sz i{display:block;border-radius:999px;background:var(--label-2)}
.sz[aria-pressed="true"]{background:var(--blue-soft)}
.sz[aria-pressed="true"] i{background:var(--blue)}
.zoomer{display:inline-flex;align-items:center;gap:2px;flex:none}
.zoomer .tool{min-width:34px;padding:0 8px;font-size:15px}
.zoomer .pct{min-width:52px;font-size:12px;font-variant-numeric:tabular-nums;letter-spacing:0}
.grow{flex:1}
.stat{
  font-size:11.5px;color:var(--label-3);white-space:nowrap;padding-right:8px;
  overflow:hidden;text-overflow:ellipsis;max-width:46%;
}
.stat.ok{color:var(--green)}
.icon{width:18px;height:18px;fill:currentColor}
.readonly .editonly{display:none !important}

/* ---- 紙と見出しシール ---- */
.book{display:flex;flex-direction:column;align-items:center;width:100%}
.stage{
  position:relative;
  width:var(--stageW,800px);height:var(--stageH,1130px);
  perspective:1700px;perspective-origin:0% 50%;overflow:hidden;flex:none;
  touch-action:pan-y;   /* 横は自分でめくる。縦はページのスクロールに渡す */
  border-radius:var(--r-l);
}
.stage.zoomed{overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.leafwrap{
  position:relative;z-index:1;
  width:var(--lw,800px);height:var(--lh,1130px);
  transform:rotateY(var(--ry,0deg)) scale(var(--pz,1));
  transform-origin:0% 50%;                  /* 綴じ目（左端）を軸に */
  transform-style:preserve-3d;
  opacity:var(--leafop,1);
  will-change:transform,opacity;
}
.undersheet{
  position:absolute;left:0;top:0;width:var(--pw);min-height:1130px;height:var(--underH,1130px);
  pointer-events:none;
  transform:scale(var(--k));transform-origin:top left;
  background:var(--paper);border-radius:calc(var(--r-l) / var(--k));
  box-shadow:var(--lift-2);z-index:0;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);
  background-size:100% 32px;background-position:0 51px;
  opacity:var(--underOn,0);pointer-events:none;
}
.paper{
  width:var(--pw);min-height:1130px;
  transform:scale(var(--k));transform-origin:top left;
  position:relative;background:var(--paper);color:var(--ink);
  border-radius:calc(var(--r-l) / var(--k));
  box-shadow:var(--lift-2);
  padding:52px 60px 96px;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);
  background-size:100% 32px;background-position:0 51px;
  transform-style:preserve-3d;backface-visibility:hidden;
}
/* めくり：綴じ目（左端）を軸に紙が起き上がって伏せる */
@keyframes leaf-out{
  from{ transform:rotateY(0deg); opacity:1 }
  to  { transform:rotateY(var(--turn,-105deg)); opacity:0 }
}
@keyframes leaf-in{
  from{ transform:rotateY(calc(var(--turn,-105deg) * -1)); opacity:0 }
  to  { transform:rotateY(0deg); opacity:1 }
}
.leafwrap.turn-out{animation:leaf-out .2s cubic-bezier(.4,0,.85,.4) forwards}
.leafwrap.turn-in{animation:leaf-in .34s cubic-bezier(.16,.84,.3,1) forwards}
@media (prefers-reduced-motion:reduce){ .leafwrap.turn-out,.leafwrap.turn-in{animation-duration:.01s} }

/* めくっている間、紙面に落ちる陰と、起きた紙の縁の光 */
.shade{
  position:absolute;inset:0;z-index:20;pointer-events:none;border-radius:inherit;
  opacity:var(--shade,0);
  background:
    /* 綴じ目側に溜まる陰 */
    linear-gradient(var(--shadedir,90deg), rgba(0,0,0,.42) 0%, rgba(0,0,0,.18) 18%, rgba(0,0,0,.02) 46%, rgba(0,0,0,0) 70%),
    /* 起きた紙のふちに乗る光 */
    linear-gradient(var(--shadedir,90deg), rgba(255,255,255,0) 88%, rgba(255,255,255,.45) 100%);
}

.dividers{
  display:flex;gap:6px;width:var(--stageW,800px);max-width:100%;
  padding:0 2px;margin-bottom:-8px;z-index:2;
  overflow-x:auto;scrollbar-width:none;
}
.dividers::-webkit-scrollbar{display:none}
.divider{
  height:36px;min-width:70px;max-width:180px;padding:0 16px 6px;flex:none;
  border-radius:12px 12px 0 0;background:var(--sticker,#FF3B30);color:#fff;
  font-size:13px;font-weight:600;letter-spacing:.02em;line-height:30px;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 -2px 10px rgba(0,0,0,.14);
  opacity:.62;transform:translateY(4px);
  transition:transform .2s cubic-bezier(.2,.8,.3,1),opacity .2s ease;
}
.divider:active{transform:translateY(2px) scale(.99)}
.divider[aria-current="true"]{opacity:1;transform:translateY(0)}
.divider.add{
  background:var(--bg-2);color:var(--blue);box-shadow:var(--lift);
  min-width:44px;padding:0 14px 6px;font-size:16px;opacity:.9;
}
@media (prefers-reduced-motion:reduce){ .divider{transition:none} }

/* ---- 紙の中身 ---- */
.title-line{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px}
.p-title{
  font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.5;letter-spacing:-.01em;
  flex:1;min-width:0;outline:none;text-wrap:balance;
}
.p-title:empty::before{content:"無題の頁";color:var(--ink-3)}
.readonly .p-title:empty::before{content:""}
.p-date{font-size:11.5px;color:var(--ink-3);padding-bottom:10px;white-space:nowrap;font-variant-numeric:tabular-nums}

.folio{
  position:absolute;right:30px;bottom:26px;z-index:6;
  display:flex;align-items:center;gap:4px;
  transform:scale(calc(1 / var(--k)));transform-origin:100% 100%;
  user-select:none;
}
.folio #folioNo{
  min-width:56px;text-align:center;font-size:12.5px;letter-spacing:.04em;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}
.folio #folioNo b{font-weight:600;color:var(--ink-2);font-size:14px}
.folio button{
  width:34px;height:34px;border-radius:999px;font-size:12px;color:var(--blue);
  background:rgba(0,122,255,.09);display:grid;place-items:center;
}
.folio button:active{background:rgba(0,122,255,.2)}
.folio button:disabled{opacity:.3;color:var(--ink-3);background:transparent}

.blocks{display:flex;flex-direction:column;gap:6px;position:relative;z-index:2}
.block{position:relative}
.block .grip{position:absolute;left:-40px;top:4px;opacity:0;transition:opacity .15s}
.block:hover .grip,.block:focus-within .grip{opacity:1}
.grip button{width:26px;height:26px;border-radius:999px;color:var(--ink-3);font-size:13px}
.grip button:active{color:var(--red)}
.readonly .grip{display:none}

.t-block{line-height:32px;min-height:32px;word-break:break-word}
.t-view{white-space:pre-wrap;cursor:text;min-height:32px}
.t-view.ph{color:var(--ink-3)}
.readonly .t-view.ph,.readonly .fview.ph{display:none}
.t-edit{white-space:pre-wrap;outline:none;min-height:32px;display:none}
.t-block.editing .t-view{display:none}
.t-block.editing .t-edit{display:block}
.t-view a,.memo a{color:var(--blue);text-decoration:underline;text-underline-offset:2px;cursor:pointer}

.i-block{margin:10px 0;position:relative;width:var(--w,100%);max-width:100%}
.i-block img{
  max-width:100%;display:block;border-radius:12px;box-shadow:0 2px 14px rgba(0,0,0,.14);
  transform:rotate(var(--r,0deg));transform-origin:center;
}
.i-block.sel img{outline:2.5px solid var(--blue);outline-offset:3px}
.i-block .knob{
  position:absolute;width:34px;height:34px;border-radius:999px;
  background:var(--paper);border:1.5px solid var(--blue);box-shadow:0 2px 10px rgba(0,0,0,.22);
  display:none;place-items:center;color:var(--blue);font-size:15px;font-weight:700;
  touch-action:none;cursor:ew-resize;
  transform:scale(calc(1 / var(--k)));    /* 紙を縮めても、つまむ所は指の大きさのまま */
  transform-origin:center;
}
.i-block.sel .knob{display:grid}
.i-block .knob.size{right:-17px;bottom:38px}
.i-block .knob.rot{left:-17px;top:-17px;cursor:grab}
.i-block.sizing .knob.size,.i-block.turning .knob.rot{background:var(--blue);color:#fff}
.readonly .i-block .knob{display:none !important}

/* 写真をさわると出る操作卓：紙の外にあるので縮まない＝押しやすい */
.spot{
  position:fixed;z-index:58;display:none;align-items:center;gap:2px;padding:4px;
  background:var(--chrome);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border:.5px solid var(--sep);border-radius:999px;box-shadow:var(--lift-2);
  transform:translate(-50%,-50%) scale(var(--pop,1));transform-origin:center;
  transition:transform .16s cubic-bezier(.2,.9,.3,1),opacity .16s ease;
}
.spot.on{display:flex}
.spot button{
  min-width:46px;height:38px;padding:0 14px;border-radius:999px;
  font-size:14px;font-weight:600;color:var(--blue);white-space:nowrap;
}
.spot button:active{background:var(--blue-soft)}
.spot .x{color:var(--label-3);min-width:38px;padding:0 10px}
@media (prefers-reduced-motion:reduce){ .spot{transition:none} }

.photobar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom));z-index:55;
  display:none;align-items:center;gap:2px;padding:5px;
  background:var(--chrome);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border:.5px solid var(--sep);border-radius:999px;box-shadow:var(--lift-2);max-width:calc(100vw - 20px);
}
.photobar.on{display:flex}
.photobar button{min-width:44px;height:38px;padding:0 12px;border-radius:999px;font-size:15px;font-weight:600;color:var(--blue)}
.photobar button:active{background:var(--blue-soft)}
.photobar .val{min-width:50px;text-align:center;font-size:12.5px;color:var(--label-2);font-variant-numeric:tabular-nums}
.photobar .kill{color:var(--red)}
.photobar .sep-v{width:.5px;height:22px;background:var(--sep-strong);margin:0 3px}
@media (max-width:900px){ .photobar{bottom:calc(64px + env(safe-area-inset-bottom))} }
.i-block .wtag{
  position:absolute;right:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;
  font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;opacity:0;transition:opacity .15s ease;
  font-variant-numeric:tabular-nums;
}
.i-block.sizing .wtag{opacity:1}
.i-block figcaption{font-size:12.5px;color:var(--ink-2);opacity:.7;margin-top:7px;outline:none;line-height:1.6}
.i-block figcaption:empty::before{content:"説明を書く";color:var(--ink-3)}
.readonly .i-block figcaption:empty{display:none}

.addbar{display:flex;gap:8px;margin-top:24px;position:relative;z-index:2}
.add{
  border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:600;
  color:var(--blue);background:rgba(0,122,255,.09);
}
.add:active{opacity:.6}

/* ---- 予定表 ---- */
.month{
  position:relative;z-index:2;background:var(--paper);
  border-radius:14px;overflow:hidden;border:.5px solid var(--rule);
  display:grid;grid-template-columns:repeat(7,1fr);
}
.month .mh{
  font-size:11px;font-weight:700;letter-spacing:.06em;text-align:center;padding:8px 0;
  background:#F7F7FA;color:var(--ink-2);opacity:.75;border-bottom:.5px solid var(--rule);
}
.month .mh.sun{color:var(--red);opacity:1}
.month .mh.sat{color:var(--blue);opacity:1}
.md{
  min-height:130px;padding:6px 7px 8px;display:flex;flex-direction:column;gap:3px;
  border-right:.5px solid var(--rule);border-bottom:.5px solid var(--rule);
}
.md:nth-child(7n){border-right:0}
.md .n{font-size:11.5px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.md.sun .n{color:var(--red)}
.md.sat .n{color:var(--blue)}
.md.out{background:#FAFAFC}
.md.out .n{opacity:.4}
.md.today .n{

<script>
(function(){
"use strict";
const $=(s)=>document.querySelector(s);
const PW=800, PH=1130;
const COLORS=["#1C1C1E","#007AFF","#FF3B30","#34C759","#FF9500"];
const SIZES=[2,4,8];
const STICKERS=["#FF3B30","#007AFF","#34C759","#FF9500","#AF52DE","#30B0C7"];
const WD=["日","月","火","水","木","金","土"];

let store=null, index=[], cur=null;
let folders=[], folderId=null;
let tool="move", color=COLORS[0], size=SIZES[1];
let dirty=false, saving=false, canEdit=true;
let sortMode="new", query="", fitK=1, userZoom=1, pinching=false, flickTurn=false;
/* 公開用（読むだけ）で開かれているか：?view / #view / view.html */
const VIEW_ONLY = /[?&#]view(=|&|$)/i.test(location.search+location.hash) || /view[.]html?$/i.test(location.pathname);

/* iPhone で原寸表示にならないよう、枠が用意していなければ自分で足す */
(function viewport(){
  if(!document.querySelector('meta[name="viewport"]')){
    const m=document.createElement("meta");
    m.name="viewport"; m.content="width=device-width,initial-scale=1,viewport-fit=cover";
    document.head.appendChild(m);
  }
})();

/* ================= 保存先 ================= */
const local={
  kind:"local",
  async list(){ try{ return JSON.parse(localStorage.getItem("techo:index")||"[]"); }catch(e){ return []; } },
  async save(){ try{ localStorage.setItem("techo:index",JSON.stringify(index)); }catch(e){} },
  async get(id){ try{ const r=localStorage.getItem("techo:p:"+id); return r?JSON.parse(r):null; }catch(e){ return null; } },
  async put(p){ localStorage.setItem("techo:p:"+p.id,JSON.stringify(p)); },
  async del(id){ localStorage.removeItem("techo:p:"+id); },
  async getImages(pid){ try{ return JSON.parse(localStorage.getItem("techo:img:"+pid)||"{}"); }catch(e){ return {}; } },
  async putImage(pid,bid,src){ const m=await this.getImages(pid); m[bid]=src; localStorage.setItem("techo:img:"+pid,JSON.stringify(m)); },
  async delImage(pid,bid){ const m=await this.getImages(pid); delete m[bid]; localStorage.setItem("techo:img:"+pid,JSON.stringify(m)); },
  async delImages(pid){ localStorage.removeItem("techo:img:"+pid); },
  async getFolders(){ try{ return JSON.parse(localStorage.getItem("techo:folders")||"[]"); }catch(e){ return []; } },
  async putFolders(l){ localStorage.setItem("techo:folders",JSON.stringify(l)); },
  async writable(){ try{ localStorage.setItem("techo:probe","1"); return true; }catch(e){ return false; } },
  // 同じブラウザの別のタブ（編集タブ→公開タブ）に、書いた端から伝わる
  watchList(cb){
    const h=(e)=>{ if(!e.key||e.key==="techo:index") this.list().then(cb); };
    window.addEventListener("storage",h);
    return ()=>window.removeEventListener("storage",h);
  },
  watchPage(id,cb){
    const h=(e)=>{ if(e.key==="techo:p:"+id&&e.newValue){ try{ cb(JSON.parse(e.newValue)); }catch(err){} } };
    window.addEventListener("storage",h);
    return ()=>window.removeEventListener("storage",h);
  },
  watchFolders(cb){
    const h=(e)=>{ if(e.key==="techo:folders"&&e.newValue){ try{ cb(JSON.parse(e.newValue)); }catch(err){} } };
    window.addEventListener("storage",h);
    return ()=>window.removeEventListener("storage",h);
  }
};

async function connect(){
  let db=null;
  try{ db=await claude.use("db"); }catch(e){ db=null; }
  if(!db) return local;
  const row=(d)=>{ const v=d.data()||{}; return {id:d.id,title:v.title||"",updated:v.updated||0,folder:v.folder||"",kind:v.kind||"note",q:v.q||""}; };
  return {
    kind:"db",
    async list(){ const s=await db.collection("pages").orderBy("updated","desc").limit(300).get(); return (s.docs||[]).map(row); },
    async save(){},
    async get(id){ const d=await db.doc("pages/"+id).get(); return d&&d.exists?JSON.parse(JSON.stringify(d.data())):null; },
    async put(p){ await db.doc("pages/"+p.id).set(p); },
    async del(id){ await db.doc("pages/"+id).delete(); },
    async getImages(pid){ const s=await db.collection("pages/"+pid+"/images").get(); const m={}; (s.docs||[]).forEach(d=>{ m[d.id]=(d.data()||{}).src; }); return m; },
    async putImage(pid,bid,src){ await db.doc("pages/"+pid+"/images/"+bid).set({src}); },
    async delImage(pid,bid){ await db.doc("pages/"+pid+"/images/"+bid).delete(); },
    async delImages(pid){ const s=await db.collection("pages/"+pid+"/images").get(); await Promise.all((s.docs||[]).map(d=>db.doc("pages/"+pid+"/images/"+d.id).delete())); },
    async getFolders(){ const d=await db.doc("meta/folders").get(); return d&&d.exists?((d.data()||{}).list||[]):[]; },
    async putFolders(list){ await db.doc("meta/folders").set({list}); },
    async writable(){ try{ await db.doc("meta/lastOpened").set({at:Date.now()}); return true; }catch(e){ return false; } },
    // 変わった端から届く（他の端末・公開ページも同時に動く）
    watchList(cb){
      try{ return db.collection("pages").orderBy("updated","desc").limit(300)
        .onSnapshot(snap=>cb((snap.docs||[]).map(row)), ()=>{}); }catch(e){ return null; }
    },
    watchPage(id,cb){
      try{ return db.doc("pages/"+id).onSnapshot(d=>{ if(d&&d.exists) cb(JSON.parse(JSON.stringify(d.data()))); }, ()=>{}); }catch(e){ return null; }
    },
    watchFolders(cb){
      try{ return db.doc("meta/folders").onSnapshot(d=>{ if(d&&d.exists) cb((d.data()||{}).list||[]); }, ()=>{}); }catch(e){ return null; }
    }
  };
}

/* ================= クラウド保存（サイトが勝手に変わる） =================
   cloud.json（Firebase の設定）が隣に置かれていれば、そちらに保存する。
   書いた端から、同じサイトを開いている全員の画面が入れ替わる。
   書けるのは持ち主だけ（ownerUid）、読むのは誰でも。 */
let cloudAuth=null, cloudUser=null;
async function loadCloudConfig(){
  try{
    const res=await fetch("cloud.json?"+Date.now(),{cache:"no-store"});
    if(!res.ok) return null;
    const j=await res.json();
    return (j&&j.apiKey&&j.projectId)?j:null;
  }catch(e){ return null; }
}
async function cloudStore(cfg){
  const base="https://www.gstatic.com/firebasejs/10.12.5/";
  let app,fs,F,A;
  try{
    const appMod=await import(base+"firebase-app.js");
    F=await import(base+"firebase-firestore.js");
    A=await import(base+"firebase-auth.js");
    app=appMod.initializeApp(cfg);
    fs=F.getFirestore(app);
  }catch(e){ return null; }

  cloudAuth=A.getAuth(app);
  await new Promise(res=>{
    const off=A.onAuthStateChanged(cloudAuth,(u)=>{ cloudUser=u||null; off(); res(); });
    setTimeout(res,4000);
  });
  A.onAuthStateChanged(cloudAuth,(u)=>{ cloudUser=u||null; });

  const root="notes/"+(cfg.book||"main");
  const pagesCol=()=>F.collection(fs, root+"/pages");
  const pageDoc=(id)=>F.doc(fs, root+"/pages/"+id);
  const imgCol=(pid)=>F.collection(fs, root+"/pages/"+pid+"/images");
  const imgDoc=(pid,bid)=>F.doc(fs, root+"/pages/"+pid+"/images/"+bid);
  const metaDoc=(name)=>F.doc(fs, root+"/meta/"+name);
  const row=(d)=>{ const v=d.data()||{}; return {id:d.id,title:v.title||"",updated:v.updated||0,folder:v.folder||"",kind:v.kind||"note",q:v.q||""}; };

  return {
    kind:"cloud",
    signedIn:()=>!!cloudUser,
    async signIn(){
      const p=new A.GoogleAuthProvider();
      try{ await A.signInWithPopup(cloudAuth,p); }
      catch(e){ try{ await A.signInWithRedirect(cloudAuth,p); }catch(err){} }
    },
    async signOut(){ try{ await A.signOut(cloudAuth); }catch(e){} },
    async list(){
      const s=await F.getDocs(F.query(pagesCol(), F.orderBy("updated","desc"), F.limit(300)));
      return s.docs.map(row);
    },
    async save(){},
    async get(id){ const d=await F.getDoc(pageDoc(id)); return d.exists()?JSON.parse(JSON.stringify(d.data())):null; },
    async put(p){ await F.setDoc(pageDoc(p.id), p); },
    async del(id){ await F.deleteDoc(pageDoc(id)); },
    async getImages(pid){ const s=await F.getDocs(imgCol(pid)); const m={}; s.docs.forEach(d=>{ m[d.id]=(d.data()||{}).src; }); return m; },
    async putImage(pid,bid,src){ await F.setDoc(imgDoc(pid,bid), {src}); },
    async delImage(pid,bid){ await F.deleteDoc(imgDoc(pid,bid)); },
    async delImages(pid){ const s=await F.getDocs(imgCol(pid)); await Promise.all(s.docs.map(d=>F.deleteDoc(imgDoc(pid,d.id)))); },
    async getFolders(){ const d=await F.getDoc(metaDoc("folders")); return d.exists()?((d.data()||{}).list||[]):[]; },
    async putFolders(list){ await F.setDoc(metaDoc("folders"), {list}); },
    async writable(){ return !!(cloudUser && (!cfg.ownerUid || cloudUser.uid===cfg.ownerUid)); },
    watchList(cb){
      try{ return F.onSnapshot(F.query(pagesCol(), F.orderBy("updated","desc"), F.limit(300)),
        (s)=>cb(s.docs.map(row)), ()=>{}); }catch(e){ return null; }
    },
    watchPage(id,cb){
      try{ return F.onSnapshot(pageDoc(id), (d)=>{ if(d.exists()) cb(JSON.parse(JSON.stringify(d.data()))); }, ()=>{}); }catch(e){ return null; }
    },
    watchFolders(cb){
      try{ return F.onSnapshot(metaDoc("folders"), (d)=>{ if(d.exists()) cb((d.data()||{}).list||[]); }, ()=>{}); }catch(e){ return null; }
    }
  };
}

/* ================= 公開ページ用の写し ================= */
/* 編集ページで書き出した public.json を、公開ページが読む（手元保存版のとき）。
   Artifact 版はサーバー保存なので、編集した時点で公開側にもそのまま出る。 */
function snapshotStore(snap){
  let stop=null;
  return {
    kind:"snapshot",
    async list(){ return (snap.pages||[]).map(p=>({id:p.id,title:p.title||"",updated:p.updated||0,folder:p.folder||"",kind:p.kind||"note",q:p.q||""})); },
    async save(){},
    async get(id){ const p=(snap.pages||[]).find(x=>x.id===id); return p?JSON.parse(JSON.stringify(p)):null; },
    async put(){}, async del(){},
    async getImages(pid){ return (snap.images||{})[pid]||{}; },
    async putImage(){}, async delImage(){}, async delImages(){},
    async getFolders(){ return snap.folders||[]; },
    async putFolders(){},
    async writable(){ return false; },
    // public.json が差し替わったら拾う（30秒ごとに見に行く）
    watchList(cb){

function fit(){
  const desk=$(".desk");
  const avail=Math.max(200, desk.clientWidth - (window.innerWidth<600?12:32));
  fitK=Math.max(.25, Math.min(1, avail/PW));
  const k=Math.max(.3, Math.min(2.2, fitK*userZoom));
  document.documentElement.style.setProperty("--k",k);
  const paperH=Math.max(PH,$("#paper").offsetHeight);
  const st=$("#stage");
  const sw=Math.min(PW*k, avail);

  st.style.setProperty("--stageW", sw+"px");

  st.classList.toggle("zoomed", PW*k > avail+1);

}

/* 減衰比 z と応答 response（秒）の2値だけで決める。途中で目標を変えても速度を引き継ぐ */
function makeSpring(onFrame){
  let x=0,v=0,target=0,z=1,w=2*Math.PI/0.4,raf=0,done=null,last=0,guard=0;
  function finish(){
    x=target; v=0; onFrame(x);
    stop();
    if(done){ const d=done; done=null; d(); }
  }
  function stop(){
    if(raf) cancelAnimationFrame(raf);
    if(guard) clearTimeout(guard);
    raf=0; guard=0;
  }
  function step(t){
    if(guard) clearTimeout(guard);
    const dt=Math.min((t-last)/1000,1/30); last=t;
    const a=-(w*w)*(x-target)-2*z*w*v;
    v+=a*dt; x+=v*dt;
    onFrame(x);
    if(Math.abs(x-target)<0.3&&Math.abs(v)<6){ finish(); return; }
    raf=requestAnimationFrame(step);
    guard=setTimeout(finish,260);   // 画面が止まっている時は待たずに決着させる
  }
  return {
    get value(){ return x; },
    get velocity(){ return v; },
    set(val,vel){ stop(); x=val; if(vel!==undefined) v=vel; onFrame(x); },
    stop,
    to(val,opts){
      opts=opts||{};
      target=val; z=opts.damping===undefined?1:opts.damping;
      w=2*Math.PI/(opts.response===undefined?0.4:opts.response);
      if(opts.velocity!==undefined) v=opts.velocity;
      done=opts.onDone||null;
      if(document.hidden||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)){ finish(); return; }
      stop();
      last=performance.now();
      raf=requestAnimationFrame(step);
      guard=setTimeout(finish,260);
    }
  };
}

function turn(dir,swap){
  const el=$("#leafwrap"), sh=$("#shade");
  if(flickTurn){                       // 指でめくり切った時は、そのまま中身だけ入れ替える
    flickTurn=false;
    swap(); fit();
    return Promise.resolve();
  }
  if(typeof leaf!=="undefined"){ leaf.stop(); leaf.set(0); }
  el.classList.remove("turn-out","turn-in");
  el.style.setProperty("--turn", dir==="prev"?"105deg":"-105deg");
  if(sh) sh.style.setProperty("--shadedir", dir==="prev"?"270deg":"90deg");
  const un=$("#undersheet"); if(un) un.style.setProperty("--underOn","1");
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches){ swap(); fit(); return Promise.resolve(); }
  return new Promise(res=>{
    el.classList.add("turn-out");
    if(sh) sh.style.setProperty("--shade",".55");
    setTimeout(()=>{
      el.classList.remove("turn-out");
      swap(); fit();
      el.classList.add("turn-in");
      setTimeout(()=>{
        el.classList.remove("turn-in");
        if(sh) sh.style.setProperty("--shade","0");
        if(un) un.style.setProperty("--underOn","0");
        res();
      },340);
    },200);
  });
}

/* ---- リンクを生かす ---- */
const URLRE=/((?:https?:\/\/|www\.)[^\s<>"'）】」』]+)/g;
function linkify(el,text){
  el.textContent="";
  const t=text||"";
  let last=0,m;
  URLRE.lastIndex=0;
  while((m=URLRE.exec(t))){
    if(m.index>last) el.appendChild(document.createTextNode(t.slice(last,m.index)));
    let raw=m[0];
    const tail=raw.match(/[.,、。)\]]+$/);
    if(tail){ raw=raw.slice(0,-tail[0].length); URLRE.lastIndex-=tail[0].length; }
    const a=document.createElement("a");
    a.href=/^www\./i.test(raw)?"https://"+raw:raw;
    a.textContent=raw; a.target="_blank"; a.rel="noopener noreferrer";
    a.addEventListener("click",(e)=>{
      e.stopPropagation();
      e.preventDefault();
      const w=window.open(a.href,"_blank","noopener,noreferrer");
      if(!w) setStatus("リンクを開けませんでした（長押しでコピーできます）");
    });
    el.appendChild(a);
    last=m.index+raw.length;
  }
  if(last<t.length) el.appendChild(document.createTextNode(t.slice(last)));
  if(!t){ el.textContent="ここに書く…"; el.classList.add("ph"); } else el.classList.remove("ph");
}

function blockEl(b){
  const wrap=document.createElement("div"); wrap.className="block"; wrap.dataset.id=b.id;
  const grip=document.createElement("div"); grip.className="grip";
  const del=document.createElement("button"); del.textContent="✕"; del.title="この塊を消す"; del.type="button";
  del.onclick=()=>{
    if(b.type==="image") store.delImage(cur.id,b.id).catch(()=>{});
    cur.blocks=cur.blocks.filter(x=>x.id!==b.id);
    if(!cur.blocks.length) cur.blocks=[{id:uid(),type:"text",text:""}];
    renderPage(); touch();
  };
  grip.appendChild(del); wrap.appendChild(grip);

  if(b.type==="text"){
    if(!canEdit && !(b.text||"").trim()) return null;      // 未記入は出さない
    const host=document.createElement("div"); host.className="t-block";
    const view=document.createElement("div"); view.className="t-view";
    const ed=document.createElement("div"); ed.className="t-edit"; ed.spellcheck=false;
    linkify(view,b.text);
    view.addEventListener("click",(e)=>{
      if(e.target.closest("a")) return;
      if(!canEdit||tool!=="move") return;
      ed.textContent=b.text||"";
      ed.contentEditable="plaintext-only";
      host.classList.add("editing");
      ed.focus();
      const r=document.createRange(); r.selectNodeContents(ed); r.collapse(false);
      const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r);
    });
    ed.addEventListener("input",()=>{ b.text=ed.textContent; touch(); });
    ed.addEventListener("blur",()=>{ b.text=ed.textContent; linkify(view,b.text); host.classList.remove("editing"); touch(); });
    ed.addEventListener("keydown",(e)=>{
      if(e.key==="Backspace"&&!ed.textContent&&cur.blocks.length>1){ e.preventDefault(); del.onclick(); }
      if(e.key==="Escape") ed.blur();
    });
    host.append(view,ed); wrap.appendChild(host);
  }else{
    const fig=document.createElement("figure"); fig.className="i-block";
    b.w=Math.min(100,Math.max(20,b.w||100)); b.r=b.r||0;
    fig.style.setProperty("--w", b.w+"%");
    let img=null;
    if(b.src){
      img=document.createElement("img"); img.src=b.src; img.alt=b.caption||"貼った写真"; img.loading="lazy";
      if(/^data:image\/(png|webp|gif)/i.test(b.src||"")) img.classList.add("clear");
      img.style.setProperty("--r", b.r+"deg");
      img.addEventListener("load",()=>{ fit(); sizeCanvas(); });
      fig.appendChild(img);
    }
    const cap=document.createElement("figcaption");
    if(canEdit) cap.contentEditable="plaintext-only";
    cap.textContent=b.caption||"";
    cap.addEventListener("input",()=>{ b.caption=cap.textContent; touch(); });
    fig.appendChild(cap);

    if(b.src&&canEdit){
      const tag=document.createElement("div"); tag.className="wtag";
      const show=()=>{ tag.textContent=Math.round(b.w)+"% / "+Math.round(b.r)+"°"; };
      show();

      // 触れば選ばれる（選ばれている間だけ、つまむ所と操作卓が出る）
      fig.addEventListener("pointerdown",(e)=>{
        if(e.target.closest(".knob")||e.target.closest("figcaption")) return;
        selectPhoto(b,fig,img,tag);
      });

      // 大きさ：指と 1:1
      const knob=document.createElement("button"); knob.className="knob size"; knob.type="button";
      knob.textContent="↔"; knob.setAttribute("aria-label","写真の大きさを変える");
      let startW=0,x0=0,pw=1;
      knob.addEventListener("pointerdown",(e)=>{
        e.preventDefault(); e.stopPropagation();
        try{ knob.setPointerCapture(e.pointerId); }catch(err){}
        selectPhoto(b,fig,img,tag);
        startW=b.w; x0=e.clientX;
        pw=($("#blocks").getBoundingClientRect().width)||1;
        fig.classList.add("sizing");
      });
      knob.addEventListener("pointermove",(e)=>{
        if(!fig.classList.contains("sizing")) return;
        const w=Math.min(100,Math.max(20, startW+(e.clientX-x0)/pw*100));
        b.w=w; fig.style.setProperty("--w",w+"%"); show(); syncPhotoBar();
      });
      const endSize=()=>{ if(fig.classList.contains("sizing")){ fig.classList.remove("sizing"); touch(); fit(); sizeCanvas(); } };
      knob.addEventListener("pointerup",endSize);
      knob.addEventListener("pointercancel",endSize);

      // 角度：中心まわりに指を追い、5度きざみ。まっすぐ近くは吸い付く
      const rot=document.createElement("button"); rot.className="knob rot"; rot.type="button";
      rot.textContent="⟳"; rot.setAttribute("aria-label","写真をかたむける");
      let a0=0,r0=0;
      const angleOf=(e)=>{ const r=fig.getBoundingClientRect(); return Math.atan2(e.clientY-(r.top+r.height/2), e.clientX-(r.left+r.width/2))*180/Math.PI; };
      rot.addEventListener("pointerdown",(e)=>{
        e.preventDefault(); e.stopPropagation();
        try{ rot.setPointerCapture(e.pointerId); }catch(err){}
        selectPhoto(b,fig,img,tag);
        a0=angleOf(e); r0=b.r||0; fig.classList.add("turning");
      });
      rot.addEventListener("pointermove",(e)=>{
        if(!fig.classList.contains("turning")) return;
        let d=r0+(angleOf(e)-a0);
        d=Math.round(d/5)*5;
        if(Math.abs(d)<4) d=0;
        if(d>180) d-=360;
        if(d<-180) d+=360;
        setAngle(b,img,d); show(); syncPhotoBar();
      });
      const endRot=()=>{ if(fig.classList.contains("turning")){ fig.classList.remove("turning"); touch(); } };
      rot.addEventListener("pointerup",endRot);
      rot.addEventListener("pointercancel",endRot);

      fig.append(tag,knob,rot);
    }
    wrap.appendChild(fig);
  }
  return wrap;
}

function monthEl(){
  const wrap=document.createElement("div"); wrap.className="month";
  WD.forEach((w,i)=>{
    const h=document.createElement("div");
    h.className="mh"+(i===0?" sun":i===6?" sat":"");
    h.textContent=w; wrap.appendChild(h);
  });
  const a=cur.month.split("-").map(Number), y=a[0], m=a[1];
  const first=new Date(y,m-1,1), last=new Date(y,m,0).getDate();
  const lead=first.getDay(), cells=Math.ceil((lead+last)/7)*7;
  const today=new Date(), isThis=(today.getFullYear()===y&&today.getMonth()===m-1);
  cur.days=cur.days||{};

  for(let i=0;i<cells;i++){
    const day=i-lead+1, inMonth=day>=1&&day<=last, wd=i%7;
    const c=document.createElement("div");
    c.className="md"+(inMonth?"":" out")+(wd===0?" sun":wd===6?" sat":"")+((inMonth&&isThis&&today.getDate()===day)?" today":"");
    const n=document.createElement("div"); n.className="n";
    n.textContent=inMonth?day:(day<1?new Date(y,m-1,0).getDate()+day+1:day-last);
    c.appendChild(n);
    if(inMonth){
      const memo=document.createElement("div"); memo.className="memo"; memo.spellcheck=false;
      const key=String(day);
      linkify(memo,cur.days[key]||""); if(!cur.days[key]) memo.textContent="";
      memo.classList.remove("ph");
      memo.addEventListener("click",(e)=>{
        if(e.target.closest("a")) return;
        if(!canEdit||tool!=="move"||memo.isContentEditable) return;
        memo.textContent=cur.days[key]||"";
        memo.contentEditable="plaintext-only"; memo.focus();
        const r=document.createRange(); r.selectNodeContents(memo); r.collapse(false);
        const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r);
      });
      memo.addEventListener("input",()=>{
        const v=memo.textContent;
        if(v) cur.days[key]=v; else delete cur.days[key];
        touch();
      });
      memo.addEventListener("blur",()=>{
        memo.contentEditable="false";
        linkify(memo,cur.days[key]||""); if(!cur.days[key]) memo.textContent="";
        memo.classList.remove("ph");
      });
      c.appendChild(memo);
    }
    wrap.appendChild(c);
  }
  return wrap;
}

/* ---- 好きな場所に置いたもの（文字・写真） ---- */
function paperPos(e){                                   // 画面の座標 → 紙の座標
  const r=$("#paper").getBoundingClientRect();
  const k=(r.width/PW)||1;
  return [(e.clientX-r.left)/k, (e.clientY-r.top)/k];
}
function renderFree(){
  const layer=$("#free"); if(!layer) return;
  layer.innerHTML="";
  (cur&&cur.free||[]).forEach(it=>{ const el=freeEl(it); if(el) layer.appendChild(el); });
}
function freeEl(it){
  if(!canEdit){
    if(it.type==="text" && !(it.text||"").trim()) return null;
    if(it.type==="image" && !it.src) return null;
  }
  const el=document.createElement("div");
  el.className="fitem "+(it.type==="image"?"img":"txt");
  el.style.setProperty("--x",(it.x||0)+"px");
  el.style.setProperty("--y",(it.y||0)+"px");
  el.style.setProperty("--w",(it.w||240)+"px");
  el.style.setProperty("--r",(it.r||0)+"deg");

  let img=null, view=null, ed=null;
  if(it.type==="image"){
    img=document.createElement("img"); img.src=it.src||""; img.alt=it.alt||"置いた写真"; img.draggable=false;
    if(/^data:image\/(png|webp|gif)/i.test(it.src||"")) img.classList.add("clear");   // 透けているものは板に見せない
    img.addEventListener("load",()=>{ fit(); sizeCanvas(); });
    el.appendChild(img);
  }else{
    view=document.createElement("div"); view.className="fview";
    linkify(view,it.text||"");
    ed=document.createElement("div"); ed.className="fedit"; ed.spellcheck=false;
    ed.addEventListener("input",()=>{ it.text=ed.textContent; touch(); });
    ed.addEventListener("blur",()=>{ it.text=ed.textContent; linkify(view,it.text); el.classList.remove("editing"); touch(); });
    ed.addEventListener("keydown",(e)=>{ if(e.key==="Escape") ed.blur(); });
    el.append(view,ed);
  }

  const startEdit=()=>{
    if(it.type!=="text"||!canEdit) return;
    ed.textContent=it.text||"";
    ed.contentEditable="plaintext-only";
    el.classList.add("editing"); ed.focus();
    const r=document.createRange(); r.selectNodeContents(ed); r.collapse(false);
    const sl=getSelection(); sl.removeAllRanges(); sl.addRange(r);
  };

  // つかんで動かす（指と1:1）
  let px=0,py=0,ox=0,oy=0,moved=false,downT=0,grabbing=false;
  el.addEventListener("pointerdown",(e)=>{
    if(!canEdit||tool!=="move") return;
    if(e.target.closest(".knob")) return;
    if(el.classList.contains("editing")) return;
    if(e.target.closest("a")) return;
    e.stopPropagation();
    if(e.cancelable) e.preventDefault();
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    const p=paperPos(e); px=p[0]; py=p[1]; ox=it.x||0; oy=it.y||0; moved=false; downT=Date.now(); grabbing=true;
    selectFree(it,el,img);
  });
  el.addEventListener("pointermove",(e)=>{
    if(!canEdit||!grabbing) return;
    const p=paperPos(e), dx=p[0]-px, dy=p[1]-py;
    if(!moved && Math.abs(dx)+Math.abs(dy)<3) return;
    moved=true;
    it.x=Math.round(ox+dx); it.y=Math.round(oy+dy);
    el.style.setProperty("--x",it.x+"px"); el.style.setProperty("--y",it.y+"px");
  });
  const endMove=()=>{
    if(!canEdit||!grabbing) return;
    grabbing=false;
    if(moved){ touch(); }
    else if(it.type==="text" && Date.now()-downT<600){ startEdit(); }
    moved=false;
  };
  el.addEventListener("pointerup",endMove);
  el.addEventListener("pointercancel",()=>{ moved=false; grabbing=false; });

  if(canEdit){
    // 二本指：つまんで大きさ、ひねって角度、動かして場所
    let g=null;
    const paperK=()=>{ const r=$("#paper").getBoundingClientRect(); return (r.width/PW)||1; };
    const pair=(t)=>{
      const a=t[0], b=t[1];
      return {
        d:Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY)||1,
        a:Math.atan2(b.clientY-a.clientY, b.clientX-a.clientX)*180/Math.PI,
        mx:(a.clientX+b.clientX)/2, my:(a.clientY+b.clientY)/2
      };
    };
    el.addEventListener("touchstart",(e)=>{
      if(e.touches.length!==2||tool!=="move") return;
      e.preventDefault(); e.stopPropagation();
      const p=pair(e.touches);
      g={d0:p.d,a0:p.a,mx:p.mx,my:p.my,w0:it.w||240,r0:it.r||0,x0:it.x||0,y0:it.y||0};
      selectFree(it,el,img);
    },{passive:false});
    el.addEventListener("touchmove",(e)=>{
      if(!g||e.touches.length!==2) return;
      e.preventDefault(); e.stopPropagation();
      const p=pair(e.touches), k=paperK();
      it.w=Math.max(60,Math.min(PW-40, Math.round(g.w0*(p.d/g.d0))));
      let d=g.r0+(p.a-g.a0);
      d=Math.round(d/5)*5;
      if(Math.abs(d)<4) d=0;
      if(d>180) d-=360;
      if(d<-180) d+=360;
      it.r=d;
      it.x=Math.round(g.x0+(p.mx-g.mx)/k);
      it.y=Math.round(g.y0+(p.my-g.my)/k);
      el.style.setProperty("--w",it.w+"px");
      el.style.setProperty("--r",it.r+"deg");
      el.style.setProperty("--x",it.x+"px");
      el.style.setProperty("--y",it.y+"px");
      syncPhotoBar();
    },{passive:false});
    const endPinch=(e)=>{ if(!g) return; if(e.touches&&e.touches.length>=2) return; g=null; touch(); fit(); sizeCanvas(); };
    el.addEventListener("touchend",endPinch);
    el.addEventListener("touchcancel",endPinch);

    // 大きさ
    const knob=document.createElement("button"); knob.className="knob size"; knob.type="button";
    knob.textContent="↔"; knob.setAttribute("aria-label","大きさを変える");
    let w0=0,sx=0,sizing=false;
    knob.addEventListener("pointerdown",(e)=>{
      e.preventDefault(); e.stopPropagation();
      try{ knob.setPointerCapture(e.pointerId); }catch(err){}
      selectFree(it,el,img); w0=it.w||240; sx=paperPos(e)[0]; sizing=true;
    });
    knob.addEventListener("pointermove",(e)=>{
      if(!sizing) return;
      const w=Math.max(60,Math.min(PW-40, w0+(paperPos(e)[0]-sx)));
      it.w=Math.round(w); el.style.setProperty("--w",it.w+"px"); syncPhotoBar();
    });
    const endSize=()=>{ if(!sizing) return; sizing=false; touch(); fit(); sizeCanvas(); };
    knob.addEventListener("pointerup",endSize);
    knob.addEventListener("pointercancel",endSize);
    // 角度
    const rot=document.createElement("button"); rot.className="knob rot"; rot.type="button";
    rot.textContent="⟳"; rot.setAttribute("aria-label","かたむける");
    let a0=0,r0=0,turning=false;
    const angleOf=(e)=>{ const r=el.getBoundingClientRect(); return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI; };
    rot.addEventListener("pointerdown",(e)=>{
      e.preventDefault(); e.stopPropagation();
      try{ rot.setPointerCapture(e.pointerId); }catch(err){}
      selectFree(it,el,img); a0=angleOf(e); r0=it.r||0; turning=true;
    });
    rot.addEventListener("pointermove",(e)=>{
      if(!turning) return;
      let d=r0+(angleOf(e)-a0);
      d=Math.round(d/5)*5;
      if(Math.abs(d)<4) d=0;
      if(d>180) d-=360;
      if(d<-180) d+=360;
      it.r=d; el.style.setProperty("--r",d+"deg"); syncPhotoBar();
    });
    rot.addEventListener("pointerup",()=>{ if(turning){ turning=false; touch(); } });
    rot.addEventListener("pointercancel",()=>{ turning=false; });
    const del=document.createElement("button"); del.className="knob del"; del.type="button";
    del.textContent="✕"; del.setAttribute("aria-label","これを消す");
    del.addEventListener("pointerdown",(e)=>{ e.preventDefault(); e.stopPropagation(); });
    del.addEventListener("click",(e)=>{ e.preventDefault(); e.stopPropagation(); removeFree(it); });
    el.append(knob,rot,del);
  }
  return el;
}

/* ---- 写真をえらぶ・整える ---- */
let sel=null;   // {b,fig,img,tag} または {free:true,...}
function removeFree(it){
  if(!canEdit||!cur) return;
  if(sel&&sel.b===it) deselectPhoto();
  if(it.type==="image") store.delImage(cur.id,it.id).catch(()=>{});
  cur.free=(cur.free||[]).filter(x=>x.id!==it.id);
  renderFree(); touch(); fit(); sizeCanvas();
  setStatus(it.type==="image"?"写真を消しました":"文字を消しました",true);
}
function selectFree(it,el,img){
  if(sel&&sel.el&&sel.el!==el) sel.el.classList.remove("sel");
  if(sel&&sel.fig) sel.fig.classList.remove("sel");
  sel={free:true,b:it,el,img,fig:null,tag:null};
  el.classList.add("sel");
  $("#photobar").classList.add("on");
  syncPhotoBar();
}
function setAngle(b,img,d){ b.r=d; if(img) img.style.setProperty("--r",d+"deg"); }
function selectPhoto(b,fig,img,tag){
  if(sel&&sel.fig&&sel.fig!==fig) sel.fig.classList.remove("sel");
  if(sel&&sel.el) sel.el.classList.remove("sel");
  sel={b,fig,img,tag};
  fig.classList.add("sel");
  $("#photobar").classList.add("on");
  syncPhotoBar();
}
function deselectPhoto(){
  if(sel&&sel.fig) sel.fig.classList.remove("sel");
  if(sel&&sel.el) sel.el.classList.remove("sel");
  sel=null;
  $("#photobar").classList.remove("on");
}
function syncPhotoBar(){
  if(!sel) return;
  $("#pSize").textContent = sel.free ? Math.round(sel.b.w||240)+"px" : Math.round(sel.b.w)+"%";
  $("#pAngle").textContent = Math.round(sel.b.r||0)+"°";
  $("#pFloat").hidden = !!sel.free;      // すでに浮いているものには出さない
}
function nudgePhoto(dw,dr){
  if(!sel) return;
  if(sel.free){
    if(dw){ sel.b.w=Math.max(60,Math.min(PW-40,(sel.b.w||240)+dw*4)); sel.el.style.setProperty("--w",sel.b.w+"px"); }
    if(dr){ let d=(sel.b.r||0)+dr; if(d>180)d-=360; if(d<-180)d+=360; sel.b.r=d; sel.el.style.setProperty("--r",d+"deg"); }
  }else{
    if(dw){ sel.b.w=Math.min(100,Math.max(20,sel.b.w+dw)); sel.fig.style.setProperty("--w",sel.b.w+"%"); }
    if(dr){ let d=(sel.b.r||0)+dr; if(d>180)d-=360; if(d<-180)d+=360; setAngle(sel.b,sel.img,d); }
    if(sel.tag) sel.tag.textContent=Math.round(sel.b.w)+"% / "+Math.round(sel.b.r)+"°";
  }
  syncPhotoBar(); touch(); fit(); sizeCanvas();
}
$("#pSmaller").onclick=()=>nudgePhoto(-10,0);
$("#pBigger").onclick=()=>nudgePhoto(10,0);

/* ================= 写真 ================= */
function shrink(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{
      const img=new Image();
      img.onerror=rej;
      img.onload=()=>{
        // 透けている所があるか確かめる（あるならPNGのまま、下地も塗らない）
        let clear=false;
        try{
          const t=document.createElement("canvas");
          const n=64;
          const r0=Math.min(n/img.width, n/img.height, 1);
          t.width=Math.max(1,Math.round(img.width*r0)); t.height=Math.max(1,Math.round(img.height*r0));
          const tx=t.getContext("2d",{willReadFrequently:true});
          tx.drawImage(img,0,0,t.width,t.height);
          const d=tx.getImageData(0,0,t.width,t.height).data;
          for(let i=3;i<d.length;i+=4){ if(d[i]<250){ clear=true; break; } }
        }catch(e){ clear=/png|webp|gif|svg/i.test(file.type||""); }

        const draw=(max)=>{
          const r=Math.min(1, max/Math.max(img.width,img.height));
          const c=document.createElement("canvas");
          c.width=Math.max(1,Math.round(img.width*r)); c.height=Math.max(1,Math.round(img.height*r));
          const x=c.getContext("2d");
          if(!clear){ x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); }   // 透過は塗りつぶさない
          x.drawImage(img,0,0,c.width,c.height);
          return c;
        };

        let out="";
        if(clear){
          // 透過つき：PNGのまま。収まらなければ寸法だけ落とす
          for(const max of [1200,1000,800,640,512,400]){
            out=draw(max).toDataURL("image/png");
            if(out.length<200000) break;
          }
        }else{
          for(const pl of [[1400,.82],[1200,.78],[1000,.72],[800,.66],[640,.6]]){
            out=draw(pl[0]).toDataURL("image/jpeg",pl[1]);
            if(out.length<200000) break;
          }
        }
        res(out);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function takeFiles(files,at){
  if(!canEdit||!cur) return;
  let n=0;
  for(const f of [...files].filter(f=>f.type.startsWith("image/"))){
    try{
      const src=await shrink(f);
      const it={id:uid(),type:"image",src,alt:"",
        w:320,r:0,
        x:Math.round((at?at[0]:PW*0.5)-160+n*24),
        y:Math.round((at?at[1]:220)-100+n*24)};
      it.x=Math.max(-40,Math.min(PW-80,it.x));
      it.y=Math.max(0,it.y);
      setStatus("写真をしまっています…");
      await store.putImage(cur.id,it.id,src);
      cur.free=cur.free||[]; cur.free.push(it);
      renderFree(); touch(); fit(); sizeCanvas();
      n++;
    }catch(e){ setStatus("写真をしまえませんでした（もっと小さい画像でお試しを）"); }
  }
  if(n) setStatus("写真を置きました。ひっぱって場所を決められます",true);
}

/* ================= 手書き ================= */
const cv=$("#inkLayer"), ctx=cv.getContext("2d");
let drawing=null;
function sizeCanvas(){
  const h=Math.max(PH,$("#paper").offsetHeight);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=PW+"px"; cv.style.height=h+"px";
  cv.width=Math.round(PW*dpr); cv.height=Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  redraw();
}
function path(s){
  ctx.beginPath();
  s.pts.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  if(s.pts.length===1){ ctx.moveTo(s.pts[0][0],s.pts[0][1]); ctx.lineTo(s.pts[0][0]+.1,s.pts[0][1]); }
}
function redraw(){
  ctx.clearRect(0,0,PW,cv.height);
  ctx.lineCap="round"; ctx.lineJoin="round";
  (cur?cur.ink:[]).forEach(s=>{ ctx.strokeStyle=s.c; ctx.lineWidth=s.w; path(s); ctx.stroke(); });
  if(drawing){ ctx.strokeStyle=drawing.c; ctx.lineWidth=drawing.w; path(drawing); ctx.stroke(); }
}
function pos(e){
  const r=cv.getBoundingClientRect(), k=r.width/PW||1;
  return [(e.clientX-r.left)/k,(e.clientY-r.top)/k];
}
function hit(p){
  for(let i=cur.ink.length-1;i>=0;i--){
    const s=cur.ink[i], tol=Math.max(s.w,12);
    for(const q of s.pts){ if(Math.hypot(q[0]-p[0],q[1]-p[1])<tol) return i; }
  }
  return -1;
}
cv.addEventListener("pointerdown",(e)=>{
  if(tool==="move"||!canEdit) return;
  cv.setPointerCapture(e.pointerId); e.preventDefault();
  const p=pos(e);
  if(tool==="erase"){ const i=hit(p); if(i>=0){ cur.ink.splice(i,1); redraw(); touch(); } return; }
  drawing={c:color,w:size,pts:[p]}; redraw();
});
cv.addEventListener("pointermove",(e)=>{
  if(tool==="move"||!canEdit) return;
  const p=pos(e);
  if(tool==="erase"){ if(e.buttons){ const i=hit(p); if(i>=0){ cur.ink.splice(i,1); redraw(); touch(); } } return; }
  if(!drawing) return;
  const last=drawing.pts[drawing.pts.length-1];
  if(Math.abs(last[0]-p[0])+Math.abs(last[1]-p[1])<1.6) return;
  drawing.pts.push(p); redraw();
});
function endStroke(){ if(drawing){ cur.ink.push(drawing); drawing=null; redraw(); touch(); } }

function searchText(){
  const parts=[cur.title||""];
  if(cur.kind==="month"){
    Object.keys(cur.days||{}).sort((a,b)=>a-b).forEach(d=>parts.push(d+"日 "+cur.days[d]));
  }else{
    (cur.blocks||[]).forEach(b=>parts.push(b.type==="text"?(b.text||""):(b.caption||"")));
  }
  (cur.free||[]).forEach(it=>{ if(it.type==="text") parts.push(it.text||""); });
  return parts.join(" ").replace(/\s+/g," ").trim().slice(0,1200);
}

function touch(){
  if(!cur||!canEdit) return;
  cur.title=$("#pTitle").textContent.trim();

  clearTimeout(timer); timer=setTimeout(flush,700);

async function flush(){
  if(!cur||!dirty||saving||!canEdit) return;
  saving=true; dirty=false;
  const ink=cur.ink.map(s=>({c:s.c,w:s.w,pts:s.pts.map(q=>[Math.round(q[0]*10)/10,Math.round(q[1]*10)/10])}));
  const free=(cur.free||[]).map(it=>({id:it.id,type:it.type,x:Math.round(it.x||0),y:Math.round(it.y||0),
    w:Math.round(it.w||240),r:Math.round(it.r||0),text:it.type==="text"?(it.text||""):undefined,alt:it.alt||undefined}));
  const base={id:cur.id,title:cur.title,updated:cur.updated,folder:cur.folder||folderId,kind:cur.kind||"note",q:searchText(),ink,free};
  const body=cur.kind==="month"
    ? Object.assign(base,{month:cur.month,days:cur.days||{},blocks:[]})
    : Object.assign(base,{blocks:cur.blocks.map(b=> b.type==="image"?{id:b.id,type:"image",caption:b.caption||"",w:Math.round(b.w||100),r:Math.round(b.r||0)}:{id:b.id,type:"text",text:b.text||""})});
  try{
    await store.put(body);
    const at=index.find(p=>p.id===cur.id);
    const row={id:cur.id,title:cur.title,updated:cur.updated,folder:body.folder,kind:body.kind,q:body.q};
    if(at) Object.assign(at,row); else index.push(row);
    await store.save();
    $("#pDate").textContent=fmt(cur.updated);
    renderList(); setStatus("保存しました "+fmt(cur.updated),true);
  }catch(e){
    dirty=true; setStatus("保存できませんでした（もう一度書くと再挑戦します）");
  }
  saving=false;
}

/* 指に貼りつく頁めくり：1:1で追い、離した速度で行き先を決め、端はゴムで粘る */
const leaf=makeSpring(v=>{
  const el=$("#leafwrap"); if(!el) return;
  const w=($("#stage").clientWidth)||1;
  const t=Math.max(-1,Math.min(1, v/w));           // -1〜1（左へ引くと負）
  const a=Math.abs(t);
  el.style.setProperty("--ry", (t*105)+"deg");        // 綴じ目を軸に紙が倒れる
  el.style.setProperty("--leafop", a>0.8 ? String(Math.max(0,(1-a)/0.2)) : "1");
  const sh=$("#shade");
  if(sh){
    sh.style.setProperty("--shade", Math.min(.9, a*1.2));
    sh.style.setProperty("--shadedir", t<0 ? "90deg" : "270deg");
  }
  const un=$("#undersheet");
  if(un) un.style.setProperty("--underOn", a>0.02 ? "1" : "0");
});
(function drag(){
  const st=$("#stage");
  let id=null,x0=0,y0=0,sl0=0,locked=false,hist=[],w=0,off=0;
  const zoomed=()=>st.classList.contains("zoomed");
  const canDrag=()=> tool==="move" && !pinching;
  const near=(dir)=>{ const l=ordered(), i=l.findIndex(p=>cur&&p.id===cur.id); return dir<0 ? (i>=0&&i<l.length-1) : (i>0); };

  st.addEventListener("pointerdown",(e)=>{
    if(!canDrag()||id!==null) return;
    if(e.pointerType==="mouse"&&e.button!==0) return;
    if(e.target.closest("a,button,[contenteditable='true'],.fitem,.i-block,.md,input")) return;
    id=e.pointerId; x0=e.clientX; y0=e.clientY; locked=false; off=0;
    sl0=st.scrollLeft;
    w=st.clientWidth||1; hist=[[e.clientX,performance.now()]];
    leaf.stop();
  },{passive:true});

  st.addEventListener("pointermove",(e)=>{
    if(e.pointerId!==id) return;
    if(pinching){ id=null; locked=false; leaf.to(0,{damping:1,response:.3}); return; }
    const dx=e.clientX-x0, dy=e.clientY-y0;
    if(!locked){
      const need=(e.pointerType==="mouse")?16:10;   // 動かす気があるか見極めてから掴む
      if(Math.abs(dx)<need) return;
      if(Math.abs(dy)>Math.abs(dx)){ id=null; return; }
      locked=true; try{ st.setPointerCapture(id); }catch(err){}
    }
    e.preventDefault();
    hist.push([e.clientX,performance.now()]); if(hist.length>6) hist.shift();

    if(zoomed()){
      // 拡大中：まず紙の中を横に見て、端まで来たらそこからめくりに移る
      const max=Math.max(0, st.scrollWidth-st.clientWidth);
      const want=sl0-dx;
      if(want<0){ st.scrollLeft=0; off=-want; }
      else if(want>max){ st.scrollLeft=max; off=max-want; }
      else { st.scrollLeft=want; off=0; }
    }else{
      off=dx;
    }
    const free=near(off<0?-1:1);
    leaf.set(off===0 ? 0 : (free ? off : rubber(off,w)));
  });

  function release(e){
    if(e.pointerId!==id) return;
    const wasLocked=locked; id=null; locked=false;
    if(!wasLocked) return;
    const now=performance.now(), old=hist[0]||[e.clientX,now];
    const dt=Math.max(now-old[1],1);
    const vel=(e.clientX-old[0])/dt*1000;          // px/秒
    const dx=leaf.value;
    if(Math.abs(dx)<1){ leaf.to(0,{damping:1,response:.3}); return; }
    const projected=dx+project(vel);
    const dir=projected<0?-1:1;
    const flick=Math.abs(vel)>340 && Math.abs(dx)>24;
    if((flick||Math.abs(projected)>w*0.22) && near(dir)){
      leaf.to(dir*w*1.05,{damping:.9,response:.28,velocity:vel,onDone:async()=>{
        flickTurn=true;                            // CSSのめくりは走らせない
        leaf.set(-dir*w*0.55);                     // 次の紙は反対側から起き上がってくる
        await (dir<0 ? goNext() : goPrev());
        flickTurn=false;
        leaf.to(0,{damping:1,response:.34});
      }});
    }else{
      leaf.to(0,{damping:1,response:.35,velocity:vel});
    }
  }
  st.addEventListener("pointerup",release);
  st.addEventListener("pointercancel",(e)=>{ if(e.pointerId===id){ id=null; locked=false; leaf.to(0,{damping:1,response:.35}); } });
})();

/* 二本指でつまむと紙が伸び縮みする。
   指の見張りは touch で行う（拡大して紙をスクロールできる時でも、二本目が触れた瞬間に
   ブラウザのスクロールを止めて、つまみに切り替えるため）。
   動かしている間は合成（transform）だけで拡縮し、離した時に一度だけ組み直す。 */
(function pinch(){
  const st=$("#stage");
  let d0=0,k0=1,scale=1,raf=0,mx=0,contentX=0,active=false;
  const lw=()=>$("#leafwrap");
  const dist=(t)=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  const midX=(t)=>(t[0].clientX+t[1].clientX)/2;

  function apply(){ raf=0; lw().style.setProperty("--pz", scale); }

  function start(t){
    active=true; pinching=true; scale=1;
    d0=dist(t)||1; k0=fitK*userZoom;
    mx=midX(t);
    const r=lw().getBoundingClientRect(), sr=st.getBoundingClientRect();
    const my=(t[0].clientY+t[1].clientY)/2;
    lw().style.transformOrigin=(((mx-r.left)/(r.width||1))*100)+"% "+(((my-r.top)/(r.height||1))*100)+"%";
    contentX=(st.scrollLeft+(mx-sr.left))/k0;
    leaf.stop(); leaf.set(0);
  }
  function move(t){
    mx=midX(t);
    let k=k0*(dist(t)/d0);
    const lo=.3, hi=2.2;
    if(k<lo) k=lo-rubber(lo-k,st.clientWidth||300)*0.4;
    if(k>hi) k=hi+rubber(k-hi,st.clientWidth||300)*0.4;
    scale=k/k0;
    if(!raf) raf=requestAnimationFrame(apply);
  }
  function finish(){
    if(!active) return;
    active=false; pinching=false;
    if(raf){ cancelAnimationFrame(raf); raf=0; }
    const el=lw();
    const finalK=Math.max(.3,Math.min(2.2,k0*scale));
    el.style.setProperty("--pz",1);
    el.style.transformOrigin="left center";
    userZoom=finalK/Math.max(fitK,.01);
    const kNow=fit();
    sizeCanvas();
    const sr=st.getBoundingClientRect();
    st.scrollLeft=contentX*kNow-(mx-sr.left);
    try{ localStorage.setItem("techo:zoom",String(userZoom)); }catch(err){}
    scale=1;
  }

  st.addEventListener("touchstart",(e)=>{
    if(e.touches.length===2){ e.preventDefault(); start([e.touches[0],e.touches[1]]); }
    else if(active) finish();
  },{passive:false});
  st.addEventListener("touchmove",(e)=>{
    if(!active) return;
    if(e.touches.length<2){ finish(); return; }
    e.preventDefault();
    move([e.touches[0],e.touches[1]]);
  },{passive:false});
  st.addEventListener("touchend",(e)=>{ if(active&&e.touches.length<2) finish(); });
  st.addEventListener("touchcancel",()=>{ if(active) finish(); });
})();

/* 二本指でトンと触れば前の頁、三本指なら次の頁 */
(function multiTap(){
  const st=$("#stage");
  const live=new Map();
  let most=0, t0=0, slipped=false;
  st.addEventListener("pointerdown",(e)=>{
    if(e.pointerType==="mouse") return;
    if(live.size===0){ most=0; t0=Date.now(); slipped=false; }
    live.set(e.pointerId,{x:e.clientX,y:e.clientY});
    most=Math.max(most,live.size);
  },{passive:true});
  st.addEventListener("pointermove",(e)=>{
    const p=live.get(e.pointerId); if(!p) return;
    if(Math.hypot(e.clientX-p.x,e.clientY-p.y)>14) slipped=true;   // 動いたらタップではない
  },{passive:true});
  const up=(e)=>{
    if(!live.has(e.pointerId)) return;
    live.delete(e.pointerId);
    if(live.size) return;                       // 全部離れてから決める
    const quick=Date.now()-t0<420;
    if(!quick||slipped||tool!=="move") return;
    if(most===2) $("#prev").click();            // 二本指 → 戻る
    else if(most>=3) $("#next").click();        // 三本指 → 進む
  };
  st.addEventListener("pointerup",up);
  st.addEventListener("pointercancel",(e)=>{ live.delete(e.pointerId); slipped=true; });
})();

/* トラックパッドの横スワイプでもめくる */
(function wheelTurn(){
  let acc=0,cool=0,timer=null;
  $("#stage").addEventListener("wheel",(e)=>{
    if(tool!=="move") return;
    if(Math.abs(e.deltaX)<=Math.abs(e.deltaY)) return;      // 縦スクロールは邪魔しない
    e.preventDefault();
    const now=Date.now();
    if(now<cool) return;
    acc+=e.deltaX;
    clearTimeout(timer); timer=setTimeout(()=>{ acc=0; },220);
    if(Math.abs(acc)>90){
      (acc>0?$("#next"):$("#prev")).click();
      acc=0; cool=now+520;
    }
  },{passive:false});
})();

/* ================= 見張り（届いた端から画面へ） ================= */
let stopPage=null;
function watchCurrentPage(){
  if(stopPage){ try{ stopPage(); }catch(e){} stopPage=null; }
  if(!cur||!store.watchPage) return;
  const id=cur.id;
  stopPage=store.watchPage(id,async(p)=>{
    if(!cur||cur.id!==id) return;
    if(dirty||saving) return;                      // こちらが書いている最中は邪魔しない
    if((p.updated||0)<=(cur.updated||0)) return;   // 自分の書き込みの跳ね返りは無視
    normalize(p);
    if(!p.folder) p.folder=folderId;
    try{
      const imgs=await store.getImages(id);
      p.blocks.forEach(b=>{ if(b.type==="image") b.src=imgs[b.id]||""; });
      (p.free||[]).forEach(it=>{ if(it.type==="image") it.src=imgs[it.id]||""; });
    }catch(e){}
    const sc=window.scrollY;
    cur=p; renderPage(); renderList();
    window.scrollTo(0,sc);
    setStatus(canEdit?"別の場所の書き込みが届きました":"更新されました",true);
  });
}
function watchAll(){
  if(store.watchList) store.watchList((rows)=>{
    index=rows;
    renderList();
    if(!cur||!index.find(p=>p.id===cur.id)){
      const l=ordered();
      if(l.length&&!dirty) openPage(l[0].id);
    }
  });
  if(store.watchFolders) store.watchFolders((list)=>{
    if(!list||!list.length) return;
    folders=list;
    if(!folders.find(f=>f.id===folderId)) folderId=folders[0].id;
    renderDividers(); renderList();
  });
}

/* ================= 起動 ================= */
(async function boot(){
  setTool("move");
  try{ const sm=localStorage.getItem("techo:sort"); if(sm) sortMode=sm; }catch(e){}
  try{ const z=parseFloat(localStorage.getItem("techo:zoom")); if(z>0) userZoom=z; }catch(e){}
  [...$("#sort").children].forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.sort===sortMode)));

  cur=blankPage(); renderPage(); fit(); setStatus("読み込み中…");
  store=local;
  try{ store=await connect(); }catch(e){ store=local; }
  if(store.kind!=="db"){
    const cfg=await loadCloudConfig();
    if(cfg){
      setStatus("つないでいます…");
      const c=await cloudStore(cfg);
      if(c) store=c;
    }
  }
  if(VIEW_ONLY && store.kind==="local"){
    const snap=await loadSnapshot();
    if(snap) store=snapshotStore(snap);
  }
  try{ index=await store.list(); }catch(e){ index=[]; }

  canEdit=VIEW_ONLY ? false : await store.writable().catch(()=>false);
  if(!VIEW_ONLY && store.kind==="cloud"){
    const inn=store.signedIn();
    $("#signFoot").hidden = canEdit;                    // 書ける人には出さない
    $("#signBtn").textContent = inn ? "別のアカウントでサインイン" : "サインインして書く";
    $("#signBtn").onclick=async()=>{ await store.signIn(); location.reload(); };
  }else{
    $("#signFoot").hidden=true;
  }
  // 手元保存（ラボ版）で編集している時だけ、公開ページへ写す道を出す
  $("#pubFoot").hidden = !(canEdit && store.kind==="local" && typeof claude==="undefined");  // 書き出せない場所には出さない
  $("#pubOut").onclick=exportPublic;
  $("#app").classList.toggle("readonly",!canEdit);
  $("#role").textContent=canEdit?"書き込めます":"";
  $("#role").hidden=!canEdit;

  try{ folders=await store.getFolders(); }catch(e){ folders=[]; }
  if(!folders.length){
    folders=[{id:"main",name:"メモ",color:STICKERS[0]}];
    if(canEdit) await saveFolders();
  }
  folderId=folders[0].id;
  renderDividers();

  const list=ordered();
  if(list.length){
    try{
      const p=await store.get(list[0].id);
      if(p){
        const imgs=await store.getImages(list[0].id);
        normalize(p);
        if(!p.folder) p.folder=folderId;
        p.blocks.forEach(b=>{ if(b.type==="image") b.src=imgs[b.id]||""; });
        (p.free||[]).forEach(it=>{ if(it.type==="image") it.src=imgs[it.id]||""; });
        cur=p;
      }
    }catch(e){}
    renderPage();
    setStatus(canEdit?"保存済み "+fmt(cur.updated):"",canEdit);
  }else{
    renderPage();
    setStatus(canEdit?"新しいノートです":"まだ何も書かれていません");
  }
  renderList(); fit();
  watchAll(); watchCurrentPage();
})();
})();
</script>
