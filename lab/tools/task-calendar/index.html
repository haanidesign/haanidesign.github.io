<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Notion の予定を月ごとに並べて、画像つきで見るカレンダー。">
<title>予定カレンダー | HAANI LAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --main:      #E1DD60;
  --main-deep: #B8B43F;
  --main-soft: #F2F0BE;
  --cream:     #FBFAEC;
  --paper:     #FFFEF7;
  --ink:       #1E1C14;
  --gray:      #8A8470;
  --pink:      #F2A0B8;
  --bd: 2.5px solid var(--ink);
  --r: 12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'M PLUS Rounded 1c','Noto Sans JP',sans-serif;
  font-weight:700; color:var(--ink); line-height:1.8;
  background-color:var(--cream);
  background-image:radial-gradient(circle, rgba(30,28,20,.13) 1.5px, transparent 1.6px);
  background-size:16px 16px;
  -webkit-font-smoothing:antialiased;
  padding:1rem .8rem 2rem;
}
.dot{font-family:'DotGothic16',monospace;font-weight:400;}
img{display:block;max-width:100%}

/* ===== アプリの窓 ===== */
.sheet{
  max-width:1240px; margin:0 auto;
  border:var(--bd); border-radius:18px; background:var(--paper);
  box-shadow:0 6px 0 var(--ink); overflow:hidden;
}

/* ===== タイトルバー ===== */
.head{
  display:flex; align-items:center; gap:.5rem; flex-wrap:wrap;
  background:var(--main); border-bottom:var(--bd); padding:.55rem .8rem;
}
.month-name{font-size:1.15rem; letter-spacing:.02em}
.year{font-size:.62rem; color:#5c5843; letter-spacing:.18em}
.spacer{flex:1}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  background:var(--paper);color:var(--ink);
  border:var(--bd);border-radius:var(--r);
  padding:.6rem 1.1rem;font:inherit;font-size:.82rem;
  box-shadow:0 3px 0 var(--ink);
  cursor:pointer;transition:transform .08s,box-shadow .08s,background .15s;
  white-space:nowrap;
}
.btn:hover{background:var(--main)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn-g{background:var(--ink);color:var(--main)}
.btn-g:hover{background:#000;color:var(--main)}
.btn-sm{padding:.35rem .75rem;font-size:.72rem;box-shadow:0 2.5px 0 var(--ink)}
.btn-sq{width:2rem;height:2rem;padding:0;font-size:.9rem;box-shadow:0 2.5px 0 var(--ink)}
select.btn{-webkit-appearance:none;appearance:none;font-size:.72rem;padding:.35rem .75rem}

/* ===== まとめの帯 ===== */
.stats{
  display:flex; gap:.45rem; flex-wrap:wrap; align-items:center;
  padding:.55rem .8rem; border-bottom:var(--bd); background:var(--cream);
}
.chip{
  display:inline-flex; align-items:center; gap:.3rem;
  font-size:.66rem; background:var(--paper);
  border:2px solid var(--ink); border-radius:100px; padding:.12rem .65rem;
}
.chip b{font-family:'DotGothic16',monospace;font-weight:400;font-size:.82rem}
.chip.y{background:var(--main)}
.chip.p{background:var(--pink)}
.chip.s{background:var(--main-soft)}
.chip.plan{border-style:dashed;background:var(--paper)}
.hint{
  margin-left:auto;
  background:var(--main-soft);border:2px dashed var(--ink);border-radius:10px;
  padding:.2rem .55rem;font-size:.62rem;font-weight:400;color:#5c5843;
}

/* ===== カレンダー ===== */
.body{padding:.7rem .8rem 1rem}
.dows,.grid{display:grid; grid-template-columns:repeat(7,1fr); gap:.4rem}
.dows{padding-bottom:.3rem; border-bottom:2px solid var(--ink)}
.dow{text-align:center; font-size:.6rem; letter-spacing:.14em; color:var(--gray)}
.grid{margin-top:.4rem}
.cell{
  min-height:118px; border:2px solid var(--ink); border-radius:var(--r);
  background:var(--cream); padding:.3rem .35rem;
  display:flex; flex-direction:column; gap:.25rem;
}
.cell.out{opacity:.28; border-style:dashed}
.cell.has{background:var(--paper); box-shadow:0 2.5px 0 var(--ink)}
.cell.today{background:var(--main-soft); box-shadow:0 2.5px 0 var(--ink)}
.cell-top{display:flex; align-items:center; gap:.3rem}
.dnum{font-family:'DotGothic16',monospace;font-weight:400;font-size:.95rem;line-height:1.2}
.cell.sat .dnum,.cell.sun .dnum{color:var(--main-deep)}
.count{margin-left:auto; font-size:.55rem; font-weight:400; color:var(--gray)}
.today-tag{
  font-size:.55rem; background:var(--ink); color:var(--main);
  border-radius:100px; padding:0 .45rem; line-height:1.5;
}

.item{
  display:block; width:100%; text-align:left; padding:0; font:inherit; color:inherit;
  background:var(--paper); border:2px solid var(--ink); border-radius:9px;
  box-shadow:0 2.5px 0 var(--ink); overflow:hidden; cursor:pointer;
  transition:transform .08s,box-shadow .08s,background .15s;
}
.item:hover{background:var(--main-soft)}
.item:active{transform:translateY(2.5px);box-shadow:0 0 0 var(--ink)}
.item.plan{border-style:dashed}
.item-top{display:flex; align-items:center; gap:.25rem; padding:.18rem .3rem 0}
.badge{
  font-size:.52rem; border-radius:100px; padding:0 .5rem; line-height:1.6;
  border:2px solid var(--ink); background:var(--paper);
}
.badge.live{background:var(--ink); color:var(--main)}
.badge.video{background:var(--main)}
.badge.short{background:var(--main-soft)}
.badge.plan{background:var(--pink); border-style:dashed}
.time{
  font-family:'DotGothic16',monospace;font-weight:400;
  font-size:.58rem; color:var(--gray); margin-left:auto;
}
.thumb{
  display:block; width:100%; aspect-ratio:16/9; object-fit:cover;
  border:2px solid var(--ink); border-left:0; border-right:0;
  background:var(--main-soft); margin-top:.18rem;
}
.thumb.empty{
  display:grid; place-items:center; font-size:.55rem; font-weight:400; color:var(--gray);
  border-style:dashed;
}
.item-bottom{display:flex; align-items:center; gap:.25rem; padding:.1rem .3rem .2rem; font-size:.58rem}
.item-title{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item-bottom .more{margin-left:auto; color:var(--gray); font-weight:400}

/* ===== 編集パネル ===== */
.veil{position:fixed; inset:0; background:rgba(30,28,20,.45); display:none; place-items:center; padding:1rem; z-index:20}
.veil.on{display:grid}
.panel{
  width:min(420px,100%); background:var(--paper);
  border:var(--bd); border-radius:18px; box-shadow:0 6px 0 var(--ink);
  padding:1rem; max-height:90vh; overflow:auto;
}
.panel h2{
  display:inline-block; background:var(--ink); color:var(--main);
  border-radius:100px; padding:.15rem .8rem; font-size:.66rem; margin-bottom:.6rem;
}
.panel label{display:block; font-size:.62rem; color:var(--gray); margin:.7rem 0 .2rem}
.panel input[type=text],.panel input[type=time]{
  width:100%; font:inherit; font-size:.82rem; padding:.45rem .6rem;
  border:2px solid var(--ink); border-radius:9px; background:var(--cream); color:inherit;
}
.types{display:flex; gap:.3rem; flex-wrap:wrap}
.types button{
  font:inherit; font-size:.66rem; background:var(--paper); color:var(--ink);
  border:2px solid var(--ink); border-radius:100px; padding:.1rem .7rem;
  box-shadow:0 2.5px 0 var(--ink); cursor:pointer;
  transition:transform .08s,box-shadow .08s,background .15s;
}
.types button:hover{background:var(--main-soft)}
.types button[aria-pressed=true]{background:var(--main); box-shadow:0 0 0 var(--ink); transform:translateY(2.5px)}
.drop{
  margin-top:.2rem; border:2px dashed var(--ink); border-radius:10px; padding:.55rem;
  text-align:center; font-size:.66rem; font-weight:400; color:#5c5843;
  cursor:pointer; background:var(--main-soft);
}
.drop.over{background:var(--main)}
.drop img{border:2px solid var(--ink); border-radius:8px; margin-bottom:.4rem}
.panel-btns{display:flex; gap:.4rem; margin-top:1rem}
.panel-btns .btn{flex:1}
.btn-p{background:var(--pink)}
.btn-p:hover{background:var(--pink)}
.note{font-size:.62rem; font-weight:400; color:var(--gray); margin-top:.7rem; line-height:1.6}

@media (max-width:760px){
  body{padding:.5rem .35rem 1.5rem}
  .dows,.grid{gap:.25rem}
  .cell{min-height:92px; padding:.22rem}
  .thumb{aspect-ratio:4/3}
  .hint{display:none}
}
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <div class="head">
    <h1 class="month-name" id="monthName">September</h1>
    <span class="year dot" id="yearNum">2026</span>
    <button class="btn btn-sq" id="prev" title="前の月">◀</button>
    <button class="btn btn-sq" id="next" title="次の月">▶</button>
    <select class="btn" id="jump" title="月を選ぶ"></select>
    <div class="spacer"></div>
    <button class="btn btn-sm btn-g" id="export">画像を書き出し</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="body">
    <div class="dows">
      <div class="dow">MON</div><div class="dow">TUE</div><div class="dow">WED</div>
      <div class="dow">THU</div><div class="dow">FRI</div>
      <div class="dow">SAT</div><div class="dow">SUN</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="veil" id="veil">
  <div class="panel" role="dialog" aria-modal="true">
    <h2 id="panelTitle">予定</h2>
    <label>タイトル</label>
    <input type="text" id="fTitle" placeholder="たとえば 雑談配信">
    <label>しゅるい</label>
    <div class="types" id="fTypes"></div>
    <label>時こく</label>
    <input type="time" id="fTime">
    <label>長さ（1:23:45 のように）</label>
    <input type="text" id="fDur" placeholder="1:23:45">
    <label>画像</label>
    <div class="drop" id="drop">
      <div id="dropBody">ここにドロップ／クリックで選ぶ</div>
    </div>
    <div class="panel-btns">
      <button class="btn btn-sm" id="save">ほぞん</button>
      <button class="btn btn-sm btn-p" id="del">けす</button>
      <button class="btn btn-sm" id="cancel">やめる</button>
    </div>
    <p class="note" id="panelNote"></p>
  </div>
</div>

<script>
/* ===========================================================
   予定カレンダー
   ・Notion から同期した data/notion.json を読む（読み取りだけ）
   ・時こく・長さ・画像・自分で足した予定は、この端末の中に持つ
     （公開リポジトリに画像を置かないため。IndexedDB に入れる）
   =========================================================== */

const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
const TYPES = [
  {key:"live",  label:"LIVE"},
  {key:"video", label:"VIDEO"},
  {key:"short", label:"SHORT"},
  {key:"plan",  label:"PLAN"},
];

/* ---------- 置き場（IndexedDB。画像があるので localStorage では足りない） ---------- */
const DB_NAME = "haani-task-calendar", STORE = "kv";
let dbp = null;
function db(){
  if(dbp) return dbp;
  dbp = new Promise((ok,ng)=>{
    const r = indexedDB.open(DB_NAME,1);
    r.onupgradeneeded = ()=> r.result.createObjectStore(STORE);
    r.onsuccess = ()=> ok(r.result);
    r.onerror = ()=> ng(r.error);
  });
  return dbp;
}
async function kvGet(key){
  try{
    const d = await db();
    return await new Promise((ok,ng)=>{
      const q = d.transaction(STORE,"readonly").objectStore(STORE).get(key);
      q.onsuccess = ()=> ok(q.result); q.onerror = ()=> ng(q.error);
    });
  }catch{ return undefined; }
}
async function kvSet(key,val){
  try{
    const d = await db();
    await new Promise((ok,ng)=>{
      const t = d.transaction(STORE,"readwrite");
      t.objectStore(STORE).put(val,key);
      t.oncomplete = ok; t.onerror = ()=> ng(t.error);
    });
  }catch(e){ alert("この端末に保存できませんでした。\n" + e.message); }
}

/* ---------- 状態 ---------- */
const today = new Date();
let view = {y: today.getFullYear(), m: today.getMonth()};
let notion = [];     // Notion から来たもの（読むだけ）
let mine = {};       // 自分で足した予定  id -> item
let over = {};       // Notion のものへの上書き  id -> {time,dur,image,type,title,hidden}
let editing = null;  // いま開いている編集対象

const $ = (s)=> document.querySelector(s);
const pad = (n)=> String(n).padStart(2,"0");
const ymd = (y,m,d)=> `${y}-${pad(m+1)}-${pad(d)}`;

/* Notion の「カテゴリー」を、見た目のしゅるいに寄せる */
function guessType(cat, title){
  const s = ((cat||"") + " " + (title||"")).toLowerCase();
  if(/live|配信|生放送|歌枠|雑談/.test(s)) return "live";
  if(/short|ショート|切り抜き/.test(s)) return "short";
  if(/video|動画|投稿/.test(s)) return "video";
  if(/予定|締切|plan|todo/.test(s)) return "plan";
  return "plan";
}

/* 長さの文字（1:23:45 / 12:34）を秒に */
function durToSec(s){
  if(!s) return 0;
  const p = String(s).split(":").map(n=>parseInt(n,10)||0);
  if(p.length===3) return p[0]*3600 + p[1]*60 + p[2];
  if(p.length===2) return p[0]*60 + p[1];
  return p[0]||0;
}
function humanHours(sec){
  const h = Math.floor(sec/3600), m = Math.round((sec%3600)/60);
  if(!sec) return "0分";
  return (h? h+"時間":"") + (m? m+"分":"");
}

/* ---------- 読み込み ---------- */
async function load(){
  try{
    const res = await fetch("data/notion.json?t=" + Date.now(), {cache:"no-store"});
    if(res.ok){
      const json = await res.json();
      notion = (json.tasks||[]).filter(t=>t.date).map(t=>({
        id: t.id, title: t.title, date: t.date, category: t.category,
        url: t.url, source: "notion",
        time: t.time || "",
        // 画像はリポジトリの根から数えた場所にあるので、ここから見た形に直す
        image: t.image ? "../../../" + t.image : ""
      }));
    }
  }catch{ /* オフラインでも自分の予定は見られるようにする */ }
  mine = (await kvGet("mine")) || {};
  over = (await kvGet("over")) || {};
}

/* その月のぶんを、日付ごとにまとめる */
function itemsOf(y,m){
  const out = {};
  const put = (it)=>{
    if(!it.date) return;
    const [yy,mm] = it.date.split("-").map(Number);
    if(yy!==y || mm!==m+1) return;
    (out[it.date] ||= []).push(it);
  };
  for(const t of notion){
    const o = over[t.id] || {};
    if(o.hidden) continue;
    put({
      id:t.id, source:"notion", url:t.url,
      title: o.title ?? t.title,
      date: o.date ?? t.date,
      type: o.type ?? guessType(t.category, t.title),
      time: o.time ?? t.time ?? "", dur: o.dur || "", image: o.image || t.image || ""
    });
  }
  for(const it of Object.values(mine)) put({...it, source:"mine"});
  for(const k of Object.keys(out)){
    out[k].sort((a,b)=> (a.time||"99:99").localeCompare(b.time||"99:99"));
  }
  return out;
}

/* ---------- 描く ---------- */
function render(){
  const {y,m} = view;
  $("#monthName").textContent = MONTHS[m];
  $("#yearNum").textContent = y;

  const byDate = itemsOf(y,m);
  const all = Object.values(byDate).flat();

  // まとめ
  const n = (t)=> all.filter(i=>i.type===t).length;
  const liveSec = all.filter(i=>i.type==="live").reduce((s,i)=> s + durToSec(i.dur), 0);
  const stats = $("#stats");
  stats.innerHTML = "";
  const chip = (cls, html)=>{
    const el = document.createElement("div");
    el.className = "chip " + cls; el.innerHTML = html; stats.appendChild(el);
  };
  chip("s", `SHORT <b>${n("short")}</b> 本`);
  chip("y", `VIDEO <b>${n("video")}</b> 本`);
  chip("p", `LIVE <b>${n("live")}</b> 本 / ${humanHours(liveSec)}`);
  chip("", `出した日 <b>${Object.keys(byDate).length}</b> 日`);
  if(n("plan")) chip("plan", `予定 <b>${n("plan")}</b> 本`);
  const hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = "日付を右クリックで予定を書けます";
  stats.appendChild(hint);

  // ます目（月曜はじまり）
  const first = new Date(y,m,1);
  const lead = (first.getDay() + 6) % 7;
  const last = new Date(y,m+1,0).getDate();
  const cells = Math.ceil((lead + last)/7)*7;
  const grid = $("#grid");
  grid.innerHTML = "";

  for(let i=0;i<cells;i++){
    const dnum = i - lead + 1;
    const cell = document.createElement("div");
    cell.className = "cell";
    if(dnum<1 || dnum>last){ cell.classList.add("out"); grid.appendChild(cell); continue; }

    const date = ymd(y,m,dnum);
    const dow = new Date(y,m,dnum).getDay();
    if(dow===6) cell.classList.add("sat");
    if(dow===0) cell.classList.add("sun");
    const isToday = date === ymd(today.getFullYear(), today.getMonth(), today.getDate());
    if(isToday) cell.classList.add("today");

    const items = byDate[date] || [];
    if(items.length) cell.classList.add("has");

    const top = document.createElement("div");
    top.className = "cell-top";
    top.innerHTML = `<span class="dnum">${dnum}</span>` +
      (isToday ? `<span class="today-tag">TODAY</span>` : "") +
      (items.length ? `<span class="count">${items.length} ITEM</span>` : "");
    cell.appendChild(top);

    for(const it of items) cell.appendChild(itemNode(it));

    cell.addEventListener("contextmenu", (e)=>{ e.preventDefault(); openNew(date); });
    cell.addEventListener("dblclick", ()=> openNew(date));
    grid.appendChild(cell);
  }

  // 月えらび
  const jump = $("#jump");
  const months = new Map();
  for(const t of notion){ const k = t.date.slice(0,7); months.set(k,(months.get(k)||0)+1); }
  for(const it of Object.values(mine)){ const k = it.date.slice(0,7); months.set(k,(months.get(k)||0)+1); }
  const here = `${y}-${pad(m+1)}`;
  if(!months.has(here)) months.set(here, 0);
  jump.innerHTML = "";
  [...months.keys()].sort().forEach(k=>{
    const [yy,mm] = k.split("-").map(Number);
    const op = document.createElement("option");
    op.value = k;
    op.textContent = `${yy}年${mm}月（${months.get(k)}本）`;
    if(k===here) op.selected = true;
    jump.appendChild(op);
  });
}

function itemNode(it){
  const b = document.createElement("button");
  b.className = "item" + (it.type==="plan" ? " plan" : "");
  b.type = "button";
  const t = TYPES.find(t=>t.key===it.type) || TYPES[3];
  const img = it.image
    ? `<img class="thumb" src="${it.image}" alt="">`
    : `<div class="thumb empty">画像なし</div>`;
  b.innerHTML =
    `<div class="item-top"><span class="badge ${t.key}">${t.label}</span>` +
    (it.time ? `<span class="time">${it.time}</span>` : "") + `</div>` +
    img +
    `<div class="item-bottom"><span class="item-title">${it.dur || it.title}</span><span class="more">…</span></div>`;
  b.title = it.title;
  b.addEventListener("click", ()=> openEdit(it));
  return b;
}

/* ---------- 編集 ---------- */
let pendingImage = "";
function openNew(date){
  editing = {id:"m" + Date.now().toString(36), source:"mine", date, title:"", type:"plan", time:"", dur:"", image:""};
  fillPanel("予定を書く", `${date} に足します`);
}
function openEdit(it){
  editing = {...it};
  fillPanel("予定をなおす", it.source==="notion" ? "Notion から来た予定です。なおした内容はこの端末にだけ残ります。" : "自分で足した予定です。");
}
function fillPanel(title, note){
  $("#panelTitle").textContent = title;
  $("#panelNote").textContent = note;
  $("#fTitle").value = editing.title || "";
  $("#fTime").value = editing.time || "";
  $("#fDur").value = editing.dur || "";
  pendingImage = editing.image || "";
  drawDrop();
  drawTypes();
  $("#veil").classList.add("on");
  $("#fTitle").focus();
}
function drawTypes(){
  const box = $("#fTypes"); box.innerHTML = "";
  for(const t of TYPES){
    const b = document.createElement("button");
    b.type = "button"; b.textContent = t.label;
    b.setAttribute("aria-pressed", String(editing.type===t.key));
    b.addEventListener("click", ()=>{ editing.type = t.key; drawTypes(); });
    box.appendChild(b);
  }
}
function drawDrop(){
  $("#dropBody").innerHTML = pendingImage
    ? `<img src="${pendingImage}" alt=""><span>クリックで えらびなおす</span>`
    : "ここにドロップ／クリックで選ぶ";
}
function closePanel(){ $("#veil").classList.remove("on"); editing = null; }

/* 画像は長い辺 640px まで縮めて持つ（端末の置き場をふさがないため） */
function shrink(file){
  return new Promise((ok,ng)=>{
    const fr = new FileReader();
    fr.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const max = 640, s = Math.min(1, max/Math.max(img.width,img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        ok(c.toDataURL("image/jpeg",0.82));
      };
      img.onerror = ()=> ng(new Error("画像を読めませんでした"));
      img.src = fr.result;
    };
    fr.onerror = ()=> ng(new Error("画像を読めませんでした"));
    fr.readAsDataURL(file);
  });
}

async function save(){
  if(!editing) return;
  const v = {
    title: $("#fTitle").value.trim(),
    time: $("#fTime").value,
    dur: $("#fDur").value.trim(),
    image: pendingImage,
    type: editing.type,
  };
  if(editing.source==="mine"){
    if(!v.title) v.title = "予定";
    mine[editing.id] = {id:editing.id, date:editing.date, ...v};
    await kvSet("mine", mine);
  }else{
    over[editing.id] = {...(over[editing.id]||{}), ...v};
    await kvSet("over", over);
  }
  closePanel(); render();
}
async function remove(){
  if(!editing) return;
  if(!confirm("この予定を消します。よろしいですか。")) return;
  if(editing.source==="mine"){ delete mine[editing.id]; await kvSet("mine", mine); }
  else { over[editing.id] = {...(over[editing.id]||{}), hidden:true}; await kvSet("over", over); }
  closePanel(); render();
}

/* ---------- 画像に書き出し ---------- */
async function exportPng(){
  const node = $("#sheet");
  const rect = node.getBoundingClientRect();
  const w = Math.ceil(rect.width), h = Math.ceil(node.scrollHeight);
  const css = [...document.querySelectorAll("style")].map(s=>s.textContent).join("\n");
  const clone = node.cloneNode(true);
  clone.style.margin = "0";
  const html =
    `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${w}px;background:#fff">` +
    `<style>${css}</style>${clone.outerHTML}</div>`;
  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">` +
    `<foreignObject x="0" y="0" width="${w}" height="${h}">${html}</foreignObject></svg>`;
  const img = new Image();
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  try{
    await img.decode();
    const c = document.createElement("canvas");
    const k = 2;
    c.width = w*k; c.height = h*k;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height);
    ctx.scale(k,k); ctx.drawImage(img,0,0);
    const a = document.createElement("a");
    a.download = `calendar-${view.y}-${pad(view.m+1)}.png`;
    a.href = c.toDataURL("image/png");
    a.click();
  }catch(e){
    alert("書き出せませんでした。画面をそのまま撮ってください。\n" + e.message);
  }
}

/* ---------- 配線 ---------- */
$("#prev").addEventListener("click", ()=>{ view.m--; if(view.m<0){view.m=11; view.y--;} render(); });
$("#next").addEventListener("click", ()=>{ view.m++; if(view.m>11){view.m=0; view.y++;} render(); });
$("#jump").addEventListener("change", (e)=>{
  const [y,m] = e.target.value.split("-").map(Number);
  view = {y, m:m-1}; render();
});
$("#export").addEventListener("click", exportPng);
$("#save").addEventListener("click", save);
$("#del").addEventListener("click", remove);
$("#cancel").addEventListener("click", closePanel);
$("#veil").addEventListener("click", (e)=>{ if(e.target===$("#veil")) closePanel(); });
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closePanel(); });

const picker = document.createElement("input");
picker.type = "file"; picker.accept = "image/*";
picker.addEventListener("change", async ()=>{
  const f = picker.files[0]; if(!f) return;
  try{ pendingImage = await shrink(f); drawDrop(); }catch(err){ alert(err.message); }
  picker.value = "";
});
const drop = $("#drop");
drop.addEventListener("click", ()=> picker.click());
drop.addEventListener("dragover", (e)=>{ e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", ()=> drop.classList.remove("over"));
drop.addEventListener("drop", async (e)=>{
  e.preventDefault(); drop.classList.remove("over");
  const f = [...e.dataTransfer.files].find(f=>f.type.startsWith("image/"));
  if(!f) return;
  try{ pendingImage = await shrink(f); drawDrop(); }catch(err){ alert(err.message); }
});

load().then(render);
</script>
