<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>タスクカレンダー｜HAANI LAB</title>
<meta name="description" content="カテゴリー別のタスク管理と、作業時間のログカレンダー。ブラウザだけで動いて、書いたものはこの端末に残ります。">
<link rel="icon" type="image/png" href="../../../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* はぁにデザイン工房と同じ世界観（黄色・太枠・ハードシャドウ・ドット地） */
:root{
  --main:#E1DD60;
  --main-deep:#B8B43F;
  --main-soft:#F2F0BE;
  --cream:#FBFAEC;
  --paper:#FFFEF7;
  --ink:#1E1C14;
  --gray:#8A8470;
  --bd:2.5px solid var(--ink);
  --r:12px;
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink);
  font-family:'M PLUS Rounded 1c','Noto Sans JP',sans-serif; font-weight:700;
  background-color:var(--cream);
  background-image:radial-gradient(circle, rgba(30,28,20,.13) 1.5px, transparent 1.6px);
  background-size:16px 16px;
  line-height:1.8; -webkit-font-smoothing:antialiased;
}
a{color:inherit}

/* ---------------- ボタン ---------------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
  background:var(--paper); color:var(--ink);
  border:var(--bd); border-radius:var(--r);
  padding:.6rem 1.1rem; font:inherit; font-weight:700; font-size:.82rem;
  box-shadow:0 3px 0 var(--ink); cursor:pointer; text-decoration:none;
  transition:transform .08s, box-shadow .08s, background .15s;
}
.btn:hover{transform:translateY(-2px); box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(3px); box-shadow:0 0 0 var(--ink)}
.btn-y{background:var(--main)}
.btn-g{background:var(--ink); color:var(--main)}
.btn-sm{padding:.38rem .8rem; font-size:.72rem; box-shadow:0 2px 0 var(--ink)}
.btn-xs{padding:.16rem .42rem; font-size:.66rem; box-shadow:0 2px 0 var(--ink); border-width:2px; border-radius:8px}

/* ---------------- アプリ窓 ---------------- */
.app{
  max-width:1240px; margin:1rem auto;
  border:var(--bd); border-radius:18px; background:var(--paper);
  box-shadow:0 6px 0 var(--ink); overflow:hidden;
}
.titlebar{
  background:var(--main); border-bottom:var(--bd);
  padding:.7rem .9rem; display:flex; align-items:center; gap:.7rem; flex-wrap:wrap;
}
.tb-title{font-size:1rem; font-weight:800; letter-spacing:.06em}
.tb-spec{
  font-size:.62rem; background:var(--paper);
  border:2px solid var(--ink); border-radius:999px; padding:.1rem .6rem;
}
.tb-actions{margin-left:auto; display:flex; gap:.5rem; flex-wrap:wrap}
.app-body{padding:1.1rem}

/* ---------------- タブ ---------------- */
.tabs{display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1rem}
.tab{
  background:var(--paper); border:var(--bd); border-radius:999px;
  box-shadow:0 3px 0 var(--ink);
  padding:.42rem .95rem; font:inherit; font-weight:700; font-size:.75rem; cursor:pointer;
  transition:transform .08s, box-shadow .08s, background .15s;
}
.tab:hover{transform:translateY(-2px); box-shadow:0 5px 0 var(--ink)}
.tab.on{background:var(--main)}

/* ---------------- メーター ---------------- */
.meters{display:flex; gap:.6rem; flex-wrap:wrap; margin-bottom:1.1rem}
.meter{
  background:var(--main-soft); border:var(--bd); border-radius:var(--r);
  box-shadow:0 3px 0 var(--ink); padding:.5rem .9rem; min-width:118px;
}
.meter b{display:block; font-size:1.35rem; line-height:1.3; letter-spacing:.02em}
.meter span{font-size:.6rem; color:var(--gray); letter-spacing:.12em}

/* ---------------- 入力 ---------------- */
.fld{
  background:var(--paper); border:var(--bd); border-radius:var(--r);
  box-shadow:0 3px 0 var(--ink);
  padding:.55rem .8rem; font:inherit; font-weight:700; font-size:.8rem; color:var(--ink);
  min-width:0;
}
.fld:focus{outline:none; background:#fff}
.fld::placeholder{color:var(--gray); font-weight:700}
.row{display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; margin-bottom:1rem}
.row .grow{flex:1 1 220px}

/* ---------------- カンバン ---------------- */
.board{display:flex; gap:.9rem; overflow-x:auto; padding-bottom:.9rem; align-items:flex-start}
.col{
  flex:0 0 268px; background:var(--paper);
  border:var(--bd); border-radius:16px; box-shadow:0 5px 0 var(--ink); padding:.7rem;
}
.col-head{display:flex; align-items:center; gap:.45rem; margin-bottom:.55rem}
.swatch{width:13px; height:13px; border-radius:50%; border:2px solid var(--ink); flex:none}
.col-name{
  flex:1 1 auto; min-width:0; background:transparent; border:none;
  font:inherit; font-weight:800; font-size:.86rem; color:var(--ink);
  padding:.1rem .25rem; border-radius:6px;
}
.col-name:focus{outline:none; background:var(--main)}
.count{
  font-size:.62rem; background:var(--main-soft);
  border:2px solid var(--ink); border-radius:999px; padding:.02rem .5rem; flex:none;
}
.add-row{display:flex; gap:.4rem; margin-bottom:.6rem}
.add-row .fld{flex:1 1 auto; padding:.34rem .6rem; font-size:.76rem; box-shadow:0 2px 0 var(--ink)}

/* ---------------- タスクカード ---------------- */
.task{
  background:var(--paper); border:2px solid var(--ink); border-radius:11px;
  padding:.45rem .5rem; margin-bottom:.5rem;
}
.task.done{opacity:.5}
.task-top{display:flex; align-items:flex-start; gap:.4rem}
.task-title{
  flex:1 1 auto; min-width:0; font-size:.78rem; line-height:1.6;
  word-break:break-word; font-weight:700;
}
.task.done .task-title{text-decoration:line-through}
.task-title-input{
  flex:1 1 auto; min-width:0; font:inherit; font-weight:700; font-size:.78rem;
  border:2px solid var(--ink); border-radius:8px; padding:.1rem .35rem; background:#fff;
}
.task-title-input:focus{outline:none}
.task-foot{display:flex; align-items:center; gap:.35rem; flex-wrap:wrap; margin-top:.35rem}
.pill{
  font-size:.6rem; border:2px solid var(--ink); border-radius:999px;
  padding:.02rem .5rem; background:var(--main-soft);
}
.icon{
  border:2px solid var(--ink); border-radius:7px; background:var(--paper);
  width:20px; height:20px; line-height:1; font-size:.68rem; padding:0;
  display:inline-flex; align-items:center; justify-content:center;
  cursor:pointer; flex:none; font-family:inherit;
}
.icon:hover{background:var(--main)}
.icon.danger:hover{background:#d9534f; color:#fff}

/* ---------------- カレンダー ---------------- */
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:.4rem}
.cal .dow{
  text-align:center; font-size:.64rem; color:var(--gray);
  letter-spacing:.1em; padding-bottom:.2rem;
}
.cal .dow.we{color:var(--main-deep)}
.day{
  min-height:78px; border:2px solid rgba(30,28,20,.18); border-radius:11px;
  background:var(--paper); padding:.3rem .35rem; text-align:left;
  font:inherit; cursor:pointer; transition:transform .08s, box-shadow .08s;
}
.day:hover{transform:translateY(-2px); box-shadow:0 4px 0 var(--ink)}
.day.sel{border:var(--bd); box-shadow:0 4px 0 var(--ink)}
.day.out{opacity:.34}
.day .dnum{font-size:.72rem; font-weight:800}
.day .dnum.today{
  display:inline-flex; align-items:center; justify-content:center;
  width:20px; height:20px; border-radius:50%; background:var(--ink); color:var(--main);
}
.day .dmin{font-size:.68rem; font-weight:800; margin-top:.2rem; line-height:1.3}
.day .dcnt{font-size:.58rem; color:var(--gray); line-height:1.3}

/* ---------------- リスト ---------------- */
.list{list-style:none; margin:0; padding:0}
.list li{
  display:flex; align-items:center; gap:.5rem;
  background:var(--paper); border:2px solid var(--ink); border-radius:10px;
  padding:.35rem .6rem; margin-bottom:.4rem; font-size:.76rem;
}
.list .time{font-size:.66rem; color:var(--gray); flex:none}
.list .txt{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.panel{
  border:var(--bd); border-radius:16px; background:var(--paper);
  box-shadow:0 5px 0 var(--ink); padding:.9rem; margin-top:1rem;
}
.panel h3{margin:0 0 .6rem; font-size:.86rem; font-weight:800}
.empty{text-align:center; color:var(--gray); font-size:.76rem; padding:1.6rem 0}
.hint{font-size:.66rem; color:var(--gray); font-weight:500; line-height:1.8}

.two{display:grid; grid-template-columns:1.5fr 1fr; gap:1rem; align-items:start}
.grid-tasks{display:grid; grid-template-columns:1fr 1fr; gap:.5rem}

.foot{
  max-width:1240px; margin:0 auto 2.4rem; padding:1rem;
  display:flex; gap:.8rem; align-items:center; justify-content:center; flex-wrap:wrap;
  font-size:.68rem; color:var(--gray);
}

@media (max-width:820px){
  .two{grid-template-columns:1fr}
  .grid-tasks{grid-template-columns:1fr}
}
@media (max-width:600px){
  .app{margin:.6rem; border-radius:14px}
  .app-body{padding:.9rem}
  .tb-actions{width:100%; margin-left:0}
  .cal{gap:.25rem}
  .day{min-height:62px}
}
</style>
</head>
<body>

<div class="app">
  <div class="titlebar">
    <div class="tb-title">タスクカレンダー</div>
    <span class="tb-spec">この端末に保存</span>
    <div class="tb-actions">
      <button class="btn btn-sm" id="btnExport">書き出し</button>
      <button class="btn btn-sm" id="btnImport">読み込み</button>
      <a href="../../" class="btn btn-sm btn-g">← LAB</a>
    </div>
  </div>

  <div class="app-body">
    <div class="tabs" id="tabs">
      <button class="tab on" data-view="today">今日</button>
      <button class="tab" data-view="board">タスク管理</button>
      <button class="tab" data-view="log">ログカレンダー</button>
    </div>
    <div id="view"></div>
  </div>
</div>

<footer class="foot">
  <span>© 2026 はぁにデザイン工房</span>
  <a href="../../" class="btn btn-sm">LAB</a>
  <a href="../../../" class="btn btn-sm">工房トップ</a>
</footer>

<input type="file" id="filePicker" accept="application/json" hidden>

<script>
/* =========================================================================
   保存先はこの端末の localStorage だけ。
   サーバーに送らないので、書いた内容が外に出ることはない。
   端末をまたぐときは「書き出し」→「読み込み」で移す。
   ========================================================================= */
const KEY = "haani-task-calendar-v1";
const COLORS = ["#E1DD60","#F0A35E","#E8798B","#7CC4A4","#8AA9E0","#B79AE0"];
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);

let state = load();
let view = "today";
let selectedDay = null;   // ログカレンダーで選んだ日
let anchor = new Date();  // 表示中の月
let logTarget = null;     // 「記録」を押したタスク
let showDone = false;

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.tasks)) return parsed;
    }
  }catch(e){ /* 壊れていたら初期データに戻す */ }
  // 壊れた値を残したままだと毎回ここを通るので、初期データで上書きしておく
  const fresh = seed();
  try{ localStorage.setItem(KEY, JSON.stringify(fresh)); }catch(e){}
  return fresh;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ alert("保存できませんでした。ブラウザの保存容量がいっぱいかもしれません。"); }
}
function seed(){
  const cats = [
    {id:uid(), name:"配信素材", color:COLORS[0]},
    {id:uid(), name:"漫画制作", color:COLORS[1]},
    {id:uid(), name:"事務",     color:COLORS[2]}
  ];
  const t = (catIdx, title, status) => ({
    id:uid(), catId:cats[catIdx].id, title, status:status||"todo",
    created:new Date().toISOString(), doneAt:null, due:null
  });
  return {
    cats,
    tasks:[
      t(0,"雑談配信画面の制作"), t(0,"ゲーム配信画面の制作"), t(0,"ロゴの清書","done"),
      t(1,"ネーム 第3話"), t(1,"ペン入れ 第2話"),
      t(2,"請求書の発行")
    ],
    logs:[]
  };
}

/* ---------------- 小道具 ---------------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const sameDay = (a,b) => ymd(a)===ymd(b);
function fmtMin(total){
  const h = Math.floor(total/60), m = total%60;
  if(h===0) return m+"分";
  if(m===0) return h+"時間";
  return h+"時間"+m+"分";
}
const catOf = id => state.cats.find(c=>c.id===id) || null;
const activeTasks = () => state.tasks.filter(t=>t.status!=="done");

/* =========================================================================
   描画
   ========================================================================= */
const viewEl = document.getElementById("view");

function render(){
  if(view==="today") renderToday();
  else if(view==="board") renderBoard();
  else renderLog();
}

/* ---------------- 今日 ---------------- */
function renderToday(){
  const now = new Date();
  const todayLogs = state.logs.filter(l=>sameDay(new Date(l.at), now));
  const mins = todayLogs.reduce((s,l)=>s+l.minutes,0);
  const doneToday = state.tasks.filter(t=>t.doneAt && sameDay(new Date(t.doneAt), now));
  const act = activeTasks();

  viewEl.innerHTML = `
    <div class="meters">
      <div class="meter"><b>${(now.getMonth()+1)}月${now.getDate()}日</b><span>TODAY</span></div>
      <div class="meter"><b>${fmtMin(mins)}</b><span>WORKED</span></div>
      <div class="meter"><b>${doneToday.length} / ${doneToday.length+act.length}</b><span>DONE</span></div>
    </div>

    <div class="two">
      <div class="panel">
        <h3>進行中のタスク</h3>
        <div class="row">
          <input class="fld grow" id="tTitle" placeholder="やることを書く">
          <select class="fld" id="tCat">
            <option value="">カテゴリーなし</option>
            ${state.cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}
          </select>
          <button class="btn btn-sm btn-y" id="tAdd">＋ 追加</button>
        </div>
        ${act.length===0 ? '<p class="empty">進行中のタスクはありません</p>' :
          '<div class="grid-tasks">'+act.map(taskCard).join("")+'</div>'}
      </div>

      <div class="panel" style="margin-top:0">
        <h3>今日の記録</h3>
        ${logTarget ? `
          <div style="border:2.5px solid var(--ink); border-radius:12px; background:var(--main); padding:.5rem; margin-bottom:.7rem">
            <div style="font-size:.74rem; font-weight:800; margin-bottom:.4rem">${esc(logTarget.title)}</div>
            <div class="row" style="margin:0">
              <input class="fld grow" id="lMin" placeholder="分" inputmode="numeric" style="flex:1 1 70px">
              <button class="btn btn-sm" id="lAdd">記録</button>
              <button class="btn btn-sm" id="lCancel">やめる</button>
            </div>
          </div>` : ""}
        ${todayLogs.length===0 ? '<p class="empty">タスクの「記録」から時間を残せます</p>' :
          '<ul class="list">'+todayLogs.map(logRow).join("")+'</ul>'}
      </div>
    </div>`;

  const add = () => {
    const v = document.getElementById("tTitle").value.trim();
    if(!v) return;
    state.tasks.push({
      id:uid(), catId:document.getElementById("tCat").value||null, title:v,
      status:"todo", created:new Date().toISOString(), doneAt:null, due:null
    });
    save(); render();
  };
  document.getElementById("tAdd").onclick = add;
  document.getElementById("tTitle").onkeydown = e => { if(e.key==="Enter") add(); };

  if(logTarget){
    const commit = () => {
      const m = parseInt(document.getElementById("lMin").value,10);
      if(!(m>0)) return;
      state.logs.unshift({id:uid(), title:logTarget.title, minutes:m, at:new Date().toISOString()});
      logTarget = null; save(); render();
    };
    document.getElementById("lAdd").onclick = commit;
    document.getElementById("lMin").onkeydown = e => { if(e.key==="Enter") commit(); };
    document.getElementById("lCancel").onclick = () => { logTarget = null; render(); };
    document.getElementById("lMin").focus();
  }
  bindTasks();
  bindLogRows();
}

/* ---------------- タスク管理 ---------------- */
function renderBoard(){
  const uncategorized = state.tasks.filter(t=>!t.catId);
  const cols = state.cats.map(c=>({cat:c, tasks:state.tasks.filter(t=>t.catId===c.id)}));
  if(uncategorized.length) cols.push({cat:null, tasks:uncategorized});

  viewEl.innerHTML = `
    <div class="row">
      <input class="fld grow" id="cName" placeholder="カテゴリーを追加">
      <button class="btn btn-sm btn-y" id="cAdd">＋ 追加</button>
      <button class="btn btn-sm ${showDone?"btn-y":""}" id="cDone">完了も表示</button>
      <span class="pill">${activeTasks().length}件 の進行中タスク</span>
    </div>

    ${cols.length===0 ? '<p class="empty">まずカテゴリーを1つ作ってください</p>' : `
    <div class="board">
      ${cols.map(({cat,tasks}) => {
        const vis = showDone ? tasks : tasks.filter(t=>t.status!=="done");
        const cid = cat ? cat.id : "";
        return `
        <section class="col">
          <div class="col-head">
            <span class="swatch" style="background:${cat?cat.color:"#ddd"}"></span>
            ${cat
              ? `<input class="col-name" value="${esc(cat.name)}" data-rename="${cid}" aria-label="カテゴリー名">`
              : '<span class="col-name" style="color:var(--gray)">カテゴリーなし</span>'}
            <span class="count">${vis.length}</span>
            ${cat ? `<button class="icon danger" data-delcat="${cid}" title="カテゴリーを削除">×</button>` : ""}
          </div>
          <div class="add-row">
            <input class="fld" placeholder="＋ 追加" data-newtask="${cid}">
            <button class="btn btn-xs" data-addtask="${cid}">＋</button>
          </div>
          ${vis.length===0 ? '<p class="empty" style="padding:1rem 0">タスクなし</p>' : vis.map(taskCard).join("")}
        </section>`;
      }).join("")}
    </div>`}`;

  const addCat = () => {
    const v = document.getElementById("cName").value.trim();
    if(!v) return;
    state.cats.push({id:uid(), name:v, color:COLORS[state.cats.length % COLORS.length]});
    save(); render();
  };
  document.getElementById("cAdd").onclick = addCat;
  document.getElementById("cName").onkeydown = e => { if(e.key==="Enter") addCat(); };
  document.getElementById("cDone").onclick = () => { showDone = !showDone; render(); };

  // カテゴリー名は Enter でも確定させる（blur だけだと保存された感がない）
  viewEl.querySelectorAll("[data-rename]").forEach(el => {
    const commit = () => {
      const c = catOf(el.dataset.rename);
      const v = el.value.trim();
      if(!c) return;
      if(v && v!==c.name){ c.name = v; save(); render(); }
      else el.value = c.name;
    };
    el.onblur = commit;
    el.onkeydown = e => {
      if(e.key==="Enter"){ commit(); el.blur(); }
      if(e.key==="Escape"){ const c=catOf(el.dataset.rename); if(c) el.value=c.name; el.blur(); }
    };
  });

  viewEl.querySelectorAll("[data-delcat]").forEach(el => {
    el.onclick = () => {
      const c = catOf(el.dataset.delcat);
      if(!c) return;
      if(!confirm(`「${c.name}」を削除します。中のタスクは「カテゴリーなし」に移ります。`)) return;
      state.tasks.forEach(t => { if(t.catId===c.id) t.catId = null; });
      state.cats = state.cats.filter(x=>x.id!==c.id);
      save(); render();
    };
  });

  viewEl.querySelectorAll("[data-addtask]").forEach(btn => {
    const cid = btn.dataset.addtask;
    const input = viewEl.querySelector(`[data-newtask="${cid}"]`);
    const add = () => {
      const v = input.value.trim();
      if(!v) return;
      state.tasks.push({
        id:uid(), catId:cid||null, title:v, status:"todo",
        created:new Date().toISOString(), doneAt:null, due:null
      });
      save(); render();
    };
    btn.onclick = add;
    input.onkeydown = e => { if(e.key==="Enter") add(); };
  });

  bindTasks();
}

/* ---------------- ログカレンダー ---------------- */
function renderLog(){
  const y = anchor.getFullYear(), m = anchor.getMonth();
  const monthLogs = state.logs.filter(l => {
    const d = new Date(l.at);
    return d.getFullYear()===y && d.getMonth()===m;
  });
  const total = monthLogs.reduce((s,l)=>s+l.minutes,0);
  const days = new Set(monthLogs.map(l=>ymd(new Date(l.at)))).size;

  // 月曜はじまりのマス目を作る
  const first = new Date(y, m, 1);
  const start = new Date(first);
  start.setDate(1 - ((first.getDay()+6) % 7));
  const cells = [];
  for(let i=0;i<42;i++){
    const d = new Date(start);
    d.setDate(start.getDate()+i);
    cells.push(d);
    if(i>=34 && d.getMonth()!==m && d.getDay()===0) break;
  }

  const minutesOf = d => state.logs
    .filter(l=>sameDay(new Date(l.at), d))
    .reduce((s,l)=>s+l.minutes,0);
  const peak = Math.max(1, ...cells.map(minutesOf));
  const now = new Date();

  const selLogs = selectedDay
    ? state.logs.filter(l=>sameDay(new Date(l.at), selectedDay))
    : [];

  viewEl.innerHTML = `
    <div class="row">
      <button class="btn btn-sm" id="prev">‹</button>
      <span class="pill" style="font-size:.76rem; padding:.2rem .8rem">${y}年${m+1}月</span>
      <button class="btn btn-sm" id="next">›</button>
      <button class="btn btn-sm" id="thisMonth">今月</button>
      <button class="btn btn-sm btn-y" id="csv">CSV保存</button>
    </div>

    <div class="meters">
      <div class="meter"><b>${fmtMin(total)}</b><span>今月の作業時間</span></div>
      <div class="meter"><b>${days}日</b><span>記録日数</span></div>
      <div class="meter"><b>${monthLogs.length}件</b><span>ログ数</span></div>
    </div>

    <div class="cal">
      ${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]
        .map((w,i)=>`<div class="dow${i>=5?" we":""}">${w}</div>`).join("")}
      ${cells.map(d => {
        const mm = minutesOf(d);
        const out = d.getMonth()!==m;
        const sel = selectedDay && sameDay(d, selectedDay);
        const bg = mm>0
          ? `background:color-mix(in srgb, var(--main) ${Math.round(22+(mm/peak)*68)}%, #fff)`
          : "";
        return `<button class="day${out?" out":""}${sel?" sel":""}" data-day="${ymd(d)}" style="${bg}">
          <span class="dnum${sameDay(d,now)?" today":""}">${d.getDate()}</span>
          ${mm>0 ? `<div class="dmin">${fmtMin(mm)}</div><div class="dcnt">${state.logs.filter(l=>sameDay(new Date(l.at),d)).length}件</div>` : ""}
        </button>`;
      }).join("")}
    </div>

    ${selectedDay ? `
    <div class="panel">
      <h3>${selectedDay.getMonth()+1}月${selectedDay.getDate()}日 の記録</h3>
      <div class="row">
        <input class="fld grow" id="dTitle" placeholder="やったこと">
        <input class="fld" id="dMin" placeholder="分" inputmode="numeric" style="width:84px; flex:none">
        <button class="btn btn-sm btn-y" id="dAdd">記録する</button>
      </div>
      ${selLogs.length===0 ? '<p class="empty">この日の記録はまだありません</p>'
        : '<ul class="list">'+selLogs.map(logRow).join("")+'</ul>'}
    </div>` : '<p class="hint" style="margin-top:.8rem">日付をクリックすると、その日の記録を足したり消したりできます。</p>'}`;

  document.getElementById("prev").onclick = () => { anchor = new Date(y, m-1, 1); render(); };
  document.getElementById("next").onclick = () => { anchor = new Date(y, m+1, 1); render(); };
  document.getElementById("thisMonth").onclick = () => { anchor = new Date(); render(); };
  document.getElementById("csv").onclick = () => exportCsv(monthLogs, y, m);

  viewEl.querySelectorAll("[data-day]").forEach(el => {
    el.onclick = () => {
      const [yy,mm,dd] = el.dataset.day.split("-").map(Number);
      selectedDay = new Date(yy, mm-1, dd);
      render();
    };
  });

  if(selectedDay){
    const add = () => {
      const t = document.getElementById("dTitle").value.trim();
      const mi = parseInt(document.getElementById("dMin").value,10);
      if(!t || !(mi>0)) return;
      const at = new Date(selectedDay);
      const n = new Date();
      at.setHours(n.getHours(), n.getMinutes(), 0, 0);
      state.logs.unshift({id:uid(), title:t, minutes:mi, at:at.toISOString()});
      save(); render();
    };
    document.getElementById("dAdd").onclick = add;
    document.getElementById("dTitle").onkeydown = e => { if(e.key==="Enter") add(); };
    document.getElementById("dMin").onkeydown = e => { if(e.key==="Enter") add(); };
    bindLogRows();
  }
}

/* ---------------- 部品 ---------------- */
function taskCard(t){
  const c = catOf(t.catId);
  return `
  <div class="task${t.status==="done"?" done":""}" data-task="${t.id}"
       style="box-shadow:0 3px 0 ${c?c.color:"var(--ink)"}">
    <div class="task-top">
      <button class="icon" data-toggle="${t.id}" title="${t.status==="done"?"未完了に戻す":"完了にする"}">${t.status==="done"?"✓":"▶"}</button>
      <span class="task-title" data-title="${t.id}">${esc(t.title)}</span>
      <button class="icon" data-edit="${t.id}" title="編集">✎</button>
      <button class="icon danger" data-del="${t.id}" title="削除">×</button>
    </div>
    <div class="task-foot">
      <span class="pill" style="background:${c?c.color:"#eee"}">${c?esc(c.name):"カテゴリーなし"}</span>
      ${t.status!=="done" ? `<button class="btn btn-xs" data-log="${t.id}" style="margin-left:auto">記録</button>` : ""}
    </div>
  </div>`;
}

function logRow(l){
  const d = new Date(l.at);
  return `<li>
    <span class="time">${pad(d.getHours())}:${pad(d.getMinutes())}</span>
    <span class="txt">${esc(l.title)}</span>
    <span class="pill">${fmtMin(l.minutes)}</span>
    <button class="icon danger" data-dellog="${l.id}" title="削除">×</button>
  </li>`;
}

function bindTasks(){
  viewEl.querySelectorAll("[data-toggle]").forEach(el => {
    el.onclick = () => {
      const t = state.tasks.find(x=>x.id===el.dataset.toggle);
      if(!t) return;
      if(t.status==="done"){ t.status="todo"; t.doneAt=null; }
      else { t.status="done"; t.doneAt=new Date().toISOString(); }
      save(); render();
    };
  });

  viewEl.querySelectorAll("[data-del]").forEach(el => {
    el.onclick = () => {
      state.tasks = state.tasks.filter(x=>x.id!==el.dataset.del);
      save(); render();
    };
  });

  viewEl.querySelectorAll("[data-log]").forEach(el => {
    el.onclick = () => {
      logTarget = state.tasks.find(x=>x.id===el.dataset.log) || null;
      view = "today";
      syncTabs();
      render();
    };
  });

  // 鉛筆を押したら、その場で入力欄に差し替える
  viewEl.querySelectorAll("[data-edit]").forEach(el => {
    el.onclick = () => {
      const id = el.dataset.edit;
      const t = state.tasks.find(x=>x.id===id);
      const span = viewEl.querySelector(`[data-title="${id}"]`);
      if(!t || !span) return;
      const input = document.createElement("input");
      input.className = "task-title-input";
      input.value = t.title;
      let closed = false;
      const commit = () => {
        if(closed) return;
        closed = true;
        const v = input.value.trim();
        if(v && v!==t.title){ t.title = v; save(); }
        render();
      };
      input.onblur = commit;
      input.onkeydown = e => {
        if(e.key==="Enter") commit();
        if(e.key==="Escape"){ closed = true; render(); }
      };
      span.replaceWith(input);
      input.focus();
      input.select();
    };
  });
}

function bindLogRows(){
  viewEl.querySelectorAll("[data-dellog]").forEach(el => {
    el.onclick = () => {
      state.logs = state.logs.filter(x=>x.id!==el.dataset.dellog);
      save(); render();
    };
  });
}

/* ---------------- 書き出し・読み込み ---------------- */
function download(name, text, type){
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

function exportCsv(logs, y, m){
  const rows = [["日付","内容","分"]].concat(logs.map(l => {
    const d = new Date(l.at);
    return [
      `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`,
      String(l.title).replace(/"/g,'""'),
      String(l.minutes)
    ];
  }));
  // Excel で文字化けしないよう BOM を付ける
  const csv = "﻿" + rows.map(r=>r.map(c=>`"${c}"`).join(",")).join("\r\n");
  download(`log-${y}-${pad(m+1)}.csv`, csv, "text/csv");
}

document.getElementById("btnExport").onclick = () =>
  download("task-calendar-backup.json", JSON.stringify(state, null, 2), "application/json");

const picker = document.getElementById("filePicker");
document.getElementById("btnImport").onclick = () => picker.click();
picker.onchange = () => {
  const file = picker.files && picker.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(String(reader.result));
      if(!parsed || !Array.isArray(parsed.tasks)) throw new Error("形式が違います");
      if(!confirm("いまの内容を、読み込んだファイルで置き換えます。よろしいですか?")) return;
      state = {cats:parsed.cats||[], tasks:parsed.tasks||[], logs:parsed.logs||[]};
      save(); render();
    }catch(e){
      alert("読み込めませんでした: " + e.message);
    }finally{
      picker.value = "";
    }
  };
  reader.readAsText(file);
};

/* ---------------- タブ ---------------- */
function syncTabs(){
  document.querySelectorAll("#tabs .tab").forEach(b =>
    b.classList.toggle("on", b.dataset.view===view));
}
document.querySelectorAll("#tabs .tab").forEach(b => {
  b.onclick = () => { view = b.dataset.view; syncTabs(); render(); };
});

render();
</script>
