<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>7日間の彼女 ―うたがいメーター―（ポップ版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=DotGothic16&display=swap" rel="stylesheet">
<style>
  /* ===== はぁにデザイン工房 に寄せたポップ版 =====
     2px の黒枠 ＋ ぼかしなしの落ち影 ＋ クリーム地 ＋ 黄色アクセント。
     文字は丸ゴシック、数字や小さいラベルはドット絵フォント。 */
  :root{
    --bg:#fbfaec; --card:#fffef7; --ink:#1e1c14; --muted:#8a8470;
    --pop:#e1dd60;                 /* サイトのアクセント黄 */
    --danger:#f2545b;              /* うたがい／ハート用。サイトに無い色だが意味づけに要る */
    --line:#e7e3ce;
    --shadow:0 3px 0 var(--ink);
    --shadow-lg:0 5px 0 var(--ink);
    --dots:radial-gradient(circle, rgba(255,255,255,.95) 1.7px, rgba(0,0,0,0) 1.8px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  /* ドットはゲーム画面の中だけ。外側は無地 */
  body{background:var(--bg);color:var(--ink);
    font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI",sans-serif;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;padding:10px}

  #stage{position:relative;display:flex;flex-direction:column;
    width:min(430px,100vw - 10px);height:min(780px,100dvh - 10px);
    background:var(--card);background-image:var(--dots);background-size:14px 14px;
    overflow:hidden;border:2px solid var(--ink);border-radius:14px;
    box-shadow:0 6px 0 var(--ink)}

  /* ---- HUD ---- */
  /* 上のバーはサイトのアクセント黄。黄地なので文字とフチは黒に戻す */
  #hud{display:flex;align-items:center;justify-content:space-between;
    padding:9px 12px 8px;z-index:5;
    background:var(--pop);border-bottom:2px solid var(--ink)}
  #hearts{display:flex;gap:4px}
  #hearts svg{width:30px;height:28px;overflow:visible}
  .hp path{fill:var(--danger);stroke:var(--ink);stroke-width:5;stroke-linejoin:round}
  .hp.gone path{fill:none;stroke:rgba(30,28,20,.32);stroke-width:5}
  .hp.pop{animation:pop .5s ease-out}
  @keyframes pop{0%{transform:scale(1.5) rotate(-10deg)}60%{transform:scale(.7)}100%{transform:scale(1)}}
  #hudR{text-align:right;line-height:1.7}
  #dayTag{display:inline-block;background:var(--ink);color:var(--pop);
    font-family:"DotGothic16",monospace;font-size:11px;letter-spacing:1px;
    padding:2px 10px;border-radius:100px}
  #turn{font-family:"DotGothic16",monospace;font-size:11px;
    color:rgba(30,28,20,.62);letter-spacing:1px}

  /* ---- 絵エリア ---- */
  #art{position:relative;flex:1;min-height:140px}
  .room{position:absolute;inset:0;stroke:rgba(30,28,20,.22);fill:none;
    stroke-width:2.5;stroke-linecap:round}
  #charaWrap{position:absolute;inset:0;transform-origin:50% 100%;transition:filter .5s}
  #charaWrap.jolt{animation:jolt .35s}
  #chara{position:absolute;left:50%;bottom:-6%;transform:translateX(-50%);height:112%}
  #portrait{position:absolute;left:-6%;bottom:-18%;width:112%;height:120%;
    object-fit:contain;object-position:center bottom;display:none}
  @keyframes jolt{0%,100%{transform:none}50%{transform:rotate(1.5deg)}}
  .line{stroke-width:2.6;fill:none;stroke-linecap:round}
  .mark{stroke:var(--danger);stroke-width:3.4;fill:none;opacity:0}
  .mark.on{opacity:1;animation:blink .7s infinite alternate}
  @keyframes blink{from{opacity:.3}to{opacity:1}}
  .heartmark{fill:var(--danger);stroke:var(--ink);stroke-width:3;opacity:0}
  .heartmark.on{opacity:1;animation:float 1.6s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .tear{fill:#7fc4ff;stroke:var(--ink);stroke-width:2;opacity:0}
  .tear.on{opacity:1;animation:drop 1.4s ease-in infinite}
  @keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(22px);opacity:0}}

  /* ---- うたがいメーター ---- */
  #meter{position:absolute;top:36px;right:12px;width:32px;bottom:12px;z-index:4}
  #meter .label{position:absolute;top:-28px;right:0;
    font-family:"DotGothic16",monospace;font-size:10px;letter-spacing:1px;
    background:var(--pop);color:var(--ink);border:2px solid var(--ink);
    padding:1px 7px;border-radius:100px;white-space:nowrap}
  #tube{position:absolute;inset:0;border:2px solid var(--ink);border-radius:100px;
    overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
  #fill{position:absolute;left:0;right:0;bottom:0;height:0%;background:var(--danger);
    transition:height .45s cubic-bezier(.2,.9,.3,1)}
  #fill.hot{background:var(--ink);animation:blink .5s infinite alternate}
  #meter.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-5px,2px)}50%{transform:translate(4px,-3px)}75%{transform:translate(-3px,-1px)}}

  #moodwrap{position:absolute;top:6px;left:12px;z-index:4;
    font-family:"DotGothic16",monospace;font-size:10px;letter-spacing:1px;color:var(--muted)}
  #moodface{font-size:24px;line-height:1.15}

  #snd{background:var(--card);border:2px solid var(--ink);color:var(--ink);
    border-radius:100px;width:32px;height:26px;font-size:12px;font-family:inherit;
    font-weight:700;cursor:pointer;padding:0;margin-left:10px;
    box-shadow:0 2.5px 0 var(--ink)}
  #snd:active{transform:translateY(2.5px);box-shadow:none}
  #snd.off{background:transparent;box-shadow:none;transform:translateY(2.5px);
    border-color:rgba(30,28,20,.35);color:rgba(30,28,20,.35)}

  /* ---- セリフ・選択肢 ---- */
  #bottom{flex:none;padding:0 12px 12px;z-index:6}
  /* 名前プレートは傾けない。傾けると下辺が吹き出しの上辺と平行でなくなり、
     右側に三角の隙間ができる。左上だけ角を落として一枚の形に繋げる */
  #name{display:inline-block;background:var(--pop);color:var(--ink);
    border:2px solid var(--ink);border-bottom:none;
    padding:3px 16px 4px;font-size:16px;font-weight:800;letter-spacing:2px;
    border-radius:10px 10px 0 0;
    position:relative;z-index:1}
  #line{background:var(--card);border:2px solid var(--ink);
    border-radius:0 12px 12px 12px;
    padding:12px 15px;height:88px;overflow:hidden;display:flex;align-items:center;
    font-size:17px;font-weight:700;line-height:1.55;box-shadow:var(--shadow-lg);
    margin-top:-2px}
  #lineIn{width:100%}
  #choices{display:flex;flex-direction:column;gap:8px;margin-top:11px;height:134px}
  .ch{flex:1;display:flex;align-items:center;background:var(--card);color:var(--ink);
    border:2px solid var(--ink);border-radius:10px;
    padding:9px 13px;font-size:14px;font-weight:700;text-align:left;cursor:pointer;
    font-family:inherit;box-shadow:var(--shadow);
    transition:transform .08s,box-shadow .08s,background .12s}
  .ch:hover{background:var(--pop)}
  .ch:active{transform:translateY(3px);box-shadow:none}
  .ch:disabled{background:var(--line);color:var(--muted);box-shadow:none;
    transform:translateY(3px);cursor:default}
  .ch:focus-visible{outline:3px solid var(--danger);outline-offset:2px}

  #timerbar{flex:none;height:8px;background:var(--line);border-top:2px solid var(--ink)}
  #timerfill{height:100%;width:100%;background:var(--ink);transition:width .1s linear}

  /* ---- オーバーレイ ---- */
  .ov{position:absolute;inset:0;background:var(--bg);
    background-image:var(--dots);background-size:14px 14px;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:26px;text-align:center;gap:14px}
  .ov.hidden{display:none}
  .ov h1{font-size:25px;margin:0;line-height:1.45;letter-spacing:2px;font-weight:800}
  .ov h1 span{background:var(--pop);border:2px solid var(--ink);border-radius:10px;
    padding:0 10px;display:inline-block;box-shadow:var(--shadow)}
  .ov h2{font-size:21px;margin:0;font-weight:800}
  .ov p{margin:0;font-size:13px;line-height:1.9;font-weight:700;color:var(--ink)}
  .ov b{background:var(--pop);padding:1px 6px;border-radius:6px}
  .btn{background:var(--ink);border:2px solid var(--ink);color:var(--pop);
    padding:12px 30px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;
    letter-spacing:2px;border-radius:12px;box-shadow:0 4px 0 rgba(30,28,20,.35)}
  .btn:hover{background:#2c2a1e}
  .btn:active{transform:translateY(4px);box-shadow:none}
  .rank{font-family:"DotGothic16",monospace;font-size:58px;letter-spacing:4px;
    color:var(--ink);background:var(--pop);border:2px solid var(--ink);border-radius:16px;
    padding:2px 24px;line-height:1.2;box-shadow:var(--shadow-lg)}
  .rank.bad{background:var(--danger);color:var(--card)}
  .dayNo{font-family:"DotGothic16",monospace;font-size:12px;letter-spacing:3px;
    background:var(--ink);color:var(--pop);padding:3px 12px;border-radius:100px}
  .gimmick{background:var(--card);border:2px solid var(--ink);border-radius:12px;
    padding:12px 16px;font-size:13px;font-weight:700;line-height:1.7;max-width:300px;
    box-shadow:var(--shadow)}
  .gimmick i{font-style:normal;background:var(--pop);padding:0 4px;border-radius:4px}
  #week,#week2{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;
    font-family:"DotGothic16",monospace;font-size:11px}
  #week div,#week2 div{padding:3px 9px;border-radius:100px;background:var(--card);
    border:2px solid var(--ink);color:var(--muted)}
  #week div.done,#week2 div.done{background:var(--pop);color:var(--ink)}
  #week div.now,#week2 div.now{background:var(--ink);color:var(--pop)}
  .flashred{position:absolute;inset:0;background:var(--danger);opacity:0;pointer-events:none;z-index:15}
  .flashred.on{animation:fl .45s}
  @keyframes fl{0%{opacity:.5}100%{opacity:0}}
  @media (max-height:700px){#line{font-size:15px;height:78px}.ch{font-size:13px;padding:8px 11px}#choices{height:118px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="stage">
  <div id="hud">
    <div id="hearts"></div>
    <button id="snd" title="声のオン／オフ">♪</button>
    <div id="hudR"><span id="dayTag"></span><br><span id="turn"></span></div>
  </div>

  <div id="art">
    <svg class="room" viewBox="0 0 430 400" preserveAspectRatio="none">
      <path d="M0 90 H430 M50 90 V400 M380 90 V400"/><rect x="120" y="140" width="190" height="110" rx="4"/>
    </svg>
    <div id="moodwrap">KIGEN<div id="moodface">🙂</div></div>
    <div id="meter"><div class="label">うたがい</div><div id="tube"><div id="fill"></div></div></div>

    <div id="charaWrap">
    <img id="portrait" alt="">
    <svg id="chara" viewBox="0 0 300 300">
      <defs><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#eaeffb"/><stop offset="100%" stop-color="#b3bfda"/>
      </linearGradient></defs>
      <path id="bodyP" fill="url(#skin)" d="M150 60c34 0 52 26 52 56 0 22-10 34-10 44 26 10 52 30 58 60l6 120H44l6-120c6-30 32-50 58-60 0-10-10-22-10-44 0-30 18-56 52-56z"/>
      <path class="line" id="hairBack" d=""/>
      <path class="line" id="face" d="M108 92c0-32 18-52 42-52s42 20 42 52c0 34-16 60-42 60s-42-26-42-60z"/>
      <path class="line" id="bang" d=""/>
      <path class="line" id="accessory" d=""/>
      <path class="line" id="browL" d="M118 82 L140 84"/>
      <path class="line" id="browR" d="M182 82 L160 84"/>
      <ellipse id="eyeL" cx="129" cy="100" rx="9" ry="11"/>
      <ellipse id="eyeR" cx="171" cy="100" rx="9" ry="11"/>
      <path class="line" id="eyeLc" d="M120 100 L138 100" style="display:none"/>
      <path class="line" id="eyeRc" d="M162 100 L180 100" style="display:none"/>
      <path class="line" id="mouth" d="M142 124 Q150 132 158 124"/>
      <g class="mark" id="angerMark"><path d="M196 56 L212 56 M204 48 L204 64 M198 50 L210 62 M210 50 L198 62"/></g>
      <path class="heartmark" id="hm" d="M214 62c-6-10-22-6-22 6 0 10 14 18 22 26 8-8 22-16 22-26 0-12-16-16-22-6z"/>
      <ellipse class="tear" id="tearL" cx="129" cy="114" rx="4" ry="6"/>
      <ellipse class="tear" id="tearR" cx="171" cy="114" rx="4" ry="6"/>
    </svg>
    </div>
  </div>

  <div id="bottom">
    <div id="name">ミサ</div>
    <div id="line"><div id="lineIn">…ねえ。ちょっと座って。</div></div>
    <div id="choices"></div>
  </div>

  <div id="timerbar"><div id="timerfill"></div></div>
  <div class="flashred" id="flash"></div>

  <div class="ov" id="title">
    <div style="font-family:DotGothic16,monospace;font-size:11px;letter-spacing:4px;color:#8a8470">UTAGAI METER</div>
    <h1>7日間の<span>彼女</span></h1>
    <p style="font-size:13px;letter-spacing:1px">月曜から日曜まで、毎日ちがう彼女に会う。<br>
    そして毎日、<b>昨日どこにいたか</b>を聞かれる。</p>
    <button class="btn" id="startBtn">はじめる</button>
    <div style="font-family:DotGothic16,monospace;font-size:10px;color:#8a8470;letter-spacing:1px;margin-top:4px">所要 15〜20分</div>
  </div>

  <div class="ov hidden" id="dayIntro">
    <div class="dayNo" id="diNo"></div>
    <h2 id="diName"></h2>
    <div class="gimmick" id="diGim"></div>
    <div id="week"></div>
    <button class="btn" id="diBtn">会いに行く</button>
  </div>


  <div class="ov hidden" id="weekclear">
    <div id="wc1">
      <h1 style="font-size:23px;letter-spacing:2px">七日間、<br><span>誰にもバレなかった。</span></h1>
      <p style="margin-top:16px">ルナも、レイカも、ヒナも、カガリも、ヨイも、アユも——<br>
      全員、笑って「おやすみ」と送ってきた。<br><br>
      <b>乗り切った。</b><br><br>
      そう思って、スマホを置こうとしたとき。</p>
      <button class="btn" id="wcBtn1" style="margin-top:18px">通知を見る</button>
    </div>
    <div id="wc2" style="display:none">
      <div style="font-family:DotGothic16,monospace;font-size:11px;letter-spacing:3px;color:#8a8470">1 件のメッセージ</div>
      <div style="background:#fffef7;border:2px solid #1e1c14;border-radius:12px;
        padding:15px 17px;max-width:300px;box-shadow:0 5px 0 #1e1c14;
        font-size:15px;font-weight:700;line-height:1.8;text-align:left">
        <span style="font-family:DotGothic16,monospace;font-size:12px;letter-spacing:2px;background:#e1dd60;padding:1px 8px;border-radius:100px">ミサキ</span><br>
        ねえ。今から行っていい？<br>もう、家の前にいるんだけど。
      </div>
      <p style="font-size:12px;color:#8a8470">……七日目は、まだ終わっていなかった。</p>
      <button class="btn" id="wcBtn2">出る</button>
    </div>
  </div>

  <div class="ov hidden" id="result">
    <div class="rank" id="rankText"></div>
    <h2 id="resTitle"></h2>
    <p id="resBody"></p>
    <div id="week2"></div>
    <button class="btn" id="retryBtn">月曜からやり直す</button>
  </div>
</div>

<script>
/* ============ 7人の彼女 ============ */
const DAYS = [
{ day:"MON", name:"ミサキ", trait:"完璧主義の勝負師。全部データで管理する。",
  gim:"基本ルール。<i>チュートリアル役</i>。行動を全部ログに取っているが、仕掛けは無い。正攻法で崩せ。",
  art:"misaki", voice:700,
  timer:12, mult:1, eyeW:8.5, eyeH:11, hair:"#48557d", eye:"#39436b",
  hairBack:"M96 66c-18 34-16 96-10 150M204 66c18 34 16 96 10 150",
  bang:"M104 84c14-24 34-34 46-34s34 10 46 34 M150 50c-6 14-16 24-30 30M150 50c6 14 16 24 30 30",
  acc:"M110 74 L142 80 M190 74 L158 80",
  qs:[
   {q:"昨日の21時から24時。分単位で説明して。", a:[
     {t:"会社。定時後そのまま残業した", sets:"work", s:0,m:2, r:"退勤打刻、23時12分。合ってる？"},
     {t:"友達と飲んでた", sets:"friend", s:4,m:-4, r:"店。人数。会計額。三つとも聞くから。"},
     {t:"実家に寄ってた", sets:"family", s:2,m:0, r:"ご実家、片道52分よね。逆算するよ。"}]},
   {q:"出たのは何時？", a:[
     {t:"23時すぎ。すぐ帰った", s:2,m:2, r:"じゃあ帰宅は24時前ね。記録した。"},
     {t:"日付が変わる直前だった", s:8,m:-4, r:"ずいぶん粘ったのね。"},
     {t:"…正確には覚えてない", s:24,m:-14, r:"昨日よ。仕事の数字は覚えてるのに？"}]},
   {q:"言っておくけど、私、あなたの生活パターン全部ノートにある。", a:[
     {t:"…こわいって、それ", s:18,m:-14, r:"怖いのは、崩れた日があることでしょ。"},
     {t:"助かるよ。俺より正確だし", s:-4,m:12, r:"当然。私、詰めが甘いのが一番嫌いなの。"},
     {t:"そこまでする必要ある？", s:26,m:-18, r:"必要かどうかは、結果が決めるの。"}]},
   {q:"誰と一緒だった？", a:[
     {t:"部長と後藤さん", needs:"work", s:0,m:0, r:"あの二人ね。まあ、いるでしょうね。"},
     {t:"同期の田中と、あと二人", needs:"friend", s:2,m:0, r:"田中くん。連絡先、まだあったっけ。"},
     {t:"母さんと妹", needs:"family", s:0,m:4, r:"お母さん、お元気だった？"},
     {t:"…一人だったよ", s:30,m:-10, r:"一人？ さっきの話と合わないけど。"}]},
   {q:"LINE、既読つかなかったよね。", a:[
     {t:"充電切れてた", s:16,m:-6, r:"バッテリー、鞄に入れてるよね。"},
     {t:"バタバタしてて見てなかった", s:8,m:-2, r:"ふーん。忙しかったんだ。"},
     {t:"ごめん、気づかなかった。悪かった", s:-6,m:12, r:"…素直なのは、まあ、いい。"}]},
   {q:"服から知らない匂いがした。", a:[
     {t:"会議室の芳香剤だと思う", needs:"work", s:2,m:0, r:"そういう匂いの会社なのね。"},
     {t:"居酒屋の煙でしょ", needs:"friend", s:0,m:0, r:"言われてみれば煙かも。"},
     {t:"母さんの柔軟剤", needs:"family", s:0,m:3, r:"あー、あの匂いか。"},
     {t:"気のせいでしょ", s:26,m:-16, r:"気のせいで済ませないで。"}]},
   {q:"じゃあ裏を取らせて。何が出せる？", a:[
     {t:"勤怠のスクショ送るよ", needs:"work", s:-14,m:6, r:"…完璧。悔しいけど、完璧。"},
     {t:"割り勘アプリの履歴がある", needs:"friend", s:-14,m:6, r:"時刻も残ってる。合格。"},
     {t:"改札の履歴、見せようか", needs:"family", s:-14,m:6, r:"52分。ぴったり。……いいでしょう。"},
     {t:"いちいち出す方がおかしいだろ", s:28,m:-16, r:"出せない側が、そう言うのよ。"}]},
   {q:"私、面倒な女だと思ってる？", a:[
     {t:"思ってない。むしろ助かってる", s:-8,m:14, r:"…そう。ならいい。"},
     {t:"ちょっとは思う", s:20,m:-22, r:"正直ね。正直だけど、点は引くから。"},
     {t:"今その話じゃないでしょ", s:22,m:-18, r:"逸らしたわね。記録した。"}]},
   {q:"その人に、今から確認の連絡していい？", a:[
     {t:"いいよ。番号送る", s:-22,m:6, r:"…しない。そこまで言うなら、しない。"},
     {t:"時間が時間だし迷惑でしょ", s:20,m:-10, r:"迷惑って、誰にとって？"},
     {t:"なんでそこまでするんだよ", s:32,m:-24, r:"やましくないなら、止めないでしょ。"}]},
   {q:"最後。この一週間、私に隠してることある？", a:[
     {t:"ない", s:12,m:0, r:"0.4秒。いつもより遅い返事ね。"},

function drawMeter(){
  const v=Math.max(0,Math.min(100,S.susp));
  $("fill").style.height=v+"%"; $("fill").classList.toggle("hot",v>=70);
}
/* 背景をその日の髪色に寄せる。
   髪色をそのまま薄めると青系の日が灰色になりクリームの温かみが飛ぶので、
   色相だけ borrow して彩度・明度は固定し、淡い色紙のようにする */
function tint(hex, sat, light){
  const n = parseInt(hex.slice(1),16);
  const r = (n>>16)/255, g = ((n>>8)&255)/255, b = (n&255)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), c = mx-mn;
  let h = 0;
  if(c) h = 60 * (mx===r ? ((g-b)/c+(g<b?6:0)) : mx===g ? (b-r)/c+2 : (r-g)/c+4);
  return `hsl(${Math.round(h)} ${sat}% ${light}%)`;
}
function applyLook(){
  const d=D();
  $("eyeL").setAttribute("rx",d.eyeW||9); $("eyeR").setAttribute("rx",d.eyeW||9);
  $("chara").style.setProperty("--tilt",(d.tilt||0)+"deg");
  document.querySelectorAll(".line").forEach(e=>e.setAttribute("stroke",d.hair));
  $("eyeL").setAttribute("fill",d.eye); $("eyeR").setAttribute("fill",d.eye);
  $("hairBack").setAttribute("d",d.hairBack);
  $("bang").setAttribute("d",d.bang);
  $("accessory").setAttribute("d",d.acc||"");
  $("name").textContent=d.name;

}

  [d.art].concat(EXPR.map(e=>d.art+"_"+e)).forEach(k=>{

  img.style.display=use?"block":"none";
  $("chara").style.display=use?"none":"";
  // 機嫌が低いほど彩度を落とす。poker の日は圧縮後の m を使うので絵からも読めない

}

    eL.setAttribute("ry","9"); eR.setAttribute("ry","9"); f.textContent=crying?"🥺":"😠";
  } else if(m<62){
    bL.setAttribute("d","M118 82 L140 84"); bR.setAttribute("d","M182 82 L160 84");
    mo.setAttribute("d","M144 126 L156 126");
    eL.setAttribute("ry",d.eyeH||11); eR.setAttribute("ry",d.eyeH||11); f.textContent=d.poker?"🫥":"😐";
  } else if(m<82){
    bL.setAttribute("d","M118 84 L140 80"); bR.setAttribute("d","M182 84 L160 80");
    mo.setAttribute("d","M142 124 Q150 132 158 124");
    eL.setAttribute("ry",d.eyeH||11); eR.setAttribute("ry",d.eyeH||11); f.textContent=d.poker?"🫥":"🙂";
  } else {
    bL.setAttribute("d","M118 84 L140 78"); bR.setAttribute("d","M182 84 L160 78");
    mo.setAttribute("d","M138 122 Q150 136 162 122");
    eL.style.display=eR.style.display="none"; eLc.style.display=eRc.style.display="";
    eLc.setAttribute("d","M120 104 Q129 94 138 104"); eRc.setAttribute("d","M162 104 Q171 94 180 104");
    $("hm").classList.add("on"); f.textContent=d.poker?"🫥":"😊";
  }
}
/* ---- しゃべり ----
   一文字ずつ出しながら「ポポポ」と鳴らす。制限時間は喋っている間も止めない。
   戻り値は喋り終わるまでの ms。返しの待ち時間はこれを見て決める。 */
let AC=null, sndOn=true, typer=null, fullLine="";
const SPEED=48;                                  // ms / 字
/* 息継ぎ。句点で長く、読点で短く止めると読み上げているように聞こえる */
function pauseAfter(txt){
  const c=txt[txt.length-1];
  if(/[。！？!?]/.test(c)) return 430;
  if(/[…‥]/.test(c))      return 320;
  if(/[、，]/.test(c))     return 210;
  return 0;
}
const SILENT=/[\s、。，．…‥！？!?「」『』（）()\-—～]/;   // この字では鳴らさない
/* AudioContext の生成は数百ms止まる。最初の一文字目で作ると出だしが遅れるので、
   ユーザー操作（はじめる）のタイミングで先に用意しておく */
function primeAudio(){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    // 無音を一度鳴らして出力を起こす。これをやらないと一文字目で数百ms固まる
    const o=AC.createOscillator(), g=AC.createGain();
    g.gain.value=0; o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+0.01);
  }catch(e){}
}
function blip(){
  if(!sndOn || !AC) return;
  try{
    const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.type="square";
    o.frequency.setValueAtTime((D().voice||620)*(0.94+Math.random()*0.12), t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.13,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.075);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t+0.08);
  }catch(e){}
}
/* 行頭に来てはいけない字（閉じ括弧・句読点・小書き・長音）は前の字にくっつけ、
   行末に来てはいけない字（開き括弧）は次の字を巻き込む。禁則を span 分割で壊さないため */
const NO_HEAD=/[、。，．・…‥！？!?」』）)】〉》〕｝ぁぃぅぇぉっゃゅょァィゥェォッャュョーヽヾ々〜～]/;
const NO_TAIL=/[「『（(【〈《〔｛]/;
function chunk(t){
  const out=[];
  for(const c of t){
    const prev=out.length?out[out.length-1]:"";
    if(prev && (NO_HEAD.test(c) || NO_TAIL.test(prev.slice(-1)))) out[out.length-1]+=c;
    else out.push(c);
  }
  return out;
}
let spans=[];
function skipTyping(){
  if(!typer) return;
  clearTimeout(typer); typer=null;
  spans.forEach(s=>s.style.visibility="");
}
/* 地の文（その日を切り抜けた、の一文）は誰のセリフでもないので名前を隠す */
function narrate(t){ $("name").style.visibility="hidden"; return say(t); }
function say(t){
  clearTimeout(typer); typer=null;
  fullLine=t;
  const el=$("lineIn"); el.textContent="";
  // 先に全文を組んで折り返しを確定させる。以後は visibility を外すだけなので字が動かない
  spans=chunk(t).map(p=>{
    const s=document.createElement("span");
    s.textContent=p; s.style.visibility="hidden";
    el.appendChild(s); return s;
  });
  if(!spans.length) return 0;
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){ skipTyping(); return 0; }
  // 字ごとに間隔が変わるので setInterval ではなく setTimeout を繋ぐ
  const wait=spans.map(s=>SPEED+pauseAfter(s.textContent));
  let i=0;
  const step=()=>{
    const s=spans[i++];
    s.style.visibility="";
    if(!SILENT.test(s.textContent[0])) blip();
    if(i>=spans.length){ typer=null; return; }
    typer=setTimeout(step, wait[i-1]*(0.88+Math.random()*0.24));   // 少しゆらす
  };
  typer=setTimeout(step,0);
  return wait.reduce((a,b)=>a+b,0);
}
$("line").onclick=skipTyping;                    // 押せば全文出る
$("art").onclick=skipTyping;                     // 立ち絵側を押しても同じ
$("snd").onclick=e=>{ sndOn=!sndOn; e.currentTarget.classList.toggle("off",!sndOn); };
function weekStrip(el){
  const base=DAYS.slice(0,7).map((d,i)=>
    `<div class="${i<S.d?'done':i===S.d?'now':''}">${JPDAY[d.day]||d.day}</div>`).join("");
  const ex = S.d>=7 ? `<div class="now">EX</div>` : "";
  el.innerHTML=base+ex;
}

/* ---- 進行 ---- */
function startTimer(){
  const lim=D().timer; S.t=lim; $("timerfill").style.width="100%"; clearInterval(S.timer);
  S.timer=setInterval(()=>{ S.t-=0.1;
    $("timerfill").style.width=Math.max(0,S.t/lim*100)+"%";
    if(S.t<=0){ clearInterval(S.timer); timeout(); } },100);
}
function stopTimer(){ clearInterval(S.timer); }
function timeout(){
  if(S.busy) return; S.busy=true;
  [...document.querySelectorAll(".ch")].forEach(b=>b.disabled=true);
  applyDamage(20,-10,"……なんで黙るの。");
}
function dayIntro(){
  const d=D(); S.i=0; S.susp=0; S.mood=60; S.facts={}; S.mem={}; S.perfect=true; S.cried=false;
  preloadArt(d);
  applyLook(); drawMeter(); drawFace(); drawHearts();
  $("diNo").textContent = d.extra ? "EXTRA" : `DAY ${S.d+1} ／ ${jp(d)}曜日`;
  $("diName").textContent=`${d.name}　—　${d.trait}`;
  $("diGim").style.display="none";
  weekStrip($("week"));
  $("dayIntro").classList.remove("hidden");
}
/* 選択肢は常に3個。4個以上ある設問は
   「今のアリバイに合う答え」+「矛盾するワナ」+「逃げの答え」に絞る */
function pickThree(list){
  if(list.length<=3) return list.slice();
  const ok   = list.filter(o=>o.needs && S.facts[o.needs]);
  const trap = list.filter(o=>o.needs && !S.facts[o.needs]);
  const esc  = list.filter(o=>!o.needs);
  let out=[];
  if(ok.length){
    out.push(ok[0]);
    if(trap.length) out.push(trap[(Math.random()*trap.length)|0]);
    if(esc.length)  out.push(esc[0]);
  }
  // needs構造でない設問（最終日の週アリバイ等）はランダムに3つ
  while(out.length<3){
    const c=list[(Math.random()*list.length)|0];
    if(!out.includes(c)) out.push(c);
  }
  out=out.slice(0,3);
  for(let i=out.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [out[i],out[j]]=[out[j],out[i]]; }
  return out;
}
function ask(){
  const d=D(), q=d.qs[S.i];
  $("name").style.visibility="";
  $("turn").textContent=`${S.i+1} / ${d.qs.length}`;
  say(q.q);
  S.shown = pickThree(q.a);
  const box=$("choices"); box.innerHTML="";
  S.shown.forEach((o,idx)=>{
    const b=document.createElement("button");
    b.className="ch"; b.textContent=o.t; b.onclick=()=>answer(idx);
    box.appendChild(b);
  });
  S.busy=false; startTimer();
}
function answer(idx){
  if(S.busy) return; S.busy=true; stopTimer();
  [...document.querySelectorAll(".ch")].forEach(b=>b.disabled=true);
  const d=D(), o=S.shown[idx];

  if(o.needs && !S.facts[o.needs]){
    const base=38*(d.contraBoost||1);
    S.perfect=false;
    applyDamage(base,-18,"待って。それ、さっきの話と繋がってないよね？");
    return;
  }
  if(o.mem){
    const k=o.mem.k, v=o.mem.v;
    if(S.mem[k]===undefined){ S.mem[k]=v; }
    else if(S.mem[k]!==v){
      S.perfect=false;
      applyDamage(42,-24,"あれ？ さっきと違うこと言ってるよ。あたし、覚えてるからね。");
      if(o.sets) S.facts[o.sets]=true;
      return;
    }
  }
  if(d.finale && o.week && S.used[o.week]){
    S.perfect=false;
    applyDamage(34,-20,`それ、今週もう聞いた。`);
    if(o.sets) S.facts[o.sets]=true;
    return;
  }
  if(o.sets) S.facts[o.sets]=true;
  if(o.week) S.used[o.week]=true;

  let mult=d.mult;
  if(d.moodBite) mult *= S.mood<30?1.8 : S.mood<55?1.35 : 1;
  else mult *= S.mood<35?1.4 : S.mood<60?1.15 : 1;
  applyDamage(o.s>0?Math.round(o.s*mult):o.s, o.m, o.r);
}
function applyDamage(susp,mood,reply){
  const d=D();
  S.susp=Math.max(0,S.susp+susp);
  S.mood=Math.max(0,Math.min(100,S.mood+mood));
  if(d.cryBomb && S.mood<=12 && !S.cried){    // 泣かせると一気に詰む（その日1回だけ）
    S.mood=0; S.susp+=30; S.cried=true;
  }
  drawMeter(); drawFace();
  if(susp>=15){
    S.perfect=false;
    $("meter").classList.add("shake"); $("charaWrap").classList.add("jolt");
    setTimeout(()=>{$("meter").classList.remove("shake");$("charaWrap").classList.remove("jolt");},420);
  }
  const dur=say(reply);
  [...document.querySelectorAll(".ch")].forEach(b=>b.style.visibility="hidden");
  $("timerfill").style.width="0%";
  setTimeout(()=>{ if(S.susp>=100){ breakHeart(); return; } next(); },dur+600);
}
function breakHeart(){
  S.hearts--; S.perfect=false;
  $("flash").classList.add("on"); setTimeout(()=>$("flash").classList.remove("on"),460);
  drawHearts(S.hearts);
  if(S.hearts<=0){ end(false); return; }
  S.susp=62; S.mood=Math.max(0,S.mood-12); drawMeter(); drawFace();
  const dur=say("……もういい。一回、深呼吸して。最初から聞き直すから。");
  setTimeout(next,dur+600);
}
function next(){
  S.i++;
  if(S.i>=D().qs.length){ dayClear(); return; }
  ask();
}
function dayClear(){
  stopTimer();
  const d=D();
  S.log.push({day:d.day,name:d.name,susp:Math.round(S.susp),perfect:S.perfect});
  let msg=`${d.name}は、それ以上聞かなかった。`;
  if(S.perfect && S.hearts<3){ S.hearts++; drawHearts(S.hearts-1);
    msg+=`\n（無傷で切り抜けた。ハートが1つ戻った）`; }
  else if(S.perfect){ msg+=`\n（無傷で切り抜けた）`; }
  const dur=narrate(msg); $("choices").innerHTML="";
  setTimeout(()=>{
    S.d++;
    if(S.d===7){ weekClear(); return; }
    if(S.d>=DAYS.length){ end(true); return; }
    dayIntro();
  },dur+1300);
}
function weekClear(){
  stopTimer(); $("choices").innerHTML=""; $("turn").textContent="";
  $("wc1").style.display=""; $("wc2").style.display="none";
  $("weekclear").classList.remove("hidden");
}
$("wcBtn1").onclick=()=>{ $("wc1").style.display="none"; $("wc2").style.display=""; };
$("wcBtn2").onclick=()=>{ $("weekclear").classList.add("hidden"); dayIntro(); };

function end(cleared){
  stopTimer(); $("choices").innerHTML=""; $("turn").textContent="";
  $("result").classList.remove("hidden");
  const rk=$("rankText"); rk.classList.remove("bad");
  weekStrip($("week2"));
  if(!cleared){
    rk.textContent="OUT"; rk.classList.add("bad");
    $("resTitle").textContent = DAYS[S.d].extra ? "最終戦、終了。" : `${jp(DAYS[S.d])}曜、終了。`;
    $("resBody").innerHTML=`${DAYS[S.d].name}に、全部バレた。<br>連絡先は、その日のうちに全員に回った。<br><br>「嘘が下手なところだけは、好きだったよ」<br><br><span style="font-family:DotGothic16,monospace;color:#8a8470">${DAYS[S.d].extra?"EXTRA 到達":"到達 DAY "+(S.d+1)+" ／ 7"}</span>`;
    return;
  }
  const perfects=S.log.filter(l=>l.perfect).length;
  const avg=Math.round(S.log.reduce((a,b)=>a+b.susp,0)/S.log.length);
  let rank,title,body;
  if(perfects>=6 && S.hearts===3){
    rank="S"; title="八日間、無傷";
    body="誰にも、何も、悟らせなかった。<br>最後の夜、七つの通知が同時に鳴った。<br>全部「おやすみ」だった。<br><br>……あなたは、それでいいのか？";
  } else if(perfects>=4){
    rank="A"; title="週を越えた";
    body="全員が「まあ、いいや」と言った。<br>その“まあ”は、七つ分たまっている。<br><br>来週も、月曜は来る。";
  } else if(perfects>=2){
    rank="B"; title="足はついた";
    body="全員が、一度は言葉に詰まったのを見ている。<br>誰も追及しなかっただけで、忘れてはいない。<br><br>次に何か一つでも噛み合わなければ、そこで終わる。";
  } else {
    rank="C"; title="かろうじて最終日";
    body="ハートは残った。信用は、どこにも残っていない。<br>七人とも、まだ何も言っていないだけ。";
  }
  rk.textContent=rank; $("resTitle").textContent=title;
  $("resBody").innerHTML=body+`<br><br><span style="font-family:DotGothic16,monospace;color:#8a8470">残ハート ${S.hearts} ／ 無傷の日 ${perfects}/8 ／ 平均うたがい ${avg}</span>`;
}

function reset(){
  Object.assign(S,{hearts:3,susp:0,mood:60,d:0,i:0,facts:{},used:{},mem:{},shown:[],t:12,busy:false,perfect:true,cried:false,log:[]});
  applyLook(); drawHearts(); drawMeter(); drawFace();
}
$("startBtn").onclick=()=>{ primeAudio(); $("title").classList.add("hidden"); reset(); dayIntro(); };
$("diBtn").onclick=()=>{ $("dayIntro").classList.add("hidden"); ask(); };
$("retryBtn").onclick=()=>{ $("result").classList.add("hidden"); reset(); dayIntro(); };
reset();
</script>
