<!doctype html><html><head><meta charset="utf-8"><title>ART gallery</title>
<style>body{background:#445;color:#eee;font:12px sans-serif;margin:8px}canvas{image-rendering:pixelated;display:block;margin:4px 0}</style></head><body>
<canvas id="bg" width="1280" height="4320"></canvas>
<canvas id="pt" width="2000" height="1560"></canvas>
<canvas id="misc" width="1280" height="500"></canvas>
<script src="js/art.js"></script>
<script>
const T=+(new URLSearchParams(location.search).get('t')||1.3);
const t0=performance.now();
ART.init();
// backgrounds 2 columns at 1x
const bg=document.getElementById('bg').getContext('2d');
ART.bgs.forEach((id,i)=>{bg.save();bg.translate((i%2)*640,Math.floor(i/2)*360);bg.beginPath();bg.rect(0,0,640,360);bg.clip();ART.bg(bg,id,T);bg.fillStyle='#000';bg.fillRect(0,0,110,14);bg.fillStyle='#fff';bg.fillText(id,4,11);bg.restore();});
// portraits: 5 chars x 10 expr (+ blink/silhouette), crop to upper 250px
const pt=document.getElementById('pt').getContext('2d');pt.fillStyle='#8a8aa0';pt.fillRect(0,0,2000,1560);
ART.chars.forEach((id,r)=>ART.exprs.forEach((e,i)=>{pt.save();pt.translate(i*200,r*260);ART.portrait(pt,id,e,100,300,{t:T,blink:false});pt.restore();pt.fillStyle='#fff';pt.fillText(id+' '+e,i*200+4,r*260+12);}));
const m=document.getElementById('misc').getContext('2d');m.fillStyle='#b8b0c8';m.fillRect(0,0,1280,500);
// chibi at 2x
const tmp=document.createElement('canvas');tmp.width=640;tmp.height=110;const tc=tmp.getContext('2d');
Object.keys(ART.chibiFrames).forEach((a,i)=>{for(let f=0;f<4;f++)ART.chibi(tc,a,f,24+f*50+(i%3)*0,48);m.imageSmoothingEnabled=false;m.drawImage(tmp,0,0,200,50,(i%3)*420,Math.floor(i/3)*104,400,100);tc.clearRect(0,0,640,110);m.fillStyle='#222';m.fillText(a,(i%3)*420+2,Math.floor(i/3)*104+10);});
ART.icons.forEach((id,i)=>{ART.icon(m,id,10+i*56,430,32);ART.icon(m,id,20+i*56,470,16);});
ART.chars.forEach((id,i)=>{ART.face(m,id,'smile',860+i*52,330,48);ART.face(m,id,'angry',860+i*52,384,32);});
ART.portrait(m,'aoi','normal',1200,420,{silhouette:true});
// perf
let p=performance.now();const pc=document.createElement('canvas');pc.width=640;pc.height=360;const pcx=pc.getContext('2d');
for(let k=0;k<60;k++){ART.bg(pcx,'aquarium',k/60);ART.portrait(pcx,'aoi','smile',200,360,{t:k/60});ART.portrait(pcx,'haruto','laugh',440,360,{t:k/60});}
document.title='done total '+(performance.now()-t0|0)+'ms, 60 frames '+(performance.now()-p|0)+'ms';
</script></body></html>
