<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>うごく背景</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
:root{
  --main:#E1DD60; --main-deep:#B8B43F; --main-soft:#F2F0BE; --cream:#FBFAEC; --paper:#FFFEF7;
  --ink:#1E1C14; --ink-2:#4F4A3B; --gray:#6E6857; --pink:#F2A0B8; --rule:rgba(30,28,20,.22);
  --bd:2.5px solid var(--ink); --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:clip}
body{background:var(--cream);color:var(--ink);font:500 1rem/1.6 'M PLUS Rounded 1c',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
::selection{background:var(--main);color:var(--ink)}
button,select,input,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--main);border-bottom:var(--bd)}
.bar a{color:var(--ink);text-decoration:none;font-weight:700}
.bar a:hover{text-decoration:underline;text-decoration-thickness:2.5px;text-underline-offset:.3em}
.bar h1{font-size:1.15rem;font-weight:800;margin:0}
.stage{position:relative;display:flex;align-items:center;justify-content:center;padding:16px;min-height:0;
  background:radial-gradient(circle,rgba(30,28,20,.13) 1.5px,transparent 1.6px) 0 0/16px 16px}
.stage canvas{max-width:100%;max-height:100%;border:var(--bd);border-radius:var(--r);
  background:repeating-conic-gradient(#d9d6c4 0 25%,#f4f2e4 0 50%) 0 0/24px 24px}
.side{overflow:auto;border-left:var(--bd);background:var(--paper);padding:10px 16px 48px;scrollbar-width:thin;scrollbar-color:var(--ink) transparent}
h2{font-size:1.05rem;font-weight:800;margin:22px 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2:first-child{margin-top:6px}
h2 small{font-weight:500;font-size:.85rem;color:var(--gray)}
.row{display:grid;grid-template-columns:88px minmax(0,1fr) 44px;align-items:center;gap:8px;min-height:36px}
.row label{color:var(--ink-2);font-size:.9rem;font-weight:700}
.row output{font-size:.85rem;text-align:right;color:var(--gray);font-variant-numeric:tabular-nums}
.row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;border:var(--bd);background:var(--paper);border-radius:var(--r);padding:.45rem 1rem;font-weight:700;font-size:.95rem;cursor:pointer;white-space:nowrap;transition:background-color .15s}
.btn:hover{background:var(--main)}
.btn.on,.btn.main{background:var(--main)}
.btn.main:hover{background:var(--main-deep)}
.btn:disabled{opacity:.55;cursor:default}
.btn.s{padding:.2rem .7rem;font-size:.85rem;border-width:2px;border-radius:100px}
select,input[type=text],input[type=number],textarea{border:2px solid var(--ink);border-radius:10px;background:var(--paper);padding:5px 9px;min-width:0;width:100%}
select:focus,input[type=text]:focus,textarea:focus{background:var(--main-soft)}
textarea{resize:vertical;min-height:60px}
input[type=color]{width:38px;height:32px;border:2px solid var(--ink);border-radius:8px;padding:0;background:none;cursor:pointer}
input[type=checkbox]{accent-color:var(--ink);width:1.05em;height:1.05em;vertical-align:-.15em}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.layers{display:flex;flex-direction:column}
.layer{display:flex;align-items:center;gap:8px;border-bottom:2.5px dotted var(--rule);padding:6px;cursor:pointer;border-radius:8px}
.layer:hover{background:var(--main-soft)}
.layer.sel{background:var(--main)}
.layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.layer .ic{width:30px;height:30px;border-radius:7px;border:2px solid var(--ink);background:#eee center/contain no-repeat;flex:none}
.layer button{border:0;background:none;cursor:pointer;padding:2px 6px;color:var(--ink);font-weight:700;border-radius:6px}
.layer button:hover{background:var(--paper)}
.layer.off .nm{opacity:.45;text-decoration:line-through}
.empty{color:var(--gray);font-size:.9rem;padding:6px 0}
.thumbs{display:flex;gap:4px;flex-wrap:wrap}
.thumbs img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/10px 10px;border:2px solid var(--ink)}
.note{font-size:.85rem;color:var(--gray);margin:4px 0}
.status{font-size:.9rem;min-height:20px;margin-top:4px;font-weight:700}
.status.err{color:#A8432F}
hr{border:0;border-top:2.5px dotted var(--rule);margin:20px 0}
.full{position:fixed;inset:0;background:#000;z-index:10;display:flex;align-items:center;justify-content:center;cursor:none}
.full canvas{max-width:100vw;max-height:100vh}
/* つまみ（触っただけでは動かない） */
.rs{position:relative;height:32px;touch-action:none;cursor:ew-resize;min-width:60px}
.rs-track{position:absolute;left:0;right:0;top:50%;height:10px;margin-top:-5px;background:var(--cream);border:2px solid var(--ink);border-radius:100px;overflow:hidden}
.rs-fill{position:absolute;left:0;top:0;bottom:0;background:var(--main)}
.rs-knob{position:absolute;top:50%;width:18px;height:24px;margin:-12px 0 0 -9px;background:var(--paper);border:2px solid var(--ink);border-radius:7px}
.rs.drag .rs-knob{background:var(--main)}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr;height:auto;min-height:100dvh}
  .stage{position:sticky;top:0;z-index:5;padding:12px 16px;max-height:50vh;background-color:var(--cream);border-bottom:var(--bd)}
  .side{border-left:0}
}
</style>
</head>
<body>
<div class="app">
  <div class="bar"><a href="../../index.html">← LAB</a><h1>うごく背景</h1></div>
  <div class="stage" id="stage">
    <canvas id="view"></canvas>
  </div>

  <div class="side">
    <h2>おまかせ</h2>
    <div class="row2" id="presets"></div>

    <h2>配色 <small>えらぶと 背景・下地・つぶの 色が かわる</small></h2>
    <div id="haishoku"></div>

    <h2>大きさ・長さ</h2>
    <div class="row"><label>形</label>
      <select id="size">
        <option value="1920x1080">よこ 1920×1080</option>
        <option value="1080x1920">たて 1080×1920</option>
        <option value="1080x1080">ましかく 1080×1080</option>
        <option value="1280x720">よこ 1280×720</option>
      </select><span></span></div>
    <div class="row"><label>1周の秒</label><input type="range" id="loop" min="2" max="20" step="1" value="6"><output></output></div>

    <h2>背景</h2>
    <div class="row2">
      <button class="btn s" data-bgmode="solid">単色</button>
      <button class="btn s" data-bgmode="grad">グラデ</button>
      <button class="btn s" data-bgmode="img">画像</button>
      <button class="btn s" data-bgmode="none">透明</button>
      <label class="btn s">画像をえらぶ<input type="file" id="bgFile" accept="image/*" hidden></label>
    </div>
    <div class="row2" id="gradBox">
      <input type="color" id="c1" value="#c9d8ff"><input type="color" id="c2" value="#ffe1f0"><input type="color" id="c3" value="#ffffff">
      <span class="note" id="gradNote">上・下・まんなか</span>
    </div>
    <div id="imgBox">
      <div class="row"><label>ぼかし</label><input type="range" id="bgBlur" min="0" max="20" step="1" value="0"><output></output></div>
      <div class="row"><label>明るさ</label><input type="range" id="bgBright" min="40" max="160" step="1" value="100"><output></output></div>
      <div class="row"><label>ゆっくり寄る</label><input type="range" id="bgZoom" min="0" max="20" step="1" value="6"><output></output></div>
      <div class="row"><label>ゆれ</label><input type="range" id="bgPan" min="0" max="20" step="1" value="4"><output></output></div>
    </div>

    <h2>下地の動き</h2>
    <div class="row2" id="baseBtns">
      <button class="btn s" data-base="none">なし</button>
      <button class="btn s" data-base="sunburst">サンバースト</button>
      <button class="btn s" data-base="smoke">ダークもや</button>
      <button class="btn s" data-base="fire">炎</button>
      <button class="btn s" data-base="stripe">斜めストライプ</button>
      <button class="btn s" data-base="light">光の筋</button>
      <button class="btn s" data-base="swirl">うず</button>
      <button class="btn s" data-base="dots">ドット</button>
    </div>
    <div id="baseBox">
      <div class="row2"><span class="note" style="width:88px">色</span><input type="color" id="b1"><input type="color" id="b2"></div>
      <div class="row"><label>速さ</label><input type="range" id="bLaps" min="1" max="4" step="1" value="1"><output></output></div>
      <div class="row"><label>強さ</label><input type="range" id="bPower" min="0" max="100" step="1" value="70"><output></output></div>
      <div class="row"><label>量・大きさ</label><input type="range" id="bAmount" min="0" max="100" step="1" value="50"><output></output></div>
    </div>

    <h2>散らすもの <small>上ほど手前</small></h2>
    <div class="row2">
      <select id="addShape" style="width:auto">
        <option value="">＋ 形を足す…</option>
        <option value="sparkle">キラッ</option><option value="star">ほし</option><option value="heart">ハート</option>
        <option value="bokeh">玉ボケ</option><option value="ring">わっか</option><option value="dot">つぶ</option>
        <option value="shard">かけら</option><option value="petal">花びら</option><option value="snow">ゆき</option>
        <option value="text">文字・絵文字</option>
      </select>
      <label class="btn s">＋ 絵を足す<input type="file" id="spFile" accept="image/*" multiple hidden></label>
    </div>
    <label class="note"><input type="checkbox" id="cutWhite" checked> 絵の白い背景をぬく</label>
    <div class="layers" id="layers"></div>

    <div id="edit"></div>

    <h2>仕上げ</h2>
    <div class="row"><label>光もれ</label><input type="range" id="leak" min="0" max="100" step="1" value="35"><output></output></div>
    <div class="row"><label>光が走る</label><input type="range" id="sweep" min="0" max="100" step="1" value="0"><output></output></div>
    <div class="row"><label>ふちを暗く</label><input type="range" id="vig" min="0" max="100" step="1" value="15"><output></output></div>
    <div class="row"><label>ざらざら</label><input type="range" id="grain" min="0" max="100" step="1" value="8"><output></output></div>
    <div class="row"><label>色ずれ</label><input type="range" id="rgb" min="0" max="100" step="1" value="0"><output></output></div>
    <div class="row"><label>わく</label><input type="range" id="frame" min="0" max="60" step="1" value="0"><output></output></div>
    <div class="row2"><span class="note">わくの色</span><input type="color" id="frameCol" value="#ffffff"></div>

    <h2>仮置き <small>見るだけ。書き出しには 入らない</small></h2>
    <div class="row2">
      <label class="btn s">人物を 置く<input type="file" id="ghostFile" accept="image/*" hidden></label>
      <button class="btn s" id="ghostClear">はずす</button>
    </div>
    <div class="row"><label>テロップ</label><input type="text" id="telop" placeholder="字幕の 仮の 文字"><span></span></div>

    <h2>お気に入り</h2>
    <div class="row2">
      <select id="favSel" style="width:auto;flex:1"></select>
      <button class="btn s" id="favLoad">よみこむ</button>
      <button class="btn s" id="favDel">けす</button>
    </div>
    <div class="row2"><button class="btn s" id="favSave">今の 設定を 保存</button><span class="note">このブラウザに 残る（絵・画像は のぞく）</span></div>

    <hr>
    <h2>画像を作ってもらう</h2>
    <textarea id="genPrompt" placeholder="例: 夜空と雲、パステル、アニメ背景 / 例: ピンクのリボン"></textarea>
    <div class="row2">
      <select id="genUse" style="width:auto">
        <option value="bg">背景にする</option>
        <option value="sprite">散らす絵にする</option>
      </select>
    </div>
    <div class="row2"><button class="btn main" id="genGo">作る</button><span class="note" id="genNote"></span></div>
    <div class="status" id="genStatus"></div>

    <hr>
    <h2>書き出し</h2>
    <div class="row"><label>くり返し</label><input type="range" id="reps" min="1" max="10" step="1" value="1"><output></output></div>
    <div class="row2">
      <button class="btn main" id="recGo">動画で保存</button>
      <button class="btn" id="seqGo">PNG連番 (ZIP)</button>
      <button class="btn" id="pngGo">今の絵を PNG</button>
      <button class="btn" id="fullGo">全画面で流す</button>
    </div>
    <div class="status" id="recStatus"></div>
    <p class="note">ループの切れ目は つながるように 作ってある。透明で 使う ときは PNG連番（30fps で 読み込む）。全画面は Esc で もどる。</p>
  </div>
</div>

<script src="lib/mp4-muxer.js"></script>
<script type="module">
import { watchRanges } from '../oekaki-kobo/js/rslider.js';
import { watchColors } from '../../haani-color.js';
import { haishokuPicker } from '../skin/haishoku.js';

const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const frac = v => v - Math.floor(v);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- 状態 ---------- */
const S = {
  W: 1920, H: 1080, loop: 6,
  bg: { mode: 'grad', c1: '#c9d8ff', c2: '#ffe1f0', c3: '#ffffff', img: null, blur: 0, bright: 100, zoom: 6, pan: 4 },
  base: { type: 'none', c1: '#ffe36b', c2: '#ffb13b', laps: 1, power: 70, amount: 50 },
  fx: { leak: 35, sweep: 0, vig: 15, grain: 8, rgb: 0, frame: 0, frameCol: '#ffffff' },
  layers: [], sel: -1,
};

const SHAPE_NAMES = { sparkle: 'キラッ', star: 'ほし', heart: 'ハート', bokeh: '玉ボケ', ring: 'わっか', dot: 'つぶ', shard: 'かけら', petal: '花びら', snow: 'ゆき', text: '文字', image: '絵' };
const MOTIONS = { up: '上へ', down: '下へ', right: '右へ', left: '左へ', diag: 'ななめ', float: 'ふわふわ', out: '広がる', still: 'とまる' };
const BLENDS = { 'source-over': 'ふつう', screen: 'スクリーン', lighter: '加算', overlay: 'オーバーレイ', multiply: '乗算' };

let uid = 1;
function newLayer(shape, o = {}) {
  return Object.assign({
    id: uid++, on: true, shape, text: '★', imgs: [],
    count: 30, size: 4, sizeVar: 60, motion: 'up', speed: 1, sway: 30, spin: 0, twinkle: 40,
    opacity: 90, glow: 30, blend: 'source-over', depth: 60,
    colors: ['#ffffff', '#ffd6ec', '#bfe3ff'], seed: Math.random() * 1e9 | 0, _key: '', _pts: null,
  }, o);
}

/* ---------- 形 ---------- */
function drawShape(c, L, pt, s, col) {
  c.fillStyle = col; c.strokeStyle = col;
  switch (L.shape) {
    case 'sparkle': {
      c.beginPath(); const a = s, b = s * .16;
      c.moveTo(0, -a); c.quadraticCurveTo(b, -b, a, 0); c.quadraticCurveTo(b, b, 0, a);
      c.quadraticCurveTo(-b, b, -a, 0); c.quadraticCurveTo(-b, -b, 0, -a); c.fill(); break;
    }
    case 'star': {
      c.beginPath();
      for (let i = 0; i < 10; i++) { const r = i % 2 ? s * .42 : s, an = i / 10 * TAU - Math.PI / 2; c.lineTo(Math.cos(an) * r, Math.sin(an) * r); }
      c.closePath(); c.fill(); break;
    }
    case 'heart': {
      c.beginPath(); c.moveTo(0, s * .85);
      c.bezierCurveTo(-s * 1.1, s * .1, -s * .75, -s * .9, 0, -s * .35);
      c.bezierCurveTo(s * .75, -s * .9, s * 1.1, s * .1, 0, s * .85); c.fill(); break;
    }
    case 'bokeh': {
      const g = c.createRadialGradient(0, 0, 0, 0, 0, s);
      g.addColorStop(0, col); g.addColorStop(.7, col); g.addColorStop(1, 'transparent');
      c.globalAlpha *= .55; c.fillStyle = g; c.beginPath(); c.arc(0, 0, s, 0, TAU); c.fill(); break;
    }
    case 'ring': c.lineWidth = Math.max(1, s * .14); c.beginPath(); c.arc(0, 0, s * .85, 0, TAU); c.stroke(); break;
    case 'dot': c.beginPath(); c.arc(0, 0, s * .35, 0, TAU); c.fill(); break;
    case 'snow': {
      const g = c.createRadialGradient(0, 0, 0, 0, 0, s * .5);
      g.addColorStop(0, col); g.addColorStop(.5, col); g.addColorStop(1, 'transparent');
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, s * .5, 0, TAU); c.fill(); break;
    }
    case 'shard': {
      c.beginPath(); const v = pt.verts;
      c.moveTo(v[0] * s, v[1] * s); c.lineTo(v[2] * s, v[3] * s); c.lineTo(v[4] * s, v[5] * s); c.closePath();
      c.globalAlpha *= .8; c.fill(); c.globalAlpha *= .9; c.lineWidth = Math.max(1, s * .05); c.strokeStyle = '#fff'; c.stroke(); break;
    }
    case 'petal': {
      c.beginPath(); c.moveTo(0, -s);
      c.bezierCurveTo(s * .75, -s * .5, s * .55, s * .6, 0, s);
      c.bezierCurveTo(-s * .55, s * .6, -s * .75, -s * .5, 0, -s); c.fill(); break;
    }
    case 'text': {
      c.font = `${Math.round(s * 2)}px system-ui, "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      const chars = [...(L.text || '★')].filter(ch => ch.trim());
      c.fillText(chars.length ? chars[pt.k % chars.length] : '★', 0, 0); break;
    }
    case 'image': {
      const im = L.imgs[pt.k % L.imgs.length]; if (!im) break;
      const r = im.width / im.height, w = r >= 1 ? s * 2 : s * 2 * r, h = r >= 1 ? s * 2 / r : s * 2;
      c.drawImage(im, -w / 2, -h / 2, w, h); break;
    }
  }
}

/* ---------- 粒の 準備（1周で もとに もどる よう 周回数は 整数） ---------- */
function points(L) {
  const key = [L.seed, L.count, L.shape, L.imgs.length, L.depth].join('|');
  if (L._key === key) return L._pts;
  const r = rng(L.seed), pts = [];
  for (let i = 0; i < L.count; i++) {
    const z = 1 - r() * L.depth / 100; // 1=手前
    pts.push({
      x: r(), y: r(), z, k: (r() * 1000) | 0, rs: r(),
      off: r(), off2: r(), rot: r() * TAU, dir: r() < .5 ? -1 : 1, ci: (r() * 3) | 0, lapR: r(),
      verts: [r() * 2 - 1, -1, 1, r() * 2 - 1, r() * 2 - 1, 1].map((v, j) => v * (.5 + r() * .5)),
    });
  }
  pts.sort((a, b) => a.z - b.z); // 奥から描く
  L._key = key; L._pts = pts; return pts;
}

function drawLayer(c, L, p, W, H) {
  if (!L.on || !L.count || (L.shape === 'image' && !L.imgs.length)) return;
  const U = Math.min(W, H) / 60, M = .12;
  c.save(); c.globalCompositeOperation = L.blend;
  for (const pt of points(L)) {
    const size = L.size * U * pt.z * (1 - pt.rs * L.sizeVar / 100 * .8);
    const laps = Math.max(0, Math.round(L.speed * (pt.z * .8 + .4) + (pt.lapR - .5) * .6 * L.speed));
    const sw = L.sway / 100 * .05 * Math.sin(TAU * (p * Math.max(1, laps) + pt.off));
    const sw2 = L.sway / 100 * .05 * Math.cos(TAU * (p * Math.max(1, laps) + pt.off2));
    let x = pt.x, y = pt.y, sc = 1, a = 1;
    const wrap = v => -M + frac(v) * (1 + 2 * M);
    switch (L.motion) {
      case 'up': y = wrap(pt.y - laps * p); x = pt.x + sw; break;
      case 'down': y = wrap(pt.y + laps * p); x = pt.x + sw; break;
      case 'right': x = wrap(pt.x + laps * p); y = pt.y + sw; break;
      case 'left': x = wrap(pt.x - laps * p); y = pt.y + sw; break;
      case 'diag': x = wrap(pt.x + laps * p); y = wrap(pt.y + laps * p) + sw * .5; break;
      case 'float': x = pt.x + sw * 1.5 + .01 * Math.sin(TAU * (p + pt.off)); y = pt.y + sw2 * 1.5; break;
      case 'out': {
        const t = frac(pt.off + Math.max(1, laps) * p), an = pt.x * TAU, R = .75 * Math.max(1, W / H);
        x = .5 + Math.cos(an) * t * R * H / W; y = .5 + Math.sin(an) * t * R; sc = .2 + t; a = Math.min(1, t * 5);
        break;
      }
      case 'still': break;
    }
    if (L.twinkle) {

/* ---------- 背景・仕上げ ---------- */
const grainTiles = [];

let tmp = document.createElement('canvas');

function drawBg(c, p, W, H) {

/* ---------- 下地の動き（どれも 1周で もとに もどる） ---------- */
const BASE_COLORS = {
  sunburst: ['#ffe36b', '#ffb13b'], smoke: ['#6b5a85', '#120d1c'], fire: ['#ff3d00', '#ffd23f'], stripe: ['#ffd6e7', '#ffffff'], light: ['#fff8dc', '#ffe0f0'], swirl: ['#ffc8e4', '#b9d6ff'], dots: ['#ffffff', '#ffd6e7'],

/* つなぎ目の ない ノイズ（256 で 一回り）。1周で 256 ずらせば 動画も つながる */
const NZ = (() => {
  const N = 256, f = new Float32Array(N * N), r = rng(9301);
  for (let o = 0, wsum = 0, amp = 1; o < 5; o++, amp *= .5) {
    const cells = 8 << o, g = new Float32Array(cells * cells);
    for (let i = 0; i < g.length; i++) g[i] = r();

      const gx = x / k, gy = y / k, ix = gx | 0, iy = gy | 0;
      let fx = gx - ix, fy = gy - iy; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
      const x1 = (ix + 1) % cells, y1 = (iy + 1) % cells;
      const top = g[iy * cells + ix] * (1 - fx) + g[iy * cells + x1] * fx;
      const bot = g[y1 * cells + ix] * (1 - fx) + g[y1 * cells + x1] * fx;
      f[y * N + x] += (top * (1 - fy) + bot * fy) * amp;
    }
    wsum += amp;
    if (o === 4) for (let i = 0; i < f.length; i++) f[i] /= wsum;
  }
  return f;
})();

  x = ((x % 256) + 256) % 256; y = ((y % 256) + 256) % 256;
  const ix = x | 0, iy = y | 0, fx = x - ix, fy = y - iy, x1 = (ix + 1) & 255, y1 = (iy + 1) & 255;
  return (NZ[iy * 256 + ix] * (1 - fx) + NZ[iy * 256 + x1] * fx) * (1 - fy) + (NZ[y1 * 256 + ix] * (1 - fx) + NZ[y1 * 256 + x1] * fx) * fy;

const work = document.createElement('canvas');
function workImage(W, H, long) {
  const k = long / Math.max(W, H), w = Math.max(8, Math.round(W * k)), h = Math.max(8, Math.round(H * k));
  if (work.width !== w || work.height !== h) { work.width = w; work.height = h; }
  const wc = work.getContext('2d');
  return { wc, img: wc.createImageData(w, h), w, h };
}

// もや: ゆがめた ノイズを 雲の 濃さに して、まわりほど 濃く
function drawSmoke(c, p, W, H, B) {
  const { wc, img, w, h } = workImage(W, H, 260), d = img.data;
  const pw = B.power / 100, am = B.amount / 100, sh = 256 * B.laps * p;
  const smoke = hexRgb(B.c1), deep = hexRgb(B.c2), unit = Math.min(w, h), sc = 70 / (.6 + am);
  const cut = .5 - am * .18;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const u = (x - w / 2) / unit * sc + 128, v = (y - h / 2) / unit * sc + 128;
    const q1 = nz(u * .6 + sh, v * .6) - .5, q2 = nz(u * .6 + 91, v * .6 - sh) - .5;
    const n = nz(u + q1 * 60 + sh, v + q2 * 60);
    const n2 = nz(u * 1.7 - q2 * 40, v * 1.7 + q1 * 40 - sh);
    const ex = (x / w - .5) * 2, ey = (y / h - .5) * 2, edge = Math.min(1, Math.hypot(ex, ey * 1.1) * .8);
    let den = Math.max(0, Math.min(1, (n - cut) * 2.8));

    den = Math.min(1, den);

}

// 光の筋: 上から 差しこむ 斜めの 光が ゆっくり 横に 流れ、ちりが 舞う
function drawLight(c, p, W, H, B) {
  const pw = B.power / 100, am = B.amount / 100, L = B.laps, r = rng(515), D = Math.hypot(W, H);
  const n = Math.round(4 + am * 10);
  c.save();

    const x0 = r(), wd = W * (.03 + r() * .09) * (.6 + am), o = r(), col = r() < .6 ? B.c1 : B.c2;
    const x = (-.2 + frac(x0 + L * p) * 1.4) * W;
    const a = (.25 + .5 * pw) * (.55 + .45 * Math.sin(TAU * (p * L * (1 + (r() * 2 | 0)) + o)));
    c.save(); c.translate(x, -H * .05); c.rotate(.35);
    const g = c.createLinearGradient(-wd, 0, wd, 0);
    g.addColorStop(0, col + '00'); g.addColorStop(.5, col); g.addColorStop(1, col + '00');
    c.globalAlpha = Math.max(0, a); c.fillStyle = g; c.fillRect(-wd, 0, wd * 2, D);
    c.restore();
  }
  // 上の ほうを 明るく
  const top = c.createLinearGradient(0, 0, 0, H * .7);
  top.addColorStop(0, B.c1 + Math.round(120 * pw).toString(16).padStart(2, '0')); top.addColorStop(1, B.c1 + '00');
  c.globalAlpha = 1; c.fillStyle = top; c.fillRect(0, 0, W, H);

    const laps = L * (1 + (r() * 2 | 0)), q = frac(r() + laps * p), x0 = r(), o = r();
    const x = (x0 + .03 * Math.sin(TAU * (q + o))) * W, y = (-.05 + q * 1.1) * H, rad = U * (.0015 + r() * .003);
    c.globalAlpha = (.3 + .6 * pw) * Math.sin(q * Math.PI) * (.5 + .5 * Math.sin(TAU * (p * L * 3 + o)));

// ドット: 水玉を ななめに ずらし ながら、大きさを 波で ふくらませる（1周で ちょうど 1マス 動く）
function drawDots(c, p, W, H, B) {
  const pw = B.power / 100, am = B.amount / 100, L = B.laps;
  // 行は 1つおきに 半マス ずれるので、たては 2行ぶん 動かすと ぴったり もどる
  const gap = Math.min(W, H) * (.035 + (1 - am) * .09), ox = gap * L * p, oy = 2 * gap * L * p;
  if (S.bg.mode !== 'none') { c.fillStyle = B.c2; c.globalAlpha = .35 * pw; c.fillRect(0, 0, W, H); }
  c.fillStyle = B.c1; c.globalAlpha = .45 + .55 * pw;

    // 1つおきの 行を 半マス ずらす（水玉もよう）

// うず: まんなかを 中心に ねじれた ノイズで 2色を まぜる
function drawSwirl(c, p, W, H, B) {
  const { wc, img, w, h } = workImage(W, H, 240), d = img.data;
  const pw = B.power / 100, am = B.amount / 100, sh = 256 * B.laps * p;
  const A = hexRgb(B.c1), Bc = hexRgb(B.c2), unit = Math.max(w, h), twist = 1.5 + am * 5, arms = 1 + Math.round(am * 2);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {

// 炎: 下から 上へ 流れる ノイズを、列ごとに 高さの ちがう 炎の 形で 切りぬく
function drawFire(c, p, W, H, B) {
  const { wc, img, w, h } = workImage(W, H, 300), d = img.data;
  const pw = B.power / 100, am = B.amount / 100, sh = 256 * B.laps * p;
  const edgeC = hexRgb(B.c1), hotC = hexRgb(B.c2), unit = Math.min(w, h), sc = 55 * (.6 + am * .9);

      const n = nz(u + wx * 30, v * 1.3 + wy * 20 - sh * 2);

  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.globalCompositeOperation = S.bg.mode === 'none' ? 'source-over' : 'screen';
  c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
  c.filter = `blur(${Math.min(W, H) * .003}px)`; c.drawImage(work, 0, 0, W, H); c.filter = 'none';

}

function drawBase(c, p, W, H) {
  const B = S.base; if (B.type === 'none') return;
  const D = Math.hypot(W, H), pw = B.power / 100, am = B.amount / 100, L = B.laps;
  const r = rng(77);
  c.save();
  if (B.type === 'sunburst') {
    // 2本で 1組。1周で ちょうど L組 回る
    c.fillStyle = B.c2; c.globalAlpha = S.bg.mode === 'none' ? 0 : .5 * pw; c.fillRect(0, 0, W, H);
    const n = 2 * Math.round(6 + am * 14), step = TAU / n, rot = step * 2 * L * p;
    c.translate(W / 2, H / 2); c.rotate(rot);
    c.globalAlpha = .35 + .65 * pw; c.fillStyle = B.c1;
    for (let i = 0; i < n; i += 2) { c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, D, i * step, (i + 1) * step); c.closePath(); c.fill(); }

    const g = c.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.min(W, H) * (.3 + .08 * Math.sin(TAU * p * L)));
    g.addColorStop(0, `rgba(255,255,255,${.5 * pw + .2})`); g.addColorStop(1, 'rgba(255,255,255,0)');

    c.fillStyle = B.c2; c.globalAlpha = S.bg.mode === 'none' ? 0 : .6 * pw; c.fillRect(0, 0, W, H);
    const sw = Math.min(W, H) * (.03 + am * .12), per = sw * 2, off = per * L * p;
    c.translate(W / 2, H / 2); c.rotate(-Math.PI / 4);
    c.globalAlpha = .3 + .7 * pw; c.fillStyle = B.c1;

function drawFx(c, p, t, W, H) {
  const F = S.fx, D = Math.max(W, H), clear = S.bg.mode === 'none';
  if (!clear && F.leak) {

    const blobs = [['255,190,220', 0, .9], ['180,210,255', .33, .7], ['255,240,190', .66, .6]];
    for (const [rgb, o, rr] of blobs) {
      const an = TAU * (p + o), x = W * (.5 + .45 * Math.cos(an)), y = H * (.5 + .4 * Math.sin(an * 2 + o * 3));
      const g = c.createRadialGradient(x, y, 0, x, y, D * .45 * rr);
      g.addColorStop(0, `rgba(${rgb},${F.leak / 100 * .55})`); g.addColorStop(1, `rgba(${rgb},0)`);

    c.save(); c.globalCompositeOperation = 'screen'; c.translate(x - H, 0); c.transform(1, 0, .6, 1, 0, 0);
    const bw = D * .12, g = c.createLinearGradient(-bw, 0, bw, 0);

    tc.globalCompositeOperation = 'copy'; tc.drawImage(c.canvas, 0, 0);
    tc.globalCompositeOperation = 'multiply'; tc.fillStyle = '#f00'; tc.fillRect(0, 0, W, H);
    c.save(); c.globalCompositeOperation = 'screen'; c.globalAlpha = .5; c.drawImage(tmp, o, 0); c.drawImage(tmp, -o, 0); c.restore();
  }

    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${F.vig / 100 * .8})`);

}

function render(c, t) {
  const W = c.canvas.width, H = c.canvas.height, p = frac(t / S.loop);

/* ---------- 画面 ---------- */

function loadImg(src) {
  return new Promise((ok, ng) => { const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => ok(im); im.onerror = () => ng(new Error('画像を読めませんでした')); im.src = src; });
}

// まわりから つながった 白っぽい ところを 透明に する
function cutWhite(im) {
  const max = 512, k = Math.min(1, max / Math.max(im.width, im.height));
  const w = Math.round(im.width * k), h = Math.round(im.height * k);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const c = cv.getContext('2d'); c.drawImage(im, 0, 0, w, h);
  const d = c.getImageData(0, 0, w, h), px = d.data;
  const seen = new Uint8Array(w * h), st = [];
  const isBg = i => { const o = i * 4; return px[o + 3] < 10 || (px[o] > 225 && px[o + 1] > 225 && px[o + 2] > 225); };
  for (let x = 0; x < w; x++) st.push(x, x + (h - 1) * w);
  for (let y = 0; y < h; y++) st.push(y * w, y * w + w - 1);
  while (st.length) {
    const i = st.pop(); if (seen[i] || !isBg(i)) continue; seen[i] = 1;
    const x = i % w, y = (i / w) | 0;
    if (x > 0) st.push(i - 1); if (x < w - 1) st.push(i + 1); if (y > 0) st.push(i - w); if (y < h - 1) st.push(i + w);
  }
  let any = false;
  for (let i = 0; i < w * h; i++) if (seen[i]) { px[i * 4 + 3] = 0; any = true; }
  if (!any) return cv;
  // ふちを 少し なじませる
  for (let i = 0; i < w * h; i++) {
    if (seen[i]) continue; const x = i % w, y = (i / w) | 0;
    const nb = (x > 0 && seen[i - 1]) || (x < w - 1 && seen[i + 1]) || (y > 0 && seen[i - w]) || (y < h - 1 && seen[i + w]);
    if (nb) { const o = i * 4, l = (px[o] + px[o + 1] + px[o + 2]) / 3; if (l > 200) px[o + 3] = Math.min(px[o + 3], (255 - l) * 4); }
  }
  c.putImageData(d, 0, 0); return cv;
}

/* ---------- 画像生成 ---------- */
const genUse = $('#genUse');
$('#genNote').textContent = '手元の かんたん画像生成(:8200) を 使う';
// PC で 開けば 127.0.0.1:8200。タブレットなどで ランチャーの 中継(ポート+10000)から 開いた ときは 同じ PC の :18200
function genBase() {
  const h = location.hostname;
  if (h === '127.0.0.1' || h === 'localhost' || h === '[::1]') return 'http://127.0.0.1:8200';
  return `http://${h}:${+location.port >= 10000 ? 18200 : 8200}`;
}
async function generate(prompt, use) {
  const sprite = use === 'sprite';
  const full = sprite
    ? `${prompt}, single object, centered, isolated on plain white background, sticker, cute illustration, no text`
    : `${prompt}, background art, no people, no text, soft light, high detail`;
  const base = genBase();
  const r = await fetch(base + '/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt: full, negative: 'text, watermark, person' + (sprite ? ', background scenery' : ''), denoise: 1 }) });
  const j = await r.json(); if (j.error) throw new Error(j.error);
  return fileToImg(await (await fetch(base + j.image)).blob());
}
$('#genGo').onclick = async () => {

  if (!prompt) { st.className = 'status err'; st.textContent = '何を作るか 書いてください'; return; }

  try {

    else {

    }

  } catch (e) {

    console.error('[うごく背景] 生成', e);
    const m = String(e && e.message || e);
    st.textContent = /Failed to fetch|NetworkError|Load failed/i.test(m)
      ? `かんたん画像生成 に つながりません（${genBase()}）。PC で かんたん画像生成 を 起動して ください。`
      : '作れませんでした: ' + m;
  } finally { btn.disabled = false; }
};

/* ---------- 書き出し ---------- */
function save(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
/* 無圧縮の ZIP（PNG は もう 縮んで いるので これで 十分） */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {
  const parts = [], cen = []; let off = 0;
  const enc = new TextEncoder();
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint32(14, crc, true); h.setUint32(18, sz, true); h.setUint32(22, sz, true); h.setUint16(26, name.length, true);
    parts.push(h.buffer, name, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint32(16, crc, true); c.setUint32(20, sz, true); c.setUint32(24, sz, true);
    c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    cen.push(c.buffer, name);
    off += 30 + name.length + sz;
  }
  const cenSize = cen.reduce((a, b) => a + b.byteLength, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cenSize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...cen, e.buffer], { type: 'application/zip' });
}
$('#seqGo').onclick = async () => {
  const st = $('#recStatus'), fps = 30, reps = +$('#reps').value, perLoop = Math.round(S.loop * fps), total = perLoop * reps;
  // PNG に する 部分は 裏で 進むので、何枚か 同時に 走らせる
  const K = 6, cvs = Array.from({ length: K }, () => { const cv = document.createElement('canvas'); cv.width = S.W; cv.height = S.H; return cv; });
  $('#seqGo').disabled = true; st.className = 'status';
  try {
    const files = [];
    for (let i0 = 0; i0 < total; i0 += K) {
      const jobs = [];
      for (let j = 0; j < K && i0 + j < total; j++) {
        const i = i0 + j, cv = cvs[j];
        render(cv.getContext('2d'), (i % perLoop) / fps);
        jobs.push(new Promise(ok => cv.toBlob(ok, 'image/png')).then(async b => ({ name: `ugoku_${String(i).padStart(4, '0')}.png`, data: new Uint8Array(await b.arrayBuffer()) })));
      }
      files.push(...await Promise.all(jobs));
      st.textContent = `PNG を 作っています… ${Math.round(files.length / total * 100)}%`;
    }
    st.textContent = 'ZIP に まとめています…'; await new Promise(r => setTimeout(r, 0));
    save(makeZip(files), 'ugoku-haikei-png.zip');
    st.textContent = `保存しました（PNG ${total}枚・30fps・${S.loop * reps}秒）`;
  } catch (e) {
    st.className = 'status err'; st.textContent = '書き出せませんでした: ' + (e.message || e);
  } finally { $('#seqGo').disabled = false; }
};
$('#pngGo').onclick = () => {
  const cv = document.createElement('canvas'); cv.width = S.W; cv.height = S.H;
  render(cv.getContext('2d'), (performance.now() - t0) / 1000);
  cv.toBlob(b => save(b, 'ugoku-haikei.png'));
};
/* 1コマずつ 時間を つけて 書きこむ（長さが 正しく 入り、ほかの ソフトでも 読める） */
let whyNoMp4 = '';
async function pickAvc(w, h, fps) {
  if (typeof VideoEncoder === 'undefined') { whyNoMp4 = 'VideoEncoder が無い' + (isSecureContext ? '' : '（https か 127.0.0.1 で 開いて いない）'); return null; }
  if (typeof Mp4Muxer === 'undefined') { whyNoMp4 = 'mp4-muxer が 読めて いない'; return null; }
  const codecs = ['avc1.640034', 'avc1.640033', 'avc1.64002a', 'avc1.640028', 'avc1.4d0034', 'avc1.4d002a', 'avc1.4d0028', 'avc1.42003e', 'avc1.42002a', 'avc1.42001f'];
  for (const hw of ['no-preference', 'prefer-software'])
    for (const codec of codecs)
      for (const br of [Math.round(w * h * fps * .12), 8e6, 4e6]) {
        try { const cfg = { codec, width: w, height: h, bitrate: br, framerate: fps, hardwareAcceleration: hw };
          const r = await VideoEncoder.isConfigSupported(cfg); if (r && r.supported) return cfg; } catch (e) { whyNoMp4 = String(e.message || e); }
      }
  // 最後に いちばん 素の 設定で
  for (const codec of codecs) {
    try { const cfg = { codec, width: w, height: h }; const r = await VideoEncoder.isConfigSupported(cfg); if (r && r.supported) return cfg; } catch (_) {}
  }
  whyNoMp4 = whyNoMp4 || `H.264 ${w}×${h} が 通らない`;
  return null;
}
// 1コマずつ 書けない ときの 予備: 録画して 長さを あとから 書きこむ（webm）
async function recordFallback(st, reps) {
  const type = ['video/webm;codecs=vp9', 'video/webm', 'video/mp4'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!type) throw new Error('動画を 作る 機能が ありません');
  const cv = document.createElement('canvas'); cv.width = S.W; cv.height = S.H; const c = cv.getContext('2d'); render(c, 0);
  const stream = cv.captureStream(0), track = stream.getVideoTracks()[0];
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 12e6 });
  const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const done = new Promise(ok => rec.onstop = ok); rec.start(500);
  const fps = 30, n = Math.round(S.loop * reps * fps), t = performance.now();
  for (let f = 0; f < n; f++) {
    const w = t + f * 1000 / fps - performance.now(); if (w > 0) await new Promise(r => setTimeout(r, w));
    render(c, (f / fps) % S.loop); track.requestFrame();
    if (f % 15 === 0) st.textContent = `書き出し中（予備の方法）… ${Math.round(f / n * 100)}%`;
  }
  await new Promise(r => setTimeout(r, 150)); rec.stop(); await done;
  let blob = new Blob(chunks, { type });
  if (type.includes('webm')) {
    // PC の かんたん画像生成 が 動いて いれば、そこで MP4 に して もらう
    try {
      st.textContent = 'PC で MP4 に しています…';
      const r = await fetch(genBase() + '/to-mp4', { method: 'POST', body: blob });
      if (r.ok) return { blob: await r.blob(), ext: 'mp4' };
    } catch (_) {}
    blob = await fixWebmDuration(blob, S.loop * reps * 1000);
  }
  return { blob, ext: type.includes('mp4') ? 'mp4' : 'webm' };
}
// webm の Duration を 書きこむ（録画だと 入らない）
async function fixWebmDuration(blob, ms) {
  const b = new Uint8Array(await blob.arrayBuffer());
  // Info(0x1549A966) の 中の TimecodeScale の 後ろに Duration(0x4489, float64) を 足す
  for (let i = 0; i < Math.min(b.length - 4, 4096); i++) {
    if (b[i] === 0x15 && b[i + 1] === 0x49 && b[i + 2] === 0xA9 && b[i + 3] === 0x66) {
      const szByte = b[i + 4]; let len = 1; while (len <= 8 && !(szByte & (0x80 >> (len - 1)))) len++;
      let size = szByte & (0xFF >> len); for (let k = 1; k < len; k++) size = size * 256 + b[i + 4 + k];
      const start = i + 4 + len, dur = new Uint8Array(11); dur[0] = 0x44; dur[1] = 0x89; dur[2] = 0x88;
      new DataView(dur.buffer).setFloat64(3, ms);
      const ns = size + 11, sz = new Uint8Array(8); sz[0] = 0x01; for (let k = 7, v = ns; k >= 1; k--, v = Math.floor(v / 256)) sz[k] = v & 255;
      const out = new Uint8Array(b.length + 11 + 8 - len);
      out.set(b.subarray(0, i + 4)); out.set(sz, i + 4); out.set(b.subarray(start, start + size), i + 12);
      out.set(dur, i + 12 + size); out.set(b.subarray(start + size), i + 23 + size);
      return new Blob([out], { type: blob.type });
    }
  }
  return blob;
}
$('#recGo').onclick = async () => {
  const st = $('#recStatus'), W = S.W & ~1, H = S.H & ~1;
  let fps = 60, cfg = await pickAvc(W, H, fps);
  if (!cfg) { fps = 30; cfg = await pickAvc(W, H, fps); }
  console.log('[うごく背景] 書き出し設定', cfg, whyNoMp4);
  if (!cfg) {
    $('#recGo').disabled = true; st.className = 'status';
    try { const r = await recordFallback(st, +$('#reps').value); save(r.blob, 'ugoku-haikei.' + r.ext); st.textContent = `保存しました（${r.ext.toUpperCase()}・${S.loop * +$('#reps').value}秒）${r.ext === 'webm' ? 'MP4に できなかった 理由: ' + whyNoMp4 + '（PC で かんたん画像生成 を 起動すると MP4 に なる）' : ''}`; }
    catch (e) { st.className = 'status err'; st.textContent = '書き出せませんでした: ' + (e.message || e); }
    finally { $('#recGo').disabled = false; }
    return;
  }
  const reps = +$('#reps').value, perLoop = Math.round(S.loop * fps), total = perLoop * reps, us = 1e6 / fps;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const c = cv.getContext('2d');
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: W, height: H, frameRate: fps }, fastStart: 'in-memory' });
  let failed = null;
  const enc = new VideoEncoder({ output: (ch, m) => muxer.addVideoChunk(ch, m), error: e => { failed = e; } });
  enc.configure(cfg);
  $('#recGo').disabled = true; st.className = 'status';
  try {
    for (let i = 0; i < total; i++) {
      if (failed) throw failed;
      render(c, (i % perLoop) / fps);
      const fr = new VideoFrame(cv, { timestamp: Math.round(i * us), duration: Math.round(us) });
      enc.encode(fr, { keyFrame: i % fps === 0 }); fr.close();
      if (enc.encodeQueueSize > 8) while (enc.encodeQueueSize > 4) await new Promise(r => setTimeout(r, 4));
      if (i % 10 === 0) { st.textContent = `書き出し中… ${Math.round(i / total * 100)}%`; await new Promise(r => setTimeout(r, 0)); }
    }
    await enc.flush(); enc.close(); if (failed) throw failed;
    muxer.finalize();
    save(new Blob([muxer.target.buffer], { type: 'video/mp4' }), 'ugoku-haikei.mp4');
    st.textContent = `保存しました（MP4・${S.loop * reps}秒）`;
  } catch (e) {
    st.className = 'status err'; st.textContent = '書き出せませんでした: ' + (e.message || e);
  } finally { $('#recGo').disabled = false; }
};
$('#fullGo').onclick = () => {
  const wrap = document.createElement('div'); wrap.className = 'full';
  const cv = document.createElement('canvas'); cv.width = S.W; cv.height = S.H; wrap.append(cv); document.body.append(wrap);
  const c = cv.getContext('2d'); let alive = true;
  const loop = now => { if (!alive) return; render(c, (now - t0) / 1000); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  const close = () => { alive = false; wrap.remove(); document.removeEventListener('keydown', esc); if (document.fullscreenElement) document.exitFullscreen(); };
  const esc = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', esc); wrap.ondblclick = close;
  wrap.requestFullscreen?.().catch(() => {});
  document.addEventListener('fullscreenchange', function f() { if (!document.fullscreenElement) { close(); document.removeEventListener('fullscreenchange', f); } });
};
