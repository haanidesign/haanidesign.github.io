<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>うごく背景</title>
<style>
:root{
  --paper:#FBFAEC; --card:#FFFEF7; --ink:#1E1C14; --sub:#6B675A; --line:rgba(30,28,20,.14);
  --main:#7896D2; --main-ink:#fff; --warn:#C8553D;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.5 system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif;-webkit-tap-highlight-color:transparent}
::selection{background:var(--main);color:#fff}
button,select,input,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100vh;height:100dvh}
.stage{position:relative;display:flex;align-items:center;justify-content:center;padding:16px;min-height:0;background:
  radial-gradient(circle,rgba(30,28,20,.12) 1.4px,transparent 1.6px) 0 0/16px 16px}
.stage canvas{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 2px 0 var(--ink),0 0 0 2px var(--ink);background:#000}
.stage .top{position:absolute;left:16px;top:12px;display:flex;gap:6px;align-items:center}
.stage .top a{color:var(--ink);text-decoration:none;font-weight:700}
.side{overflow:auto;border-left:2px solid var(--ink);background:var(--card);padding:12px 14px 40px;scrollbar-width:thin}
h2{font-size:13px;margin:18px 0 8px;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
h2:first-child{margin-top:4px}
h2 small{font-weight:400;color:var(--sub)}
.row{display:grid;grid-template-columns:76px minmax(0,1fr) 40px;align-items:center;gap:8px;min-height:32px}
.row label{color:var(--sub);font-size:12px}
.row output{font-size:12px;text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.btn{appearance:none;border:2px solid var(--ink);background:var(--card);border-radius:8px;padding:5px 10px;cursor:pointer;box-shadow:0 2px 0 var(--ink);white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.on,.btn.main{background:var(--main);color:var(--main-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.s{padding:2px 8px;font-size:12px}
select,input[type=text],input[type=number],textarea{border:2px solid var(--ink);border-radius:8px;background:#fff;padding:4px 8px;min-width:0;width:100%}
textarea{resize:vertical;min-height:56px}
input[type=color]{width:34px;height:28px;border:2px solid var(--ink);border-radius:6px;padding:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.layers{display:flex;flex-direction:column;gap:4px}
.layer{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:8px;padding:4px 6px;cursor:pointer;background:#fff}
.layer.sel{border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .ic{width:26px;height:26px;border-radius:5px;background:#eee center/contain no-repeat;flex:none}
.layer button{border:0;background:none;cursor:pointer;padding:2px 4px;color:var(--sub)}
.layer.off .nm{opacity:.4;text-decoration:line-through}
.empty{color:var(--sub);font-size:12px;padding:6px 0}
.thumbs{display:flex;gap:4px;flex-wrap:wrap}
.thumbs img{width:40px;height:40px;object-fit:contain;border-radius:6px;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/10px 10px;border:1px solid var(--line)}
.note{font-size:12px;color:var(--sub);margin:4px 0}
.status{font-size:12px;min-height:18px;margin-top:4px}
.status.err{color:var(--warn)}
hr{border:0;border-top:2px dashed var(--line);margin:16px 0}
.full{position:fixed;inset:0;background:#000;z-index:10;display:flex;align-items:center;justify-content:center;cursor:none}
.full canvas{max-width:100vw;max-height:100vh;border-radius:0;box-shadow:none}
/* つまみ */
.rs{position:relative;height:30px;touch-action:none;cursor:ew-resize;min-width:60px}
.rs-track{position:absolute;left:0;right:0;top:50%;height:10px;margin-top:-5px;background:var(--paper);border:2px solid var(--ink);border-radius:100px;overflow:hidden}
.rs-fill{position:absolute;left:0;top:0;bottom:0;background:var(--main)}
.rs-knob{position:absolute;top:50%;width:18px;height:24px;margin:-12px 0 0 -9px;background:var(--card);border:2px solid var(--ink);border-radius:7px;box-shadow:0 2px 0 var(--ink)}
.rs.drag .rs-knob{background:var(--main)}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100dvh}
  .stage{position:sticky;top:0;z-index:5;padding:44px 16px 12px;max-height:52vh;background-color:var(--paper)}
  .side{border-left:0;border-top:2px solid var(--ink)}
}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="top"><a href="../../index.html">← LAB</a></div>
    <canvas id="view"></canvas>
  </div>

  <div class="side">
    <h2>おまかせ</h2>
    <div class="row2" id="presets"></div>

    <h2>大きさ・長さ</h2>
    <div class="row"><label>形</label>
      <select id="size">
        <option value="1920x1080">よこ 1920×1080</option>
        <option value="1080x1920">たて 1080×1920</option>
        <option value="1080x1080">ましかく 1080×1080</option>
        <option value="1280x720">よこ 1280×720</option>
      </select><span></span></div>
    <div class="row"><label>1周の秒</label><input type="range" id="loop" min="2" max="20" step="1" value="6"><output></output></div>

    <h2>背景</h2>
    <div class="row2">
      <button class="btn s" data-bgmode="grad">グラデ</button>
      <button class="btn s" data-bgmode="img">画像</button>
      <label class="btn s">画像をえらぶ<input type="file" id="bgFile" accept="image/*" hidden></label>
    </div>
    <div class="row2" id="gradBox">
      <input type="color" id="c1" value="#c9d8ff"><input type="color" id="c2" value="#ffe1f0"><input type="color" id="c3" value="#ffffff">
      <span class="note">上・下・まんなか</span>
    </div>
    <div id="imgBox">
      <div class="row"><label>ぼかし</label><input type="range" id="bgBlur" min="0" max="20" step="1" value="0"><output></output></div>
      <div class="row"><label>明るさ</label><input type="range" id="bgBright" min="40" max="160" step="1" value="100"><output></output></div>
      <div class="row"><label>ゆっくり寄る</label><input type="range" id="bgZoom" min="0" max="20" step="1" value="6"><output></output></div>
      <div class="row"><label>ゆれ</label><input type="range" id="bgPan" min="0" max="20" step="1" value="4"><output></output></div>
    </div>

    <h2>散らすもの <small>上ほど手前</small></h2>
    <div class="row2">
      <select id="addShape" style="width:auto">
        <option value="">＋ 形を足す…</option>
        <option value="sparkle">キラッ</option><option value="star">ほし</option><option value="heart">ハート</option>
        <option value="bokeh">玉ボケ</option><option value="ring">わっか</option><option value="dot">つぶ</option>
        <option value="shard">かけら</option><option value="petal">花びら</option><option value="snow">ゆき</option>
        <option value="text">文字・絵文字</option>
      </select>
      <label class="btn s">＋ 絵を足す<input type="file" id="spFile" accept="image/*" multiple hidden></label>
    </div>
    <label class="note"><input type="checkbox" id="cutWhite" checked> 絵の白い背景をぬく</label>
    <div class="layers" id="layers"></div>

    <div id="edit"></div>

    <h2>仕上げ</h2>
    <div class="row"><label>光もれ</label><input type="range" id="leak" min="0" max="100" step="1" value="35"><output></output></div>
    <div class="row"><label>光が走る</label><input type="range" id="sweep" min="0" max="100" step="1" value="0"><output></output></div>
    <div class="row"><label>ふちを暗く</label><input type="range" id="vig" min="0" max="100" step="1" value="15"><output></output></div>
    <div class="row"><label>ざらざら</label><input type="range" id="grain" min="0" max="100" step="1" value="8"><output></output></div>
    <div class="row"><label>色ずれ</label><input type="range" id="rgb" min="0" max="100" step="1" value="0"><output></output></div>
    <div class="row"><label>わく</label><input type="range" id="frame" min="0" max="60" step="1" value="0"><output></output></div>
    <div class="row2"><span class="note">わくの色</span><input type="color" id="frameCol" value="#ffffff"></div>

    <hr>
    <h2>画像を作ってもらう</h2>
    <textarea id="genPrompt" placeholder="例: 夜空と雲、パステル、アニメ背景 / 例: ピンクのリボン"></textarea>
    <div class="row2">
      <select id="genUse" style="width:auto">
        <option value="bg">背景にする</option>
        <option value="sprite">散らす絵にする</option>
      </select>
    </div>
    <div class="row2"><button class="btn main" id="genGo">作る</button><span class="note" id="genNote"></span></div>
    <div class="status" id="genStatus"></div>

    <hr>
    <h2>書き出し</h2>
    <div class="row"><label>くり返し</label><input type="range" id="reps" min="1" max="10" step="1" value="1"><output></output></div>
    <div class="row2">
      <button class="btn main" id="recGo">動画で保存</button>
      <button class="btn" id="pngGo">今の絵を PNG</button>
      <button class="btn" id="fullGo">全画面で流す</button>
    </div>
    <div class="status" id="recStatus"></div>
    <p class="note">ループの切れ目は つながるように 作ってある。全画面は Esc で もどる。</p>
  </div>
</div>

<script src="lib/mp4-muxer.js"></script>
<script type="module">
import { watchRanges } from '../oekaki-kobo/js/rslider.js';

const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const frac = v => v - Math.floor(v);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- 状態 ---------- */
const S = {
  W: 1920, H: 1080, loop: 6,
  bg: { mode: 'grad', c1: '#c9d8ff', c2: '#ffe1f0', c3: '#ffffff', img: null, blur: 0, bright: 100, zoom: 6, pan: 4 },
  fx: { leak: 35, sweep: 0, vig: 15, grain: 8, rgb: 0, frame: 0, frameCol: '#ffffff' },
  layers: [], sel: -1,
};

const SHAPE_NAMES = { sparkle: 'キラッ', star: 'ほし', heart: 'ハート', bokeh: '玉ボケ', ring: 'わっか', dot: 'つぶ', shard: 'かけら', petal: '花びら', snow: 'ゆき', text: '文字', image: '絵' };
const MOTIONS = { up: '上へ', down: '下へ', right: '右へ', left: '左へ', diag: 'ななめ', float: 'ふわふわ', out: '広がる', still: 'とまる' };
const BLENDS = { 'source-over': 'ふつう', screen: 'スクリーン', lighter: '加算', overlay: 'オーバーレイ', multiply: '乗算' };

let uid = 1;
function newLayer(shape, o = {}) {
  return Object.assign({
    id: uid++, on: true, shape, text: '★', imgs: [],
    count: 30, size: 4, sizeVar: 60, motion: 'up', speed: 1, sway: 30, spin: 0, twinkle: 40,
    opacity: 90, glow: 30, blend: 'source-over', depth: 60,
    colors: ['#ffffff', '#ffd6ec', '#bfe3ff'], seed: Math.random() * 1e9 | 0, _key: '', _pts: null,
  }, o);
}

/* ---------- 形 ---------- */
function drawShape(c, L, pt, s, col) {
  c.fillStyle = col; c.strokeStyle = col;
  switch (L.shape) {
    case 'sparkle': {
      c.beginPath(); const a = s, b = s * .16;
      c.moveTo(0, -a); c.quadraticCurveTo(b, -b, a, 0); c.quadraticCurveTo(b, b, 0, a);
      c.quadraticCurveTo(-b, b, -a, 0); c.quadraticCurveTo(-b, -b, 0, -a); c.fill(); break;
    }
    case 'star': {
      c.beginPath();
      for (let i = 0; i < 10; i++) { const r = i % 2 ? s * .42 : s, an = i / 10 * TAU - Math.PI / 2; c.lineTo(Math.cos(an) * r, Math.sin(an) * r); }
      c.closePath(); c.fill(); break;
    }
    case 'heart': {
      c.beginPath(); c.moveTo(0, s * .85);
      c.bezierCurveTo(-s * 1.1, s * .1, -s * .75, -s * .9, 0, -s * .35);
      c.bezierCurveTo(s * .75, -s * .9, s * 1.1, s * .1, 0, s * .85); c.fill(); break;
    }
    case 'bokeh': {
      const g = c.createRadialGradient(0, 0, 0, 0, 0, s);
      g.addColorStop(0, col); g.addColorStop(.7, col); g.addColorStop(1, 'transparent');
      c.globalAlpha *= .55; c.fillStyle = g; c.beginPath(); c.arc(0, 0, s, 0, TAU); c.fill(); break;
    }
    case 'ring': c.lineWidth = Math.max(1, s * .14); c.beginPath(); c.arc(0, 0, s * .85, 0, TAU); c.stroke(); break;
    case 'dot': c.beginPath(); c.arc(0, 0, s * .35, 0, TAU); c.fill(); break;
    case 'snow': {
      const g = c.createRadialGradient(0, 0, 0, 0, 0, s * .5);
      g.addColorStop(0, col); g.addColorStop(.5, col); g.addColorStop(1, 'transparent');
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, s * .5, 0, TAU); c.fill(); break;
    }
    case 'shard': {
      c.beginPath(); const v = pt.verts;
      c.moveTo(v[0] * s, v[1] * s); c.lineTo(v[2] * s, v[3] * s); c.lineTo(v[4] * s, v[5] * s); c.closePath();
      c.globalAlpha *= .8; c.fill(); c.globalAlpha *= .9; c.lineWidth = Math.max(1, s * .05); c.strokeStyle = '#fff'; c.stroke(); break;
    }
    case 'petal': {
      c.beginPath(); c.moveTo(0, -s);
      c.bezierCurveTo(s * .75, -s * .5, s * .55, s * .6, 0, s);
      c.bezierCurveTo(-s * .55, s * .6, -s * .75, -s * .5, 0, -s); c.fill(); break;
    }
    case 'text': {
      c.font = `${Math.round(s * 2)}px system-ui, "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      const chars = [...(L.text || '★')].filter(ch => ch.trim());
      c.fillText(chars.length ? chars[pt.k % chars.length] : '★', 0, 0); break;
    }
    case 'image': {
      const im = L.imgs[pt.k % L.imgs.length]; if (!im) break;
      const r = im.width / im.height, w = r >= 1 ? s * 2 : s * 2 * r, h = r >= 1 ? s * 2 / r : s * 2;
      c.drawImage(im, -w / 2, -h / 2, w, h); break;
    }
  }
}

/* ---------- 粒の 準備（1周で もとに もどる よう 周回数は 整数） ---------- */
function points(L) {
  const key = [L.seed, L.count, L.shape, L.imgs.length, L.depth].join('|');
  if (L._key === key) return L._pts;
  const r = rng(L.seed), pts = [];
  for (let i = 0; i < L.count; i++) {
    const z = 1 - r() * L.depth / 100; // 1=手前
    pts.push({
      x: r(), y: r(), z, k: (r() * 1000) | 0, rs: r(),
      off: r(), off2: r(), rot: r() * TAU, dir: r() < .5 ? -1 : 1, ci: (r() * 3) | 0, lapR: r(),
      verts: [r() * 2 - 1, -1, 1, r() * 2 - 1, r() * 2 - 1, 1].map((v, j) => v * (.5 + r() * .5)),
    });
  }
  pts.sort((a, b) => a.z - b.z); // 奥から描く
  L._key = key; L._pts = pts; return pts;
}

function drawLayer(c, L, p, W, H) {
  if (!L.on || !L.count || (L.shape === 'image' && !L.imgs.length)) return;
  const U = Math.min(W, H) / 60, M = .12;
  c.save(); c.globalCompositeOperation = L.blend;
  for (const pt of points(L)) {
    const size = L.size * U * pt.z * (1 - pt.rs * L.sizeVar / 100 * .8);
    const laps = Math.max(0, Math.round(L.speed * (pt.z * .8 + .4) + (pt.lapR - .5) * .6 * L.speed));
    const sw = L.sway / 100 * .05 * Math.sin(TAU * (p * Math.max(1, laps) + pt.off));
    const sw2 = L.sway / 100 * .05 * Math.cos(TAU * (p * Math.max(1, laps) + pt.off2));
    let x = pt.x, y = pt.y, sc = 1, a = 1;
    const wrap = v => -M + frac(v) * (1 + 2 * M);
    switch (L.motion) {
      case 'up': y = wrap(pt.y - laps * p); x = pt.x + sw; break;
      case 'down': y = wrap(pt.y + laps * p); x = pt.x + sw; break;
      case 'right': x = wrap(pt.x + laps * p); y = pt.y + sw; break;
      case 'left': x = wrap(pt.x - laps * p); y = pt.y + sw; break;
      case 'diag': x = wrap(pt.x + laps * p); y = wrap(pt.y + laps * p) + sw * .5; break;
      case 'float': x = pt.x + sw * 1.5 + .01 * Math.sin(TAU * (p + pt.off)); y = pt.y + sw2 * 1.5; break;
      case 'out': {
        const t = frac(pt.off + Math.max(1, laps) * p), an = pt.x * TAU, R = .75 * Math.max(1, W / H);
        x = .5 + Math.cos(an) * t * R * H / W; y = .5 + Math.sin(an) * t * R; sc = .2 + t; a = Math.min(1, t * 5);
        break;
      }
      case 'still': break;
    }
    if (L.twinkle) {
      const n = Math.max(1, Math.round(1 + pt.lapR * 2));
      const tw = Math.pow(.5 + .5 * Math.sin(TAU * (p * n + pt.off2)), 2);
      const k = L.twinkle / 100; sc *= 1 - k + k * (.3 + .7 * tw); a *= 1 - k + k * tw;
    }
    const rot = pt.rot + TAU * Math.round(L.spin * (.5 + pt.z * .5)) * p * pt.dir;
    const col = L.colors[pt.ci % L.colors.length];
    c.globalAlpha = L.opacity / 100 * a * (.45 + .55 * pt.z);
    if (c.globalAlpha <= .005 || size * sc < .3) continue;
    c.setTransform(1, 0, 0, 1, x * W, y * H); c.rotate(rot); c.scale(sc, sc);
    if (L.glow && L.shape !== 'bokeh') { c.shadowColor = L.shape === 'image' ? 'rgba(255,255,255,.9)' : col; c.shadowBlur = size * L.glow / 40; }
    else c.shadowBlur = 0;
    drawShape(c, L, pt, size, col);
  }
  c.restore();
}

/* ---------- 背景・仕上げ ---------- */
const grainTiles = [];
for (let n = 0; n < 4; n++) {
  const g = document.createElement('canvas'); g.width = g.height = 256;
  const gc = g.getContext('2d'), id = gc.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gc.putImageData(id, 0, 0); grainTiles.push(g);
}
let tmp = document.createElement('canvas');

function drawBg(c, p, W, H) {
  const B = S.bg;
  if (B.mode === 'img' && B.img) {
    const im = B.img, cover = Math.max(W / im.width, H / im.height);
    const z = 1 + B.zoom / 100 * (.5 - .5 * Math.cos(TAU * p)) + B.pan / 100 * .5;
    const dx = Math.sin(TAU * p) * B.pan / 100 * W * .2, dy = Math.sin(TAU * p * 2 + 1) * B.pan / 100 * H * .1;
    const w = im.width * cover * z, h = im.height * cover * z;
    c.save();
    c.filter = `blur(${B.blur * Math.min(W, H) / 1080}px) brightness(${B.bright}%)`;
    const bl = B.blur * 2;
    c.drawImage(im, (W - w) / 2 + dx - bl, (H - h) / 2 + dy - bl, w + bl * 2, h + bl * 2);
    c.restore();
  } else {
    const g = c.createLinearGradient(0, 0, W * .2, H);
    g.addColorStop(0, B.c1); g.addColorStop(.55, B.c3); g.addColorStop(1, B.c2);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
  }
}

function drawFx(c, p, t, W, H) {
  const F = S.fx, D = Math.max(W, H);
  if (F.leak) {
    c.save(); c.globalCompositeOperation = 'screen';
    const blobs = [['255,190,220', 0, .9], ['180,210,255', .33, .7], ['255,240,190', .66, .6]];
    for (const [rgb, o, rr] of blobs) {
      const an = TAU * (p + o), x = W * (.5 + .45 * Math.cos(an)), y = H * (.5 + .4 * Math.sin(an * 2 + o * 3));
      const g = c.createRadialGradient(x, y, 0, x, y, D * .45 * rr);
      g.addColorStop(0, `rgba(${rgb},${F.leak / 100 * .55})`); g.addColorStop(1, `rgba(${rgb},0)`);
      c.fillStyle = g; c.fillRect(0, 0, W, H);
    }
    c.restore();
  }
  if (F.sweep) {
    const q = frac(p * 1) * 1.6 - .3, x = q * (W + H);
    c.save(); c.globalCompositeOperation = 'screen'; c.translate(x - H, 0); c.transform(1, 0, .6, 1, 0, 0);
    const bw = D * .12, g = c.createLinearGradient(-bw, 0, bw, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, `rgba(255,255,255,${F.sweep / 100 * .6})`); g.addColorStop(1, 'rgba(255,255,255,0)');

    const tc = tmp.getContext('2d'), o = F.rgb / 100 * D * .006 * (1 + .5 * Math.sin(TAU * p * 3));
    tc.globalCompositeOperation = 'copy'; tc.drawImage(c.canvas, 0, 0);

    c.save(); c.globalCompositeOperation = 'screen'; c.globalAlpha = .5; c.drawImage(tmp, o, 0); c.drawImage(tmp, -o, 0); c.restore();
  }
  if (F.vig) {
    const g = c.createRadialGradient(W / 2, H / 2, D * .25, W / 2, H / 2, D * .75);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${F.vig / 100 * .8})`);

}

// まわりから つながった 白っぽい ところを 透明に する
function cutWhite(im) {
  const max = 512, k = Math.min(1, max / Math.max(im.width, im.height));
  const w = Math.round(im.width * k), h = Math.round(im.height * k);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const c = cv.getContext('2d'); c.drawImage(im, 0, 0, w, h);
  const d = c.getImageData(0, 0, w, h), px = d.data;
  const seen = new Uint8Array(w * h), st = [];
  const isBg = i => { const o = i * 4; return px[o + 3] < 10 || (px[o] > 225 && px[o + 1] > 225 && px[o + 2] > 225); };
  for (let x = 0; x < w; x++) st.push(x, x + (h - 1) * w);
  for (let y = 0; y < h; y++) st.push(y * w, y * w + w - 1);
  while (st.length) {
    const i = st.pop(); if (seen[i] || !isBg(i)) continue; seen[i] = 1;
    const x = i % w, y = (i / w) | 0;
    if (x > 0) st.push(i - 1); if (x < w - 1) st.push(i + 1); if (y > 0) st.push(i - w); if (y < h - 1) st.push(i + w);
  }
  let any = false;
  for (let i = 0; i < w * h; i++) if (seen[i]) { px[i * 4 + 3] = 0; any = true; }
  if (!any) return cv;
  // ふちを 少し なじませる
  for (let i = 0; i < w * h; i++) {
    if (seen[i]) continue; const x = i % w, y = (i / w) | 0;
    const nb = (x > 0 && seen[i - 1]) || (x < w - 1 && seen[i + 1]) || (y > 0 && seen[i - w]) || (y < h - 1 && seen[i + w]);
    if (nb) { const o = i * 4, l = (px[o] + px[o + 1] + px[o + 2]) / 3; if (l > 200) px[o + 3] = Math.min(px[o + 3], (255 - l) * 4); }
  }
  c.putImageData(d, 0, 0); return cv;
}

async function pickAvc(w, h, fps) {
  if (typeof VideoEncoder === 'undefined' || typeof Mp4Muxer === 'undefined') return null;
  for (const codec of ['avc1.640034', 'avc1.640033', 'avc1.640028', 'avc1.4d0034', 'avc1.4d0028', 'avc1.42003e', 'avc1.42002a', 'avc1.42001f']) {
    try { const cfg = { codec, width: w, height: h, bitrate: Math.round(w * h * fps * .12), framerate: fps };
      const r = await VideoEncoder.isConfigSupported(cfg); if (r && r.supported) return cfg; } catch (_) {}
  }
  return null;
}
$('#recGo').onclick = async () => {
  const st = $('#recStatus'), fps = 60, W = S.W & ~1, H = S.H & ~1;
  const cfg = await pickAvc(W, H, fps);
  if (!cfg) { st.className = 'status err'; st.textContent = 'このブラウザは 動画の 書き出しに 対応して いません（Chrome か Edge で）'; return; }
  const reps = +$('#reps').value, perLoop = Math.round(S.loop * fps), total = perLoop * reps, us = 1e6 / fps;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const c = cv.getContext('2d');
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: W, height: H, frameRate: fps }, fastStart: 'in-memory' });
  let failed = null;
  const enc = new VideoEncoder({ output: (ch, m) => muxer.addVideoChunk(ch, m), error: e => { failed = e; } });
  enc.configure(cfg);
  $('#recGo').disabled = true; st.className = 'status';
  try {
    for (let i = 0; i < total; i++) {
      if (failed) throw failed;
      render(c, (i % perLoop) / fps);
      const fr = new VideoFrame(cv, { timestamp: Math.round(i * us), duration: Math.round(us) });
      enc.encode(fr, { keyFrame: i % fps === 0 }); fr.close();
      if (enc.encodeQueueSize > 8) while (enc.encodeQueueSize > 4) await new Promise(r => setTimeout(r, 4));
      if (i % 10 === 0) { st.textContent = `書き出し中… ${Math.round(i / total * 100)}%`; await new Promise(r => setTimeout(r, 0)); }
    }
    await enc.flush(); enc.close(); if (failed) throw failed;
    muxer.finalize();
    save(new Blob([muxer.target.buffer], { type: 'video/mp4' }), 'ugoku-haikei.mp4');
    st.textContent = `保存しました（MP4・${S.loop * reps}秒）`;
  } catch (e) {
    st.className = 'status err'; st.textContent = '書き出せませんでした: ' + (e.message || e);
  } finally { $('#recGo').disabled = false; }
};
$('#fullGo').onclick = () => {
  const wrap = document.createElement('div'); wrap.className = 'full';
  const cv = document.createElement('canvas'); cv.width = S.W; cv.height = S.H; wrap.append(cv); document.body.append(wrap);
  const c = cv.getContext('2d'); let alive = true;
  const loop = now => { if (!alive) return; render(c, (now - t0) / 1000); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  const close = () => { alive = false; wrap.remove(); document.removeEventListener('keydown', esc); if (document.fullscreenElement) document.exitFullscreen(); };
  const esc = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', esc); wrap.ondblclick = close;
  wrap.requestFullscreen?.().catch(() => {});
  document.addEventListener('fullscreenchange', function f() { if (!document.fullscreenElement) { close(); document.removeEventListener('fullscreenchange', f); } });
};

watchRanges();
applyPreset('キラキラ');
</script>
