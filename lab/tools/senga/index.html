<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#E1DD60">
<title>せんが — 絵を 線画に する</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --main:#E1DD60; --main-soft:#F2F0BE;
  --cream:#FBFAEC; --paper:#FFFEF7; --ink:#1E1C14; --ink2:#5C5843; --line:#E8E5D0;
  --bd:2.5px solid var(--ink); --r:12px; --tap:44px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic UI',sans-serif;
  font-weight:700; overflow:hidden; user-select:none; -webkit-user-select:none;
  display:flex; flex-direction:column;
}
.ic{width:20px; height:20px; flex:none; display:block;}
.bar{
  display:flex; align-items:center; gap:.35rem; flex:none;
  background:var(--main); border-bottom:var(--bd); padding:.35rem .5rem;
  padding-top:calc(.35rem + env(safe-area-inset-top));
}
.bar h1{margin:0 .3rem; font-size:.9rem; white-space:nowrap;}
.bar .grow{flex:1;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.3rem;
  min-height:var(--tap); background:var(--paper); color:var(--ink);
  border:var(--bd); border-radius:var(--r); padding:.35rem .65rem;
  font:inherit; font-size:.76rem; box-shadow:0 3px 0 var(--ink); cursor:pointer; white-space:nowrap;
}
.btn:active{transform:translateY(3px); box-shadow:0 0 0 var(--ink);}
.btn-ic{width:var(--tap); padding:0;}
.btn-g{background:var(--ink); color:var(--main);}
.btn:disabled{opacity:.4;}

.stage{
  flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center; padding:.8rem;
  background-color:var(--cream);
  background-image:radial-gradient(circle,rgba(30,28,20,.13) 1.5px,transparent 1.6px);
  background-size:16px 16px;
}
#cv{max-width:100%; max-height:100%; display:none; border:2px solid var(--ink); box-shadow:0 3px 0 var(--ink);}
#cv.alpha{background-color:#fff; background-image:repeating-conic-gradient(#e8e5d0 0 25%,#fff 0 50%); background-size:16px 16px;}
.empty{
  background:var(--paper); border:var(--bd); border-radius:18px; box-shadow:0 4px 0 var(--ink);
  padding:1.2rem 1.1rem; text-align:center; width:min(100%,22rem);
}
.empty h2{margin:0 0 .3rem; font-size:1.2rem;}
.empty p{margin:0 0 .9rem; font-size:.7rem; font-weight:400; color:var(--ink2); line-height:1.8;}
.empty .btn{width:100%; min-height:52px;}
.stage.over .empty{background:var(--main-soft);}
#busy{position:absolute; top:1rem; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--main);
  border-radius:100px; padding:.25rem .8rem; font-size:.65rem; display:none;}

.dock{
  flex:none; background:var(--paper); border-top:var(--bd); padding:.5rem .7rem;
  padding-bottom:calc(.5rem + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:.45rem; max-height:46vh; overflow-y:auto;
}
.seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:.35rem;}
.seg button{
  min-height:38px; background:var(--paper); border:2px solid var(--ink); border-radius:10px;
  box-shadow:0 2.5px 0 var(--ink); font:inherit; font-size:.66rem; cursor:pointer; color:var(--ink);
  display:flex; align-items:center; justify-content:center; gap:.25rem;
}
.seg button.on{background:var(--main); box-shadow:0 0 0 var(--ink); transform:translateY(2.5px);}
.seg .sw{width:16px; height:16px; border-radius:50%; border:2px solid var(--ink);}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:.2rem .9rem;}
.sl .lab{display:flex; justify-content:space-between; font-size:.6rem; font-weight:400; color:var(--ink2);}
.sl .lab b{font-family:'DotGothic16',monospace; font-weight:400; color:var(--ink);}
.sl.off{opacity:.35; pointer-events:none;}
.rs{position:relative; height:30px; touch-action:none; cursor:ew-resize; min-width:60px;}
.rs-track{position:absolute; left:0; right:0; top:50%; height:10px; margin-top:-5px; background:var(--cream); border:2px solid var(--ink); border-radius:100px; overflow:hidden;}
.rs-fill{position:absolute; left:0; top:0; bottom:0; background:var(--main);}
.rs-knob{position:absolute; top:50%; width:20px; height:24px; margin:-12px 0 0 -10px; background:var(--paper); border:2px solid var(--ink); border-radius:7px; box-shadow:0 2px 0 var(--ink);}
.rs.drag .rs-knob{background:var(--main);}
.lbl{font-size:.62rem; color:var(--ink2); font-weight:400; margin-bottom:-.2rem;}
.toast{
  position:fixed; left:50%; bottom:calc(1.2rem + env(safe-area-inset-bottom)); transform:translateX(-50%);
  background:var(--ink); color:var(--main); border-radius:100px; padding:.45rem 1rem; font-size:.72rem;
  z-index:50; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap;
}
.toast.show{opacity:1;}
@media (min-width:760px){
  .dock{padding-left:max(.7rem,calc(50vw - 320px)); padding-right:max(.7rem,calc(50vw - 320px));}
}
</style>
</head>
<body>

<div class="bar">

  <span class="grow"></span>
  <button class="btn btn-ic" id="bOpen" aria-label="絵を えらぶ"><svg class="ic" viewBox="0 0 24 24" fill="none"><circle cx="7.5" cy="7.5" r="1.5" stroke="currentColor" stroke-width="1.7"/><path d="M2.5 12C2.5 7.52166 2.5 5.28249 3.89124 3.89124C5.28249 2.5 7.52166 2.5 12 2.5C16.4783 2.5 18.7175 2.5 20.1088 3.89124C21.5 5.28249 21.5 7.52166 21.5 12C21.5 16.4783 21.5 18.7175 20.1088 20.1088C18.7175 21.5 16.4783 21.5 12 21.5C7.52166 21.5 5.28249 21.5 3.89124 20.1088C2.5 18.7175 2.5 16.4783 2.5 12Z" stroke="currentColor" stroke-width="1.7"/><path d="M5 21C9.37246 15.775 14.2741 8.88406 21.4975 13.5424" stroke="currentColor" stroke-width="1.7"/></svg></button>

<div class="stage" id="stage">

    <h2>せんが</h2>

    <div class="sl"><div class="lab">拾う 量<b id="vAmount">50</b></div><input type="range" id="sAmount" min="0" max="100" value="50"></div>

<input type="file" id="file" accept="image/*" hidden>

<script>
(() => {
/* 触った だけでは 動かない つまみ（oekaki-kobo/js/rslider.js と 同じ） */

const desc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');

function enhance(inp) {
  if (inp.dataset.rs) return;
  inp.dataset.rs = '1';
  const box = document.createElement('div');
  box.className = 'rs';
  box.innerHTML = '<div class="rs-track"><div class="rs-fill"></div></div><div class="rs-knob"></div>';
  inp.after(box);
  inp.style.display = 'none';
  const num = k => parseFloat(inp[k] || inp.getAttribute(k));
  const paint = () => {
    const min = num('min') || 0, max = isNaN(num('max')) ? 100 : num('max');
    const t = max > min ? (parseFloat(desc.get.call(inp)) - min) / (max - min) : 0;
    const p = Math.max(0, Math.min(1, t)) * 100;
    box.querySelector('.rs-fill').style.width = p + '%';
    box.querySelector('.rs-knob').style.left = `calc(9px + (100% - 18px) * ${p / 100})`;
  };
  Object.defineProperty(inp, 'value', {
    get() { return desc.get.call(this); },
    set(v) { desc.set.call(this, v); paint(); },
  });
  let drag = null;
  box.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    box.setPointerCapture(e.pointerId);
    drag = { x: e.clientX, v: parseFloat(desc.get.call(inp)), moved: false };
    inp.dispatchEvent(new Event('pointerdown'));
  });
  box.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    if (!drag.moved && Math.abs(dx) < 4) return; // ふれただけ なら 動かさない
    drag.moved = true;
    box.classList.add('drag');
    const min = num('min') || 0, max = isNaN(num('max')) ? 100 : num('max');
    const w = Math.max(40, box.clientWidth - 18);
    let v = drag.v + dx / w * (max - min);
    const step = num('step');
    if (step > 0) v = Math.round(v / step) * step;
    v = Math.max(min, Math.min(max, v));
    if (String(v) !== desc.get.call(inp)) {
      desc.set.call(inp, v);
      paint();
      inp.dispatchEvent(new Event('input', { bubbles: true }));
    }
  });
  const up = () => {
    if (!drag) return;
    const moved = drag.moved;
    drag = null;
    box.classList.remove('drag');
    if (moved) inp.dispatchEvent(new Event('change', { bubbles: true }));
  };
  box.addEventListener('pointerup', up);
  box.addEventListener('pointercancel', up);
  new ResizeObserver(paint).observe(box);
  paint();
}

function enhanceAll(root = document) {
  for (const inp of root.querySelectorAll('input[type=range]')) enhance(inp);
}

enhanceAll();

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const P = { screen: 200, white: 80, black: 30, grad: 100, light: 18, darkT: 42, wline: 40, pen: 0, mode: 'pen', width: 30, amount: 50, dark: 50, clean: 30, fill: 0, size: 1600, color: '#000000', bg: 'white' };
let src = null, name = 'senga', gray = null, W = 0, H = 0, outImg = null, srcImg = null;

function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 1800); }

/* ---------- 読みこみ ---------- */
function load(file) {
  if (!file || !file.type.startsWith('image/')) return;
  name = (file.name || 'senga').replace(/\.[^.]+$/, '') + '_senga';
  const img = new Image();
  img.onload = () => { src = img; prepare(); URL.revokeObjectURL(img.src); };
  img.onerror = () => toast('読めない 絵でした');
  img.src = URL.createObjectURL(file);
}
function prepare() {
  const k = Math.min(1, P.size / Math.max(src.naturalWidth, src.naturalHeight));
  W = Math.max(1, Math.round(src.naturalWidth * k)); H = Math.max(1, Math.round(src.naturalHeight * k));
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.drawImage(src, 0, 0, W, H);
  srcImg = x.getImageData(0, 0, W, H);
  const d = srcImg.data; gray = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) gray[i] = (d[i * 4] * .299 + d[i * 4 + 1] * .587 + d[i * 4 + 2] * .114) / 255;
  cv.width = W; cv.height = H; cv.style.display = 'block'; $('empty').style.display = 'none';
  $('bSave').disabled = $('bCmp').disabled = false;
  run();
}

/* ---------- ぼかし（箱ぼかし 3回 ≒ ガウス） ---------- */
function boxPass(a, b, r, w, h) {
  const n = 2 * r + 1;
  for (let y = 0; y < h; y++) {
    const o = y * w; let s = a[o] * (r + 1);
    for (let i = 1; i <= r; i++) s += a[o + Math.min(w - 1, i)];
    for (let x = 0; x < w; x++) {
      b[o + x] = s / n;
      s += a[o + Math.min(w - 1, x + r + 1)] - a[o + Math.max(0, x - r)];
    }
  }
}
function transpose(a, b, w, h) { for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) b[x * h + y] = a[y * w + x]; }
function blur(a, sigma) {
  if (sigma < .3) return a.slice();
  const r = Math.max(1, Math.round(Math.sqrt(12 * sigma * sigma / 3 + 1) / 2 - .5));
  let p = a.slice(), q = new Float32Array(a.length);
  for (let i = 0; i < 3; i++) { boxPass(p, q, r, W, H); [p, q] = [q, p]; }
  transpose(p, q, W, H);
  for (let i = 0; i < 3; i++) { boxPass(q, p, r, H, W); [p, q] = [q, p]; }
  transpose(q, p, H, W);
  return p;
}
const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

/* ---------- 線を 出す。もどりは 0..1 の 線の こさ ---------- */
function lines(mode = P.mode) {
  const scale = Math.max(W, H) / 1024;
  const base = blur(gray, (P.clean / 100) * 2.2 * scale);
  const s = (.6 + P.width / 100 * 3.4) * scale;
  const amt = P.amount / 100, n = W * H, L = new Float32Array(n);
  if (mode === 'pen') {
    // ちがう 大きさの ぼかしの 差（DoG）。暗い 側の ふちだけ 拾う
    const g1 = blur(base, s * .5), g2 = blur(base, s * 1.6);
    const t = .03 - amt * .028, soft = .026 - P.dark / 100 * .021;
    for (let i = 0; i < n; i++) L[i] = smooth(t, t + soft, g2[i] - g1[i]);
  } else if (mode === 'pencil') {
    // 覆い焼き。灰色の なめらかな 線
    const g = blur(base, s * 1.2);
    const gam = 1 + P.dark / 100 * 5, lift = 1 - amt * .12;
    for (let i = 0; i < n; i++) {
      const v = Math.min(1, base[i] / Math.max(1e-3, g[i]) * lift + (1 - lift));
      L[i] = 1 - Math.pow(v, gam);
    }
    const c = .05 * (1 - amt);
    for (let i = 0; i < n; i++) L[i] = Math.max(0, (L[i] - c) / (1 - c));
  } else {
    // Sobel。明るさの かわり目 ぜんぶ
    const g = blur(base, s * .5), gain = 2 + amt * 18, gam = 1.6 - P.dark / 100 * 1.1;
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
      const i = y * W + x;
      const gx = g[i - W + 1] + 2 * g[i + 1] + g[i + W + 1] - g[i - W - 1] - 2 * g[i - 1] - g[i + W - 1];
      const gy = g[i + W - 1] + 2 * g[i + W] + g[i + W + 1] - g[i - W - 1] - 2 * g[i - W] - g[i - W + 1];
      L[i] = Math.pow(Math.min(1, Math.hypot(gx, gy) * gain / 4), gam);
    }
  }
  if (P.fill > 0 && P.mode !== 'manga') {
    const g = blur(base, scale), bp = P.fill / 100 * .45;
    for (let i = 0; i < n; i++) L[i] = Math.max(L[i], smooth(bp + .04, bp - .02, g[i]));
  }
  // 小さな ぽつぽつを 消す。まわりに 線の ない 点は 弱める
  if (P.clean > 0 && mode !== 'pencil') {
    const m = blur(L, 1.5 * scale), k = P.clean / 100 * .35;
    for (let i = 0; i < n; i++) if (m[i] < k) L[i] *= m[i] / k;
  }
  return L;
}

/* ---------- マンガ（線の 選び分け と 網点トーン）
   ComfyUI-MangaScreen の Manga Finish を うつした もの。
   Copyright (c) 2026 ashukae — MIT License https://github.com/ashukae/ComfyUI-MangaScreen ---------- */

// つながった かたまりに 番号を ふる。st は かたまりごとの 幅・高さ・面積
function components(mask, conn8) {
  const n = W * H, lab = new Int32Array(n), stack = new Int32Array(n);
  const st = { w: [0], h: [0], area: [0] };
  let id = 0;
  for (let s0 = 0; s0 < n; s0++) {
    if (!mask[s0] || lab[s0]) continue;
    id++; lab[s0] = id;
    let sp = 0, area = 0, x0 = W, x1 = 0, y0 = H, y1 = 0;
    stack[sp++] = s0;
    while (sp) {
      const i = stack[--sp], x = i % W, y = (i - x) / W;
      area++;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy || (!conn8 && dx && dy)) continue;
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const j = ny * W + nx;
        if (mask[j] && !lab[j]) { lab[j] = id; stack[sp++] = j; }
      }
    }
    st.w.push(x1 - x0 + 1); st.h.push(y1 - y0 + 1); st.area.push(area);
  }
  return { lab, st, count: id + 1 };
}

// 四角の 窓の 合計（はしは のばす）。窓は 2r+1
function boxSum(a, r) {
  const q = new Float32Array(a.length), o = new Float32Array(a.length);
  for (let y = 0; y < H; y++) {
    const b = y * W; let s = 0;
    for (let x = -r; x <= r; x++) s += a[b + Math.min(W - 1, Math.max(0, x))];
    for (let x = 0; x < W; x++) {
      q[b + x] = s;
      s += a[b + Math.min(W - 1, x + r + 1)] - a[b + Math.max(0, x - r)];
    }
  }
  for (let x = 0; x < W; x++) {
    let s = 0;
    for (let y = -r; y <= r; y++) s += q[Math.min(H - 1, Math.max(0, y)) * W + x];
    for (let y = 0; y < H; y++) {
      o[y * W + x] = s;
      s += q[Math.min(H - 1, y + r + 1) * W + x] - q[Math.max(0, y - r) * W + x];
    }
  }
  return o;
}
const odd = v => Math.max(3, Math.round(v) | 1);

// 値の 種類が 少ない ときの メディアン（窓 n）
function medianSmall(level, n, values) {
  const r = n >> 1, half = n * n / 2, out = new Uint8Array(level.length);
  const counts = values.map(v => boxSum(Float32Array.from(level, x => x === v ? 1 : 0), r));
  for (let i = 0; i < level.length; i++) {
    let c = 0;
    for (let k = 0; k < values.length; k++) { c += counts[k][i]; if (c > half) { out[i] = values[k]; break; } }
  }
  return out;
}
function erode(mask, n) {
  const r = n >> 1, s = boxSum(Float32Array.from(mask, v => v ? 1 : 0), r), full = (2 * r + 1) ** 2 - .5;
  return Uint8Array.from(s, v => v > full ? 1 : 0);
}

function manga() {
  const k = W / 1024, n = W * H, L = gray;
  // 線: まわりより 暗く、細長い ものだけ。点や 小さな かたまりは すてる
  const Ls = blur(L, 1.5 * k), Lb = blur(L, .7 * k);
  const solid = Uint8Array.from(Ls, v => v < .22 ? 1 : 0);
  const loc = boxSum(Lb, odd(15 * k) >> 1), a2 = (odd(15 * k)) ** 2;
  const line = new Uint8Array(n);
  for (let i = 0; i < n; i++) line[i] = Lb[i] < loc[i] / a2 - .07 && Lb[i] < .65 ? 1 : 0;
  let cc = components(line, true);
  const keep = new Uint8Array(cc.count);
  for (let c = 1; c < cc.count; c++) {
    const w = cc.st.w[c], h = cc.st.h[c], ar = cc.st.area[c];
    keep[c] = (Math.max(w, h) >= 10 * k && ar >= 12 * k * k && ar < .6 * w * h + 40 * k * k) || ar >= 400 * k * k ? 1 : 0;
  }
  const ink0 = new Uint8Array(n);
  for (let i = 0; i < n; i++) ink0[i] = solid[i] || keep[cc.lab[i]] ? 1 : 0;
  cc = components(ink0, true);
  const ink = new Uint8Array(n);
  for (let i = 0; i < n; i++) ink[i] = cc.lab[i] && cc.st.area[cc.lab[i]] >= 6 * k * k ? 1 : 0;
  const strokes = new Uint8Array(n);
  for (let i = 0; i < n; i++) strokes[i] = ink[i] && !solid[i] ? 1 : 0;
  let pen = null;
  if (P.pen > 0) {
    pen = lines('pen');
    const th = .95 - P.pen / 100 * .8;
    for (let i = 0; i < n; i++) if (pen[i] > th) strokes[i] = 1;
  }

  // 明暗: 線を ぬいて 読む（線の まわりが 暗く ならない）
  const m = Float32Array.from(ink, v => v ? 0 : 1), Lm = new Float32Array(n);
  for (let i = 0; i < n; i++) Lm[i] = L[i] * m[i];
  const A = blur(Lm, 2.5 * k), B = blur(m, 2.5 * k);
  let V = new Float32Array(n);
  for (let i = 0; i < n; i++) V[i] = A[i] / Math.max(B[i], 1e-3);
  V = blur(V, 1.5 * k); // もとは バイラテラル。ここは 軽く ぼかすだけ

  // 4段: 0 白・1 うすい・2 こい・3 ベタ。小さな 島は まわりに とかす
  const white = P.white / 100, black = Math.min(P.black / 100, white - .02), split = (white + black) / 2;
  let level = Uint8Array.from(V, v => v >= white ? 0 : v >= split ? 1 : v >= black ? 2 : 3);
  level = medianSmall(level, odd(11 * k), [0, 1, 2, 3]);
  for (const lv of [1, 2, 3, 0]) {
    const c4 = components(Uint8Array.from(level, v => v === lv ? 1 : 0), false);
    const hole = new Uint8Array(n); let any = false;
    for (let i = 0; i < n; i++) if (c4.lab[i] && c4.st.area[c4.lab[i]] < 600 * k * k) { hole[i] = 1; any = true; }
    if (!any) continue;
    const fill = medianSmall(Uint8Array.from(level, (v, i) => hole[i] ? 255 : v), odd(21 * k), [0, 1, 2, 3, 255]);
    for (let i = 0; i < n; i++) if (hole[i] && fill[i] !== 255) level[i] = fill[i];
  }
  const tones = [0, P.light / 100, P.darkT / 100, 1];
  const cover = Float32Array.from(level, v => tones[v]);

  // グラデトーン: 平らな 面の 中に なめらかな 影が かくれて いれば、暗さに あわせて 点を 大きく
  if (P.grad > 0) {
    const Vs = blur(V, 3 * k), spread = new Float32Array(n);
    for (let lv = 0; lv < 4; lv++) {
      const c4 = components(Uint8Array.from(level, v => v === lv ? 1 : 0), false);
      const cnt = new Float64Array(c4.count), sum = new Float64Array(c4.count), sq = new Float64Array(c4.count);
      for (let i = 0; i < n; i++) { const c = c4.lab[i]; if (c) { cnt[c]++; sum[c] += Vs[i]; sq[c] += Vs[i] * Vs[i]; } }
      for (let i = 0; i < n; i++) {
        const c = c4.lab[i]; if (!c) continue;
        const mu = sum[c] / cnt[c];
        spread[i] = Math.sqrt(Math.max(0, sq[c] / cnt[c] - mu * mu));
      }
    }
    const g = P.grad / 100;
    const a = blur(Float32Array.from(spread, v => Math.min(1, Math.max(0, (v - .03) / .05)) * g), 4 * k);
    for (let i = 0; i < n; i++) {
      const t = Math.min(1, Math.max(0, (white - Vs[i]) / (white - black)));
      cover[i] = cover[i] * (1 - a[i]) + t * a[i];
    }
  }

  // 網点: ページに そろえた 45° の 丸点。3×3 で 取って 丸く する
  const pitch = W / P.screen, ca = Math.SQRT1_2, out = new Float32Array(n);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    if (ink[i] || strokes[i]) { out[i] = 1; continue; }
    const c = cover[i];
    if (c <= 0) continue;
    if (c >= 1) { out[i] = 1; continue; }
    let hit = 0;
    for (let sy = 0; sy < 3; sy++) for (let sx = 0; sx < 3; sx++) {
      const px = x + (sx + .5) / 3, py = y + (sy + .5) / 3;
      const u = (px * ca + py * ca) / pitch, v = (-px * ca + py * ca) / pitch;
      if (1 - (Math.cos(2 * Math.PI * u) + Math.cos(2 * Math.PI * v) + 2) / 4 < c) hit++;
    }
    out[i] = hit > 4 ? 1 : 0;
  }

  // 白ぬき線: ベタの 中の 長い 線を 細く 白で ぬく
  if (P.wline > 0) {
    const beta = erode(Uint8Array.from(level, v => v === 3 ? 1 : 0), odd(3 * k));
    const cand = pen ? Uint8Array.from(pen, v => v > 1 - P.wline / 100 ? 1 : 0) : strokes;
    const cw = components(cand, true), keepW = new Uint8Array(cw.count);
    for (let c = 1; c < cw.count; c++) keepW[c] = Math.max(cw.st.w[c], cw.st.h[c]) >= 40 * k * (1.4 - P.wline / 100) ? 1 : 0;
    const cut = erode(Uint8Array.from(cw.lab, c => keepW[c]), k < 1.6 ? 2 : 3);
    for (let i = 0; i < n; i++) if (beta[i]) out[i] = cut[i] ? 0 : 1;
  }
  return out;
}

function paint() {
  const L = P.mode === 'manga' ? manga() : lines();
  const c = parseInt(P.color.slice(1), 16), r = c >> 16, g = c >> 8 & 255, b = c & 255;
  outImg = ctx.createImageData(W, H);
  const d = outImg.data, clear = P.bg === 'clear';
  for (let i = 0; i < W * H; i++) {
    const a = L[i], j = i * 4;
    if (clear) { d[j] = r; d[j + 1] = g; d[j + 2] = b; d[j + 3] = Math.round(a * 255); }
    else { d[j] = 255 + (r - 255) * a; d[j + 1] = 255 + (g - 255) * a; d[j + 2] = 255 + (b - 255) * a; d[j + 3] = 255; }
  }
  ctx.putImageData(outImg, 0, 0);
  cv.classList.toggle('alpha', clear);
}

let pend = 0;
function run() {
  if (!gray) return;
  $('busy').style.display = 'block';
  cancelAnimationFrame(pend);
  pend = requestAnimationFrame(() => setTimeout(() => { paint(); $('busy').style.display = 'none'; }, 0));
}

/* ---------- 操作 ---------- */
const sliders = { Screen: 'screen', White: 'white', Black: 'black', Grad: 'grad', Light: 'light', DarkT: 'darkT', Wline: 'wline', Pen: 'pen', Width: 'width', Amount: 'amount', Dark: 'dark', Clean: 'clean', Fill: 'fill', Size: 'size' };
for (const [k, key] of Object.entries(sliders)) {
  const s = $('s' + k);
  s.addEventListener('input', () => {
    P[key] = +s.value; $('v' + k).textContent = s.value;
    if (key !== 'size' && P.mode !== 'manga') run();
  });
  // マンガは 重い ので、はなした ときに 計算する
  if (key !== 'size') s.addEventListener('change', () => { if (P.mode === 'manga') run(); });
  if (key === 'size') s.addEventListener('change', () => { if (src) prepare(); });
}
function seg(id, key, after) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    for (const x of $(id).children) x.classList.toggle('on', x === b);
    P[key] = b.dataset.v; after && after(); run();
  });
}
seg('segMode', 'mode', modeUI);
function modeUI() {
  const m = P.mode === 'manga';
  $('gManga').style.display = m ? '' : 'none';
  $('lPenHint').style.display = m ? '' : 'none';
  $('slFill').classList.toggle('off', m);
}
seg('segColor', 'color');
seg('segBg', 'bg');

const pick = () => $('file').click();
$('bOpen').onclick = $('bOpen2').onclick = pick;
$('file').onchange = e => { load(e.target.files[0]); e.target.value = ''; };
const st = $('stage');
st.addEventListener('dragover', e => { e.preventDefault(); st.classList.add('over'); });
st.addEventListener('dragleave', () => st.classList.remove('over'));
st.addEventListener('drop', e => { e.preventDefault(); st.classList.remove('over'); load(e.dataTransfer.files[0]); });
addEventListener('paste', e => {
  for (const it of e.clipboardData.items) if (it.type.startsWith('image/')) { load(it.getAsFile()); break; }
});

const cmp = $('bCmp');
const showSrc = on => { if (!srcImg) return; ctx.putImageData(on ? srcImg : outImg, 0, 0); };
cmp.addEventListener('pointerdown', () => showSrc(true));
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) cmp.addEventListener(ev, () => showSrc(false));

$('bSave').onclick = () => {
  cv.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = name + '.png'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('保存しました');
  }, 'image/png');
};
})();
</script>
