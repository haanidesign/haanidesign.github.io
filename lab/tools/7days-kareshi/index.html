<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>7日間の彼氏 ―うたがいメーター―</title>
<style>
  :root{
    --bg:#eef0f7; --bg2:#dfe3ef; --card:#fff;
    --ink:#252c44; --dim:#7c869e; --rule:#c9cfe0;
    --amber:#e0912c; --rose:#e23b60; --mint:#2fae8e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#c9cee0;color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Yu Gothic",-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:10px}
  #stage{position:relative;display:flex;flex-direction:column;
    width:min(430px,100vw - 10px);height:min(780px,100dvh - 10px);
    background:linear-gradient(180deg,#f6f7fb 0%,var(--bg) 45%,var(--bg2) 100%);
    overflow:hidden;border-radius:8px;box-shadow:0 14px 40px rgba(40,50,80,.28)}

  #hud{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 2px;z-index:5}
  #hearts{display:flex;gap:3px}
  #hearts svg{width:32px;height:30px}
  .hp path{fill:var(--rose)}
  .hp.gone path{fill:none;stroke:var(--rule);stroke-width:5}
  .hp.pop{animation:pop .5s ease-out}
  @keyframes pop{0%{transform:scale(1.5) rotate(-10deg)}60%{transform:scale(.7)}100%{transform:scale(1)}}
  #snd{background:none;border:1px solid var(--rule);color:var(--dim);border-radius:5px;
    width:26px;height:22px;font-size:11px;font-family:inherit;cursor:pointer;padding:0;margin-left:8px}
  #snd.off{opacity:.45;text-decoration:line-through}
  #hudR{text-align:right;font-size:10px;font-weight:800;letter-spacing:2px;color:var(--dim);line-height:1.5}
  #dayTag{color:var(--amber);font-size:11px}

  #art{position:relative;flex:1;min-height:140px;overflow:hidden}
  .room{position:absolute;inset:0;stroke:#cfd5e6;fill:none;stroke-width:1.5}
  /* 立ち絵と SVG 顔は同じ枠に重ねる。PNG が無い間は SVG が出る */
  #charaWrap{position:absolute;left:50%;bottom:-6%;transform:translateX(-50%);height:112%;
    filter:drop-shadow(0 10px 22px rgba(60,70,110,.22));transition:filter .5s}
  #charaWrap.jolt{animation:jolt .35s}
  #chara{height:100%;display:block}
  #portrait{height:100%;display:none;image-rendering:auto}
  @keyframes jolt{0%,100%{transform:translateX(-50%)}50%{transform:translateX(-50%) rotate(1.5deg)}}
  .line{stroke-width:2.4;fill:none;stroke-linecap:round}
  .mark{stroke:var(--rose);stroke-width:3;fill:none;opacity:0}
  .mark.on{opacity:1;animation:blink .7s infinite alternate}
  @keyframes blink{from{opacity:.3}to{opacity:1}}
  .heartmark{fill:#ff87a8;opacity:0}
  .heartmark.on{opacity:.95;animation:float 1.6s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .tear{fill:#6fb6ff;opacity:0}
  .tear.on{opacity:.9;animation:drop 1.4s ease-in infinite}
  @keyframes drop{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(22px);opacity:0}}

  #meter{position:absolute;top:32px;right:14px;width:32px;bottom:12px;z-index:4}
  #meter .label{position:absolute;top:-28px;right:0;font-size:10px;font-weight:800;
    letter-spacing:2px;color:var(--dim);white-space:nowrap}
  #tube{position:absolute;inset:0;border:2px solid var(--rule);border-radius:20px;overflow:hidden;background:#fff}
  #fill{position:absolute;left:0;right:0;bottom:0;height:0%;
    background:linear-gradient(#ff7d9c,#d4224b);transition:height .45s cubic-bezier(.2,.9,.3,1)}
  #fill.hot{background:linear-gradient(#ff9db3,#b8002f);box-shadow:0 0 18px rgba(226,59,96,.6)}
  #meter.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-5px,2px)}50%{transform:translate(4px,-3px)}75%{transform:translate(-3px,-1px)}}

  #moodwrap{position:absolute;top:4px;left:14px;font-size:10px;font-weight:800;letter-spacing:2px;color:var(--dim);z-index:4}
  #moodface{font-size:22px;line-height:1.15}

  #bottom{flex:none;padding:0 14px 12px;z-index:6}
  #name{display:inline-block;background:var(--amber);color:#fff;
    padding:3px 18px;font-size:17px;font-weight:800;letter-spacing:3px;border-radius:4px 4px 0 0}
  #line{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--amber);
    border-radius:0 6px 6px 6px;padding:12px 15px;height:88px;overflow:hidden;display:flex;align-items:center;
    font-size:17px;font-weight:600;line-height:1.55;box-shadow:0 3px 10px rgba(50,60,100,.07)}
  /* 折り返し位置を先に確定させるため、全文を span で組んでから1つずつ見せる。
     #line は flex なので、span を直接入れると各字が flex アイテムになって折り返さない */
  #lineIn{width:100%}
  #choices{display:flex;flex-direction:column;gap:7px;margin-top:9px;height:134px}
  .ch{flex:1;display:flex;align-items:center;background:var(--card);color:var(--ink);border:1px solid var(--rule);
    padding:10px 13px;font-size:14px;font-weight:700;text-align:left;cursor:pointer;
    font-family:inherit;border-radius:6px;transition:.12s;box-shadow:0 2px 6px rgba(50,60,100,.06)}
  .ch:hover{border-color:var(--amber);background:#fffaf1;transform:translateX(3px)}
  .ch:disabled{opacity:.3;cursor:default;transform:none}
  .ch:focus-visible{outline:2px solid var(--mint);outline-offset:2px}

  #timerbar{flex:none;height:5px;background:#d5daea}
  #timerfill{height:100%;width:100%;background:var(--amber);transition:width .1s linear}

  .ov{position:absolute;inset:0;background:rgba(244,246,251,.97);z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:28px;text-align:center;gap:14px}
  .ov.hidden{display:none}
  .ov h1{font-size:25px;margin:0;line-height:1.35;letter-spacing:3px;font-weight:800}
  .ov h1 span{color:var(--rose)}
  .ov h2{font-size:21px;margin:0}
  .ov p{margin:0;font-size:13px;line-height:1.9;font-weight:600;color:#69738d}
  .ov b{color:var(--amber)}
  .btn{background:var(--amber);border:none;color:#fff;padding:13px 32px;
    font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;letter-spacing:3px;
    border-radius:6px;box-shadow:0 4px 12px rgba(224,145,44,.4)}
  .btn:hover{filter:brightness(1.08)}
  .rank{font-size:58px;font-weight:900;letter-spacing:6px;color:var(--amber);line-height:1}
  .rank.bad{color:var(--rose)}
  .dayNo{font-size:12px;font-weight:800;letter-spacing:6px;color:var(--dim)}
  .gimmick{background:#fff;border:1px solid var(--rule);border-radius:8px;padding:12px 16px;
    font-size:13px;font-weight:700;line-height:1.7;max-width:300px}
  .gimmick i{font-style:normal;color:var(--rose)}
  #week,#week2{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;font-size:10px;font-weight:800}
  #week div,#week2 div{padding:4px 7px;border-radius:4px;background:#e3e7f2;color:var(--dim)}
  #week div.done,#week2 div.done{background:var(--mint);color:#fff}
  #week div.now,#week2 div.now{background:var(--amber);color:#fff}
  .flashred{position:absolute;inset:0;background:var(--rose);opacity:0;pointer-events:none;z-index:15}
  .flashred.on{animation:fl .45s}
  @keyframes fl{0%{opacity:.42}100%{opacity:0}}
  @media (max-height:700px){#line{font-size:15px;height:78px}.ch{font-size:13px;padding:8px 11px}#choices{height:118px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="stage">
  <div id="hud">
    <div id="hearts"></div>
    <button id="snd" title="声のオン／オフ">♪</button>
    <div id="hudR"><span id="dayTag"></span><br><span id="turn"></span></div>
  </div>

  <div id="art">
    <svg class="room" viewBox="0 0 430 400" preserveAspectRatio="none">
      <path d="M0 90 H430 M50 90 V400 M380 90 V400"/><rect x="120" y="140" width="190" height="110" rx="4"/>
    </svg>
    <div id="moodwrap">KIGEN<div id="moodface">🙂</div></div>
    <div id="meter"><div class="label">うたがい</div><div id="tube"><div id="fill"></div></div></div>

    <div id="charaWrap">
    <img id="portrait" alt="">
    <svg id="chara" viewBox="0 0 300 300">
      <defs><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#eaeffb"/><stop offset="100%" stop-color="#b3bfda"/>
      </linearGradient></defs>
      <path id="bodyP" fill="url(#skin)" d="M150 62c33 0 50 25 50 54 0 21-9 33-9 43 31 10 62 30 68 60l6 118H35l6-118c6-30 37-50 68-60 0-10-9-22-9-43 0-29 17-54 50-54z"/>
      <path class="line" id="hairBack" d=""/>
      <path class="line" id="face" d="M108 92c0-32 18-52 42-52s42 20 42 52c0 34-16 60-42 60s-42-26-42-60z"/>
      <path class="line" id="bang" d=""/>
      <path class="line" id="accessory" d=""/>
      <path class="line" id="browL" d="M118 82 L140 84"/>
      <path class="line" id="browR" d="M182 82 L160 84"/>
      <ellipse id="eyeL" cx="129" cy="100" rx="9" ry="11"/>
      <ellipse id="eyeR" cx="171" cy="100" rx="9" ry="11"/>
      <path class="line" id="eyeLc" d="M120 100 L138 100" style="display:none"/>
      <path class="line" id="eyeRc" d="M162 100 L180 100" style="display:none"/>
      <path class="line" id="mouth" d="M142 124 Q150 132 158 124"/>
      <g class="mark" id="angerMark"><path d="M196 56 L212 56 M204 48 L204 64 M198 50 L210 62 M210 50 L198 62"/></g>
      <path class="heartmark" id="hm" d="M214 62c-6-10-22-6-22 6 0 10 14 18 22 26 8-8 22-16 22-26 0-12-16-16-22-6z"/>
      <ellipse class="tear" id="tearL" cx="129" cy="114" rx="4" ry="6"/>
      <ellipse class="tear" id="tearR" cx="171" cy="114" rx="4" ry="6"/>
    </svg>
    </div>
  </div>

  <div id="bottom">
    <div id="name">レン</div>
    <div id="line"><div id="lineIn">…ねえ。ちょっと座って。</div></div>
    <div id="choices"></div>
  </div>

  <div id="timerbar"><div id="timerfill"></div></div>
  <div class="flashred" id="flash"></div>

  <div class="ov" id="title">
    <div style="font-size:11px;font-weight:800;letter-spacing:6px;color:#9aa3b8">UTAGAI METER</div>
    <h1>7日間の<span>彼氏</span></h1>
    <p style="font-size:13px;letter-spacing:1px">月曜から日曜まで、毎日ちがう彼氏に会う。<br>
    そして毎日、<b>昨日どこにいたか</b>を聞かれる。</p>
    <button class="btn" id="startBtn">はじめる</button>
    <div style="font-size:10px;color:#7c869e;letter-spacing:2px;margin-top:4px">所要 15〜20分</div>
  </div>

  <div class="ov hidden" id="dayIntro">
    <div class="dayNo" id="diNo"></div>
    <h2 id="diName"></h2>
    <div class="gimmick" id="diGim"></div>
    <div id="week"></div>
    <button class="btn" id="diBtn">会いに行く</button>
  </div>


  <div class="ov hidden" id="weekclear">
    <div id="wc1">
      <h1 style="font-size:23px;letter-spacing:2px">七日間、<br><span>誰にもバレなかった。</span></h1>
      <p style="margin-top:16px">ソラも、シンも、ユウも、タイガも、カナタも、ミナトも——<br>
      全員、笑って「おやすみ」と送ってきた。<br><br>
      <b>乗り切った。</b><br><br>
      そう思って、スマホを置こうとしたとき。</p>
      <button class="btn" id="wcBtn1" style="margin-top:18px">通知を見る</button>
    </div>
    <div id="wc2" style="display:none">
      <div style="font-size:11px;font-weight:800;letter-spacing:4px;color:#8b93ad">1 件のメッセージ</div>
      <div style="background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2);
        border-left:3px solid #e23b60;border-radius:8px;padding:16px 18px;max-width:300px;
        font-size:15px;font-weight:700;line-height:1.8;text-align:left">
        <span style="color:#ff8fa5;font-size:12px;letter-spacing:2px">レン</span><br>
        なあ。今から行っていい？<br>もう、家の前にいるんだけど。
      </div>
      <p style="font-size:12px;color:#9aa3b8">……七日目は、まだ終わっていなかった。</p>
      <button class="btn" id="wcBtn2">出る</button>
    </div>
  </div>

  <div class="ov hidden" id="result">
    <div class="rank" id="rankText"></div>
    <h2 id="resTitle"></h2>
    <p id="resBody"></p>
    <div id="week2"></div>
    <button class="btn" id="retryBtn">月曜からやり直す</button>
  </div>
</div>

<script>
/* ============ 7人の彼女 ============ */
const DAYS = [
{ day:"MON", name:"レン", trait:"王子様系の完璧主義。隙がなく、全部把握している。",
  gim:"基本ルール。<i>チュートリアル役</i>。穏やかだが、逃がしてはくれない。正攻法で崩せ。",
  art:"ren", voice:400,
  timer:12, mult:1, eyeW:8.5, eyeH:10, hair:"#3a4460", eye:"#2a3350", male:true,
  hairBack:"M104 60c-10 18-10 34-6 48M196 60c10 18 10 34 6 48",
  bang:"M100 82c8-30 28-42 50-42s42 12 50 42 M100 82 Q126 62 150 70 Q174 62 200 82",
  acc:"",
  qs:[
   {q:"昨日の夜、連絡つかなかったよね。どこにいたの。", a:[
     {t:"仕事が長引いたの", sets:"work", s:0,m:2, r:"何時まで？ 具体的に聞くよ。"},
     {t:"友達と飲んでたの", sets:"friend", s:4,m:-4, r:"店、人数、会計。三つとも聞くね。"},
     {t:"実家に寄ってたの", sets:"family", s:2,m:0, r:"ご実家、片道1時間だよね。逆算するよ。"}]},
   {q:"何時に出た？", a:[
     {t:"23時すぎ。すぐ帰ったよ", s:2,m:2, r:"じゃあ帰宅は24時前。覚えとくね。"},
     {t:"日付が変わる直前だった", s:8,m:-4, r:"ずいぶん粘ったね。"},
     {t:"…正確には覚えてない", s:24,m:-14, r:"昨日だよ。仕事の数字は覚えてるのに？"}]},
   {q:"俺さ、こう見えて記憶力はいい方なんだ。", a:[
     {t:"…それ、脅し？", s:18,m:-14, r:"脅しに聞こえるなら、心当たりがあるってことだ。"},
     {t:"知ってる。助かってるよ", s:-4,m:12, r:"うん。だから、変な嘘はつかないでね。"},
     {t:"急に何の話？", s:26,m:-18, r:"急じゃないよ。ずっと話してる。"}]},
   {q:"誰と一緒だった？", a:[
     {t:"課長と、経理の佐々木さん", needs:"work", s:0,m:0, r:"あの二人ね。まあ、いるだろうね。"},
     {t:"高校の友達、三人", needs:"friend", s:2,m:0, r:"名前、全員言える？ …いい、信じる。"},
     {t:"お母さんと、妹", needs:"family", s:0,m:4, r:"お母さん、元気だった？"},
     {t:"…一人だったの", s:30,m:-10, r:"一人？ さっきの話と、噛み合わないな。"}]},
   {q:"メッセージ、既読つかなかった。", a:[
     {t:"充電が切れてたの", s:16,m:-6, r:"モバイルバッテリー、いつも持ってるよね。"},
     {t:"バタバタしてて見てなかった", s:8,m:-2, r:"そう。忙しかったんだ。"},
     {t:"ごめん、気づかなかった。悪かったと思ってる", s:-6,m:12, r:"…素直なのは、いいと思う。"}]},
   {q:"上着から、知らない香りがした。", a:[
     {t:"オフィスの芳香剤だと思う", needs:"work", s:2,m:0, r:"そういう匂いの会社なんだ。"},
     {t:"店の煙でしょ", needs:"friend", s:0,m:0, r:"言われてみれば、煙かもね。"},
     {t:"お母さんの柔軟剤", needs:"family", s:0,m:3, r:"ああ、あの匂いか。"},
     {t:"気のせいじゃない？", s:26,m:-16, r:"気のせいで済ませないでほしいな。"}]},
   {q:"何か出せるものある？ それで終わりにするから。", a:[
     {t:"勤怠のスクショ送るよ", needs:"work", s:-14,m:6, r:"…完璧だね。ちょっと悔しい。"},
     {t:"割り勘アプリの履歴がある", needs:"friend", s:-14,m:6, r:"時刻も残ってる。合格。"},
     {t:"改札の履歴、見せようか", needs:"family", s:-14,m:6, r:"時間もぴったり。……わかった。"},
     {t:"いちいち出す方が変でしょ", s:28,m:-16, r:"出せない人が、そう言うんだよ。"}]},
   {q:"俺のこと、重いと思ってる？", a:[
     {t:"思ってない。むしろ楽だよ", s:-8,m:14, r:"…そう。ならいい。"},
     {t:"ちょっとは思う", s:20,m:-22, r:"正直だね。正直だけど、点は引くよ。"},
     {t:"今その話じゃないでしょ", s:22,m:-18, r:"逸らしたね。覚えとく。"}]},
   {q:"その人に、今から確認していい？", a:[
     {t:"いいよ。連絡先送るね", s:-22,m:6, r:"…しない。そこまで言うなら、しない。"},
     {t:"時間が時間だし迷惑でしょ", s:20,m:-10, r:"迷惑って、誰にとって？"},
     {t:"なんでそこまでするの", s:32,m:-24, r:"やましくないなら、止めないでしょ。"}]},
   {q:"最後。俺に隠してること、ある？", a:[
     {t:"ない", s:12,m:0, r:"0.4秒。いつもより返事が遅い。"},
     {t:"ない。疑うなら全部見ていいよ", s:-16,m:14, r:"…見ないよ。今のが、いちばんの答えだ。"},
     {t:"（黙る）", s:40,m:-24, r:"沈黙も、答えのうちだよ。"}]},
  ]},

{ day:"TUE", name:"ソラ", trait:"年下の甘えたがり。拗ねると手がつけられない。",
  gim:"甘え＋泣き落とし。<i>疑いは上がりにくいが機嫌がすぐ落ちる</i>。機嫌が0になると泣き出し、疑いが一気に+30。",
  art:"sora", voice:480,
  timer:12, mult:0.85, cryBomb:true, eyeW:11, eyeH:12.5, hair:"#a8763f", eye:"#6b4a28", male:true,
  hairBack:"M102 62c-10 16-10 28-6 40M198 62c10 16 10 28 6 40",
  bang:"M100 84c8-30 28-42 50-42s42 12 50 42 M114 66 q18 16 36 4 q14 10 26 2",
  acc:"M150 38 q8-18 18-8",
  qs:[
   {q:"ねえってば。昨日、なんで既読つかなかったの。", a:[
     {t:"仕事してたの。ほんとに", sets:"work", s:0,m:-6, r:"えー。仕事と俺、どっちが大事なわけ。"},
     {t:"友達といたの", sets:"friend", s:4,m:-8, r:"ふーん。友達ね。俺は？"},
     {t:"ごめん、寝落ちしてた", sets:"home", s:2,m:4, r:"寝落ち？ かわいいとこあんじゃん。"}]},
   {q:"何時から何時まで。俺、ずっと待ってたんだけど。", a:[
     {t:"21時から23時くらい", s:4,m:0, r:"二時間も。ふーん。"},
     {t:"ごめん。待たせた分、埋め合わせするから", s:-10,m:18, r:"……マジ？ じゃ、許してやる。"},
     {t:"待ってろなんて言ってないでしょ", s:14,m:-30, r:"………は。今の、けっこう効いた。"}]},
   {q:"俺のこと、めんどくさいと思ってるでしょ。", a:[
     {t:"思ってない。かわいいと思ってる", s:-12,m:24, r:"っ……そういうの、ずるいって。"},
     {t:"ちょっとだけ", s:16,m:-32, r:"……ちょっとって。ちょっとって何だよ。"},
     {t:"思うわけないでしょ", s:6,m:8, r:"ふーん。間、あったけど。"}]},
   {q:"誰といたの。名前、教えてよ。", a:[
     {t:"課長と佐々木さん", needs:"work", s:0,m:0, r:"おっさんばっかじゃん。よかった。"},
     {t:"高校の友達", needs:"friend", s:2,m:-2, r:"友達。……女いた？"},
     {t:"一人で寝てたって", needs:"home", s:0,m:4, r:"じゃあ夢に俺出てきた？"},
     {t:"言う必要ある？", s:26,m:-20, r:"…言えないんだ。ふーん。そっか。"}]},
   {q:"俺の誕生日、覚えてる？", a:[
     {t:"覚えてる。来月の12日でしょ", s:-12,m:22, r:"……っ。覚えてんじゃん。ずるい。"},
     {t:"…ごめん、今出てこない", s:10,m:-16, r:"だよね。まあ、そんなもんだよね。"},

/* ---- 立ち絵 ----
   art/<キー>_<表情>.png を機嫌5段階に対応させて出す。
   PNG が1枚でも欠けていれば、その表情だけ従来の SVG 顔にフォールバックする。 */
const ART_DIR="art/";
const EXPR=["angry","annoyed","neutral","smile","happy"];   // 機嫌の低い順
const artOK={};
function preloadArt(d){
  if(!d.art) return;
  EXPR.forEach(e=>{
    const k=d.art+"_"+e;
    if(k in artOK) return;
    artOK[k]=false;
    const im=new Image();
    im.onload=()=>{ artOK[k]=true; drawFace(); };
    im.src=ART_DIR+k+".png";
  });
}
function showPortrait(d,lv,m){
  const key=d.art?d.art+"_"+EXPR[lv]:null, use=!!(key&&artOK[key]);
  const img=$("portrait");
  if(use && !img.src.endsWith(key+".png")) img.src=ART_DIR+key+".png";
  img.style.display=use?"block":"none";
  $("chara").style.display=use?"none":"";
  // 機嫌が低いほど彩度を落とす。poker の日は圧縮後の m を使うので絵からも読めない
  const dull=Math.max(0,Math.min(1,(52-m)/52));
  $("charaWrap").style.filter=
    `drop-shadow(0 10px 22px rgba(60,70,110,.22)) saturate(${(1-.4*dull).toFixed(2)}) contrast(${(1+.25*dull).toFixed(2)})`;
}

/* ---- しゃべり ----
   一文字ずつ出しながら「ポポポ」と鳴らす。制限時間は喋っている間も止めない。
   戻り値は喋り終わるまでの ms。返しの待ち時間はこれを見て決める。 */
let AC=null, sndOn=true, typer=null, fullLine="";
const SPEED=48;                                  // ms / 字
/* 息継ぎ。句点で長く、読点で短く止めると読み上げているように聞こえる */
function pauseAfter(txt){
  const c=txt[txt.length-1];
  if(/[。！？!?]/.test(c)) return 430;
  if(/[…‥]/.test(c))      return 320;
  if(/[、，]/.test(c))     return 210;
  return 0;
}
const SILENT=/[\s、。，．…‥！？!?「」『』（）()\-—～]/;   // この字では鳴らさない
/* AudioContext の生成は数百ms止まる。最初の一文字目で作ると出だしが遅れるので、
   ユーザー操作（はじめる）のタイミングで先に用意しておく */
function primeAudio(){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    // 無音を一度鳴らして出力を起こす。これをやらないと一文字目で数百ms固まる
    const o=AC.createOscillator(), g=AC.createGain();
    g.gain.value=0; o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+0.01);
  }catch(e){}
}
function blip(){
  if(!sndOn || !AC) return;
  try{
    const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.type="square";
    o.frequency.setValueAtTime((D().voice||620)*(0.94+Math.random()*0.12), t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.045,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t+0.055);
  }catch(e){}
}
/* 行頭に来てはいけない字（閉じ括弧・句読点・小書き・長音）は前の字にくっつけ、
   行末に来てはいけない字（開き括弧）は次の字を巻き込む。禁則を span 分割で壊さないため */
const NO_HEAD=/[、。，．・…‥！？!?」』）)】〉》〕｝ぁぃぅぇぉっゃゅょァィゥェォッャュョーヽヾ々〜～]/;
const NO_TAIL=/[「『（(【〈《〔｛]/;
function chunk(t){
  const out=[];
  for(const c of t){
    const prev=out.length?out[out.length-1]:"";
    if(prev && (NO_HEAD.test(c) || NO_TAIL.test(prev.slice(-1)))) out[out.length-1]+=c;
    else out.push(c);
  }
  return out;
}
let spans=[];
function skipTyping(){
  if(!typer) return;
  clearTimeout(typer); typer=null;
  spans.forEach(s=>s.style.visibility="");
}
function say(t){
  clearTimeout(typer); typer=null;
  fullLine=t;
  const el=$("lineIn"); el.textContent="";
  // 先に全文を組んで折り返しを確定させる。以後は visibility を外すだけなので字が動かない
  spans=chunk(t).map(p=>{
    const s=document.createElement("span");
    s.textContent=p; s.style.visibility="hidden";
    el.appendChild(s); return s;
  });
  if(!spans.length) return 0;
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){ skipTyping(); return 0; }
  // 字ごとに間隔が変わるので setInterval ではなく setTimeout を繋ぐ
  const wait=spans.map(s=>SPEED+pauseAfter(s.textContent));
  let i=0;
  const step=()=>{
    const s=spans[i++];
    s.style.visibility="";
    if(!SILENT.test(s.textContent[0])) blip();
    if(i>=spans.length){ typer=null; return; }
    typer=setTimeout(step, wait[i-1]*(0.88+Math.random()*0.24));   // 少しゆらす
  };
  typer=setTimeout(step,0);
  return wait.reduce((a,b)=>a+b,0);
}
$("line").onclick=skipTyping;                    // 押せば全文出る
$("art").onclick=skipTyping;                     // 立ち絵側を押しても同じ
$("snd").onclick=e=>{ sndOn=!sndOn; e.currentTarget.classList.toggle("off",!sndOn); };
function weekStrip(el){
  const base=DAYS.slice(0,7).map((d,i)=>
    `<div class="${i<S.d?'done':i===S.d?'now':''}">${JPDAY[d.day]||d.day}</div>`).join("");
  const ex = S.d>=7 ? `<div class="now">EX</div>` : "";
  el.innerHTML=base+ex;
}

/* ---- 進行 ---- */
function startTimer(){
  const lim=D().timer; S.t=lim; $("timerfill").style.width="100%"; clearInterval(S.timer);
  S.timer=setInterval(()=>{ S.t-=0.1;
    $("timerfill").style.width=Math.max(0,S.t/lim*100)+"%";
    if(S.t<=0){ clearInterval(S.timer); timeout(); } },100);
}
function stopTimer(){ clearInterval(S.timer); }
function timeout(){
  if(S.busy) return; S.busy=true;
  [...document.querySelectorAll(".ch")].forEach(b=>b.disabled=true);
  applyDamage(20,-10,"……なんで黙るの。");
}
function dayIntro(){
  const d=D(); S.i=0; S.susp=0; S.mood=60; S.facts={}; S.mem={}; S.perfect=true; S.cried=false;
  preloadArt(d);
  applyLook(); drawMeter(); drawFace(); drawHearts();
  $("diNo").textContent = d.extra ? "EXTRA" : `DAY ${S.d+1} ／ ${jp(d)}曜日`;
  $("diName").textContent=`${d.name}　—　${d.trait}`;
  $("diGim").style.display="none";
  weekStrip($("week"));
  $("dayIntro").classList.remove("hidden");
}
/* 選択肢は常に3個。4個以上ある設問は
   「今のアリバイに合う答え」+「矛盾するワナ」+「逃げの答え」に絞る */
function pickThree(list){
  if(list.length<=3) return list.slice();
  const ok   = list.filter(o=>o.needs && S.facts[o.needs]);
  const trap = list.filter(o=>o.needs && !S.facts[o.needs]);
  const esc  = list.filter(o=>!o.needs);
  let out=[];
  if(ok.length){
    out.push(ok[0]);
    if(trap.length) out.push(trap[(Math.random()*trap.length)|0]);
    if(esc.length)  out.push(esc[0]);
  }
  // needs構造でない設問（最終日の週アリバイ等）はランダムに3つ
  while(out.length<3){
    const c=list[(Math.random()*list.length)|0];
    if(!out.includes(c)) out.push(c);
  }
  out=out.slice(0,3);
  for(let i=out.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [out[i],out[j]]=[out[j],out[i]]; }
  return out;
}
function ask(){
  const d=D(), q=d.qs[S.i];
  $("turn").textContent=`${S.i+1} / ${d.qs.length}`;
  say(q.q);
  S.shown = pickThree(q.a);
  const box=$("choices"); box.innerHTML="";
  S.shown.forEach((o,idx)=>{
    const b=document.createElement("button");
    b.className="ch"; b.textContent=o.t; b.onclick=()=>answer(idx);
    box.appendChild(b);
  });
  S.busy=false; startTimer();
}
function answer(idx){
  if(S.busy) return; S.busy=true; stopTimer();
  [...document.querySelectorAll(".ch")].forEach(b=>b.disabled=true);
  const d=D(), o=S.shown[idx];

  if(o.needs && !S.facts[o.needs]){
    const base=38*(d.contraBoost||1);
    S.perfect=false;
    applyDamage(base,-18,"待って。それ、さっきの話と繋がってないよね？");
    return;
  }
  if(o.mem){
    const k=o.mem.k, v=o.mem.v;
    if(S.mem[k]===undefined){ S.mem[k]=v; }
    else if(S.mem[k]!==v){
      S.perfect=false;
      applyDamage(42,-24,"あれ？ さっきと違うこと言ってるよ。俺、覚えてるからね。");
      if(o.sets) S.facts[o.sets]=true;
      return;
    }
  }
  if(d.finale && o.week && S.used[o.week]){
    S.perfect=false;
    applyDamage(34,-20,`それ、今週もう聞いた。`);
    if(o.sets) S.facts[o.sets]=true;
    return;
  }
  if(o.sets) S.facts[o.sets]=true;
  if(o.week) S.used[o.week]=true;

  let mult=d.mult;
  if(d.moodBite) mult *= S.mood<30?1.8 : S.mood<55?1.35 : 1;
  else mult *= S.mood<35?1.4 : S.mood<60?1.15 : 1;
  applyDamage(o.s>0?Math.round(o.s*mult):o.s, o.m, o.r);
}
function applyDamage(susp,mood,reply){
  const d=D();
  S.susp=Math.max(0,S.susp+susp);
  S.mood=Math.max(0,Math.min(100,S.mood+mood));
  if(d.cryBomb && S.mood<=12 && !S.cried){    // 泣かせると一気に詰む（その日1回だけ）
    S.mood=0; S.susp+=30; S.cried=true;
  }
  drawMeter(); drawFace();
  if(susp>=15){
    S.perfect=false;
    $("meter").classList.add("shake"); $("charaWrap").classList.add("jolt");
    setTimeout(()=>{$("meter").classList.remove("shake");$("charaWrap").classList.remove("jolt");},420);
  }
  const dur=say(reply);
  [...document.querySelectorAll(".ch")].forEach(b=>b.style.visibility="hidden");
  $("timerfill").style.width="0%";
  setTimeout(()=>{ if(S.susp>=100){ breakHeart(); return; } next(); },dur+600);
}
function breakHeart(){
  S.hearts--; S.perfect=false;
  $("flash").classList.add("on"); setTimeout(()=>$("flash").classList.remove("on"),460);
  drawHearts(S.hearts);
  if(S.hearts<=0){ end(false); return; }
  S.susp=62; S.mood=Math.max(0,S.mood-12); drawMeter(); drawFace();
  const dur=say("……もういい。一回、深呼吸して。最初から聞き直すから。");
  setTimeout(next,dur+600);
}
function next(){
  S.i++;
  if(S.i>=D().qs.length){ dayClear(); return; }
  ask();
}
function dayClear(){
  stopTimer();
  const d=D();
  S.log.push({day:d.day,name:d.name,susp:Math.round(S.susp),perfect:S.perfect});
  let msg=`${d.name}は、それ以上聞かなかった。`;
  if(S.perfect && S.hearts<3){ S.hearts++; drawHearts(S.hearts-1);
    msg+=`\n（無傷で切り抜けた。ハートが1つ戻った）`; }
  else if(S.perfect){ msg+=`\n（無傷で切り抜けた）`; }
  const dur=say(msg); $("choices").innerHTML="";
  setTimeout(()=>{
    S.d++;
    if(S.d===7){ weekClear(); return; }
    if(S.d>=DAYS.length){ end(true); return; }
    dayIntro();
  },dur+1300);
}
function weekClear(){
  stopTimer(); $("choices").innerHTML=""; $("turn").textContent="";
  $("wc1").style.display=""; $("wc2").style.display="none";
  $("weekclear").classList.remove("hidden");
}
$("wcBtn1").onclick=()=>{ $("wc1").style.display="none"; $("wc2").style.display=""; };
$("wcBtn2").onclick=()=>{ $("weekclear").classList.add("hidden"); dayIntro(); };

function end(cleared){
  stopTimer(); $("choices").innerHTML=""; $("turn").textContent="";
  $("result").classList.remove("hidden");
  const rk=$("rankText"); rk.classList.remove("bad");
  weekStrip($("week2"));
  if(!cleared){
    rk.textContent="OUT"; rk.classList.add("bad");
    $("resTitle").textContent = DAYS[S.d].extra ? "最終戦、終了。" : `${jp(DAYS[S.d])}曜、終了。`;
    $("resBody").innerHTML=`${DAYS[S.d].name}に、全部バレた。<br>連絡先は、その日のうちに全員に回った。<br><br>「嘘が下手なところだけは、好きだったよ」<br><br><span style="color:#9aa3b8">${DAYS[S.d].extra?"EXTRA 到達":"到達 DAY "+(S.d+1)+" ／ 7"}</span>`;
    return;
  }
  const perfects=S.log.filter(l=>l.perfect).length;
  const avg=Math.round(S.log.reduce((a,b)=>a+b.susp,0)/S.log.length);
  let rank,title,body;
  if(perfects>=6 && S.hearts===3){
    rank="S"; title="八日間、無傷";
    body="誰にも、何も、悟らせなかった。<br>最後の夜、七つの通知が同時に鳴った。<br>全部「おやすみ」だった。<br><br>……あなたは、それでいいのか？";
  } else if(perfects>=4){
    rank="A"; title="週を越えた";
    body="全員が「まあ、いいや」と言った。<br>その“まあ”は、七つ分たまっている。<br><br>来週も、月曜は来る。";
  } else if(perfects>=2){
    rank="B"; title="足はついた";
    body="全員が、一度は言葉に詰まったのを見ている。<br>誰も追及しなかっただけで、忘れてはいない。<br><br>次に何か一つでも噛み合わなければ、そこで終わる。";
  } else {
    rank="C"; title="かろうじて最終日";
    body="ハートは残った。信用は、どこにも残っていない。<br>七人とも、まだ何も言っていないだけ。";
  }
  rk.textContent=rank; $("resTitle").textContent=title;
  $("resBody").innerHTML=body+`<br><br><span style="color:#9aa3b8">残ハート ${S.hearts} ／ 無傷の日 ${perfects}/8 ／ 平均うたがい ${avg}</span>`;
}

function reset(){
  Object.assign(S,{hearts:3,susp:0,mood:60,d:0,i:0,facts:{},used:{},mem:{},shown:[],t:12,busy:false,perfect:true,cried:false,log:[]});
  applyLook(); drawHearts(); drawMeter(); drawFace();
}
$("startBtn").onclick=()=>{ primeAudio(); $("title").classList.add("hidden"); reset(); dayIntro(); };
$("diBtn").onclick=()=>{ $("dayIntro").classList.add("hidden"); ask(); };
$("retryBtn").onclick=()=>{ $("result").classList.add("hidden"); reset(); dayIntro(); };
reset();
</script>
