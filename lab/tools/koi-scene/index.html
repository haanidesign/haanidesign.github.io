<!-- 恋愛ゲーム画面メーカー / はぁにデザイン -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>恋愛ゲーム画面メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfaec; --card:#fffef7; --ink:#1e1c14; --muted:#8a8470;
  --pop:#e1dd60; --danger:#f2545b; --line:#e7e3ce;
  --sh:0 3px 0 var(--ink); --sh2:0 5px 0 var(--ink);
  --dots:radial-gradient(circle, rgba(255,255,255,.95) 1.7px, rgba(0,0,0,0) 1.8px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI",sans-serif;
  font-weight:700;display:flex;align-items:center;justify-content:center;padding:8px}
button,input,select,textarea{font:inherit;color:inherit}

#app{position:relative;display:flex;flex-direction:column;
  width:min(430px,100vw - 8px);height:min(860px,100dvh - 8px);
  background:var(--card);overflow:hidden;
  border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--ink)}

/* ---- 上バー ---- */
#bar{display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--pop);border-bottom:2.5px solid var(--ink);flex:none}
#bar h1{margin:0;font-size:14px;letter-spacing:.5px;flex:1;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tab{font-family:"DotGothic16",monospace;font-size:12px;letter-spacing:1px;
  background:var(--card);border:2.5px solid var(--ink);border-radius:100px;
  padding:4px 12px;box-shadow:var(--sh);cursor:pointer}
.tab.on{background:var(--ink);color:var(--pop);box-shadow:none;transform:translateY(3px)}

/* ================= さいせい画面 ================= */
#play{position:relative;flex:1;min-height:0;display:none;background:#000;overflow:hidden}
#play.on{display:block}
#bgImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#chImg{position:absolute;bottom:0;height:88%;width:auto;max-width:none;object-fit:contain;
  object-position:center bottom;transition:left .35s cubic-bezier(.3,1.4,.5,1),opacity .3s;
  transform:translateX(-50%);left:50%;filter:drop-shadow(0 0 10px rgba(0,0,0,.25))}
#chImg.in{animation:pin .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes pin{from{transform:translateX(-50%) translateY(14px) scale(.98);opacity:0}
  to{transform:translateX(-50%) translateY(0) scale(1);opacity:1}}
#veil{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;
  transition:opacity .22s}

/* セリフ窓 */
#win{position:absolute;left:10px;right:10px;bottom:10px;
  background:rgba(255,254,247,.96);background-image:var(--dots);background-size:14px 14px;
  border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);
  padding:16px 14px 14px;min-height:150px;display:flex;flex-direction:column}
#nameTag{position:absolute;top:-15px;left:14px;background:var(--pop);
  border:2.5px solid var(--ink);border-radius:100px;padding:2px 14px;
  font-size:14px;box-shadow:0 3px 0 var(--ink);max-width:70%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nameTag:empty{display:none}
#body{flex:1;font-size:16px;line-height:1.75;letter-spacing:.3px;
  white-space:pre-wrap;overflow:hidden}
#caret{position:absolute;right:12px;bottom:8px;font-size:13px;opacity:0;
  font-family:"DotGothic16",monospace}
#caret.on{opacity:1;animation:bob .9s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
#playTools{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:5px;z-index:6;
  justify-content:flex-end}
.mini{font-family:"DotGothic16",monospace;font-size:10px;letter-spacing:0;background:var(--card);
  border:2.5px solid var(--ink);border-radius:100px;padding:3px 7px;box-shadow:var(--sh);
  cursor:pointer;white-space:nowrap;flex:none}
.mini.off{background:rgba(255,254,247,.55);color:var(--muted)}
.mini:active{box-shadow:none;transform:translateY(3px)}
#toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.9);
  background:var(--ink);color:var(--pop);border-radius:100px;padding:8px 20px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* セリフとキャラと背景だけにする */
#app.clean #bar,#app.clean #playTools{display:none}

/* びっくり効果（キャラだけ動く） */
#chImg{transform-origin:50% 100%}
#chImg.fxJolt{animation:fxJolt .42s cubic-bezier(.2,1.6,.4,1)}
@keyframes fxJolt{
  0%{transform:translateX(-50%)}
  12%{transform:translateX(-50%) translateY(-14px) scale(1.04)}
  30%{transform:translateX(-50%) translateY(2px) scale(.99)}
  46%{transform:translateX(-50%) translateY(-4px) scale(1.01)}
  62%{transform:translateX(-50%) translateY(1px)}
  100%{transform:translateX(-50%)}}
#chImg.fxShake{animation:fxShake .55s linear}
@keyframes fxShake{
  0%,100%{transform:translateX(-50%)}
  10%{transform:translateX(-50%) translate(-5px,1px)}
  25%{transform:translateX(-50%) translate(5px,-1px)}
  40%{transform:translateX(-50%) translate(-4px,-1px)}
  55%{transform:translateX(-50%) translate(4px,1px)}
  70%{transform:translateX(-50%) translate(-3px,0)}
  85%{transform:translateX(-50%) translate(3px,0)}}

/* いち合わせ */
#app.placing #win,#app.placing #playTools{display:none}
#placeBar{position:absolute;left:10px;right:10px;bottom:10px;z-index:7;display:none;
  background:var(--card);border:2.5px solid var(--ink);border-radius:14px;
  box-shadow:0 4px 0 var(--ink);padding:10px 12px}
#app.placing #placeBar{display:block}
#placeBar .row{gap:8px}
#placeHint{font-size:11px;color:var(--muted);font-weight:500;line-height:1.6;margin:0 0 6px}
#app.placing #chImg{outline:3px dashed rgba(242,84,91,.9);outline-offset:2px;
  transition:none;cursor:move}

/* 書き出しオーバーレイ */
#expOv{position:absolute;inset:0;background:rgba(30,28,20,.86);z-index:20;
  display:none;align-items:center;justify-content:center;padding:16px}
#expOv.on{display:flex}
.expBox{width:100%;max-width:330px;background:var(--card);border:2.5px solid var(--ink);
  border-radius:14px;box-shadow:0 5px 0 #000;padding:12px;text-align:center}
#expCv,#expVid{max-width:100%;max-height:44vh;width:auto;margin:0 auto;
  border:2.5px solid var(--ink);border-radius:10px;background:#000;display:block}
#expVid{display:none}
#expDl{display:block;margin-bottom:8px}
#expBar{height:16px;border:2.5px solid var(--ink);border-radius:100px;background:#fff;
  overflow:hidden;margin:12px 0 8px}
#expBar i{display:block;height:100%;width:0;background:var(--danger)}
#expMsg{font-size:13px;line-height:1.6;margin-bottom:10px}
#emptyNote{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  color:#fff;font-size:14px;text-align:center;padding:24px;line-height:2}

/* ================= へんしゅう画面 ================= */
#edit{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:none;padding:12px 10px 20px;background:var(--bg);
  background-image:var(--dots);background-size:14px 14px}
#edit.on{display:block}
.sec{background:var(--card);border:2.5px solid var(--ink);border-radius:14px;
  box-shadow:var(--sh);padding:10px;margin-bottom:12px}
.sec>h2{margin:0 0 8px;font-size:12px;font-family:"DotGothic16",monospace;letter-spacing:1px;
  display:flex;align-items:center;gap:6px}
.sec>h2::before{content:"";width:10px;height:10px;background:var(--pop);
  border:2px solid var(--ink);border-radius:3px}
label.f{display:block;font-size:11px;color:var(--muted);margin:8px 0 3px;
  font-family:"DotGothic16",monospace;letter-spacing:1px}
input[type=text],select,textarea{width:100%;background:#fff;border:2.5px solid var(--ink);
  border-radius:10px;padding:8px 10px;font-size:15px;outline:none}
textarea{resize:vertical;min-height:88px;line-height:1.7}
input[type=text]:focus,textarea:focus,select:focus{box-shadow:0 0 0 3px rgba(225,221,96,.9)}
.btn{background:var(--pop);border:2.5px solid var(--ink);border-radius:10px;
  padding:8px 14px;box-shadow:var(--sh);cursor:pointer;font-size:14px}
.btn:active{box-shadow:none;transform:translateY(3px)}
.btn.g{background:var(--card)}
.btn.r{background:var(--danger);color:#fff}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 0;min-width:0}

/* シーンカード */
.card{border:2.5px solid var(--ink);border-radius:12px;background:var(--card);
  box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.card.cur{box-shadow:0 3px 0 var(--ink),0 0 0 3px var(--pop)}
.chead{display:flex;align-items:center;gap:6px;padding:6px 8px;
  background:var(--pop);border-bottom:2.5px solid var(--ink)}
.no{font-family:"DotGothic16",monospace;font-size:11px;background:var(--ink);
  color:var(--pop);border-radius:100px;padding:2px 8px;flex:none}
.chead .who{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:30px;height:28px;line-height:1;background:var(--card);border:2.5px solid var(--ink);
  border-radius:8px;box-shadow:0 2px 0 var(--ink);cursor:pointer;font-size:14px;padding:0;flex:none}
.ico:active{box-shadow:none;transform:translateY(2px)}
.cbody{padding:8px 10px 12px;display:none}
.card.open .cbody{display:block}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px}
.th{position:relative;flex:none;width:62px;height:62px;border:2.5px solid var(--ink);
  border-radius:10px;overflow:hidden;background:#fff;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.sel{outline:3px solid var(--danger);outline-offset:-3px}
.th .x{position:absolute;top:-1px;right:-1px;background:var(--danger);color:#fff;
  font-size:10px;line-height:1;padding:3px 4px;border-radius:0 0 0 8px}
.th .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(30,28,20,.72);color:#fff;
  font-size:9px;font-family:"DotGothic16",monospace;text-align:center;padding:1px;
  white-space:nowrap;overflow:hidden}
.th.none{display:flex;align-items:center;justify-content:center;font-size:10px;
  font-family:"DotGothic16",monospace;color:var(--muted);text-align:center;padding:2px}
.seg{display:flex;border:2.5px solid var(--ink);border-radius:10px;overflow:hidden;
  box-shadow:var(--sh);width:100%}
.seg button{flex:1;background:var(--card);border:0;border-right:2.5px solid var(--ink);
  padding:7px 0;font-size:13px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--pop)}
.hint{font-size:11px;color:var(--muted);line-height:1.7;margin:6px 0 0;font-weight:500}
#fab{padding:8px 10px;background:var(--card);border-top:2.5px solid var(--ink);
  display:none;gap:8px;flex:none}
#fab.on{display:flex}
input[type=file]{display:none}
input[type=range]{width:100%;accent-color:var(--danger)}
</style>

<div id="app">
  <div id="bar">
    <h1>恋愛ゲーム画面メーカー</h1>
    <button class="tab" id="tabEdit">つくる</button>
    <button class="tab on" id="tabPlay">みる</button>
  </div>

  <!-- ============ さいせい ============ -->
  <div id="play" class="on">
    <img id="bgImg" alt="">
    <img id="chImg" alt="">
    <div id="veil"></div>
    <div id="playTools">
      <button class="mini" id="btnSnd">おと</button>
      <button class="mini" id="btnAuto">オート</button>
      <button class="mini" id="btnMark">しおり</button>
      <button class="mini" id="btnResume" style="display:none">つづき</button>
      <button class="mini" id="btnFirst">さいしょ</button>
      <button class="mini" id="btnPlace">いち</button>
      <button class="mini" id="btnClean">がめんだけ</button>
    </div>
    <div id="placeBar">
      <p id="placeHint">キャラを指でドラッグ／2本指でおおきさ。ここのスライダーでも変えられます。</p>
      <input type="range" id="placeSize" min="40" max="300" step="2">
      <div class="row" style="margin-top:8px">
        <button class="btn g" id="placeL">ひだり</button>
        <button class="btn g" id="placeC">まんなか</button>
        <button class="btn g" id="placeR">みぎ</button>
        <button class="btn grow" id="placeOk">できた</button>
      </div>
    </div>
    <div id="toast"></div>
    <div id="emptyNote">「つくる」からセリフを<br>入れてください</div>
    <div id="win">
      <div id="nameTag"></div>
      <div id="body"></div>
      <div id="caret">▼</div>
    </div>
  </div>

  <!-- ============ へんしゅう ============ -->
  <div id="edit">
    <div class="sec">
      <h2>そざい</h2>
      <label class="f">はいけい（さいしょの5つは見本）</label>
      <div class="thumbs" id="bgList"></div>
      <label class="f">キャラ（背景ぬきPNG推奨）</label>
      <div class="thumbs" id="chList"></div>
      <div class="row" style="margin-top:8px">
        <button class="btn" id="addBg">＋ はいけい</button>
        <button class="btn" id="addCh">＋ キャラ</button>
      </div>
      <p class="hint">画像はこの端末の中だけに保存されます。サムネ右上の「×」で削除。</p>
    </div>

    <div class="sec">
      <h2>せってい</h2>
      <label class="f">もじの出るはやさ <span id="spdV"></span></label>
      <input type="range" id="spd" min="0" max="120" step="5">
      <label class="f">1ページの文字数（じどう改ページ） <span id="ppcV"></span></label>
      <input type="range" id="ppc" min="30" max="200" step="5">
      <label class="f">文字が出るときの音</label>
      <div class="seg" id="segSnd"><button data-s="1">ぽぽぽ鳴らす</button><button data-s="0">しずかに</button></div>
      <label class="f">ぽぽぽの高さ（きほん） <span id="pitV"></span></label>
      <div class="seg" id="segPitch"><button data-p="1">とても低い</button><button data-p="2">低い</button><button data-p="3">ふつう</button><button data-p="4">高い</button><button data-p="5">とても高い</button></div>
      <label class="f">どうが</label>
      <button class="btn" id="btnExport" style="width:100%">🎬 MP4で書き出す</button>
      <p class="hint">720×1280のたて動画。最初から最後まで、実際に流れる時間そのままで録ります。
        書き出しちゅうは画面を閉じないでください。MP4に対応していない端末ではWebMになります。</p>
      <div class="row" style="margin-top:12px">
        <button class="btn r" id="clearAll">ぜんぶ消す</button>
      </div>
    </div>

    <div class="sec">
      <h2>セリフ</h2>
      <div id="scenes"></div>
      <button class="btn" id="addScene" style="width:100%">＋ セリフを追加</button>
    </div>
  </div>

  <div id="fab">
    <button class="btn grow" id="goPlay">▶ さいしょから見る</button>
  </div>

  <div id="expOv">
    <div class="expBox">
      <canvas id="expCv" width="720" height="1280"></canvas>
      <video id="expVid" controls playsinline></video>
      <div id="expBar"><i></i></div>
      <div id="expMsg"></div>
      <a id="expDl" class="btn" style="display:none;text-decoration:none;color:inherit">⬇ 保存する</a>
      <button class="btn r" id="expStop">やめる</button>
    </div>
  </div>
</div>

<input type="file" id="fileBg" accept="image/*" multiple>
<input type="file" id="fileCh" accept="image/*" multiple>

<script>
var $=function(s){return document.querySelector(s)};
var KEY='koi_scene_v1';
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}

/* ---------- 見本の背景（SVG） ---------- */
var PRESETS=[
 {id:'p_class',   name:'きょうしつ',    src:'bg/classroom_day.jpg'},
 {id:'p_class_e', name:'放課後',        src:'bg/classroom_dusk.jpg'},
 {id:'p_hall',    name:'ろうか',        src:'bg/hallway.jpg'},
 {id:'p_roof',    name:'おくじょう',    src:'bg/rooftop.jpg'},
 {id:'p_room',    name:'自分のへや',    src:'bg/my_room.jpg'},
 {id:'p_room2',   name:'彼女のへや',    src:'bg/her_room.jpg'},
 {id:'p_park',    name:'こうえん',      src:'bg/park.jpg'},
 {id:'p_night',   name:'夜のまち',      src:'bg/night_street.jpg'},
 {id:'p_castle',  name:'おしろ',        src:'bg/castle_hall.jpg'},
 {id:'p_inn',     name:'やどや',        src:'bg/inn.jpg'},
 {id:'p_forest',  name:'もりのみち',    src:'bg/forest_path.jpg'},
 {id:'p_magic',   name:'魔法学院',      src:'bg/magic_class.jpg'},
 {id:'p_hill',    name:'星のおか',      src:'bg/night_hill.jpg'}
];

/* ---------- 状態 ---------- */
var S={bgs:[],chs:[],scenes:[],cfg:{spd:35,ppc:90,snd:1}};

/* ---------- 「ぽ」の音 ---------- */
var AC=null,recDest=null;
function ac(){
  if(!AC){var C=window.AudioContext||window.webkitAudioContext; if(!C)return null; AC=new C()}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
/* こえの高さ 1..5（3がふつう） */
var PITCH=[0,430,560,720,920,1180];
function voiceOf(sc){
  var v=(sc&&sc.v)?sc.v:0;
  return PITCH[v||S.cfg.pitch||3];
}
function po(base){
  if(!S.cfg.snd)return;
  try{
    if(!ac())return;
    base=base||PITCH[S.cfg.pitch||3];
    var t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.type='triangle';
    o.frequency.setValueAtTime(base*(1.04+Math.random()*.14),t);
    o.frequency.exponentialRampToValueAtTime(base*.6,t+.075);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(.11,t+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t+.09);
    o.connect(g); g.connect(AC.destination);
    if(recDest)g.connect(recDest);
    o.start(t); o.stop(t+.1);
  }catch(e){}
}
function mkScene(n,t){return{id:uid(),name:n||'',text:t||'',bg:'',ch:'',x:.5,y:0,s:1,fx:''}}
function fixScene(sc){
  if(sc.x==null)sc.x=(sc.pos==='l')?.27:(sc.pos==='r')?.73:.5;
  if(sc.y==null)sc.y=0; if(sc.s==null)sc.s=1; if(sc.fx==null)sc.fx='';
  return sc;
}
function allBgs(){return PRESETS.concat(S.bgs)}
function findBg(id){var a=allBgs();for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function findCh(id){for(var i=0;i<S.chs.length;i++)if(S.chs[i].id===id)return S.chs[i];return null}
function load(){
  try{var j=JSON.parse(localStorage.getItem(KEY));
      if(j){S.bgs=j.bgs||[];S.chs=j.chs||[];S.scenes=j.scenes||[];S.cfg=j.cfg||S.cfg;}}catch(e){}
  S.cfg={spd:(S.cfg&&S.cfg.spd!=null)?S.cfg.spd:35,ppc:(S.cfg&&S.cfg.ppc)||90,
         snd:(S.cfg&&S.cfg.snd!=null)?S.cfg.snd:1,pitch:(S.cfg&&S.cfg.pitch)||3};
  S.scenes.forEach(fixScene);
  if(!S.scenes.length){
    S.scenes=[mkScene('ひなた','ねえ、ちょっとだけ……時間ある？\nどうしても、伝えたいことがあって。'),
              mkScene('','うつむいたまま、彼女はスカートのすそをぎゅっと握った。')];
    S.scenes[0].bg='p_class';
  }
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}
  catch(e){alert('保存できませんでした。画像がおおすぎるかもしれません。')}}

/* ---------- 画像とりこみ（縮小してWebP化） ---------- */
function importFiles(files,kind,done){
  var left=files.length; if(!left)return;
  Array.prototype.forEach.call(files,function(f){
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var max=(kind==='bg')?1280:1100;
        var s=Math.min(1,max/Math.max(im.width,im.height));
        var c=document.createElement('canvas');
        c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        var src=c.toDataURL('image/webp',.86);
        if(src.indexOf('data:image/webp')!==0)src=c.toDataURL('image/png');

var idx=0,pages=[],page=0,typing=null,auto=false,autoT=null;

function splitPages(text,n){
  var out=[],paras=String(text||'').split(/\n{2,}/);
  paras.forEach(function(p){
    var rest=p;
    while(rest.length>n){
      var cut=n,seg=rest.slice(0,n+1);
      var m=Math.max(seg.lastIndexOf('。'),seg.lastIndexOf('、'),seg.lastIndexOf('\n'),
                     seg.lastIndexOf('！'),seg.lastIndexOf('？'));
      if(m>n*0.45)cut=m+1;
      out.push(rest.slice(0,cut).replace(/^\n+|\s+$/g,''));
      rest=rest.slice(cut);
    }
    if(rest.replace(/\s/g,''))out.push(rest.replace(/^\n+|\s+$/g,''));
  });
  return out.length?out:[''];
}

var CV=$('#expCv'),CX=CV.getContext('2d'),VW=430,VH=764,SCALE=CV.width/VW;
var exporting=false,recorder=null,recTimer=null;

function rr(x,y,w,h,r){
  if(CX.roundRect){CX.beginPath();CX.roundRect(x,y,w,h,r);return}
  CX.beginPath();CX.moveTo(x+r,y);CX.arcTo(x+w,y,x+w,y+h,r);CX.arcTo(x+w,y+h,x,y+h,r);
  CX.arcTo(x,y+h,x,y,r);CX.arcTo(x,y,x+w,y,r);CX.closePath();
}
function cover(im,x,y,w,h){
  if(!im||!im.width)return;
  var s=Math.max(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;
  CX.save();CX.beginPath();CX.rect(x,y,w,h);CX.clip();
  CX.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh);CX.restore();
}
function wrapLines(text,maxW){
  var lines=[],cur='';
  for(var i=0;i<text.length;i++){
    var c=text.charAt(i);
    if(c==='\n'){lines.push(cur);cur='';continue}
    if(cur&&CX.measureText(cur+c).width>maxW){lines.push(cur);cur=c}else cur+=c;
  }
  lines.push(cur);return lines;
}
var FONT='"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif';

/* 効果のずれ（0..1 の進み具合） */
function fxOffset(fx,p){
  if(!fx||p<0||p>1)return[0,0,1];
  if(fx==='shake'){var a=(1-p)*4;return[Math.sin(p*Math.PI*10)*a,Math.sin(p*Math.PI*13)*a*.4,1]}
  if(p<.12)return[0,-14*(p/.12),1+.04*(p/.12)];
  var q=(p-.12)/.88;
  return[Math.sin(q*Math.PI*4)*4*(1-q),3*(1-q)*Math.cos(q*Math.PI*3),1+.025*(1-q)*0.4];
}
function paint(sc,bgIm,chIm,lines,shown,total,veilA,fx,fp){
  CX.setTransform(SCALE,0,0,SCALE,0,0);
  CX.clearRect(0,0,VW,VH);
  CX.fillStyle='#000';CX.fillRect(0,0,VW,VH);
  cover(bgIm,0,0,VW,VH);
  if(chIm&&chIm.width){
    var o=fxOffset(fx,fp);
    var h=VH*0.88*(sc.s==null?1:sc.s),w=chIm.width*(h/chIm.height);
    var cx=VW*(sc.x==null?.5:sc.x),by=VH-h-VH*(sc.y||0);
    CX.save();
    CX.translate(cx+o[0],by+h+o[1]);CX.scale(o[2],o[2]);CX.translate(-cx,-(by+h));
    CX.drawImage(chIm,cx-w/2,by,w,h);
    CX.restore();
  }
  if(veilA>0){CX.fillStyle='rgba(0,0,0,'+veilA+')';CX.fillRect(0,0,VW,VH)}

  CX.font='700 16px '+FONT;
  var padT=16,padB=14,lh=28;
  var winH=Math.max(150,padT+lines.length*lh+padB);
  var wx=10,ww=VW-20,wy=VH-10-winH;
  CX.fillStyle='rgba(255,254,247,.96)';rr(wx,wy,ww,winH,14);CX.fill();
  CX.lineWidth=2.5;CX.strokeStyle='#1e1c14';CX.stroke();

  if(sc.name){
    CX.font='700 14px '+FONT;
    var tw=CX.measureText(sc.name).width,nw=tw+28;
    CX.fillStyle='#e1dd60';rr(wx+14,wy-15,nw,26,13);CX.fill();CX.stroke();
    CX.fillStyle='#1e1c14';CX.textBaseline='middle';CX.textAlign='left';
    CX.fillText(sc.name,wx+28,wy-1);
  }
  CX.font='700 16px '+FONT;CX.fillStyle='#1e1c14';
  CX.textBaseline='alphabetic';CX.textAlign='left';
  var left=shown,ty=wy+padT+20;
  for(var i=0;i<lines.length;i++){
    if(left<=0)break;
    var ln=lines[i].slice(0,left);left-=lines[i].length;
    CX.fillText(ln,wx+14,ty);ty+=lh;
  }
  if(shown>=total){
    CX.font='700 13px '+FONT;CX.textAlign='right';
    CX.fillText('▼',wx+ww-12,wy+winH-10);CX.textAlign='left';
  }
}

function loadIm(src){
  return new Promise(function(res){
    if(!src)return res(null);
    var im=new Image();im.onload=function(){res(im)};im.onerror=function(){res(null)};im.src=src;
  });
}
function pickMime(){
  var c=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1',
         'video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  for(var i=0;i<c.length;i++){
    try{if(window.MediaRecorder&&MediaRecorder.isTypeSupported(c[i]))return c[i]}catch(e){}
  }
  return '';
}

function buildTimeline(){
  var per=S.cfg.spd<=0?0:Math.max(8,130-S.cfg.spd),tl=[],prevBg=null;
  S.scenes.forEach(function(sc,i){
    var bg=effBg(i),fade=(prevBg!==null&&bg!==prevBg)?380:0;prevBg=bg;
    splitPages(sc.text,S.cfg.ppc).forEach(function(tx,pi){
      var n=tx.length;
      tl.push({i:i,bg:bg,text:tx,fade:pi===0?fade:0,fx:pi===0?sc.fx:'',v:voiceOf(sc),
               type:per*n,hold:1200+n*50});
    });
  });
  return tl;
}
function stopExport(msg){
  if(!exporting)return;
  exporting=false;clearInterval(recTimer);recTimer=null;
  try{if(recorder&&recorder.state!=='inactive')recorder.stop()}catch(e){}
  if(msg)$('#expMsg').textContent=msg;
}
$('#expStop').onclick=function(){
  if(exporting){stopExport('とちゅうまでを保存します…')}
  else{$('#expOv').classList.remove('on')}
};

$('#btnExport').onclick=function(){
  if(exporting)return;
  if(!window.MediaRecorder||!CV.captureStream){alert('この端末では動画の書き出しができません。');return}
  var mime=pickMime();
  if(!mime){alert('この端末では動画の書き出しができません。');return}
  var tl=buildTimeline();
  if(!tl.length){alert('セリフがありません。');return}

  var ov=$('#expOv'),bar=$('#expBar i'),msg=$('#expMsg');
  ov.classList.add('on');msg.textContent='したくちゅう…';bar.style.width='0%';
  $('#expStop').textContent='やめる';
  CV.style.display='block';$('#expVid').style.display='none';$('#expVid').removeAttribute('src');
  $('#expDl').style.display='none';

  var srcs={};
  S.scenes.forEach(function(sc,i){
    var b=findBg(effBg(i)),c=findCh(sc.ch);
    srcs['b'+i]=b?b.src:'';srcs['c'+i]=c?c.src:'';
  });
  var keys=Object.keys(srcs);
  var ready=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();

  ready.then(function(){
    return Promise.all(keys.map(function(k){return loadIm(srcs[k])}));
  }).then(function(ims){
    var im={};keys.forEach(function(k,n){im[k]=ims[n]});

    var stream=CV.captureStream(30);
    if(S.cfg.snd){
      var a=ac();
      if(a){ recDest=a.createMediaStreamDestination();
             recDest.stream.getAudioTracks().forEach(function(t){stream.addTrack(t)}); }
    }
    var chunks=[];
    recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4500000});
    recorder.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
    recorder.onstop=function(){
      recDest=null;
      var blob=new Blob(chunks,{type:mime});
      var ext=(mime.indexOf('mp4')>=0)?'mp4':'webm';
      var url=URL.createObjectURL(blob);
      bar.style.width='100%';
      $('#expStop').textContent='とじる';
      msg.textContent='できました（'+ext.toUpperCase()+' / '+
        (blob.size/1048576).toFixed(1)+'MB）。保存が始まらないときは、下の動画を長おしして保存してください。';
      var v=$('#expVid'); v.src=url; v.style.display='block'; CV.style.display='none';
      $('#expDl').style.display='block'; $('#expDl').href=url; $('#expDl').download='koi_scene.'+ext;
      try{ var a2=document.createElement('a');a2.href=url;a2.download='koi_scene.'+ext;
           document.body.appendChild(a2);a2.click();a2.remove(); }catch(e){}
    };

    var total=0;tl.forEach(function(s){total+=s.fade+s.type+s.hold});
    var k=0,t0=performance.now(),done=0,lastN=-1,cache=null;
    exporting=true;recorder.start(1000);

    recTimer=setInterval(function(){
      if(!exporting)return;
      var s=tl[k];
      if(!s){stopExport('まとめています…');return}
      var t=performance.now()-t0;
      var veil=0,sc=S.scenes[s.i],bi=s.i;
      if(s.fade&&t<s.fade){
        if(t<s.fade/2){veil=t/(s.fade/2);bi=Math.max(0,s.i-1)}
        else veil=1-(t-s.fade/2)/(s.fade/2);
      }
      if(cache!==s){cache=s;CX.font='700 16px '+FONT;s.lines=wrapLines(s.text,VW-20-28);lastN=-1}
      var n=(s.type<=0)?s.text.length:
            Math.max(0,Math.min(s.text.length,Math.floor((t-s.fade)/(s.type/Math.max(1,s.text.length)))));
      if(t<s.fade)n=0;
      if(n>lastN&&n>0&&S.cfg.snd){
        if(n%2===1&&' 　\n、。！？…・'.indexOf(s.text.charAt(n-1))<0)po(s.v);
        lastN=n;
      }
      var fdur=(s.fx==='shake')?550:420;
      paint(S.scenes[bi]||sc,im['b'+bi],im['c'+bi],s.lines,n,s.text.length,veil,
            s.fx,s.fx?((t-s.fade)/fdur):-1);
      msg.textContent='書き出しちゅう… '+Math.round((done+Math.min(t,s.fade+s.type+s.hold))/total*100)+'%';
      bar.style.width=Math.min(100,(done+t)/total*100)+'%';
      if(t>=s.fade+s.type+s.hold){done+=s.fade+s.type+s.hold;k++;t0=performance.now()}
    },33);
  });
};

/* ---------- 起動 ---------- */
load();cfgUI();sndUI();pitchUI();markUI();drawAll();render();
</script>
